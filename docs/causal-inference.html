 1.5; max-width: 260px; text-align: center; width: 260px;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span style=\"color:#EDE6D7 !important\" class=\"nodeLabel \"><p><b><a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a> beyond treatment effects</b> — robust ML, causal generative models, causal RL, fairness, explainability, LLMs</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"d37a0fabca0b4bf3b-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"d37a0fabca0b4bf3b-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"d37a0fabca0b4bf3b-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<hr>\n</section><section id=\"causal-inference-23-s3\" data-title=\"From Average to Heterogeneous Treatment Effects\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">From Average to Heterogeneous Treatment Effects</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 Why ATE is not enough</h3>\n<p>The ATE answers <em>&quot;on average, what is the impact of a treatment?&quot;</em> But for decisions — which\npatients get a drug, which customers get a coupon, which fulfillment centers get a new algorithm —\nwe need to know <strong>who benefits most and by how much</strong>.</p>\n<div class=\"mblk\"><math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) \\mid X = x]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p><em>The conditional average treatment effect: the expected effect for units sharing covariate value\n<math data-tex=\"x\"><mi>x</mi></math>.</em></p>\n<ul>\n<li>CATE is a <strong>function of x</strong>, not a single number.</li>\n<li>ATE is the marginal: <math data-tex=\"\\tau = \\mathbb{E}_X[\\tau(x)]\"><mrow><mi>τ</mi><mo>=</mo><msub><mi>𝔼</mi><mi>X</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>.</li>\n<li>When treatment effects are <strong>homogeneous</strong> (every unit benefits equally), <math data-tex=\"\\tau(x) = \\tau\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>τ</mi></mrow></math> for\nall <math data-tex=\"x\"><mi>x</mi></math> and CATE collapses to ATE. In most real-world settings, effects are heterogeneous.</li>\n</ul>\n<figure class=\"iv\" id=\"iv-causal-inference-23-0\" data-iv=\"{&quot;type&quot;:&quot;diagram&quot;,&quot;title&quot;:&quot;Homogeneous vs. heterogeneous effects, same ATE&quot;,&quot;concept&quot;:&quot;ATE can hide a completely different underlying reality — this is the whole reason CATE exists&quot;,&quot;control&quot;:&quot;Toggle between \\&quot;Homogeneous\\&quot; and \\&quot;Heterogeneous\\&quot; τ(x) distributions&quot;,&quot;observe&quot;:&quot;Both distributions share the same average effect (ATE ≈ the same number in both states, per the lecture's own toggle), but the homogeneous case is a narrow spike around that number while the heterogeneous case is spread wide — some units near zero or negative, others far above&quot;,&quot;insight&quot;:&quot;Two populations can report the identical ATE while one has a treatment that works uniformly and the other has a treatment that helps some people a lot, does nothing for others, and actively harms a few — a single average number cannot distinguish these, which is exactly why targeting decisions require τ(x), not τ&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows this as two side-by-side distribution plots of τ(x): a \\&quot;Homogeneous\\&quot; narrow spike and a \\&quot;Heterogeneous\\&quot; wide spread, both centered on the same ATE (≈6.0 in the lecture's example) — the reader can picture the same story from the coupon example in §1.2, where Alice/Bob/Charlie/Dana's four very different CATEs (+0%, +12%, +1%, −4%) would still average out to some single unremarkable ATE if you only looked at the population mean.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · diagram</span>\n      <span class=\"iv-title\">Homogeneous vs. heterogeneous effects, same ATE</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>ATE can hide a completely different underlying reality — this is the whole reason CATE exists</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle between \"Homogeneous\" and \"Heterogeneous\" τ(x) distributions</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Both distributions share the same average effect (ATE ≈ the same number in both states, per the lecture's own toggle), but the homogeneous case is a narrow spike around that number while the heterogeneous case is spread wide — some units near zero or negative, others far above</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Two populations can report the identical ATE while one has a treatment that works uniformly and the other has a treatment that helps some people a lot, does nothing for others, and actively harms a few — a single average number cannot distinguish these, which is exactly why targeting decisions require τ(x), not τ</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows this as two side-by-side distribution plots of τ(x): a \"Homogeneous\" narrow spike and a \"Heterogeneous\" wide spread, both centered on the same ATE (≈6.0 in the lecture's example) — the reader can picture the same story from the coupon example in <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.2\" role=\"link\" tabindex=\"0\">§1.2</a>, where Alice/Bob/Charlie/Dana's four very different CATEs (+0%, +12%, +1%, −4%) would still average out to some single unremarkable ATE if you only looked at the population mean.</p>\n    </div>\n  </figure>\n<h3>1.2 When heterogeneity matters — two worked examples</h3>\n<p><strong>Precision medicine.</strong> A population-level study finds a blood-pressure drug lowers systolic\npressure by 8 mmHg on average. But that average hides the fact that some patients benefit by 15\nmmHg while others are actively <em>harmed</em>. Only CATE can identify which patients should receive the\ndrug and which should not.</p>\n<p><strong>Marketing coupons.</strong> Consider four customers [slide 16/18, &quot;Who should receive the offer?&quot;]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Customer</th>\n<th>Buy prob.</th>\n<th>CATE <math data-tex=\"\\hat\\tau(x)\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th>Coupon?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Alice</td>\n<td>60%</td>\n<td>+0%</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Bob</td>\n<td>60%</td>\n<td><strong>+12%</strong></td>\n<td><strong>Yes</strong></td>\n</tr>\n<tr>\n<td>Charlie</td>\n<td>90%</td>\n<td>+1%</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Dana</td>\n<td>8%</td>\n<td><strong>−4%</strong></td>\n<td>No</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>Who gets the coupon?</em> Not Charlie — his high baseline means the coupon barely moves him (+1%). Not\n<strong>Dana</strong> — she isn't merely a weak candidate, she's <strong>actively harmed</strong>: her CATE is <em>negative</em>\n(−4%), meaning the coupon would <em>reduce</em> her purchase probability (perhaps a discount cheapens the\nperceived value of a product she was already inclined to buy at full price, or the offer arrives at\nthe wrong moment). <strong>Bob</strong> is the right target: same baseline purchase probability as Alice, but a\ngenuinely large positive incremental effect. This is exactly why CATE-based targeting must do more\nthan rank customers by expected benefit — it must also screen out units the treatment would actively\nharm, something an ATE-only view can never see. The ATE is meaningless here; only the per-unit CATE\ntells you both who to target and who to protect from the treatment entirely.</p>\n<h3>1.3 Policy learning with budget constraints</h3>\n<p>If treating unit <math data-tex=\"i\"><mi>i</mi></math> costs <math data-tex=\"c\"><mi>c</mi></math>, then the optimal policy assigns treatment to exactly those units\nwhere <math data-tex=\"\\tau(x_i) &gt; c\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mi>c</mi></mrow></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\pi^*(x) = \\mathbb{1}[\\tau(x) &gt; c]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>π</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>𝟙</mn><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mi>c</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p>This is the <strong>value-to-cost</strong> decision rule: rank all units by their CATE and treat the top <math data-tex=\"K\"><mi>K</mi></math>\nunits whose benefit exceeds the treatment cost.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — CATE estimation is the prerequisite for personalization.</strong> ATE tells you\nwhether a treatment works <em>on average</em>; CATE tells you <em>for whom</em> it works. The entire\nprogression from ATE → CATE → policy learning is the analytical backbone of precision medicine,\ntargeted marketing, and adaptive resource allocation — and it all requires estimating a\n<em>function</em> <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, not a single number.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s4\" data-title=\"From CATE Definition to Estimation — the Identification Bridge\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">From CATE Definition to Estimation — the Identification Bridge</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>2.1 The causal-to-statistical translation</h3>\n<p>Under the same three identification assumptions from <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §7\" role=\"link\" tabindex=\"0\">Part 2 §7</a> (SUTVA, unconfoundedness,\npositivity), the causal quantity <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can be expressed as a statistical one:</p>\n<div class=\"mblk\"><math data-tex=\"\\tau(x) = \\mathbb{E}[Y|T=1, X=x] - \\mathbb{E}[Y|T=0, X=x] = \\mu_1(x) - \\mu_0(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> the CATE for people with covariates <math data-tex=\"x\"><mi>x</mi></math> equals the difference between\nwhat treated people with covariates <math data-tex=\"x\"><mi>x</mi></math> actually earned (<math data-tex=\"\\mu_1(x)\"><mrow><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>) and what control people with\ncovariates <math data-tex=\"x\"><mi>x</mi></math> actually earned (<math data-tex=\"\\mu_0(x)\"><mrow><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>). Both quantities are <em>directly estimable from data</em>\n— we observe <math data-tex=\"Y\"><mi>Y</mi></math> for both treated and control units at each <math data-tex=\"x\"><mi>x</mi></math>, so we can fit models to predict\n<math data-tex=\"Y\"><mi>Y</mi></math> given <math data-tex=\"(T, X)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo separator=\"true\">,</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math> and then compute the difference.</p>\n<h3>2.2 Why ML is both the solution and the problem</h3>\n<p>ML models excel at estimating <math data-tex=\"\\mu_t(x) = \\mathbb{E}[Y|T=t, X=x]\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> when <math data-tex=\"X\"><mi>X</mi></math> is high-dimensional\nand the relationship is nonlinear. But <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §16\" role=\"link\" tabindex=\"0\">Part 2 §16</a> flagged the catch: <strong>ML models are optimized for\nprediction, not causal estimation</strong>, and the regularization that makes them good at prediction\nintroduces bias that doesn't vanish with more data.</p>\n<p>The rest of this lecture is a catalog of strategies for getting ML's flexibility while avoiding\nits regularization bias:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Strategy</th>\n<th>Methods</th>\n<th>How it handles bias</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Naive plug-in</strong></td>\n<td>S-Learner, T-Learner</td>\n<td>Doesn't — regularization bias propagates directly</td>\n</tr>\n<tr>\n<td><strong>Imputation + re-estimation</strong></td>\n<td>X-Learner</td>\n<td>Reduces bias via propensity-weighted blending</td>\n</tr>\n<tr>\n<td><strong>Honest partitioning</strong></td>\n<td>Causal trees/forests</td>\n<td>Data splitting prevents overfitting</td>\n</tr>\n<tr>\n<td><strong>Balanced representations</strong></td>\n<td>TarNet, CFRNet</td>\n<td>Learns a space where treated/control are indistinguishable</td>\n</tr>\n<tr>\n<td><strong>Debiasing via orthogonality</strong></td>\n<td>DML, R-Learner, DR-Learner</td>\n<td>Neyman orthogonality + cross-fitting suppress bias to second order</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n</section><section id=\"causal-inference-23-s5\" data-title=\"Meta-Learners — Flexible ML Plug-ins\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Meta-Learners — Flexible ML Plug-ins</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Meta-learners use standard supervised-learning models as building blocks to estimate CATE. They\ndiffer in <em>how many models</em> are fit and <em>how the CATE is extracted</em>.</p>\n<h3>3.1 S-Learner (Single Learner)</h3>\n<p>Train <strong>one model</strong> <math data-tex=\"\\hat{s}(X, T)\"><mrow><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>T</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> that predicts <math data-tex=\"Y\"><mi>Y</mi></math> from covariates <math data-tex=\"X\"><mi>X</mi></math> <em>and</em> treatment <math data-tex=\"T\"><mi>T</mi></math> as a\nfeature:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\hat{s}(x, T{=}1) - \\hat{s}(x, T{=}0)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Strength:</strong> simple — just one model, uses all data.</p>\n<p><strong>Weakness:</strong> regularization can suppress the treatment variable's importance. If <math data-tex=\"T\"><mi>T</mi></math> is a weak\npredictor of <math data-tex=\"Y\"><mi>Y</mi></math> relative to <math data-tex=\"X\"><mi>X</mi></math>, the model may assign <math data-tex=\"T\"><mi>T</mi></math> near-zero weight, making\n<math data-tex=\"\\hat{s}(x, 1) \\approx \\hat{s}(x, 0)\"><mrow><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for all <math data-tex=\"x\"><mi>x</mi></math> — <strong>shrinking CATE toward zero</strong> (regularization\nbias in the causal direction).</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The S-Learner's failure mode is the canonical regularization-bias problem.</strong> The model is\noptimized to minimize overall prediction error, and if the treatment effect is small relative to\nthe outcome variance, regularization may treat <math data-tex=\"T\"><mi>T</mi></math> as noise and effectively zero it out. This\nproduces a CATE estimate of approximately zero everywhere — not because the treatment has no\neffect, but because the model wasn't asked to find one.</p>\n</aside>\n<h3>3.2 T-Learner (Two Learners)</h3>\n<p>Train <strong>two separate models</strong> — one on treated units, one on controls:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\hat\\mu_1(x) - \\hat\\mu_0(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Strength:</strong> avoids S-Learner's treatment-drowning problem — each model only needs to predict\nwell within its own arm.</p>\n<p><strong>Weaknesses:</strong></p>\n<ol>\n<li><strong>No information sharing</strong> between arms — each model sees only half the data.</li>\n<li><strong>Imbalanced arms</strong> force different regularization strengths, creating differential bias that\ndoesn't cancel in the difference.</li>\n</ol>\n<h3>3.3 X-Learner (Cross-Learner)</h3>\n<p>A four-stage procedure that combines T-Learner's flexibility with propensity-based information\nsharing:</p>\n<p><strong>Stage 1:</strong> Fit T-Learner (two models: <math data-tex=\"\\hat\\mu_1\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></math>, <math data-tex=\"\\hat\\mu_0\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>).</p>\n<p><strong>Stage 2:</strong> Impute individual treatment effects:</p>\n<ul>\n<li>For treated units (<math data-tex=\"T_i=1\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></math>): <math data-tex=\"D_i^{(1)} = Y_i - \\hat\\mu_0(X_i)\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (observed outcome minus imputed\ncounterfactual)</li>\n<li>For control units (<math data-tex=\"T_i=0\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></math>): <math data-tex=\"D_i^{(0)} = \\hat\\mu_1(X_i) - Y_i\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub></mrow></math> (imputed counterfactual minus\nobserved outcome)</li>\n</ul>\n<p><strong>Stage 3:</strong> Fit second-stage models: <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from <math data-tex=\"\\{(X_i, D_i^{(1)}) : T_i=1\\}\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo separator=\"true\">,</mo><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></math> and\n<math data-tex=\"\\hat\\tau_0(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from <math data-tex=\"\\{(X_i, D_i^{(0)}) : T_i=0\\}\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo separator=\"true\">,</mo><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></math>.</p>\n<p><strong>Stage 4:</strong> Combine with propensity-weighted blending:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = e(x) \\cdot \\hat\\tau_0(x) + (1 - e(x)) \\cdot \\hat\\tau_1(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Why the propensity weighting works:</strong> look at the formula again — the weight on <math data-tex=\"\\hat\\tau_0(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>\nis <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> itself, and the weight on <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <math data-tex=\"1-e(x)\"><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. So when <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <strong>low</strong> (treated\nunits are scarce at <math data-tex=\"x\"><mi>x</mi></math>), the estimate leans <em>toward</em> <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, not <math data-tex=\"\\hat\\tau_0(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. This is\ncorrect, and the reason is subtler than &quot;more raw data points&quot;: <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is fit on the\npseudo-outcomes <math data-tex=\"D_i^{(1)} = Y_i - \\hat\\mu_0(X_i)\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for treated units — and <math data-tex=\"\\hat\\mu_0\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>, the <em>control</em>\noutcome model, is well-estimated <em>precisely because</em> controls are abundant when <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is low. So\neven though <math data-tex=\"\\hat\\tau_1\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></math> is fit on relatively few (treated) points, each of those points' target\nvalue is a high-quality imputation, built from a reliably-estimated counterfactual. Symmetrically,\nwhen <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <strong>high</strong> (controls are scarce), <math data-tex=\"\\hat\\mu_1\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></math> is the reliably-estimated model, so\n<math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>'s pseudo-outcomes <math data-tex=\"D_i^{(0)}=\\hat\\mu_1(X_i)-Y_i\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub></mrow></math> are high quality, and the weight\n<math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> on <math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math> is correspondingly large. <strong>The propensity score weights toward whichever\n<math data-tex=\"\\hat\\tau\"><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math>'s pseudo-outcome construction leaned on the better-estimated nuisance model</strong> — not\ntoward &quot;the arm with more rows.&quot;</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — X-Learner recycles all the data.</strong> T-Learner effectively discards cross-arm\ninformation (the treated model never sees control outcomes and vice versa). X-Learner's\nimputation step feeds <em>all</em> units' information into both second-stage models, with the propensity\nscore acting as a reliability weight — it's a principled way to share information across arms\nwithout requiring a single model to handle both simultaneously (which is what causes the\nS-Learner's drowning problem).</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s6\" data-title=\"Causal Trees and Forests\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Causal Trees and Forests</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>4.1 Causal trees — honest estimation</h3>\n<blockquote class=\"aside-quote\">\n<p>Causal trees and the honest-estimation idea originate with <strong>Athey &amp; Imbens (2016), &quot;Recursive\nPartitioning for Heterogeneous Causal Effects&quot;</strong> — confirmed directly on the slide footer for this\nsection.</p>\n</blockquote>\n<p>A <strong>causal tree</strong> partitions the covariate space so that each leaf contains a subset of units\nwhere the treatment effect is approximately homogeneous. Unlike a standard decision tree (which\npredicts <math data-tex=\"Y\"><mi>Y</mi></math>), each leaf directly estimates <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau_{\\text{leaf}} = \\bar{Y}_{1,\\text{leaf}} - \\bar{Y}_{0,\\text{leaf}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mtext>leaf</mtext></msub><mo>=</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mtext>leaf</mtext></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mtext>leaf</mtext></mrow></msub></mrow></math></div>\n<p>The average treated outcome minus the average control outcome within that leaf.</p>\n<p><strong>Splitting criterion:</strong> maximize heterogeneity in treatment effects between child nodes, subject\nto a balance constraint (neither child should be dramatically smaller than the other).</p>\n<p>🧪 <strong>Worked example — which split would a causal tree favor?</strong> Estimating the effect of a discount\ncoupon (treatment) on customer spend (outcome). Parent node: <math data-tex=\"\\hat\\tau=5\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>5</mn><mi>%</mi></mrow></math>. Two candidate splits:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Split</th>\n<th>Left leaf</th>\n<th>Right leaf</th>\n<th>Spread</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>A — on &quot;weeks since last purchase&quot;</strong> (&lt; 4 wks vs. ≥ 4 wks)</td>\n<td><math data-tex=\"\\hat\\tau=1\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>1</mn><mi>%</mi></mrow></math></td>\n<td><math data-tex=\"\\hat\\tau=12\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>12</mn><mi>%</mi></mrow></math></td>\n<td><strong>11 points</strong></td>\n</tr>\n<tr>\n<td><strong>B — on &quot;device&quot;</strong> (mobile vs. web)</td>\n<td><math data-tex=\"\\hat\\tau=4.8\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>4.8</mn><mi>%</mi></mrow></math></td>\n<td><math data-tex=\"\\hat\\tau=5.2\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>5.2</mn><mi>%</mi></mrow></math></td>\n<td>0.4 points</td>\n</tr>\n</tbody>\n</table></div>\n<p>The causal tree favors <strong>Split A</strong>. Split B's two children are both close to the parent's 5% — device\nbarely moderates the coupon's effect, so splitting on it buys almost no new information. Split A's\nchildren diverge sharply from each other (1% vs. 12%) — recency of last purchase is a real driver of\n<em>how much</em> the coupon effect varies, which is exactly what the splitting criterion is built to find.\nA standard decision tree, by contrast, would split on whatever best predicts <math data-tex=\"Y\"><mi>Y</mi></math> directly — it has\nno reason to prefer A over B unless recency also happens to predict raw spend, which is a different\nquestion entirely from predicting the coupon's <em>effect</em>.</p>\n<p><strong>Honest estimation</strong> — the key innovation:</p>\n<ul>\n<li>Split the data into two halves: one for <strong>structure</strong> (deciding where to split), one for\n<strong>estimation</strong> (computing leaf-level treatment effects).</li>\n<li>The structure sample never estimates treatment effects; the estimation sample never influences\nsplits.</li>\n</ul>\n<p><strong>Why honesty matters:</strong> using the same data for both splitting and estimation creates overfitting\nbias — the tree will find splits that look good on the data used to estimate them, just as a\nstandard decision tree overfits to its training data. Honest estimation breaks this cycle,\nproducing <strong>unbiased treatment effect estimates</strong> and enabling valid confidence intervals.</p>\n<h3>4.2 Causal forests — reducing variance</h3>\n<p>A single causal tree has high variance (different splits of the data produce very different trees).\n<strong>Causal forests</strong> solve this by:</p>\n<ol>\n<li>Growing many trees on random subsamples (bagging).</li>\n<li>Using random feature subsets at each split (decorrelation, like random forests).</li>\n<li>Averaging treatment effect estimates across all trees for each data point.</li>\n</ol>\n<p>The result: low-bias (from honesty), low-variance (from ensembling), interpretable (tree\nstructure) treatment effect estimates with valid confidence intervals.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Not every causal forest is Neyman orthogonal.</strong> Orthogonality (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>) holds for the\n<strong>local-centering (residual-on-residual) causal forest of Athey, Tibshirani &amp; Wager (2019)</strong>,\nwhich folds a DML-style residualization step into each split — it does <strong>not</strong> hold for the\noriginal Wager &amp; Athey (2018) formulation. If you need the orthogonality guarantee specifically\n(robustness to small nuisance-model errors, per <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>), make sure you're using the 2019\nlocal-centering variant, not just &quot;a causal forest.&quot;</p>\n</aside>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — why causal forests are well-regarded.</strong> Causal forests combine three\ndesirable properties that no other method in this lecture offers simultaneously:</p>\n<ol>\n<li><strong>Unbiasedness</strong> via honest estimation (unlike meta-learners).</li>\n<li><strong>Valid confidence intervals</strong> (unlike neural-net methods).</li>\n<li><strong>Interpretability</strong> — the tree structure shows <em>which features drive effect heterogeneity</em>\n(unlike black-box representation learners).</li>\n</ol>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s7\" data-title=\"Deep Representation Learning for Causal Inference\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Deep Representation Learning for Causal Inference</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">9 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>5.1 The representation-learning idea</h3>\n<p>When <math data-tex=\"X\"><mi>X</mi></math> is high-dimensional (images, text, graphs, or tabular data with hundreds of features),\nestimating <math data-tex=\"\\mu_1(x)\"><mrow><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"\\mu_0(x)\"><mrow><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> directly is hard — the treated and control distributions in\nthe original covariate space may barely overlap (<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §10\" role=\"link\" tabindex=\"0\">Part 2 §10</a>'s curse of dimensionality).</p>\n<p><strong>Representation learning</strong> addresses this by learning a mapping <math data-tex=\"\\phi: \\mathcal{X} \\to \\mathcal{Z}\"><mrow><mi>ϕ</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi class=\"mathcal\">𝒳</mi><mo>→</mo><mi class=\"mathcal\">𝒵</mi></mrow></math>\nthat projects the original covariates into a lower-dimensional space <math data-tex=\"\\mathcal{Z}\"><mi class=\"mathcal\">𝒵</mi></math> where:</p>\n<ol>\n<li>Treated and control units are <strong>hard to distinguish</strong> (balanced distributions — this removes\nconfounding bias).</li>\n<li>The representation is <strong>rich enough</strong> to predict outcomes well (this preserves statistical\nefficiency).</li>\n</ol>\n<p>Once <math data-tex=\"\\phi(x)\"><mrow><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is learned, the CATE is extracted via a simple meta-learner head:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\hat{h}_1(\\phi(x)) - \\hat{h}_0(\\phi(x))\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mover><mi>h</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mover><mi>h</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<h3>5.2 TarNet (Treatment-Agnostic Representation Network)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>TarNet</strong> — Shalit, Johansson &amp; Sontag (2017), building on the balanced-representation framing\nof Johansson, Shalit &amp; Sontag (2016). A neural network that learns a balanced representation and\nestimates per-arm outcome models simultaneously.</p>\n<p>⚠️ TarNet and CFRNet (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>) are introduced in the <strong>same paper</strong> by the same author team — not two\nindependent works. The slide's own footer cites both as &quot;Johansson, Shalit &amp; Sontag (2016) ·\nShalit et al. (2017), ICML.&quot;</p>\n</blockquote>\n<p><strong>Architecture:</strong></p>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"620\" style=\"max-width:100%;height:auto\" id=\"df363a1137fae53ed\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 619.953125 125\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#df363a1137fae53ed{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#df363a1137fae53ed .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#df363a1137fae53ed .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#df363a1137fae53ed .error-icon{fill:#16140F;}#df363a1137fae53ed .error-text{fill:#B4AA95;stroke:#B4AA95;}#df363a1137fae53ed .edge-thickness-normal{stroke-width:1px;}#df363a1137fae53ed .edge-thickness-thick{stroke-width:3.5px;}#df363a1137fae53ed .edge-pattern-solid{stroke-dasharray:0;}#df363a1137fae53ed .edge-thickness-invisible{stroke-width:0;fill:none;}#df363a1137fae53ed .edge-pattern-dashed{stroke-dasharray:3;}#df363a1137fae53ed .edge-pattern-dotted{stroke-dasharray:2;}#df363a1137fae53ed .marker{fill:#7C7361;stroke:#7C7361;}#df363a1137fae53ed .marker.cross{stroke:#7C7361;}#df363a1137fae53ed s "47.671875\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-3.8359375, -9.75)\"><rect></rect><foreignObject width=\"7.671875\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>X</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df363a1137fae53ed-flowchart-PHI-1\" data-look=\"classic\" transform=\"translate(156.390625, 62.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-70.71875\" y=\"-19.75\" width=\"141.4375\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-50.71875, -9.75)\"><rect></rect><foreignObject width=\"101.4375\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>shared encoder φ</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df363a1137fae53ed-flowchart-Z-2\" data-look=\"classic\" transform=\"translate(299.5078125, 62.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-42.3984375\" y=\"-19.75\" width=\"84.796875\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-22.3984375, -9.75)\"><rect></rect><foreignObject width=\"44.796875\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>z = φ(x)</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df363a1137fae53ed-flowchart-H1-4\" data-look=\"classic\" transform=\"translate(443.890625, 27.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-71.984375\" y=\"-19.75\" width=\"143.96875\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-51.984375, -9.75)\"><rect></rect><foreignObject width=\"103.96875\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>treatment head h₁</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df363a1137fae53ed-flowchart-M1-5\" data-look=\"classic\" transform=\"translate(578.9140625, 27.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-32.9453125\" y=\"-19.75\" width=\"65.890625\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-12.9453125, -9.75)\"><rect></rect><foreignObject width=\"25.890625\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>μ̂₁(x)</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df363a1137fae53ed-flowchart-H0-7\" data-look=\"classic\" transform=\"translate(443.890625, 97.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-64.171875\" y=\"-19.75\" width=\"128.34375\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-44.171875, -9.75)\"><rect></rect><foreignObject width=\"88.34375\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>control head h₀</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df363a1137fae53ed-flowchart-M0-8\" data-look=\"classic\" transform=\"translate(578.9140625, 97.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-33.0390625\" y=\"-19.75\" width=\"66.078125\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-13.0390625, -9.75)\"><rect></rect><foreignObject width=\"26.078125\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>μ̂₀(x)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"df363a1137fae53ed-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"df363a1137fae53ed-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"df363a1137fae53ed-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<ul>\n<li><strong>Shared trunk (encoder):</strong> MLP layers that produce a latent representation <math data-tex=\"z = \\phi(x)\"><mrow><mi>z</mi><mo>=</mo><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>\ncommon to both treatment arms.</li>\n<li><strong>Separate heads:</strong> each arm gets its own MLP head that predicts <math data-tex=\"Y\"><mi>Y</mi></math> from <math data-tex=\"z\"><mi>z</mi></math>.</li>\n<li><strong>Loss:</strong> factual MSE only — the model never sees counterfactual outcomes.</li>\n</ul>\n<p><strong>Why the shared representation learns balance:</strong> both heads must predict well using the <em>same</em>\nlatent code <math data-tex=\"z\"><mi>z</mi></math>. If <math data-tex=\"z\"><mi>z</mi></math> retains information that distinguishes treated from control units (i.e.,\ninformation about confounders), then each head would need to compensate for the different\ndistributions — wasting capacity. The most efficient <math data-tex=\"z\"><mi>z</mi></math> for joint prediction is one where the\ntreated and control distributions <em>overlap</em> as much as possible, because then neither head needs\nto extrapolate far from its training data.</p>\n<p><strong>Limitation:</strong> the balance is <em>implicit</em> — it emerges as a side effect of optimizing the factual\nMSE, not as an explicit objective. If the factual MSE can be minimized well enough without\nachieving balance, the model may not bother.</p>\n<h3>5.3 CFRNet (Counterfactual Regression Network)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>CFRNet</strong> — Shalit, Johansson &amp; Sontag (2017) — the same paper that introduces TarNet (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>).\nExtends TarNet with an explicit distributional balance penalty.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\mathcal{L}_{\\text{CFR}} = \\underbrace{\\text{Factual MSE}}_{\\text{prediction}} + \\underbrace{\\lambda \\cdot \\text{IPM}(\\hat{\\mu}_1, \\hat{\\mu}_0)}_{\\text{balance penalty}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi class=\"mathcal\">ℒ</mi><mtext>CFR</mtext></msub><mo>=</mo><mrow><munder><munder><mtext>Factual MSE</mtext><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>prediction</mtext></munder></mrow><mo>+</mo><mrow><munder><munder><mrow><mi>λ</mi><mo>⋅</mo><mtext>IPM</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>balance penalty</mtext></munder></mrow></mrow></math></div>\n<p>The <strong>Integral Probability Metric (IPM)</strong> measures the distance between the representation\ndistributions of treated and control units:</p>\n<div class=\"mblk\"><math data-tex=\"\\text{IPM}(\\hat{\\mu}_1, \\hat{\\mu}_0) = \\sup_{f \\in \\mathcal{F}} \\left| \\mathbb{E}_{z \\sim \\hat{\\mu}_1}[f(z)] - \\mathbb{E}_{z \\sim \\hat{\\mu}_0}[f(z)] \\right|\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>IPM</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><munder><mi>sup</mi><mrow><mi>f</mi><mo>∈</mo><mi class=\"mathcal\">ℱ</mi></mrow></munder><mo>⁡</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">|</mo><msub><mi>𝔼</mi><mrow><mi>z</mi><mo>∼</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></mrow></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><msub><mi>𝔼</mi><mrow><mi>z</mi><mo>∼</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></mrow></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">|</mo></mrow></mrow></math></div>\n<p><strong>Two common IPM choices:</strong></p>\n<ul>\n<li><strong>MMD (Maximum Mean Discrepancy):</strong> projects both distributions into a kernel space and computes\nthe difference in means. If MMD = 0, the distributions are identical.</li>\n<li><strong>Wasserstein distance:</strong> the minimum &quot;transport cost&quot; to convert one distribution into the other\n(inspired by optimal transport / earth-mover's distance, also used in GANs).</li>\n</ul>\n<p><strong>Double robustness of CFRNet:</strong> the authors proved that the counterfactual prediction error is\nbounded by:</p>\n<div class=\"mblk\"><math data-tex=\"\\text{Error}_{\\text{counterfactual}} \\leq \\text{Error}_{\\text{factual}} + \\text{IPM}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mtext>Error</mtext><mtext>counterfactual</mtext></msub><mo>≤</mo><msub><mtext>Error</mtext><mtext>factual</mtext></msub><mo>+</mo><mtext>IPM</mtext></mrow></math></div>\n<p>If the factual prediction error is small AND the distributions are balanced (IPM ≈ 0), the\ncounterfactual error is also small — because the model is interpolating rather than extrapolating.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — TarNet vs. CFRNet is implicit vs. explicit balance.</strong> TarNet hopes the shared\nrepresentation will be balanced as a <em>side effect</em> of joint prediction. CFRNet <em>demands</em> balance\nvia an explicit penalty. In practice, the penalty gives more control over the bias-variance\ntrade-off: increasing <math data-tex=\"\\lambda\"><mi>λ</mi></math> improves balance (reducing bias) but may worsen prediction\n(increasing variance), while decreasing <math data-tex=\"\\lambda\"><mi>λ</mi></math> does the opposite.</p>\n</aside>\n<h3>5.4 DragonNet — Adding a Propensity Head</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>DragonNet</strong> — a third member of the TarNet/CFRNet family: deep semiparametric learning that\nadds a <strong>propensity head</strong> <math data-tex=\"\\hat e(x)\"><mrow><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> alongside the shared representation and the two outcome\nheads <math data-tex=\"\\hat\\mu_0(x), \\hat\\mu_1(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</p>\n</blockquote>\n<p><em>&quot;TARNet + propensity head + targeted regularization.&quot;</em></p>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"620\" style=\"max-width:100%;height:auto\" id=\"dee53fb425842a954\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 619.953125 194.5\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#dee53fb425842a954{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#dee53fb425842a954 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#dee53fb425842a954 .edge-animation-fast{stroke-dasharray:9,5!important;s
