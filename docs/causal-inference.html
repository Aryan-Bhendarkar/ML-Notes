ortant;stroke:#4FA073 !important\"></path></g><g class=\"label\" style=\"color:#EDE6D7 !important\" transform=\"translate(-130, -29.25)\"><rect></rect><foreignObject width=\"260\" height=\"58.5\"><div style=\"color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span style=\"color:#EDE6D7 !important\" class=\"nodeLabel \"><p>all methods target the same DAG edge T → Y — they differ only in <i>how</i> they block the confounders X → T, X → Y</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"d48cf444540759c8f-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"d48cf444540759c8f-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"d48cf444540759c8f-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li>\n<p><strong>Every method is a different mechanism for blocking the backdoor path</strong> — whether through\nweighting (propensity methods), conditioning (stratification, meta-learners), residualizing\n(DML), or representation learning (TarNet/CFRNet). The goal never changes; only the mechanism\ndoes.</p>\n</li>\n<li>\n<p><strong>The progression from meta-learners to DML is the progression from &quot;ML models are flexible&quot;\nto &quot;ML models' biases are controllable.&quot;</strong> S/T/X-Learners use ML freely but accept\nregularization bias. Causal forests bound the bias via honest estimation. DML suppresses it to\nsecond order via orthogonality. The theoretical sophistication increases monotonically.</p>\n</li>\n<li>\n<p><strong>Causal inference extends far beyond treatment effect estimation.</strong> The lecture's final\nsurvey (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>) makes clear that the same DAG-based reasoning, the same backdoor/frontdoor logic,\nand the same doubly-robust estimators appear in fairness, RL, generative modeling, and LLM\nevaluation — causal thinking is not a subfield of statistics but a <em>mode of reasoning</em> that\nimproves any domain where actions change outcomes.</p>\n</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-23-s16\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">13 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is CATE and why can't you just use ATE for targeting decisions?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>CATE, <math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) | X = x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>|</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, is the expected treatment effect for units\nwith covariates <math data-tex=\"x\"><mi>x</mi></math>. ATE averages over the whole population and tells you whether a treatment\nworks &quot;on average,&quot; but real decisions require knowing <em>who</em> benefits (and who is harmed). In the\ncoupon example from <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.2\" role=\"link\" tabindex=\"0\">§1.2</a>, CATE identifies Bob (+12%) as the optimal target, Charlie (+1%) as not\nworth targeting, and — critically — Dana (−4%) as someone the coupon would actively <em>harm</em>, a\ndistinction an ATE-only view could never surface. Targeting based on ATE alone would waste resources\non units where the effect is negligible, or worse, push the offer onto units it damages.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the regularization bias problem in the S-Learner and how the X-Learner addresses it.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The S-Learner trains one model on <math data-tex=\"(X, T) \\to Y\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>T</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>→</mo><mi>Y</mi></mrow></math>. When the treatment effect is small relative to\noutcome variance, regularization may assign <math data-tex=\"T\"><mi>T</mi></math> near-zero weight, making $\\hat{s}(x, 1) \\approx\n\\hat{s}(x, 0)$ and shrinking CATE toward zero — a systematic bias that doesn't vanish with more\ndata. The X-Learner avoids this by: (1) training separate models per arm (T-Learner step, avoiding\ntreatment drowning), (2) imputing individual treatment effects for all units, and (3) combining\nsecond-stage estimates via propensity-weighted blending that automatically leans on the more\ndata-rich arm.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is honest estimation in causal trees and why does it matter?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Honest estimation splits the data: one half decides <em>where</em> to split the tree (structure), the\nother half estimates <em>what</em> the treatment effect is in each leaf (estimation). This prevents the\noverfitting that occurs when the same data both selects splits and evaluates them — the tree would\nfind splits that look good on its own training data, producing biased leaf-level estimates. With\nhonest estimation, the leaf estimates are unbiased, and valid confidence intervals can be\nconstructed.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain TarNet's implicit balance mechanism — why does sharing a representation between treatment heads help?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>TarNet's shared encoder produces a latent code <math data-tex=\"z\"><mi>z</mi></math> used by both the treatment and control heads.\nIf <math data-tex=\"z\"><mi>z</mi></math> retains information that distinguishes treated from control units (confounders), each head\nmust accommodate different distributions, wasting capacity. The most efficient shared code is one\nwhere treated and control distributions overlap maximally — so the model learns balance as a\n<em>side effect</em> of optimizing factual prediction accuracy. CFRNet makes this explicit via an IPM\npenalty, giving direct control over the bias-variance trade-off.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">State the three key ideas of DML and the specific failure mode each addresses.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<ol>\n<li>\n<p><strong>Partialing out (Robinson decomposition):</strong> removes confounders by regressing both <math data-tex=\"Y\"><mi>Y</mi></math> and <math data-tex=\"T\"><mi>T</mi></math>\non <math data-tex=\"X\"><mi>X</mi></math>, then estimating the treatment effect on the residuals — addresses the confounding\nproblem (<math data-tex=\"X \\to T\"><mrow><mi>X</mi><mo>→</mo><mi>T</mi></mrow></math>, <math data-tex=\"X \\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>Y</mi></mrow></math> edges).</p>\n</li>\n<li>\n<p><strong>Neyman orthogonality:</strong> designs the moment condition so first-order nuisance estimation errors\ncancel, reducing bias from <math data-tex=\"O(\\delta)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>δ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> to <math data-tex=\"O(\\delta^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>δ</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — addresses regularization bias from\nML-estimated nuisance functions.</p>\n</li>\n<li>\n<p><strong>Cross-fitting:</strong> trains nuisance models out-of-fold to prevent overfitting when the same data\nis used for both nuisance estimation and treatment effect estimation — addresses the\noverfitting-induced correlation between nuisance errors and outcomes.</p>\n</li>\n</ol>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive the Robinson decomposition from the partially linear model. Why does g(x) disappear?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Starting from <math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math>, take conditional expectations: $\\mathbb{E}[Y|X]\n= \\tau_0 \\cdot \\mathbb{E}[T|X] + g(X)<math data-tex=\", so\"><mrow><mo separator=\"true\">,</mo><mi>s</mi><mi>o</mi></mrow></math>m(X) = \\tau_0 \\cdot e(X) + g(X)$. Subtracting:\n<math data-tex=\"Y - m(X) = \\tau_0(T - e(X)) + \\epsilon\"><mrow><mi>Y</mi><mo>−</mo><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math>, which is <math data-tex=\"\\tilde{Y} = \\tau_0 \\tilde{T} + \\epsilon\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>+</mo><mi>ϵ</mi></mrow></math>.\nThe function <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> disappears because it enters both the original equation and the conditional\nexpectation equally, canceling in the subtraction. This is why residualization eliminates\nconfounding: whatever <math data-tex=\"X\"><mi>X</mi></math> predicts about <math data-tex=\"Y\"><mi>Y</mi></math> (beyond its effect through <math data-tex=\"T\"><mi>T</mi></math>) is subtracted out.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does increasing the sample size NOT fix regularization bias in naive ML-based causal estimation?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Regularization bias is <em>systematic</em>, not random — it comes from the model's optimization objective\n(penalizing complexity) biasing the nuisance function estimates in a consistent direction. More\ndata reduces <em>variance</em> (the estimates become more precise) but the <em>systematic offset</em> remains,\nbecause the regularization term's influence doesn't diminish. The sampling distribution of <math data-tex=\"\\hat\\tau\"><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math>\nbecomes tighter but stays centered away from the true value — exactly the phenomenon the DML\nframework's orthogonality condition (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>) was designed to suppress.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the R-Learner's objective function and why <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> appears as an implicit weight.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The R-Learner minimizes <math data-tex=\"\\sum_i (\\tilde{Y}_i - \\tau(X_i) \\cdot \\tilde{T}_i)^2\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo>−</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow></math>. This is\nregression of <math data-tex=\"\\tilde{Y}\"><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover></math> on <math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math>, where <math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math> is the treatment residual (confounders\nremoved). The <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> weighting emerges because the loss is quadratic in <math data-tex=\"\\tilde{T}_i\"><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub></math>:\nunits with large treatment residuals (near-random treatment assignment) contribute more to the\nobjective, naturally upweighting the most informative observations. Units where treatment was\nalmost deterministic (<math data-tex=\"\\tilde{T} \\approx 0\"><mrow><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>≈</mo><mn>0</mn></mrow></math>) contribute almost nothing — they can't help\ndistinguish one <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from another because the treatment residual provides no leverage.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">How does the DR-Learner combine double robustness with orthogonality?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The DR-Learner's Stage 2 computes AIPW pseudo-outcomes, which inherit double robustness from\n<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §14\" role=\"link\" tabindex=\"0\">Part 2 §14</a>: they are consistent if either <math data-tex=\"\\hat\\mu_t\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi></msub></math> or <math data-tex=\"\\hat e\"><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math> is correctly specified.\nStage 3 regresses these pseudo-outcomes on <math data-tex=\"X\"><mi>X</mi></math>, and the full pipeline is designed to satisfy\nNeyman orthogonality — so nuisance errors propagate at second order. The result is an estimator\nthat is simultaneously robust to one nuisance model being wrong (double robustness) AND robust to\nboth models having small regularization biases (orthogonality), while estimating <em>heterogeneous</em>\neffects (meta-learner structure).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A colleague says \"just use a neural network to predict Y from (X, T) and take the difference at T=1 vs T=0.\" Name three problems with this approach and map each to a specific method from this lecture that addresses it.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<ol>\n<li>\n<p><strong>Regularization bias</strong> — the neural net may suppress <math data-tex=\"T\"><mi>T</mi></math>'s importance, shrinking the estimated\neffect toward zero → addressed by <strong>T-Learner</strong> (separate models per arm prevent drowning) or\n<strong>DML</strong> (orthogonality suppresses bias to second order).</p>\n</li>\n<li>\n<p><strong>No covariate balance</strong> — the model learns in a space where treated/control distributions may\nnot overlap, causing poor generalization to counterfactuals → addressed by <strong>TarNet/CFRNet</strong>\n(learns a balanced representation explicitly).</p>\n</li>\n<li>\n<p><strong>No valid uncertainty quantification</strong> — a standard neural net's predictions have no confidence\nintervals for the <em>causal effect</em> → addressed by <strong>causal forests</strong> (honest estimation enables\nvalid CIs) or <strong>DML</strong> (asymptotic normality of the orthogonal estimator enables CIs).</p>\n</li>\n</ol>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li>\n<p><em>&quot;CFRNet's bound says counterfactual error ≤ factual error + IPM. What happens when you increase\nλ (the balance penalty) too much?&quot;</em> — increasing λ forces the representations to be more\nbalanced (lower IPM), reducing bias, but at the cost of prediction quality (higher factual\nerror) because the encoder is forced to sacrifice discriminative information to satisfy the\nbalance constraint. There's an optimal λ that minimizes the total bound; too much balance\nproduces representations that are balanced but useless for prediction, while too little balance\nproduces good predictions on the factual data that don't generalize to counterfactuals.</p>\n</li>\n<li>\n<p><em>&quot;Why is cross-fitting necessary even when Neyman orthogonality already suppresses first-order\nerrors?&quot;</em> — orthogonality suppresses the <em>systematic</em> bias from nuisance estimation errors, but\nwhen the same data trains both the nuisance models and estimates τ, the <em>residual</em> overfitting\ncreates a correlation between the fitted nuisance values and the outcomes that orthogonality\ndoesn't address (it's a finite-sample phenomenon, not an asymptotic one). Cross-fitting\neliminates this correlation by construction.</p>\n</li>\n<li>\n<p><em>&quot;The lecture says causal thinking applies beyond treatment effects — give a concrete example of\nhow doubly robust estimation solves an RL problem.&quot;</em> — off-policy evaluation: given trajectories\ncollected under old policy π₀, estimate the value of a new policy π₁. The &quot;treatment&quot; is the\nnew policy's action, the &quot;outcome&quot; is the reward, and confounding arises because the old policy's\nactions are correlated with states. A doubly robust estimator combines a model of the new\npolicy's expected reward (outcome model) with importance sampling weights (propensity model) —\nconsistent if either model is correct, exactly as in the ATE setting.</p>\n</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li>\n<p><strong>Robinson decomposition</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>: start from <math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math>, take\nconditional expectations, subtract, derive <math data-tex=\"\\tilde{Y} = \\tau_0 \\tilde{T} + \\epsilon\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>+</mo><mi>ϵ</mi></mrow></math>, and\nexplain why <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> vanishes.</p>\n</li>\n<li>\n<p><strong>The R-Learner objective as generalized OLS</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>: write the R-Learner loss\n<math data-tex=\"\\sum_i (\\tilde{Y}_i - \\tau(X_i) \\tilde{T}_i)^2\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo>−</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow></math>, take the derivative with respect to\n<math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, and show that the solution at each <math data-tex=\"x\"><mi>x</mi></math> is a weighted least-squares estimate with\nweights <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math>.</p>\n</li>\n<li>\n<p><strong>IPM intuition for CFRNet</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>: define IPM as the supremum over a function class of the\ndifference in expectations, explain why MMD projects into a kernel space and computes mean\ndifference, and state the double-robustness bound Error ≤ factual error + IPM.</p>\n</li>\n</ol>\n<h3>Applied scenario — Amazon promotional targeting</h3>\n<p><strong>Framing:</strong> Amazon wants to estimate the causal effect of a discount coupon on purchase conversion\nfor each customer segment, then target only those segments where the effect exceeds the coupon's\ncost.</p>\n<p><strong>Data:</strong> Observational — customer features (purchase history, browsing behavior, device type,\naccount age), treatment (coupon offered/not offered), outcome (purchased within 7 days).</p>\n<p><strong>Model:</strong> This maps directly onto the lecture's framework. The naive comparison (coupon recipients\nvs. non-recipients) suffers from selection bias (<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §5\" role=\"link\" tabindex=\"0\">Part 2 §5</a>) — customers who receive coupons may\nsystematically differ from those who don't. Apply the full pipeline:</p>\n<ol>\n<li>Estimate propensity <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and outcome models <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> with flexible ML.</li>\n<li>Use <strong>DR-Learner</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>) for double robustness + orthogonality + heterogeneous effect\nestimation.</li>\n<li>Target only customers where <math data-tex=\"\\hat\\tau(x) &gt; \\text{coupon cost}\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mtext>coupon cost</mtext></mrow></math> (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.3\" role=\"link\" tabindex=\"0\">§1.3</a>'s policy learning rule).</li>\n</ol>\n<p><strong>Metric:</strong> The ATT (effect on customers who actually received the coupon) if the question is\n&quot;was the coupon worth it for those who got it?&quot; or CATE if the question is &quot;which segments should\nwe target in the next campaign?&quot;</p>\n<p><strong>Failure modes:</strong> Unmeasured confounders (e.g., a customer's underlying purchase intent, which\nmakes them both likely to receive a coupon <em>and</em> likely to buy) — address via sensitivity\nanalysis. Distribution shift between training and deployment periods — monitor for this using the\ninvariant-feature ideas from <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§12.1\" role=\"link\" tabindex=\"0\">§12.1</a>.</p>\n<p><strong>What you'd ship:</strong> A DR-Learner estimate with explicit propensity overlap diagnostics (<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2\n§7.1\" role=\"link\" tabindex=\"0\">Part 2\n§7.1</a>), confidence intervals (from DML's asymptotic normality), and a targeting policy that assigns\ncoupons only where <math data-tex=\"\\hat\\tau(x) &gt; c\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mi>c</mi></mrow></math> with sufficient statistical confidence.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Customer Obsession</strong> — targeting coupons to customers who\nactually benefit (high CATE) rather than sending them to everyone improves the customer experience\n(relevant coupons, not spam). <strong>Dive Deep</strong> — correctly distinguishing confounders (past purchase\nfrequency) from mediators (post-coupon browsing behavior) before deciding what to adjust for\nrequires the causal-graph reasoning from <a class=\"xref\" data-xref-lec=\"causal-inference-01\" data-xref=\"Part 1 §5\" role=\"link\" tabindex=\"0\">Part 1 §5</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>.</p>\n<hr>\n</section><section id=\"causal-inference-23-s17\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>AIPW (Augmented Inverse Probability Weighting)</strong> — doubly robust estimator combining outcome\nregression with IPW correction; foundation for DR-Learner.</li>\n<li><strong>CATE (Conditional Average Treatment Effect)</strong> — <math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) | X = x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>|</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>,\nthe heterogeneous, covariate-dependent treatment effect.</li>\n<li><strong>Causal forest</strong> — ensemble of honest causal trees with random subsampling and feature\nsubsetting; provides unbiased CATE estimates with valid confidence intervals.</li>\n<li><strong>Causal tree</strong> — decision tree that estimates treatment effects in each leaf via honest\nestimation (separate data for structure vs. estimation).</li>\n<li><strong>CFRNet (Counterfactual Regression Network)</strong> — TarNet extended with an explicit IPM balance\npenalty for distributional alignment.</li>\n<li><strong>Cross-fitting</strong> — training nuisance models on data folds held out from the moment-condition\ncomputation to decorrelate estimation errors from outcomes.</li>\n<li><strong>DragonNet</strong> — TarNet/CFRNet extended with a propensity head and targeted regularization; deep\nsemiparametric learning aimed directly at the final CATE estimate.</li>\n<li><strong>DML (Double/Debiased Machine Learning)</strong> — framework combining partialing out, Neyman\northogonality, and cross-fitting for unbiased treatment effect estimation with ML nuisance\nfunctions.</li>\n<li><strong>Double robustness</strong> — property of AIPW/DR-Learner: consistent if either nuisance model\n(propensity or outcome) is correctly specified.</li>\n<li><strong>Factual MSE</strong> — loss computed only on observed outcomes; the standard training objective for\ncausal models.</li>\n<li><strong>Honest estimation</strong> — splitting data into separate samples for tree structure and leaf-level\nestimation to prevent overfitting bias.</li>\n<li><strong>IPM (Integral Probability Metric)</strong> — family of distribution distance measures including MMD\nand Wasserstein; used in CFRNet's balance penalty.</li>\n<li><strong>MMD (Maximum Mean Discrepancy)</strong> — kernel-based IPM that projects distributions into a\nreproducing kernel Hilbert space and computes mean difference.</li>\n<li><strong>Neyman orthogonality</strong> — property of a moment condition where first-order nuisance estimation\nerrors cancel, reducing bias from O(δ) to O(δ²).</li>\n<li><strong>Partialing out</strong> — Robinson decomposition: regressing both <math data-tex=\"Y\"><mi>Y</mi></math> and <math data-tex=\"T\"><mi>T</mi></math> on <math data-tex=\"X\"><mi>X</mi></math> to produce\nresiduals free of confounding influence.</li>\n<li><strong>R-Learner</strong> — DML-based meta-learner that estimates heterogeneous effects via weighted\nresidual regression.</li>\n<li><strong>DR-Learner</strong> — doubly robust + Neyman orthogonal meta-learner using AIPW pseudo-outcomes.</li>\n<li><strong>Regularization bias</strong> — systematic error introduced by ML model regularization that doesn't\nvanish with more data; the core problem DML solves.</li>\n<li><strong>Representation learning</strong> — learning a mapping <math data-tex=\"\\phi: \\mathcal{X} \\to \\mathcal{Z}\"><mrow><mi>ϕ</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi class=\"mathcal\">𝒳</mi><mo>→</mo><mi class=\"mathcal\">𝒵</mi></mrow></math> that\nbalances treated/control distributions for causal inference.</li>\n<li><strong>Robinson decomposition</strong> — the partialing-out transformation <math data-tex=\"\\tilde{Y} = Y - m(X)\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>Y</mi><mo>−</mo><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>,\n<math data-tex=\"\\tilde{T} = T - e(X)\"><mrow><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>T</mi><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> that eliminates the confounding function.</li>\n<li><strong>S-Learner</strong> — single ML model with treatment as a feature; vulnerable to regularization\nshrinking the treatment effect.</li>\n<li><strong>TarNet (Treatment-Agnostic Representation Network)</strong> — neural network with shared encoder and\nper-arm heads; learns balanced representations implicitly.</li>\n<li><strong>T-Learner</strong> — two separate ML models per treatment arm; avoids treatment drowning but loses\ninformation sharing.</li>\n<li><strong>X-Learner</strong> — four-stage meta-learner combining T-Learner imputation with propensity-weighted\nblending.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-23-s18\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Why is the ATE insufficient for coupon-targeting decisions, and what does CATE provide that ATE\ndoesn't? Use the worked example from <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.2\" role=\"link\" tabindex=\"0\">§1.2</a>. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Explain the S-Learner's regularization bias failure mode. What happens to <math data-tex=\"\\hat\\tau(x)\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> when\nthe treatment variable <math data-tex=\"T\"><mi>T</mi></math> is down-weighted by regularization? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>)</em></li>\n<li>How does the T-Learner avoid the S-Learner's drowning problem, and what new problem does it\nintroduce? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3.2\" role=\"link\" tabindex=\"0\">§3.2</a>)</em></li>\n<li>Trace the X-Learner's four stages and explain why propensity weighting in Stage 4 is the\ncorrect way to blend the two second-stage models. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>)</em></li>\n<li>What is honest estimation in causal trees, and why can't you use the same data for both\nsplitting and estimation? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.1\" role=\"link\" tabindex=\"0\">§4.1</a>)</em></li>\n<li>Explain how TarNet's shared encoder implicitly learns a balanced representation. Why does the\njoint training objective encourage this? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>)</em></li>\n<li>State CFRNet's double-robustness bound and explain what happens when you increase the balance\npenalty <math data-tex=\"\\lambda\"><mi>λ</mi></math> too much. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>)</em></li>\n<li>Derive the Robinson decomposition from <math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math> and explain why\n<math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> disappears. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>)</em></li>\n<li>What is Neyman orthogonality, and how does it change the relationship between nuisance error\nand treatment effect bias? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>Why is cross-fitting necessary even when Neyman orthogonality is satisfied? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.3\" role=\"link\" tabindex=\"0\">§7.3</a>)</em></li>\n<li>Write the R-Learner's objective function and explain why it can be interpreted as generalized\nOLS with <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> as implicit weights. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n<li>Describe the DR-Learner's three stages and explain how it combines double robustness,\northogonality, and heterogeneous effect estimation. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>Map five different causal ML methods onto the canonical DAG, specifying which edge or path each\nmethod targets and how. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-23-s19\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>\n<p><strong>Künzel, Sekhon, Bickel &amp; Yu (2019), &quot;Metalearners for estimating heterogeneous treatment\neffects using machine learning,&quot; PNAS</strong> — ⚠️ <strong>confirmed directly on the slide footer</strong> for the\nentire meta-learner section (S/T/X-learner). <code>solid</code>. The original X-learner paper — read this\nfirst among the meta-learner references.</p>\n</li>\n<li>\n<p><strong>Chernozhukov et al. (2018), &quot;Double/Debiased Machine Learning for Treatment and Structural\nParameters&quot;</strong> — ⚠️ <strong>confirmed directly on the slide footer</strong>, across the DML-framework slide\nrange (e.g. the slide introducing <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>'s &quot;regularization bias in nuisance functions,&quot; footer reads\n&quot;Chernozhukov et al. (2018) · Robinson (1988) · Wager (2024)&quot;) — <strong>not</strong> slide 85 as an earlier\npass of this file stated (slide 85's own footer is &quot;Doubly-robust learner · Kennedy (2023),&quot; the\nDR-Learner citation, see item 10 below). <code>hard</code>. The foundational DML paper; essential reading for\nunderstanding partialing out, Neyman orthogonality, and cross-fitting in full technical detail.</p>\n</li>\n<li>\n<p><strong>Shalit, Johansson &amp; Sontag (2017), &quot;Estimating Individual Treatment Effect: Generalization\nBounds and Algorithms,&quot; ICML</strong> (companion: Johansson, Shalit &amp; Sontag, 2016) — ⚠️ <strong>confirmed\ndirectly on the slide footer</strong> as the single paper introducing both TarNet and CFRNet. <code>solid</code>.\nThe representation-learning paper for causal inference — covers both <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a> and <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>.</p>\n</li>\n<li>\n<p><strong>Athey &amp; Imbens (2016), &quot;Recursive Partitioning for Heterogeneous Causal Effects&quot;</strong> — ⚠️\n<strong>confirmed directly on the slide footer</strong> for the causal-trees-and-forests section (the same\nfooter that names items 5's paper). <code>hard</code>. The original causal-tree paper — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.1\" role=\"link\" tabindex=\"0\">§4.1</a>'s splitting\ncriterion and honest-estimation idea trace directly to this work.</p>\n</li>\n<li>\n<p><strong>Athey, Tibshirani &amp; Wager (2019), &quot;Generalized Random Forests,&quot; Annals of Statistics</strong> — ⚠️\n<strong>confirmed directly on the slide footer</strong> (same causal-trees-and-forests slide as item 4) — this\nis the local-centering causal forest variant that actually achieves Neyman orthogonality, per the\n⚠️ callout in <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.2\" role=\"link\" tabindex=\"0\">§4.2</a>. <code>hard</code>. (An earlier pass of this file incorrectly flagged this as &quot;not named\non the slides&quot; — corrected here after direct re-verification.)</p>\n</li>\n<li>\n<p><strong>Robinson (1988), &quot;Root-N-Consistent Semiparametric Regression&quot;</strong> — ⚠️ <strong>confirmed directly on\nthe slide footer</strong>, across the same DML-framework slide range as item 2 — this is the paper <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>'s\nRobinson-decomposition formulas are named for. <code>hard</code>. (An earlier pass of this file incorrectly\nflagged this as &quot;not named on the slides&quot; — corrected here after direct re-verification.)</p>\n</li>\n<li>\n<p><strong>Neyman (1959), &quot;Optimal Asymptotic Tests of Composite Hypotheses&quot;</strong> — ⚠️ <strong>confirmed directly on\nthe slide footer</strong> for the Neyman-orthogonality slides (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>'s source range). <code>hard</code>. The origin of\nthe term &quot;Neyman orthogonality&quot; that <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a> is built entirely around — worth reading for the\noriginal statistical idea behind the modern causal-ML usage.</p>\n</li>\n<li>\n<p><strong>Wager (2024)</strong> — ⚠️ <strong>confirmed directly on the slide footer</strong>, appearing across both the\nheterogeneous-treatment-effects framing (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s source range) and the DML-framework slides (item 2's\nrange) — a recent synthesis/lecture-note-style reference tying the two topics together. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>Nie &amp; Wager (2021), &quot;Quasi-Oracle Estimation of Heterogeneous Treatment Effects,&quot; Biometrika</strong>\n— ⚠️ <strong>confirmed directly on the slide footer and body text</strong> of the R-Learner slide. <code>hard</code>. The\nactual R-Learner paper — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s objective function traces directly to this work, which had no\ncitation in this section before this review.</p>\n</li>\n<li>\n<p><strong>Kennedy (2023), &quot;Towards optimal doubly robust estimation of heterogeneous causal effects&quot;</strong>\n— ⚠️ <strong>confirmed directly on the slide footer</strong> (&quot;Doubly-robust learner · Kennedy (2023)&quot;) for\nthe DR-Learner slide. <code>hard</code>. The actual DR-Learner citation — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s pseudo-outcome formula\ntraces directly to this work, which had no citation in this section before this review.</p>\n</li>\n<li>\n<p><strong>Imbens &amp; Rubin (2015), &quot;Causal Inference for Statistics, Social, and Biomedical Sciences&quot;</strong>\n— ⚠️ not named on the slides — comprehensive reference for the potential outcomes framework\nunderpinning the entire series. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>Athey &amp; Imbens (2019), &quot;Machine Learning Methods That Economists Should Know About,&quot;\nAnnual Review of Economics</strong> — ⚠️ not named on the slides — influential survey connecting ML\nmethods (including causal forests) to econometric causal inference. <code>solid</code>. (Corrected from a\nstated year of 2018 — confirmed via WebSearch: published in <em>Annual Review of Economics</em>, Vol.\n11, 2019, pp. 685–725.)</p>\n</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — items 1–10 are confirmed directly on the lecture's own slide footers (items\n4–5's earlier &quot;not named on the slides&quot; flags, and item 2's slide-85 attribution, were themselves\nerrors from an earlier review pass — both corrected above after direct re-verification against the\nraw slide images). Items 11–12 are added from general causal inference field knowledge to support concepts the lecture uses\nbut does not cite by author/year — treat them as suggested background reading, not transcribed\nlecture citations.</p>\n</aside>\n</section>","sections":[{"id":"causal-inference-23-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s1","num":"","title":"Before we start: what you need to know","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s2","num":"","title":"The big picture","mins":3,"kind":"content","part":""},{"id":"causal-inference-23-s3","num":"1","title":"From Average to Heterogeneous Treatment Effects","mins":5,"kind":"content","part":""},{"id":"causal-inference-23-s4","num":"2","title":"From CATE Definition to Estimation — the Identification Bridge","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s5","num":"3","title":"Meta-Learners — Flexible ML Plug-ins","mins":4,"kind":"content","part":""},{"id":"causal-inference-23-s6","num":"4","title":"Causal Trees and Forests","mins":4,"kind":"content","part":""},{"id":"causal-inference-23-s7","num":"5","title":"Deep Representation Learning for Causal Inference","mins":9,"kind":"content","part":""},{"id":"causal-inference-23-s8","num":"6","title":"Orthogonal Causal ML — The DML Framework","mins":1,"kind":"content","part":""},{"id":"causal-inference-23-s9","num":"7","title":"The Three Ideas of DML","mins":6,"kind":"content","part":""},{"id":"causal-inference-23-s10","num":"8","title":"DML in Summary","mins":1,"kind":"content","part":""},{"id":"causal-inference-23-s11","num":"9","title":"R-Learner — DML for Heterogeneous Effects","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s12","num":"10","title":"DR-Learner — Doubly Robust + Orthogonal + Meta-Learner","mins":1,"kind":"content","part":""},{"id":"causal-inference-23-s13","num":"11","title":"The Full Landscape","mins":3,"kind":"content","part":""},{"id":"causal-inference-23-s14","num":"12","title":"Beyond Treatment Effects — Frontiers of Causal ML","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s15","num":"","title":"Putting it together","mins":4,"kind":"back","part":""},{"id":"causal-inference-23-s16","num":"","title":"Interview prep — Amazon Applied Scientist","mins":13,"kind":"back","part":""},{"id":"causal-inference-23-s17","num":"","title":"Glossary","mins":3,"kind":"back","part":""},{"id":"causal-inference-23-s18","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"causal-inference-23-s19","num":"","title":"Going deeper","mins":6,"kind":"back","part":""}],"interactiveCount":1}],"course":[{"slug":"supervised-learning","name":"Supervised Learning","lectures":4,"sections":90,"index":[{"num":"01","short":"Part 1 · Problem Formulation, Data Discipline, Bias–Variance &…"},{"num":"02","short":"Part 2 · Losses, Optimisation, Metrics & Three Classical…"},{"num":"03","short":"Part 3 · Trees, Ensembles, and the Machinery Around the Model"},{"num":"04","short":"applied-scientist-practicum"}]},{"slug":"deep-neural-networks","name":"Deep Neural Networks","lectures":3,"sections":113,"index":[{"num":"04","short":"Part 1 · Deep Learning Fundamentals"},{"num":"05","short":"Part 2 · Training Deep Networks & Convolutional Neural Networks"},{"num":"06","short":"Part 3 · Recurrent Networks and PyTorch in Practice"}]},{"slug":"dimensionality-reduction","name":"Dimensionality Reduction","lectures":3,"sections":110,"index":[{"num":"07","short":"Part 1 · The Curse, Feature Selection, and the Linear Algebra…"},{"num":"08","short":"Part 2 · SVD, PCA, Matrix Factorization, and the t-SNE/UMAP Family"},{"num":"09","short":"Part 3 · Dimensionality Reduction in the Age of LLMs &…"}]},{"slug":"unsupervised-learning","name":"Unsupervised Learning","lectures":4,"sections":114,"index":[{"num":"10","short":"Part 1 · Clustering & Density Estimation"},{"num":"11","short":"Part 2 · Gaussian Mixture Models & the EM Algorithm"},{"num":"12","short":"Part 3 · Generative Modeling — VAEs and GANs"},{"num":"13","short":"Part 4 · Diffusion Models and Flow Matching"}]},{"slug":"genai-llm","name":"GenAI & LLM","lectures":4,"sections":113,"index":[{"num":"01","short":"Part 1 · Foundations, Scale, and the Transformer"},{"num":"02","short":"Alignment & Training: Turning a Predictor into an Assistant"},{"num":"03","short":"Using & Serving LLMs: Seven Levers on Three Axes"},{"num":"04","short":"Beyond Text: Multimodal Models and Diffusion"}]},{"slug":"sequential-learning","name":"Sequential Learning","lectures":3,"sections":65,"index":[{"num":"18","short":"Part 1 · Text Representations, From Discrete Symbols to…"},{"num":"19","short":"Part 2 · From Context to Attention"},{"num":"20","short":"Part 3 · Subword Tokenization, the Transformer, and Language…"}]},{"slug":"causal-inference","name":"Causal Inference","lectures":3,"sections":61,"index":[{"num":"21","short":"Part 1 · Foundations, Graphical Models, and do-Calculus"},{"num":"22","short":"Part 2 · Treatment Effects, Identification, and Classical…"},{"num":"23","short":"Part 3 · Causal ML Methods for Treatment Effect Estimation"}]},{"slug":"reinforcement-learning","name":"Reinforcement Learning","lectures":3,"sections":62,"index":[{"num":"24","short":"Part 1 · Foundations, MDPs, and Bellman Equations"},{"num":"25","short":"Part 2 · From Planning to Learning"},{"num":"26","short":"Part 3 · From Policy Gradients to Human Feedback"}]},{"slug":"agentic-ai","name":"Agentic AI","lectures":3,"sections":61,"index":[{"num":"27","short":"Part 1 · Fundamentals, Architectures, and Reasoning"},{"num":"28","short":"Part 2 · Tools, Memory, and MCP"},{"num":"29","short":"Part 3 · Multi-Agent Systems, Workflows, and Production"}]}]}</script>
<script>"use strict";
/* Real interactive figures for Supervised Learning.  Keyed by the `title:` in
   the source `interactive` block.  Anything without an entry here keeps its
   fallback prose (which teaches the point completely on its own). */

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
// a minimal cartesian plotter: data coords -> pixel coords, axes, grid
function mkPlot(mount, { w = 460, h = 300, xr, yr, xlab, ylab, pad = 34 }){
  const svg = el('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h });
  el('rect', { x: 0, y: 0, width: w, height: h, class: 'plot-bg', rx: 6 }, svg);
  const X = v => pad + (v - xr[0]) / (xr[1] - xr[0]) * (w - pad - 8);
  const Y = v => (h - pad) - (v - yr[0]) / (yr[1] - yr[0]) * (h - pad - 10);
  for (let i = 0; i <= 4; i++){
    const gx = xr[0] + (xr[1] - xr[0]) * i / 4, gy = yr[0] + (yr[1] - yr[0]) * i / 4;
    el('line', { x1: X(gx), y1: Y(yr[0]), x2: X(gx), y2: Y(yr[1]), class: 'plot-grid' }, svg);
    el('line', { x1: X(xr[0]), y1: Y(gy), x2: X(xr[1]), y2: Y(gy), class: 'plot-grid' }, svg);
    const tx = el('text', { x: X(gx), y: h - pad + 13, class: 'plot-label', 'text-anchor': 'middle' }, svg);
    tx.textContent = (+gx.toFixed(2)).toString();
    const ty = el('text', { x: pad - 5, y: Y(gy) + 3, class: 'plot-label', 'text-anchor': 'end' }, svg);
    ty.textContent = (+gy.toFixed(2)).toString();
  }
  el('line', { x1: X(xr[0]), y1: Y(yr[0]), x2: X(xr[1]), y2: Y(yr[0]), class: 'plot-axis' }, svg);
  el('line', { x1: X(xr[0]), y1: Y(yr[0]), x2: X(xr[0]), y2: Y(yr[1]), class: 'plot-axis' }, svg);
  if (xlab) { const t = el('text', { x: w - 6, y: h - pad + 13, class: 'plot-label', 'text-anchor': 'end' }, svg); t.textContent = xlab; }
  if (ylab) { const t = el('text', { x: pad - 5, y: 12, class: 'plot-label', 'text-anchor': 'end' }, svg); t.textContent = ylab; }
  mount.appendChild(svg);
  const api = {
    svg, X, Y,
    curve(fn, attrs){
      let d = '';
      for (let i = 0; i <= 240; i++){
        const x = xr[0] + (xr[1] - xr[0]) * i / 240;
        const y = fn(x);
        if (!isFinite(y)) { d += ' M'; continue; }
        d += `${d && d.slice(-2) !== ' M' ? 'L' : 'M'}${X(x).toFixed(1)},${Y(Math.max(yr[0], Math.min(yr[1], y))).toFixed(1)} `;
      }
      return el('path', Object.assign({ d, fill: 'none', 'stroke-width': 2 }, attrs), svg);
    },
    seg(x1, y1, x2, y2, attrs){ return el('line', Object.assign({ x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), 'stroke-width': 2 }, attrs), svg); },
    dot(x, y, r, attrs){ return el('circle', Object.assign({ cx: X(x), cy: Y(y), r }, attrs), svg); },
  };
  return api;
}
function ctl(mount, defs, onChange){
  const bar = document.createElement('div'); bar.className = 'iv-ctl';
  const state = {};
  defs.forEach(d => {
    state[d.key] = d.value;
    const lab = document.createElement('label');
    lab.innerHTML = `${d.label} <span>${d.type === 'range'
      ? `<input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.value}"><span class="val"> ${d.fmt ? d.fmt(d.value) : d.value}</span>`
      : d.options.map(o => `<label style="flex-direction:row;gap:4px;font-weight:500"><input type="radio" name="${d.key}" value="${o}" ${o === d.value ? 'checked' : ''}>${o}</label>`).join(' ')}</span>`;
    if (d.type === 'range') {
      const inp = lab.querySelector('input'), out = lab.querySelector('.val');
      inp.addEventListener('input', () => { state[d.key] = +inp.value; out.textContent = ' ' + (d.fmt ? d.fmt(+inp.value) : inp.value); onChange(state); });
    } else {
      lab.querySelectorAll('input').forEach(r => r.addEventListener('change', () => { state[d.key] = r.value; onChange(state); }));
    }
    bar.appendChild(lab);
  });
  mount.appendChild(bar);
  return state;
}
function readout(mount){ const d = document.createElement('div'); d.className = 'readout'; mount.appendChild(d); return d; }
// deterministic RNG + standard normal, so every figure is reproducible
function rng(seed){ let s = (seed >>> 0) || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function randn(r){ return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(6.28318530718 * r()); }
// a bare <svg> with the plot background, for figures that aren't cartesian line plots
function mkSvg(mount, w, h){
  const svg = el('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h });
  el('rect', { x: 0, y: 0, width: w, height: h, class: 'plot-bg', rx: 6 }, svg);
  mount.appendChild(svg); return svg;
}
// a small block of markup inside the figure (matrices, bars, incident cards)
function block(mount){ const d = document.createElement('div'); d.style.cssText = 'font-family:var(--font-ui);font-size:12px;margin:6px 0'; mount.appendChild(d); return d; }

const INTERACTIVE = {};

/* ── L2 §2 — One outlier, two fits ─────────────────────────────────── */
INTERACTIVE['One outlier, two fits'] = (mount, spec) => {
  const base = [];
  for (let i = 0; i < 18; i++){ const x = i / 17 * 8 + 1; base.push([x, 0.6 * x + 2 + (Math.sin(i * 91.7) * 0.7)]); }
  const P = mkPlot(mount, { xr: [0, 10], yr: [0, 14], xlab: 'x', ylab: 'y' });
  const fitLine = wfn => P.curve(wfn, {});
  const mseL = P.curve(x => x, { stroke: 'var(--c-warn)' });
  const maeL = P.curve(x => x, { stroke: 'var(--accent)' });
  const outDot = P.dot(6, 12, 6, { fill: 'var(--c-warn)', cursor: 'ns-resize' });
  base.forEach(([x, y]) => P.dot(x, y, 3, { fill: 'var(--ink-3)' }));
  const out = readout(mount);
  let oy = 12;
  function fitMSE(pts){ // least squares
    const n = pts.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
    pts.forEach(([x, y]) => { sx += x; sy += y; sxx += x * x; sxy += x * y; });
    const m = (n * sxy - sx * sy) / (n * sxx - sx * sx); return [m, (sy - m * sx) / n];
  }
  function fitMAE(pts){ // coordinate-descent-ish: minimise sum|y-mx-b| over a grid
    let best = [0.6, 2], bs = 1e9;
    for (let m = -0.5; m <= 2; m += 0.02) for (let b = -2; b <= 8; b += 0.1){
      let s = 0; for (const [x, y] of pts) s += Math.abs(y - m * x - b);
      if (s < bs) { bs = s; best = [m, b]; }
    }
    return best;
  }
  function draw(){
    const pts = base.concat([[6, oy]]);
    const [m1, b1] = fitMSE(pts), [m2, b2] = fitMAE(pts);
    mseL.setAttribute('d', pathFor(P, x => m1 * x + b1));
    maeL.setAttribute('d', pathFor(P, x => m2 * x + b2));
    outDot.setAttribute('cy', P.Y(oy));
    out.innerHTML = `outlier at y = <b>${oy.toFixed(1)}</b> &nbsp;·&nbsp;
      <span style="color:var(--c-warn)">MSE fit</span> ŷ = <b>${m1.toFixed(2)}</b>x + <b>${b1.toFixed(2)}</b> &nbsp;·&nbsp;
      <span style="color:var(--accent)">MAE fit</span> ŷ = <b>${m2.toFixed(2)}</b>x + <b>${b2.toFixed(2)}</b>`;
  }
  const pathFor = (P, fn) => { let d = ''; for (let i = 0; i <= 60; i++){ const x = i / 60 * 10; d += (i ? 'L' : 'M') + P.X(x).toFixed(1) + ',' + P.Y(fn(x)).toFixed(1) + ' '; } return d; };
  let drag = false;
  const svg = P.svg;
  const yAt = ev => { const r = svg.getBoundingClientRect(); const py = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    const vb = svg.viewBox.baseVal; const sy = py / r.height * vb.height;
    return Math.max(2, Math.min(14, (300 - 34 - sy) / (300 - 34 - 10) * 14)); };
  outDot.addEventListener('pointerdown', e => { drag = true; outDot.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (!drag) return; oy = yAt(e); draw(); });
  svg.addEventListener('pointerup', () => drag = false);
  draw();
};

/* ── L2 §4 — The delta dial (Huber between MSE and MAE) ────────────── */
INTERACTIVE['The delta dial'] = (mount) => {
  const P = mkPlot(mount, { xr: [-6, 6], yr: [0, 8], xlab: 'error  e', ylab: 'loss' });
  P.curve(e => 0.5 * e * e, { stroke: 'var(--ink-3)', 'stroke-dasharray': '4 3' });     // MSE ½e²
  P.curve(e => Math.abs(e), { stroke: 'var(--ink-3)', 'stroke-dasharray': '1 3' });      // MAE |e|
  const hub = P.curve(e => e, { stroke: 'var(--accent)', 'stroke-width': 2.5 });
  const zoneL = P.seg(-2, 0, -2, 8, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const zoneR = P.seg(2, 0, 2, 8, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const out = readout(mount);
  const st = ctl(mount, [{ key: 'd', label: 'δ', type: 'range', min: 0.3, max: 5, step: 0.1, value: 2, fmt: v => v.toFixed(1) }], s => draw(s.d));
  function huber(e, d){ const a = Math.abs(e); return a <= d ? 0.5 * e * e : d * (a - d / 2); }
  function draw(d){
    let dd = ''; for (let i = 0; i <= 240; i++){ const e = -6 + 12 * i / 240; dd += (i ? 'L' : 'M') + P.X(e).toFixed(1) + ',' + P.Y(Math.min(8, huber(e, d))).toFixed(1) + ' '; }
    hub.setAttribute('d', dd);
    zoneL.setAttribute('x1', P.X(-d)); zoneL.setAttribute('x2', P.X(-d));
    zoneR.setAttribute('x1', P.X(d)); zoneR.setAttribute('x2', P.X(d));
    const at10 = huber(10, d);
    out.innerHTML = `δ = <b>${d.toFixed(1)}</b> — quadratic for |e| ≤ ${d.toFixed(1)}, linear beyond.
      An error of 10 costs <b>${at10.toFixed(1)}</b> under Huber vs <b>50</b> under ½e² and <b>10</b> under |e|.
      ${d < 0.6 ? ' At small δ it collapses onto MAE.' : d > 4 ? ' At large δ it hugs MSE.' : ''}`;
  }
  draw(2);
};

/* ── L2 §6 — The cost of confidence (BCE) ─────────────────────────── */
INTERACTIVE['The cost of confidence'] = (mount) => {
  const P = mkPlot(mount, { xr: [0, 1], yr: [0, 6], xlab: 'predicted p̂', ylab: '−log(·)' });
  P.curve(p => -Math.log(p), { stroke: 'var(--c-lab)' });          // loss if y=1
  P.curve(p => -Math.log(1 - p), { stroke: 'var(--c-warn)' });     // loss if y=0

/* ── L3 §2 — Impurity as the class mix changes ────────────────────── */
INTERACTIVE['Impurity as the class mix changes'] = (mount) => {

  P.curve(p => 2 * p * (1 - p), { stroke: 'var(--accent)' });                              // Gini
  P.curve(p => p <= 0 || p >= 1 ? 0 : -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p)) / 2, { stroke: 'var(--c-key)', 'stroke-dasharray': '4 3' }); // entropy/2
  const g = P.dot(0.5, 0.5, 4, { fill: 'var(--accent)' });

  function draw(p){

/* ── L3 §7 — The correlation floor (ρσ²) ──────────────────────────── */
INTERACTIVE['The correlation floor'] = (mount) => {

/* ── L2 §14 — The sigmoid, the boundary, and the threshold ────────── */
INTERACTIVE['The sigmoid, the boundary, and the threshold'] = (mount) => {
  const r = rng(7);
  const pts = [];
  for (let i = 0; i < 60; i++){
    const c = i < 30 ? 0 : 1;
    const cx = c ? 1.1 : -1.1, cy = c ? 0.5 : -0.5;
    pts.push({ x: cx + randn(r) * 0.95, y: cy + randn(r) * 0.95, c });
  }
  const P = mkPlot(mount, { w: 440, h: 260, xr: [-4, 4], yr: [-3, 3], xlab: 'x₁', ylab: 'x₂' });
  const line = P.seg(-4, 0, 4, 0, { stroke: 'var(--accent)', 'stroke-width': 2 });
  const dots = pts.map(p => P.dot(p.x, p.y, 3.2, { fill: p.c ? 'var(--c-lab)' : 'var(--c-warn)' }));
  const S = mkPlot(mount, { w: 440, h: 150, xr: [-6, 6], yr: [0, 1], xlab: 'z = w·x + b', ylab: 'σ(z)' });
  S.curve(z => 1 / (1 + Math.exp(-z)), { stroke: 'var(--ink-2)' });
  const thLine = S.seg(-6, 0.5, 6, 0.5, { stroke: 'var(--c-key)', 'stroke-dasharray': '3 3' });
  const out = readout(mount);
  const st = ctl(mount, [
    { key: 'w1', type: 'range', label: 'w₁', min: -3, max: 3, step: 0.1, value: 1.4, fmt: v => v.toFixed(1) },
    { key: 'w2', type: 'range', label: 'w₂', min: -3, max: 3, step: 0.1, value: 1.4, fmt: v => v.toFixed(1) },
    { key: 'b',  type: 'range', label: 'b',  min: -3, max: 3, step: 0.1, value: 0, fmt: v => v.toFixed(1) },
    { key: 't',  type: 'range', label: 'threshold', min: 0.05, max: 0.95, step: 0.01, value: 0.5, fmt: v => v.toFixed(2) },
  ], s => draw(s.w1, s.w2, s.b, s.t));
  function draw(w1, w2, b, t){
    const z0 = Math.log(t / (1 - t));                       // decision at σ(z)=t  ⇒  w·x+b = z0
    // boundary: w1 x1 + w2 x2 + b = z0
    const yAt = x1 => (z0 - b - w1 * x1) / (w2 || 1e-6);
    line.setAttribute('x1', P.X(-4)); line.setAttribute('y1', P.Y(Math.max(-3, Math.min(3, yAt(-4)))));
    line.setAttribute('x2', P.X(4));  line.setAttribute('y2', P.Y(Math.max(-3, Math.min(3, yAt(4)))));
    thLine.setAttribute('y1', S.Y(t)); thLine.setAttribute('y2', S.Y(t));
    let tp = 0, fp = 0, fn = 0, tn = 0;
    pts.forEach((p, i) => {
      const pred = 1 / (1 + Math.exp(-(w1 * p.x + w2 * p.y + b))) >= t ? 1 : 0;
      dots[i].setAttribute('stroke', pred === p.c ? 'none' : 'var(--ink)');
      dots[i].setAttribute('stroke-width', pred === p.c ? 0 : 1.2);
      if (p.c && pred) tp++; else if (!p.c && pred) fp++; else if (p.c && !pred) fn++; else tn++;
    });
    const prec = tp / (tp + fp || 1), rec = tp / (tp + fn || 1), acc = (tp + tn) / pts.length;
    out.innerHTML = `precision <b>${prec.toFixed(2)}</b> · recall <b>${rec.toFixed(2)}</b> · accuracy <b>${acc.toFixed(2)}</b>.
      Moving <b>w</b> rotates the line, moving <b>b</b> slides it — both need retraining.
      Moving the <b style="color:var(--c-key)">threshold</b> slides the same line along w with <em>no</em> retraining; it's the only knob you keep after shipping.`;
  }
  draw(1.4, 1.4, 0, 0.5);
};

/* ── L2 §17 — Drag the threshold, watch three views move together ── */
INTERACTIVE['Drag the threshold, watch three views move together'] = (mount) => {
  // score densities: negatives ~ Beta(2,4)-ish, positives ~ Beta(4,2)-ish, on a 100-bin grid
  const B = 100;
  const dens = (a, b) => { const g = []; let s = 0; for (let i = 0; i < B; i++){ const x = (i + 0.5) / B; const v = Math.pow(x, a - 1) * Math.pow(1 - x, b - 1); g.push(v); s += v; } return g.map(v => v / s); };
  const negD = dens(2, 4.5), posD = dens(4.5, 2);
  const P = mkPlot(mount, { w: 460, h: 190, xr: [0, 1], yr: [0, 0.05], xlab: 'model score', ylab: 'density' });
  const stepCurve = (D, attrs) => { let d = ''; for (let i = 0; i < B; i++){ const x = i / B; d += (i ? 'L' : 'M') + P.X(x).toFixed(1) + ',' + P.Y(Math.min(0.05, D[i])).toFixed(1) + ' L' + P.X((i + 1) / B).toFixed(1) + ',' + P.Y(Math.min(0.05, D[i])).toFixed(1) + ' '; } return el('path', Object.assign({ d, fill: 'none' }, attrs), P.svg); };
  stepCurve(negD, { stroke: 'var(--c-warn)', 'stroke-width': 1.5 });
  stepCurve(posD, { stroke: 'var(--c-lab)', 'stroke-width': 1.5 });
  const tLine = P.seg(0.5, 0, 0.5, 0.05, { stroke: 'var(--ink)', 'stroke-width': 1.5 });
  const roc = mkPlot(mount, { w: 220, h: 180, xr: [0, 1], yr: [0, 1], xlab: 'FPR', ylab: 'TPR' });
  const pr  = mkPlot(mount, { w: 220, h: 180, xr: [0, 1], yr: [0, 1], xlab: 'recall', ylab: 'precision' });
  roc.svg.style.cssText = pr.svg.style.cssText = 'display:inline-block;max-width:49%';
  const mat = block(mount);
  const out = readout(mount);
  const st = ctl(mount, [
    { key: 't',  type: 'range', label: 'threshold', min: 0.01, max: 0.99, step: 0.01, value: 0.5, fmt: v => v.toFixed(2) },
    { key: 'pi', type: 'range', label: 'prevalence', min: 0.001, max: 0.5, step: 0.001, value: 0.5, fmt: v => (v * 100).toFixed(1) + '%' },
  ], s => draw(s.t, s.pi));
  function counts(t, pi){
    const bi = Math.round(t * B);
    let tp = 0, fn = 0, fp = 0, tn = 0;
    for (let i = 0; i < B; i++){ if (i >= bi){ tp += posD[i]; fp += negD[i]; } else { fn += posD[i]; tn += negD[i]; } }
    const NP = 1e5 * pi, NN = 1e5 * (1 - pi);
    return { TP: tp * NP, FN: fn * NP, FP: fp * NN, TN: tn * NN };
  }
  function sweepCurve(plot, xf, yf, pi, col){
    let d = '';
    for (let k = 0; k <= B; k++){ const c = counts(k / B, pi); const x = xf(c), y = yf(c); d += (k ? 'L' : 'M') + plot.X(x).toFixed(1) + ',' + plot.Y(y).toFixed(1) + ' '; }
    return el('path', { d, fill: 'none', stroke: col, 'stroke-width': 1.6 }, plot.svg);
  }
  const rocDot = roc.dot(0, 0, 4, { fill: 'var(--accent)' });
  const prDot  = pr.dot(0, 0, 4, { fill: 'var(--accent)' });
  let rocPath, prPath;
  function draw(t, pi){
    tLine.setAttribute('x1', P.X(t)); tLine.setAttribute('x2', P.X(t));
    if (rocPath) rocPath.remove(); if (prPath) prPath.remove();
    rocPath = sweepCurve(roc, c => c.FP / (c.FP + c.TN || 1), c => c.TP / (c.TP + c.FN || 1), pi, 'var(--ink-3)');
    prPath  = sweepCurve(pr,  c => c.TP / (c.TP + c.FN || 1), c => c.TP / (c.TP + c.FP || 1), pi, 'var(--ink-3)');
    roc.svg.appendChild(rocDot); pr.svg.appendChild(prDot);
    const c = counts(t, pi);
    const fpr = c.FP / (c.FP + c.TN || 1), rec = c.TP / (c.TP + c.FN || 1), prec = c.TP / (c.TP + c.FP || 1);
    rocDot.setAttribute('cx', roc.X(fpr)); rocDot.setAttribute('cy', roc.Y(rec));
    prDot.setAttribute('cx', pr.X(rec));  prDot.setAttribute('cy', pr.Y(prec));
    const f1 = 2 * prec * rec / (prec + rec || 1);
    const cell = (l, v, bg) => `<td style="padding:5px 9px;background:${bg};text-align:center"><small style="color:var(--ink-3)">${l}</small><br><b>${Math.round(v).toLocaleString()}</b></td>`;
    mat.innerHTML = `<table style="border-collapse:collapse;margin:4px 0">
      <tr>${cell('TP', c.TP, 'var(--accent-wash)')}${cell('FP', c.FP, 'transparent')}</tr>
      <tr>${cell('FN', c.FN, 'transparent')}${cell('TN', c.TN, 'var(--accent-wash)')}</tr></table>`;
    out.innerHTML = `precision <b>${prec.toFixed(3)}</b> · recall <b>${rec.toFixed(3)}</b> · F1 <b>${f1.toFixed(3)}</b> · FPR <b>${fpr.toFixed(3)}</b>.
      Drag <b>prevalence</b> toward 0.1%: the <span style="color:var(--ink-3)">ROC</span> dot barely stirs while the <span style="color:var(--ink-3)">PR</span> dot collapses.
      That divergence is the whole case for PR-AUC on imbalanced data.`;
  }
