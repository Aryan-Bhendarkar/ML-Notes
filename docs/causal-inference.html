display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><mo>⋅</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Switching equation: observed outcome depends on assignment <math data-tex=\"T_i\\in\\{0,1\\}\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>∈</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>.</em></p>\n<p><strong>Words before symbols:</strong> the outcome you actually <em>see</em> for unit <math data-tex=\"i\"><mi>i</mi></math> is just whichever potential\noutcome corresponds to the treatment that unit actually received — if <math data-tex=\"T_i=1\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></math> (treated), you see\n<math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>; if <math data-tex=\"T_i=0\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></math> (untreated), you see <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. The equation is a bookkeeping device: it says\n&quot;the observed <math data-tex=\"Y\"><mi>Y</mi></math> is a <em>selector</em> that reveals one of the two potential outcomes and hides the\nother,&quot; nothing more.</p>\n<h3>3.2 The individual treatment effect and the fundamental problem</h3>\n<div class=\"mblk\"><math data-tex=\"\\tau_i = Y_i(1) - Y_i(0) \\quad\\text{(never jointly observed)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>(never jointly observed)</mtext></mrow></math></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The fundamental problem of causal inference, stated directly.</strong> <em>&quot;Only one potential outcome\nper unit is observed. Causal inference is a missing-data problem.&quot;</em> You can never compute <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math>\nfor any single unit <math data-tex=\"i\"><mi>i</mi></math>, because you never see both <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for the same person at the\nsame time — the other one is, by construction, a counterfactual that did not happen. Every method in\nthis lecture is a strategy for estimating some <em>aggregate</em> of <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math> across many units, without\never needing any single unit's individual <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math>.</p>\n</aside>\n<h3>3.3 Three aggregate estimands</h3>\n<div class=\"mblk bound\"><math data-tex=\"\\text{ATE} = \\mathbb{E}[\\tau_i] \\qquad \\text{ATT} = \\mathbb{E}[\\tau_i\\mid T_i{=}1] \\qquad \\text{CATE}(x) = \\mathbb{E}[\\tau_i\\mid X_i{=}x]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>ATE</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mspace width=\"2em\"></mspace><mtext>ATT</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>T</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mspace width=\"2em\"></mspace><mtext>CATE</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>X</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ATE</strong></td>\n<td>&quot;average treatment effect&quot;</td>\n<td>The average effect across the <em>whole</em> population, treated and untreated alike</td>\n</tr>\n<tr>\n<td><strong>ATT</strong></td>\n<td>&quot;average treatment effect on the treated&quot;</td>\n<td>The average effect, but only among units that <em>actually</em> received treatment</td>\n</tr>\n<tr>\n<td><strong>CATE(<math data-tex=\"x\"><mi>x</mi></math>)</strong></td>\n<td>&quot;conditional average treatment effect&quot;</td>\n<td>The average effect <em>within</em> the subgroup defined by covariate value <math data-tex=\"X{=}x\"><mrow><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi></mrow></math> — a personalized or subgroup-specific effect</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — why three, not one.</strong> ATE answers &quot;should this treatment be rolled out to\neveryone?&quot; ATT answers &quot;for the people who got it, did it actually help?&quot; (useful when treatment\nassignment wasn't random, so the treated group may differ systematically from the general\npopulation). CATE answers &quot;for a person with <em>these specific characteristics</em>, how much would this\nhelp?&quot; — the estimand behind personalized/precision interventions. They can differ substantially\nwhenever treatment effects vary across the population and treatment assignment correlates with those\nsame characteristics.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s6\" data-title=\"Probabilistic Graphical Models\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Probabilistic Graphical Models</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>DAG (Directed Acyclic Graph), <math data-tex=\"\\mathcal{G}=(V,E)\"><mrow><mi class=\"mathcal\">𝒢</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>V</mi><mo separator=\"true\">,</mo><mi>E</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — encodes a factorization of the joint\ndistribution. Pearl (1988), <em>Probabilistic Reasoning in Intelligent Systems</em>, Morgan Kaufmann.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"P(X_1,\\ldots,X_p) = \\prod_{j=1}^{p} P\\big(X_j \\mid \\text{Pa}(X_j)\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>X</mi><mi>p</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∏</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>p</mi></munderover></mrow><mi>P</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>X</mi><mi>j</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>Pa</mtext><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p><em>Markov property: each node is conditionally independent of its non-descendants given its parents.</em></p>\n<p><strong>Words before symbols:</strong> the probability of the whole system taking on a particular joint\nconfiguration factors into a product of small, local pieces — one factor per variable, each factor\ndepending only on that variable's own <strong>parents</strong> (its direct causes in the graph) rather than on the\nentire rest of the system. This is what makes a graph a compact, checkable representation of a\ncomplicated joint distribution.</p>\n<p>🧪 <strong>Worked example — a 3-node graph</strong> [Z → X, Z → Y, X → Y]:</p>\n<div class=\"mblk\"><math data-tex=\"P(Z,X,Y) = P(Z)\\,P(X\\mid Z)\\,P(Y\\mid X,Z)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo separator=\"true\">,</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Y</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<ul>\n<li><strong>Nodes</strong> = random variables.</li>\n<li><strong>Directed edges</strong> = direct causal influence.</li>\n<li><strong>Acyclicity</strong> allows topological ordering (you can always list the variables so every arrow points\nfrom earlier to later in the list — this is what makes the factorization well-defined).</li>\n<li><strong>Causal semantics:</strong> <strong>deleting edges = intervening.</strong> This is the single sentence that connects\ngraphs back to <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s do-operator: computing <math data-tex=\"P(Y\\mid\\text{do}(X{=}x))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> means <em>literally erasing every\narrow pointing into <math data-tex=\"X\"><mi>X</mi></math></em> (since an intervention overrides whatever normally determines <math data-tex=\"X\"><mi>X</mi></math>), fixing\n<math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>, and then reading off the resulting (now-modified) joint distribution over everything else.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-21-s7\" data-title=\"Conditional Independence — the Atomic Building Block\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Conditional Independence — the Atomic Building Block</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"mblk\"><math data-tex=\"X\\perp Y \\mid Z \\quad\\Longleftrightarrow\\quad P(X,Y\\mid Z) = P(X\\mid Z)\\,P(Y\\mid Z)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mspace width=\"1em\"></mspace><mo stretchy=\"false\">⟺</mo><mspace width=\"1em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>Dawid (1979), <em>&quot;Conditional Independence in Statistical Theory.&quot;</em></p>\n<p>There are exactly three shapes a path between two variables can take through a third, and they behave\n<strong>oppositely</strong> with respect to conditioning:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Fork (confounder)</strong></th>\n<th><strong>Chain (mediator)</strong></th>\n<th><strong>Collider</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diagram</td>\n<td><math data-tex=\"Z\\to X,\\ Z\\to Y\"><mrow><mi>Z</mi><mo>→</mo><mi>X</mi><mo separator=\"true\">,</mo><mtext> </mtext><mi>Z</mi><mo>→</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\to C \\leftarrow Y\"><mrow><mi>X</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math></td>\n</tr>\n<tr>\n<td>Marginally</td>\n<td><math data-tex=\"X\\not\\perp Y\"><mrow><mi>X</mi><mo>⟂̸</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\not\\perp Y\"><mrow><mi>X</mi><mo>⟂̸</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\perp Y\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi></mrow></math></td>\n</tr>\n<tr>\n<td>Given the middle node</td>\n<td><math data-tex=\"X\\perp Y \\mid Z\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi></mrow></math></td>\n<td><math data-tex=\"X\\perp Y \\mid M\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>M</mi></mrow></math></td>\n<td><math data-tex=\"X\\not\\perp Y \\mid C\"><mrow><mi>X</mi><mo>⟂̸</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>C</mi></mrow></math></td>\n</tr>\n<tr>\n<td>Effect of conditioning</td>\n<td><strong>Conditioning blocks path</strong></td>\n<td><strong>Conditioning blocks path</strong></td>\n<td><strong>Conditioning opens path</strong></td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Conditioning can create or destroy associations.</strong></li>\n<li><strong>Collider bias (Berkson's paradox):</strong> <em>&quot;among selected units, causes of selection appear\nnegatively correlated.&quot;</em></li>\n</ul>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most counterintuitive fact in this lecture, and worth sitting with.</strong> A <strong>fork</strong>\n(<math data-tex=\"Z\"><mi>Z</mi></math> causes both <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>) and a <strong>chain</strong> (<math data-tex=\"X\"><mi>X</mi></math> causes <math data-tex=\"M\"><mi>M</mi></math> causes <math data-tex=\"Y\"><mi>Y</mi></math>) both behave the way\nintuition expects: <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out associated, and conditioning on the variable in the middle\nremoves that association (in the fork's case, because you've controlled for the shared cause; in\nthe chain's case, because you've blocked the only causal pathway from <math data-tex=\"X\"><mi>X</mi></math> to <math data-tex=\"Y\"><mi>Y</mi></math>). A <strong>collider</strong>\ndoes the <em>opposite</em>: <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out <strong>independent</strong> — genuinely unrelated — but conditioning\non their common effect <math data-tex=\"C\"><mi>C</mi></math> <em>creates</em> an association between them that did not exist before.</p>\n<p><em>Concretely — a classic collider-bias example (celebrity attractiveness and talent):</em> suppose being\nfamous (<math data-tex=\"C\"><mi>C</mi></math>) requires either being unusually attractive (<math data-tex=\"X\"><mi>X</mi></math>) or unusually talented (<math data-tex=\"Y\"><mi>Y</mi></math>), and\nattractiveness and talent are genuinely unrelated in the general population. Restrict attention only\nto famous people (i.e., condition on <math data-tex=\"C\"><mi>C</mi></math>) and attractiveness and talent will appear <em>negatively</em>\ncorrelated — because among the famous, a person low on one trait most likely made it in on the\nother. This is Berkson's paradox exactly as named on the slide: <em>conditioning on a shared effect\nmanufactures a spurious negative correlation between two otherwise independent causes.</em></p>\n<p><strong>How to apply:</strong> before conditioning on (or &quot;controlling for&quot;) any variable in an analysis, check\nwhether it's a collider on the causal path you care about. Controlling for a collider is a common,\ngenuine mistake — it does not remove confounding, it <em>introduces</em> a new spurious association where\nnone existed.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s8\" data-title=\"D-Separation Theorem — Reading Conditional Independences from the Graph\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">D-Separation Theorem — Reading Conditional Independences from the Graph</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Reading conditional independences from the graph.&quot;</em> Verma &amp; Pearl (1988), <em>&quot;Causal Networks:\nSemantics and Expressiveness.&quot;</em></p>\n</blockquote>\n<p><strong>Definition.</strong> A path between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> is <strong>blocked</strong> by <math data-tex=\"Z\"><mi>Z</mi></math> if it contains: <strong>(i)</strong> a\nnon-collider in <math data-tex=\"Z\"><mi>Z</mi></math>, or <strong>(ii)</strong> a collider whose descendants are all outside <math data-tex=\"Z\"><mi>Z</mi></math>.</p>\n<div class=\"mblk\"><math data-tex=\"X \\perp_{\\mathcal{G}} Y \\mid Z \\quad\\Longrightarrow\\quad X\\perp Y\\mid Z \\quad\\text{(under faithfulness)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>X</mi><msub><mo>⟂</mo><mi class=\"mathcal\">𝒢</mi></msub><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mspace width=\"1em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"1em\"></mspace><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mspace width=\"1em\"></mspace><mtext>(under faithfulness)</mtext></mrow></math></div>\n<ul>\n<li><strong>d-separation is sound and complete</strong> for reading off conditional independencies from the graph.</li>\n<li><strong>Faithfulness:</strong> no exact parameter cancellations (a generic assumption — it rules out the\nfreak coincidence where two causal effects happen to numerically cancel each other out exactly,\nproducing an independence in the data that the graph itself doesn't predict).</li>\n<li><strong>Practical use:</strong> determine the <strong>minimal adjustment set</strong> for identification.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this generalizes <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s three cases into one rule.</strong> D-separation is the single\nalgorithm that correctly handles <em>any</em> path of <em>any</em> length, built out of chains, forks, and\ncolliders in any combination: walk every path between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>; a path is blocked if it hits a\nnon-collider that's in the conditioning set <math data-tex=\"Z\"><mi>Z</mi></math> (fork or chain logic — conditioning on it blocks the\npath) <em>or</em> if it hits a collider that's <em>not</em> in <math data-tex=\"Z\"><mi>Z</mi></math> and has no descendant in <math data-tex=\"Z\"><mi>Z</mi></math> either (collider\nlogic — an unconditioned collider already blocks the path on its own). If <strong>every</strong> path between <math data-tex=\"X\"><mi>X</mi></math>\nand <math data-tex=\"Y\"><mi>Y</mi></math> is blocked given <math data-tex=\"Z\"><mi>Z</mi></math>, the graph implies <math data-tex=\"X\\perp Y\\mid Z\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi></mrow></math>. This single mechanical procedure\nis &quot;sound and complete&quot; — it never gives a wrong answer, and it finds every independence the graph\nactually implies.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s9\" data-title=\"do-Calculus — From Graph to Intervention\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">do-Calculus — From Graph to Intervention</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Three rules that reduce <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> expressions to observational quantities.&quot;</em> Pearl\n(1995), <em>&quot;Causal Diagrams for Empirical Research.&quot;</em></p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),Z) \\;\\longrightarrow\\; \\text{observational expression (if identifiable)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟶</mo><mspace width=\"0.2778em\"></mspace><mtext>observational expression (if identifiable)</mtext></mrow></math></div>\n<p><strong>Rule 1 (insertion/deletion of observations):</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),Z,W) = P(Y\\mid\\text{do}(X),W) \\quad\\text{if}\\quad Y\\perp_{\\mathcal{G}_{\\bar X}} Z \\mid X,W\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Z</mi><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>if</mtext><mspace width=\"1em\"></mspace><mi>Y</mi><msub><mo>⟂</mo><msub><mi class=\"mathcal\">𝒢</mi><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover></msub></msub><mi>Z</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>W</mi></mrow></math></div>\n<p><strong>Rule 2 (action/observation exchange):</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),\\text{do}(Z),W) = P(Y\\mid\\text{do}(X),Z,W) \\quad\\text{if}\\quad Y\\perp_{\\mathcal{G}_{\\bar X\\underline Z}} Z\\mid X,W\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Z</mi><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>if</mtext><mspace width=\"1em\"></mspace><mi>Y</mi><msub><mo>⟂</mo><msub><mi class=\"mathcal\">𝒢</mi><mrow><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover><menclose notation=\"bottom\" class=\"tml-underline\"><mi>Z</mi></menclose></mrow></msub></msub><mi>Z</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>W</mi></mrow></math></div>\n<p><strong>Rule 3 (insertion/deletion of actions):</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),\\text{do}(Z),W) = P(Y\\mid\\text{do}(X),W) \\quad\\text{if}\\quad Y\\perp_{\\mathcal{G}_{\\bar X\\overline{Z(W)}}} Z\\mid X,W\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>if</mtext><mspace width=\"1em\"></mspace><mi>Y</mi><msub><mo>⟂</mo><msub><mi class=\"mathcal\">𝒢</mi><mrow><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover><menclose notation=\"top\" class=\"tml-overline\"><mrow><mi>Z</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></menclose></mrow></msub></msub><mi>Z</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>W</mi></mrow></math></div>\n<p><strong>Words before symbols, for each rule:</strong></p>\n<ul>\n<li><strong>Rule 1</strong> says: an <em>observed</em> variable <math data-tex=\"Z\"><mi>Z</mi></math> can be dropped from (or added to) what you're\nconditioning on, without changing the answer, exactly when <math data-tex=\"Z\"><mi>Z</mi></math> gives no extra information about <math data-tex=\"Y\"><mi>Y</mi></math>\nonce you already know <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"W\"><mi>W</mi></math> — checked by d-separation in the graph with <math data-tex=\"X\"><mi>X</mi></math>'s incoming edges\ndeleted (written <math data-tex=\"\\mathcal{G}_{\\bar X}\"><msub><mi class=\"mathcal\">𝒢</mi><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover></msub></math>, &quot;the graph as it looks after intervening on <math data-tex=\"X\"><mi>X</mi></math>&quot;).</li>\n<li><strong>Rule 2</strong> says: an <em>action</em> <math data-tex=\"\\text{do}(Z)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can be replaced by simply <em>observing</em> <math data-tex=\"Z{=}z\"><mrow><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi></mrow></math> — turning\nan intervention into a plain conditioning statement — whenever <math data-tex=\"Z\"><mi>Z</mi></math>'s only relevant relationship with\n<math data-tex=\"Y\"><mi>Y</mi></math> runs entirely through observable paths, once <math data-tex=\"X\"><mi>X</mi></math> is intervened on.</li>\n<li><strong>Rule 3</strong> says: an action <math data-tex=\"\\text{do}(Z)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can be dropped entirely (as if it were never performed)\nwhenever forcing <math data-tex=\"Z\"><mi>Z</mi></math> wouldn't have changed anything relevant to <math data-tex=\"Y\"><mi>Y</mi></math> anyway, given <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"W\"><mi>W</mi></math>.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — what these three rules are <em>for</em>.</strong> Individually the notation is dense, but the\ncollective purpose is simple: <strong>do-calculus is a proof system for turning an unmeasurable quantity\n(something with a <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> in it) into a measurable one (a plain conditional probability,\ncomputable from observational data), one legal graph-surgery step at a time.</strong> If a sequence of\nRule 1/2/3 applications can fully eliminate every <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from an expression, the causal\neffect is <strong>identifiable</strong> from observational data; Pearl proved these three rules are complete —\nif an effect <em>is</em> identifiable, some sequence of these rules will find it.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s10\" data-title=\"Backdoor and Frontdoor Criteria — Two Ready-Made Corollaries\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Backdoor and Frontdoor Criteria — Two Ready-Made Corollaries</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Two commonly used corollaries of the do-calculus.&quot;</em> Pearl (2000), <em>Causality</em>, Ch. 3; Huang &amp;\nValtorta (2006), <em>&quot;Identifiability in Causal Bayesian Networks.&quot;</em></p>\n</blockquote>\n<h3>8.1 Backdoor adjustment</h3>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X)) = \\sum_{z} P(Y\\mid X, Z{=}z)\\,P(Z{=}z)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>z</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Valid when <math data-tex=\"Z\"><mi>Z</mi></math> blocks all backdoor paths and contains no descendant of <math data-tex=\"X\"><mi>X</mi></math>.</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Backdoor path</strong> — any path between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> that starts with an arrow <em>into</em> <math data-tex=\"X\"><mi>X</mi></math> (i.e., a\npath running &quot;backward&quot; out of <math data-tex=\"X\"><mi>X</mi></math> through a common cause, rather than forward along <math data-tex=\"X\"><mi>X</mi></math>'s own\ncausal effect). These are exactly the paths that create confounding.</p>\n<p><strong>Words before symbols:</strong> if you can find a set of variables <math data-tex=\"Z\"><mi>Z</mi></math> that blocks every backdoor path\nfrom <math data-tex=\"X\"><mi>X</mi></math> to <math data-tex=\"Y\"><mi>Y</mi></math> (and doesn't itself get affected by <math data-tex=\"X\"><mi>X</mi></math>), then you can compute the causal effect by\na <strong>weighted average</strong>: look at <math data-tex=\"Y\"><mi>Y</mi></math>'s distribution within each stratum of <math data-tex=\"Z\"><mi>Z</mi></math> (that's the\n&quot;adjustment&quot; step — comparing like-with-like within each stratum, exactly as <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>'s Simpson's\nparadox fix required), then average those stratum-specific numbers back together, weighting by how\ncommon each stratum is. This is the formal generalization of &quot;compare recovery rates <em>within</em> each\nseverity stratum, then combine.&quot;</p>\n</blockquote>\n<h3>8.2 Frontdoor adjustment</h3>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X)) = \\sum_m P(m\\mid X)\\sum_{x'} P(Y\\mid m,x')\\,P(x')\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>m</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>m</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>m</mi><mo separator=\"true\">,</mo><msup><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Valid when mediator <math data-tex=\"M\"><mi>M</mi></math> satisfies: <math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>, no direct <math data-tex=\"X\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>Y</mi></mrow></math> path unblocked by <math data-tex=\"M\"><mi>M</mi></math>.</em></p>\n<ul>\n<li><strong>Backdoor: most common in practice</strong> (adjust for confounders).</li>\n<li><strong>Frontdoor: useful when confounders are unobserved but a mediator is measured.</strong></li>\n<li><strong>Both are derivable via the three rules of do-calculus</strong> — they are not separate assumptions\nbolted on to the theory; they are specific, named <em>consequences</em> of <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>'s three rules, packaged as\nreusable formulas because they come up so often in practice.</li>\n</ul>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — when do you reach for which?</strong> Reach for <strong>backdoor adjustment</strong> whenever\nyou can plausibly list and measure the common causes of treatment and outcome (the usual\n&quot;control for confounders&quot; instinct in applied statistics). Reach for <strong>frontdoor adjustment</strong>\nspecifically in the harder case where the confounder between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> is <em>unmeasured or\nunmeasurable</em> (e.g., an unobserved genetic predisposition), but you happen to have measured a\n<strong>mediator</strong> — a variable that fully carries <math data-tex=\"X\"><mi>X</mi></math>'s effect on <math data-tex=\"Y\"><mi>Y</mi></math> — whose own relationship to <math data-tex=\"Y\"><mi>Y</mi></math> is\n<em>not</em> confounded by that same unmeasured variable. This is a substantially less common situation in\npractice, which is exactly why the slide calls backdoor &quot;most common&quot; and frontdoor &quot;useful when.&quot;</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s11\" data-title=\"RCTs — The Gold Standard\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">RCTs — The Gold Standard</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Randomisation guarantees <math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>.&quot;</em> Fisher (1935), <em>The Design of Experiments</em>,\nOliver &amp; Boyd.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\text{ATE} = \\mathbb{E}[Y\\mid T{=}1] - \\mathbb{E}[Y\\mid T{=}0]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>ATE</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p><em>Unbiased by design: no confounders (observed <strong>or unobserved</strong>).</em></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why randomization is uniquely powerful.</strong> Every technique in <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>\n(do-calculus, backdoor, frontdoor) works by <strong>adjusting for confounders you can identify and\nmeasure</strong>. Randomization sidesteps the entire problem differently: by assigning <math data-tex=\"T\"><mi>T</mi></math> purely by chance\n(a coin flip, independent of everything about the unit), it guarantees that treatment assignment is\nstatistically unrelated to <em>both</em> potential outcomes — <strong>including confounders you never thought to\nmeasure, or couldn't measure even in principle.</strong> This is the one thing no amount of clever\nobservational adjustment can promise, because adjustment can only control for variables you actually\nhave in your dataset.</p>\n</aside>\n<p>Four practical limitations, each of which pushes real-world problems back toward observational\nmethods:</p>\n<ul>\n<li><strong>Cost:</strong> experiments are expensive or slow.</li>\n<li><strong>Ethics:</strong> cannot randomize harmful exposures (you cannot ethically randomize people to smoke, to\nreceive a known-inferior treatment, or to be denied a beneficial intervention).</li>\n<li><strong>External validity:</strong> trial population <math data-tex=\"\\ne\"><mo lspace=\"0em\" rspace=\"0em\">≠</mo></math> deployment population — an effect measured in a\ncontrolled trial population may not transfer cleanly to the full population it will eventually be\ndeployed to.</li>\n<li><strong>Compliance:</strong> intention-to-treat <math data-tex=\"\\ne\"><mo lspace=\"0em\" rspace=\"0em\">≠</mo></math> per-protocol effect — the effect of <em>being assigned</em> to\ntreatment (what randomization directly guarantees) is not the same quantity as the effect of\n<em>actually receiving</em> treatment, once some assigned participants don't comply.</li>\n</ul>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;When randomisation is infeasible, we need observational methods + identification assumptions&quot;</em> —\nthe explicit handoff back to <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s machinery, and the sentence that frames the entire lecture as\none coherent argument: <strong>RCTs are the gold standard exactly because they need none of the\nassumptions <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> require, but the moment an RCT isn't possible, that assumption-laden machinery is\nthe only path back to a valid causal answer.</strong></p>\n</blockquote>\n<hr>\n</section><section id=\"causal-inference-21-s12\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"808\" style=\"max-width:100%;height:auto\" id=\"df8200c6d2858db85\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 807.40625 667.5\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#df8200c6d2858db85{f
