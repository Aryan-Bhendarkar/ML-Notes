1,k} - \\bar Y_{0,k}\"><mrow><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub></mrow></math> compares <strong>like with\nlike</strong>.</li>\n<li><strong>Combine:</strong> weight each bin gap by treated share <math data-tex=\"n_{1,k}/n_1\"><mrow><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mi>/</mi><msub><mi>n</mi><mn>1</mn></msub></mrow></math>:</li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATT}} = \\sum_{k=1}^{K} \\frac{n_{1,k}}{n_1}\\big(\\bar Y_{1,k}-\\bar Y_{0,k}\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mi>K</mi></munderover></mrow><mfrac><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p><em>weighted average of within-bin treated-minus-control gaps</em></p>\n<p>🧪 <strong>Worked example — age alone barely helps:</strong> stratifying on age into 4 bins (16–24, 24–32,\n32–40, 40–56) gives a <strong>stratified estimate (age-adjusted) of −$8,279</strong> — barely different from the\nnaive −$8,498, and still the wrong sign. <em>&quot;Age alone barely moves the naive number: prior earnings\ncarries the bias.&quot;</em></p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The lesson this specific result teaches.</strong> Stratifying on <em>any</em> covariate does not guarantee\nprogress — it only removes the imbalance in <em>that specific</em> covariate as an explanation for the gap.\nSince age wasn't the dominant source of imbalance here (recall <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s SMD table: prior earnings had\nSMD 1.57–1.75, far larger than age's 0.80), stratifying on age alone leaves almost all the selection\nbias intact. This is a concrete, numeric warning against assuming &quot;I adjusted for <em>something</em>&quot; is\nthe same as &quot;I adjusted for <em>enough</em>.&quot;</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s11\" data-title=\"Matching\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Matching</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Impute each trainee's missing control outcome from its nearest neighbour.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Matching</strong> — take the nearest control <math data-tex=\"j(i)\"><mrow><mi>j</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>i</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>'s outcome as <math data-tex=\"\\widehat{Y_i(0)}\"><mover><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mo stretchy=\"true\" class=\"tml-hat-3\" style=\"math-depth:0;\">ˆ</mo></mover></math>.</p>\n</blockquote>\n<ul>\n<li><strong>One-to-one:</strong> each trainee paired to a single control.</li>\n<li><strong>Distance on covariates:</strong> age and prior earnings, <math data-tex=\"\\|X_i-X_j\\|\"><mrow><mi>‖</mi><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><msub><mi>X</mi><mi>j</mi></msub><mi>‖</mi></mrow></math>.</li>\n<li><strong>Not scale-invariant:</strong> standardise, or earnings drowns age (since earnings is measured in\nthousands of dollars and age in single-digit-to-double-digit years, an unstandardized distance\nmetric would let earnings differences completely dominate the match, effectively ignoring age).</li>\n<li><strong>Average imputed gaps:</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATT}} = \\frac{1}{n_1}\\sum_{i:T_i=1}\\big(Y_i - Y_{j(i)}\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mfrac><mn>1</mn><msub><mi>n</mi><mn>1</mn></msub></mfrac><mrow><munder><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mi>Y</mi><mrow><mi>j</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>i</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p>🧪 <strong>Worked example, two covariates (age + prior earnings):</strong> matching on these two covariates alone\ngives <strong>−$3,550</strong>, <em>&quot;short of truth. Omitted causes remain.&quot;</em> — matching on only two of the eight\nimbalanced covariates from <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s table still leaves most of the selection bias uncorrected.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This −$3,550 figure is a small, 6-trainee toy walkthrough illustrating the <em>mechanism</em>, not\nthe real estimator's output on the full sample.</strong> The slide this comes from is explicitly titled\n&quot;All 6 trainees paired to their nearest twin&quot; — a deliberately tiny demonstration of how\nnearest-neighbor pairing works, step by step. The <em>actual</em> full-185-trainee nearest-neighbor\nmatching result — the one used everywhere else in this file, including <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>'s scoreboard — is\n<strong>$2,037</strong> (gap $243 from the $1,794 truth), a dramatically better result. Don't read −$3,550 as\n&quot;matching on age + prior earnings gets you within $5,344 of the truth on this dataset&quot; — it\ndoesn't; it's a mechanism illustration on 6 units, not the real method's performance.</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Caution, stated directly:</strong> <em>&quot;nearest-neighbour matching is biased in finite samples.&quot;</em> Even\nwith the <em>correct</em> set of covariates, matching each treated unit to its single nearest (but not\nidentical) control introduces a small residual bias, because &quot;nearest&quot; is rarely &quot;identical&quot; — this\nis a known, structural limitation of the method, not a bug specific to this dataset.</p>\n</aside>\n<h3>9.1 What Stratification and Matching Share</h3>\n<p><em>&quot;Both need identifying conditions and the same recipe offers.&quot;</em></p>\n<ul>\n<li>Both rest on the same <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math> requirement (unconfoundedness) and overlap\n(positivity).</li>\n<li><strong>Stratification: bucket average.</strong> Matching: nearest twin.</li>\n<li>Same conditions, <strong>different weighting</strong>: stratification averages within a <em>coarse</em> bin (many\nunits pool together); matching pairs one-to-one (finer, but only as fine as the nearest available\nneighbour allows).</li>\n<li><strong>Different variance: strict target the ATE, the ATT</strong> — the specific choice of which estimand each\nis naturally suited to compute can differ. Both attach <math data-tex=\"\\hat Y(0)\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from neighbours. <strong>Could we model\nit directly?</strong> — this question is the explicit pivot into <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>'s regression adjustment.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-22-s12\" data-title=\"The Curse of Dimensionality\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">The Curse of Dimensionality</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Cells grow exponentially; the sample does not.&quot;</em></p>\n<ul>\n<li><strong>Exact matching:</strong> each trainee in the <strong>same cell</strong> as a control.</li>\n<li><strong>Coarsen <math data-tex=\"p\"><mi>p</mi></math> traits into 3 levels; cells grow as <math data-tex=\"3^p\"><msup><mn>3</mn><mi>p</mi></msup></math>:</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\#\\text{cells} = 3^p \\implies 3^8 = 6{,}561\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>#</mi><mtext>cells</mtext><mo>=</mo><msup><mn>3</mn><mi>p</mi></msup><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"0.2778em\"></mspace><msup><mn>3</mn><mn>8</mn></msup><mo>=</mo><mn>6,561</mn></mrow></math></div>\n<ul>\n<li>Cells grow <strong>exponentially</strong>; sample stays at <strong>185 trainees.</strong></li>\n<li>At <math data-tex=\"p=8\"><mrow><mi>p</mi><mo>=</mo><mn>8</mn></mrow></math>: only <strong>42 cells hold both groups (0.6%).</strong></li>\n<li><strong>Curse of dimensionality:</strong> each trait empties cells further.</li>\n</ul>\n<p>🧪 <strong>Worked example, the full progression</strong> (traits matched on, <math data-tex=\"p\"><mi>p</mi></math>, from 1 to 8):</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><math data-tex=\"p\"><mi>p</mi></math> (traits)</th>\n<th>Cells created (<math data-tex=\"3^p\"><msup><mn>3</mn><mi>p</mi></msup></math>)</th>\n<th>Cells holding both groups</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>3</td>\n<td>~2</td>\n</tr>\n<tr>\n<td>4</td>\n<td>81</td>\n<td>~12</td>\n</tr>\n<tr>\n<td>8</td>\n<td><strong>6,561</strong></td>\n<td><strong>42</strong> (0.6%)</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is the exact structural argument behind <a class=\"xref\" data-xref-lec=\"dimensionality-reduction-01\" role=\"link\" tabindex=\"0\">Dimensionality Reduction Part\n1</a>'s &quot;curse of dimensionality&quot; for\nkNN (corrected from a previous &quot;Lecture 20&quot; mislabel — that lecture is Sequential Learning Part 3;\nthe curse-of-dimensionality/kNN argument is actually Lecture 07, Dimensionality Reduction Part 1),\napplied here to causal inference.</strong> Exact matching on even a modest number\nof coarsened traits creates a combinatorially exploding number of possible cells, while the actual\nsample size stays fixed. Once cells vastly outnumber data points, almost every cell is either empty\nor contains only one arm — leaving no like-with-like comparison possible for most units. This is\nprecisely the motivation for reducing <math data-tex=\"X\"><mi>X</mi></math> to a single scalar summary — the propensity score (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>) —\nrather than matching on raw, high-dimensional covariates directly.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s13\" data-title=\"Propensity Score\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">Propensity Score</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;One scalar summary of the covariates that the estimate can hinge on.&quot;</em></p>\n<ul>\n<li><strong>Exact matches infeasible in high dimensions</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s direct motivation).</li>\n</ul>\n<blockquote class=\"aside-quote\">\n<p><strong>Propensity score</strong> — probability of treatment given covariates.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"e(x) = P(T{=}1\\mid X{=}x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<ul>\n<li><strong>Reduces <math data-tex=\"X\"><mi>X</mi></math> to a single scalar</strong> in <math data-tex=\"(0,1)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math> via logistic regression.</li>\n<li><strong>Equal <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> makes units comparable, even if raw traits differ.</strong></li>\n<li><strong>Goal is balance, not prediction:</strong> include every <strong>confounder</strong>, not the best predictor of <math data-tex=\"T\"><mi>T</mi></math>.</li>\n<li><strong>Strong <math data-tex=\"T\"><mi>T</mi></math>-predictor pushes scores to extremes, inflating weights.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example — confounders-only vs. adding a strong T-predictor:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Model spec</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Confounders only</td>\n<td>Heaviest control holds 47.6% of the weighted mean; <strong>ATT = $1,057</strong></td>\n</tr>\n<tr>\n<td>+ a strong <math data-tex=\"T\"><mi>T</mi></math>-predictor</td>\n<td>Heaviest control holds 71.9% of the weighted mean (extreme concentration); <strong>ATT = $733</strong></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most counterintuitive design rule in this section, worth internalizing.</strong> It is\ntempting to build the propensity model to predict treatment as <em>accurately as possible</em> — but this\nis exactly the wrong goal. Including a variable that predicts <math data-tex=\"T\"><mi>T</mi></math> very strongly (but isn't a genuine\nconfounder of the <math data-tex=\"Y\"><mi>Y</mi></math> relationship) pushes propensity scores toward 0 or 1 for many units, which\n(as <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a> shows) inflates the weights those units carry to dangerous extremes. <strong>The goal is balance\nacross covariates that matter for <math data-tex=\"Y\"><mi>Y</mi></math>, not predictive accuracy for <math data-tex=\"T\"><mi>T</mi></math>.</strong></p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s14\" data-title=\"Inverse-Probability Weighting (IPW)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">Inverse-Probability Weighting (IPW)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Each unit's score <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> determines its weight and its influence on the estimate.&quot;</em></p>\n<ul>\n<li><strong>Weight each unit by the inverse of its assignment probability.</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATT}} = \\underbrace{\\frac{\\sum_i T_iY_i}{\\sum_i T_i}}_{\\hat{\\mathbb{E}}[Y(1)\\mid T=1]} - \\underbrace{\\frac{\\sum_i (1-T_i)\\frac{e(X_i)}{1-e(X_i)}Y_i}{\\sum_i (1-T_i)\\frac{e(X_i)}{1-e(X_i)}}}_{\\hat{\\mathbb{E}}[Y(0)\\mid T=1]}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mrow><munder><munder><mfrac><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msub><mi>T</mi><mi>i</mi></msub><msub><mi>Y</mi><mi>i</mi></msub></mrow><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msub><mi>T</mi><mi>i</mi></msub></mrow></mfrac><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mrow><mover><mi>𝔼</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></munder></mrow><mo>−</mo><mrow><munder><munder><mfrac><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mfrac><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac><msub><mi>Y</mi><mi>i</mi></msub></mrow><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mfrac><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac></mrow></mfrac><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mrow><mover><mi>𝔼</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></munder></mrow></mrow></math></div>\n<p><em>Horvitz-Thompson ATT: trainee mean minus odds-weighted control mean.</em></p>\n<p><strong>Words before symbols:</strong> the treated group's own mean earnings needs no reweighting (it's just the\nplain average of treated outcomes). The control group's mean is reweighted so that controls who\n<em>looked</em> more like a typical trainee (i.e., had higher <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, a higher probability of being treated\ngiven their covariates) count for more — pulling the weighted control mean toward what the treated\ngroup's untreated outcome would plausibly have looked like.</p>\n<ul>\n<li><strong>Odds weight <math data-tex=\"e/(1-e)\"><mrow><mi>e</mi><mi>/</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> spikes</strong> as a control looks treatment-like.</li>\n<li><strong>Low-overlap units carry enormous weight.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example, extreme concentration:</strong> <em>&quot;2 of 185 controls (1.1%) carry 66.3% of the control\nweight&quot;</em> — just two atypical control units, whose covariates happen to make them look unusually\ntreatment-like, dominate two-thirds of the entire weighted control estimate.</p>\n<h3>12.1 Extreme Weights and Trimming</h3>\n<p><em>&quot;Near-zero propensity scores let one unit dominate the estimate.&quot;</em></p>\n<ul>\n<li><math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> near 0 makes <math data-tex=\"1/e(x)\"><mrow><mn>1</mn><mi>/</mi><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> <strong>explode</strong>; ATT mirrors this for near-1 controls.</li>\n<li><strong>Untrimmed: one trainee carries 16.7% of the weighted estimate</strong> ($1,173 total).</li>\n<li><strong>Estimate depends on a single observation:</strong> high variance, unstable.</li>\n<li><strong>Trimming caps extreme weights, trading variance for bias with no rule for how much.</strong></li>\n<li><strong>Principled alternatives:</strong> <strong>Stabilised weights</strong> <math data-tex=\"P(T)/e(X)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>/</mi><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (same target, smaller variance);\n<strong>overlap weights</strong> <math data-tex=\"e(x)(1-e(x))\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (smooth downweighting instead of a hard cap).</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — trimming is a bias-variance trade you must choose, not a solved problem.</strong>\nCapping extreme weights reduces the variance (one freak observation can no longer single-handedly\nswing the estimate) but changes <em>which population</em> the estimate now describes (you've implicitly\ndropped or downweighted the least-comparable units), which introduces its own bias relative to the\noriginal estimand. The slide is explicit that there's &quot;no rule for how much&quot; to trim — this is a\njudgment call, not a formula.</p>\n</aside>\n<h3>12.2 Weighting versus Matching on the Score</h3>\n<p><em>&quot;The same <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, two uses with different theoretical standing.&quot;</em></p>\n<ul>\n<li><strong>Weighting on the score:</strong> Horvitz-Thompson is <strong>consistent</strong> under standard assumptions.</li>\n<li><strong>PS matching can worsen balance;</strong> not the recommended estimator.</li>\n<li>Matching on the score <strong>builds intuition only.</strong></li>\n<li>Both need the same <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math> and overlap. <strong>A good <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> matters more than the\nestimator.</strong></li>\n</ul>\n<p>🧪 <strong>Worked comparison, where each landed:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Estimate</th>\n<th>Gap from truth ($1,794)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Naive</td>\n<td>−$8,498</td>\n<td>$10,292</td>\n</tr>\n<tr>\n<td>IPW</td>\n<td>$1,173</td>\n<td>$621</td>\n</tr>\n<tr>\n<td><strong>IPW trimmed</strong></td>\n<td><strong>$1,238</strong></td>\n<td><strong>$556</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;IPW trimmed is $556 below the trial truth ($1,794).&quot;</em> Trimming the extreme weights identified in\n<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12.1\" role=\"link\" tabindex=\"0\">§12.1</a> measurably improved the estimate's proximity to the known truth on this dataset.</p>\n<hr>\n</section><section id=\"causal-inference-22-s15\" data-title=\"Regression Adjustment (Standardisation)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">Regression Adjustment (Standardisation)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Model the outcome instead of the treatment.&quot;</em></p>\n<ul>\n<li><strong>IPW modelled treatment; regression adjustment models the outcome:</strong> fit $\\hat\\mu_t(x) =\n\\mathbb{E}[Y\\mid T{=}t,X{=}x]$, impute the missing arm.</li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATE}} = \\frac{1}{n}\\sum_{i=1}^{n}\\big[\\hat\\mu_1(X_i) - \\hat\\mu_0(X_i)\\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATE</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<ul>\n<li><strong>Added assumption:</strong> correct <strong>functional form</strong> for <math data-tex=\"\\hat\\mu_t\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi></msub></math>.</li>\n<li><strong>Reports a gap at every <math data-tex=\"x\"><mi>x</mi></math>, even where one arm has no data.</strong></li>\n<li><strong>Beyond support it extrapolates:</strong> matching <em>refuses</em>, IPW <em>diverges</em>, regression <em>still prints a\nnumber</em> — a meaningfully different (and riskier) failure mode than the other two methods.</li>\n<li><strong>One nuisance each: IPW trusts <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, regression trusts <math data-tex=\"\\hat\\mu_t(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</strong> Next: <strong>combine both.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example — the danger of silent extrapolation:</strong> restricting the fitted regression line to\ncontrols only up to <strong>age 50</strong> (near the edge of the trainee age range) still lets the model print a\n<strong>regression estimate of −$8,427</strong> at that boundary — a confidently stated number in a region where\nthe underlying data support is thin (the chart's own log-scale bar count of &quot;controls kept within ±3\nyr of each age&quot; shows this region has far fewer supporting observations than the dense middle of the\nage range).</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The core warning of this section, worth remembering as a general principle.</strong> Unlike matching\n(which simply has no neighbor to offer, and therefore no estimate, when support is missing) and IPW\n(whose weights explicitly blow up and signal instability when overlap is poor), a regression model\nwill happily extrapolate a smooth curve into regions with little or no real data — and the output\nlooks exactly as confident and well-formatted as an output backed by solid data. <strong>A regression-based\ncausal estimate always needs a companion check of where the covariate support actually is</strong>, or it\ncan silently report a number in a region the data can't actually speak to.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s16\" data-title=\"Doubly Robust Estimation (AIPW)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">14</span>\n      <span class=\"sec-t\">Doubly Robust Estimation (AIPW)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;An outcome regression corrected by an inverse-probability term, consistent if either nuisance model\nis right.&quot;</em></p>\n<ul>\n<li><strong>Prior estimators rely on a single nuisance; this combines both.</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\hat\\psi_a = \\frac{1}{n}\\sum_i\\left[\\hat\\mu_a(X_i) + \\frac{\\mathbb{1}\\{T_i{=}a\\}}{\\hat e_a(X_i)}\\big(Y_i-\\hat\\mu_a(X_i)\\big)\\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mover><mi>ψ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>i</mi></munder></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mfrac><mrow><mn>𝟙</mn><mo form=\"prefix\" stretchy=\"false\">{</mo><msub><mi>T</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">}</mo></mrow><mrow><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></mfrac><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> start from the regression prediction <math data-tex=\"\\hat\\mu_a(X_i)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>'s approach), then\n<em>correct</em> it with an inverse-probability-weighted residual term — how far off the regression's\nprediction was for units actually observed in arm <math data-tex=\"a\"><mi>a</mi></math>, weighted by the inverse propensity. If the\nregression model is already correct, that correction term averages to roughly zero and does no harm.\nIf the regression model is wrong but the propensity model is right, the correction term does the\nwork of fixing the regression's mistake.</p>\n<ul>\n<li><strong>Effect estimate:</strong> <math data-tex=\"\\hat\\psi_1 - \\hat\\psi_0 \\approx +\\$1{,}269\"><mrow><msub><mover><mi>ψ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo>−</mo><msub><mover><mi>ψ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,269</mn></mrow></math>.</li>\n<li><strong>Double robustness:</strong> consistent if <strong>either</strong> <math data-tex=\"\\hat\\mu_a\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> or <math data-tex=\"\\hat e_a\"><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> is correct.</li>\n<li><strong>Bias is the product of the two errors.</strong> Foundation for <strong>Neyman orthogonality</strong> and <strong>DML</strong>\n(Double/Debiased Machine Learning).</li>\n<li><strong>If both wrong, can be worse; the fast rate also needs cross-fitting.</strong></li>\n</ul>\n<p>🧪 <strong>Worked demonstration — the four-cell &quot;nuisance specification&quot; grid:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Propensity ✓</th>\n<th>Propensity ✗</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Outcome ✓</strong></td>\n<td><strong>both correct</strong> → consistent</td>\n<td>outcome only → <strong>consistent</strong></td>\n</tr>\n<tr>\n<td><strong>Outcome ✗</strong></td>\n<td>propensity only → <strong>consistent</strong></td>\n<td>both wrong → <strong>biased</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>Three of the four cells are consistent — only the &quot;both wrong&quot; cell fails. With both models\ndeliberately misspecified, the demo shows a <strong>both-wrong estimate carrying extra bias</strong>, away from\nthe $1,794 truth, versus the correctly specified AIPW estimate landing at <strong>$1,269</strong>.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — &quot;doubly robust&quot; names a genuine, provable property, not just marketing.</strong> The\ntable above is the concrete meaning of &quot;doubly robust&quot;: you get a <em>consistent</em> (asymptotically\ncorrect) estimate as long as <strong>at least one</strong> of the two models — the outcome model <math data-tex=\"\\hat\\mu_a\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> or\nthe propensity model <math data-tex=\"\\hat e_a\"><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> — is correctly specified. You don't need to know <em>in advance</em> which\none is right; AIPW protects you either way, at the cost of needing both models fit in the first\nplace. This is exactly why it's presented as the natural endpoint of the &quot;one nuisance each&quot; limit\nation named at the end of <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s17\" data-title=\"Estimates Compared — The Full Scoreboard\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">15</span>\n      <span class=\"sec-t\">Estimates Compared — The Full Scoreboard</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Each estimator on the job-training data, measured against the randomised-trial truth.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\text{gap} = |\\widehat{\\text{ATT}} - \\text{ATT}|\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>gap</mtext><mo>=</mo><mi>|</mi><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>−</mo><mtext>ATT</mtext><mi>|</mi></mrow></math></div>\n<p><em>distance from each estimate to the known truth line</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Estimator</th>\n<th>Estimate</th>\n<th>Gap from truth ($1,794)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Naive comparison</td>\n<td><strong>−$8,498</strong></td>\n<td>$10,292 — <strong>wrong-signed</strong></td>\n</tr>\n<tr>\n<td>Regression adjust</td>\n<td>$699</td>\n<td>$1,095</td>\n</tr>\n<tr>\n<td>5-strata on propensity</td>\n<td>−$129</td>\n<td>$1,923</td>\n</tr>\n<tr>\n<td>Nearest-neighbour match</td>\n<td>$2,037</td>\n<td>$243</td>\n</tr>\n<tr>\n<td>IPW (weighting)</td>\n<td>$1,173</td>\n<td>$621</td>\n</tr>\n<tr>\n<td>IPW + trim to overlap</td>\n<td>$1,238</td>\n<td>$556</td>\n</tr>\n<tr>\n<td><strong>AIPW (doubly robust)</strong></td>\n<td><strong>$1,269</strong></td>\n<td><strong>$525 — closest to truth</strong></td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Truth:</strong> <math data-tex=\"\\widehat{\\text{ATT}}\\approx+\\$1{,}794\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,794</mn></mrow></math>.</li>\n<li><strong>Naive</strong> −$8,498, wrong in sign.</li>\n<li><strong>Adjustment recovers the sign:</strong> matching, weighting, AIPW all land near truth.</li>\n<li><strong>AIPW +$1,269:</strong> consistent if either nuisance correct.</li>\n<li><strong>Overlap matters more than estimator choice.</strong></li>\n<li><strong>Every bar rests on two models: who trains, what each would earn.</strong></li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — the single most important empirical finding of the whole lecture, stated\ndirectly.</strong> <em>&quot;Overlap matters more than estimator choice.&quot;</em> Notice that nearest-neighbour matching\n(gap $243) actually <em>outperformed</em> several more theoretically sophisticated methods here (5-strata:\ngap $1,923; plain IPW: gap $621) on <em>this specific dataset</em> — not because matching is generally\nsuperior, but because the sample happened to have reasonably good overlap for the covariates\nmatching used. No estimator, however sophisticated, can fully compensate for poor covariate overlap\n(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>'s positivity) — this is why the lecture spent an entire section on positivity/common support\nbefore ever introducing an estimation method.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s18\" data-title=\"From Classical Estimation to Machine Learning\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">16</span>\n      <span class=\"sec-t\">From Classical Estimation to Machine Learning</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Bucketing, matching and reweighting all rest on the same two functions to be learned.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Nuisance Function 1 — <strong>Propensity</strong></th>\n<th>Nuisance Function 2 — <strong>Outcome</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"e(x) = P(T{=}1\\mid X{=}x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td><math data-tex=\"\\mu_t(x) = \\mathbb{E}[Y\\mid T{=}t, X{=}x]\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n</tr>\n<tr>\n<td>&quot;Who was likely to train, given covariates <math data-tex=\"X\"><mi>X</mi></math>.&quot;</td>\n<td>&quot;What each unit would earn in arm <math data-tex=\"t\"><mi>t</mi></math> at covariates <math data-tex=\"X\"><mi>X</mi></math>.&quot;</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>A few traits by hand; with hundreds, both must be learned.</strong></li>\n<li><strong>Flexible ML models estimate <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> in place of hand-built fits.</strong></li>\n<li><strong>Caveat: better prediction is not the same as a better effect estimate.</strong></li>\n</ul>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>The explicit bridge to the next lecture.</strong> Every method in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a> — stratification, matching,\npropensity weighting, regression adjustment, AIPW — is, underneath, an estimate of one or both of\nexactly these two functions: <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. With only a handful of covariates (as in this\ndataset), hand-built logistic regression and linear models suffice. With hundreds of covariates,\nflexible machine learning models (random forests, gradient boosting, neural networks) become\nnecessary to estimate these same two functions well — but the closing caveat is worth taking\nseriously: a model that is excellent at <em>predicting</em> <math data-tex=\"T\"><mi>T</mi></math> or <math data-tex=\"Y\"><mi>Y</mi></math> is not automatically excellent at\nproducing an unbiased <em>causal effect estimate</em>, for exactly the reason <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a> warned about (a strong\n<math data-tex=\"T\"><mi>T</mi></math>-predictor inflates weights) and <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a> warned about (a strong <math data-tex=\"Y\"><mi>Y</mi></math>-predictor can still be a mediator\nor collider). This tension is presumably the starting point of Lecture 23.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s19\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>                ┌───────────────────────────────────────┐\n                │  Naive <math data-tex=\"-8,498  vs.  Randomized\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>8,498</mn><mi>v</mi><mi>s</mi><mi>.</mi><mi>R</mi><mi>a</mi><mi>n</mi><mi>d</mi><mi>o</mi><mi>m</mi><mi>i</mi><mi>z</mi><mi>e</mi><mi>d</mi></mrow></math>1,794  │\n                │  same data, opposite signs                │\n                └──────────────────┬────────────────────────┘\n                                   │  decomposes exactly into\n                                   ▼\n              naive = ATT + selection bias\n              (<math data-tex=\"1,794)   (the rest of the -\"><mrow><mn>1,794</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mi>h</mi><mi>e</mi><mi>r</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>o</mi><mi>f</mi><mi>t</mi><mi>h</mi><mi>e</mi><mo>−</mo></mrow></math>8,498 gap)\n                                   │\n                    ┌──────────────┴───────────────┐\n                    ▼                               ▼\n        Which covariates FIX this?         Which covariates BREAK this further?\n        Confounders — adjusting            Mediators (-<math data-tex=\"110), colliders (-\"><mrow><mn>110</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mi>c</mi><mi>o</mi><mi>l</mi><mi>l</mi><mi>i</mi><mi>d</mi><mi>e</mi><mi>r</mi><mi>s</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">−</mo></mrow></math>806) —\n        removes selection bias             adjusting fabricates NEW bias\n                    │                               │\n                    └──────────────┬────────────────┘\n                                   ▼\n              Three assumptions must hold for adjustment to work AT ALL:\n              unconfoundedness (untestable) · positivity (185/185 have overlap at\n              baseline; a simulated +9yr shift drops this to 118/185) · SUTVA\n              (spillover understates: <math data-tex=\"987 vs\"><mrow><mn>987</mn><mi>v</mi><mi>s</mi></mrow></math>1,794)\n                                   │\n                    ┌──────────────┴────────────────┐\n                    ▼                                ▼\n        High-dimensional matching FAILS      Propensity score e(x) reduces\n        (curse of dimensionality:            X to one scalar — but must be\n        6,561 cells, 42 populated)           built for BALANCE, not prediction\n                    │                                │\n                    └──────────────┬─────────────────┘\n                                   ▼\n        Six concrete estimators, all scored against the SAME known $1,794:\n        stratification · matching · IPW (+trimming) · regression adjustment\n        · AIPW (doubly robust — consistent if EITHER nuisance model is right)\n                                   │\n                                   ▼\n        Finding: overlap matters more than estimator sophistication —\n        AND every method reduces to estimating e(x) and μ_t(x), which\n        is exactly where flexible ML models take over next</pre></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li><strong>Every abstract claim is immediately cashed out as a real number on the same dataset.</strong> This is\nwhat distinguishes this lecture from Lecture 21's citation-driven theory: &quot;selection bias&quot; isn't\njust defined, it's decomposed algebraically and then shown moving the estimate from −$8,498\ntoward +$1,794 as covariates are balanced one at a time; &quot;doubly robust&quot; isn't just asserted, it's\ndemonstrated across all four cells of the correct/incorrect specification grid with actual dollar\nfigures.</li>\n<li><strong>Adjusting for a covariate is not automatically progress — it depends entirely on the covariate's\ncausal role</strong>, and this lecture is unusually generous with contrasting concrete numbers to make\nthat point stick: age alone (a genuine but weak confounder here) barely moves the estimate\n(-$8,279); the mediator control produces -$110; the collider control produces -$806; the full\nconfounder set recovers $1,794. Four different outcomes from four different choices of &quot;what to\ncontrol for,&quot; on the identical dataset.</li>\n<li><strong>&quot;Overlap matters more than estimator choice&quot; is the lecture's single most important, and most\nunderrated, empirical lesson.</strong> It's tempting to treat estimator selection (matching vs. IPW vs.\nAIPW vs. regression) as the central skill in causal inference. This lecture's own scoreboard\n(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>) shows a simpler, more basic estimator (nearest-neighbor matching) beating more\nsophisticated ones on this dataset, purely because of how the specific covariates happened to\noverlap — a direct empirical argument for checking positivity (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>) before investing effort in\nestimator sophistication.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-22-s20\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">16 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s20\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why can the same dataset produce a randomized-trial estimate of +<math data-tex=\"1,794 and a naive observational estimate of -\"><mrow><mn>1,794</mn><mi>a</mi><mi>n</mi><mi>d</mi><mi>a</mi><mi>n</mi><mi>a</mi><mi>i</mi><mi>v</mi><mi>e</mi><mi>o</mi><mi>b</mi><mi>s</mi><mi>e</mi><mi>r</mi><mi>v</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mi>a</mi><mi>l</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>i</mi><mi>m</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>o</mi><mi>f</mi><mo>−</mo></mrow></math>8,498 for the same program?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The randomized-trial estimate compares the trainee group to a genuinely randomized control group,\nwhich by construction is statistically identical to the treated group on every characteristic except\ntreatment — making the raw gap causal. The naive observational estimate instead compares trainees to\na non-randomized comparison group (e.g., a survey sample) that differs substantially on pre-treatment\ncharacteristics (prior earnings, age, marital status, education) — these pre-existing differences,\nnot the treatment, drive most of the observed gap, which is why it can even flip sign.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Decompose the naive estimator into its two algebraic pieces and explain what each represents.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>$\\mathbb{E}[Y\\mid T{=}1]-\\mathbb{E}[Y\\mid T{=}0] = \\text{ATT} + \\big(\\mathbb{E}[Y(0)\\mid T{=}1] -\n\\mathbb{E}[Y(0)\\mid T{=}0]\\big)$. The first term, ATT, is the real causal effect on the treated. The\nsecond term, selection bias, is the pre-existing gap in what the two groups' <em>untreated</em> outcomes\nwould have looked like — nothing to do with the treatment's effect, purely a baseline difference\nbetween who ended up treated and who didn't.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">A colleague wants to control for every available covariate to \"be safe.\" Using the mediator and collider examples from this dataset, explain the risk.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>On this exact dataset, controlling for a mediator (a variable on the causal path between training and\nearnings) produced a biased estimate of -$110, because part of the treatment's true effect gets\nabsorbed into &quot;explained by the mediator&quot; rather than counted as the treatment's effect. Controlling\nfor a collider (a variable jointly caused by both training and earnings) produced a biased estimate of\n-$806, because conditioning on a collider opens a spurious statistical path that didn't exist before.\nNeither mistake is visible from the data alone — both require knowing the variable's causal role from\ndomain knowledge or a DAG, not from statistical properties of the variable itself.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why is unconfoundedness described as \"untestable,\" and what's the practical consequence?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Unconfoundedness, <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math>, is a statement about the never-jointly-observed\npotential outcomes — specifically, it requires that the treated group's <em>unobserved</em> <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> behaves\nlike the control group's <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> once <math data-tex=\"X\"><mi>X</mi></math> is accounted for, and <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for the treated group is never\nactually seen (the fundamental problem of causal inference). The practical consequence is that no\namount of data exploration can confirm this assumption holds; an unrecorded confounder <math data-tex=\"U\"><mi>U</mi></math> can always\nbe silently biasing the estimate, and the degree of bias grows with <math data-tex=\"U\"><mi>U</mi></math>'s strength in a way the\nobserved data cannot reveal.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What specifically does positivity require, and what does this dataset show about how fragile it can be?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Positivity requires <math data-tex=\"0 &lt; P(T{=}1\\mid X{=}x) &lt; 1\"><mrow><mn>0</mn><mo>&lt;</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&lt;</mo><mn>1</mn></mrow></math> for every covariate value <math data-tex=\"x\"><mi>x</mi></math> — both a treated and an\nuntreated example must exist for every &quot;kind of person&quot; in the data. In this dataset's real,\nunshifted baseline, positivity actually holds well for age: <strong>all 185 of 185</strong> trainees have a\ncomparable control within the overlapping age range. The lecture then runs a simulation — shifting\nthe control population's ages progressively older — to show how fragile that overlap can be: an\nartificial <strong>+9-year shift</strong> of the control ages drops the count to just <strong>118 of 185 (64%)</strong>, with\nthe remaining 36% now falling in age ranges where no comparable control exists at all, meaning any\nestimate for those units would rely on extrapolation rather than genuine like-with-like comparison.\nThe lesson is two-sided: this particular real dataset has good overlap on age, but positivity is a\nfragile, data-specific property that a fairly small distributional shift can break.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the curse of dimensionality's specific numeric consequence for exact matching in this dataset, and how the propensity score fixes it.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Coarsening 8 covariates into 3 levels each creates <math data-tex=\"3^8=6{,}561\"><mrow><msup><mn>3</mn><mn>8</mn></msup><mo>=</mo><mn>6,561</mn></mrow></math> possible cells, but the sample has\nonly 185 trainees — so only 42 cells (0.6%) actually contain both a treated and control unit,\nleaving the vast majority of possible covariate combinations with no valid like-with-like comparison.\nThe propensity score fixes this by collapsing the entire 8-dimensional covariate vector into a single\nscalar, <math data-tex=\"e(x)=P(T{=}1\\mid X{=}x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — two units with equal (or similar) propensity scores are treated as\ncomparable, regardless of how their raw covariates differ, avoiding the exponential cell-emptying\nproblem entirely.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why should a propensity model be built to include confounders rather than to maximize prediction of treatment?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The propensity score's purpose is to produce <em>balance</em> — comparable groups after weighting or\nstratifying — not to predict treatment assignment as accurately as possible. Including a variable that\nstrongly predicts treatment but isn't a genuine confounder of the outcome pushes many units' scores\ntoward the extremes (near 0 or 1), which inflates inverse-probability weights and destabilizes the\nestimate (as shown directly in this dataset, where 2 of 185 controls ended up carrying 66.3% of the\ntotal control weight) — worsening precision without improving, and potentially harming, the validity\nof the causal estimate.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does \"doubly robust\" mean precisely, and what's the one scenario where AIPW is not guaranteed correct?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>AIPW is consistent (asymptotically unbiased) if <em>at least one</em> of its two nuisance models — the\noutcome regression <math data-tex=\"\\hat\\mu_a(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> or the propensity model <math data-tex=\"\\hat e_a(x)\"><mrow><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — is correctly specified; you\ndon't need to know in advance which one is right. The one scenario without this guarantee is when\n<em>both</em> models are misspecified simultaneously — in that case AIPW's bias is the <em>product</em> of the two\nindividual errors, and the estimate can end up worse than either single-nuisance method alone.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] On this dataset, nearest-neighbor matching (gap <math data-tex=\"243) outperformed 5-strata propensity stratification (gap\"><mrow><mn>243</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>o</mi><mi>u</mi><mi>t</mi><mi>p</mi><mi>e</mi><mi>r</mi><mi>f</mi><mi>o</mi><mi>r</mi><mi>m</mi><mi>e</mi><mi>d</mi><mn>5</mn><mo>−</mo><mi>s</mi><mi>t</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>a</mi><mi>p</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>e</mi><mi>n</mi><mi>s</mi><mi>i</mi><mi>t</mi><mi>y</mi><mi>s</mi><mi>t</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>f</mi><mi>i</mi><mi>c</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>g</mi><mi>a</mi><mi>p</mi></mrow></math>1,923) and even plain IPW (gap $621). Does this mean matching is generally the better method?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>No — the lecture's own conclusion is that &quot;overlap matters more than estimator choice.&quot; Matching's\nstrong performance here reflects that the specific covariates it matched on (age and prior earnings)\nhappened to have reasonably good overlap between arms for this dataset, not that nearest-neighbor\nmatching is theoretically superior to propensity-based or doubly robust methods in general. A\ndifferent dataset with poorer overlap on those same covariates, or better overlap on covariates\nmatching didn't use, could easily reverse this ranking — the lesson is to check positivity/overlap\ndirectly rather than assuming any one estimator is uniformly best.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Explain why regression adjustment's ability to \"still print a number\" beyond the region of covariate overlap is specifically dangerous, contrasted with matching and IPW's behavior in the same situation.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Outside common support, matching has no comparable neighbor to offer and simply cannot produce an\nestimate for that unit, and IPW's weights explicitly explode toward infinity as the propensity score\napproaches 0 or 1 — both failure modes are visible and hard to ignore. Regression adjustment, by\ncontrast, fits a smooth functional form and will happily extrapolate that curve into regions with\nthin or no data (as shown directly in this dataset's age-50 example, still confidently printing\n-$8,427), producing an output that looks exactly as well-formed as a properly supported estimate.\nThis is why a regression-based causal estimate always needs an explicit, separate check of where the\nactual covariate support lies — the method itself provides no built-in warning signal.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;IPW's untrimmed estimate had one trainee carrying 16.7% of the weighted estimate — what does\ntrimming trade away to fix this, and why is there 'no rule for how much'?&quot;</em> — trimming reduces\nvariance (no single freak observation can dominate) at the cost of bias (you've implicitly changed\nwhich population the estimate describes, by excluding or downweighting the least-comparable units),\nand there's no universal rule because the right trade-off point depends on how much bias vs.\nvariance the specific downstream decision can tolerate — a judgment call, not a closed-form answer.</li>\n<li><em>&quot;Why does the propensity-score-matching result explicitly get called out as 'not the recommended\nestimator' even though weighting on the identical score is called consistent?&quot;</em> — because matching\non a fitted score is a nearest-neighbor procedure inheriting the same finite-sample bias issue as\nraw covariate matching (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s caution), while weighting is a smooth, asymptotically justified\nestimator (Horvitz-Thompson) — same underlying score, different statistical properties depending on\nhow it's used.</li>\n<li><em>&quot;The lecture says stronger unobserved confounders 'drift the estimate further from truth, and data\ncannot say how much' — what does this imply about presenting a single point-estimate causal effect\nfrom observational data?&quot;</em> — a responsible presentation should accompany any observational causal\nestimate with sensitivity analysis (how large would an unobserved confounder need to be to\noverturn the conclusion?) rather than presenting a single number with false precision, since the\ndata alone cannot rule out the presence of such a confounder.</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>The naive-estimate decomposition</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a>: derive\n$\\mathbb{E}[Y\\mid T{=}1]-\\mathbb{E}[Y\\mid T{=}0] = \\text{ATT} + (\\mathbb{E}[Y(0)\\mid T{=}1] -\n\\mathbb{E}[Y(0)\\mid T{=}0])<math data-tex=\"by adding and subtracting\"><mrow><mi>b</mi><mi>y</mi><mi>a</mi><mi>d</mi><mi>d</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>a</mi><mi>n</mi><mi>d</mi><mi>s</mi><mi>u</mi><mi>b</mi><mi>t</mi><mi>r</mi><mi>a</mi><mi>c</mi><mi>t</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></math>\\mathbb{E}[Y(0)\\mid T{=}1]$ inside the\nnaive gap, then group terms.</li>\n<li><strong>The stratification formula as a weighted average</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>: reproduce\n<math data-tex=\"\\widehat{\\text{ATT}}=\\sum_k \\frac{n_{1,k}}{n_1}(\\bar Y_{1,k}-\\bar Y_{0,k})\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><msub><mo movablelimits=\"false\">∑</mo><mi>k</mi></msub><mfrac><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, and explain why the\nweight <math data-tex=\"n_{1,k}/n_1\"><mrow><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mi>/</mi><msub><mi>n</mi><mn>1</mn></msub></mrow></math> (treated share in bin <math data-tex=\"k\"><mi>k</mi></math>) rather than total share is the correct weighting\nfor targeting the ATT specifically.</li>\n<li><strong>Why the curse of dimensionality's cell count grows as <math data-tex=\"3^p\"><msup><mn>3</mn><mi>p</mi></msup></math></strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>: for <math data-tex=\"p\"><mi>p</mi></math> coarsened covariates\neach split into 3 levels, the number of distinct combinations is <math data-tex=\"3\\times3\\times\\cdots\\times3=3^p\"><mrow><mn>3</mn><mo>×</mo><mn>3</mn><mo>×</mo><mo>⋯</mo><mo>×</mo><mn>3</mn><mo>=</mo><msup><mn>3</mn><mi>p</mi></msup></mrow></math>\n(multiplication principle), while the number of <em>units</em> available to populate those cells stays\nfixed at the sample size — explaining why populated-cell fraction collapses as <math data-tex=\"p\"><mi>p</mi></math> grows.</li>\n</ol>\n<h3>Applied scenario — Amazon fulfillment-center process change</h3>\n<p><strong>Framing:</strong> Amazon wants to know whether a new pick-path optimization deployed in some fulfillment\ncenters (but not others, due to a staggered rollout rather than randomization) causally reduced order\nprocessing time.</p>\n<p><strong>Data:</strong> Observational — processing times from centers that adopted the new pick-path system at\ndifferent times, plus centers that haven't adopted it yet, with covariates like center size, average\nstaff tenure, order volume, and inventory density.</p>\n<p><strong>Model:</strong> This maps directly onto the lecture's framework. The &quot;naive&quot; comparison (adopted vs.\nnot-yet-adopted centers' raw average processing times) risks exactly the selection-bias problem in\n<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a> — centers that adopt new systems earlier may systematically differ (better-resourced, more\ntech-forward management, different baseline volume) from later adopters, echoing the survey-vs-RCT\ncomparison-group gap in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>. Before computing anything, apply <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>'s good/bad control discipline:\nadjust for center size, tenure, and volume (plausible confounders of both adoption timing and\nprocessing speed) but explicitly avoid adjusting for any post-adoption operational metric that the\npick-path change itse
