at distinguishes this lecture from Lecture 21's citation-driven theory: &quot;selection bias&quot; isn't\njust defined, it's decomposed algebraically and then shown moving the estimate from −$8,498\ntoward +$1,794 as covariates are balanced one at a time; &quot;doubly robust&quot; isn't just asserted, it's\ndemonstrated across all four cells of the correct/incorrect specification grid with actual dollar\nfigures.</li>\n<li><strong>Adjusting for a covariate is not automatically progress — it depends entirely on the covariate's\ncausal role</strong>, and this lecture is unusually generous with contrasting concrete numbers to make\nthat point stick: age alone (a genuine but weak confounder here) barely moves the estimate\n(-$8,279); the mediator control produces -$110; the collider control produces -$806; the full\nconfounder set recovers $1,794. Four different outcomes from four different choices of &quot;what to\ncontrol for,&quot; on the identical dataset.</li>\n<li><strong>&quot;Overlap matters more than estimator choice&quot; is the lecture's single most important, and most\nunderrated, empirical lesson.</strong> It's tempting to treat estimator selection (matching vs. IPW vs.\nAIPW vs. regression) as the central skill in causal inference. This lecture's own scoreboard\n(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>) shows a simpler, more basic estimator (nearest-neighbor matching) beating more\nsophisticated ones on this dataset, purely because of how the specific covariates happened to\noverlap — a direct empirical argument for checking positivity (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>) before investing effort in\nestimator sophistication.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-22-s20\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">16 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s20\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why can the same dataset produce a randomized-trial estimate of +<math data-tex=\"1,794 and a naive observational estimate of -\"><mrow><mn>1,794</mn><mi>a</mi><mi>n</mi><mi>d</mi><mi>a</mi><mi>n</mi><mi>a</mi><mi>i</mi><mi>v</mi><mi>e</mi><mi>o</mi><mi>b</mi><mi>s</mi><mi>e</mi><mi>r</mi><mi>v</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mi>a</mi><mi>l</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>i</mi><mi>m</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>o</mi><mi>f</mi><mo>−</mo></mrow></math>8,498 for the same program?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The randomized-trial estimate compares the trainee group to a genuinely randomized control group,\nwhich by construction is statistically identical to the treated group on every characteristic except\ntreatment — making the raw gap causal. The naive observational estimate instead compares trainees to\na non-randomized comparison group (e.g., a survey sample) that differs substantially on pre-treatment\ncharacteristics (prior earnings, age, marital status, education) — these pre-existing differences,\nnot the treatment, drive most of the observed gap, which is why it can even flip sign.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Decompose the naive estimator into its two algebraic pieces and explain what each represents.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>$\\mathbb{E}[Y\\mid T{=}1]-\\mathbb{E}[Y\\mid T{=}0] = \\text{ATT} + \\big(\\mathbb{E}[Y(0)\\mid T{=}1] -\n\\mathbb{E}[Y(0)\\mid T{=}0]\\big)$. The first term, ATT, is the real causal effect on the treated. The\nsecond term, selection bias, is the pre-existing gap in what the two groups' <em>untreated</em> outcomes\nwould have looked like — nothing to do with the treatment's effect, purely a baseline difference\nbetween who ended up treated and who didn't.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">A colleague wants to control for every available covariate to \"be safe.\" Using the mediator and collider examples from this dataset, explain the risk.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>On this exact dataset, controlling for a mediator (a variable on the causal path between training and\nearnings) produced a biased estimate of -$110, because part of the treatment's true effect gets\nabsorbed into &quot;explained by the mediator&quot; rather than counted as the treatment's effect. Controlling\nfor a collider (a variable jointly caused by both training and earnings) produced a biased estimate of\n-$806, because conditioning on a collider opens a spurious statistical path that didn't exist before.\nNeither mistake is visible from the data alone — both require knowing the variable's causal role from\ndomain knowledge or a DAG, not from statistical properties of the variable itself.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why is unconfoundedness described as \"untestable,\" and what's the practical consequence?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Unconfoundedness, <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math>, is a statement about the never-jointly-observed\npotential outcomes — specifically, it requires that the treated group's <em>unobserved</em> <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> behaves\nlike the control group's <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> once <math data-tex=\"X\"><mi>X</mi></math> is accounted for, and <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for the treated group is never\nactually seen (the fundamental problem of causal inference). The practical consequence is that no\namount of data exploration can confirm this assumption holds; an unrecorded confounder <math data-tex=\"U\"><mi>U</mi></math> can always\nbe silently biasing the estimate, and the degree of bias grows with <math data-tex=\"U\"><mi>U</mi></math>'s strength in a way the\nobserved data cannot reveal.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What specifically does positivity require, and what does this dataset show about how fragile it can be?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Positivity requires <math data-tex=\"0 &lt; P(T{=}1\\mid X{=}x) &lt; 1\"><mrow><mn>0</mn><mo>&lt;</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&lt;</mo><mn>1</mn></mrow></math> for every covariate value <math data-tex=\"x\"><mi>x</mi></math> — both a treated and an\nuntreated example must exist for every &quot;kind of person&quot; in the data. In this dataset's real,\nunshifted baseline, positivity actually holds well for age: <strong>all 185 of 185</strong> trainees have a\ncomparable control within the overlapping age range. The lecture then runs a simulation — shifting\nthe control population's ages progressively older — to show how fragile that overlap can be: an\nartificial <strong>+9-year shift</strong> of the control ages drops the count to just <strong>118 of 185 (64%)</strong>, with\nthe remaining 36% now falling in age ranges where no comparable control exists at all, meaning any\nestimate for those units would rely on extrapolation rather than genuine like-with-like comparison.\nThe lesson is two-sided: this particular real dataset has good overlap on age, but positivity is a\nfragile, data-specific property that a fairly small distributional shift can break.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the curse of dimensionality's specific numeric consequence for exact matching in this dataset, and how the propensity score fixes it.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Coarsening 8 covariates into 3 levels each creates <math data-tex=\"3^8=6{,}561\"><mrow><msup><mn>3</mn><mn>8</mn></msup><mo>=</mo><mn>6,561</mn></mrow></math> possible cells, but the sample has\nonly 185 trainees — so only 42 cells (0.6%) actually contain both a treated and control unit,\nleaving the vast majority of possible covariate combinations with no valid like-with-like comparison.\nThe propensity score fixes this by collapsing the entire 8-dimensional covariate vector into a single\nscalar, <math data-tex=\"e(x)=P(T{=}1\\mid X{=}x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — two units with equal (or similar) propensity scores are treated as\ncomparable, regardless of how their raw covariates differ, avoiding the exponential cell-emptying\nproblem entirely.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why should a propensity model be built to include confounders rather than to maximize prediction of treatment?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The propensity score's purpose is to produce <em>balance</em> — comparable groups after weighting or\nstratifying — not to predict treatment assignment as accurately as possible. Including a variable that\nstrongly predicts treatment but isn't a genuine confounder of the outcome pushes many units' scores\ntoward the extremes (near 0 or 1), which inflates inverse-probability weights and destabilizes the\nestimate (as shown directly in this dataset, where 2 of 185 controls ended up carrying 66.3% of the\ntotal control weight) — worsening precision without improving, and potentially harming, the validity\nof the causal estimate.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does \"doubly robust\" mean precisely, and what's the one scenario where AIPW is not guaranteed correct?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>AIPW is consistent (asymptotically unbiased) if <em>at least one</em> of its two nuisance models — the\noutcome regression <math data-tex=\"\\hat\\mu_a(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> or the propensity model <math data-tex=\"\\hat e_a(x)\"><mrow><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — is correctly specified; you\ndon't need to know in advance which one is right. The one scenario without this guarantee is when\n<em>both</em> models are misspecified simultaneously — in that case AIPW's bias is the <em>product</em> of the two\nindividual errors, and the estimate can end up worse than either single-nuisance method alone.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] On this dataset, nearest-neighbor matching (gap <math data-tex=\"243) outperformed 5-strata propensity stratification (gap\"><mrow><mn>243</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>o</mi><mi>u</mi><mi>t</mi><mi>p</mi><mi>e</mi><mi>r</mi><mi>f</mi><mi>o</mi><mi>r</mi><mi>m</mi><mi>e</mi><mi>d</mi><mn>5</mn><mo>−</mo><mi>s</mi><mi>t</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>a</mi><mi>p</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>e</mi><mi>n</mi><mi>s</mi><mi>i</mi><mi>t</mi><mi>y</mi><mi>s</mi><mi>t</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>f</mi><mi>i</mi><mi>c</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>g</mi><mi>a</mi><mi>p</mi></mrow></math>1,923) and even plain IPW (gap $621). Does this mean matching is generally the better method?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>No — the lecture's own conclusion is that &quot;overlap matters more than estimator choice.&quot; Matching's\nstrong performance here reflects that the specific covariates it matched on (age and prior earnings)\nhappened to have reasonably good overlap between arms for this dataset, not that nearest-neighbor\nmatching is theoretically superior to propensity-based or doubly robust methods in general. A\ndifferent dataset with poorer overlap on those same covariates, or better overlap on covariates\nmatching didn't use, could easily reverse this ranking — the lesson is to check positivity/overlap\ndirectly rather than assuming any one estimator is uniformly best.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Explain why regression adjustment's ability to \"still print a number\" beyond the region of covariate overlap is specifically dangerous, contrasted with matching and IPW's behavior in the same situation.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Outside common support, matching has no comparable neighbor to offer and simply cannot produce an\nestimate for that unit, and IPW's weights explicitly explode toward infinity as the propensity score\napproaches 0 or 1 — both failure modes are visible and hard to ignore. Regression adjustment, by\ncontrast, fits a smooth functional form and will happily extrapolate that curve into regions with\nthin or no data (as shown directly in this dataset's age-50 example, still confidently printing\n-$8,427), producing an output that looks exactly as well-formed as a properly supported estimate.\nThis is why a regression-based causal estimate always needs an explicit, separate check of where the\nactual covariate support lies — the method itself provides no built-in warning signal.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;IPW's untrimmed estimate had one trainee carrying 16.7% of the weighted estimate — what does\ntrimming trade away to fix this, and why is there 'no rule for how much'?&quot;</em> — trimming reduces\nvariance (no single freak observation can dominate) at the cost of bias (you've implicitly changed\nwhich population the estimate describes, by excluding or downweighting the least-comparable units),\nand there's no universal rule because the right trade-off point depends on how much bias vs.\nvariance the specific downstream decision can tolerate — a judgment call, not a closed-form answer.</li>\n<li><em>&quot;Why does the propensity-score-matching result explicitly get called out as 'not the recommended\nestimator' even though weighting on the identical score is called consistent?&quot;</em> — because matching\non a fitted score is a nearest-neighbor procedure inheriting the same finite-sample bias issue as\nraw covariate matching (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s caution), while weighting is a smooth, asymptotically justified\nestimator (Horvitz-Thompson) — same underlying score, different statistical properties depending on\nhow it's used.</li>\n<li><em>&quot;The lecture says stronger unobserved confounders 'drift the estimate further from truth, and data\ncannot say how much' — what does this imply about presenting a single point-estimate causal effect\nfrom observational data?&quot;</em> — a responsible presentation should accompany any observational causal\nestimate with sensitivity analysis (how large would an unobserved confounder need to be to\noverturn the conclusion?) rather than presenting a single number with false precision, since the\ndata alone cannot rule out the presence of such a confounder.</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>The naive-estimate decomposition</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a>: derive\n$\\mathbb{E}[Y\\mid T{=}1]-\\mathbb{E}[Y\\mid T{=}0] = \\text{ATT} + (\\mathbb{E}[Y(0)\\mid T{=}1] -\n\\mathbb{E}[Y(0)\\mid T{=}0])<math data-tex=\"by adding and subtracting\"><mrow><mi>b</mi><mi>y</mi><mi>a</mi><mi>d</mi><mi>d</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>a</mi><mi>n</mi><mi>d</mi><mi>s</mi><mi>u</mi><mi>b</mi><mi>t</mi><mi>r</mi><mi>a</mi><mi>c</mi><mi>t</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></math>\\mathbb{E}[Y(0)\\mid T{=}1]$ inside the\nnaive gap, then group terms.</li>\n<li><strong>The stratification formula as a weighted average</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>: reproduce\n<math data-tex=\"\\widehat{\\text{ATT}}=\\sum_k \\frac{n_{1,k}}{n_1}(\\bar Y_{1,k}-\\bar Y_{0,k})\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><msub><mo movablelimits=\"false\">∑</mo><mi>k</mi></msub><mfrac><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, and explain why the\nweight <math data-tex=\"n_{1,k}/n_1\"><mrow><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mi>/</mi><msub><mi>n</mi><mn>1</mn></msub></mrow></math> (treated share in bin <math data-tex=\"k\"><mi>k</mi></math>) rather than total share is the correct weighting\nfor targeting the ATT specifically.</li>\n<li><strong>Why the curse of dimensionality's cell count grows as <math data-tex=\"3^p\"><msup><mn>3</mn><mi>p</mi></msup></math></strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>: for <math data-tex=\"p\"><mi>p</mi></math> coarsened covariates\neach split into 3 levels, the number of distinct combinations is <math data-tex=\"3\\times3\\times\\cdots\\times3=3^p\"><mrow><mn>3</mn><mo>×</mo><mn>3</mn><mo>×</mo><mo>⋯</mo><mo>×</mo><mn>3</mn><mo>=</mo><msup><mn>3</mn><mi>p</mi></msup></mrow></math>\n(multiplication principle), while the number of <em>units</em> available to populate those cells stays\nfixed at the sample size — explaining why populated-cell fraction collapses as <math data-tex=\"p\"><mi>p</mi></math> grows.</li>\n</ol>\n<h3>Applied scenario — Amazon fulfillment-center process change</h3>\n<p><strong>Framing:</strong> Amazon wants to know whether a new pick-path optimization deployed in some fulfillment\ncenters (but not others, due to a staggered rollout rather than randomization) causally reduced order\nprocessing time.</p>\n<p><strong>Data:</strong> Observational — processing times from centers that adopted the new pick-path system at\ndifferent times, plus centers that haven't adopted it yet, with covariates like center size, average\nstaff tenure, order volume, and inventory density.</p>\n<p><strong>Model:</strong> This maps directly onto the lecture's framework. The &quot;naive&quot; comparison (adopted vs.\nnot-yet-adopted centers' raw average processing times) risks exactly the selection-bias problem in\n<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a> — centers that adopt new systems earlier may systematically differ (better-resourced, more\ntech-forward management, different baseline volume) from later adopters, echoing the survey-vs-RCT\ncomparison-group gap in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>. Before computing anything, apply <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>'s good/bad control discipline:\nadjust for center size, tenure, and volume (plausible confounders of both adoption timing and\nprocessing speed) but explicitly avoid adjusting for any post-adoption operational metric that the\npick-path change itself would affect (a mediator) or any metric jointly caused by adoption and speed\n(a potential collider, e.g., a composite &quot;efficiency score&quot; computed partly from processing time\nitself). Given plausibly many covariates, follow <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>'s bridge directly: estimate the propensity\n<math data-tex=\"e(x)=P(\\text{adopted}\\mid X)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>adopted</mtext><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and the outcome model <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> with flexible ML models rather than\nhand-built logistic/linear fits, then combine them via <strong>AIPW</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>) for robustness to either model\nbeing imperfectly specified — and explicitly check <strong>positivity</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>) first: are there\nearly-adopter-type centers with no late-adopter counterpart of similar size/volume, or vice versa?</p>\n<p><strong>Metric:</strong> The estimated ATT (average effect on centers that actually adopted) is likely the right\nestimand if the business question is &quot;should we keep/expand the rollout to more centers,&quot; per <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>'s\nestimand-choice guidance — not ATE, unless a company-wide mandate to <em>all</em> centers regardless of fit\nis genuinely being considered.</p>\n<p><strong>Failure modes:</strong> Unmeasured confounders — e.g., a center's overall management quality, which\ncould drive both earlier adoption <em>and</em> independently better processing times — would violate\nunconfoundedness (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>) with no way to detect this from the data alone; this is exactly the scenario\nwhere, if a true randomized or quasi-randomized rollout order is available, it should be strongly\npreferred over any purely observational estimate.</p>\n<p><strong>What you'd ship:</strong> An AIPW estimate with explicit propensity overlap diagnostics reported alongside\nthe effect size (following <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>'s lesson that overlap matters more than estimator sophistication), plus\na sensitivity analysis for the untestable unconfoundedness assumption rather than a single unqualified\npoint estimate.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Insist on the Highest Standards</strong> — explicitly checking positivity\nand refusing to report an extrapolated effect estimate for fulfillment centers outside the range of\ncovariate overlap (echoing <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>'s regression-adjustment warning) is exactly the discipline that\nseparates a defensible causal claim from a superficially confident but unsupported one. <strong>Dive Deep</strong>\n— correctly distinguishing a genuine confounder (center size) from a mediator (a post-adoption\noperational metric) before deciding what to adjust for requires exactly the causal-graph reasoning\nthis lecture builds, not a reflexive &quot;control for everything available.&quot;</p>\n<hr>\n</section><section id=\"causal-inference-22-s21\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s21\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>AIPW (Augmented Inverse Probability Weighting)</strong> — the doubly robust estimator combining an\noutcome regression with an inverse-probability-weighted correction term.</li>\n<li><strong>ATC (Average Treatment effect on the Controls)</strong> — <math data-tex=\"\\mathbb{E}[Y(1)-Y(0)\\mid T{=}0]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average\neffect the untreated group would have gained had they been treated.</li>\n<li><strong>ATE (Average Treatment Effect)</strong> — <math data-tex=\"\\mathbb{E}[Y(1)-Y(0)]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, averaged over the whole population.</li>\n<li><strong>ATT (Average Treatment effect on the Treated)</strong> — <math data-tex=\"\\mathbb{E}[Y(1)-Y(0)\\mid T{=}1]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, averaged over\nunits that actually received treatment.</li>\n<li><strong>CATE (Conditional Average Treatment Effect)</strong> — <math data-tex=\"\\tau(x)=\\mathbb{E}[Y(1)-Y(0)\\mid X{=}x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the\neffect within a covariate-defined subgroup.</li>\n<li><strong>Curse of dimensionality (matching context)</strong> — the exponential growth in the number of covariate\ncells relative to a fixed sample size, which empties nearly every cell of one or both treatment\narms.</li>\n<li><strong>Doubly robust</strong> — a property of an estimator that remains consistent if either of two nuisance\nmodels (propensity, outcome) is correctly specified.</li>\n<li><strong>Estimand</strong> — the causal target, fixed before seeing any data.</li>\n<li><strong>Estimate</strong> — the numeric answer a specific dataset returns under a chosen estimator.</li>\n<li><strong>Estimator</strong> — the procedure/rule that converts data into an estimate.</li>\n<li><strong>ITE (Individual Treatment Effect)</strong> — <math data-tex=\"\\tau_i=Y_i(1)-Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the per-unit effect, never directly\nobserved.</li>\n<li><strong>IPW (Inverse-Probability Weighting)</strong> — reweighting units by the inverse of their estimated\ntreatment-assignment probability to construct a balanced comparison.</li>\n<li><strong>Overlap / common support</strong> — the region of covariate space where both treated and control units\nare observed.</li>\n<li><strong>Positivity</strong> — the assumption <math data-tex=\"0&lt;P(T{=}1\\mid X{=}x)&lt;1\"><mrow><mn>0</mn><mo>&lt;</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&lt;</mo><mn>1</mn></mrow></math> for all <math data-tex=\"x\"><mi>x</mi></math>; both treatment arms possible\nat every covariate value.</li>\n<li><strong>Propensity score</strong> — <math data-tex=\"e(x)=P(T{=}1\\mid X{=}x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the probability of treatment given covariates.</li>\n<li><strong>Regression adjustment (standardisation)</strong> — estimating the causal effect by directly modeling the\noutcome as a function of treatment and covariates, then imputing missing potential outcomes.</li>\n<li><strong>Selection bias</strong> — the pre-treatment difference between treated and control groups that\ncontaminates a raw outcome comparison.</li>\n<li><strong>SMD (Standardized Mean Difference)</strong> — a covariate imbalance measure, in units of pooled standard\ndeviations.</li>\n<li><strong>Stratification (subclassification)</strong> — partitioning units into covariate-defined bins and\naveraging within-bin treated-minus-control gaps.</li>\n<li><strong>SUTVA (Stable Unit Treatment Value Assumption)</strong> — no interference between units; one well-defined\ntreatment version per unit.</li>\n<li><strong>Trimming</strong> — capping or discarding units with extreme propensity-score-derived weights to control\nestimator variance.</li>\n<li><strong>Unconfoundedness</strong> — <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math>; given covariates, treatment assignment carries\nno extra information about potential outcomes.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-22-s22\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s22\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Explain, using the actual dollar figures, why the randomized-trial ATT and the naive comparison on\nthis dataset have opposite signs. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>)</em></li>\n<li>Distinguish estimand, estimator, and estimate, and explain the two distinct ways an estimate can be\nwrong. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>Name all five treatment-effect estimands and give a distinct business question each one answers.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Write the naive-estimate decomposition formula from memory and explain both terms. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a>)</em></li>\n<li>Given a control variable, determine whether adjusting for it is safe (confounder), harmful\n(mediator/collider), or merely costly (pure predictor of <math data-tex=\"T\"><mi>T</mi></math>), and cite the dataset's own numeric\nevidence for each case. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)</em></li>\n<li>Explain why unconfoundedness is untestable while positivity and SUTVA can at least be partially\nchecked from data. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>, <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>, <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>Work through the curse-of-dimensionality calculation for <math data-tex=\"p=6\"><mrow><mi>p</mi><mo>=</mo><mn>6</mn></mrow></math> coarsened covariates at 3 levels\neach, and state what fraction of cells this dataset's earlier example found populated at <math data-tex=\"p=8\"><mrow><mi>p</mi><mo>=</mo><mn>8</mn></mrow></math>.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>State the propensity-score design rule that contradicts the intuitive &quot;predict <math data-tex=\"T\"><mi>T</mi></math> as accurately as\npossible&quot; instinct, and explain why. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>)</em></li>\n<li>Write the IPW ATT formula and explain what &quot;2 of 185 controls carry 66.3% of the control weight&quot;\ndemonstrates about it. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>)</em></li>\n<li>Explain what &quot;doubly robust&quot; specifically guarantees, and under what single condition that\nguarantee fails. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>)</em></li>\n<li>From the full comparison table, identify which estimator landed closest to the known truth, and\nexplain the lecture's own stated reason why matching outperformed some more sophisticated methods.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>)</em></li>\n<li>Explain how classical stratification, matching, IPW, and AIPW all reduce to estimating the same\ntwo functions, and name both. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-22-s23\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s23\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>LaLonde (1986), &quot;Evaluating the Econometric Evaluations of Training Programs with Experimental\nData&quot;</strong> ⚠️ <strong>verify this</strong> — not cited directly on the lecture's own slides, but the dataset\n(National Supported Work programme, mid-1970s, ATT ≈ $1,794) matches this well-known benchmark\ndataset in the causal inference literature. <code>solid</code> if the attribution is correct — treat as\nbackground context pending confirmation, not a transcribed citation.</li>\n<li><strong>Rosenbaum &amp; Rubin (1983), &quot;The Central Role of the Propensity Score in Observational Studies for\nCausal Effects&quot;</strong> ⚠️ not named on the slides — the foundational propensity-score paper, added here\nfrom general field knowledge as the primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>. <code>solid</code>.</li>\n<li><strong>Horvitz &amp; Thompson (1952), &quot;A Generalization of Sampling Without Replacement from a Finite\nUniverse&quot;</strong> ⚠️ not named on the slides — the IPW formula in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a> is explicitly labeled\n&quot;Horvitz-Thompson&quot; on the lecture's own slide, so this is the paper that name refers to. <code>hard</code>.</li>\n<li><strong>Robins, Rotnitzky, Zhao (1994), &quot;Estimation of Regression Coefficients When Some Regressors Are\nNot Always Observed&quot;</strong> ⚠️ not named on the slides — a foundational doubly-robust/AIPW paper, added\nfrom general field knowledge as background for <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>. <code>hard</code>.</li>\n<li><strong>Chernozhukov et al. (2018), &quot;Double/Debiased Machine Learning for Treatment and Structural\nParameters&quot;</strong> — <strong>named directly on the slide</strong> as &quot;Neyman orthogonality and DML&quot; [slide 85].\n<code>hard</code> · the natural next read given <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>'s explicit bridge from classical estimation to ML-based\nnuisance function estimation.</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — only item 5 (DML/Neyman orthogonality) is explicitly named on the lecture's own\nslides. Items 1–4 are added from general causal-inference field knowledge to support concepts the\nlecture uses (the dataset, propensity scores, Horvitz-Thompson weighting, doubly robust estimation)\nbut does not itself cite by author/year — treat them as suggested background reading, not\ntranscribed lecture citations.</p>\n</aside>\n</section>","sections":[{"id":"causal-inference-22-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s1","num":"","title":"Before we start: what you need to know","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s2","num":"","title":"The big picture","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s3","num":"1","title":"A Job-Training Experiment — the Dataset Everything Is Judged Against","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s4","num":"2","title":"Two Estimates of One Treatment Effect","mins":1,"kind":"content","part":""},{"id":"causal-inference-22-s5","num":"3","title":"Estimand, Estimator, Estimate — One Causal Number Is Really Three Things","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s6","num":"4","title":"Treatment-Effect Estimands — the Same Unit-Level Effect, Averaged Differently","mins":4,"kind":"content","part":""},{"id":"causal-inference-22-s7","num":"5","title":"Selection Bias and Its Two Families","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s8","num":"6","title":"Good and Bad Controls","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s9","num":"7","title":"Unconfoundedness","mins":10,"kind":"content","part":""},{"id":"causal-inference-22-s10","num":"8","title":"Stratification (Subclassification)","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s11","num":"9","title":"Matching","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s12","num":"10","title":"The Curse of Dimensionality","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s13","num":"11","title":"Propensity Score","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s14","num":"12","title":"Inverse-Probability Weighting (IPW)","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s15","num":"13","title":"Regression Adjustment (Standardisation)","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s16","num":"14","title":"Doubly Robust Estimation (AIPW)","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s17","num":"15","title":"Estimates Compared — The Full Scoreboard","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s18","num":"16","title":"From Classical Estimation to Machine Learning","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s19","num":"","title":"Putting it together","mins":4,"kind":"back","part":""},{"id":"causal-inference-22-s20","num":"","title":"Interview prep — Amazon Applied Scientist","mins":16,"kind":"back","part":""},{"id":"causal-inference-22-s21","num":"","title":"Glossary","mins":3,"kind":"back","part":""},{"id":"causal-inference-22-s22","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"causal-inference-22-s23","num":"","title":"Going deeper","mins":2,"kind":"back","part":""}],"interactiveCount":3},{"id":"causal-inference-23","num":"23","file":"causal-inference-03","kind":"lecture","title":"Causal Inference — Part 3: Causal ML Methods for Treatment Effect Estimation","h1":"Causal Inference — Part 3: Causal ML Methods for Treatment Effect Estimation","subtitle":"Causal ML Methods for Treatment Effect Estimation","spineLabel":"Part 3","short":"Causal ML Methods for Treatment Effect Estimation","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~1:20:00. Built from the raw capture in <code>output/Lecture_23 - Module 7 Causal Inference Part 3/</code> (102 raw frames), not <code>slides_deduped/</code> — see project memory <code>slides-deduped-is-lossy</code>.\nInstructor: <strong>Pranita Khandelwal</strong>, Senior Data Scientist, International Machine Learning team at\nAmazon (buyer abuse prevention and payment experiences) — confirmed from the slide nameplate. This\nis the third and final lecture in the causal inference series, completing the progression from\nfoundational theory (Part 1) through classical estimation (Part 2) to modern ML-based methods for\nheterogeneous treatment effect estimation and debiased causal inference.</p>\n</blockquote>\n<hr>\n</div><section id=\"causal-inference-23-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain why ATE alone is insufficient</strong> for decision-making and state the precise definition\nof CATE (τ(x)), relating it back to the potential outcomes framework from Part 1.</li>\n<li><strong>Build an S-Learner, T-Learner, and X-Learner from first principles</strong>, explaining the\ninformation-sharing properties and failure modes of each, and choose among them given the\nimbalance structure of a dataset.</li>\n<li><strong>Explain why honest estimation in causal trees</strong> prevents overfitting and enables valid\nconfidence intervals, and describe how causal forests reduce variance through ensembling.</li>\n<li><strong>Explain why representation learning is necessary</strong> for deep causal methods, and describe how\nTarNet and CFRNet achieve covariate balance in a learned latent space.</li>\n<li><strong>State the three key ideas of the DML framework</strong> (partialing out, Neyman orthogonality,\ncross-fitting) and explain how each addresses a specific failure mode of naive ML-based\ncausal estimation.</li>\n<li><strong>Derive the Robinson decomposition</strong> and explain why it eliminates the unknown confounding\nfunction g(x) from the partially linear model.</li>\n<li><strong>Explain the Neyman orthogonality condition</strong> and why it makes the treatment effect estimator\ninsensitive to first-order nuisance function errors, reducing bias from O(δ) to O(δ²).</li>\n<li><strong>Describe the R-Learner's objective function</strong> and explain why it generalizes OLS from fixed\ntreatment effects to heterogeneous ones.</li>\n<li><strong>Explain the DR-Learner's doubly robust and Neyman orthogonal properties</strong>, and describe how\nit generates pseudo-outcomes from AIPW for subsequent meta-learning.</li>\n<li><strong>Map the entire causal ML landscape</strong> — from meta-learners to representation learning to\northogonal learners — onto the canonical causal DAG, explaining which edges each method\ntargets and how.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-23-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — Potential outcomes and CATE (from Parts 1–2)</h3>\n<p>This lecture assumes familiarity with the potential outcomes framework (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> of Part 1): <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>,\n<math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the switching equation, the fundamental problem of causal inference, and the five\nestimands (ITE, ATE, ATT, ATC, CATE). If <math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) \\mid X = x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> is\nunfamiliar, read <a class=\"xref\" data-xref-lec=\"causal-inference-01\" data-xref=\"Part 1 §3\" role=\"link\" tabindex=\"0\">Part 1 §3</a> and <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §4\" role=\"link\" tabindex=\"0\">Part 2 §4</a> first.</p>\n<h3>Prerequisite 2 — The classical estimation toolkit (from Part 2)</h3>\n<p>This lecture builds directly on Part 2's classical methods: stratification, matching, propensity\nscores, IPW, regression adjustment, and doubly robust (AIPW) estimation. In particular, the\n<strong>nuisance functions</strong> <math data-tex=\"e(x) = P(T=1|X=x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo>=</mo><mn>1</mn><mi>|</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (propensity) and <math data-tex=\"\\mu_t(x) = \\mathbb{E}[Y|T=t, X=x]\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>\n(outcome model) from <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §16\" role=\"link\" tabindex=\"0\">Part 2 §16</a> are used throughout this lecture without re-derivation.</p>\n<h3>Prerequisite 3 — Regularization bias</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Regularization bias</strong> — when a flexible ML model (random forest, neural network, etc.) is\noptimized for predictive accuracy using techniques like L1/L2 penalties, dropout, early stopping,\nor tree pruning, the resulting model's predictions can be systematically biased in ways that don't\nvanish with more data. This is the central problem <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §16\" role=\"link\" tabindex=\"0\">Part 2 §16</a> flagged and Part 3 solves.</p>\n</blockquote>\n<p>In standard supervised learning, regularization bias is acceptable because it trades bias for\nvariance, often improving generalization — see <a class=\"xref\" data-xref-lec=\"supervised-learning-01\" role=\"link\" tabindex=\"0\">Supervised Learning Part 1\n§9</a>, &quot;The bias–variance trade-off,&quot; for the full\nderivation of why that trade is normally a good one. In causal inference, this same bias propagates\ndirectly into treatment effect estimates and <strong>does not vanish with more data</strong> — making it a much\nmore serious problem that requires specialized solutions (DML, orthogonal learners).</p>\n<h3>Prerequisite 4 — The factual MSE loss</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Factual MSE</strong> — a loss function that computes mean squared error only on the <em>observed</em>\n(factual) outcomes, not the counterfactual ones. Since we only observe <math data-tex=\"Y_i(T_i)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and never\n<math data-tex=\"Y_i(1-T_i)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for any unit, this is the only loss directly computable from observational data.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\mathcal{L}_{\\text{factual}} = \\sum_{i: T_i=1} \\big(Y_i - \\hat\\mu_1(X_i)\\big)^2 + \\sum_{i: T_i=0} \\big(Y_i - \\hat\\mu_0(X_i)\\big)^2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi class=\"mathcal\">ℒ</mi><mtext>factual</mtext></msub><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup><mo>+</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup></mrow></math></div>\n<hr>\n</section><section id=\"causal-inference-23-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Parts 1 and 2 established <em>why</em> causal inference is hard and <em>what</em> classical methods can do with\nlow-dimensional data. This lecture asks: <strong>what happens when the data is high-dimensional, the\ntreatment effects are heterogeneous, and we need ML's flexibility without ML's regularization\nbias?</strong></p>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"1645\" style=\"max-width:100%;height:auto\" id=\"d37a0fabca0b4bf3b\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 1645 696.5\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#d37a0fabca0b4bf3b{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d37a0fabca0b4bf3b .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d37a0fabca0b4bf3b .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d37a0fabca0b4bf3b .error-icon{fill:#16140F;}#d37a0fabca0b4bf3b .error-text{fill:#B4AA95;stroke:#B4AA95;}#d37a0fabca0b4bf3b .edge-thickness-normal{stroke-width:1px;}#d37a0fabca0b4bf3b .edge-thickness-thick{stroke-width:3.5px;}#d37a0fabca0b4bf3b .edge-pattern-solid{stroke-dasharray:0;}#d37a0fabca0b4bf3b .edge-thickness-invisible{stroke-width:0;fill:none;}#d37a0fabca0b4bf3b .edge-pattern-dashed{stroke-dasharray:3;}#d37a0fabca0b4bf3b .edge-pattern-dotted{stroke-dasharray:2;}#d37a0fabca0b4bf3b .marker{fill:#7C7361;stroke:#7C7361;}#d3
