mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (smooth downweighting instead of a hard cap).</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — trimming is a bias-variance trade you must choose, not a solved problem.</strong>\nCapping extreme weights reduces the variance (one freak observation can no longer single-handedly\nswing the estimate) but changes <em>which population</em> the estimate now describes (you've implicitly\ndropped or downweighted the least-comparable units), which introduces its own bias relative to the\noriginal estimand. The slide is explicit that there's &quot;no rule for how much&quot; to trim — this is a\njudgment call, not a formula.</p>\n</aside>\n<h3>12.2 Weighting versus Matching on the Score</h3>\n<p><em>&quot;The same <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, two uses with different theoretical standing.&quot;</em></p>\n<ul>\n<li><strong>Weighting on the score:</strong> Horvitz-Thompson is <strong>consistent</strong> under standard assumptions.</li>\n<li><strong>PS matching can worsen balance;</strong> not the recommended estimator.</li>\n<li>Matching on the score <strong>builds intuition only.</strong></li>\n<li>Both need the same <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math> and overlap. <strong>A good <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> matters more than the\nestimator.</strong></li>\n</ul>\n<p>🧪 <strong>Worked comparison, where each landed:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Estimate</th>\n<th>Gap from truth ($1,794)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Naive</td>\n<td>−$8,498</td>\n<td>$10,292</td>\n</tr>\n<tr>\n<td>IPW</td>\n<td>$1,173</td>\n<td>$621</td>\n</tr>\n<tr>\n<td><strong>IPW trimmed</strong></td>\n<td><strong>$1,238</strong></td>\n<td><strong>$556</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;IPW trimmed is $556 below the trial truth ($1,794).&quot;</em> Trimming the extreme weights identified in\n<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12.1\" role=\"link\" tabindex=\"0\">§12.1</a> measurably improved the estimate's proximity to the known truth on this dataset.</p>\n<hr>\n</section><section id=\"causal-inference-22-s15\" data-title=\"Regression Adjustment (Standardisation)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">Regression Adjustment (Standardisation)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Model the outcome instead of the treatment.&quot;</em></p>\n<ul>\n<li><strong>IPW modelled treatment; regression adjustment models the outcome:</strong> fit $\\hat\\mu_t(x) =\n\\mathbb{E}[Y\\mid T{=}t,X{=}x]$, impute the missing arm.</li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATE}} = \\frac{1}{n}\\sum_{i=1}^{n}\\big[\\hat\\mu_1(X_i) - \\hat\\mu_0(X_i)\\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATE</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<ul>\n<li><strong>Added assumption:</strong> correct <strong>functional form</strong> for <math data-tex=\"\\hat\\mu_t\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi></msub></math>.</li>\n<li><strong>Reports a gap at every <math data-tex=\"x\"><mi>x</mi></math>, even where one arm has no data.</strong></li>\n<li><strong>Beyond support it extrapolates:</strong> matching <em>refuses</em>, IPW <em>diverges</em>, regression <em>still prints a\nnumber</em> — a meaningfully different (and riskier) failure mode than the other two methods.</li>\n<li><strong>One nuisance each: IPW trusts <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, regression trusts <math data-tex=\"\\hat\\mu_t(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</strong> Next: <strong>combine both.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example — the danger of silent extrapolation:</strong> restricting the fitted regression line to\ncontrols only up to <strong>age 50</strong> (near the edge of the trainee age range) still lets the model print a\n<strong>regression estimate of −$8,427</strong> at that boundary — a confidently stated number in a region where\nthe underlying data support is thin (the chart's own log-scale bar count of &quot;controls kept within ±3\nyr of each age&quot; shows this region has far fewer supporting observations than the dense middle of the\nage range).</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The core warning of this section, worth remembering as a general principle.</strong> Unlike matching\n(which simply has no neighbor to offer, and therefore no estimate, when support is missing) and IPW\n(whose weights explicitly blow up and signal instability when overlap is poor), a regression model\nwill happily extrapolate a smooth curve into regions with little or no real data — and the output\nlooks exactly as confident and well-formatted as an output backed by solid data. <strong>A regression-based\ncausal estimate always needs a companion check of where the covariate support actually is</strong>, or it\ncan silently report a number in a region the data can't actually speak to.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s16\" data-title=\"Doubly Robust Estimation (AIPW)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">14</span>\n      <span class=\"sec-t\">Doubly Robust Estimation (AIPW)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;An outcome regression corrected by an inverse-probability term, consistent if either nuisance model\nis right.&quot;</em></p>\n<ul>\n<li><strong>Prior estimators rely on a single nuisance; this combines both.</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\hat\\psi_a = \\frac{1}{n}\\sum_i\\left[\\hat\\mu_a(X_i) + \\frac{\\mathbb{1}\\{T_i{=}a\\}}{\\hat e_a(X_i)}\\big(Y_i-\\hat\\mu_a(X_i)\\big)\\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mover><mi>ψ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>i</mi></munder></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mfrac><mrow><mn>𝟙</mn><mo form=\"prefix\" stretchy=\"false\">{</mo><msub><mi>T</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">}</mo></mrow><mrow><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></mfrac><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> start from the regression prediction <math data-tex=\"\\hat\\mu_a(X_i)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>'s approach), then\n<em>correct</em> it with an inverse-probability-weighted residual term — how far off the regression's\nprediction was for units actually observed in arm <math data-tex=\"a\"><mi>a</mi></math>, weighted by the inverse propensity. If the\nregression model is already correct, that correction term averages to roughly zero and does no harm.\nIf the regression model is wrong but the propensity model is right, the correction term does the\nwork of fixing the regression's mistake.</p>\n<ul>\n<li><strong>Effect estimate:</strong> <math data-tex=\"\\hat\\psi_1 - \\hat\\psi_0 \\approx +\\$1{,}269\"><mrow><msub><mover><mi>ψ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo>−</mo><msub><mover><mi>ψ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,269</mn></mrow></math>.</li>\n<li><strong>Double robustness:</strong> consistent if <strong>either</strong> <math data-tex=\"\\hat\\mu_a\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> or <math data-tex=\"\\hat e_a\"><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> is correct.</li>\n<li><strong>Bias is the product of the two errors.</strong> Foundation for <strong>Neyman orthogonality</strong> and <strong>DML</strong>\n(Double/Debiased Machine Learning).</li>\n<li><strong>If both wrong, can be worse; the fast rate also needs cross-fitting.</strong></li>\n</ul>\n<p>🧪 <strong>Worked demonstration — the four-cell &quot;nuisance specification&quot; grid:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Propensity ✓</th>\n<th>Propensity ✗</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Outcome ✓</strong></td>\n<td><strong>both correct</strong> → consistent</td>\n<td>outcome only → <strong>consistent</strong></td>\n</tr>\n<tr>\n<td><strong>Outcome ✗</strong></td>\n<td>propensity only → <strong>consistent</strong></td>\n<td>both wrong → <strong>biased</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>Three of the four cells are consistent — only the &quot;both wrong&quot; cell fails. With both models\ndeliberately misspecified, the demo shows a <strong>both-wrong estimate carrying extra bias</strong>, away from\nthe $1,794 truth, versus the correctly specified AIPW estimate landing at <strong>$1,269</strong>.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — &quot;doubly robust&quot; names a genuine, provable property, not just marketing.</strong> The\ntable above is the concrete meaning of &quot;doubly robust&quot;: you get a <em>consistent</em> (asymptotically\ncorrect) estimate as long as <strong>at least one</strong> of the two models — the outcome model <math data-tex=\"\\hat\\mu_a\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> or\nthe propensity model <math data-tex=\"\\hat e_a\"><msub><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>a</mi></msub></math> — is correctly specified. You don't need to know <em>in advance</em> which\none is right; AIPW protects you either way, at the cost of needing both models fit in the first\nplace. This is exactly why it's presented as the natural endpoint of the &quot;one nuisance each&quot; limit\nation named at the end of <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s17\" data-title=\"Estimates Compared — The Full Scoreboard\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">15</span>\n      <span class=\"sec-t\">Estimates Compared — The Full Scoreboard</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Each estimator on the job-training data, measured against the randomised-trial truth.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\text{gap} = |\\widehat{\\text{ATT}} - \\text{ATT}|\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>gap</mtext><mo>=</mo><mi>|</mi><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>−</mo><mtext>ATT</mtext><mi>|</mi></mrow></math></div>\n<p><em>distance from each estimate to the known truth line</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Estimator</th>\n<th>Estimate</th>\n<th>Gap from truth ($1,794)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Naive comparison</td>\n<td><strong>−$8,498</strong></td>\n<td>$10,292 — <strong>wrong-signed</strong></td>\n</tr>\n<tr>\n<td>Regression adjust</td>\n<td>$699</td>\n<td>$1,095</td>\n</tr>\n<tr>\n<td>5-strata on propensity</td>\n<td>−$129</td>\n<td>$1,923</td>\n</tr>\n<tr>\n<td>Nearest-neighbour match</td>\n<td>$2,037</td>\n<td>$243</td>\n</tr>\n<tr>\n<td>IPW (weighting)</td>\n<td>$1,173</td>\n<td>$621</td>\n</tr>\n<tr>\n<td>IPW + trim to overlap</td>\n<td>$1,238</td>\n<td>$556</td>\n</tr>\n<tr>\n<td><strong>AIPW (doubly robust)</strong></td>\n<td><strong>$1,269</strong></td>\n<td><strong>$525 — closest to truth</strong></td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Truth:</strong> <math data-tex=\"\\widehat{\\text{ATT}}\\approx+\\$1{,}794\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,794</mn></mrow></math>.</li>\n<li><strong>Naive</strong> −$8,498, wrong in sign.</li>\n<li><strong>Adjustment recovers the sign:</strong> matching, weighting, AIPW all land near truth.</li>\n<li><strong>AIPW +$1,269:</strong> consistent if either nuisance correct.</li>\n<li><strong>Overlap matters more than estimator choice.</strong></li>\n<li><strong>Every bar rests on two models: who trains, what each would earn.</strong></li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — the single most important empirical finding of the whole lecture, stated\ndirectly.</strong> <em>&quot;Overlap matters more than estimator choice.&quot;</em> Notice that nearest-neighbour matching\n(gap $243) actually <em>outperformed</em> several more theoretically sophisticated methods here (5-strata:\ngap $1,923; plain IPW: gap $621) on <em>this specific dataset</em> — not because matching is generally\nsuperior, but because the sample happened to have reasonably good overlap for the covariates\nmatching used. No estimator, however sophisticated, can fully compensate for poor covariate overlap\n(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>'s positivity) — this is why the lecture spent an entire section on positivity/common support\nbefore ever introducing an estimation method.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s18\" data-title=\"From Classical Estimation to Machine Learning\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">16</span>\n      <span class=\"sec-t\">From Classical Estimation to Machine Learning</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Bucketing, matching and reweighting all rest on the same two functions to be learned.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Nuisance Function 1 — <strong>Propensity</strong></th>\n<th>Nuisance Function 2 — <strong>Outcome</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"e(x) = P(T{=}1\\mid X{=}x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td><math data-tex=\"\\mu_t(x) = \\mathbb{E}[Y\\mid T{=}t, X{=}x]\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n</tr>\n<tr>\n<td>&quot;Who was likely to train, given covariates <math data-tex=\"X\"><mi>X</mi></math>.&quot;</td>\n<td>&quot;What each unit would earn in arm <math data-tex=\"t\"><mi>t</mi></math> at covariates <math data-tex=\"X\"><mi>X</mi></math>.&quot;</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>A few traits by hand; with hundreds, both must be learned.</strong></li>\n<li><strong>Flexible ML models estimate <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> in place of hand-built fits.</strong></li>\n<li><strong>Caveat: better prediction is not the same as a better effect estimate.</strong></li>\n</ul>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>The explicit bridge to the next lecture.</strong> Every method in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a> — stratification, matching,\npropensity weighting, regression adjustment, AIPW — is, underneath, an estimate of one or both of\nexactly these two functions: <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. With only a handful of covariates (as in this\ndataset), hand-built logistic regression and linear models suffice. With hundreds of covariates,\nflexible machine learning models (random forests, gradient boosting, neural networks) become\nnecessary to estimate these same two functions well — but the closing caveat is worth taking\nseriously: a model that is excellent at <em>predicting</em> <math data-tex=\"T\"><mi>T</mi></math> or <math data-tex=\"Y\"><mi>Y</mi></math> is not automatically excellent at\nproducing an unbiased <em>causal effect estimate</em>, for exactly the reason <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a> warned about (a strong\n<math data-tex=\"T\"><mi>T</mi></math>-predictor inflates weights) and <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a> warned about (a strong <math data-tex=\"Y\"><mi>Y</mi></math>-predictor can still be a mediator\nor collider). This tension is presumably the starting point of Lecture 23.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s1
