elates with those\nsame characteristics.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s6\" data-title=\"Probabilistic Graphical Models\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Probabilistic Graphical Models</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>DAG (Directed Acyclic Graph), <math data-tex=\"\\mathcal{G}=(V,E)\"><mrow><mi class=\"mathcal\">𝒢</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>V</mi><mo separator=\"true\">,</mo><mi>E</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — encodes a factorization of the joint\ndistribution. Pearl (1988), <em>Probabilistic Reasoning in Intelligent Systems</em>, Morgan Kaufmann.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"P(X_1,\\ldots,X_p) = \\prod_{j=1}^{p} P\\big(X_j \\mid \\text{Pa}(X_j)\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>X</mi><mi>p</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∏</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>p</mi></munderover></mrow><mi>P</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>X</mi><mi>j</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>Pa</mtext><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p><em>Markov property: each node is conditionally independent of its non-descendants given its parents.</em></p>\n<p><strong>Words before symbols:</strong> the probability of the whole system taking on a particular joint\nconfiguration factors into a product of small, local pieces — one factor per variable, each factor\ndepending only on that variable's own <strong>parents</strong> (its direct causes in the graph) rather than on the\nentire rest of the system. This is what makes a graph a compact, checkable representation of a\ncomplicated joint distribution.</p>\n<p>🧪 <strong>Worked example — a 3-node graph</strong> [Z → X, Z → Y, X → Y]:</p>\n<div class=\"mblk\"><math data-tex=\"P(Z,X,Y) = P(Z)\\,P(X\\mid Z)\\,P(Y\\mid X,Z)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo separator=\"true\">,</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Y</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<ul>\n<li><strong>Nodes</strong> = random variables.</li>\n<li><strong>Directed edges</strong> = direct causal influence.</li>\n<li><strong>Acyclicity</strong> allows topological ordering (you can always list the variables so every arrow points\nfrom earlier to later in the list — this is what makes the factorization well-defined).</li>\n<li><strong>Causal semantics:</strong> <strong>deleting edges = intervening.</strong> This is the single sentence that connects\ngraphs back to <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s do-operator: computing <math data-tex=\"P(Y\\mid\\text{do}(X{=}x))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> means <em>literally erasing every\narrow pointing into <math data-tex=\"X\"><mi>X</mi></math></em> (since an intervention overrides whatever normally determines <math data-tex=\"X\"><mi>X</mi></math>), fixing\n<math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>, and then reading off the resulting (now-modified) joint distribution over everything else.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-21-s7\" data-title=\"Conditional Independence — the Atomic Building Block\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Conditional Independence — the Atomic Building Block</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"mblk\"><math data-tex=\"X\\perp Y \\mid Z \\quad\\Longleftrightarrow\\quad P(X,Y\\mid Z) = P(X\\mid Z)\\,P(Y\\mid Z)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mspace width=\"1em\"></mspace><mo stretchy=\"false\">⟺</mo><mspace width=\"1em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>Dawid (1979), <em>&quot;Conditional Independence in Statistical Theory.&quot;</em></p>\n<p>There are exactly three shapes a path between two variables can take through a third, and they behave\n<strong>oppositely</strong> with respect to conditioning:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Fork (confounder)</strong></th>\n<th><strong>Chain (mediator)</strong></th>\n<th><strong>Collider</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diagram</td>\n<td><math data-tex=\"Z\\to X,\\ Z\\to Y\"><mrow><mi>Z</mi><mo>→</mo><mi>X</mi><mo separator=\"true\">,</mo><mtext> </mtext><mi>Z</mi><mo>→</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\to C \\leftarrow Y\"><mrow><mi>X</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math></td>\n</tr>\n<tr>\n<td>Marginally</td>\n<td><math data-tex=\"X\\not\\perp Y\"><mrow><mi>X</mi><mo>⟂̸</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\not\\perp Y\"><mrow><mi>X</mi><mo>⟂̸</mo><mi>Y</mi></mrow></math></td>\n<td><math data-tex=\"X\\perp Y\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi></mrow></math></td>\n</tr>\n<tr>\n<td>Given the middle node</td>\n<td><math data-tex=\"X\\perp Y \\mid Z\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi></mrow></math></td>\n<td><math data-tex=\"X\\perp Y \\mid M\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>M</mi></mrow></math></td>\n<td><math data-tex=\"X\\not\\perp Y \\mid C\"><mrow><mi>X</mi><mo>⟂̸</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>C</mi></mrow></math></td>\n</tr>\n<tr>\n<td>Effect of conditioning</td>\n<td><strong>Conditioning blocks path</strong></td>\n<td><strong>Conditioning blocks path</strong></td>\n<td><strong>Conditioning opens path</strong></td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Conditioning can create or destroy associations.</strong></li>\n<li><strong>Collider bias (Berkson's paradox):</strong> <em>&quot;among selected units, causes of selection appear\nnegatively correlated.&quot;</em></li>\n</ul>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most counterintuitive fact in this lecture, and worth sitting with.</strong> A <strong>fork</strong>\n(<math data-tex=\"Z\"><mi>Z</mi></math> causes both <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>) and a <strong>chain</strong> (<math data-tex=\"X\"><mi>X</mi></math> causes <math data-tex=\"M\"><mi>M</mi></math> causes <math data-tex=\"Y\"><mi>Y</mi></math>) both behave the way\nintuition expects: <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out associated, and conditioning on the variable in the middle\nremoves that association (in the fork's case, because you've controlled for the shared cause; in\nthe chain's case, because you've blocked the only causal pathway from <math data-tex=\"X\"><mi>X</mi></math> to <math data-tex=\"Y\"><mi>Y</mi></math>). A <strong>collider</strong>\ndoes the <em>opposite</em>: <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out <strong>independent</strong> — genuinely unrelated — but conditioning\non their common effect <math data-tex=\"C\"><mi>C</mi></math> <em>creates</em> an association between them that did not exist before.</p>\n<p><em>Concretely — a classic collider-bias example (celebrity attractiveness and talent):</em> suppose being\nfamous (<math data-tex=\"C\"><mi>C</mi></math>) requires either being unusually attractive (<math data-tex=\"X\"><mi>X</mi></math>) or unusually talented (<math data-tex=\"Y\"><mi>Y</mi></math>), and\nattractiveness and talent are genuinely unrelated in the general population. Restrict attention only\nto famous people (i.e., condition on <math data-tex=\"C\"><mi>C</mi></math>) and attractiveness and talent will appear <em>negatively</em>\ncorrelated — because among the famous, a person low on one trait most likely made it in on the\nother. This is Berkson's paradox exactly as named on the slide: <em>conditioning on a shared effect\nmanufactures a spurious negative correlation between two otherwise independent causes.</em></p>\n<p><strong>How to apply:</strong> before conditioning on (or &quot;controlling for&quot;) any variable in an analysis, check\nwhether it's a collider on the causal path you care about. Controlling for a collider is a common,\ngenuine mistake — it does not remove confounding, it <em>introduces</em> a new spurious association where\nnone existed.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s8\" data-title=\"D-Separation Theorem — Reading Conditional Independences from the Graph\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">D-Separation Theorem — Reading Conditional Independences from the Graph</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Reading conditional independences from the graph.&quot;</em> Verma &amp; Pearl (1988), <em>&quot;Causal Networks:\nSemantics and Expressiveness.&quot;</em></p>\n</blockquote>\n<p><strong>Definition.</strong> A path between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> is <strong>blocked</strong> by <math data-tex=\"Z\"><mi>Z</mi></math> if it contains: <strong>(i)</strong> a\nnon-collider in <math data-tex=\"Z\"><mi>Z</mi></math>, or <strong>(ii)</strong> a collider whose descendants are all outside <math data-tex=\"Z\"><mi>Z</mi></math>.</p>\n<div class=\"mblk\"><math data-tex=\"X \\perp_{\\mathcal{G}} Y \\mid Z \\quad\\Longrightarrow\\quad X\\perp Y\\mid Z \\quad\\text{(under faithfulness)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>X</mi><msub><mo>⟂</mo><mi class=\"mathcal\">𝒢</mi></msub><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mspace width=\"1em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"1em\"></mspace><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi><mspace width=\"1em\"></mspace><mtext>(under faithfulness)</mtext></mrow></math></div>\n<ul>\n<li><strong>d-separation is sound and complete</strong> for reading off conditional independencies from the graph.</li>\n<li><strong>Faithfulness:</strong> no exact parameter cancellations (a generic assumption — it rules out the\nfreak coincidence where two causal effects happen to numerically cancel each other out exactly,\nproducing an independence in the data that the graph itself doesn't predict).</li>\n<li><strong>Practical use:</strong> determine the <strong>minimal adjustment set</strong> for identification.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this generalizes <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s three cases into one rule.</strong> D-separation is the single\nalgorithm that correctly handles <em>any</em> path of <em>any</em> length, built out of chains, forks, and\ncolliders in any combination: walk every path between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>; a path is blocked if it hits a\nnon-collider that's in the conditioning set <math data-tex=\"Z\"><mi>Z</mi></math> (fork or chain logic — conditioning on it blocks the\npath) <em>or</em> if it hits a collider that's <em>not</em> in <math data-tex=\"Z\"><mi>Z</mi></math> and has no descendant in <math data-tex=\"Z\"><mi>Z</mi></math> either (collider\nlogic — an unconditioned collider already blocks the path on its own). If <strong>every</strong> path between <math data-tex=\"X\"><mi>X</mi></math>\nand <math data-tex=\"Y\"><mi>Y</mi></math> is blocked given <math data-tex=\"Z\"><mi>Z</mi></math>, the graph implies <math data-tex=\"X\\perp Y\\mid Z\"><mrow><mi>X</mi><mo>⟂</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>Z</mi></mrow></math>. This single mechanical procedure\nis &quot;sound and complete&quot; — it never gives a wrong answer, and it finds every independence the graph\nactually implies.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s9\" data-title=\"do-Calculus — From Graph to Intervention\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">do-Calculus — From Graph to Intervention</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Three rules that reduce <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> expressions to observational quantities.&quot;</em> Pearl\n(1995), <em>&quot;Causal Diagrams for Empirical Research.&quot;</em></p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),Z) \\;\\longrightarrow\\; \\text{observational expression (if identifiable)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟶</mo><mspace width=\"0.2778em\"></mspace><mtext>observational expression (if identifiable)</mtext></mrow></math></div>\n<p><strong>Rule 1 (insertion/deletion of observations):</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),Z,W) = P(Y\\mid\\text{do}(X),W) \\quad\\text{if}\\quad Y\\perp_{\\mathcal{G}_{\\bar X}} Z \\mid X,W\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Z</mi><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>if</mtext><mspace width=\"1em\"></mspace><mi>Y</mi><msub><mo>⟂</mo><msub><mi class=\"mathcal\">𝒢</mi><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover></msub></msub><mi>Z</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>W</mi></mrow></math></div>\n<p><strong>Rule 2 (action/observation exchange):</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),\\text{do}(Z),W) = P(Y\\mid\\text{do}(X),Z,W) \\quad\\text{if}\\quad Y\\perp_{\\mathcal{G}_{\\bar X\\underline Z}} Z\\mid X,W\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Z</mi><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>if</mtext><mspace width=\"1em\"></mspace><mi>Y</mi><msub><mo>⟂</mo><msub><mi class=\"mathcal\">𝒢</mi><mrow><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover><menclose notation=\"bottom\" class=\"tml-underline\"><mi>Z</mi></menclose></mrow></msub></msub><mi>Z</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>W</mi></mrow></math></div>\n<p><strong>Rule 3 (insertion/deletion of actions):</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X),\\text{do}(Z),W) = P(Y\\mid\\text{do}(X),W) \\quad\\text{if}\\quad Y\\perp_{\\mathcal{G}_{\\bar X\\overline{Z(W)}}} Z\\mid X,W\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>if</mtext><mspace width=\"1em\"></mspace><mi>Y</mi><msub><mo>⟂</mo><msub><mi class=\"mathcal\">𝒢</mi><mrow><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover><menclose notation=\"top\" class=\"tml-overline\"><mrow><mi>Z</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></menclose></mrow></msub></msub><mi>Z</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>W</mi></mrow></math></div>\n<p><strong>Words before symbols, for each rule:</strong></p>\n<ul>\n<li><strong>Rule 1</strong> says: an <em>observed</em> variable <math data-tex=\"Z\"><mi>Z</mi></math> can be dropped from (or added to) what you're\nconditioning on, without changing the answer, exactly when <math data-tex=\"Z\"><mi>Z</mi></math> gives no extra information about <math data-tex=\"Y\"><mi>Y</mi></math>\nonce you already know <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"W\"><mi>W</mi></math> — checked by d-separation in the graph with <math data-tex=\"X\"><mi>X</mi></math>'s incoming edges\ndeleted (written <math data-tex=\"\\mathcal{G}_{\\bar X}\"><msub><mi class=\"mathcal\">𝒢</mi><mover><mi>X</mi><mo stretchy=\"false\" class=\"chr-med wbk-med-acc\" style=\"math-depth:0;\">‾</mo></mover></msub></math>, &quot;the graph as it looks after intervening on <math data-tex=\"X\"><mi>X</mi></math>&quot;).</li>\n<li><strong>Rule 2</strong> says: an <em>action</em> <math data-tex=\"\\text{do}(Z)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can be replaced by simply <em>observing</em> <math data-tex=\"Z{=}z\"><mrow><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi></mrow></math> — turning\nan intervention into a plain conditioning statement — whenever <math data-tex=\"Z\"><mi>Z</mi></math>'s only relevant relationship with\n<math data-tex=\"Y\"><mi>Y</mi></math> runs entirely through observable paths, once <math data-tex=\"X\"><mi>X</mi></math> is intervened on.</li>\n<li><strong>Rule 3</strong> says: an action <math data-tex=\"\\text{do}(Z)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can be dropped entirely (as if it were never performed)\nwhenever forcing <math data-tex=\"Z\"><mi>Z</mi></math> wouldn't have changed anything relevant to <math data-tex=\"Y\"><mi>Y</mi></math> anyway, given <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"W\"><mi>W</mi></math>.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — what these three rules are <em>for</em>.</strong> Individually the notation is dense, but the\ncollective purpose is simple: <strong>do-calculus is a proof system for turning an unmeasurable quantity\n(something with a <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> in it) into a measurable one (a plain conditional probability,\ncomputable from observational data), one legal graph-surgery step at a time.</strong> If a sequence of\nRule 1/2/3 applications can fully eliminate every <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from an expression, the causal\neffect is <strong>identifiable</strong> from observational data; Pearl proved these three rules are complete —\nif an effect <em>is</em> identifiable, some sequence of these rules will find it.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s10\" data-title=\"Backdoor and Frontdoor Criteria — Two Ready-Made Corollaries\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Backdoor and Frontdoor Criteria — Two Ready-Made Corollaries</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Two commonly used corollaries of the do-calculus.&quot;</em> Pearl (2000), <em>Causality</em>, Ch. 3; Huang &amp;\nValtorta (2006), <em>&quot;Identifiability in Causal Bayesian Networks.&quot;</em></p>\n</blockquote>\n<h3>8.1 Backdoor adjustment</h3>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X)) = \\sum_{z} P(Y\\mid X, Z{=}z)\\,P(Z{=}z)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>z</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Valid when <math data-tex=\"Z\"><mi>Z</mi></math> blocks all backdoor paths and contains no descendant of <math data-tex=\"X\"><mi>X</mi></math>.</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Backdoor path</strong> — any path between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> that starts with an arrow <em>into</em> <math data-tex=\"X\"><mi>X</mi></math> (i.e., a\npath running &quot;backward&quot; out of <math data-tex=\"X\"><mi>X</mi></math> through a common cause, rather than forward along <math data-tex=\"X\"><mi>X</mi></math>'s own\ncausal effect). These are exactly the paths that create confounding.</p>\n<p><strong>Words before symbols:</strong> if you can find a set of variables <math data-tex=\"Z\"><mi>Z</mi></math> that blocks every backdoor path\nfrom <math data-tex=\"X\"><mi>X</mi></math> to <math data-tex=\"Y\"><mi>Y</mi></math> (and doesn't itself get affected by <math data-tex=\"X\"><mi>X</mi></math>), then you can compute the causal effect by\na <strong>weighted average</strong>: look at <math data-tex=\"Y\"><mi>Y</mi></math>'s distribution within each stratum of <math data-tex=\"Z\"><mi>Z</mi></math> (that's the\n&quot;adjustment&quot; step — comparing like-with-like within each stratum, exactly as <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>'s Simpson's\nparadox fix required), then average those stratum-specific numbers back together, weighting by how\ncommon each stratum is. This is the formal generalization of &quot;compare recovery rates <em>within</em> each\nseverity stratum, then combine.&quot;</p>\n</blockquote>\n<h3>8.2 Frontdoor adjustment</h3>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid\\text{do}(X)) = \\sum_m P(m\\mid X)\\sum_{x'} P(Y\\mid m,x')\\,P(x')\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>m</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>m</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>m</mi><mo separator=\"true\">,</mo><msup><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Valid when mediator <math data-tex=\"M\"><mi>M</mi></math> satisfies: <math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>, no direct <math data-tex=\"X\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>Y</mi></mrow></math> path unblocked by <math data-tex=\"M\"><mi>M</mi></math>.</em></p>\n<ul>\n<li><strong>Backdoor: most common in practice</strong> (adjust for confounders).</li>\n<li><strong>Frontdoor: useful when confounders are unobserved but a mediator is measured.</strong></li>\n<li><strong>Both are derivable via the three rules of do-calculus</strong> — they are not separate assumptions\nbolted on to the theory; they are specific, named <em>consequences</em> of <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>'s three rules, packaged as\nreusable formulas because they come up so often in practice.</li>\n</ul>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — when do you reach for which?</strong> Reach for <strong>backdoor adjustment</strong> whenever\nyou can plausibly list and measure the common causes of treatment and outcome (the usual\n&quot;control for confounders&quot; instinct in applied statistics). Reach for <strong>frontdoor adjustment</strong>\nspecifically in the harder case where the confounder between <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> is <em>unmeasured or\nunmeasurable</em> (e.g., an unobserved genetic predisposition), but you happen to have measured a\n<strong>mediator</strong> — a variable that fully carries <math data-tex=\"X\"><mi>X</mi></math>'s effect on <math data-tex=\"Y\"><mi>Y</mi></math> — whose own relationship to <math data-tex=\"Y\"><mi>Y</mi></math> is\n<em>not</em> confounded by that same unmeasured variable. This is a substantially less common situation in\npractice, which is exactly why the slide calls backdoor &quot;most common&quot; and frontdoor &quot;useful when.&quot;</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s11\" data-title=\"RCTs — The Gold Standard\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">RCTs — The Gold Standard</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Randomisation guarantees <math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>.&quot;</em> Fisher (1935), <em>The Design of Experiments</em>,\nOliver &amp; Boyd.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\text{ATE} = \\mathbb{E}[Y\\mid T{=}1] - \\mathbb{E}[Y\\mid T{=}0]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>ATE</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p><em>Unbiased by design: no confounders (observed <strong>or unobserved</strong>).</em></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why randomization is uniquely powerful.</strong> Every technique in <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>\n(do-calculus, backdoor, frontdoor) works by <strong>adjusting for confounders you can identify and\nmeasure</strong>. Randomization sidesteps the entire problem differently: by assigning <math data-tex=\"T\"><mi>T</mi></math> purely by chance\n(a coin flip, independent of everything about the unit), it guarantees that treatment assignment is\nstatistically unrelated to <em>both</em> potential outcomes — <strong>including confounders you never thought to\nmeasure, or couldn't measure even in principle.</strong> This is the one thing no amount of clever\nobservational adjustment can promise, because adjustment can only control for variables you actually\nhave in your dataset.</p>\n</aside>\n<p>Four practical limitations, each of which pushes real-world problems back toward observational\nmethods:</p>\n<ul>\n<li><strong>Cost:</strong> experiments are expensive or slow.</li>\n<li><strong>Ethics:</strong> cannot randomize harmful exposures (you cannot ethically randomize people to smoke, to\nreceive a known-inferior treatment, or to be denied a beneficial intervention).</li>\n<li><strong>External validity:</strong> trial population <math data-tex=\"\\ne\"><mo lspace=\"0em\" rspace=\"0em\">≠</mo></math> deployment population — an effect measured in a\ncontrolled trial population may not transfer cleanly to the full population it will eventually be\ndeployed to.</li>\n<li><strong>Compliance:</strong> intention-to-treat <math data-tex=\"\\ne\"><mo lspace=\"0em\" rspace=\"0em\">≠</mo></math> per-protocol effect — the effect of <em>being assigned</em> to\ntreatment (what randomization directly guarantees) is not the same quantity as the effect of\n<em>actually receiving</em> treatment, once some assigned participants don't comply.</li>\n</ul>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;When randomisation is infeasible, we need observational methods + identification assumptions&quot;</em> —\nthe explicit handoff back to <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s machinery, and the sentence that frames the entire lecture as\none coherent argument: <strong>RCTs are the gold standard exactly because they need none of the\nassumptions <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> require, but the moment an RCT isn't possible, that assumption-laden machinery is\nthe only path back to a valid causal answer.</strong></p>\n</blockquote>\n<hr>\n</section><section id=\"causal-inference-21-s12\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>                    ┌──────────────────────────────┐\n                    │  P(Y|X) ≠ P(Y|do(X))           │\n                    │  the problem this whole         │\n                    │  lecture exists to solve         │\n                    └───────────────┬──────────────────┘\n                                    │\n                    ┌───────────────┴───────────────┐\n                    ▼                                ▼\n        ┌─────────────────────┐         ┌─────────────────────────┐\n        │ Potential Outcomes    │         │ Structural Causal Models │\n        │ (Rubin, 1974)          │         │ (Pearl, DAGs)             │\n        │ τ = Y(1) - Y(0)        │         │ do(X) = delete X's        │\n        │ fundamental problem:   │         │ incoming edges            │\n        │ never jointly observed │         └────────────┬─────────────┘\n        └───────────┬─────────────┘                      │\n                    │                       ┌─────────────┴─────────────┐\n                    │                       ▼                           ▼\n                    │           Conditional independence      d-separation: the\n                    │           (chain/fork/collider) —       complete, mechanical\n                    │           §5's atomic building block     rule built from §5\n                    │                       │                           │\n                    │                       └─────────────┬─────────────┘\n                    │                                     ▼\n                    │                          do-calculus's three rules:\n                    │                          reduce do(·) to observational\n                    │                          quantities, when possible\n                    │                                     │\n                    │                       ┌─────────────┴─────────────┐\n                    │                       ▼                           ▼\n                    │              Backdoor adjustment          Frontdoor adjustment\n                    │              (measured confounders)       (unmeasured confounders,\n                    │                                            measured mediator)\n                    │                                     │\n                    └─────────────────────┬───────────────┘\n                                          ▼\n                          RCTs: sidestep identification entirely by\n                          randomizing — but cost/ethics/generalizability\n                          push most real problems back to the machinery above</pre></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li><strong>Every technique here is answering the same single question</strong> — &quot;how do I compute $P(Y\\mid\n\\text{do}(X))$ when I can't literally perform the intervention?&quot; — from increasingly specific\nangles: potential outcomes names the target quantity and its fundamental unobservability; DAGs give\na language for <em>when</em> observational data is enough; do-calculus gives the mechanical procedure;\nbackdoor/frontdoor package the two most common special cases; RCTs are the one setting where the\nquestion never needs asking, because you <em>can</em> perform the intervention directly.</li>\n<li><strong>Confounding is the single villain, and it takes exactly three graphical shapes</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>): a fork\n(the classic confounder), and — much less intuitively — conditioning on a collider can\n<em>manufacture</em> the same kind of spurious association a fork creates naturally. Half of applied\ncausal inference is correctly identifying which shape you're looking at before you decide whether\nto control for a variable or leave it alone.</li>\n<li><strong>&quot;Identifiability&quot; is the load-bearing word of the entire lecture.</strong> A causal effect being\nwell-defined (as a quantity, via potential outcomes or the do-operator) is a completely separate\nquestion from whether it is <em>identifiable</em> — expressible in terms of quantities you can actually\nestimate from the data you have. Do-calculus, backdoor, and frontdoor are all, at bottom,\nidentification results; RCTs matter because they make identification trivial by construction.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-21-s13\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">14 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">In one sentence, why is P(Y|X) not the same quantity as P(Y|do(X))?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><math data-tex=\"P(Y\\mid X)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> conditions on units that <em>happened</em> to have a particular value of <math data-tex=\"X\"><mi>X</mi></math>, which can be\ncorrelated with other factors (confounders) that also affect <math data-tex=\"Y\"><mi>Y</mi></math>; <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> describes\nwhat happens if <math data-tex=\"X\"><mi>X</mi></math> is <em>forced</em> to that value independent of whatever normally determines it, cutting\noff any confounding influence — the two coincide only when <math data-tex=\"X\"><mi>X</mi></math> is not confounded with <math data-tex=\"Y\"><mi>Y</mi></math> (e.g.,\nunder randomization).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain how Simpson's paradox can make Hospital A look worse in aggregate while being better in every subgroup.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>If Hospital A treats a much higher proportion of severe (harder-to-treat, lower-recovery) cases than\nHospital B, its aggregate recovery rate is a weighted average pulled down more heavily by that harder\ncase mix — even if Hospital A outperforms Hospital B within <em>both</em> the mild and severe subgroups\nindividually. Case severity is a confounder affecting both which hospital treats a patient and the\nprobability of recovery, and the aggregate comparison fails to account for the unequal case mix.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is the \"fundamental problem of causal inference,\" and why does it make τ_i uncomputable for a single unit?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Each unit has two potential outcomes, <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, but the switching equation guarantees\nonly one is ever observed, depending on which treatment the unit actually received — the other is a\ncounterfactual that never happened. Since <math data-tex=\"\\tau_i = Y_i(1) - Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> requires both values for the same\nunit, it can never be directly computed; every practical estimator instead targets an <em>aggregate</em>\n(ATE, ATT, or CATE) across many units, not any individual unit's exact effect.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does \"deleting an edge\" in a causal DAG correspond to, and why is this the graphical definition of intervention?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Deleting the edges pointing <em>into</em> a node <math data-tex=\"X\"><mi>X</mi></math> removes every causal influence that would normally\ndetermine <math data-tex=\"X\"><mi>X</mi></math>'s value, then fixes <math data-tex=\"X\"><mi>X</mi></math> at the intervened value — exactly capturing the idea of forcing\n<math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math> regardless of what would ordinarily cause it. This graph-surgery operation is the formal,\ngraphical counterpart of the do-operator: <math data-tex=\"P(Y\\mid\\text{do}(X{=}x))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is read off the graph after this\nedge deletion, whereas <math data-tex=\"P(Y\\mid X{=}x)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is read off the original, unmodified graph.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Classify X→M→Y and X←Z→Y by whether conditioning on the middle node blocks or opens the path, and explain the collider case, which behaves oppositely.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>In both the chain (<math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>) and the fork (<math data-tex=\"X\\leftarrow Z\\to Y\"><mrow><mi>X</mi><mo stretchy=\"false\">←</mo><mi>Z</mi><mo>→</mo><mi>Y</mi></mrow></math>), <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out\nassociated, and conditioning on the middle node (M or Z) <strong>blocks</strong> that association — in the chain\nbecause you've cut the only causal pathway, in the fork because you've controlled for the shared\ncause. A collider (<math data-tex=\"X\\to C\\leftarrow Y\"><mrow><mi>X</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>) behaves oppositely: <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out independent, and\nconditioning on <math data-tex=\"C\"><mi>C</mi></math> (their common effect) <strong>opens</strong> a spurious association between them that did not\nexist unconditionally — this is collider bias / Berkson's paradox.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">State d-separation's blocking rule and explain why it needs two different cases (collider vs. non-collider).</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>A path is blocked by conditioning set <math data-tex=\"Z\"><mi>Z</mi></math> if it contains either (i) a non-collider that is <em>in</em> <math data-tex=\"Z\"><mi>Z</mi></math>,\nor (ii) a collider whose descendants are all <em>outside</em> <math data-tex=\"Z\"><mi>Z</mi></math>. Two cases are needed because non-colliders\n(chain/fork middle nodes) and colliders behave oppositely under conditioning (per Q5) — a single\nuniform rule would get one of the two cases backward; the two-part definition correctly captures both\nbehaviors within one mechanical procedure.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does it mean for a causal effect to be \"identifiable,\" and how does do-calculus relate to that definition?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>A causal effect <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is identifiable if it can be re-expressed purely in terms of\nthe <em>observational</em> joint distribution <math data-tex=\"P(V)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>V</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> over the measured variables — i.e., computed from data\nyou could actually collect, without ever needing to perform the intervention. Do-calculus's three\nrules are a proof system for this: if some sequence of Rule 1/2/3 applications eliminates every\n<math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from the expression, the effect is identifiable, and the rules are provably complete\n(they will find such a sequence whenever one exists).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">When would you use frontdoor adjustment instead of backdoor adjustment?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Backdoor adjustment requires measuring and conditioning on a set of variables that blocks every\nbackdoor (confounding) path between treatment and outcome — it fails if a relevant confounder is\nunobserved. Frontdoor adjustment is the fallback for exactly that failure case: it requires instead a\nmeasured <em>mediator</em> through which the entire treatment effect flows, whose own relationship to the\noutcome is not confounded by the same unmeasured variable — letting you identify the effect without\never needing to measure the confounder directly.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Why does an RCT not need any of the identification machinery in §4–§8?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Randomization makes treatment assignment <math data-tex=\"T\"><mi>T</mi></math> statistically independent of both potential outcomes,\n<math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>, by construction — including confounders that were never measured or even\nidentified as relevant. Backdoor/frontdoor adjustment and do-calculus all exist specifically to handle\nconfounding when treatment assignment is <em>not</em> independent of potential outcomes; since randomization\nguarantees that independence directly, the raw difference in group means, $\\mathbb{E}[Y\\mid T{=}1] -\n\\mathbb{E}[Y\\mid T{=}0]$, is already an unbiased estimate of the ATE with no adjustment required.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A colleague wants to \"control for\" every available variable in a regression to be safe. Using the collider concept, explain what could go wrong.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>If any of those variables is a collider on a causal path between the treatment and outcome of\ninterest — a common <em>effect</em> of both, rather than a common cause — conditioning on it does not remove\nconfounding but <em>introduces</em> a new spurious association where none existed (collider bias / Berkson's\nparadox), potentially biasing the estimated effect in either direction. &quot;Control for everything\navailable&quot; is not a safe default; each variable needs to be classified by its position in the causal\ngraph (confounder to adjust for vs. mediator or collider to leave alone) before deciding whether\nconditioning on it helps or hurts identification.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;Backdoor adjustment requires Z to block all backdoor paths AND contain no descendant of X — why\nis the second condition necessary?&quot;</em> — conditioning on a descendant of <math data-tex=\"X\"><mi>X</mi></math> can partially or fully\nblock <math data-tex=\"X\"><mi>X</mi></math>'s own <em>causal</em> effect on <math data-tex=\"Y\"><mi>Y</mi></math> if that descendant lies on the causal pathway (effectively\nturning part of the causal chain into a controlled-for mediator), which would bias the estimate of\n<math data-tex=\"X\"><mi>X</mi></math>'s total effect downward, or introduce collider bias if the descendant is also a collider with\nsome other cause of <math data-tex=\"Y\"><mi>Y</mi></math>.</li>\n<li><em>&quot;Why is faithfulness described as a 'generic' assumption rather than something that's always\ntrue?&quot;</em> — faithfulness fails only when causal effects happen to cancel exactly (e.g., a direct\npositive effect and an indirect negative effect through a mediator that sum to precisely zero) —\na measure-zero coincidence in the space of possible parameter values, which is why it's treated as\na reasonable default assumption rather than a guaranteed property of every real system.</li>\n<li><em>&quot;RCTs guarantee internal validity — what's a concrete mechanism by which external validity can\nstill fail even with perfect randomization?&quot;</em> — the trial population itself may be recruited from a\nnarrower or systematically different group than the eventual deployment population (e.g., clinical\ntrial volunteers skew healthier or more compliant than the general patient population), so the\nmeasured ATE, though unbiased <em>for that trial population</em>, need not transfer to a different target\npopulation — this is a population-mismatch problem randomization does nothing to solve.</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>The switching equation and why <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math> is unobservable</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3.1–3\" role=\"link\" tabindex=\"0\">§3.1–3</a>.2: write\n<math data-tex=\"Y_i=T_iY_i(1)+(1-T_i)Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, then note that observing <math data-tex=\"T_i=1\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></math> reveals <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> but leaves\n<math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> permanently counterfactual for that unit (and vice versa), so <math data-tex=\"\\tau_i=Y_i(1)-Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can\nnever be directly computed for any single unit.</li>\n<li><strong>Classifying a three-node structure and predicting the effect of conditioning</strong> — reproduce <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s\ntable from memory: for chain and fork, conditioning on the middle node blocks the path; for\ncollider, conditioning on the middle node opens it — and explain each case's mechanism, not just\nthe label.</li>\n<li><strong>The backdoor adjustment formula, and why it requires summing over strata of Z</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8.1\" role=\"link\" tabindex=\"0\">§8.1</a>:\n<math data-tex=\"P(Y\\mid\\text{do}(X))=\\sum_z P(Y\\mid X,Z{=}z)P(Z{=}z)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mo movablelimits=\"false\">∑</mo><mi>z</mi></msub><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — derive in words why this is a\n<em>weighted average of within-stratum comparisons</em>, directly generalizing the Simpson's-paradox fix\nof comparing recovery rates within each severity stratum before combining.</li>\n</ol>\n<h3>Applied scenario — Amazon marketing-attribution</h3>\n<p><strong>Framing:</strong> Amazon wants to know whether a specific email marketing campaign <em>causes</em> increased\npurchase rates, using historical data where customers who opened the email are compared to customers\nwho didn't.</p>\n<p><strong>Data:</strong> Observational — customer purchase history, email engagement logs, and available customer\ncovariates (past purchase frequency, account age, browsing activity).</p>\n<p><strong>Model:</strong> This is a textbook confounding setup (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>): customers who are already more engaged with\nAmazon (frequent browsers, frequent past purchasers) are <em>both</em> more likely to open marketing emails\n<em>and</em> more likely to purchase regardless of the email — engagement level is a confounder <math data-tex=\"Z\"><mi>Z</mi></math> inducing\na spurious correlation between &quot;opened email&quot; (<math data-tex=\"X\"><mi>X</mi></math>) and &quot;purchased&quot; (<math data-tex=\"Y\"><mi>Y</mi></math>) even if the email's true\ncausal effect were small or zero. The naive comparison $\\mathbb{E}[Y\\mid X{=}1]-\\mathbb{E}[Y\\mid\nX{=}0]$ (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s exact &quot;prediction vs. causal question&quot; trap) would overstate the campaign's effect.\nApplying <strong>backdoor adjustment</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8.1\" role=\"link\" tabindex=\"0\">§8.1</a>) using measured engagement covariates as the adjustment set <math data-tex=\"Z\"><mi>Z</mi></math>\n— provided they block all backdoor paths — gives a properly identified estimate of\n<math data-tex=\"P(\\text{purchase}\\mid\\text{do}(\\text{opened email}))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>purchase</mtext><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>opened email</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. Where feasible and ethical, a <strong>randomized\nholdout</strong> (an RCT, <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>) — randomly withholding the campaign from a control group — sidesteps the\nidentification problem entirely and is the gold-standard design Amazon marketing teams typically\nprefer when cost and customer experience allow it.</p>\n<p><strong>Metric:</strong> The estimated ATE (incremental purchase rate caused by the campaign), not the raw\nopen-vs-non-open purchase-rate gap, since only the former isolates the campaign's actual causal\ncontribution from pre-existing engagement differences.</p>\n<p><strong>Failure modes:</strong> Unmeasured confounders (e.g., a customer's underlying purchase intent that both\nmakes them likely to check email <em>and</em> likely to buy) would violate the backdoor criterion if not\ncaptured by the measured covariates — this is exactly the scenario where frontdoor adjustment (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8.2\" role=\"link\" tabindex=\"0\">§8.2</a>)\nor a genuine randomized holdout becomes necessary instead of backdoor adjustment on the covariates at\nhand.</p>\n<p><strong>What you'd ship:</strong> A randomized holdout test as the primary evidence where feasible, cross-validated\nagainst an observational backdoor-adjusted estimate using engagement covariates as a sanity check —\nflagging any large divergence between the two as evidence of residual, unmeasured confounding.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Dive Deep</strong> — refusing to accept &quot;email openers purchase more&quot; as\nevidence the email <em>works</em>, and instead explicitly identifying engagement level as the confounder\ndriving both, is the precise discipline this lecture is built to instill. <strong>Insist on the Highest\nStandards</strong> — preferring a randomized holdout over a purely observational estimate whenever a real\nbusiness decision (marketing spend) rides on the answer reflects exactly the RCT-vs-observational\ntrade-off <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a> lays out.</p>\n<hr>\n</section><section id=\"causal-inference-21-s14\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>ATE (Average Treatment Effect)</strong> — <math data-tex=\"\\mathbb{E}[\\tau_i]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average causal effect across the\nwhole population.</li>\n<li><strong>ATT (Average Treatment effect on the Treated)</strong> — <math data-tex=\"\\mathbb{E}[\\tau_i\\mid T_i{=}1]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>T</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average\neffect among units that actually received treatment.</li>\n<li><strong>Backdoor path</strong> — a path between treatment and outcome that starts with an arrow into the\ntreatment node; the source of confounding.</li>\n<li><strong>CATE (Conditional Average Treatment Effect)</strong> — <math data-tex=\"\\mathbb{E}[\\tau_i\\mid X_i{=}x]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>X</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average\neffect within a covariate-defined subgroup.</li>\n<li><strong>Chain</strong> — a three-node structure <math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>; conditioning on <math data-tex=\"M\"><mi>M</mi></math> blocks the <math data-tex=\"X\"><mi>X</mi></math>–<math data-tex=\"Y\"><mi>Y</mi></math>\nassociation.</li>\n<li><strong>Collider</strong> — a three-node structure <math data-tex=\"X\\to C\\leftarrow Y\"><mrow><mi>X</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>; conditioning on <math data-tex=\"C\"><mi>C</mi></math> <em>opens</em> a spurious\n<math data-tex=\"X\"><mi>X</mi></math>–<math data-tex=\"Y\"><mi>Y</mi></math> association (Berkson's paradox).</li>\n<li><strong>Confounder</strong> — a variable that causally influences both the treatment and the outcome, creating\nan association between them even absent a direct causal effect.</li>\n<li><strong>DAG (Directed Acyclic Graph)</strong> — a graph encoding a factorization of a joint distribution, with\ncausal semantics: edges are direct causal influences, edge deletion represents intervention.</li>\n<li><strong>d-separation</strong> — the sound and complete graphical procedure for reading conditional\nindependencies directly off a DAG.</li>\n<li><strong>do-calculus</strong> — Pearl's three-rule proof system for reducing <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> expressions to\npurely observational quantities.</li>\n<li><strong>do-operator, <math data-tex=\"\\text{do}(X{=}x)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — notation for forcing <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math> via intervention, as opposed to\nobserving <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>.</li>\n<li><strong>Fork</strong> — a three-node structure <math data-tex=\"X\\leftarrow Z\\to Y\"><mrow><mi>X</mi><mo stretchy=\"false\">←</mo><mi>Z</mi><mo>→</mo><mi>Y</mi></mrow></math> (confounder); conditioning on <math data-tex=\"Z\"><mi>Z</mi></math> blocks the\n<math data-tex=\"X\"><mi>X</mi></math>–<math data-tex=\"Y\"><mi>Y</mi></math> association.</li>\n<li><strong>Frontdoor adjustment</strong> — an identification formula using a measured mediator, valid when\nconfounders are unobserved.</li>\n<li><strong>Fundamental problem of causal inference</strong> — the fact that only one of a unit's two potential\noutcomes is ever observed.</li>\n<li><strong>Identification</strong> — the process of expressing an unobservable causal quantity in terms of an\nestimable statistical one.</li>\n<li><strong>Potential outcomes</strong> — <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the two possible outcomes a unit could have under\ntreatment or control.</li>\n<li><strong>RCT (Randomized Controlled Trial)</strong> — an experimental design where treatment assignment is\nrandomized, guaranteeing <math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>.</li>\n<li><strong>Simpson's paradox</strong> — an association that reverses between the aggregate population and every\nsubgroup, caused by an unequally-distributed confounder.</li>\n<li><strong>Switching equation</strong> — <math data-tex=\"Y_i = T_iY_i(1) +
