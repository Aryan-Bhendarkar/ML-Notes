lf would affect (a mediator) or any metric jointly caused by adoption and speed\n(a potential collider, e.g., a composite &quot;efficiency score&quot; computed partly from processing time\nitself). Given plausibly many covariates, follow <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>'s bridge directly: estimate the propensity\n<math data-tex=\"e(x)=P(\\text{adopted}\\mid X)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>adopted</mtext><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and the outcome model <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> with flexible ML models rather than\nhand-built logistic/linear fits, then combine them via <strong>AIPW</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>) for robustness to either model\nbeing imperfectly specified — and explicitly check <strong>positivity</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>) first: are there\nearly-adopter-type centers with no late-adopter counterpart of similar size/volume, or vice versa?</p>\n<p><strong>Metric:</strong> The estimated ATT (average effect on centers that actually adopted) is likely the right\nestimand if the business question is &quot;should we keep/expand the rollout to more centers,&quot; per <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>'s\nestimand-choice guidance — not ATE, unless a company-wide mandate to <em>all</em> centers regardless of fit\nis genuinely being considered.</p>\n<p><strong>Failure modes:</strong> Unmeasured confounders — e.g., a center's overall management quality, which\ncould drive both earlier adoption <em>and</em> independently better processing times — would violate\nunconfoundedness (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>) with no way to detect this from the data alone; this is exactly the scenario\nwhere, if a true randomized or quasi-randomized rollout order is available, it should be strongly\npreferred over any purely observational estimate.</p>\n<p><strong>What you'd ship:</strong> An AIPW estimate with explicit propensity overlap diagnostics reported alongside\nthe effect size (following <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>'s lesson that overlap matters more than estimator sophistication), plus\na sensitivity analysis for the untestable unconfoundedness assumption rather than a single unqualified\npoint estimate.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Insist on the Highest Standards</strong> — explicitly checking positivity\nand refusing to report an extrapolated effect estimate for fulfillment centers outside the range of\ncovariate overlap (echoing <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>'s regression-adjustment warning) is exactly the discipline that\nseparates a defensible causal claim from a superficially confident but unsupported one. <strong>Dive Deep</strong>\n— correctly distinguishing a genuine confounder (center size) from a mediator (a post-adoption\noperational metric) before deciding what to adjust for requires exactly the causal-graph reasoning\nthis lecture builds, not a reflexive &quot;control for everything available.&quot;</p>\n<hr>\n</section><section id=\"causal-inference-22-s21\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s21\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>AIPW (Augmented Inverse Probability Weighting)</strong> — the doubly robust estimator combining an\noutcome regression with an inverse-probability-weighted correction term.</li>\n<li><strong>ATC (Average Treatment effect on the Controls)</strong> — <math data-tex=\"\\mathbb{E}[Y(1)-Y(0)\\mid T{=}0]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average\neffect the untreated group would have gained had they been treated.</li>\n<li><strong>ATE (Average Treatment Effect)</strong> — <math data-tex=\"\\mathbb{E}[Y(1)-Y(0)]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, averaged over the whole population.</li>\n<li><strong>ATT (Average Treatment effect on the Treated)</strong> — <math data-tex=\"\\mathbb{E}[Y(1)-Y(0)\\mid T{=}1]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, averaged over\nunits that actually received treatment.</li>\n<li><strong>CATE (Conditional Average Treatment Effect)</strong> — <math data-tex=\"\\tau(x)=\\mathbb{E}[Y(1)-Y(0)\\mid X{=}x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the\neffect within a covariate-defined subgroup.</li>\n<li><strong>Curse of dimensionality (matching context)</strong> — the exponential growth in the number of covariate\ncells relative to a fixed sample size, which empties nearly every cell of one or both treatment\narms.</li>\n<li><strong>Doubly robust</strong> — a property of an estimator that remains consistent if either of two nuisance\nmodels (propensity, outcome) is correctly specified.</li>\n<li><strong>Estimand</strong> — the causal target, fixed before seeing any data.</li>\n<li><strong>Estimate</strong> — the numeric answer a specific dataset returns under a chosen estimator.</li>\n<li><strong>Estimator</strong> — the procedure/rule that converts data into an estimate.</li>\n<li><strong>ITE (Individual Treatment Effect)</strong> — <math data-tex=\"\\tau_i=Y_i(1)-Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the per-unit effect, never directly\nobserved.</li>\n<li><strong>IPW (Inverse-Probability Weighting)</strong> — reweighting units by the inverse of their estimated\ntreatment-assignment probability to construct a balanced comparison.</li>\n<li><strong>Overlap / common support</strong> — the region of covariate space where both treated and control units\nare observed.</li>\n<li><strong>Positivity</strong> — the assumption <math data-tex=\"0&lt;P(T{=}1\\mid X{=}x)&lt;1\"><mrow><mn>0</mn><mo>&lt;</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&lt;</mo><mn>1</mn></mrow></math> for all <math data-tex=\"x\"><mi>x</mi></math>; both treatment arms possible\nat every covariate value.</li>\n<li><strong>Propensity score</strong> — <math data-tex=\"e(x)=P(T{=}1\\mid X{=}x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the probability of treatment given covariates.</li>\n<li><strong>Regression adjustment (standardisation)</strong> — estimating the causal effect by directly modeling the\noutcome as a function of treatment and covariates, then imputing missing potential outcomes.</li>\n<li><strong>Selection bias</strong> — the pre-treatment difference between treated and control groups that\ncontaminates a raw outcome comparison.</li>\n<li><strong>SMD (Standardized Mean Difference)</strong> — a covariate imbalance measure, in units of pooled standard\ndeviations.</li>\n<li><strong>Stratification (subclassification)</strong> — partitioning units into covariate-defined bins and\naveraging within-bin treated-minus-control gaps.</li>\n<li><strong>SUTVA (Stable Unit Treatment Value Assumption)</strong> — no interference between units; one well-defined\ntreatment version per unit.</li>\n<li><strong>Trimming</strong> — capping or discarding units with extreme propensity-score-derived weights to control\nestimator variance.</li>\n<li><strong>Unconfoundedness</strong> — <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math>; given covariates, treatment assignment carries\nno extra information about potential outcomes.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-22-s22\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s22\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Explain, using the actual dollar figures, why the randomized-trial ATT and the naive comparison on\nthis dataset have opposite signs. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>)</em></li>\n<li>Distinguish estimand, estimator, and estimate, and explain the two distinct ways an estimate can be\nwrong. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>Name all five treatment-effect estimands and give a distinct business question each one answers.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Write the naive-estimate decomposition formula from memory and explain both terms. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a>)</em></li>\n<li>Given a control variable, determine whether adjusting for it is safe (confounder), harmful\n(mediator/collider), or merely costly (pure predictor of <math data-tex=\"T\"><mi>T</mi></math>), and cite the dataset's own numeric\nevidence for each case. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)</em></li>\n<li>Explain why unconfoundedness is untestable while positivity and SUTVA can at least be partially\nchecked from data. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>, <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>, <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>Work through the curse-of-dimensionality calculation for <math data-tex=\"p=6\"><mrow><mi>p</mi><mo>=</mo><mn>6</mn></mrow></math> coarsened covariates at 3 levels\neach, and state what fraction of cells this dataset's earlier example found populated at <math data-tex=\"p=8\"><mrow><mi>p</mi><mo>=</mo><mn>8</mn></mrow></math>.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>State the propensity-score design rule that contradicts the intuitive &quot;predict <math data-tex=\"T\"><mi>T</mi></math> as accurately as\npossible&quot; instinct, and explain why. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>)</em></li>\n<li>Write the IPW ATT formula and explain what &quot;2 of 185 controls carry 66.3% of the control weight&quot;\ndemonstrates about it. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>)</em></li>\n<li>Explain what &quot;doubly robust&quot; specifically guarantees, and under what single condition that\nguarantee fails. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>)</em></li>\n<li>From the full comparison table, identify which estimator landed closest to the known truth, and\nexplain the lecture's own stated reason why matching outperformed some more sophisticated methods.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>)</em></li>\n<li>Explain how classical stratification, matching, IPW, and AIPW all reduce to estimating the same\ntwo functions, and name both. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-22-s23\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s23\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>LaLonde (1986), &quot;Evaluating the Econometric Evaluations of Training Programs with Experimental\nData&quot;</strong> ⚠️ <strong>verify this</strong> — not cited directly on the lecture's own slides, but the dataset\n(National Supported Work programme, mid-1970s, ATT ≈ $1,794) matches this well-known benchmark\ndataset in the causal inference literature. <code>solid</code> if the attribution is correct — treat as\nbackground context pending confirmation, not a transcribed citation.</li>\n<li><strong>Rosenbaum &amp; Rubin (1983), &quot;The Central Role of the Propensity Score in Observational Studies for\nCausal Effects&quot;</strong> ⚠️ not named on the slides — the foundational propensity-score paper, added here\nfrom general field knowledge as the primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>. <code>solid</code>.</li>\n<li><strong>Horvitz &amp; Thompson (1952), &quot;A Generalization of Sampling Without Replacement from a Finite\nUniverse&quot;</strong> ⚠️ not named on the slides — the IPW formula in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a> is explicitly labeled\n&quot;Horvitz-Thompson&quot; on the lecture's own slide, so this is the paper that name refers to. <code>hard</code>.</li>\n<li><strong>Robins, Rotnitzky, Zhao (1994), &quot;Estimation of Regression Coefficients When Some Regressors Are\nNot Always Observed&quot;</strong> ⚠️ not named on the slides — a foundational doubly-robust/AIPW paper, added\nfrom general field knowledge as background for <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>. <code>hard</code>.</li>\n<li><strong>Chernozhukov et al. (2018), &quot;Double/Debiased Machine Learning for Treatment and Structural\nParameters&quot;</strong> — <strong>named directly on the slide</strong> as &quot;Neyman orthogonality and DML&quot; [slide 85].\n<code>hard</code> · the natural next read given <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>'s explicit bridge from classical estimation to ML-based\nnuisance function estimation.</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — only item 5 (DML/Neyman orthogonality) is explicitly named on the lecture's own\nslides. Items 1–4 are added from general causal-inference field knowledge to support concepts the\nlecture uses (the dataset, propensity scores, Horvitz-Thompson weighting, doubly robust estimation)\nbut does not itself cite by author/year — treat them as suggested background reading, not\ntranscribed lecture citations.</p>\n</aside>\n</section>","sections":[{"id":"causal-inference-22-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s1","num":"","title":"Before we start: what you need to know","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s2","num":"","title":"The big picture","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s3","num":"1","title":"A Job-Training Experiment — the Dataset Everything Is Judged Against","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s4","num":"2","title":"Two Estimates of One Treatment Effect","mins":1,"kind":"content","part":""},{"id":"causal-inference-22-s5","num":"3","title":"Estimand, Estimator, Estimate — One Causal Number Is Really Three Things","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s6","num":"4","title":"Treatment-Effect Estimands — the Same Unit-Level Effect, Averaged Differently","mins":4,"kind":"content","part":""},{"id":"causal-inference-22-s7","num":"5","title":"Selection Bias and Its Two Families","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s8","num":"6","title":"Good and Bad Controls","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s9","num":"7","title":"Unconfoundedness","mins":10,"kind":"content","part":""},{"id":"causal-inference-22-s10","num":"8","title":"Stratification (Subclassification)","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s11","num":"9","title":"Matching","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s12","num":"10","title":"The Curse of Dimensionality","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s13","num":"11","title":"Propensity Score","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s14","num":"12","title":"Inverse-Probability Weighting (IPW)","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s15","num":"13","title":"Regression Adjustment (Standardisation)","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s16","num":"14","title":"Doubly Robust Estimation (AIPW)","mins":3,"kind":"content","part":""},{"id":"causal-inference-22-s17","num":"15","title":"Estimates Compared — The Full Scoreboard","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s18","num":"16","title":"From Classical Estimation to Machine Learning","mins":2,"kind":"content","part":""},{"id":"causal-inference-22-s19","num":"","title":"Putting it together","mins":3,"kind":"back","part":""},{"id":"causal-inference-22-s20","num":"","title":"Interview prep — Amazon Applied Scientist","mins":16,"kind":"back","part":""},{"id":"causal-inference-22-s21","num":"","title":"Glossary","mins":3,"kind":"back","part":""},{"id":"causal-inference-22-s22","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"causal-inference-22-s23","num":"","title":"Going deeper","mins":2,"kind":"back","part":""}],"interactiveCount":3},{"id":"causal-inference-23","num":"23","file":"causal-inference-03","kind":"lecture","title":"Causal Inference — Part 3: Causal ML Methods for Treatment Effect Estimation","h1":"Causal Inference — Part 3: Causal ML Methods for Treatment Effect Estimation","subtitle":"Causal ML Methods for Treatment Effect Estimation","spineLabel":"Part 3","short":"Causal ML Methods for Treatment Effect Estimation","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~1:20:00. Built from the raw capture in <code>output/Lecture_23 - Module 7 Causal Inference Part 3/</code> (102 raw frames), not <code>slides_deduped/</code> — see project memory <code>slides-deduped-is-lossy</code>.\nInstructor: <strong>Pranita Khandelwal</strong>, Senior Data Scientist, International Machine Learning team at\nAmazon (buyer abuse prevention and payment experiences) — confirmed from the slide nameplate. This\nis the third and final lecture in the causal inference series, completing the progression from\nfoundational theory (Part 1) through classical estimation (Part 2) to modern ML-based methods for\nheterogeneous treatment effect estimation and debiased causal inference.</p>\n</blockquote>\n<hr>\n</div><section id=\"causal-inference-23-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain why ATE alone is insufficient</strong> for decision-making and state the precise definition\nof CATE (τ(x)), relating it back to the potential outcomes framework from Part 1.</li>\n<li><strong>Build an S-Learner, T-Learner, and X-Learner from first principles</strong>, explaining the\ninformation-sharing properties and failure modes of each, and choose among them given the\nimbalance structure of a dataset.</li>\n<li><strong>Explain why honest estimation in causal trees</strong> prevents overfitting and enables valid\nconfidence intervals, and describe how causal forests reduce variance through ensembling.</li>\n<li><strong>Explain why representation learning is necessary</strong> for deep causal methods, and describe how\nTarNet and CFRNet achieve covariate balance in a learned latent space.</li>\n<li><strong>State the three key ideas of the DML framework</strong> (partialing out, Neyman orthogonality,\ncross-fitting) and explain how each addresses a specific failure mode of naive ML-based\ncausal estimation.</li>\n<li><strong>Derive the Robinson decomposition</strong> and explain why it eliminates the unknown confounding\nfunction g(x) from the partially linear model.</li>\n<li><strong>Explain the Neyman orthogonality condition</strong> and why it makes the treatment effect estimator\ninsensitive to first-order nuisance function errors, reducing bias from O(δ) to O(δ²).</li>\n<li><strong>Describe the R-Learner's objective function</strong> and explain why it generalizes OLS from fixed\ntreatment effects to heterogeneous ones.</li>\n<li><strong>Explain the DR-Learner's doubly robust and Neyman orthogonal properties</strong>, and describe how\nit generates pseudo-outcomes from AIPW for subsequent meta-learning.</li>\n<li><strong>Map the entire causal ML landscape</strong> — from meta-learners to representation learning to\northogonal learners — onto the canonical causal DAG, explaining which edges each method\ntargets and how.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-23-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — Potential outcomes and CATE (from Parts 1–2)</h3>\n<p>This lecture assumes familiarity with the potential outcomes framework (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> of Part 1): <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>,\n<math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the switching equation, the fundamental problem of causal inference, and the five\nestimands (ITE, ATE, ATT, ATC, CATE). If <math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) \\mid X = x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> is\nunfamiliar, read <a class=\"xref\" data-xref-lec=\"causal-inference-01\" data-xref=\"Part 1 §3\" role=\"link\" tabindex=\"0\">Part 1 §3</a> and <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §4\" role=\"link\" tabindex=\"0\">Part 2 §4</a> first.</p>\n<h3>Prerequisite 2 — The classical estimation toolkit (from Part 2)</h3>\n<p>This lecture builds directly on Part 2's classical methods: stratification, matching, propensity\nscores, IPW, regression adjustment, and doubly robust (AIPW) estimation. In particular, the\n<strong>nuisance functions</strong> <math data-tex=\"e(x) = P(T=1|X=x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo>=</mo><mn>1</mn><mi>|</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (propensity) and <math data-tex=\"\\mu_t(x) = \\mathbb{E}[Y|T=t, X=x]\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>\n(outcome model) from <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §16\" role=\"link\" tabindex=\"0\">Part 2 §16</a> are used throughout this lecture without re-derivation.</p>\n<h3>Prerequisite 3 — Regularization bias</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Regularization bias</strong> — when a flexible ML model (random forest, neural network, etc.) is\noptimized for predictive accuracy using techniques like L1/L2 penalties, dropout, early stopping,\nor tree pruning, the resulting model's predictions can be systematically biased in ways that don't\nvanish with more data. This is the central problem <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §16\" role=\"link\" tabindex=\"0\">Part 2 §16</a> flagged and Part 3 solves.</p>\n</blockquote>\n<p>In standard supervised learning, regularization bias is acceptable because it trades bias for\nvariance, often improving generalization — see <a class=\"xref\" data-xref-lec=\"supervised-learning-01\" role=\"link\" tabindex=\"0\">Supervised Learning Part 1\n§9</a>, &quot;The bias–variance trade-off,&quot; for the full\nderivation of why that trade is normally a good one. In causal inference, this same bias propagates\ndirectly into treatment effect estimates and <strong>does not vanish with more data</strong> — making it a much\nmore serious problem that requires specialized solutions (DML, orthogonal learners).</p>\n<h3>Prerequisite 4 — The factual MSE loss</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Factual MSE</strong> — a loss function that computes mean squared error only on the <em>observed</em>\n(factual) outcomes, not the counterfactual ones. Since we only observe <math data-tex=\"Y_i(T_i)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and never\n<math data-tex=\"Y_i(1-T_i)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for any unit, this is the only loss directly computable from observational data.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\mathcal{L}_{\\text{factual}} = \\sum_{i: T_i=1} \\big(Y_i - \\hat\\mu_1(X_i)\\big)^2 + \\sum_{i: T_i=0} \\big(Y_i - \\hat\\mu_0(X_i)\\big)^2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi class=\"mathcal\">ℒ</mi><mtext>factual</mtext></msub><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup><mo>+</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup></mrow></math></div>\n<hr>\n</section><section id=\"causal-inference-23-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Parts 1 and 2 established <em>why</em> causal inference is hard and <em>what</em> classical methods can do with\nlow-dimensional data. This lecture asks: <strong>what happens when the data is high-dimensional, the\ntreatment effects are heterogeneous, and we need ML's flexibility without ML's regularization\nbias?</strong></p>\n<figure class=\"ascii\"><pre>Part 1 — Foundations (Lecture 21)\n   Why P(Y|X) ≠ P(Y|do(X)). DAGs, do-calculus, backdoor/frontdoor. RCTs as gold standard.\n        │\n        ▼\nPart 2 — Classical Estimation (Lecture 22)\n   Six recipes (stratification → AIPW) scored against a known $1,794 truth.\n   Finding: overlap matters more than estimator choice.\n   Bridge: every method reduces to estimating e(x) and μ_t(x) — exactly what ML can replace.\n        │\n        ▼\nPart 3 — Causal ML Methods (Lecture 23, this file)\n   │\n   ├── Heterogeneous treatment effects: from ATE to CATE (§1–§2)\n   │\n   ├── Meta-learners: S, T, X (§3) — flexible ML plug-ins, but regularization bias\n   │\n   ├── Causal trees &amp; forests (§4) — honest estimation, valid CIs, interpretable\n   │\n   ├── Deep representation learning: TarNet, CFRNet (§5) — neural-net-based balancing\n   │\n   ├── DML framework (§6–§8): the theoretical backbone\n   │   ├── Partialing out (Robinson decomposition) — remove confounders\n   │   ├── Neyman orthogonality — suppress nuisance-function bias\n   │   └── Cross-fitting — prevent overfitting\n   │\n   ├── R-Learner (§9) — DML + heterogeneous effects via meta-learner interface\n   │\n   ├── DR-Learner (§10) — doubly robust + orthogonal + meta-learner\n   │\n   └── The full landscape mapped onto the canonical DAG (§11)\n        │\n        ▼\n   Beyond treatment effects: robust ML, causal generative models, causal RL,\n   fairness, explainability, LLMs (§12)</pre></figure>\n<hr>\n</section><section id=\"causal-inference-23-s3\" data-title=\"From Average to Heterogeneous Treatment Effects\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">From Average to Heterogeneous Treatment Effects</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 Why ATE is not enough</h3>\n<p>The ATE answers <em>&quot;on average, what is the impact of a treatment?&quot;</em> But for decisions — which\npatients get a drug, which customers get a coupon, which fulfillment centers get a new algorithm —\nwe need to know <strong>who benefits most and by how much</strong>.</p>\n<div class=\"mblk\"><math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) \\mid X = x]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p><em>The conditional average treatment effect: the expected effect for units sharing covariate value\n<math data-tex=\"x\"><mi>x</mi></math>.</em></p>\n<ul>\n<li>CATE is a <strong>function of x</strong>, not a single number.</li>\n<li>ATE is the marginal: <math data-tex=\"\\tau = \\mathbb{E}_X[\\tau(x)]\"><mrow><mi>τ</mi><mo>=</mo><msub><mi>𝔼</mi><mi>X</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>.</li>\n<li>When treatment effects are <strong>homogeneous</strong> (every unit benefits equally), <math data-tex=\"\\tau(x) = \\tau\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>τ</mi></mrow></math> for\nall <math data-tex=\"x\"><mi>x</mi></math> and CATE collapses to ATE. In most real-world settings, effects are heterogeneous.</li>\n</ul>\n<figure class=\"iv\" id=\"iv-causal-inference-23-0\" data-iv=\"{&quot;type&quot;:&quot;diagram&quot;,&quot;title&quot;:&quot;Homogeneous vs. heterogeneous effects, same ATE&quot;,&quot;concept&quot;:&quot;ATE can hide a completely different underlying reality — this is the whole reason CATE exists&quot;,&quot;control&quot;:&quot;Toggle between \\&quot;Homogeneous\\&quot; and \\&quot;Heterogeneous\\&quot; τ(x) distributions&quot;,&quot;observe&quot;:&quot;Both distributions share the same average effect (ATE ≈ the same number in both states, per the lecture's own toggle), but the homogeneous case is a narrow spike around that number while the heterogeneous case is spread wide — some units near zero or negative, others far above&quot;,&quot;insight&quot;:&quot;Two populations can report the identical ATE while one has a treatment that works uniformly and the other has a treatment that helps some people a lot, does nothing for others, and actively harms a few — a single average number cannot distinguish these, which is exactly why targeting decisions require τ(x), not τ&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows this as two side-by-side distribution plots of τ(x): a \\&quot;Homogeneous\\&quot; narrow spike and a \\&quot;Heterogeneous\\&quot; wide spread, both centered on the same ATE (≈6.0 in the lecture's example) — the reader can picture the same story from the coupon example in §1.2, where Alice/Bob/Charlie/Dana's four very different CATEs (+0%, +12%, +1%, −4%) would still average out to some single unremarkable ATE if you only looked at the population mean.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · diagram</span>\n      <span class=\"iv-title\">Homogeneous vs. heterogeneous effects, same ATE</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>ATE can hide a completely different underlying reality — this is the whole reason CATE exists</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle between \"Homogeneous\" and \"Heterogeneous\" τ(x) distributions</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Both distributions share the same average effect (ATE ≈ the same number in both states, per the lecture's own toggle), but the homogeneous case is a narrow spike around that number while the heterogeneous case is spread wide — some units near zero or negative, others far above</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Two populations can report the identical ATE while one has a treatment that works uniformly and the other has a treatment that helps some people a lot, does nothing for others, and actively harms a few — a single average number cannot distinguish these, which is exactly why targeting decisions require τ(x), not τ</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows this as two side-by-side distribution plots of τ(x): a \"Homogeneous\" narrow spike and a \"Heterogeneous\" wide spread, both centered on the same ATE (≈6.0 in the lecture's example) — the reader can picture the same story from the coupon example in <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.2\" role=\"link\" tabindex=\"0\">§1.2</a>, where Alice/Bob/Charlie/Dana's four very different CATEs (+0%, +12%, +1%, −4%) would still average out to some single unremarkable ATE if you only looked at the population mean.</p>\n    </div>\n  </figure>\n<h3>1.2 When heterogeneity matters — two worked examples</h3>\n<p><strong>Precision medicine.</strong> A population-level study finds a blood-pressure drug lowers systolic\npressure by 8 mmHg on average. But that average hides the fact that some patients benefit by 15\nmmHg while others are actively <em>harmed</em>. Only CATE can identify which patients should receive the\ndrug and which should not.</p>\n<p><strong>Marketing coupons.</strong> Consider four customers [slide 16/18, &quot;Who should receive the offer?&quot;]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Customer</th>\n<th>Buy prob.</th>\n<th>CATE <math data-tex=\"\\hat\\tau(x)\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th>Coupon?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Alice</td>\n<td>60%</td>\n<td>+0%</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Bob</td>\n<td>60%</td>\n<td><strong>+12%</strong></td>\n<td><strong>Yes</strong></td>\n</tr>\n<tr>\n<td>Charlie</td>\n<td>90%</td>\n<td>+1%</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Dana</td>\n<td>8%</td>\n<td><strong>−4%</strong></td>\n<td>No</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>Who gets the coupon?</em> Not Charlie — his high baseline means the coupon barely moves him (+1%). Not\n<strong>Dana</strong> — she isn't merely a weak candidate, she's <strong>actively harmed</strong>: her CATE is <em>negative</em>\n(−4%), meaning the coupon would <em>reduce</em> her purchase probability (perhaps a discount cheapens the\nperceived value of a product she was already inclined to buy at full price, or the offer arrives at\nthe wrong moment). <strong>Bob</strong> is the right target: same baseline purchase probability as Alice, but a\ngenuinely large positive incremental effect. This is exactly why CATE-based targeting must do more\nthan rank customers by expected benefit — it must also screen out units the treatment would actively\nharm, something an ATE-only view can never see. The ATE is meaningless here; only the per-unit CATE\ntells you both who to target and who to protect from the treatment entirely.</p>\n<h3>1.3 Policy learning with budget constraints</h3>\n<p>If treating unit <math data-tex=\"i\"><mi>i</mi></math> costs <math data-tex=\"c\"><mi>c</mi></math>, then the optimal policy assigns treatment to exactly those units\nwhere <math data-tex=\"\\tau(x_i) &gt; c\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mi>c</mi></mrow></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\pi^*(x) = \\mathbb{1}[\\tau(x) &gt; c]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>π</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>𝟙</mn><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mi>c</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p>This is the <strong>value-to-cost</strong> decision rule: rank all units by their CATE and treat the top <math data-tex=\"K\"><mi>K</mi></math>\nunits whose benefit exceeds the treatment cost.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — CATE estimation is the prerequisite for personalization.</strong> ATE tells you\nwhether a treatment works <em>on average</em>; CATE tells you <em>for whom</em> it works. The entire\nprogression from ATE → CATE → policy learning is the analytical backbone of precision medicine,\ntargeted marketing, and adaptive resource allocation — and it all requires estimating a\n<em>function</em> <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, not a single number.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s4\" data-title=\"From CATE Definition to Estimation — the Identification Bridge\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">From CATE Definition to Estimation — the Identification Bridge</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>2.1 The causal-to-statistical translation</h3>\n<p>Under the same three identification assumptions from <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §7\" role=\"link\" tabindex=\"0\">Part 2 §7</a> (SUTVA, unconfoundedness,\npositivity), the causal quantity <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can be expressed as a statistical one:</p>\n<div class=\"mblk\"><math data-tex=\"\\tau(x) = \\mathbb{E}[Y|T=1, X=x] - \\mathbb{E}[Y|T=0, X=x] = \\mu_1(x) - \\mu_0(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> the CATE for people with covariates <math data-tex=\"x\"><mi>x</mi></math> equals the difference between\nwhat treated people with covariates <math data-tex=\"x\"><mi>x</mi></math> actually earned (<math data-tex=\"\\mu_1(x)\"><mrow><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>) and what control people with\ncovariates <math data-tex=\"x\"><mi>x</mi></math> actually earned (<math data-tex=\"\\mu_0(x)\"><mrow><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>). Both quantities are <em>directly estimable from data</em>\n— we observe <math data-tex=\"Y\"><mi>Y</mi></math> for both treated and control units at each <math data-tex=\"x\"><mi>x</mi></math>, so we can fit models to predict\n<math data-tex=\"Y\"><mi>Y</mi></math> given <math data-tex=\"(T, X)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo separator=\"true\">,</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math> and then compute the difference.</p>\n<h3>2.2 Why ML is both the solution and the problem</h3>\n<p>ML models excel at estimating <math data-tex=\"\\mu_t(x) = \\mathbb{E}[Y|T=t, X=x]\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>T</mi><mo>=</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> when <math data-tex=\"X\"><mi>X</mi></math> is high-dimensional\nand the relationship is nonlinear. But <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §16\" role=\"link\" tabindex=\"0\">Part 2 §16</a> flagged the catch: <strong>ML models are optimized for\nprediction, not causal estimation</strong>, and the regularization that makes them good at prediction\nintroduces bias that doesn't vanish with more data.</p>\n<p>The rest of this lecture is a catalog of strategies for getting ML's flexibility while avoiding\nits regularization bias:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Strategy</th>\n<th>Methods</th>\n<th>How it handles bias</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Naive plug-in</strong></td>\n<td>S-Learner, T-Learner</td>\n<td>Doesn't — regularization bias propagates directly</td>\n</tr>\n<tr>\n<td><strong>Imputation + re-estimation</strong></td>\n<td>X-Learner</td>\n<td>Reduces bias via propensity-weighted blending</td>\n</tr>\n<tr>\n<td><strong>Honest partitioning</strong></td>\n<td>Causal trees/forests</td>\n<td>Data splitting prevents overfitting</td>\n</tr>\n<tr>\n<td><strong>Balanced representations</strong></td>\n<td>TarNet, CFRNet</td>\n<td>Learns a space where treated/control are indistinguishable</td>\n</tr>\n<tr>\n<td><strong>Debiasing via orthogonality</strong></td>\n<td>DML, R-Learner, DR-Learner</td>\n<td>Neyman orthogonality + cross-fitting suppress bias to second order</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n</section><section id=\"causal-inference-23-s5\" data-title=\"Meta-Learners — Flexible ML Plug-ins\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Meta-Learners — Flexible ML Plug-ins</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Meta-learners use standard supervised-learning models as building blocks to estimate CATE. They\ndiffer in <em>how many models</em> are fit and <em>how the CATE is extracted</em>.</p>\n<h3>3.1 S-Learner (Single Learner)</h3>\n<p>Train <strong>one model</strong> <math data-tex=\"\\hat{s}(X, T)\"><mrow><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>T</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> that predicts <math data-tex=\"Y\"><mi>Y</mi></math> from covariates <math data-tex=\"X\"><mi>X</mi></math> <em>and</em> treatment <math data-tex=\"T\"><mi>T</mi></math> as a\nfeature:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\hat{s}(x, T{=}1) - \\hat{s}(x, T{=}0)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Strength:</strong> simple — just one model, uses all data.</p>\n<p><strong>Weakness:</strong> regularization can suppress the treatment variable's importance. If <math data-tex=\"T\"><mi>T</mi></math> is a weak\npredictor of <math data-tex=\"Y\"><mi>Y</mi></math> relative to <math data-tex=\"X\"><mi>X</mi></math>, the model may assign <math data-tex=\"T\"><mi>T</mi></math> near-zero weight, making\n<math data-tex=\"\\hat{s}(x, 1) \\approx \\hat{s}(x, 0)\"><mrow><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mover><mi>s</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for all <math data-tex=\"x\"><mi>x</mi></math> — <strong>shrinking CATE toward zero</strong> (regularization\nbias in the causal direction).</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The S-Learner's failure mode is the canonical regularization-bias problem.</strong> The model is\noptimized to minimize overall prediction error, and if the treatment effect is small relative to\nthe outcome variance, regularization may treat <math data-tex=\"T\"><mi>T</mi></math> as noise and effectively zero it out. This\nproduces a CATE estimate of approximately zero everywhere — not because the treatment has no\neffect, but because the model wasn't asked to find one.</p>\n</aside>\n<h3>3.2 T-Learner (Two Learners)</h3>\n<p>Train <strong>two separate models</strong> — one on treated units, one on controls:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\hat\\mu_1(x) - \\hat\\mu_0(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Strength:</strong> avoids S-Learner's treatment-drowning problem — each model only needs to predict\nwell within its own arm.</p>\n<p><strong>Weaknesses:</strong></p>\n<ol>\n<li><strong>No information sharing</strong> between arms — each model sees only half the data.</li>\n<li><strong>Imbalanced arms</strong> force different regularization strengths, creating differential bias that\ndoesn't cancel in the difference.</li>\n</ol>\n<h3>3.3 X-Learner (Cross-Learner)</h3>\n<p>A four-stage procedure that combines T-Learner's flexibility with propensity-based information\nsharing:</p>\n<p><strong>Stage 1:</strong> Fit T-Learner (two models: <math data-tex=\"\\hat\\mu_1\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></math>, <math data-tex=\"\\hat\\mu_0\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>).</p>\n<p><strong>Stage 2:</strong> Impute individual treatment effects:</p>\n<ul>\n<li>For treated units (<math data-tex=\"T_i=1\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></math>): <math data-tex=\"D_i^{(1)} = Y_i - \\hat\\mu_0(X_i)\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (observed outcome minus imputed\ncounterfactual)</li>\n<li>For control units (<math data-tex=\"T_i=0\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></math>): <math data-tex=\"D_i^{(0)} = \\hat\\mu_1(X_i) - Y_i\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub></mrow></math> (imputed counterfactual minus\nobserved outcome)</li>\n</ul>\n<p><strong>Stage 3:</strong> Fit second-stage models: <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from <math data-tex=\"\\{(X_i, D_i^{(1)}) : T_i=1\\}\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo separator=\"true\">,</mo><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></math> and\n<math data-tex=\"\\hat\\tau_0(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from <math data-tex=\"\\{(X_i, D_i^{(0)}) : T_i=0\\}\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo separator=\"true\">,</mo><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></math>.</p>\n<p><strong>Stage 4:</strong> Combine with propensity-weighted blending:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = e(x) \\cdot \\hat\\tau_0(x) + (1 - e(x)) \\cdot \\hat\\tau_1(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Why the propensity weighting works:</strong> look at the formula again — the weight on <math data-tex=\"\\hat\\tau_0(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>\nis <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> itself, and the weight on <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <math data-tex=\"1-e(x)\"><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. So when <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <strong>low</strong> (treated\nunits are scarce at <math data-tex=\"x\"><mi>x</mi></math>), the estimate leans <em>toward</em> <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, not <math data-tex=\"\\hat\\tau_0(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. This is\ncorrect, and the reason is subtler than &quot;more raw data points&quot;: <math data-tex=\"\\hat\\tau_1(x)\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is fit on the\npseudo-outcomes <math data-tex=\"D_i^{(1)} = Y_i - \\hat\\mu_0(X_i)\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for treated units — and <math data-tex=\"\\hat\\mu_0\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>, the <em>control</em>\noutcome model, is well-estimated <em>precisely because</em> controls are abundant when <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is low. So\neven though <math data-tex=\"\\hat\\tau_1\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></math> is fit on relatively few (treated) points, each of those points' target\nvalue is a high-quality imputation, built from a reliably-estimated counterfactual. Symmetrically,\nwhen <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <strong>high</strong> (controls are scarce), <math data-tex=\"\\hat\\mu_1\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></math> is the reliably-estimated model, so\n<math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>'s pseudo-outcomes <math data-tex=\"D_i^{(0)}=\\hat\\mu_1(X_i)-Y_i\"><mrow><msubsup><mi>D</mi><mi>i</mi><mrow class=\"tml-sml-pad\"><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msubsup><mo>=</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub></mrow></math> are high quality, and the weight\n<math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> on <math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math> is correspondingly large. <strong>The propensity score weights toward whichever\n<math data-tex=\"\\hat\\tau\"><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math>'s pseudo-outcome construction leaned on the better-estimated nuisance model</strong> — not\ntoward &quot;the arm with more rows.&quot;</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — X-Learner recycles all the data.</strong> T-Learner effectively discards cross-arm\ninformation (the treated model never sees control outcomes and vice versa). X-Learner's\nimputation step feeds <em>all</em> units' information into both second-stage models, with the propensity\nscore acting as a reliability weight — it's a principled way to share information across arms\nwithout requiring a single model to handle both simultaneously (which is what causes the\nS-Learner's drowning problem).</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s6\" data-title=\"Causal Trees and Forests\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Causal Trees and Forests</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>4.1 Causal trees — honest estimation</h3>\n<blockquote class=\"aside-quote\">\n<p>Causal trees and the honest-estimation idea originate with <strong>Athey &amp; Imbens (2016), &quot;Recursive\nPartitioning for Heterogeneous Causal Effects&quot;</strong> — confirmed directly on the slide footer for this\nsection.</p>\n</blockquote>\n<p>A <strong>causal tree</strong> partitions the covariate space so that each leaf contains a subset of units\nwhere the treatment effect is approximately homogeneous. Unlike a standard decision tree (which\npredicts <math data-tex=\"Y\"><mi>Y</mi></math>), each leaf directly estimates <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau_{\\text{leaf}} = \\bar{Y}_{1,\\text{leaf}} - \\bar{Y}_{0,\\text{leaf}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mtext>leaf</mtext></msub><mo>=</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mtext>leaf</mtext></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mtext>leaf</mtext></mrow></msub></mrow></math></div>\n<p>The average treated outcome minus the average control outcome within that leaf.</p>\n<p><strong>Splitting criterion:</strong> maximize heterogeneity in treatment effects between child nodes, subject\nto a balance constraint (neither child should be dramatically smaller than the other).</p>\n<p>🧪 <strong>Worked example — which split would a causal tree favor?</strong> Estimating the effect of a discount\ncoupon (treatment) on customer spend (outcome). Parent node: <math data-tex=\"\\hat\\tau=5\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>5</mn><mi>%</mi></mrow></math>. Two candidate splits:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Split</th>\n<th>Left leaf</th>\n<th>Right leaf</th>\n<th>Spread</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>A — on &quot;weeks since last purchase&quot;</strong> (&lt; 4 wks vs. ≥ 4 wks)</td>\n<td><math data-tex=\"\\hat\\tau=1\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>1</mn><mi>%</mi></mrow></math></td>\n<td><math data-tex=\"\\hat\\tau=12\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>12</mn><mi>%</mi></mrow></math></td>\n<td><strong>11 points</strong></td>\n</tr>\n<tr>\n<td><strong>B — on &quot;device&quot;</strong> (mobile vs. web)</td>\n<td><math data-tex=\"\\hat\\tau=4.8\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>4.8</mn><mi>%</mi></mrow></math></td>\n<td><math data-tex=\"\\hat\\tau=5.2\\%\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mn>5.2</mn><mi>%</mi></mrow></math></td>\n<td>0.4 points</td>\n</tr>\n</tbody>\n</table></div>\n<p>The causal tree favors <strong>Split A</strong>. Split B's two children are both close to the parent's 5% — device\nbarely moderates the coupon's effect, so splitting on it buys almost no new information. Split A's\nchildren diverge sharply from each other (1% vs. 12%) — recency of last purchase is a real driver of\n<em>how much</em> the coupon effect varies, which is exactly what the splitting criterion is built to find.\nA standard decision tree, by contrast, would split on whatever best predicts <math data-tex=\"Y\"><mi>Y</mi></math> directly — it has\nno reason to prefer A over B unless recency also happens to predict raw spend, which is a different\nquestion entirely from predicting the coupon's <em>effect</em>.</p>\n<p><strong>Honest estimation</strong> — the key innovation:</p>\n<ul>\n<li>Split the data into two halves: one for <strong>structure</strong> (deciding where to split), one for\n<strong>estimation</strong> (computing leaf-level treatment effects).</li>\n<li>The structure sample never estimates treatment effects; the estimation sample never influences\nsplits.</li>\n</ul>\n<p><strong>Why honesty matters:</strong> using the same data for both splitting and estimation creates overfitting\nbias — the tree will find splits that look good on the data used to estimate them, just as a\nstandard decision tree overfits to its training data. Honest estimation breaks this cycle,\nproducing <strong>unbiased treatment effect estimates</strong> and enabling valid confidence intervals.</p>\n<h3>4.2 Causal forests — reducing variance</h3>\n<p>A single causal tree has high variance (different splits of the data produce very different trees).\n<strong>Causal forests</strong> solve this by:</p>\n<ol>\n<li>Growing many trees on random subsamples (bagging).</li>\n<li>Using random feature subsets at each split (decorrelation, like random forests).</li>\n<li>Averaging treatment effect estimates across all trees for each data point.</li>\n</ol>\n<p>The result: low-bias (from honesty), low-variance (from ensembling), interpretable (tree\nstructure) treatment effect estimates with valid confidence intervals.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Not every causal forest is Neyman orthogonal.</strong> Orthogonality (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>) holds for the\n<strong>local-centering (residual-on-residual) causal forest of Athey, Tibshirani &amp; Wager (2019)</strong>,\nwhich folds a DML-style residualization step into each split — it does <strong>not</strong> hold for the\noriginal Wager &amp; Athey (2018) formulation. If you need the orthogonality guarantee specifically\n(robustness to small nuisance-model errors, per <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>), make sure you're using the 2019\nlocal-centering variant, not just &quot;a causal forest.&quot;</p>\n</aside>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — why causal forests are well-regarded.</strong> Causal forests combine three\ndesirable properties that no other method in this lecture offers simultaneously:</p>\n<ol>\n<li><strong>Unbiasedness</strong> via honest estimation (unlike meta-learners).</li>\n<li><strong>Valid confidence intervals</strong> (unlike neural-net methods).</li>\n<li><strong>Interpretability</strong> — the tree structure shows <em>which features drive effect heterogeneity</em>\n(unlike black-box representation learners).</li>\n</ol>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s7\" data-title=\"Deep Representation Learning for Causal Inference\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Deep Representation Learning for Causal Inference</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</
