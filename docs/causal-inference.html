    <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is honest estimation in causal trees and why does it matter?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Honest estimation splits the data: one half decides <em>where</em> to split the tree (structure), the\nother half estimates <em>what</em> the treatment effect is in each leaf (estimation). This prevents the\noverfitting that occurs when the same data both selects splits and evaluates them — the tree would\nfind splits that look good on its own training data, producing biased leaf-level estimates. With\nhonest estimation, the leaf estimates are unbiased, and valid confidence intervals can be\nconstructed.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain TarNet's implicit balance mechanism — why does sharing a representation between treatment heads help?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>TarNet's shared encoder produces a latent code <math data-tex=\"z\"><mi>z</mi></math> used by both the treatment and control heads.\nIf <math data-tex=\"z\"><mi>z</mi></math> retains information that distinguishes treated from control units (confounders), each head\nmust accommodate different distributions, wasting capacity. The most efficient shared code is one\nwhere treated and control distributions overlap maximally — so the model learns balance as a\n<em>side effect</em> of optimizing factual prediction accuracy. CFRNet makes this explicit via an IPM\npenalty, giving direct control over the bias-variance trade-off.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">State the three key ideas of DML and the specific failure mode each addresses.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<ol>\n<li>\n<p><strong>Partialing out (Robinson decomposition):</strong> removes confounders by regressing both <math data-tex=\"Y\"><mi>Y</mi></math> and <math data-tex=\"T\"><mi>T</mi></math>\non <math data-tex=\"X\"><mi>X</mi></math>, then estimating the treatment effect on the residuals — addresses the confounding\nproblem (<math data-tex=\"X \\to T\"><mrow><mi>X</mi><mo>→</mo><mi>T</mi></mrow></math>, <math data-tex=\"X \\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>Y</mi></mrow></math> edges).</p>\n</li>\n<li>\n<p><strong>Neyman orthogonality:</strong> designs the moment condition so first-order nuisance estimation errors\ncancel, reducing bias from <math data-tex=\"O(\\delta)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>δ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> to <math data-tex=\"O(\\delta^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>δ</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — addresses regularization bias from\nML-estimated nuisance functions.</p>\n</li>\n<li>\n<p><strong>Cross-fitting:</strong> trains nuisance models out-of-fold to prevent overfitting when the same data\nis used for both nuisance estimation and treatment effect estimation — addresses the\noverfitting-induced correlation between nuisance errors and outcomes.</p>\n</li>\n</ol>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive the Robinson decomposition from the partially linear model. Why does g(x) disappear?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Starting from <math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math>, take conditional expectations: $\\mathbb{E}[Y|X]\n= \\tau_0 \\cdot \\mathbb{E}[T|X] + g(X)<math data-tex=\", so\"><mrow><mo separator=\"true\">,</mo><mi>s</mi><mi>o</mi></mrow></math>m(X) = \\tau_0 \\cdot e(X) + g(X)$. Subtracting:\n<math data-tex=\"Y - m(X) = \\tau_0(T - e(X)) + \\epsilon\"><mrow><mi>Y</mi><mo>−</mo><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math>, which is <math data-tex=\"\\tilde{Y} = \\tau_0 \\tilde{T} + \\epsilon\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>+</mo><mi>ϵ</mi></mrow></math>.\nThe function <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> disappears because it enters both the original equation and the conditional\nexpectation equally, canceling in the subtraction. This is why residualization eliminates\nconfounding: whatever <math data-tex=\"X\"><mi>X</mi></math> predicts about <math data-tex=\"Y\"><mi>Y</mi></math> (beyond its effect through <math data-tex=\"T\"><mi>T</mi></math>) is subtracted out.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does increasing the sample size NOT fix regularization bias in naive ML-based causal estimation?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Regularization bias is <em>systematic</em>, not random — it comes from the model's optimization objective\n(penalizing complexity) biasing the nuisance function estimates in a consistent direction. More\ndata reduces <em>variance</em> (the estimates become more precise) but the <em>systematic offset</em> remains,\nbecause the regularization term's influence doesn't diminish. The sampling distribution of <math data-tex=\"\\hat\\tau\"><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math>\nbecomes tighter but stays centered away from the true value — exactly the phenomenon the DML\nframework's orthogonality condition (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>) was designed to suppress.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the R-Learner's objective function and why <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> appears as an implicit weight.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The R-Learner minimizes <math data-tex=\"\\sum_i (\\tilde{Y}_i - \\tau(X_i) \\cdot \\tilde{T}_i)^2\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo>−</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow></math>. This is\nregression of <math data-tex=\"\\tilde{Y}\"><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover></math> on <math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math>, where <math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math> is the treatment residual (confounders\nremoved). The <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> weighting emerges because the loss is quadratic in <math data-tex=\"\\tilde{T}_i\"><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub></math>:\nunits with large treatment residuals (near-random treatment assignment) contribute more to the\nobjective, naturally upweighting the most informative observations. Units where treatment was\nalmost deterministic (<math data-tex=\"\\tilde{T} \\approx 0\"><mrow><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>≈</mo><mn>0</mn></mrow></math>) contribute almost nothing — they can't help\ndistinguish one <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from another because the treatment residual provides no leverage.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">How does the DR-Learner combine double robustness with orthogonality?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The DR-Learner's Stage 2 computes AIPW pseudo-outcomes, which inherit double robustness from\n<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §14\" role=\"link\" tabindex=\"0\">Part 2 §14</a>: they are consistent if either <math data-tex=\"\\hat\\mu_t\"><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi></msub></math> or <math data-tex=\"\\hat e\"><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math> is correctly specified.\nStage 3 regresses these pseudo-outcomes on <math data-tex=\"X\"><mi>X</mi></math>, and the full pipeline is designed to satisfy\nNeyman orthogonality — so nuisance errors propagate at second order. The result is an estimator\nthat is simultaneously robust to one nuisance model being wrong (double robustness) AND robust to\nboth models having small regularization biases (orthogonality), while estimating <em>heterogeneous</em>\neffects (meta-learner structure).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A colleague says \"just use a neural network to predict Y from (X, T) and take the difference at T=1 vs T=0.\" Name three problems with this approach and map each to a specific method from this lecture that addresses it.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<ol>\n<li>\n<p><strong>Regularization bias</strong> — the neural net may suppress <math data-tex=\"T\"><mi>T</mi></math>'s importance, shrinking the estimated\neffect toward zero → addressed by <strong>T-Learner</strong> (separate models per arm prevent drowning) or\n<strong>DML</strong> (orthogonality suppresses bias to second order).</p>\n</li>\n<li>\n<p><strong>No covariate balance</strong> — the model learns in a space where treated/control distributions may\nnot overlap, causing poor generalization to counterfactuals → addressed by <strong>TarNet/CFRNet</strong>\n(learns a balanced representation explicitly).</p>\n</li>\n<li>\n<p><strong>No valid uncertainty quantification</strong> — a standard neural net's predictions have no confidence\nintervals for the <em>causal effect</em> → addressed by <strong>causal forests</strong> (honest estimation enables\nvalid CIs) or <strong>DML</strong> (asymptotic normality of the orthogonal estimator enables CIs).</p>\n</li>\n</ol>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li>\n<p><em>&quot;CFRNet's bound says counterfactual error ≤ factual error + IPM. What happens when you increase\nλ (the balance penalty) too much?&quot;</em> — increasing λ forces the representations to be more\nbalanced (lower IPM), reducing bias, but at the cost of prediction quality (higher factual\nerror) because the encoder is forced to sacrifice discriminative information to satisfy the\nbalance constraint. There's an optimal λ that minimizes the total bound; too much balance\nproduces representations that are balanced but useless for prediction, while too little balance\nproduces good predictions on the factual data that don't generalize to counterfactuals.</p>\n</li>\n<li>\n<p><em>&quot;Why is cross-fitting necessary even when Neyman orthogonality already suppresses first-order\nerrors?&quot;</em> — orthogonality suppresses the <em>systematic</em> bias from nuisance estimation errors, but\nwhen the same data trains both the nuisance models and estimates τ, the <em>residual</em> overfitting\ncreates a correlation between the fitted nuisance values and the outcomes that orthogonality\ndoesn't address (it's a finite-sample phenomenon, not an asymptotic one). Cross-fitting\neliminates this correlation by construction.</p>\n</li>\n<li>\n<p><em>&quot;The lecture says causal thinking applies beyond treatment effects — give a concrete example of\nhow doubly robust estimation solves an RL problem.&quot;</em> — off-policy evaluation: given trajectories\ncollected under old policy π₀, estimate the value of a new policy π₁. The &quot;treatment&quot; is the\nnew policy's action, the &quot;outcome&quot; is the reward, and confounding arises because the old policy's\nactions are correlated with states. A doubly robust estimator combines a model of the new\npolicy's expected reward (outcome model) with importance sampling weights (propensity model) —\nconsistent if either model is correct, exactly as in the ATE setting.</p>\n</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li>\n<p><strong>Robinson decomposition</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>: start from <math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math>, take\nconditional expectations, subtract, derive <math data-tex=\"\\tilde{Y} = \\tau_0 \\tilde{T} + \\epsilon\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>+</mo><mi>ϵ</mi></mrow></math>, and\nexplain why <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> vanishes.</p>\n</li>\n<li>\n<p><strong>The R-Learner objective as generalized OLS</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>: write the R-Learner loss\n<math data-tex=\"\\sum_i (\\tilde{Y}_i - \\tau(X_i) \\tilde{T}_i)^2\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo>−</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup></mrow></math>, take the derivative with respect to\n<math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, and show that the solution at each <math data-tex=\"x\"><mi>x</mi></math> is a weighted least-squares estimate with\nweights <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math>.</p>\n</li>\n<li>\n<p><strong>IPM intuition for CFRNet</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>: define IPM as the supremum over a function class of the\ndifference in expectations, explain why MMD projects into a kernel space and computes mean\ndifference, and state the double-robustness bound Error ≤ factual error + IPM.</p>\n</li>\n</ol>\n<h3>Applied scenario — Amazon promotional targeting</h3>\n<p><strong>Framing:</strong> Amazon wants to estimate the causal effect of a discount coupon on purchase conversion\nfor each customer segment, then target only those segments where the effect exceeds the coupon's\ncost.</p>\n<p><strong>Data:</strong> Observational — customer features (purchase history, browsing behavior, device type,\naccount age), treatment (coupon offered/not offered), outcome (purchased within 7 days).</p>\n<p><strong>Model:</strong> This maps directly onto the lecture's framework. The naive comparison (coupon recipients\nvs. non-recipients) suffers from selection bias (<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §5\" role=\"link\" tabindex=\"0\">Part 2 §5</a>) — customers who receive coupons may\nsystematically differ from those who don't. Apply the full pipeline:</p>\n<ol>\n<li>Estimate propensity <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and outcome models <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> with flexible ML.</li>\n<li>Use <strong>DR-Learner</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>) for double robustness + orthogonality + heterogeneous effect\nestimation.</li>\n<li>Target only customers where <math data-tex=\"\\hat\\tau(x) &gt; \\text{coupon cost}\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mtext>coupon cost</mtext></mrow></math> (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.3\" role=\"link\" tabindex=\"0\">§1.3</a>'s policy learning rule).</li>\n</ol>\n<p><strong>Metric:</strong> The ATT (effect on customers who actually received the coupon) if the question is\n&quot;was the coupon worth it for those who got it?&quot; or CATE if the question is &quot;which segments should\nwe target in the next campaign?&quot;</p>\n<p><strong>Failure modes:</strong> Unmeasured confounders (e.g., a customer's underlying purchase intent, which\nmakes them both likely to receive a coupon <em>and</em> likely to buy) — address via sensitivity\nanalysis. Distribution shift between training and deployment periods — monitor for this using the\ninvariant-feature ideas from <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§12.1\" role=\"link\" tabindex=\"0\">§12.1</a>.</p>\n<p><strong>What you'd ship:</strong> A DR-Learner estimate with explicit propensity overlap diagnostics (<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2\n§7.1\" role=\"link\" tabindex=\"0\">Part 2\n§7.1</a>), confidence intervals (from DML's asymptotic normality), and a targeting policy that assigns\ncoupons only where <math data-tex=\"\\hat\\tau(x) &gt; c\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&gt;</mo><mi>c</mi></mrow></math> with sufficient statistical confidence.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Customer Obsession</strong> — targeting coupons to customers who\nactually benefit (high CATE) rather than sending them to everyone improves the customer experience\n(relevant coupons, not spam). <strong>Dive Deep</strong> — correctly distinguishing confounders (past purchase\nfrequency) from mediators (post-coupon browsing behavior) before deciding what to adjust for\nrequires the causal-graph reasoning from <a class=\"xref\" data-xref-lec=\"causal-inference-01\" data-xref=\"Part 1 §5\" role=\"link\" tabindex=\"0\">Part 1 §5</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>.</p>\n<hr>\n</section><section id=\"causal-inference-23-s17\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>AIPW (Augmented Inverse Probability Weighting)</strong> — doubly robust estimator combining outcome\nregression with IPW correction; foundation for DR-Learner.</li>\n<li><strong>CATE (Conditional Average Treatment Effect)</strong> — <math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1) - Y(0) | X = x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>|</mi><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>,\nthe heterogeneous, covariate-dependent treatment effect.</li>\n<li><strong>Causal forest</strong> — ensemble of honest causal trees with random subsampling and feature\nsubsetting; provides unbiased CATE estimates with valid confidence intervals.</li>\n<li><strong>Causal tree</strong> — decision tree that estimates treatment effects in each leaf via honest\nestimation (separate data for structure vs. estimation).</li>\n<li><strong>CFRNet (Counterfactual Regression Network)</strong> — TarNet extended with an explicit IPM balance\npenalty for distributional alignment.</li>\n<li><strong>Cross-fitting</strong> — training nuisance models on data folds held out from the moment-condition\ncomputation to decorrelate estimation errors from outcomes.</li>\n<li><strong>DragonNet</strong> — TarNet/CFRNet extended with a propensity head and targeted regularization; deep\nsemiparametric learning aimed directly at the final CATE estimate.</li>\n<li><strong>DML (Double/Debiased Machine Learning)</strong> — framework combining partialing out, Neyman\northogonality, and cross-fitting for unbiased treatment effect estimation with ML nuisance\nfunctions.</li>\n<li><strong>Double robustness</strong> — property of AIPW/DR-Learner: consistent if either nuisance model\n(propensity or outcome) is correctly specified.</li>\n<li><strong>Factual MSE</strong> — loss computed only on observed outcomes; the standard training objective for\ncausal models.</li>\n<li><strong>Honest estimation</strong> — splitting data into separate samples for tree structure and leaf-level\nestimation to prevent overfitting bias.</li>\n<li><strong>IPM (Integral Probability Metric)</strong> — family of distribution distance measures including MMD\nand Wasserstein; used in CFRNet's balance penalty.</li>\n<li><strong>MMD (Maximum Mean Discrepancy)</strong> — kernel-based IPM that projects distributions into a\nreproducing kernel Hilbert space and computes mean difference.</li>\n<li><strong>Neyman orthogonality</strong> — property of a moment condition where first-order nuisance estimation\nerrors cancel, reducing bias from O(δ) to O(δ²).</li>\n<li><strong>Partialing out</strong> — Robinson decomposition: regressing both <math data-tex=\"Y\"><mi>Y</mi></math> and <math data-tex=\"T\"><mi>T</mi></math> on <math data-tex=\"X\"><mi>X</mi></math> to produce\nresiduals free of confounding influence.</li>\n<li><strong>R-Learner</strong> — DML-based meta-learner that estimates heterogeneous effects via weighted\nresidual regression.</li>\n<li><strong>DR-Learner</strong> — doubly robust + Neyman orthogonal meta-learner using AIPW pseudo-outcomes.</li>\n<li><strong>Regularization bias</strong> — systematic error introduced by ML model regularization that doesn't\nvanish with more data; the core problem DML solves.</li>\n<li><strong>Representation learning</strong> — learning a mapping <math data-tex=\"\\phi: \\mathcal{X} \\to \\mathcal{Z}\"><mrow><mi>ϕ</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi class=\"mathcal\">𝒳</mi><mo>→</mo><mi class=\"mathcal\">𝒵</mi></mrow></math> that\nbalances treated/control distributions for causal inference.</li>\n<li><strong>Robinson decomposition</strong> — the partialing-out transformation <math data-tex=\"\\tilde{Y} = Y - m(X)\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>Y</mi><mo>−</mo><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>,\n<math data-tex=\"\\tilde{T} = T - e(X)\"><mrow><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>T</mi><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> that eliminates the confounding function.</li>\n<li><strong>S-Learner</strong> — single ML model with treatment as a feature; vulnerable to regularization\nshrinking the treatment effect.</li>\n<li><strong>TarNet (Treatment-Agnostic Representation Network)</strong> — neural network with shared encoder and\nper-arm heads; learns balanced representations implicitly.</li>\n<li><strong>T-Learner</strong> — two separate ML models per treatment arm; avoids treatment drowning but loses\ninformation sharing.</li>\n<li><strong>X-Learner</strong> — four-stage meta-learner combining T-Learner imputation with propensity-weighted\nblending.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-23-s18\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Why is the ATE insufficient for coupon-targeting decisions, and what does CATE provide that ATE\ndoesn't? Use the worked example from <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1.2\" role=\"link\" tabindex=\"0\">§1.2</a>. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Explain the S-Learner's regularization bias failure mode. What happens to <math data-tex=\"\\hat\\tau(x)\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> when\nthe treatment variable <math data-tex=\"T\"><mi>T</mi></math> is down-weighted by regularization? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>)</em></li>\n<li>How does the T-Learner avoid the S-Learner's drowning problem, and what new problem does it\nintroduce? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3.2\" role=\"link\" tabindex=\"0\">§3.2</a>)</em></li>\n<li>Trace the X-Learner's four stages and explain why propensity weighting in Stage 4 is the\ncorrect way to blend the two second-stage models. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>)</em></li>\n<li>What is honest estimation in causal trees, and why can't you use the same data for both\nsplitting and estimation? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.1\" role=\"link\" tabindex=\"0\">§4.1</a>)</em></li>\n<li>Explain how TarNet's shared encoder implicitly learns a balanced representation. Why does the\njoint training objective encourage this? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>)</em></li>\n<li>State CFRNet's double-robustness bound and explain what happens when you increase the balance\npenalty <math data-tex=\"\\lambda\"><mi>λ</mi></math> too much. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>)</em></li>\n<li>Derive the Robinson decomposition from <math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math> and explain why\n<math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> disappears. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>)</em></li>\n<li>What is Neyman orthogonality, and how does it change the relationship between nuisance error\nand treatment effect bias? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>Why is cross-fitting necessary even when Neyman orthogonality is satisfied? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.3\" role=\"link\" tabindex=\"0\">§7.3</a>)</em></li>\n<li>Write the R-Learner's objective function and explain why it can be interpreted as generalized\nOLS with <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> as implicit weights. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n<li>Describe the DR-Learner's three stages and explain how it combines double robustness,\northogonality, and heterogeneous effect estimation. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>Map five different causal ML methods onto the canonical DAG, specifying which edge or path each\nmethod targets and how. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-23-s19\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>\n<p><strong>Künzel, Sekhon, Bickel &amp; Yu (2019), &quot;Metalearners for estimating heterogeneous treatment\neffects using machine learning,&quot; PNAS</strong> — ⚠️ <strong>confirmed directly on the slide footer</strong> for the\nentire meta-learner section (S/T/X-learner). <code>solid</code>. The original X-learner paper — read this\nfirst among the meta-learner references.</p>\n</li>\n<li>\n<p><strong>Chernozhukov et al. (2018), &quot;Double/Debiased Machine Learning for Treatment and Structural\nParameters&quot;</strong> — ⚠️ <strong>confirmed directly on the slide footer</strong>, across the DML-framework slide\nrange (e.g. the slide introducing <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>'s &quot;regularization bias in nuisance functions,&quot; footer reads\n&quot;Chernozhukov et al. (2018) · Robinson (1988) · Wager (2024)&quot;) — <strong>not</strong> slide 85 as an earlier\npass of this file stated (slide 85's own footer is &quot;Doubly-robust learner · Kennedy (2023),&quot; the\nDR-Learner citation, see item 10 below). <code>hard</code>. The foundational DML paper; essential reading for\nunderstanding partialing out, Neyman orthogonality, and cross-fitting in full technical detail.</p>\n</li>\n<li>\n<p><strong>Shalit, Johansson &amp; Sontag (2017), &quot;Estimating Individual Treatment Effect: Generalization\nBounds and Algorithms,&quot; ICML</strong> (companion: Johansson, Shalit &amp; Sontag, 2016) — ⚠️ <strong>confirmed\ndirectly on the slide footer</strong> as the single paper introducing both TarNet and CFRNet. <code>solid</code>.\nThe representation-learning paper for causal inference — covers both <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a> and <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>.</p>\n</li>\n<li>\n<p><strong>Athey &amp; Imbens (2016), &quot;Recursive Partitioning for Heterogeneous Causal Effects&quot;</strong> — ⚠️\n<strong>confirmed directly on the slide footer</strong> for the causal-trees-and-forests section (the same\nfooter that names items 5's paper). <code>hard</code>. The original causal-tree paper — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.1\" role=\"link\" tabindex=\"0\">§4.1</a>'s splitting\ncriterion and honest-estimation idea trace directly to this work.</p>\n</li>\n<li>\n<p><strong>Athey, Tibshirani &amp; Wager (2019), &quot;Generalized Random Forests,&quot; Annals of Statistics</strong> — ⚠️\n<strong>confirmed directly on the slide footer</strong> (same causal-trees-and-forests slide as item 4) — this\nis the local-centering causal forest variant that actually achieves Neyman orthogonality, per the\n⚠️ callout in <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.2\" role=\"link\" tabindex=\"0\">§4.2</a>. <code>hard</code>. (An earlier pass of this file incorrectly flagged this as &quot;not named\non the slides&quot; — corrected here after direct re-verification.)</p>\n</li>\n<li>\n<p><strong>Robinson (1988), &quot;Root-N-Consistent Semiparametric Regression&quot;</strong> — ⚠️ <strong>confirmed directly on\nthe slide footer</strong>, across the same DML-framework slide range as item 2 — this is the paper <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>'s\nRobinson-decomposition formulas are named for. <code>hard</code>. (An earlier pass of this file incorrectly\nflagged this as &quot;not named on the slides&quot; — corrected here after direct re-verification.)</p>\n</li>\n<li>\n<p><strong>Neyman (1959), &quot;Optimal Asymptotic Tests of Composite Hypotheses&quot;</strong> — ⚠️ <strong>confirmed directly on\nthe slide footer</strong> for the Neyman-orthogonality slides (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>'s source range). <code>hard</code>. The origin of\nthe term &quot;Neyman orthogonality&quot; that <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a> is built entirely around — worth reading for the\noriginal statistical idea behind the modern causal-ML usage.</p>\n</li>\n<li>\n<p><strong>Wager (2024)</strong> — ⚠️ <strong>confirmed directly on the slide footer</strong>, appearing across both the\nheterogeneous-treatment-effects framing (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s source range) and the DML-framework slides (item 2's\nrange) — a recent synthesis/lecture-note-style reference tying the two topics together. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>Nie &amp; Wager (2021), &quot;Quasi-Oracle Estimation of Heterogeneous Treatment Effects,&quot; Biometrika</strong>\n— ⚠️ <strong>confirmed directly on the slide footer and body text</strong> of the R-Learner slide. <code>hard</code>. The\nactual R-Learner paper — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s objective function traces directly to this work, which had no\ncitation in this section before this review.</p>\n</li>\n<li>\n<p><strong>Kennedy (2023), &quot;Towards optimal doubly robust estimation of heterogeneous causal effects&quot;</strong>\n— ⚠️ <strong>confirmed directly on the slide footer</strong> (&quot;Doubly-robust learner · Kennedy (2023)&quot;) for\nthe DR-Learner slide. <code>hard</code>. The actual DR-Learner citation — <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s pseudo-outcome formula\ntraces directly to this work, which had no citation in this section before this review.</p>\n</li>\n<li>\n<p><strong>Imbens &amp; Rubin (2015), &quot;Causal Inference for Statistics, Social, and Biomedical Sciences&quot;</strong>\n— ⚠️ not named on the slides — comprehensive reference for the potential outcomes framework\nunderpinning the entire series. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>Athey &amp; Imbens (2019), &quot;Machine Learning Methods That Economists Should Know About,&quot;\nAnnual Review of Economics</strong> — ⚠️ not named on the slides — influential survey connecting ML\nmethods (including causal forests) to econometric causal inference. <code>solid</code>. (Corrected from a\nstated year of 2018 — confirmed via WebSearch: published in <em>Annual Review of Economics</em>, Vol.\n11, 2019, pp. 685–725.)</p>\n</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — items 1–10 are confirmed directly on the lecture's own slide footers (items\n4–5's earlier &quot;not named on the slides&quot; flags, and item 2's slide-85 attribution, were themselves\nerrors from an earlier review pass — both corrected above after direct re-verification against the\nraw slide images). Items 11–12 are added from general causal inference field knowledge to support concepts the lecture uses\nbut does not cite by author/year — treat them as suggested background reading, not transcribed\nlecture citations.</p>\n</aside>\n</section>","sections":[{"id":"causal-inference-23-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s1","num":"","title":"Before we start: what you need to know","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s2","num":"","title":"The big picture","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s3","num":"1","title":"From Average to Heterogeneous Treatment Effects","mins":5,"kind":"content","part":""},{"id":"causal-inference-23-s4","num":"2","title":"From CATE Definition to Estimation — the Identification Bridge","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s5","num":"3","title":"Meta-Learners — Flexible ML Plug-ins","mins":4,"kind":"content","part":""},{"id":"causal-inference-23-s6","num":"4","title":"Causal Trees and Forests","mins":4,"kind":"content","part":""},{"id":"causal-inference-23-s7","num":"5","title":"Deep Representation Learning for Causal Inference","mins":6,"kind":"content","part":""},{"id":"causal-inference-23-s8","num":"6","title":"Orthogonal Causal ML — The DML Framework","mins":1,"kind":"content","part":""},{"id":"causal-inference-23-s9","num":"7","title":"The Three Ideas of DML","mins":6,"kind":"content","part":""},{"id":"causal-inference-23-s10","num":"8","title":"DML in Summary","mins":1,"kind":"content","part":""},{"id":"causal-inference-23-s11","num":"9","title":"R-Learner — DML for Heterogeneous Effects","mins":2,"kind":"content","part":""},{"id":"causal-inference-23-s12","num":"10","title":"DR-Learner — Doubly Robust + Orthogonal + Meta-Learner","mins":1,"kind":"content","part":""},{"id":"causal-inference-23-s13","num":"11","title":"The Full Landscape","mins":3,"kind":"content","part":""},{"id":"causal-inference-23-s14","num":"12","title":"Beyond Treatment Effects — Frontiers of {"num":"13","short":"Part 4 · Diffusion Models and Flow Matching"}]},{"slug":"genai-llm","name":"GenAI & LLM","lectures":4,"sections":113,"index":[{"num":"01","short":"Part 1 · Foundations, Scale, and the Transformer"},{"num":"02","short":"Alignment & Training: Turning a Predictor into an Assistant"},{"num":"03","short":"Using & Serving LLMs: Seven Levers on Three Axes"},{"num":"04","short":"Beyond Text: Multimodal Models and Diffusion"}]},{"slug":"sequential-learning","name":"Sequential Learning","lectures":3,"sections":65,"index":[{"num":"18","short":"Part 1 · Text Representations, From Discrete Symbols to…"},{"num":"19","short":"Part 2 · From Context to Attention"},{"num":"20","short":"Part 3 · Subword Tokenization, the Transformer, and Language…"}]},{"slug":"causal-inference","name":"Causal Inference","lectures":3,"sections":61,"index":[{"num":"21","short":"Part 1 · Foundations, Graphical Models, and do-Calculus"},{"num":"22","short":"Part 2 · Treatment Effects, Identification, and Classical…"},{"num":"23","short":"Part 3 · Causal ML Methods for Treatment Effect Estimation"}]},{"slug":"reinforcement-learning","name":"Reinforcement Learning","lectures":3,"sections":62,"index":[{"num":"24","short":"Part 1 · Foundations, MDPs, and Bellman Equations"},{"num":"25","short":"Part 2 · From Planning to Learning"},{"num":"26","short":"Part 3 · From Policy Gradients to Human Feedback"}]},{"slug":"agentic-ai","name":"Agentic AI","lectures":3,"sections":61,"index":[{"num":"27","short":"Part 1 · Fundamentals, Architectures, and Reasoning"},{"num":"28","short":"Part 2 · Tools, Memory, and MCP"},{"num":"29","short":"Part 3 · Multi-Agent Systems, Workflows, and Production"}]}]}</script>
<script>"use strict";
/* Real interactive figures for Supervised Learning.  Keyed by the `title:` in
   the source `interactive` block.  Anything without an entry here keeps its
   fallback prose (which teaches the point completely on its own). */

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
// a minimal cartesian plotter: data coords -> pixel coords, axes, grid
function mkPlot(mount, { w = 460, h = 300, xr, yr, xlab, ylab, pad = 34 }){
  const svg = el('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h });
  el('rect', { x: 0, y: 0, width: w, height: h, class: 'plot-bg', rx: 6 }, svg);
  const X = v => pad + (v - xr[0]) / (xr[1] - xr[0]) * (w - pad - 8);
  const Y = v => (h - pad) - (v - yr[0]) / (yr[1] - yr[0]) * (h - pad - 10);
  for (let i = 0; i <= 4; i++){
    const gx = xr[0] + (xr[1] - xr[0]) * i / 4, gy = yr[0] + (yr[1] - yr[0]) * i / 4;
    el('line', { x1: X(gx), y1: Y(yr[0]), x2: X(gx), y2: Y(yr[1]), class: 'plot-grid' }, svg);
    el('line', { x1: X(xr[0]), y1: Y(gy), x2: X(xr[1]), y2: Y(gy), class: 'plot-grid' }, svg);
    const tx = el('text', { x: X(gx), y: h - pad + 13, class: 'plot-label', 'text-anchor': 'middle' }, svg);
    tx.textContent = (+gx.toFixed(2)).toString();
    const ty = el('text', { x: pad - 5, y: Y(gy) + 3, class: 'plot-label', 'text-anchor': 'end' }, svg);
    ty.textContent = (+gy.toFixed(2)).toString();
  }
  el('line', { x1: X(xr[0]), y1: Y(yr[0]), x2: X(xr[1]), y2: Y(yr[0]), class: 'plot-axis' }, svg);
  el('line', { x1: X(xr[0]), y1: Y(yr[0]), x2: X(xr[0]), y2: Y(yr[1]), class: 'plot-axis' }, svg);
  if (xlab) { const t = el('text', { x: w - 6, y: h - pad + 13, class: 'plot-label', 'text-anchor': 'end' }, svg); t.textContent = xlab; }
  if (ylab) { const t = el('text', { x: pad - 5, y: 12, class: 'plot-label', 'text-anchor': 'end' }, svg); t.textContent = ylab; }
  mount.appendChild(svg);
  const api = {
    svg, X, Y,
    curve(fn, attrs){
      let d = '';
      for (let i = 0; i <= 240; i++){
        const x = xr[0] + (xr[1] - xr[0]) * i / 240;
        const y = fn(x);
        if (!isFinite(y)) { d += ' M'; continue; }
        d += `${d && d.slice(-2) !== ' M' ? 'L' : 'M'}${X(x).toFixed(1)},${Y(Math.max(yr[0], Math.min(yr[1], y))).toFixed(1)} `;
      }
      return el('path', Object.assign({ d, fill: 'none', 'stroke-width': 2 }, attrs), svg);
    },
    seg(x1, y1, x2, y2, attrs){ return el('line', Object.assign({ x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), 'stroke-width': 2 }, attrs), svg); },
    dot(x, y, r, attrs){ return el('circle', Object.assign({ cx: X(x), cy: Y(y), r }, attrs), svg); },
  };
  return api;
}
function ctl(mount, defs, onChange){
  const bar = document.createElement('div'); bar.className = 'iv-ctl';
  const state = {};
  defs.forEach(d => {
    state[d.key] = d.value;
    const lab = document.createElement('label');
    lab.innerHTML = `${d.label} <span>${d.type === 'range'
      ? `<input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.value}"><span class="val"> ${d.fmt ? d.fmt(d.value) : d.value}</span>`
      : d.options.map(o => `<label style="flex-direction:row;gap:4px;font-weight:500"><input type="radio" name="${d.key}" value="${o}" ${o === d.value ? 'checked' : ''}>${o}</label>`).join(' ')}</span>`;
    if (d.type === 'range') {
      const inp = lab.querySelector('input'), out = lab.querySelector('.val');
      inp.addEventListener('input', () => { state[d.key] = +inp.value; out.textContent = ' ' + (d.fmt ? d.fmt(+inp.value) : inp.value); onChange(state); });
    } else {
      lab.querySelectorAll('input').forEach(r => r.addEventListener('change', () => { state[d.key] = r.value; onChange(state); }));
    }
    bar.appendChild(lab);
  });
  mount.appendChild(bar);
  return state;
}
function readout(mount){ const d = document.createElement('div'); d.className = 'readout'; mount.appendChild(d); return d; }

const INTERACTIVE = {};

/* ── L2 §2 — One outlier, two fits ─────────────────────────────────── */
INTERACTIVE['One outlier, two fits'] = (mount, spec) => {
  const base = [];
  for (let i = 0; i < 18; i++){ const x = i / 17 * 8 + 1; base.push([x, 0.6 * x + 2 + (Math.sin(i * 91.7) * 0.7)]); }
  const P = mkPlot(mount, { xr: [0, 10], yr: [0, 14], xlab: 'x', ylab: 'y' });
  const fitLine = wfn => P.curve(wfn, {});
  const mseL = P.curve(x => x, { stroke: 'var(--c-warn)' });
  const maeL = P.curve(x => x, { stroke: 'var(--accent)' });
  const outDot = P.dot(6, 12, 6, { fill: 'var(--c-warn)', cursor: 'ns-resize' });
  base.forEach(([x, y]) => P.dot(x, y, 3, { fill: 'var(--ink-3)' }));
  const out = readout(mount);
  let oy = 12;
  function fitMSE(pts){ // least squares
    const n = pts.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
    pts.forEach(([x, y]) => { sx += x; sy += y; sxx += x * x; sxy += x * y; });
    const m = (n * sxy - sx * sy) / (n * sxx - sx * sx); return [m, (sy - m * sx) / n];
  }
  function fitMAE(pts){ // coordinate-descent-ish: minimise sum|y-mx-b| over a grid
    let best = [0.6, 2], bs = 1e9;
    for (let m = -0.5; m <= 2; m += 0.02) for (let b = -2; b <= 8; b += 0.1){
      let s = 0; for (const [x, y] of pts) s += Math.abs(y - m * x - b);
      if (s < bs) { bs = s; best = [m, b]; }
    }
    return best;
  }
  function draw(){
    const pts = base.concat([[6, oy]]);
    const [m1, b1] = fitMSE(pts), [m2, b2] = fitMAE(pts);
    mseL.setAttribute('d', pathFor(P, x => m1 * x + b1));
    maeL.setAttribute('d', pathFor(P, x => m2 * x + b2));
    outDot.setAttribute('cy', P.Y(oy));
    out.innerHTML = `outlier at y = <b>${oy.toFixed(1)}</b> &nbsp;·&nbsp;
      <span style="color:var(--c-warn)">MSE fit</span> ŷ = <b>${m1.toFixed(2)}</b>x + <b>${b1.toFixed(2)}</b> &nbsp;·&nbsp;
      <span style="color:var(--accent)">MAE fit</span> ŷ = <b>${m2.toFixed(2)}</b>x + <b>${b2.toFixed(2)}</b>`;
  }
  const pathFor = (P, fn) => { let d = ''; for (let i = 0; i <= 60; i++){ const x = i / 60 * 10; d += (i ? 'L' : 'M') + P.X(x).toFixed(1) + ',' + P.Y(fn(x)).toFixed(1) + ' '; } return d; };
  let drag = false;
  const svg = P.svg;
  const yAt = ev => { const r = svg.getBoundingClientRect(); const py = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    const vb = svg.viewBox.baseVal; const sy = py / r.height * vb.height;
    return Math.max(2, Math.min(14, (300 - 34 - sy) / (300 - 34 - 10) * 14)); };
  outDot.addEventListener('pointerdown', e => { drag = true; outDot.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (!drag) return; oy = yAt(e); draw(); });
  svg.addEventListener('pointerup', () => drag = false);
  draw();
};

/* ── L2 §4 — The delta dial (Huber between MSE and MAE) ────────────── */
INTERACTIVE['The delta dial'] = (mount) => {
  const P = mkPlot(mount, { xr: [-6, 6], yr: [0, 8], xlab: 'error  e', ylab: 'loss' });
  P.curve(e => 0.5 * e * e, { stroke: 'var(--ink-3)', 'stroke-dasharray': '4 3' });     // MSE ½e²
  P.curve(e => Math.abs(e), { stroke: 'var(--ink-3)', 'stroke-dasharray': '1 3' });      // MAE |e|
  const hub = P.curve(e => e, { stroke: 'var(--accent)', 'stroke-width': 2.5 });
  const zoneL = P.seg(-2, 0, -2, 8, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const zoneR = P.seg(2, 0, 2, 8, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const out = readout(mount);
  const st = ctl(mount, [{ key: 'd', label: 'δ', type: 'range', min: 0.3, max: 5, step: 0.1, value: 2, fmt: v => v.toFixed(1) }], s => draw(s.d));
  function huber(e, d){ const a = Math.abs(e); return a <= d ? 0.5 * e * e : d * (a - d / 2); }
  function draw(d){
    let dd = ''; for (let i = 0; i <= 240; i++){ const e = -6 + 12 * i / 240; dd += (i ? 'L' : 'M') + P.X(e).toFixed(1) + ',' + P.Y(Math.min(8, huber(e, d))).toFixed(1) + ' '; }
    hub.setAttribute('d', dd);
    zoneL.setAttribute('x1', P.X(-d)); zoneL.setAttribute('x2', P.X(-d));
    zoneR.setAttribute('x1', P.X(d)); zoneR.setAttribute('x2', P.X(d));
    const at10 = huber(10, d);
    out.innerHTML = `δ = <b>${d.toFixed(1)}</b> — quadratic for |e| ≤ ${d.toFixed(1)}, linear beyond.
      An error of 10 costs <b>${at10.toFixed(1)}</b> under Huber vs <b>50</b> under ½e² and <b>10</b> under |e|.
      ${d < 0.6 ? ' At small δ it collapses onto MAE.' : d > 4 ? ' At large δ it hugs MSE.' : ''}`;
  }
  draw(2);
};

INTERACTIVE['Impurity as the class mix changes'] = (mount) => {

  P.curve(p => 2 * p * (1 - p), { stroke: 'var(--accent)' });                              // Gini
  P.curve(p => p <= 0 || p >= 1 ? 0 : -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p)) / 2, { stroke: 'var(--c-key)', 'stroke-dasharray': '4 3' }); // entropy/2
  const g = P.dot(0.5, 0.5, 4, { fill: 'var(--accent)' });

/* ── GenAI · L3 / Sequential · L3 — temperature + top-p on a distribution */
INTERACTIVE['Temperature and top-p, live'] = (mount) => {
  const PROMPTS = {
    'confident (“capital of France is …”)': [4.2, 1.4, 0.9, 0.6, 0.3, 0.1, 0.0, -0.3],
    'open-ended (“the weather was …”)': [1.1, 1.0, 0.95, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5],
  };
  const wrap = document.createElement('div'); mount.insertBefore(wrap, mount.firstChild);
  const out = readout(mount);
  const st = ctl(mount, [
    { key: 'prompt', label: 'prompt', type: 'radio', value: Object.keys(PROMPTS)[0], options: Object.keys(PROMPTS) },
    { key: 'T', label: 'temperature', type: 'range', min: 0.1, max: 2, step: 0.05, value: 1, fmt: v => v.toFixed(2) },
    { key: 'p', label: 'top-p', type: 'range', min: 0.1, max: 1, step: 0.05, value: 0.9, fmt: v => v.toFixed(2) },
  ], s => draw(s.prompt, s.T, s.p));
  function draw(prompt, T, p){
    const logits = PROMPTS[prompt];
    const ex = logits.map(z => Math.exp(z / T)); const Z = ex.reduce((a, b) => a + b, 0);
    const probs = ex.map(e => e / Z);
    const order = probs.map((v, i) => i).sort((a, b) => probs[b] - probs[a]);
    let cum = 0; const kept = new Set();
    for (const i of order){ kept.add(i); cum += probs[i]; if (cum >= p) break; }
    wrap.innerHTML = probs.map((v, i) => `<div style="display:flex;align-items:center;gap:8px;margin:2px 0;font-family:var(--font-ui);font-size:11px">
      <span style="width:22px;color:var(--ink-3)">t${i + 1}</span>
      <div style="flex:1;height:12px;background:var(--rule);border-radius:3px;overflow:hidden">
        <i style="display:block;height:100%;width:${(v * 100).toFixed(1)}%;background:${kept.has(i) ? 'var(--accent)' : 'var(--rule-2)'}"></i></div>
      <span style="width:38px;text-align:right;font-variant-numeric:tabular-nums">${(v * 100).toFixed(1)}%</span></div>`).join('');
    out.innerHTML = `T = <b>${T.toFixed(2)}</b>, top-p = <b>${p.toFixed(2)}</b> keeps <b>${kept.size} of ${probs.length}</b> tokens.
      Same p, different prompt → a different token count: top-p fixes a probability <em>mass</em>, not a count, so it adapts to how sure the model already is.`;
  }
  draw(Object.keys(PROMPTS)[0], 1, 0.9);
};

/* ── GenAI · L3 — the quantization cliff ─────────────────────────── */
INTERACTIVE['The quantization cliff'] = (mount) => {
  const P = mkPlot(mount, { xr: [2, 16], yr: [0, 4], xlab: 'bits per weight', ylab: 'perplexity increase vs FP16' });
  P.curve(b => Math.max(0, Math.pow(Math.max(0, 4 - b), 2) * 0.6), { stroke: 'var(--c-warn)' });
  const dot = P.dot(4, 0, 4, { fill: 'var(--accent)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'b', label: 'bits', type: 'range', min: 2, max: 16, step: 0.5, value: 4, fmt: v => v }], s => draw(s.b));
  function draw(b){
    const dppl = Math.max(0, Math.pow(Math.max(0, 4 - b), 2) * 0.6);

    out.innerHTML = `<b>${b}</b>-bit → model ≈ <b>${size} GB</b>, perplexity <b>+${dppl.toFixed(2)}</b> vs FP16.
      ${b >= 4 ? 'Flat — memory savings almost for free down to ~4 bits.' : 'Past the cliff — every further bit now costs real accuracy.'}
      The engineering call is knowing <em>where</em> the cliff sits, not just that quantization "helps".`;
  }

};

/* ── GenAI · L4 — forward diffusion, scrub t ─────────────────────── */
INTERACTIVE['Diffusion step t, from clean image to pure noise'] = (mount) => {
  const G = 16, cell = 12;
  const svg = el('svg', { viewBox: `0 0 ${G * cell} ${G * cell}`, width: G * cell, height: G * cell });
  // a simple recognisable shape: a diagonal gradient disc
  const base = [];
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++){
    const r = Math.hypot(x - G / 2 + .5, y - G / 2 + .5);
    base.push(r < G * 0.36 ? 0.82 : 0.12);
  }
  const rects = base.map((v, i) => el('rect', { x: (i % G) * cell, y: ((i / G) | 0) * cell, width: cell, height: cell, fill: '#000' }, svg));
  mount.appendChild(svg);
  const out = readout(mount);
  ctl(mount, [{ key: 't', label: 'noise level  t', type: 'range', min: 0, max: 100, step: 1, value: 0, fmt: v => v + '%' }], s => draw(s.t));
  const rand = i => (Math.sin(i * 999.13 + 7.7) * 43758.5453) % 1;
  function draw(t){
    const a = t / 100;
    base.forEach((v, i) => {
      const n = 0.5 + 0.5 * Math.sin(i * 12.9898 + t * 0.6);   // per-frame pseudo-noise
      const g = Math.round(255 * ((1 - a) * v + a * n));
      rects[i].setAttribute('fill', `rgb(${g},${g},${g})`);
    });
    out.innerHTML = `t = <b>${t}%</b> — ${t === 0 ? 'the clean image x₀.' : t >= 99 ? 'pure Gaussian static x_T.' : 'a well-defined point x_t on one fixed path.'}
      The forward process has no parameters, so every x_t is reproducible; the reverse model's whole job is to undo one step of this.`;
  }
  draw(0);
};

/* ── GenAI · L4 — classifier-free guidance scale ─────────────────── */
INTERACTIVE['Guidance scale w'] = (mount) => {

      <span style="color:var(--c-int)">diversity ${d.toFixed(0)}%</span>.

  }

/* ── Sequential · L1 — TF-IDF weight vs document frequency ───────── */
INTERACTIVE['TF-IDF Weight as Document Frequency Changes'] = (mount) => {
  const N = 1000, TF = 3;
  const P = mkPlot(mount, { xr: [1, 1000], yr: [0, 25], xlab: 'documents containing the term  nₜ', ylab: 'tf-idf  (tf = 3)' });
  P.curve(n => TF * Math.log(N / n), { stroke: 'var(--accent)' });
  const dot = P.dot(5, 0, 4, { fill: 'var(--accent)' });

/* ── Unsupervised · L1 — cut the dendrogram ─────────────────────── */
INTERACTIVE['Cut the dendrogram'] = (mount) => {
  // 9 leaves, a fixed Ward merge sequence (height at which each pair joins)
  const merges = [ [0, 1, 2], [3, 4, 3], [5, 6, 4], [2, 7, 6], [8, -1, 7], [0, 3, 9], [5, 8, 12], [0, 5, 16] ];
  const W = 380, H = 240, pad = 24;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  el('rect', { x: 0, y: 0, width: W, height: H, class: 'plot-bg', rx: 6 }, svg);
  const leafX = i => pad + i * (W - 2 * pad) / 8;
  const Y = h => H - pad - h / 17 * (H - 2 * pad);
  // draw simple connectors bottom-up
  const pos = {}; for (let i = 0; i < 9; i++) pos[i] = { x: leafX(i), y: H - pad };
  let cid = 9;
  merges.forEach(([a, b, h]) => {
    const A = pos[a], B = pos[b] || A;
    const nx = (A.x + B.x) / 2, ny = Y(h);
    el('path', { d: `M${A.x},${A.y} V${ny} H${B.x} V${B.y}`, fill: 'none', stroke: 'var(--ink-3)', 'stroke-width': 1.4 }, svg);
    pos[cid++] = { x: nx, y: ny };
  });
  for (let i = 0; i < 9; i++){ const t = el('text', { x: leafX(i), y: H - 6, class: 'plot-label', 'text-anchor': 'middle' }, svg); t.textContent = String.fromCharCode(65 + i); }
  const cutLine = el('line', { x1: pad, x2: W - pad, y1: Y(10), y2: Y(10), stroke: 'var(--accent)', 'stroke-width': 2 }, svg);
  mount.appendChild(svg);
  const out = readout(mount);
  ctl(mount, [{ key: 'h', label: 'cut height', type: 'range', min: 1, max: 17, step: 0.5, value: 10, fmt: v => v.toFixed(1) }], s => draw(s.h));
  function draw(h){
    cutLine.setAttribute('y1', Y(h)); cutLine.setAttribute('y2', Y(h));
    const k = 9 - merges.filter(m => m[2] <= h).length;
    out.innerHTML = `cut at height <b>${h.toFixed(1)}</b> → <b>${Math.max(1, k)}</b> clusters.
      Nothing is recomputed — every K from 1 (above the root) to 9 (below every leaf) is already in this one tree,
      unlike K-Means' "re-run for every K".`;
  }
  draw(10);
};

/* ── RL · L1 — γ and the effective horizon ──────────────────────── */
INTERACTIVE["γ and the Agent's Time Horizon"] = (mount) => {
  const P = mkPlot(mount, { xr: [0, 60], yr: [0, 1], xlab: 'steps into the future  t', ylab: 'weight  γᵗ' });
  const curve = P.curve(t => Math.pow(0.9, t), { stroke: 'var(--accent)' });
  const mk = P.seg(10, 0, 10, 1, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const out = readout(mount);
  ctl(mount, [{ key: 'g', label: 'γ', type: 'range', min: 0, max: 0.99, step: 0.01, value: 0.9, fmt: v => v.toFixed(2) }], s => draw(s.g));
  function draw(g){
    let d = ''; for (let i = 0; i <= 60; i++) d += (i ? 'L' : 'M') + P.X(i) + ',' + P.Y(Math.pow(g, i)) + ' ';
    curve.setAttribute('d', d);
    const hor = g < 1 ? 1 / (1 - g) : Infinity;
    mk.setAttribute('x1', P.X(Math.min(60, hor))); mk.setAttribute('x2', P.X(Math.min(60, hor)));
    out.innerHTML = `γ = <b>${g.toFixed(2)}</b> → effective horizon 1/(1−γ) ≈ <b>${isFinite(hor) ? hor.toFixed(0) : '∞'}</b> steps.
      A reward ${Math.round(hor)} steps away is already discounted to ~37% of its face value.
      ${g < 0.5 ? 'Near-sighted: only the next move matters.' : g > 0.97 ? 'Far-sighted — and slow, high-variance to learn.' : ''}`;
  }
  draw(0.9);
};

/* ── DimRed · L1 — volume of a ball inside its cube ─────────────── */
function lgamma(x){
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
INTERACTIVE['Ball inside a cube, as dimension grows'] = (mount) => {
  const P = mkPlot(mount, { xr: [1, 20], yr: [-8, 0], xlab: 'dimension  d', ylab: 'log₁₀ (ball ÷ cube)' });
  const ratio = d => Math.exp((d / 2) * Math.log(Math.PI) - lgamma(d / 2 + 1)) / Math.pow(2, d);
  P.curve(d => Math.log10(ratio(d)), { stroke: 'var(--accent)' });
  const dot = P.dot(3, Math.log10(ratio(3)), 4, { fill: 'var(--accent)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'd', label: 'dimension', type: 'range', min: 1, max: 20, step: 1, value: 3, fmt: v => v }], s => draw(s.d));
  function draw(d){
    const r = ratio(d);
    dot.setAttribute('cx', P.X(d)); dot.setAttribute('cy', P.Y(Math.max(-8, Math.log10(r))));
    out.innerHTML = `d = <b>${d}</b> — the inscribed ball fills <b>${r < 1e-3 ? r.toExponential(1) : (r * 100).toFixed(1) + '%'}</b> of the cube.
      By d = 10 it's under 0.25%; essentially all the cube's volume is in the corners the ball never reaches.
      That emptiness is the curse of dimensionality in one number.`;
  }
  draw(3);
};

/* ── DimRed · L1 — distance concentration ───────────────────────── */
INTERACTIVE['Distances concentrate as dimension grows'] = (mount) => {
  const P = mkPlot(mount, { xr: [1, 100], yr: [0, 1], xlab: 'dimension  d', ylab: '(max − min) ÷ min distance' });
  P.curve(d => 1.8 / Math.sqrt(d), { stroke: 'var(--accent)' });
  const dot = P.dot(2, 1.8 / Math.SQRT2, 4, { fill: 'var(--accent)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'd', label: 'dimension', type: 'range', min: 2, max: 100, step: 1, value: 2, fmt: v => v }], s => draw(s.d));
  function draw(d){
    const c = 1.8 / Math.sqrt(d);
    dot.setAttribute('cx', P.X(d)); dot.setAttribute('cy', P.Y(Math.min(1, c)));
    out.innerHTML = `d = <b>${d}</b> — nearest and farthest point differ by only <b>${(c * 100).toFixed(0)}%</b> of the near distance.
      As d grows every pair of points drifts toward the same distance, so "nearest neighbour" stops meaning much — the ~1/√d shape is why.`;
  }
  draw(2);
};

      <span class="go">${act ? '→' : (k === 'first' ? firstPct + '%' : '')}</span>
    </button>`).join('') + `</div>`;

  const hls = Object.entries(HL).filter(([, v]) => v.mod === MOD && v.lec === L.id);
  h += `<div class="rl-h">Highlights</div>` + (hls.length
    ? `<ul class="rlist">` + hls.map(([k, v]) => `<li data-c="${v.c}">
        <button data-go="${v.sec}" data-hl="${k}">${esc(v.text.slice(0, 88))}${v.text.length > 88 ? '…' : ''}</button></li>`).join('') + `</ul>`
    : `<p class="empty">Select text, pick a colour. Terracotta (3) = “come back to this”.</p>`);

  const ns = Object.entries(NOTES).filter(([, v]) => v.mod === MOD && v.lec === L.id);
  h += `<div class="rl-h">Notes</div>` + (ns.length
    ? `<ul class="rlist">` + ns.map(([, v]) => `<li><button data-go="${v.sec}">${esc(v.text.slice(0, 88))}</button></li>`).join('') + `</ul>`
    : `<p class="empty">Hover a paragraph, press +.</p>`);
  railRbody.innerHTML = h;
}

/* Highlights span multiple text nodes (a <strong> then plain text, etc.), so we
   store a character offset into the section's text and, on apply, wrap every
   text node the range touches — going back-to-front so earlier offsets hold. */
function sectionTextNodes(sec){
  const w = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
  const out = []; let n;
  while ((n = w.nextNode())) {
    if (n.parentElement.closest('script,style,.addn,.note')) continue;
    out.push(n);
  }
  return out;
}
function offsetOfRange(sec, range){
  const nodes = sectionTextNodes(sec);
  const sc = range.startContainer, so = range.startOffset;
  let acc = 0;
  if (sc.nodeType === 3){
    for (const node of nodes){ if (node === sc) return acc + so; acc += node.nodeValue.length; }
    return acc;
  }
  const boundary = sc.childNodes ? sc.childNodes[so] : null;   // point is just before this child
  for (const node of nodes){
    if (boundary && (node === boundary || boundary.contains?.(node))) return acc;
    if (boundary && (node.compareDocumentPosition(boundary) & Node.DOCUMENT_POSITION_PRECEDING)) return acc;
    acc += node.nodeValue.length;
  }
  return acc;
}
function findOffset(sec, text){ return sec.textContent.indexOf(text); }
function applyHL(sec, start, len, c, k){
  if (!sec || start < 0 || sec.querySelector(`.hl[data-k="${k}"]`)) return;
  const end = start + len;
  const nodes = sectionTextNodes(sec);
  let acc = 0; const hits = [];
  for (const node of nodes){
    const s = acc, e = acc + node.nodeValue.length; acc = e;
    if (e <= start || s >= end) continue;
    hits.push({ node, a: Math.max(0, start - s), b: Math.min(node.nodeValue.length, end - s) });
  }
  for (let i = hits.length - 1; i >= 0; i--){
    const { node, a, b } = hits[i];
    if (a >= b || node.parentElement.closest('.hl')) continue;
    const r = document.createRange(); r.setStart(node, a); r.setEnd(node, b);
    const span = document.createElement('span'); span.className = 'hl'; span.dataset.c = c; span.dataset.k = k;
    try { r.surroundContents(span); } catch (e) {}
  }
}
function removeHL(k){
  document.querySelectorAll(`.hl[data-k="${k}"]`).forEach(el => {
    const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); p.normalize();
  });
}
