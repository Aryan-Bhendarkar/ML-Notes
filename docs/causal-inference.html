ed Work programme, mid-1970s. <math data-tex=\"T\"><mi>T</mi></math>: enrolled (1) or not (0). <math data-tex=\"Y\"><mi>Y</mi></math>: 1978\nearnings.</p>\n<p><strong>A coin flip decided enrolment.</strong> Trainees earned $6,349 (average), controls $4,555: <strong>gap\n$1,794.</strong></p>\n<p><em>&quot;The programme raised earnings by ≈ $1,794 per person. Coin flip made groups alike, so the gap is\nthe real effect.&quot;</em></p>\n<p>🧪 <strong>Baseline covariate balance, confirming the randomization worked:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Covariate</th>\n<th>Trainees (<math data-tex=\"T{=}1\"><mrow><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn></mrow></math>)</th>\n<th>Controls (<math data-tex=\"T{=}0\"><mrow><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn></mrow></math>)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Prior-year earnings</td>\n<td>$2,096</td>\n<td>$2,107</td>\n</tr>\n<tr>\n<td>Age (years)</td>\n<td>26</td>\n<td>25</td>\n</tr>\n<tr>\n<td>Share married</td>\n<td>19%</td>\n<td>15%</td>\n</tr>\n<tr>\n<td>No high-school degree</td>\n<td>71%</td>\n<td>84%</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Dots aligned: the raw $1,794 gap is the causal effect. This is the real effect; every later\nmethod is judged against it.&quot;</em></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why this dataset is used as a teaching device.</strong> Because the trainees and\ncontrols were assigned by a coin flip, they are — by the argument in Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a> — statistically\nidentical on <em>every</em> characteristic, observed or not, except treatment. This makes $1,794 a known,\ntrustworthy ground truth. The rest of the lecture repeatedly asks: <strong>if we pretend we didn't have\nthe coin flip, and instead had to recover this number from a non-randomized comparison, how close\ncould each method get?</strong></p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s4\" data-title=\"Two Estimates of One Treatment Effect\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Two Estimates of One Treatment Effect</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The same job-training data gives opposite signs under two comparisons.&quot;</em></p>\n<ul>\n<li><strong>Randomised trial:</strong> <math data-tex=\"\\text{ATT}\\approx+\\$1{,}794\"><mrow><mtext>ATT</mtext><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,794</mn></mrow></math>. Random assignment makes the gap causal.</li>\n<li><strong>Usually no coin flip.</strong> A non-randomised comparison — here, replacing the randomized control\ngroup with a survey-based comparison group drawn from the general population — gives:</li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\hat\\Delta = \\mathbb{E}[Y\\mid T{=}1] - \\mathbb{E}[Y\\mid T{=}0] \\approx -\\$8{,}498\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mrow><mi mathvariant=\"normal\">Δ</mi><mspace></mspace></mrow><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>$</mi><mn>8,498</mn></mrow></math></div>\n<p><strong>Opposite sign: the naive comparison says training <em>cut</em> earnings.</strong> Same programme, two answers.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This single contrast is the motivating puzzle for the entire remaining lecture.</strong> Nothing about\nthe <em>program</em> changed between these two numbers — only the comparison group did (a randomized\ncontrol group vs. a survey-drawn comparison group of people who didn't opt into the program). Every\ntool introduced from here on is aimed at explaining and then correcting exactly this kind of\ndiscrepancy.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s5\" data-title=\"Estimand, Estimator, Estimate — One Causal Number Is Really Three Things\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Estimand, Estimator, Estimate — One Causal Number Is Really Three Things</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;One causal number is really three things: the target, the rule, the answer.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Estimand</strong> (the target)</th>\n<th><strong>Estimator</strong> (the rule)</th>\n<th><strong>Estimate</strong> (the answer)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Definition</td>\n<td>The effect a decision asks for, fixed <em>before</em> any data. Here, training on earnings: <math data-tex=\"\\theta = \\mathbb{E}[Y(1)-Y(0)\\mid T{=}1]\"><mrow><mi>θ</mi><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>The procedure turning data into a number, <math data-tex=\"\\hat\\theta = g(\\text{data})\"><mrow><mover><mi>θ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>data</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>The value this dataset returns under that rule</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Two ways to be wrong: the wrong <strong>target</strong> or a <strong>careless rule</strong>.&quot;</em></p>\n<p>🧪 <strong>Worked example, made concrete on the running data:</strong> Using the naive (careless) rule\n<math data-tex=\"\\hat\\theta = g(\\text{data}) = -\\$8{,}498\"><mrow><mover><mi>θ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>data</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>$</mi><mn>8,498</mn></mrow></math> against the fixed estimand (target) <math data-tex=\"\\theta=\\$1{,}794\"><mrow><mi>θ</mi><mo>=</mo><mi>$</mi><mn>1,794</mn></mrow></math>\ngives a <strong>gap to target of $10,292</strong> — the estimator's answer landed over ten thousand dollars from\nthe number it was actually supposed to be estimating.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why this distinction matters practically.</strong> A large gap between an estimate and\nthe truth could mean the <em>procedure</em> was careless (a fixable estimator problem — e.g., forgetting to\nadjust for a confounder) or it could mean the <em>estimand itself</em> was wrong for the question being\nasked (e.g., computing an ATE when the business question actually needs an ATT). Diagnosing which\nfailure occurred is the necessary first step before trying to fix anything — this is exactly the\ndistinction <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>'s five estimands and <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>'s selection-bias decomposition are built to help you make.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s6\" data-title=\"Treatment-Effect Estimands — the Same Unit-Level Effect, Averaged Differently\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Treatment-Effect Estimands — the Same Unit-Level Effect, Averaged Differently</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The same unit-level effect, averaged over a different set of units.&quot;</em> All five estimands share the\nsame building block, the individual treatment effect <math data-tex=\"\\tau_i = Y_i(1) - Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — they differ only in\n<em>which units</em> get averaged over.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Estimand</th>\n<th>Formula</th>\n<th>Averaged over</th>\n<th>Interpretation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ITE</strong></td>\n<td><math data-tex=\"\\tau_i = Y_i(1)-Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>One unit</td>\n<td><em>&quot;The effect we want for one unit. Never measured.&quot;</em></td>\n</tr>\n<tr>\n<td><strong>ATE</strong></td>\n<td><math data-tex=\"\\text{ATE}=\\mathbb{E}[Y(1)-Y(0)]\"><mrow><mtext>ATE</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>All units (~445 in this dataset)</td>\n<td><em>&quot;One policy set for the whole population.&quot;</em></td>\n</tr>\n<tr>\n<td><strong>ATT</strong></td>\n<td><math data-tex=\"\\text{ATT}=\\mathbb{E}[Y(1)-Y(0)\\mid T{=}1]\"><mrow><mtext>ATT</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>The 185 treated units only</td>\n<td><em>&quot;Retaining a programme for those who already take it.&quot;</em></td>\n</tr>\n<tr>\n<td><strong>ATC</strong></td>\n<td><math data-tex=\"\\text{ATC}=\\mathbb{E}[Y(1)-Y(0)\\mid T{=}0]\"><mrow><mtext>ATC</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>The 260 control units only</td>\n<td><em>&quot;Extending a programme to the currently untreated.&quot;</em> — &quot;what the 260 controls would have gained&quot;</td>\n</tr>\n<tr>\n<td><strong>CATE(<math data-tex=\"x\"><mi>x</mi></math>)</strong></td>\n<td><math data-tex=\"\\tau(x)=\\mathbb{E}[Y(1)-Y(0)\\mid X{=}x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>Units sharing covariate value <math data-tex=\"x\"><mi>x</mi></math></td>\n<td><em>&quot;Targeting by subgroups. A group average, not one unit.&quot;</em></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — choosing the right estimand for a business question.</strong> ATT answers <em>&quot;was\nthis worth it, for the people who actually got it?&quot;</em> — the right estimand if you're deciding whether\nto <strong>keep running</strong> an existing, opt-in program. ATC answers <em>&quot;what would we gain by expanding this\nto people not currently getting it?&quot;</em> — the right estimand for an <strong>expansion</strong> decision. ATE answers\n<em>&quot;what if we mandated this for everyone?&quot;</em> — appropriate only if you can imagine forcing the whole\npopulation through it. CATE is the estimand behind <strong>personalization</strong>: which subgroup benefits most,\nfor targeting decisions.</p>\n</aside>\n<h3>4.1 Conditioning on a covariate — removing its imbalance</h3>\n<p><em>&quot;Hold a covariate fixed so it cannot explain the treated-control gap.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1)-Y(0)\\mid X{=}x]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p>Two equivalent uses of this same formula:</p>\n<ul>\n<li><strong>Within a slice:</strong> hold <math data-tex=\"X\"><mi>X</mi></math> constant so it cannot drive the gap — compute the effect <em>separately</em>\nwithin each value of <math data-tex=\"X\"><mi>X</mi></math>.</li>\n<li><strong>Balance the mix:</strong> reweight so both arms share the same <math data-tex=\"X\"><mi>X</mi></math> distribution: $\\sum_x\n\\hat\\tau(x)P(X{=}x)$ — average the per-slice effects back together, but weighted so the reweighted\npopulation looks the same on both arms.</li>\n</ul>\n<p><em>&quot;Either way <math data-tex=\"X\"><mi>X</mi></math> stops being a competing explanation. Per-slice = effect <strong>at</strong> <math data-tex=\"x\"><mi>x</mi></math> (heterogeneity);\none number assumes a <strong>constant</strong> effect.&quot;</em></p>\n<p>🧪 <strong>Worked example — splitting by marital status</strong> (within-slice view): ATE overall = <strong>$1,794</strong>.\nWithin &quot;Married&quot;: <strong>CATE = $3,709</strong>. Within &quot;Not married&quot;: <strong>CATE = $1,373</strong>.</p>\n<p>🧪 <strong>Worked example — splitting by age</strong> (balance-the-mix view): reweighting the control arm to\nmatch the treated arm's age distribution gives <strong>balanced estimate $1,802</strong> — very close to the\n$1,794 truth, with the underlying subgroup CATEs being <strong>$3,101 (age ≥ 25)</strong> and <strong>$370 (age &lt;\n25)</strong>.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight.</strong> The overall ATE ($1,794) is not a description of &quot;the effect everyone gets&quot; —\nit's an <em>average</em> over subgroups whose true effects can differ substantially ($3,709 vs. $1,373;\n$3,101 vs. $370). This heterogeneity is exactly what CATE is designed to surface, and it's also\nthe reason &quot;balance the mix&quot; reweighting recovers something very close to the true ATE: it forces\nthe comparison to be apples-to-apples within each subgroup before combining.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s7\" data-title=\"Selection Bias and Its Two Families\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Selection Bias and Its Two Families</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The treated and untreated differ for reasons other than the treatment, so the raw comparison is\ncontaminated.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Selection bias</strong> — groups differ <em>before</em> treatment, contaminating the raw gap.</p>\n</blockquote>\n<p>Two distinct sources, both producing selection bias:</p>\n<ul>\n<li><strong>(a) Groups unlike to begin with</strong> — the treated and control populations genuinely differ on\nrelevant characteristics before any treatment happens (e.g., a survey-drawn comparison group vs. an\nRCT control group).</li>\n<li><strong>(b) Analyst <em>creates</em> bias via a wrong control variable</strong> — adjusting for the wrong kind of\nvariable (covered fully in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6.1\" role=\"link\" tabindex=\"0\">§6.1</a>'s mediator/collider discussion) manufactures bias that wasn't there\nto begin with.</li>\n</ul>\n<p>🧪 <strong>Worked example — how badly the groups differ, measured by SMD:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Covariate</th>\n<th>Trainees</th>\n<th>Survey controls</th>\n<th>|SMD|</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Earnings, '75 ($)</td>\n<td>$1,532</td>\n<td>$13,651</td>\n<td><strong>1.75</strong></td>\n</tr>\n<tr>\n<td>Earnings, '74 ($)</td>\n<td>$2,096</td>\n<td>$14,017</td>\n<td><strong>1.57</strong></td>\n</tr>\n<tr>\n<td>Share married</td>\n<td>19%</td>\n<td>71%</td>\n<td><strong>1.23</strong></td>\n</tr>\n<tr>\n<td>No high-school degree</td>\n<td>30%</td>\n<td>71%</td>\n<td><strong>0.90</strong></td>\n</tr>\n<tr>\n<td>Age (years)</td>\n<td>25.8</td>\n<td>33.2</td>\n<td><strong>0.80</strong></td>\n</tr>\n<tr>\n<td>Schooling (years)</td>\n<td>10.3</td>\n<td>12.0</td>\n<td><strong>0.68</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;SMD exceeds 1 on several rows&quot;</em> — far above the 0.1 rule-of-thumb threshold from Prerequisite 2,\nconfirming these groups are severely imbalanced before treatment even enters the picture. <em>&quot;Balance\nthe selected covariates: -$8,498 naive, none balanced → moves toward the truth +$1,794.&quot;</em></p>\n<h3>5.1 Decomposing the Naive Estimate</h3>\n<p><em>&quot;Balance the groups covariate by covariate and the estimate moves toward the truth.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\underbrace{\\mathbb{E}[Y\\mid T{=}1]-\\mathbb{E}[Y\\mid T{=}0]}_{\\text{naive}} = \\text{ATT} + \\underbrace{\\mathbb{E}[Y(0)\\mid T{=}1]-\\mathbb{E}[Y(0)\\mid T{=}0]}_{\\text{selection bias}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><munder><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>naive</mtext></munder></mrow><mo>=</mo><mtext>ATT</mtext><mo>+</mo><mrow><munder><munder><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>selection bias</mtext></munder></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> the naive gap you'd naturally compute splits, exactly, into two pieces\nadded together — the <strong>real causal effect on the treated</strong> (ATT), and a <strong>selection bias term</strong>\ncomparing what the <em>treated</em> group's untreated outcome <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> would have been to what the <em>control</em>\ngroup's actual untreated outcome <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is. The second term has nothing to do with the treatment's\neffect — it's purely the pre-existing gap between the two groups.</p>\n<ul>\n<li><strong>ATT:</strong> the real effect on the treated, <math data-tex=\"+\\$1{,}794\"><mrow><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,794</mn></mrow></math>.</li>\n<li><strong>Selection bias:</strong> the baseline gap before training — <strong>controls already out-earned trainees.</strong></li>\n<li><strong>Balance a covariate, remove its share; close the gap, only the effect remains.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example — balancing covariates one at a time, watching the estimate move:</strong> <em>&quot;Family\n(a). Could adding more controls always help, or could a wrong one open a new gap?&quot;</em> — with all 8\ncovariates balanced, the estimate after balancing lands essentially at the true <strong>$1,794</strong>.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this decomposition is the algebraic proof of <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>'s puzzle.</strong> The naive $-8,498\ncomparison isn't &quot;wrong&quot; in some vague sense — it is <em>literally</em> $$1{,}794 + (\\text{a large\nnegative selection-bias term})$. Balancing covariates (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> onward gives the concrete recipes)\nworks by driving that second term toward zero, leaving only the first term — the actual causal\neffect — behind.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s8\" data-title=\"Good and Bad Controls\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Good and Bad Controls</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Adding a covariate can create bias that was not there before.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Opposite mistakes:</strong> confounding <strong>omits</strong> a cause; bad controls <strong>include</strong> the wrong variable.</p>\n</blockquote>\n<p>Using the running DAG <math data-tex=\"T\\to M\\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math> (mediator), <math data-tex=\"T\\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>Y</mi></mrow></math> (direct causal effect), <math data-tex=\"T\\to C\\leftarrow Y\"><mrow><mi>T</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>\n(collider):</p>\n<ul>\n<li><strong>Mediator</strong> <math data-tex=\"T\\to M\\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>: on the causal path. <strong>Controlling absorbs part of the effect.</strong></li>\n<li><strong>Collider</strong> <math data-tex=\"T\\to C\\leftarrow Y\"><mrow><mi>T</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>: conditioning <strong>opens a spurious path</strong> — the exact collider-bias\nmechanism from Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>.</li>\n<li><strong>Even a clean trial breaks if you condition on a post-treatment variable.</strong></li>\n<li>A pure <strong>predictor of <math data-tex=\"T\"><mi>T</mi></math> only</strong> (unrelated to <math data-tex=\"Y\"><mi>Y</mi></math>): unbiased, but <strong>inflates variance</strong> — it costs\nyou statistical precision without introducing bias, a different and milder problem than the other\ntwo.</li>\n</ul>\n<p>🧪 <strong>Worked example, with the actual estimates:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Control choice</th>\n<th>Result on this dataset</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>No bad control (correctly adjust for confounders only)</td>\n<td><strong>estimate on truth $1,794</strong> — recovers the experimental truth</td>\n</tr>\n<tr>\n<td>Control for <math data-tex=\"M\"><mi>M</mi></math> (the mediator)</td>\n<td><strong>biased estimate -$110</strong></td>\n</tr>\n<tr>\n<td>Control for <math data-tex=\"C\"><mi>C</mi></math> (the collider)</td>\n<td><strong>biased estimate -$806</strong> — <em>&quot;collider opens a spurious path, fabricating a shift&quot;</em></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most expensive mistake this section warns against.</strong> <em>&quot;Adjust for confounders and\npredictors of <math data-tex=\"Y\"><mi>Y</mi></math>; never mediators, colliders, or post-treatment variables.&quot;</em> Both wrong-variable\nchoices swing the dataset's estimate substantially away from the $1,794 truth (to -$110 and -$806\nrespectively) — and critically, <strong>there is no purely statistical signal in the data that flags this\nas a mistake.</strong> Both bad-control estimates look like ordinary numbers; only knowledge of the causal\ngraph (is this variable a mediator? a collider? a confounder?) tells you which controls are safe.\nThis is why Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s chain/fork/collider classification is a prerequisite for this entire\nlecture, not optional background.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s9\" data-title=\"Unconfoundedness\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">Unconfoundedness</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">10 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Conditional on the recorded covariates, assignment is as good as random.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A trial <strong>buys</strong> comparability. Observational work has to <strong>assume</strong> it.&quot;</em></p>\n</blockquote>\n<blockquote class=\"aside-quote\">\n<p><strong>Unconfoundedness</strong> — given <math data-tex=\"X\"><mi>X</mi></math>, treatment carries no extra information on outcomes.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\{Y(0),Y(1)\\} \\perp T \\mid X\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math></div>\n<ul>\n<li><strong>Untestable:</strong> concerns the never-observed <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> of the treated.</li>\n<li>An <strong>unrecorded cause <math data-tex=\"U\"><mi>U</mi></math></strong> drives both <math data-tex=\"T\"><mi>T</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>: an open <strong>back-door path</strong>.</li>\n<li><strong>Stronger <math data-tex=\"U\"><mi>U</mi></math> drifts the estimate further from truth. Data cannot say how much.</strong></li>\n</ul>\n<p>🧪 <strong>Worked demonstration:</strong> with hidden-cause strength set to &quot;none,&quot; the estimate sits exactly at\nthe truth: <strong>estimate $1,794</strong> matching <strong>truth +$1,794</strong>. As the strength of a simulated hidden\nconfounder <math data-tex=\"U\"><mi>U</mi></math> increases, the estimate drifts progressively away from $1,794 — and nothing in the\nobserved data itself signals that this drift is happening.</p>\n<figure class=\"iv\" id=\"iv-causal-inference-22-0\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;Hidden-confounder strength vs. estimate drift&quot;,&quot;concept&quot;:&quot;Unconfoundedness is untestable — the data can look exactly the same whether or not a hidden confounder exists&quot;,&quot;control&quot;:&quot;\\&quot;Strength of hidden cause U\\&quot; slider, from \\&quot;none\\&quot; to progressively stronger&quot;,&quot;observe&quot;:&quot;The estimate (starts at $1,794, matching the known truth) drifts away from the truth as the slider is dragged upward — with no signal anywhere in the observed data that this drift is happening&quot;,&quot;insight&quot;:&quot;A dataset with a strong hidden confounder and a dataset with none can produce identical-looking observed data — the gap between \\&quot;estimate\\&quot; and \\&quot;truth\\&quot; only becomes visible here because the slide is simulating a ground truth you would never actually have access to. In real observational work you cannot run this slider — you can only ever assume you're near \\&quot;none.\\&quot;&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows a DAG (T → Y, with an unobserved node U feeding a dashed back-door path into both T and Y) next to a \\&quot;Strength of hidden cause U\\&quot; slider and a live estimate readout. At \\&quot;none,\\&quot; estimate ($1,794) exactly matches truth (+$1,794); the reader can reason through why increasing U's strength would open the back-door path further and drift the estimate, exactly as this section's prose describes.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">Hidden-confounder strength vs. estimate drift</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Unconfoundedness is untestable — the data can look exactly the same whether or not a hidden confounder exists</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>\"Strength of hidden cause U\" slider, from \"none\" to progressively stronger</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The estimate (starts at $1,794, matching the known truth) drifts away from the truth as the slider is dragged upward — with no signal anywhere in the observed data that this drift is happening</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>A dataset with a strong hidden confounder and a dataset with none can produce identical-looking observed data — the gap between \"estimate\" and \"truth\" only becomes visible here because the slide is simulating a ground truth you would never actually have access to. In real observational work you cannot run this slider — you can only ever assume you're near \"none.\"</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows a DAG (T → Y, with an unobserved node U feeding a dashed back-door path into both T and Y) next to a \"Strength of hidden cause U\" slider and a live estimate readout. At \"none,\" estimate (<math><mrow><mn>1,794</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>e</mi><mi>x</mi><mi>a</mi><mi>c</mi><mi>t</mi><mi>l</mi><mi>y</mi><mi>m</mi><mi>a</mi><mi>t</mi><mi>c</mi><mi>h</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>r</mi><mi>u</mi><mi>t</mi><mi>h</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">+</mo></mrow></math>1,794); the reader can reason through why increasing U's strength would open the back-door path further and drift the estimate, exactly as this section's prose describes.</p>\n    </div>\n  </figure>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most important honesty point in the entire lecture.</strong> Unlike positivity (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>) or\nSUTVA (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>), unconfoundedness is fundamentally <strong>untestable</strong> from the data you have — it concerns\n<math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for the treated group, which by the fundamental problem of causal inference (Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§3.2\" role=\"link\" tabindex=\"0\">§3.2</a>)\nis never observed for anyone in that group. Every adjustment method in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a> <em>assumes</em>\nunconfoundedness; none of them can verify it. This is the sense in which observational causal\ninference always rests on an assumption a randomized trial doesn't need.</p>\n</aside>\n<h3>7.1 Positivity and Common Support</h3>\n<p><em>&quot;Where the two age distributions overlap, every trainee has a comparable control.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Positivity</strong> — both arms possible at every covariate value.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"0 &lt; P(T{=}1\\mid X{=}x) &lt; 1 \\quad\\text{for all } x\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mn>0</mn><mo>&lt;</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&lt;</mo><mn>1</mn><mspace width=\"1em\"></mspace><mtext>for all </mtext><mi>x</mi></mrow></math></div>\n<ul>\n<li>Need a <strong>treated and untreated</strong> example of each kind of person.</li>\n<li>Where ages <strong>overlap</strong>, each trainee has a comparable control.</li>\n<li>An age with <strong>only one arm</strong> is <strong>extrapolated</strong>: no counterpart exists.</li>\n<li><strong>Outside common support, data alone cannot settle the question.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example:</strong> at the real, <strong>unshifted baseline</strong> (&quot;shift control ages older by: 0 yrs&quot;),\nthe chart reads <em>&quot;trainees with a comparable control: <strong>185 of 185</strong>&quot;</em> — full positivity holds for\nthis covariate in the actual dataset; every trainee's age has at least one comparable control.\nThe slide then runs an interactive simulation: dragging the &quot;shift control ages older by&quot; slider to\n<strong>+9 years</strong> (an artificial, hypothetical shift of the control population's age distribution, not a\nproperty of the real data) shrinks the count to <em>&quot;trainees with a comparable control: <strong>118 of\n185</strong>&quot;</em> — 67 of 185 trainees (36%) would fall outside the age range where any comparable control\nexists, <strong>if</strong> the control population's ages were shifted this way. Shifting the slider progressively\nolder shrinks the green &quot;common support&quot; region and grows the red &quot;control-only ages&quot; /\n&quot;trainee-only ages&quot; regions directly on the chart — a visual, quantified demonstration that\npositivity is a <em>property of the specific data at hand</em> (which can hold at baseline and still be\nfragile to plausible shifts), not a theoretical abstraction.</p>\n<figure class=\"iv\" id=\"iv-causal-inference-22-1\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;Shift control ages older — positivity under stress&quot;,&quot;concept&quot;:&quot;Positivity (common support) can hold perfectly at baseline and still be fragile to a plausible population shift&quot;,&quot;control&quot;:&quot;\\&quot;Shift control ages older by\\&quot; slider, from 0 to +9 years&quot;,&quot;observe&quot;:&quot;The age-distribution histogram's shaded \\&quot;common support\\&quot; (green) region shrinks while the \\&quot;control-only\\&quot; / \\&quot;trainee-only\\&quot; (red) regions grow; the live count reads \\&quot;185 of 185\\&quot; at 0 years and drops to \\&quot;118 of 185\\&quot; at +9 years&quot;,&quot;insight&quot;:&quot;Positivity is not a yes/no property of a method — it's a property of the specific data at hand, and it can be excellent today (185/185 real trainees have a comparable control) while being one plausible demographic shift away from a serious violation (118/185, a 36% loss of common support). A reader who only sees the 185/185 baseline number would miss how fragile that overlap actually is.&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows an overlapping-histogram chart of trainee ages (orange) vs. control ages (teal), a live \\&quot;trainees with a comparable control: N of 185\\&quot; counter, and the \\&quot;shift control ages older by\\&quot; slider. At 0 years (the real, unshifted data) the counter reads 185 of 185 — full positivity holds. Dragging to +9 years (a simulated, hypothetical shift, not the real data) drops the counter to 118 of 185, exactly as described in the worked example above.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">Shift control ages older — positivity under stress</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Positivity (common support) can hold perfectly at baseline and still be fragile to a plausible population shift</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>\"Shift control ages older by\" slider, from 0 to +9 years</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The age-distribution histogram's shaded \"common support\" (green) region shrinks while the \"control-only\" / \"trainee-only\" (red) regions grow; the live count reads \"185 of 185\" at 0 years and drops to \"118 of 185\" at +9 years</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Positivity is not a yes/no property of a method — it's a property of the specific data at hand, and it can be excellent today (185/185 real trainees have a comparable control) while being one plausible demographic shift away from a serious violation (118/185, a 36% loss of common support). A reader who only sees the 185/185 baseline number would miss how fragile that overlap actually is.</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows an overlapping-histogram chart of trainee ages (orange) vs. control ages (teal), a live \"trainees with a comparable control: N of 185\" counter, and the \"shift control ages older by\" slider. At 0 years (the real, unshifted data) the counter reads 185 of 185 — full positivity holds. Dragging to +9 years (a simulated, hypothetical shift, not the real data) drops the counter to 118 of 185, exactly as described in the worked example above.</p>\n    </div>\n  </figure>\n<h3>7.2 SUTVA</h3>\n<p><em>&quot;A single well-defined treatment, with no interference between units.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>SUTVA (Stable Unit Treatment Value Assumption)</strong> — no interference across units; one well-defined\ntreatment version.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"Y_i = Y_i(T_i)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<ul>\n<li>If treatment <strong>leaks</strong> to a control, the gap <strong>understates</strong> the true effect.</li>\n<li>Randomisation fixes <em>assignment</em>, not effects transmitted <em>between</em> units.</li>\n<li><strong>Marketplace example:</strong> one seller's coupon empties a rival's stock.</li>\n</ul>\n<p>🧪 <strong>Worked example — interference between units, made concrete:</strong> if a treated unit's action\nlifts an &quot;untreated neighbour's&quot; outcome by 45% via spillover (interference), the <strong>measured $987\nunderstates the true $1,794</strong> — the interference doesn't just add noise, it systematically biases the\nmeasured effect <em>toward zero</em>, because part of the treatment's true impact leaked into the &quot;control&quot;\ngroup's outcome, shrinking the observed treated-vs-control gap.</p>\n<figure class=\"iv\" id=\"iv-causal-inference-22-2\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Spillover toggle — SUTVA violated&quot;,&quot;concept&quot;:&quot;SUTVA is a distinct failure mode from unconfoundedness/positivity — it's about one unit's outcome leaking into another unit's measured outcome, not about assignment or overlap&quot;,&quot;control&quot;:&quot;\\&quot;Interference between units\\&quot; toggle — \\&quot;No spillover\\&quot; vs. \\&quot;Spillover leaks\\&quot;&quot;,&quot;observe&quot;:&quot;With \\&quot;No spillover\\&quot; selected, the diagram shows the control unit's outcome as unaffected and the measured effect exactly equals the true effect ($1,794). Switching to \\&quot;Spillover leaks\\&quot; adds a dashed interference arrow from the treated unit to its \\&quot;untreated\\&quot; neighbour, the neighbour's outcome is lifted 45%, and the measured effect drops to $987 — a $807 understatement of the true $1,794&quot;,&quot;insight&quot;:&quot;SUTVA violations don't just add noise like a confounder would — they systematically bias the estimate toward zero (make a real effect look smaller than it is), because part of the treatment's true impact has leaked into the group you're using as your counterfactual baseline. Randomizing who gets treated fixes *assignment* bias; it does nothing to stop one unit's treatment from spilling onto another unit's outcome.&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows two treated/control unit icons connected by an \\&quot;interference between units\\&quot; toggle. \\&quot;No spillover\\&quot; (baseline): the control's outcome is marked \\&quot;unaffected,\\&quot; measured effect = true effect $1,794. \\&quot;Spillover leaks\\&quot; (toggled): a dashed arrow appears from treated to control labeled \\&quot;interference,\\&quot; the control's outcome is marked \\&quot;lifted 45%,\\&quot; and the readout changes to \\&quot;measured $987 understates true $1,794\\&quot; — exactly the numbers in the worked example above.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Spillover toggle — SUTVA violated</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>SUTVA is a distinct failure mode from unconfoundedness/positivity — it's about one unit's outcome leaking into another unit's measured outcome, not about assignment or overlap</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>\"Interference between units\" toggle — \"No spillover\" vs. \"Spillover leaks\"</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>With \"No spillover\" selected, the diagram shows the control unit's outcome as unaffected and the measured effect exactly equals the true effect (<math><mrow><mn>1,794</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>.</mi><mi>S</mi><mi>w</mi><mi>i</mi><mi>t</mi><mi>c</mi><mi>h</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>t</mi><mi>o</mi><mi>&quot;</mi><mi>S</mi><mi>p</mi><mi>i</mi><mi>l</mi><mi>l</mi><mi>o</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>l</mi><mi>e</mi><mi>a</mi><mi>k</mi><mi>s</mi><mi>&quot;</mi><mi>a</mi><mi>d</mi><mi>d</mi><mi>s</mi><mi>a</mi><mi>d</mi><mi>a</mi><mi>s</mi><mi>h</mi><mi>e</mi><mi>d</mi><mi>i</mi><mi>n</mi><mi>t</mi><mi>e</mi><mi>r</mi><mi>f</mi><mi>e</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>c</mi><mi>e</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi><mi>f</mi><mi>r</mi><mi>o</mi><mi>m</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>u</mi><mi>n</mi><mi>i</mi><mi>t</mi><mi>t</mi><mi>o</mi><mi>i</mi><mi>t</mi><mi>s</mi><mi>&quot;</mi><mi>u</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>&quot;</mi><mi>n</mi><mi>e</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>b</mi><mi>o</mi><mi>u</mi><mi>r</mi><mo separator=\"true\">,</mo><mi>t</mi><mi>h</mi><mi>e</mi><mi>n</mi><mi>e</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>b</mi><mi>o</mi><mi>u</mi><msup><mi>r</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>s</mi><mi>o</mi><mi>u</mi><mi>t</mi><mi>c</mi><mi>o</mi><mi>m</mi><mi>e</mi><mi>i</mi><mi>s</mi><mi>l</mi><mi>i</mi><mi>f</mi><mi>t</mi><mi>e</mi><mi>d</mi><mn>45</mn></mrow></math>987 — a <math><mrow><mn>807</mn><mi>u</mi><mi>n</mi><mi>d</mi><mi>e</mi><mi>r</mi><mi>s</mi><mi>t</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>m</mi><mi>e</mi><mi>n</mi><mi>t</mi><mi>o</mi><mi>f</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>t</mi><mi>r</mi><mi>u</mi><mi>e</mi></mrow></math>1,794</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>SUTVA violations don't just add noise like a confounder would — they systematically bias the estimate toward zero (make a real effect look smaller than it is), because part of the treatment's true impact has leaked into the group you're using as your counterfactual baseline. Randomizing who gets treated fixes *assignment* bias; it does nothing to stop one unit's treatment from spilling onto another unit's outcome.</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows two treated/control unit icons connected by an \"interference between units\" toggle. \"No spillover\" (baseline): the control's outcome is marked \"unaffected,\" measured effect = true effect <math><mrow><mn>1,794.</mn><mi>&quot;</mi><mi>S</mi><mi>p</mi><mi>i</mi><mi>l</mi><mi>l</mi><mi>o</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>l</mi><mi>e</mi><mi>a</mi><mi>k</mi><mi>s</mi><mi>&quot;</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mi>o</mi><mi>g</mi><mi>g</mi><mi>l</mi><mi>e</mi><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi>a</mi><mi>d</mi><mi>a</mi><mi>s</mi><mi>h</mi><mi>e</mi><mi>d</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi><mi>a</mi><mi>p</mi><mi>p</mi><mi>e</mi><mi>a</mi><mi>r</mi><mi>s</mi><mi>f</mi><mi>r</mi><mi>o</mi><mi>m</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>t</mi><mi>o</mi><mi>c</mi><mi>o</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>l</mi><mi>l</mi><mi>a</mi><mi>b</mi><mi>e</mi><mi>l</mi><mi>e</mi><mi>d</mi><mi>&quot;</mi><mi>i</mi><mi>n</mi><mi>t</mi><mi>e</mi><mi>r</mi><mi>f</mi><mi>e</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>c</mi><mi>e</mi><mo separator=\"true\">,</mo><mi>&quot;</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>c</mi><mi>o</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><msup><mi>l</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-med-pad\">′</mo></msup><mi>s</mi><mi>o</mi><mi>u</mi><mi>t</mi><mi>c</mi><mi>o</mi><mi>m</mi><mi>e</mi><mi>i</mi><mi>s</mi><mi>m</mi><mi>a</mi><mi>r</mi><mi>k</mi><mi>e</mi><mi>d</mi><mi>&quot;</mi><mi>l</mi><mi>i</mi><mi>f</mi><mi>t</mi><mi>e</mi><mi>d</mi><mn>45</mn></mrow></math>987 understates true $1,794\" — exactly the numbers in the worked example above.</p>\n    </div>\n  </figure>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is a genuinely different failure mode from unconfoundedness and\npositivity.</strong> Unconfoundedness is about whether treatment assignment is related to outcomes;\npositivity is about whether both arms exist at every covariate value; SUTVA is about whether one\nunit's <em>outcome</em> can be affected by <em>another</em> unit's <em>treatment status</em> — a leakage/spillover\nproblem, not a confounding problem. All three must hold simultaneously for the adjustment methods\nin <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> onward to correctly recover a causal effect.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s10\" data-title=\"Stratification (Subclassification)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Stratification (Subclassification)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Partition on the covariates, then average the within-bucket gaps.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Stratification</strong> — split into <math data-tex=\"K\"><mi>K</mi></math> buckets on covariate <math data-tex=\"X\"><mi>X</mi></math>. Here: <strong>age, four bins.</strong></p>\n</blockquote>\n<ul>\n<li><strong>Partition, do not pair:</strong> every unit drops into one bin, treated and control pooled.</li>\n<li>Within a bin, <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is roughly constant, so <math data-tex=\"\\bar Y_{1,k} - \\bar Y_{0,k}\"><mrow><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub></mrow></math> compares <strong>like with\nlike</strong>.</li>\n<li><strong>Combine:</strong> weight each bin gap by treated share <math data-tex=\"n_{1,k}/n_1\"><mrow><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mi>/</mi><msub><mi>n</mi><mn>1</mn></msub></mrow></math>:</li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATT}} = \\sum_{k=1}^{K} \\frac{n_{1,k}}{n_1}\\big(\\bar Y_{1,k}-\\bar Y_{0,k}\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mi>K</mi></munderover></mrow><mfrac><msub><mi>n</mi><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>1</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo>−</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">‾</mo></mover><mrow><mn>0</mn><mo separator=\"true\">,</mo><mi>k</mi></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p><em>weighted average of within-bin treated-minus-control gaps</em></p>\n<p>🧪 <strong>Worked example — age alone barely helps:</strong> stratifying on age into 4 bins (16–24, 24–32,\n32–40, 40–56) gives a <strong>stratified estimate (age-adjusted) of −$8,279</strong> — barely different from the\nnaive −$8,498, and still the wrong sign. <em>&quot;Age alone barely moves the naive number: prior earnings\ncarries the bias.&quot;</em></p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The lesson this specific result teaches.</strong> Stratifying on <em>any</em> covariate does not guarantee\nprogress — it only removes the imbalance in <em>that specific</em> covariate as an explanation for the gap.\nSince age wasn't the dominant source of imbalance here (recall <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s SMD table: prior earnings had\nSMD 1.57–1.75, far larger than age's 0.80), stratifying on age alone leaves almost all the selection\nbias intact. This is a concrete, numeric warning against assuming &quot;I adjusted for <em>something</em>&quot; is\nthe same as &quot;I adjusted for <em>enough</em>.&quot;</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s11\" data-title=\"Matching\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Matching</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Impute each trainee's missing control outcome from its nearest neighbour.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Matching</strong> — take the nearest control <math data-tex=\"j(i)\"><mrow><mi>j</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>i</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>'s outcome as <math data-tex=\"\\widehat{Y_i(0)}\"><mover><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mo stretchy=\"true\" class=\"tml-hat-3\" style=\"math-depth:0;\">ˆ</mo></mover></math>.</p>\n</blockquote>\n<ul>\n<li><strong>One-to-one:</strong> each trainee paired to a single control.</li>\n<li><strong>Distance on covariates:</strong> age and prior earnings, <math data-tex=\"\\|X_i-X_j\\|\"><mrow><mi>‖</mi><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><msub><mi>X</mi><mi>j</mi></msub><mi>‖</mi></mrow></math>.</li>\n<li><strong>Not scale-invariant:</strong> standardise, or earnings drowns age (since earnings is measured in\nthousands of dollars and age in single-digit-to-double-digit years, an unstandardized distance\nmetric would let earnings differences completely dominate the match, effectively ignoring age).</li>\n<li><strong>Average imputed gaps:</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATT}} = \\frac{1}{n_1}\\sum_{i:T_i=1}\\big(Y_i - Y_{j(i)}\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mfrac><mn>1</mn><msub><mi>n</mi><mn>1</mn></msub></mfrac><mrow><munder><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mi>Y</mi><mrow><mi>j</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>i</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p>🧪 <strong>Worked example, two covariates (age + prior earnings):</strong> matching on these two covariates alone\ngives <strong>−$3,550</strong>, <em>&quot;short of truth. Omitted causes remain.&quot;</em> — matching on only two of the eight\nimbalanced covariates from <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s table still leaves most of the selection bias uncorrected.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This −$3,550 figure is a small, 6-trainee toy walkthrough illustrating the <em>mechanism</em>, not\nthe real estimator's output on the full sample.</strong> The slide this comes from is explicitly titled\n&quot;All 6 trainees paired to their nearest twin&quot; — a deliberately tiny demonstration of how\nnearest-neighbor pairing works, step by step. The <em>actual</em> full-185-trainee nearest-neighbor\nmatching result — the one used everywhere else in this file, including <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>'s scoreboard — is\n<strong>$2,037</strong> (gap $243 from the $1,794 truth), a dramatically better result. Don't read −$3,550 as\n&quot;matching on age + prior earnings gets you within $5,344 of the truth on this dataset&quot; — it\ndoesn't; it's a mechanism illustration on 6 units, not the real method's performance.</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Caution, stated directly:</strong> <em>&quot;nearest-neighbour matching is biased in finite samples.&quot;</em> Even\nwith the <em>correct</em> set of covariates, matching each treated unit to its single nearest (but not\nidentical) control introduces a small residual bias, because &quot;nearest&quot; is rarely &quot;identical&quot; — this\nis a known, structural limitation of the method, not a bug specific to this dataset.</p>\n</aside>\n<h3>9.1 What Stratification and Matching Share</h3>\n<p><em>&quot;Both need identifying conditions and the same recipe offers.&quot;</em></p>\n<ul>\n<li>Both rest on the same <math data-tex=\"\\{Y(0),Y(1)\\}\\perp T\\mid X\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math> requirement (unconfoundedness) and overlap\n(positivity).</li>\n<li><strong>Stratification: bucket average.</strong> Matching: nearest twin.</li>\n<li>Same conditions, <strong>different weighting</strong>: stratification averages within a <em>coarse</em> bin (many\nunits pool together); matching pairs one-to-one (finer, but only as fine as the nearest available\nneighbour allows).</li>\n<li><strong>Different variance: strict target the ATE, the ATT</strong> — the specific choice of which estimand each\nis naturally suited to compute can differ. Both attach <math data-tex=\"\\hat Y(0)\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from neighbours. <strong>Could we model\nit directly?</strong> — this question is the explicit pivot into <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>'s regression adjustment.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-22-s12\" data-title=\"The Curse of Dimensionality\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">The Curse of Dimensionality</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Cells grow exponentially; the sample does not.&quot;</em></p>\n<ul>\n<li><strong>Exact matching:</strong> each trainee in the <strong>same cell</strong> as a control.</li>\n<li><strong>Coarsen <math data-tex=\"p\"><mi>p</mi></math> traits into 3 levels; cells grow as <math data-tex=\"3^p\"><msup><mn>3</mn><mi>p</mi></msup></math>:</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\#\\text{cells} = 3^p \\implies 3^8 = 6{,}561\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>#</mi><mtext>cells</mtext><mo>=</mo><msup><mn>3</mn><mi>p</mi></msup><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"0.2778em\"></mspace><msup><mn>3</mn><mn>8</mn></msup><mo>=</mo><mn>6,561</mn></mrow></math></div>\n<ul>\n<li>Cells grow <strong>exponentially</strong>; sample stays at <strong>185 trainees.</strong></li>\n<li>At <math data-tex=\"p=8\"><mrow><mi>p</mi><mo>=</mo><mn>8</mn></mrow></math>: only <strong>42 cells hold both groups (0.6%).</strong></li>\n<li><strong>Curse of dimensionality:</strong> each trait empties cells further.</li>\n</ul>\n<p>🧪 <strong>Worked example, the full progression</strong> (traits matched on, <math data-tex=\"p\"><mi>p</mi></math>, from 1 to 8):</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><math data-tex=\"p\"><mi>p</mi></math> (traits)</th>\n<th>Cells created (<math data-tex=\"3^p\"><msup><mn>3</mn><mi>p</mi></msup></math>)</th>\n<th>Cells holding both groups</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>3</td>\n<td>~2</td>\n</tr>\n<tr>\n<td>4</td>\n<td>81</td>\n<td>~12</td>\n</tr>\n<tr>\n<td>8</td>\n<td><strong>6,561</strong></td>\n<td><strong>42</strong> (0.6%)</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is the exact structural argument behind <a class=\"xref\" data-xref-lec=\"dimensionality-reduction-01\" role=\"link\" tabindex=\"0\">Dimensionality Reduction Part\n1</a>'s &quot;curse of dimensionality&quot; for\nkNN (corrected from a previous &quot;Lecture 20&quot; mislabel — that lecture is Sequential Learning Part 3;\nthe curse-of-dimensionality/kNN argument is actually Lecture 07, Dimensionality Reduction Part 1),\napplied here to causal inference.</strong> Exact matching on even a modest number\nof coarsened traits creates a combinatorially exploding number of possible cells, while the actual\nsample size stays fixed. Once cells vastly outnumber data points, almost every cell is either empty\nor contains only one arm — leaving no like-with-like comparison possible for most units. This is\nprecisely the motivation for reducing <math data-tex=\"X\"><mi>X</mi></math> to a single scalar summary — the propensity score (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>) —\nrather than matching on raw, high-dimensional covariates directly.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s13\" data-title=\"Propensity Score\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">Propensity Score</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;One scalar summary of the covariates that the estimate can hinge on.&quot;</em></p>\n<ul>\n<li><strong>Exact matches infeasible in high dimensions</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s direct motivation).</li>\n</ul>\n<blockquote class=\"aside-quote\">\n<p><strong>Propensity score</strong> — probability of treatment given covariates.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"e(x) = P(T{=}1\\mid X{=}x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<ul>\n<li><strong>Reduces <math data-tex=\"X\"><mi>X</mi></math> to a single scalar</strong> in <math data-tex=\"(0,1)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math> via logistic regression.</li>\n<li><strong>Equal <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> makes units comparable, even if raw traits differ.</strong></li>\n<li><strong>Goal is balance, not prediction:</strong> include every <strong>confounder</strong>, not the best predictor of <math data-tex=\"T\"><mi>T</mi></math>.</li>\n<li><strong>Strong <math data-tex=\"T\"><mi>T</mi></math>-predictor pushes scores to extremes, inflating weights.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example — confounders-only vs. adding a strong T-predictor:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Model spec</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Confounders only</td>\n<td>Heaviest control holds 47.6% of the weighted mean; <strong>ATT = $1,057</strong></td>\n</tr>\n<tr>\n<td>+ a strong <math data-tex=\"T\"><mi>T</mi></math>-predictor</td>\n<td>Heaviest control holds 71.9% of the weighted mean (extreme concentration); <strong>ATT = $733</strong></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most counterintuitive design rule in this section, worth internalizing.</strong> It is\ntempting to build the propensity model to predict treatment as <em>accurately as possible</em> — but this\nis exactly the wrong goal. Including a variable that predicts <math data-tex=\"T\"><mi>T</mi></math> very strongly (but isn't a genuine\nconfounder of the <math data-tex=\"Y\"><mi>Y</mi></math> relationship) pushes propensity scores toward 0 or 1 for many units, which\n(as <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a> shows) inflates the weights those units carry to dangerous extremes. <strong>The goal is balance\nacross covariates that matter for <math data-tex=\"Y\"><mi>Y</mi></math>, not predictive accuracy for <math data-tex=\"T\"><mi>T</mi></math>.</strong></p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s14\" data-title=\"Inverse-Probability Weighting (IPW)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">Inverse-Probability Weighting (IPW)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Each unit's score <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> determines its weight and its influence on the estimate.&quot;</em></p>\n<ul>\n<li><strong>Weight each unit by the inverse of its assignment probability.</strong></li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\widehat{\\text{ATT}} = \\underbrace{\\frac{\\sum_i T_iY_i}{\\sum_i T_i}}_{\\hat{\\mathbb{E}}[Y(1)\\mid T=1]} - \\underbrace{\\frac{\\sum_i (1-T_i)\\frac{e(X_i)}{1-e(X_i)}Y_i}{\\sum_i (1-T_i)\\frac{e(X_i)}{1-e(X_i)}}}_{\\hat{\\mathbb{E}}[Y(0)\\mid T=1]}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mtext>ATT</mtext><mo stretchy=\"true\" class=\"tml-hat-4\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mrow><munder><munder><mfrac><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msub><mi>T</mi><mi>i</mi></msub><msub><mi>Y</mi><mi>i</mi></msub></mrow><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><msub><mi>T</mi><mi>i</mi></msub></mrow></mfrac><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mrow><mover><mi>𝔼</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></munder></mrow><mo>−</mo><mrow><munder><munder><mfrac><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mfrac><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac><msub><mi>Y</mi><mi>i</mi></msub></mrow><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mfrac><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mn>1</mn><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac></mrow></mfrac><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mrow><mover><mi>𝔼</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></munder></mrow></mrow></math></div>\n<p><em>Horvitz-Thompson ATT: trainee mean minus odds-weighted control mean.</em></p>\n<p><strong>Words before symbols:</strong> the treated group's own mean earnings needs no reweighting (it's just the\nplain average of treated outcomes). The control group's mean is reweighted so that controls who\n<em>looked</em> more like a typical trainee (i.e., had higher <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, a higher probability of being treated\ngiven their covariates) count for more — pulling the weighted control mean toward what the treated\ngroup's untreated outcome would plausibly have looked like.</p>\n<ul>\n<li><strong>Odds weight <math data-tex=\"e/(1-e)\"><mrow><mi>e</mi><mi>/</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> spikes</strong> as a control looks treatment-like.</li>\n<li><strong>Low-overlap units carry enormous weight.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example, extreme concentration:</strong> <em>&quot;2 of 185 controls (1.1%) carry 66.3% of the control\nweight&quot;</em> — just two atypical control units, whose covariates happen to make them look unusually\ntreatment-like, dominate two-thirds of the entire weighted control estimate.</p>\n<h3>12.1 Extreme Weights and Trimming</h3>\n<p><em>&quot;Near-zero propensity scores let one unit dominate the estimate.&quot;</em></p>\n<ul>\n<li><math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> near 0 makes <math data-tex=\"1/e(x)\"><mrow><mn>1</mn><mi>/</mi><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> <strong>explode</strong>; ATT mirrors this for near-1 controls.</li>\n<li><strong>Untrimmed: one trainee carries 16.7% of the weighted estimate</strong> ($1,173 total).</li>\n<li><strong>Estimate depends on a single observation:</strong> high variance, unstable.</li>\n<li><strong>Trimming caps extreme weights, trading variance for bias with no rule for how much.</strong></li>\n<li><strong>Principled alternatives:</strong> <strong>Stabilised weights</strong> <math data-tex=\"P(T)/e(X)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>/</mi><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (same target, smaller variance);\n<strong>overlap weights</strong> <math data-tex=\"e(x)(1-e(x))\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><
