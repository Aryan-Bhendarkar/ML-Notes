 1.5; max-width: 200px; text-align: center;\"><span class=\"edgeLabel \"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g class=\"label\" data-id=\"L_BD_RCT_0\" transform=\"translate(0, 0)\"><foreignObject width=\"0\" height=\"0\"><div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"labelBkg\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"edgeLabel \"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g class=\"label\" data-id=\"L_FD_RCT_0\" transform=\"translate(0, 0)\"><foreignObject width=\"0\" height=\"0\"><div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"labelBkg\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"edgeLabel \"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-P-0\" data-look=\"classic\" transform=\"translate(413.51953125, 37.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-127.6796875\" y=\"-29.5\" width=\"255.359375\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-107.6796875, -19.5)\"><rect></rect><foreignObject width=\"215.359375\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>P(Y|X) ≠ P(Y|do(X))</b><br><small>the problem this whole lecture exists to solve</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-PO-2\" data-look=\"classic\" transform=\"translate(158, 492.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-39.25\" width=\"300\" height=\"78.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -29.25)\"><rect></rect><foreignObject width=\"260\" height=\"58.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>Potential Outcomes</b> (Rubin, 1974)<br><small>τ = Y(1) − Y(0) · fundamental problem: never jointly observed</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-SCM-4\" data-look=\"classic\" transform=\"translate(546.1875, 126.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-134.3046875\" y=\"-29.5\" width=\"268.609375\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-114.3046875, -19.5)\"><rect></rect><foreignObject width=\"228.609375\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>Structural Causal Models</b> (Pearl, DAGs)<br><small>do(X) = delete X's incoming edges</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-CI-6\" data-look=\"classic\" transform=\"translate(546.1875, 215.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-29.5\" width=\"300\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -19.5)\"><rect></rect><foreignObject width=\"260\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>Conditional independence</b> — chain / fork / collider · <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s atomic building block</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-DS-8\" data-look=\"classic\" transform=\"translate(546.1875, 304.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-29.5\" width=\"300\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -19.5)\"><rect></rect><foreignObject width=\"260\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>d-separation</b> — the complete, mechanical rule built from <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a></p></span></div></foreignObject></g></g><g class=\"node default k \" id=\"df8200c6d2858db85-flowchart-DC-10\" data-look=\"classic\" transform=\"translate(546.1875, 393.5)\"><rect class=\"basic label-container\" style=\"fill:#1E3025 !important;stroke:#4FA073 !important\" x=\"-150\" y=\"-29.5\" width=\"300\" height=\"59\"></rect><g class=\"label\" style=\"color:#EDE6D7 !important\" transform=\"translate(-130, -19.5)\"><rect></rect><foreignObject width=\"260\" height=\"39\"><div style=\"color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span style=\"color:#EDE6D7 !important\" class=\"nodeLabel \"><p><b>do-calculus's three rules</b> — reduce do(·) to observational quantities, when possible</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-BD-12\" data-look=\"classic\" transform=\"translate(423.3359375, 492.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-85.3359375\" y=\"-29.5\" width=\"170.671875\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-65.3359375, -19.5)\"><rect></rect><foreignObject width=\"130.671875\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>Backdoor adjustment</b><br><small>measured confounders</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-FD-14\" data-look=\"classic\" transform=\"translate(669.0390625, 492.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-130.3671875\" y=\"-29.5\" width=\"260.734375\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-110.3671875, -19.5)\"><rect></rect><foreignObject width=\"220.734375\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>Frontdoor adjustment</b><br><small>unmeasured confounders, measured mediator</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"df8200c6d2858db85-flowchart-RCT-16\" data-look=\"classic\" transform=\"translate(423.3359375, 610.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-49\" width=\"300\" height=\"98\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -39)\"><rect></rect><foreignObject width=\"260\" height=\"78\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>RCTs</b> — sidestep identification by randomising<br><small>but cost / ethics / generalizability push most real problems back to the machinery above</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"df8200c6d2858db85-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"df8200c6d2858db85-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"df8200c6d2858db85-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li><strong>Every technique here is answering the same single question</strong> — &quot;how do I compute $P(Y\\mid\n\\text{do}(X))$ when I can't literally perform the intervention?&quot; — from increasingly specific\nangles: potential outcomes names the target quantity and its fundamental unobservability; DAGs give\na language for <em>when</em> observational data is enough; do-calculus gives the mechanical procedure;\nbackdoor/frontdoor package the two most common special cases; RCTs are the one setting where the\nquestion never needs asking, because you <em>can</em> perform the intervention directly.</li>\n<li><strong>Confounding is the single villain, and it takes exactly three graphical shapes</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>): a fork\n(the classic confounder), and — much less intuitively — conditioning on a collider can\n<em>manufacture</em> the same kind of spurious association a fork creates naturally. Half of applied\ncausal inference is correctly identifying which shape you're looking at before you decide whether\nto control for a variable or leave it alone.</li>\n<li><strong>&quot;Identifiability&quot; is the load-bearing word of the entire lecture.</strong> A causal effect being\nwell-defined (as a quantity, via potential outcomes or the do-operator) is a completely separate\nquestion from whether it is <em>identifiable</em> — expressible in terms of quantities you can actually\nestimate from the data you have. Do-calculus, backdoor, and frontdoor are all, at bottom,\nidentification results; RCTs matter because they make identification trivial by construction.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-21-s13\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">14 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">In one sentence, why is P(Y|X) not the same quantity as P(Y|do(X))?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><math data-tex=\"P(Y\\mid X)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> conditions on units that <em>happened</em> to have a particular value of <math data-tex=\"X\"><mi>X</mi></math>, which can be\ncorrelated with other factors (confounders) that also affect <math data-tex=\"Y\"><mi>Y</mi></math>; <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> describes\nwhat happens if <math data-tex=\"X\"><mi>X</mi></math> is <em>forced</em> to that value independent of whatever normally determines it, cutting\noff any confounding influence — the two coincide only when <math data-tex=\"X\"><mi>X</mi></math> is not confounded with <math data-tex=\"Y\"><mi>Y</mi></math> (e.g.,\nunder randomization).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain how Simpson's paradox can make Hospital A look worse in aggregate while being better in every subgroup.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>If Hospital A treats a much higher proportion of severe (harder-to-treat, lower-recovery) cases than\nHospital B, its aggregate recovery rate is a weighted average pulled down more heavily by that harder\ncase mix — even if Hospital A outperforms Hospital B within <em>both</em> the mild and severe subgroups\nindividually. Case severity is a confounder affecting both which hospital treats a patient and the\nprobability of recovery, and the aggregate comparison fails to account for the unequal case mix.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is the \"fundamental problem of causal inference,\" and why does it make τ_i uncomputable for a single unit?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Each unit has two potential outcomes, <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, but the switching equation guarantees\nonly one is ever observed, depending on which treatment the unit actually received — the other is a\ncounterfactual that never happened. Since <math data-tex=\"\\tau_i = Y_i(1) - Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> requires both values for the same\nunit, it can never be directly computed; every practical estimator instead targets an <em>aggregate</em>\n(ATE, ATT, or CATE) across many units, not any individual unit's exact effect.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does \"deleting an edge\" in a causal DAG correspond to, and why is this the graphical definition of intervention?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Deleting the edges pointing <em>into</em> a node <math data-tex=\"X\"><mi>X</mi></math> removes every causal influence that would normally\ndetermine <math data-tex=\"X\"><mi>X</mi></math>'s value, then fixes <math data-tex=\"X\"><mi>X</mi></math> at the intervened value — exactly capturing the idea of forcing\n<math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math> regardless of what would ordinarily cause it. This graph-surgery operation is the formal,\ngraphical counterpart of the do-operator: <math data-tex=\"P(Y\\mid\\text{do}(X{=}x))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is read off the graph after this\nedge deletion, whereas <math data-tex=\"P(Y\\mid X{=}x)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is read off the original, unmodified graph.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Classify X→M→Y and X←Z→Y by whether conditioning on the middle node blocks or opens the path, and explain the collider case, which behaves oppositely.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>In both the chain (<math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>) and the fork (<math data-tex=\"X\\leftarrow Z\\to Y\"><mrow><mi>X</mi><mo stretchy=\"false\">←</mo><mi>Z</mi><mo>→</mo><mi>Y</mi></mrow></math>), <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out\nassociated, and conditioning on the middle node (M or Z) <strong>blocks</strong> that association — in the chain\nbecause you've cut the only causal pathway, in the fork because you've controlled for the shared\ncause. A collider (<math data-tex=\"X\\to C\\leftarrow Y\"><mrow><mi>X</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>) behaves oppositely: <math data-tex=\"X\"><mi>X</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> start out independent, and\nconditioning on <math data-tex=\"C\"><mi>C</mi></math> (their common effect) <strong>opens</strong> a spurious association between them that did not\nexist unconditionally — this is collider bias / Berkson's paradox.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">State d-separation's blocking rule and explain why it needs two different cases (collider vs. non-collider).</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>A path is blocked by conditioning set <math data-tex=\"Z\"><mi>Z</mi></math> if it contains either (i) a non-collider that is <em>in</em> <math data-tex=\"Z\"><mi>Z</mi></math>,\nor (ii) a collider whose descendants are all <em>outside</em> <math data-tex=\"Z\"><mi>Z</mi></math>. Two cases are needed because non-colliders\n(chain/fork middle nodes) and colliders behave oppositely under conditioning (per Q5) — a single\nuniform rule would get one of the two cases backward; the two-part definition correctly captures both\nbehaviors within one mechanical procedure.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does it mean for a causal effect to be \"identifiable,\" and how does do-calculus relate to that definition?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>A causal effect <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is identifiable if it can be re-expressed purely in terms of\nthe <em>observational</em> joint distribution <math data-tex=\"P(V)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>V</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> over the measured variables — i.e., computed from data\nyou could actually collect, without ever needing to perform the intervention. Do-calculus's three\nrules are a proof system for this: if some sequence of Rule 1/2/3 applications eliminates every\n<math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from the expression, the effect is identifiable, and the rules are provably complete\n(they will find such a sequence whenever one exists).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">When would you use frontdoor adjustment instead of backdoor adjustment?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Backdoor adjustment requires measuring and conditioning on a set of variables that blocks every\nbackdoor (confounding) path between treatment and outcome — it fails if a relevant confounder is\nunobserved. Frontdoor adjustment is the fallback for exactly that failure case: it requires instead a\nmeasured <em>mediator</em> through which the entire treatment effect flows, whose own relationship to the\noutcome is not confounded by the same unmeasured variable — letting you identify the effect without\never needing to measure the confounder directly.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Why does an RCT not need any of the identification machinery in §4–§8?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Randomization makes treatment assignment <math data-tex=\"T\"><mi>T</mi></math> statistically independent of both potential outcomes,\n<math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>, by construction — including confounders that were never measured or even\nidentified as relevant. Backdoor/frontdoor adjustment and do-calculus all exist specifically to handle\nconfounding when treatment assignment is <em>not</em> independent of potential outcomes; since randomization\nguarantees that independence directly, the raw difference in group means, $\\mathbb{E}[Y\\mid T{=}1] -\n\\mathbb{E}[Y\\mid T{=}0]$, is already an unbiased estimate of the ATE with no adjustment required.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A colleague wants to \"control for\" every available variable in a regression to be safe. Using the collider concept, explain what could go wrong.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>If any of those variables is a collider on a causal path between the treatment and outcome of\ninterest — a common <em>effect</em> of both, rather than a common cause — conditioning on it does not remove\nconfounding but <em>introduces</em> a new spurious association where none existed (collider bias / Berkson's\nparadox), potentially biasing the estimated effect in either direction. &quot;Control for everything\navailable&quot; is not a safe default; each variable needs to be classified by its position in the causal\ngraph (confounder to adjust for vs. mediator or collider to leave alone) before deciding whether\nconditioning on it helps or hurts identification.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;Backdoor adjustment requires Z to block all backdoor paths AND contain no descendant of X — why\nis the second condition necessary?&quot;</em> — conditioning on a descendant of <math data-tex=\"X\"><mi>X</mi></math> can partially or fully\nblock <math data-tex=\"X\"><mi>X</mi></math>'s own <em>causal</em> effect on <math data-tex=\"Y\"><mi>Y</mi></math> if that descendant lies on the causal pathway (effectively\nturning part of the causal chain into a controlled-for mediator), which would bias the estimate of\n<math data-tex=\"X\"><mi>X</mi></math>'s total effect downward, or introduce collider bias if the descendant is also a collider with\nsome other cause of <math data-tex=\"Y\"><mi>Y</mi></math>.</li>\n<li><em>&quot;Why is faithfulness described as a 'generic' assumption rather than something that's always\ntrue?&quot;</em> — faithfulness fails only when causal effects happen to cancel exactly (e.g., a direct\npositive effect and an indirect negative effect through a mediator that sum to precisely zero) —\na measure-zero coincidence in the space of possible parameter values, which is why it's treated as\na reasonable default assumption rather than a guaranteed property of every real system.</li>\n<li><em>&quot;RCTs guarantee internal validity — what's a concrete mechanism by which external validity can\nstill fail even with perfect randomization?&quot;</em> — the trial population itself may be recruited from a\nnarrower or systematically different group than the eventual deployment population (e.g., clinical\ntrial volunteers skew healthier or more compliant than the general patient population), so the\nmeasured ATE, though unbiased <em>for that trial population</em>, need not transfer to a different target\npopulation — this is a population-mismatch problem randomization does nothing to solve.</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>The switching equation and why <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math> is unobservable</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3.1–3\" role=\"link\" tabindex=\"0\">§3.1–3</a>.2: write\n<math data-tex=\"Y_i=T_iY_i(1)+(1-T_i)Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, then note that observing <math data-tex=\"T_i=1\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></math> reveals <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> but leaves\n<math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> permanently counterfactual for that unit (and vice versa), so <math data-tex=\"\\tau_i=Y_i(1)-Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> can\nnever be directly computed for any single unit.</li>\n<li><strong>Classifying a three-node structure and predicting the effect of conditioning</strong> — reproduce <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s\ntable from memory: for chain and fork, conditioning on the middle node blocks the path; for\ncollider, conditioning on the middle node opens it — and explain each case's mechanism, not just\nthe label.</li>\n<li><strong>The backdoor adjustment formula, and why it requires summing over strata of Z</strong> — <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8.1\" role=\"link\" tabindex=\"0\">§8.1</a>:\n<math data-tex=\"P(Y\\mid\\text{do}(X))=\\sum_z P(Y\\mid X,Z{=}z)P(Z{=}z)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mo movablelimits=\"false\">∑</mo><mi>z</mi></msub><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Z</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — derive in words why this is a\n<em>weighted average of within-stratum comparisons</em>, directly generalizing the Simpson's-paradox fix\nof comparing recovery rates within each severity stratum before combining.</li>\n</ol>\n<h3>Applied scenario — Amazon marketing-attribution</h3>\n<p><strong>Framing:</strong> Amazon wants to know whether a specific email marketing campaign <em>causes</em> increased\npurchase rates, using historical data where customers who opened the email are compared to customers\nwho didn't.</p>\n<p><strong>Data:</strong> Observational — customer purchase history, email engagement logs, and available customer\ncovariates (past purchase frequency, account age, browsing activity).</p>\n<p><strong>Model:</strong> This is a textbook confounding setup (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>): customers who are already more engaged with\nAmazon (frequent browsers, frequent past purchasers) are <em>both</em> more likely to open marketing emails\n<em>and</em> more likely to purchase regardless of the email — engagement level is a confounder <math data-tex=\"Z\"><mi>Z</mi></math> inducing\na spurious correlation between &quot;opened email&quot; (<math data-tex=\"X\"><mi>X</mi></math>) and &quot;purchased&quot; (<math data-tex=\"Y\"><mi>Y</mi></math>) even if the email's true\ncausal effect were small or zero. The naive comparison $\\mathbb{E}[Y\\mid X{=}1]-\\mathbb{E}[Y\\mid\nX{=}0]$ (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s exact &quot;prediction vs. causal question&quot; trap) would overstate the campaign's effect.\nApplying <strong>backdoor adjustment</strong> (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8.1\" role=\"link\" tabindex=\"0\">§8.1</a>) using measured engagement covariates as the adjustment set <math data-tex=\"Z\"><mi>Z</mi></math>\n— provided they block all backdoor paths — gives a properly identified estimate of\n<math data-tex=\"P(\\text{purchase}\\mid\\text{do}(\\text{opened email}))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>purchase</mtext><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>opened email</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. Where feasible and ethical, a <strong>randomized\nholdout</strong> (an RCT, <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>) — randomly withholding the campaign from a control group — sidesteps the\nidentification problem entirely and is the gold-standard design Amazon marketing teams typically\nprefer when cost and customer experience allow it.</p>\n<p><strong>Metric:</strong> The estimated ATE (incremental purchase rate caused by the campaign), not the raw\nopen-vs-non-open purchase-rate gap, since only the former isolates the campaign's actual causal\ncontribution from pre-existing engagement differences.</p>\n<p><strong>Failure modes:</strong> Unmeasured confounders (e.g., a customer's underlying purchase intent that both\nmakes them likely to check email <em>and</em> likely to buy) would violate the backdoor criterion if not\ncaptured by the measured covariates — this is exactly the scenario where frontdoor adjustment (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8.2\" role=\"link\" tabindex=\"0\">§8.2</a>)\nor a genuine randomized holdout becomes necessary instead of backdoor adjustment on the covariates at\nhand.</p>\n<p><strong>What you'd ship:</strong> A randomized holdout test as the primary evidence where feasible, cross-validated\nagainst an observational backdoor-adjusted estimate using engagement covariates as a sanity check —\nflagging any large divergence between the two as evidence of residual, unmeasured confounding.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Dive Deep</strong> — refusing to accept &quot;email openers purchase more&quot; as\nevidence the email <em>works</em>, and instead explicitly identifying engagement level as the confounder\ndriving both, is the precise discipline this lecture is built to instill. <strong>Insist on the Highest\nStandards</strong> — preferring a randomized holdout over a purely observational estimate whenever a real\nbusiness decision (marketing spend) rides on the answer reflects exactly the RCT-vs-observational\ntrade-off <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a> lays out.</p>\n<hr>\n</section><section id=\"causal-inference-21-s14\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>ATE (Average Treatment Effect)</strong> — <math data-tex=\"\\mathbb{E}[\\tau_i]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average causal effect across the\nwhole population.</li>\n<li><strong>ATT (Average Treatment effect on the Treated)</strong> — <math data-tex=\"\\mathbb{E}[\\tau_i\\mid T_i{=}1]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>T</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average\neffect among units that actually received treatment.</li>\n<li><strong>Backdoor path</strong> — a path between treatment and outcome that starts with an arrow into the\ntreatment node; the source of confounding.</li>\n<li><strong>CATE (Conditional Average Treatment Effect)</strong> — <math data-tex=\"\\mathbb{E}[\\tau_i\\mid X_i{=}x]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>X</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, the average\neffect within a covariate-defined subgroup.</li>\n<li><strong>Chain</strong> — a three-node structure <math data-tex=\"X\\to M\\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>; conditioning on <math data-tex=\"M\"><mi>M</mi></math> blocks the <math data-tex=\"X\"><mi>X</mi></math>–<math data-tex=\"Y\"><mi>Y</mi></math>\nassociation.</li>\n<li><strong>Collider</strong> — a three-node structure <math data-tex=\"X\\to C\\leftarrow Y\"><mrow><mi>X</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>; conditioning on <math data-tex=\"C\"><mi>C</mi></math> <em>opens</em> a spurious\n<math data-tex=\"X\"><mi>X</mi></math>–<math data-tex=\"Y\"><mi>Y</mi></math> association (Berkson's paradox).</li>\n<li><strong>Confounder</strong> — a variable that causally influences both the treatment and the outcome, creating\nan association between them even absent a direct causal effect.</li>\n<li><strong>DAG (Directed Acyclic Graph)</strong> — a graph encoding a factorization of a joint distribution, with\ncausal semantics: edges are direct causal influences, edge deletion represents intervention.</li>\n<li><strong>d-separation</strong> — the sound and complete graphical procedure for reading conditional\nindependencies directly off a DAG.</li>\n<li><strong>do-calculus</strong> — Pearl's three-rule proof system for reducing <math data-tex=\"\\text{do}(\\cdot)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> expressions to\npurely observational quantities.</li>\n<li><strong>do-operator, <math data-tex=\"\\text{do}(X{=}x)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — notation for forcing <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math> via intervention, as opposed to\nobserving <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>.</li>\n<li><strong>Fork</strong> — a three-node structure <math data-tex=\"X\\leftarrow Z\\to Y\"><mrow><mi>X</mi><mo stretchy=\"false\">←</mo><mi>Z</mi><mo>→</mo><mi>Y</mi></mrow></math> (confounder); conditioning on <math data-tex=\"Z\"><mi>Z</mi></math> blocks the\n<math data-tex=\"X\"><mi>X</mi></math>–<math data-tex=\"Y\"><mi>Y</mi></math> association.</li>\n<li><strong>Frontdoor adjustment</strong> — an identification formula using a measured mediator, valid when\nconfounders are unobserved.</li>\n<li><strong>Fundamental problem of causal inference</strong> — the fact that only one of a unit's two potential\noutcomes is ever observed.</li>\n<li><strong>Identification</strong> — the process of expressing an unobservable causal quantity in terms of an\nestimable statistical one.</li>\n<li><strong>Potential outcomes</strong> — <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the two possible outcomes a unit could have under\ntreatment or control.</li>\n<li><strong>RCT (Randomized Controlled Trial)</strong> — an experimental design where treatment assignment is\nrandomized, guaranteeing <math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>.</li>\n<li><strong>Simpson's paradox</strong> — an association that reverses between the aggregate population and every\nsubgroup, caused by an unequally-distributed confounder.</li>\n<li><strong>Switching equation</strong> — <math data-tex=\"Y_i = T_iY_i(1) + (1-T_i)Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>; formalizes that the observed outcome\nreveals exactly one potential outcome.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-21-s15\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Write <math data-tex=\"P(Y\\mid X)\\ne P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≠</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from memory and explain, in one sentence each, what the\nleft and right sides mean. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§1.1\" role=\"link\" tabindex=\"0\">§1.1</a>)</em></li>\n<li>Explain how a confounder can produce a strong correlation (firefighters vs. property damage) with\nzero or even reversed causal effect. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.1\" role=\"link\" tabindex=\"0\">§2.1</a>)</em></li>\n<li>Given hospital recovery rates that reverse between aggregate and subgroup level, identify the\nconfounder and explain the mechanism using stratum weights. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>)</em></li>\n<li>Write the switching equation and explain why it makes <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math> fundamentally unobservable for any\nsingle unit. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3.1–3\" role=\"link\" tabindex=\"0\">§3.1–3</a>.2)</em></li>\n<li>Distinguish ATE, ATT, and CATE, and give a business question each one specifically answers. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>)</em></li>\n<li>Write the DAG factorization formula, and explain what &quot;deleting an edge&quot; means in causal terms.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Classify each of the three three-node structures (chain, fork, collider) and state whether\nconditioning on the middle node blocks or opens the path, for each. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>)</em></li>\n<li>State d-separation's blocking definition, including both the non-collider and collider cases.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)</em></li>\n<li>Name the three rules of do-calculus in one sentence each, without the formal notation. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>)</em></li>\n<li>State the backdoor adjustment formula and its validity condition. When would you reach for\nfrontdoor adjustment instead? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>)</em></li>\n<li>Explain precisely what randomization guarantees, and list the four practical reasons RCTs aren't\nalways available. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-21-s16\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Simpson (1951), &quot;The Interpretation of Interaction in Contingency Tables&quot;</strong> — the original\nSimpson's paradox paper, named directly on the lecture's slide [slide 32]. <code>solid</code> · primary\nsource for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>.</li>\n<li><strong>Rubin (1974), &quot;Estimating causal effects of treatments in randomized and nonrandomized\nstudies&quot;</strong> — the foundational potential-outcomes paper, named directly [slide 36]. <code>solid</code> ·\nprimary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>.</li>\n<li><strong>Pearl (1988), <em>Probabilistic Reasoning in Intelligent Systems</em>, Morgan Kaufmann</strong> — the\nfoundational text on graphical causal models, named directly [slide 38]. <code>hard</code> · primary source\nfor <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>, dense but the definitive reference.</li>\n<li><strong>Dawid (1979), &quot;Conditional Independence in Statistical Theory&quot;</strong> — named directly [slide 40] as\nthe source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s formal conditional-independence framework. <code>hard</code>.</li>\n<li><strong>Verma &amp; Pearl (1988), &quot;Causal Networks: Semantics and Expressiveness&quot;</strong> — the original\nd-separation paper, named directly [slide 43]. <code>hard</code> · primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>.</li>\n<li><strong>Pearl (1995), &quot;Causal Diagrams for Empirical Research&quot;</strong> — introduces the three rules of\ndo-calculus, named directly [slide 45]. <code>hard</code> · primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>.</li>\n<li><strong>Pearl (2000), <em>Causality</em>, Ch. 3</strong> — the comprehensive textbook treatment of backdoor/frontdoor\ncriteria, named directly [slide 47] exactly as shown (the slide does not display a publisher).\n<code>solid</code> · the standard reference for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>, more accessible than the original papers as a starting\npoint. (Published by Cambridge University Press, for reference — but that detail is not itself\nshown on the slide, so it's omitted here to match what item 7 actually transcribes.)</li>\n<li><strong>Fisher (1935), <em>The Design of Experiments</em>, Oliver &amp; Boyd</strong> — the foundational text on\nrandomized experimentation, named directly [slide 51]. <code>solid</code> · primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>.</li>\n<li><strong>Pearl, Glymour, Jewell (2016), <em>Causal Inference in Statistics: A Primer</em></strong> — a widely used,\nmore approachable companion to Pearl's denser texts, covering DAGs, d-separation, and do-calculus\nwith worked examples. <code>intro</code> · a good next read before tackling Pearl (1988/2000) directly.\n⚠️ not itself named on the lecture's slides — included here as a commonly recommended companion.</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — all citations except item 9 are transcribed directly from the lecture's own\nslides (author, year, title, and — where shown — publisher), so their accuracy reflects the slide's\naccuracy rather than independent verification. Item 9 was not shown on any slide and is added from\ngeneral knowledge of the field; treat it as a recommendation, not a lecture citation.</p>\n</aside>\n</section>","sections":[{"id":"causal-inference-21-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s1","num":"","title":"Before we start: what you need to know","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s2","num":"","title":"The big picture","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s3","num":"1","title":"Why Causality Matters","mins":6,"kind":"content","part":""},{"id":"causal-inference-21-s4","num":"2","title":"Correlation ≠ Causation","mins":5,"kind":"content","part":""},{"id":"causal-inference-21-s5","num":"3","title":"Potential Outcomes Framework","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s6","num":"4","title":"Probabilistic Graphical Models","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s7","num":"5","title":"Conditional Independence — the Atomic Building Block","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s8","num":"6","title":"D-Separation Theorem — Reading Conditional Independences from the Graph","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s9","num":"7","title":"do-Calculus — From Graph to Intervention","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s10","num":"8","title":"Backdoor and Frontdoor Criteria — Two Ready-Made Corollaries","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s11","num":"9","title":"RCTs — The Gold Standard","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s12","num":"","title":"Putting it together","mins":4,"kind":"back","part":""},{"id":"causal-inference-21-s13","num":"","title":"Interview prep — Amazon Applied Scientist","mins":14,"kind":"back","part":""},{"id":"causal-inference-21-s14","num":"","title":"Glossary","mins":2,"kind":"back","part":""},{"id":"causal-inference-21-s15","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"causal-inference-21-s16","num":"","title":"Going deeper","mins":3,"kind":"back","part":""}],"interactiveCount":0},{"id":"causal-inference-22","num":"22","file":"causal-inference-02","kind":"lecture","title":"Causal Inference — Part 2: Treatment Effects, Identification, and Classical Estimation","h1":"Causal Inference — Part 2: Treatment Effects, Identification, and Classical Estimation","subtitle":"Treatment Effects, Identification, and Classical Estimation","spineLabel":"Part 2","short":"Treatment Effects, Identification, and Classical Estimation","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~57:00. Built from the raw capture in <code>output/Lecture_22 - Module 7 Causal Inference Part 2/</code> (90 raw frames), not <code>slides_deduped/</code> — see project memory <code>slides-deduped-is-lossy</code>.\nInstructor not named in the webcam tile. This is a <strong>different deck lineage</strong> from Lecture 21 —\ninteractive, dark-themed, and built entirely around <strong>one real running dataset</strong> (the National\nSupported Work job-training program, mid-1970s) rather than citations to separate papers. Every\nmethod introduced is immediately scored against that dataset's known randomized-trial answer,\n<strong>ATT ≈ +$1,794</strong>, which is why this file cites in-slide numbers rather than external papers.</p>\n<p>⚠️ <strong>verify this</strong> — the &quot;National Supported Work&quot; mid-1970s job-training dataset with these exact\nfigures (<math data-tex=\"6,349 trainee earnings,\"><mrow><mn>6,349</mn><mi>t</mi><mi>r</mi><mi>a</mi><mi>i</mi><mi>n</mi><mi>e</mi><mi>e</mi><mi>e</mi><mi>a</mi><mi>r</mi><mi>n</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>s</mi><mo separator=\"true\">,</mo></mrow></math>4,555 control earnings, ATT ≈ $1,794) is widely known in the\ncausal inference literature as the dataset from LaLonde (1986), &quot;Evaluating the Econometric\nEvaluations of Training Programs.&quot; This attribution is <strong>not stated on the lecture's own slides</strong>\n(no citation is shown), so it is offered here only as likely background context, not a transcribed\nfact.</p>\n</blockquote>\n<hr>\n</div><section id=\"causal-inference-22-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Reproduce, on one real dataset, how a randomized-trial estimate and a naive observational\ncomparison can have opposite signs</strong> — and explain exactly which assumption the naive comparison\nsilently violates.</li>\n<li><strong>Distinguish estimand, estimator, and estimate</strong>, and diagnose whether a wrong answer comes from\na wrong target or a careless procedure.</li>\n<li><strong>Compute and distinguish all five treatment-effect estimands</strong> (ITE, ATE, ATT, ATC, CATE) from a\nsingle dataset, and choose the correct one for a given business question.</li>\n<li><strong>Decompose a naive comparison algebraically into &quot;ATT + selection bias&quot;</strong>, and explain what\n&quot;balancing a covariate&quot; does to each term.</li>\n<li><strong>Classify a candidate control variable as a confounder, mediator, or collider</strong>, and predict\nwhether adjusting for it fixes or breaks the estimate — with real, contrasting dollar figures for\neach case.</li>\n<li><strong>State the three identifying assumptions</strong> (unconfoundedness, positivity, SUTVA) precisely, and\ngive a concrete violation of each drawn from the same running example.</li>\n<li><strong>Explain why exact matching fails in high dimensions</strong> (the curse of dimensionality), with the\ndataset's own <math data-tex=\"3^8=6{,}561\"><mrow><msup><mn>3</mn><mn>8</mn></msup><mo>=</mo><mn>6,561</mn></mrow></math>-cells-vs-42-populated-cells result.</li>\n<li><strong>Derive and apply the propensity score</strong>, explain why it should never be built to maximize\nprediction of treatment, and compute an inverse-probability-weighted estimate.</li>\n<li><strong>Explain doubly robust (AIPW) estimation</strong> and why it's consistent if <em>either</em> of two models is\ncorrectly specified.</li>\n<li><strong>Read a full comparison table of six estimators against one known truth</strong>, and explain why\noverlap — not estimator choice — turned out to be the dominant driver of accuracy in this\nexample.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-22-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — This lecture assumes Lecture 21's vocabulary</h3>\n<p>This file builds directly on\n<a class=\"xref\" data-xref-lec=\"causal-inference-01\" role=\"link\" tabindex=\"0\"><code>causal-inference-01.md</code></a>: potential outcomes (<math data-tex=\"Y_i(1), Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>), the\ndo-operator, DAGs, confounders, and the fundamental problem of causal inference are all used here\nwithout re-derivation. If <math data-tex=\"\\{Y(0),Y(1)\\}\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></math> or <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> are unfamiliar, read Part 1\nfirst.</p>\n<h3>Prerequisite 2 — Standardized Mean Difference (SMD)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>SMD (Standardized Mean Difference)</strong> — the gap between two groups' means on some covariate,\ndivided by a pooled standard deviation, so the gap is measured in &quot;how many standard deviations\napart&quot; rather than in raw units.</p>\n<p><em>Why it exists:</em> raw gaps aren't comparable across variables measured in different units (dollars\nvs. years vs. percentages). SMD puts every covariate's imbalance on the same scale, so you can rank\n&quot;which covariate is most imbalanced&quot; directly. A common rule of thumb, used in this lecture, treats\n<math data-tex=\"|\\text{SMD}| &gt; 0.1\"><mrow><mi>|</mi><mtext>SMD</mtext><mi>|</mi><mo>&gt;</mo><mn>0.1</mn></mrow></math> as a meaningful imbalance worth worrying about.</p>\n</blockquote>\n<h3>Prerequisite 3 — Logistic regression, briefly</h3>\n<p>The propensity score (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>) is typically estimated by <strong>logistic regression</strong>: a model that outputs a\nnumber between 0 and 1, interpreted as a probability, by fitting a linear combination of covariates\nthrough a sigmoid function. If this is unfamiliar in detail, all you need for this lecture is: logistic\nregression takes a set of covariates <math data-tex=\"X\"><mi>X</mi></math> and produces <math data-tex=\"\\hat e(x)\\in(0,1)\"><mrow><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>∈</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, an estimated probability —\nexactly the shape of number the propensity score needs.</p>\n<h3>Prerequisite 4 — Weighted average, briefly</h3>\n<p>Several formulas in this lecture (stratification, IPW) are <strong>weighted averages</strong>: instead of averaging\nevery observation equally, each observation or group is multiplied by a &quot;weight&quot; reflecting its\nimportance or size, then summed. <math data-tex=\"\\sum_k w_k \\cdot v_k\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>k</mi></msub><msub><mi>w</mi><mi>k</mi></msub><mo>⋅</mo><msub><mi>v</mi><mi>k</mi></msub></mrow></math> with <math data-tex=\"\\sum_k w_k = 1\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>k</mi></msub><msub><mi>w</mi><mi>k</mi></msub><mo>=</mo><mn>1</mn></mrow></math> is a weighted average —\nknow this shape, because <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s stratification formula and <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s IPW formula are both instances of it.</p>\n<hr>\n</section><section id=\"causal-inference-22-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Lecture 21 established the theory: <math data-tex=\"P(Y\\mid X)\\ne P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≠</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, and identification requires\neither randomization or the right assumptions plus the right graphical structure. This lecture\n<strong>operationalizes</strong> that theory on one real dataset, in three acts:</p>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"316\" style=\"max-width:100%;height:auto\" id=\"d095f7c169901eae2\ arker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M 0 0 L 10 5 L 0 10 z\" class=\"arrowMarkerPath\" style=\"stroke-width: 1; stroke-dasharray: 1, 0;\"></path></marker><marker id=\"d095f7c169901eae2_flowchart-v2-pointStart\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"4.5\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M 0 5 L 10 10 L 10 0 z\" class=\"arrowMarkerPath\" style=\"stroke-width: 1; stroke-dasharray: 1, 0;\"></path></marker><marker id=\"d095f7c169901eae2_flowchart-v2-pointEnd-margin\" class=\"marker flowchart-v2\" viewBox=\"0 0 11.5 14\" refX=\"11.5\" refY=\"7\" markerUnits=\"userSpaceOnUse\" markerWidth=\"10.5\" markerHeight=\"14\" orient=\"auto\"><path d=\"M 0 0 L 11.5 7 L 0 14 z\" class=\"arrowMarkerPath\" style=\"stroke-width: 0; stroke-dasharray: 1, 0;\"></path></marker><marker id=\"d095f7c169901eae2_flowchart-v2-pointStart-margin\" class=\"marker flowchart-v2\" viewBox=\"0 0 11.5 14\" refX=\"1\" refY=\"7\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11.5\" markerHeight=\"14\" orient=\"auto\"><polygon points=\"0,7 11.5,14 11.5,0\" class=\"arrowMarkerPath\" style=\"stroke-width: 0; stroke-dasharray: 1, 0;\"></polygon></marker><marker id=\"d095f7c169901eae2_flowchart-v2-circleEnd\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"11\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto\"><circle cx=\"5\" cy=\"5\" r=\"5\" class=\"arrowMarkerPath\" style=\"stroke-width: 1; stroke-dasharray: 1, 0;\"></circle></marker><marker id=\"d095f7c169901eae2_flowchart-v2-circleStart\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"-1\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto\"><circle cx=\"5\" cy=\"5\" r=\"5\" class=\"arrowMarkerPath\" style=\"stroke-width: 1; stroke-dasharray: 1, 0;\"></circle></marker><marker id=\"d095f7c169901eae2_flowchart-v2-circleEnd-margin\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refY=\"5\" refX=\"12.25\" markerUnits=\"userSpaceOnUse\" markerWidth=\"14\" markerHeight=\"14\" orient=\"auto\"><circle cx=\"5\" cy=\"5\" r=\"5\" class=\"arrowMarkerPath\" style=\"stroke-width: 0; stroke-dasharray: 1, 0;\"></circle></marker><marker id=\"d095f7c169901eae2_flowchart-v2-circleStart-margin\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"-2\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"14\" markerHeight=\"14\" orient=\"auto\"><circle cx=\"5\" cy=\"5\" r=\"5\" class=\"arrowMarkerPath\" style=\"stroke-width: 0; stroke-dasharray: 1, 0;\"></circle></marker><marker id=\"d095f7c169901eae2_flowchart-v2-crossEnd\" class=\"marker cross flowchart-v2\" viewBox=\"0 0 11 11\" refX=\"12\" refY=\"5.2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto\"><path d=\"M 1,1 l 9,9 M 10,1 l -9,9\" class=\"arrowMarkerPath\" style=\"stroke-width: 2; stroke-dasharray: 1, 0;\"></path></marker><marker id=\"d095f7c169901eae2_flowchart-v2-crossStart\" class=\"marker cross flowchart-v2\" viewBox=\"0 0 11 11\" refX=\"-1\" refY=\"5.2\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto\"><path d=\"M 1,1 l 9,9 M 10,1 l -9,9\" class=\"arrowMarkerPath\" style=\"stroke-width: 2; stroke-dasharray: 1, 0;\"></path></marker><marker id=\"d095f7c169901eae2_flowchart-v2-crossEnd-margin\" class=\"marker cross flowchart-v2\" viewBox=\"0 0 15 15\" refX=\"17.7\" refY=\"7.5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M 1,1 L 14,14 M 1,14 L 14,1\" class=\"arrowMarkerPath\" style=\"stroke-width: 2.5;\"></path></marker><marker id=\"d095f7c169901eae2_flowchart-v2-crossStart-margin\" class=\"marker cross flowchart-v2\" viewBox=\"0 0 15 15\" refX=\"-3.5\" refY=\"7.5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M 1,1 L 14,14 M 1,14 L 14,1\" class=\"arrowMarkerPath\" style=\"stroke-width: 2.5; stroke-dasharray: 1, 0;\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path d=\"M158,125.5L158,140.5L158,151.5\" id=\"d095f7c169901eae2-L_P1_P2_0\" class=\" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link\" style=\";\" data-edge=\"true\" data-et=\"edge\" data-id=\"L_P1_P2_0\" data-points=\"W3sieCI6MTU4LCJ5IjoxMjUuNX0seyJ4IjoxNTgsInkiOjE0MC41fSx7IngiOjE1OCwieSI6MTU1LjV9XQ==\" data-look=\"classic\" marker-end=\"url(#d095f7c169901eae2_flowchart-v2-pointEnd)\"></path><path d=\"M158,292.5L158,307.5L158,318.5\" id=\"d095f7c169901eae2-L_P2_P3_0\" class=\" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link\" style=\";\" data-edge=\"true\" data-et=\"edge\" data-id=\"L_P2_P3_0\" data-points=\"W3sieCI6MTU4LCJ5IjoyOTIuNX0seyJ4IjoxNTgsInkiOjMwNy41fSx7IngiOjE1OCwieSI6MzIyLjV9XQ==\" data-look=\"classic\" marker-end=\"url(#d095f7c169901eae2_flowchart-v2-pointEnd)\"></path><path d=\"M158,440L158,455L158,466\" id=\"d095f7c169901eae2-L_P3_BR_0\" class=\" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link\" style=\";\" data-edge=\"true\" data-et=\"edge\" data-id=\"L_P3_BR_0\" data-points=\"W3sieCI6MTU4LCJ5Ijo0NDB9LHsieCI6MTU4LCJ5Ijo0NTV9LHsieCI6MTU4LCJ5Ijo0NzB9XQ==\" data-look=\"classic\" marker-end=\"url(#d095f7c169901eae2_flowchart-v2-pointEnd)\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g class=\"label\" data-id=\"L_P1_P2_0\" transform=\"translate(0, 0)\"><foreignObject width=\"0\" height=\"0\"><div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"labelBkg\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"edgeLabel \"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g class=\"label\" data-id=\"L_P2_P3_0\" transform=\"translate(0, 0)\"><foreignObject width=\"0\" height=\"0\"><div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"labelBkg\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"edgeLabel \"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g class=\"label\" data-id=\"L_P3_BR_0\" transform=\"translate(0, 0)\"><foreignObject width=\"0\" height=\"0\"><div xmlns=\"http://www.w3.org/1999/xhtml\" class=\"labelBkg\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"edgeLabel \"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g class=\"node default  \" id=\"d095f7c169901eae2-flowchart-P1-0\" data-look=\"classic\" transform=\"translate(158, 66.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-58.75\" width=\"300\" height=\"117.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -48.75)\"><rect></rect><foreignObject width=\"260\" height=\"97.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>Part 1 · Treatment effects</b><br><small>one dataset, two comparisons, opposite signs — what number are we even trying to compute? (estimand / estimator / estimate; ITE / ATE / ATT / ATC / CATE)</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"d095f7c169901eae2-flowchart-P2-2\" data-look=\"classic\" transform=\"translate(158, 224)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-68.5\" width=\"300\" height=\"137\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -58.5)\"><rect></rect><foreignObject width=\"260\" height=\"117\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>Part 2 · Identification</b><br><small>why do the two comparisons disagree? selection bias, decomposed algebraically · which covariates fix it (confounders) vs break it further (mediators, colliders) · the three assumptions: unconfoundedness, positivity, SUTVA</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"d095f7c169901eae2-flowchart-P3-4\" data-look=\"classic\" transform=\"translate(158, 381.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-150\" y=\"-58.75\" width=\"300\" height=\"117.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-130, -48.75)\"><rect></rect><foreignObject width=\"260\" height=\"97.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\"><span class=\"nodeLabel \"><p><b>Part 3 · Classical estimation</b><br><small>six recipes — stratification, matching, propensity-score weighting, regression adjustment, doubly robust — each scored against the same known $1,794 truth</small></p></span></div></foreignObject></g></g><g class=\"node default k \" id=\"d095f7c169901eae2-flowchart-BR-6\" data-look=\"classic\" transform=\"translate(158, 528.75)\"><rect class=\"basic label-container\" style=\"fill:#1E3025 !important;stroke:#4FA073 !important\" x=\"-150\" y=\"-58.75\" width=\"300\" height=\"117.5\"></rect><g class=\"label\" style=\"color:#EDE6D7 !important\" transform=\"translate(-130, -48.75)\"><rect></rect><foreignObject width=\"260\" height=\"97.5\"><div style=\"color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span style=\"color:#EDE6D7 !important\" class=\"nodeLabel \"><p><b>Bridge to ML</b><br><small>every classical method rests on estimating one or both nuisance functions — propensity e(x) and outcome μ(x) — exactly what flexible ML models can replace hand-built formulas with</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"d095f7c169901eae2-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"d095f7c169901eae2-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"d095f7c169901eae2-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<p>Because every method is tested against the <em>same</em> real, known answer, this lecture teaches causal\ninference less as a set of formulas to memorize and more as a series of <strong>empirically verifiable\nclaims</strong> — &quot;here's what happens to the number when we do X&quot; — which is unusual and worth taking\nadvantage of while studying it.</p>\n<hr>\n</section><section id=\"causal-inference-22-s3\" data-title=\"A Job-Training Experiment — the Dataset Everything Is Judged Against\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">A Job-Training Experiment — the Dataset Everything Is Judged Against</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><strong>The question:</strong> does a temporary paid job raise later earnings?</p>\n<p><strong>The setup:</strong> National Support
