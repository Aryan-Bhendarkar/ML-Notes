(1-T_i)Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>; formalizes that the observed outcome\nreveals exactly one potential outcome.</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-21-s15\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Write <math data-tex=\"P(Y\\mid X)\\ne P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≠</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> from memory and explain, in one sentence each, what the\nleft and right sides mean. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§1.1\" role=\"link\" tabindex=\"0\">§1.1</a>)</em></li>\n<li>Explain how a confounder can produce a strong correlation (firefighters vs. property damage) with\nzero or even reversed causal effect. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.1\" role=\"link\" tabindex=\"0\">§2.1</a>)</em></li>\n<li>Given hospital recovery rates that reverse between aggregate and subgroup level, identify the\nconfounder and explain the mechanism using stratum weights. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>)</em></li>\n<li>Write the switching equation and explain why it makes <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math> fundamentally unobservable for any\nsingle unit. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3.1–3\" role=\"link\" tabindex=\"0\">§3.1–3</a>.2)</em></li>\n<li>Distinguish ATE, ATT, and CATE, and give a business question each one specifically answers. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>)</em></li>\n<li>Write the DAG factorization formula, and explain what &quot;deleting an edge&quot; means in causal terms.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Classify each of the three three-node structures (chain, fork, collider) and state whether\nconditioning on the middle node blocks or opens the path, for each. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>)</em></li>\n<li>State d-separation's blocking definition, including both the non-collider and collider cases.\n<em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)</em></li>\n<li>Name the three rules of do-calculus in one sentence each, without the formal notation. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>)</em></li>\n<li>State the backdoor adjustment formula and its validity condition. When would you reach for\nfrontdoor adjustment instead? <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>)</em></li>\n<li>Explain precisely what randomization guarantees, and list the four practical reasons RCTs aren't\nalways available. <em>(<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-21-s16\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Simpson (1951), &quot;The Interpretation of Interaction in Contingency Tables&quot;</strong> — the original\nSimpson's paradox paper, named directly on the lecture's slide [slide 32]. <code>solid</code> · primary\nsource for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>.</li>\n<li><strong>Rubin (1974), &quot;Estimating causal effects of treatments in randomized and nonrandomized\nstudies&quot;</strong> — the foundational potential-outcomes paper, named directly [slide 36]. <code>solid</code> ·\nprimary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>.</li>\n<li><strong>Pearl (1988), <em>Probabilistic Reasoning in Intelligent Systems</em>, Morgan Kaufmann</strong> — the\nfoundational text on graphical causal models, named directly [slide 38]. <code>hard</code> · primary source\nfor <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>, dense but the definitive reference.</li>\n<li><strong>Dawid (1979), &quot;Conditional Independence in Statistical Theory&quot;</strong> — named directly [slide 40] as\nthe source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s formal conditional-independence framework. <code>hard</code>.</li>\n<li><strong>Verma &amp; Pearl (1988), &quot;Causal Networks: Semantics and Expressiveness&quot;</strong> — the original\nd-separation paper, named directly [slide 43]. <code>hard</code> · primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>.</li>\n<li><strong>Pearl (1995), &quot;Causal Diagrams for Empirical Research&quot;</strong> — introduces the three rules of\ndo-calculus, named directly [slide 45]. <code>hard</code> · primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>.</li>\n<li><strong>Pearl (2000), <em>Causality</em>, Ch. 3</strong> — the comprehensive textbook treatment of backdoor/frontdoor\ncriteria, named directly [slide 47] exactly as shown (the slide does not display a publisher).\n<code>solid</code> · the standard reference for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>, more accessible than the original papers as a starting\npoint. (Published by Cambridge University Press, for reference — but that detail is not itself\nshown on the slide, so it's omitted here to match what item 7 actually transcribes.)</li>\n<li><strong>Fisher (1935), <em>The Design of Experiments</em>, Oliver &amp; Boyd</strong> — the foundational text on\nrandomized experimentation, named directly [slide 51]. <code>solid</code> · primary source for <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>.</li>\n<li><strong>Pearl, Glymour, Jewell (2016), <em>Causal Inference in Statistics: A Primer</em></strong> — a widely used,\nmore approachable companion to Pearl's denser texts, covering DAGs, d-separation, and do-calculus\nwith worked examples. <code>intro</code> · a good next read before tackling Pearl (1988/2000) directly.\n⚠️ not itself named on the lecture's slides — included here as a commonly recommended companion.</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — all citations except item 9 are transcribed directly from the lecture's own\nslides (author, year, title, and — where shown — publisher), so their accuracy reflects the slide's\naccuracy rather than independent verification. Item 9 was not shown on any slide and is added from\ngeneral knowledge of the field; treat it as a recommendation, not a lecture citation.</p>\n</aside>\n</section>","sections":[{"id":"causal-inference-21-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s1","num":"","title":"Before we start: what you need to know","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s2","num":"","title":"The big picture","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s3","num":"1","title":"Why Causality Matters","mins":6,"kind":"content","part":""},{"id":"causal-inference-21-s4","num":"2","title":"Correlation ≠ Causation","mins":5,"kind":"content","part":""},{"id":"causal-inference-21-s5","num":"3","title":"Potential Outcomes Framework","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s6","num":"4","title":"Probabilistic Graphical Models","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s7","num":"5","title":"Conditional Independence — the Atomic Building Block","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s8","num":"6","title":"D-Separation Theorem — Reading Conditional Independences from the Graph","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s9","num":"7","title":"do-Calculus — From Graph to Intervention","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s10","num":"8","title":"Backdoor and Frontdoor Criteria — Two Ready-Made Corollaries","mins":3,"kind":"content","part":""},{"id":"causal-inference-21-s11","num":"9","title":"RCTs — The Gold Standard","mins":2,"kind":"content","part":""},{"id":"causal-inference-21-s12","num":"","title":"Putting it together","mins":3,"kind":"back","part":""},{"id":"causal-inference-21-s13","num":"","title":"Interview prep — Amazon Applied Scientist","mins":14,"kind":"back","part":""},{"id":"causal-inference-21-s14","num":"","title":"Glossary","mins":2,"kind":"back","part":""},{"id":"causal-inference-21-s15","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"causal-inference-21-s16","num":"","title":"Going deeper","mins":3,"kind":"back","part":""}],"interactiveCount":0},{"id":"causal-inference-22","num":"22","file":"causal-inference-02","kind":"lecture","title":"Causal Inference — Part 2: Treatment Effects, Identification, and Classical Estimation","h1":"Causal Inference — Part 2: Treatment Effects, Identification, and Classical Estimation","subtitle":"Treatment Effects, Identification, and Classical Estimation","spineLabel":"Part 2","short":"Treatment Effects, Identification, and Classical Estimation","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~57:00. Built from the raw capture in <code>output/Lecture_22 - Module 7 Causal Inference Part 2/</code> (90 raw frames), not <code>slides_deduped/</code> — see project memory <code>slides-deduped-is-lossy</code>.\nInstructor not named in the webcam tile. This is a <strong>different deck lineage</strong> from Lecture 21 —\ninteractive, dark-themed, and built entirely around <strong>one real running dataset</strong> (the National\nSupported Work job-training program, mid-1970s) rather than citations to separate papers. Every\nmethod introduced is immediately scored against that dataset's known randomized-trial answer,\n<strong>ATT ≈ +$1,794</strong>, which is why this file cites in-slide numbers rather than external papers.</p>\n<p>⚠️ <strong>verify this</strong> — the &quot;National Supported Work&quot; mid-1970s job-training dataset with these exact\nfigures (<math data-tex=\"6,349 trainee earnings,\"><mrow><mn>6,349</mn><mi>t</mi><mi>r</mi><mi>a</mi><mi>i</mi><mi>n</mi><mi>e</mi><mi>e</mi><mi>e</mi><mi>a</mi><mi>r</mi><mi>n</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>s</mi><mo separator=\"true\">,</mo></mrow></math>4,555 control earnings, ATT ≈ $1,794) is widely known in the\ncausal inference literature as the dataset from LaLonde (1986), &quot;Evaluating the Econometric\nEvaluations of Training Programs.&quot; This attribution is <strong>not stated on the lecture's own slides</strong>\n(no citation is shown), so it is offered here only as likely background context, not a transcribed\nfact.</p>\n</blockquote>\n<hr>\n</div><section id=\"causal-inference-22-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Reproduce, on one real dataset, how a randomized-trial estimate and a naive observational\ncomparison can have opposite signs</strong> — and explain exactly which assumption the naive comparison\nsilently violates.</li>\n<li><strong>Distinguish estimand, estimator, and estimate</strong>, and diagnose whether a wrong answer comes from\na wrong target or a careless procedure.</li>\n<li><strong>Compute and distinguish all five treatment-effect estimands</strong> (ITE, ATE, ATT, ATC, CATE) from a\nsingle dataset, and choose the correct one for a given business question.</li>\n<li><strong>Decompose a naive comparison algebraically into &quot;ATT + selection bias&quot;</strong>, and explain what\n&quot;balancing a covariate&quot; does to each term.</li>\n<li><strong>Classify a candidate control variable as a confounder, mediator, or collider</strong>, and predict\nwhether adjusting for it fixes or breaks the estimate — with real, contrasting dollar figures for\neach case.</li>\n<li><strong>State the three identifying assumptions</strong> (unconfoundedness, positivity, SUTVA) precisely, and\ngive a concrete violation of each drawn from the same running example.</li>\n<li><strong>Explain why exact matching fails in high dimensions</strong> (the curse of dimensionality), with the\ndataset's own <math data-tex=\"3^8=6{,}561\"><mrow><msup><mn>3</mn><mn>8</mn></msup><mo>=</mo><mn>6,561</mn></mrow></math>-cells-vs-42-populated-cells result.</li>\n<li><strong>Derive and apply the propensity score</strong>, explain why it should never be built to maximize\nprediction of treatment, and compute an inverse-probability-weighted estimate.</li>\n<li><strong>Explain doubly robust (AIPW) estimation</strong> and why it's consistent if <em>either</em> of two models is\ncorrectly specified.</li>\n<li><strong>Read a full comparison table of six estimators against one known truth</strong>, and explain why\noverlap — not estimator choice — turned out to be the dominant driver of accuracy in this\nexample.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-22-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — This lecture assumes Lecture 21's vocabulary</h3>\n<p>This file builds directly on\n<a class=\"xref\" data-xref-lec=\"causal-inference-01\" role=\"link\" tabindex=\"0\"><code>causal-inference-01.md</code></a>: potential outcomes (<math data-tex=\"Y_i(1), Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>), the\ndo-operator, DAGs, confounders, and the fundamental problem of causal inference are all used here\nwithout re-derivation. If <math data-tex=\"\\{Y(0),Y(1)\\}\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></math> or <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> are unfamiliar, read Part 1\nfirst.</p>\n<h3>Prerequisite 2 — Standardized Mean Difference (SMD)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>SMD (Standardized Mean Difference)</strong> — the gap between two groups' means on some covariate,\ndivided by a pooled standard deviation, so the gap is measured in &quot;how many standard deviations\napart&quot; rather than in raw units.</p>\n<p><em>Why it exists:</em> raw gaps aren't comparable across variables measured in different units (dollars\nvs. years vs. percentages). SMD puts every covariate's imbalance on the same scale, so you can rank\n&quot;which covariate is most imbalanced&quot; directly. A common rule of thumb, used in this lecture, treats\n<math data-tex=\"|\\text{SMD}| &gt; 0.1\"><mrow><mi>|</mi><mtext>SMD</mtext><mi>|</mi><mo>&gt;</mo><mn>0.1</mn></mrow></math> as a meaningful imbalance worth worrying about.</p>\n</blockquote>\n<h3>Prerequisite 3 — Logistic regression, briefly</h3>\n<p>The propensity score (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>) is typically estimated by <strong>logistic regression</strong>: a model that outputs a\nnumber between 0 and 1, interpreted as a probability, by fitting a linear combination of covariates\nthrough a sigmoid function. If this is unfamiliar in detail, all you need for this lecture is: logistic\nregression takes a set of covariates <math data-tex=\"X\"><mi>X</mi></math> and produces <math data-tex=\"\\hat e(x)\\in(0,1)\"><mrow><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>∈</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, an estimated probability —\nexactly the shape of number the propensity score needs.</p>\n<h3>Prerequisite 4 — Weighted average, briefly</h3>\n<p>Several formulas in this lecture (stratification, IPW) are <strong>weighted averages</strong>: instead of averaging\nevery observation equally, each observation or group is multiplied by a &quot;weight&quot; reflecting its\nimportance or size, then summed. <math data-tex=\"\\sum_k w_k \\cdot v_k\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>k</mi></msub><msub><mi>w</mi><mi>k</mi></msub><mo>⋅</mo><msub><mi>v</mi><mi>k</mi></msub></mrow></math> with <math data-tex=\"\\sum_k w_k = 1\"><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>k</mi></msub><msub><mi>w</mi><mi>k</mi></msub><mo>=</mo><mn>1</mn></mrow></math> is a weighted average —\nknow this shape, because <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s stratification formula and <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s IPW formula are both instances of it.</p>\n<hr>\n</section><section id=\"causal-inference-22-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Lecture 21 established the theory: <math data-tex=\"P(Y\\mid X)\\ne P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≠</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, and identification requires\neither randomization or the right assumptions plus the right graphical structure. This lecture\n<strong>operationalizes</strong> that theory on one real dataset, in three acts:</p>\n<figure class=\"ascii\"><pre>Part 1 — Treatment effects\n   One dataset, two comparisons, opposite signs. What number are we even trying to compute?\n   (estimand/estimator/estimate; ITE/ATE/ATT/ATC/CATE)\n        │\n        ▼\nPart 2 — Identification\n   WHY do the two comparisons disagree? Selection bias, decomposed algebraically.\n   Which covariates fix it (confounders) and which break it further (mediators, colliders)?\n   The three assumptions (unconfoundedness, positivity, SUTVA) that must hold for\n   adjustment to work at all.\n        │\n        ▼\nPart 3 — Classical estimation\n   Six concrete recipes for computing an adjusted estimate — stratification, matching,\n   propensity-score weighting, regression adjustment, doubly robust estimation — each\n   scored against the SAME known $1,794 truth, so their real-world accuracy is directly\n   comparable, not just theoretically motivated.\n        │\n        ▼\n   Bridge to machine learning: every classical method rests on estimating one or both of\n   two &quot;nuisance functions&quot; — propensity e(x) and outcome μ(x) — which is exactly what\n   flexible ML models can replace hand-built formulas with (setting up the &quot;from classical\n   estimation to ML&quot; transition, presumably continued in Lecture 23).</pre></figure>\n<p>Because every method is tested against the <em>same</em> real, known answer, this lecture teaches causal\ninference less as a set of formulas to memorize and more as a series of <strong>empirically verifiable\nclaims</strong> — &quot;here's what happens to the number when we do X&quot; — which is unusual and worth taking\nadvantage of while studying it.</p>\n<hr>\n</section><section id=\"causal-inference-22-s3\" data-title=\"A Job-Training Experiment — the Dataset Everything Is Judged Against\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">A Job-Training Experiment — the Dataset Everything Is Judged Against</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><strong>The question:</strong> does a temporary paid job raise later earnings?</p>\n<p><strong>The setup:</strong> National Supported Work programme, mid-1970s. <math data-tex=\"T\"><mi>T</mi></math>: enrolled (1) or not (0). <math data-tex=\"Y\"><mi>Y</mi></math>: 1978\nearnings.</p>\n<p><strong>A coin flip decided enrolment.</strong> Trainees earned $6,349 (average), controls $4,555: <strong>gap\n$1,794.</strong></p>\n<p><em>&quot;The programme raised earnings by ≈ $1,794 per person. Coin flip made groups alike, so the gap is\nthe real effect.&quot;</em></p>\n<p>🧪 <strong>Baseline covariate balance, confirming the randomization worked:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Covariate</th>\n<th>Trainees (<math data-tex=\"T{=}1\"><mrow><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn></mrow></math>)</th>\n<th>Controls (<math data-tex=\"T{=}0\"><mrow><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn></mrow></math>)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Prior-year earnings</td>\n<td>$2,096</td>\n<td>$2,107</td>\n</tr>\n<tr>\n<td>Age (years)</td>\n<td>26</td>\n<td>25</td>\n</tr>\n<tr>\n<td>Share married</td>\n<td>19%</td>\n<td>15%</td>\n</tr>\n<tr>\n<td>No high-school degree</td>\n<td>71%</td>\n<td>84%</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Dots aligned: the raw $1,794 gap is the causal effect. This is the real effect; every later\nmethod is judged against it.&quot;</em></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why this dataset is used as a teaching device.</strong> Because the trainees and\ncontrols were assigned by a coin flip, they are — by the argument in Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a> — statistically\nidentical on <em>every</em> characteristic, observed or not, except treatment. This makes $1,794 a known,\ntrustworthy ground truth. The rest of the lecture repeatedly asks: <strong>if we pretend we didn't have\nthe coin flip, and instead had to recover this number from a non-randomized comparison, how close\ncould each method get?</strong></p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s4\" data-title=\"Two Estimates of One Treatment Effect\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Two Estimates of One Treatment Effect</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The same job-training data gives opposite signs under two comparisons.&quot;</em></p>\n<ul>\n<li><strong>Randomised trial:</strong> <math data-tex=\"\\text{ATT}\\approx+\\$1{,}794\"><mrow><mtext>ATT</mtext><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,794</mn></mrow></math>. Random assignment makes the gap causal.</li>\n<li><strong>Usually no coin flip.</strong> A non-randomised comparison — here, replacing the randomized control\ngroup with a survey-based comparison group drawn from the general population — gives:</li>\n</ul>\n<div class=\"mblk\"><math data-tex=\"\\hat\\Delta = \\mathbb{E}[Y\\mid T{=}1] - \\mathbb{E}[Y\\mid T{=}0] \\approx -\\$8{,}498\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mrow><mi mathvariant=\"normal\">Δ</mi><mspace></mspace></mrow><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>≈</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>$</mi><mn>8,498</mn></mrow></math></div>\n<p><strong>Opposite sign: the naive comparison says training <em>cut</em> earnings.</strong> Same programme, two answers.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This single contrast is the motivating puzzle for the entire remaining lecture.</strong> Nothing about\nthe <em>program</em> changed between these two numbers — only the comparison group did (a randomized\ncontrol group vs. a survey-drawn comparison group of people who didn't opt into the program). Every\ntool introduced from here on is aimed at explaining and then correcting exactly this kind of\ndiscrepancy.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s5\" data-title=\"Estimand, Estimator, Estimate — One Causal Number Is Really Three Things\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Estimand, Estimator, Estimate — One Causal Number Is Really Three Things</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;One causal number is really three things: the target, the rule, the answer.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Estimand</strong> (the target)</th>\n<th><strong>Estimator</strong> (the rule)</th>\n<th><strong>Estimate</strong> (the answer)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Definition</td>\n<td>The effect a decision asks for, fixed <em>before</em> any data. Here, training on earnings: <math data-tex=\"\\theta = \\mathbb{E}[Y(1)-Y(0)\\mid T{=}1]\"><mrow><mi>θ</mi><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>The procedure turning data into a number, <math data-tex=\"\\hat\\theta = g(\\text{data})\"><mrow><mover><mi>θ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>data</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>The value this dataset returns under that rule</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Two ways to be wrong: the wrong <strong>target</strong> or a <strong>careless rule</strong>.&quot;</em></p>\n<p>🧪 <strong>Worked example, made concrete on the running data:</strong> Using the naive (careless) rule\n<math data-tex=\"\\hat\\theta = g(\\text{data}) = -\\$8{,}498\"><mrow><mover><mi>θ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>data</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>$</mi><mn>8,498</mn></mrow></math> against the fixed estimand (target) <math data-tex=\"\\theta=\\$1{,}794\"><mrow><mi>θ</mi><mo>=</mo><mi>$</mi><mn>1,794</mn></mrow></math>\ngives a <strong>gap to target of $10,292</strong> — the estimator's answer landed over ten thousand dollars from\nthe number it was actually supposed to be estimating.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why this distinction matters practically.</strong> A large gap between an estimate and\nthe truth could mean the <em>procedure</em> was careless (a fixable estimator problem — e.g., forgetting to\nadjust for a confounder) or it could mean the <em>estimand itself</em> was wrong for the question being\nasked (e.g., computing an ATE when the business question actually needs an ATT). Diagnosing which\nfailure occurred is the necessary first step before trying to fix anything — this is exactly the\ndistinction <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>'s five estimands and <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>'s selection-bias decomposition are built to help you make.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s6\" data-title=\"Treatment-Effect Estimands — the Same Unit-Level Effect, Averaged Differently\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Treatment-Effect Estimands — the Same Unit-Level Effect, Averaged Differently</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The same unit-level effect, averaged over a different set of units.&quot;</em> All five estimands share the\nsame building block, the individual treatment effect <math data-tex=\"\\tau_i = Y_i(1) - Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — they differ only in\n<em>which units</em> get averaged over.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Estimand</th>\n<th>Formula</th>\n<th>Averaged over</th>\n<th>Interpretation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ITE</strong></td>\n<td><math data-tex=\"\\tau_i = Y_i(1)-Y_i(0)\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>One unit</td>\n<td><em>&quot;The effect we want for one unit. Never measured.&quot;</em></td>\n</tr>\n<tr>\n<td><strong>ATE</strong></td>\n<td><math data-tex=\"\\text{ATE}=\\mathbb{E}[Y(1)-Y(0)]\"><mrow><mtext>ATE</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>All units (~445 in this dataset)</td>\n<td><em>&quot;One policy set for the whole population.&quot;</em></td>\n</tr>\n<tr>\n<td><strong>ATT</strong></td>\n<td><math data-tex=\"\\text{ATT}=\\mathbb{E}[Y(1)-Y(0)\\mid T{=}1]\"><mrow><mtext>ATT</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>The 185 treated units only</td>\n<td><em>&quot;Retaining a programme for those who already take it.&quot;</em></td>\n</tr>\n<tr>\n<td><strong>ATC</strong></td>\n<td><math data-tex=\"\\text{ATC}=\\mathbb{E}[Y(1)-Y(0)\\mid T{=}0]\"><mrow><mtext>ATC</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>The 260 control units only</td>\n<td><em>&quot;Extending a programme to the currently untreated.&quot;</em> — &quot;what the 260 controls would have gained&quot;</td>\n</tr>\n<tr>\n<td><strong>CATE(<math data-tex=\"x\"><mi>x</mi></math>)</strong></td>\n<td><math data-tex=\"\\tau(x)=\\mathbb{E}[Y(1)-Y(0)\\mid X{=}x]\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td>Units sharing covariate value <math data-tex=\"x\"><mi>x</mi></math></td>\n<td><em>&quot;Targeting by subgroups. A group average, not one unit.&quot;</em></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — choosing the right estimand for a business question.</strong> ATT answers <em>&quot;was\nthis worth it, for the people who actually got it?&quot;</em> — the right estimand if you're deciding whether\nto <strong>keep running</strong> an existing, opt-in program. ATC answers <em>&quot;what would we gain by expanding this\nto people not currently getting it?&quot;</em> — the right estimand for an <strong>expansion</strong> decision. ATE answers\n<em>&quot;what if we mandated this for everyone?&quot;</em> — appropriate only if you can imagine forcing the whole\npopulation through it. CATE is the estimand behind <strong>personalization</strong>: which subgroup benefits most,\nfor targeting decisions.</p>\n</aside>\n<h3>4.1 Conditioning on a covariate — removing its imbalance</h3>\n<p><em>&quot;Hold a covariate fixed so it cannot explain the treated-control gap.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\tau(x) = \\mathbb{E}[Y(1)-Y(0)\\mid X{=}x]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p>Two equivalent uses of this same formula:</p>\n<ul>\n<li><strong>Within a slice:</strong> hold <math data-tex=\"X\"><mi>X</mi></math> constant so it cannot drive the gap — compute the effect <em>separately</em>\nwithin each value of <math data-tex=\"X\"><mi>X</mi></math>.</li>\n<li><strong>Balance the mix:</strong> reweight so both arms share the same <math data-tex=\"X\"><mi>X</mi></math> distribution: $\\sum_x\n\\hat\\tau(x)P(X{=}x)$ — average the per-slice effects back together, but weighted so the reweighted\npopulation looks the same on both arms.</li>\n</ul>\n<p><em>&quot;Either way <math data-tex=\"X\"><mi>X</mi></math> stops being a competing explanation. Per-slice = effect <strong>at</strong> <math data-tex=\"x\"><mi>x</mi></math> (heterogeneity);\none number assumes a <strong>constant</strong> effect.&quot;</em></p>\n<p>🧪 <strong>Worked example — splitting by marital status</strong> (within-slice view): ATE overall = <strong>$1,794</strong>.\nWithin &quot;Married&quot;: <strong>CATE = $3,709</strong>. Within &quot;Not married&quot;: <strong>CATE = $1,373</strong>.</p>\n<p>🧪 <strong>Worked example — splitting by age</strong> (balance-the-mix view): reweighting the control arm to\nmatch the treated arm's age distribution gives <strong>balanced estimate $1,802</strong> — very close to the\n$1,794 truth, with the underlying subgroup CATEs being <strong>$3,101 (age ≥ 25)</strong> and <strong>$370 (age &lt;\n25)</strong>.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight.</strong> The overall ATE ($1,794) is not a description of &quot;the effect everyone gets&quot; —\nit's an <em>average</em> over subgroups whose true effects can differ substantially ($3,709 vs. $1,373;\n$3,101 vs. $370). This heterogeneity is exactly what CATE is designed to surface, and it's also\nthe reason &quot;balance the mix&quot; reweighting recovers something very close to the true ATE: it forces\nthe comparison to be apples-to-apples within each subgroup before combining.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s7\" data-title=\"Selection Bias and Its Two Families\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Selection Bias and Its Two Families</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The treated and untreated differ for reasons other than the treatment, so the raw comparison is\ncontaminated.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Selection bias</strong> — groups differ <em>before</em> treatment, contaminating the raw gap.</p>\n</blockquote>\n<p>Two distinct sources, both producing selection bias:</p>\n<ul>\n<li><strong>(a) Groups unlike to begin with</strong> — the treated and control populations genuinely differ on\nrelevant characteristics before any treatment happens (e.g., a survey-drawn comparison group vs. an\nRCT control group).</li>\n<li><strong>(b) Analyst <em>creates</em> bias via a wrong control variable</strong> — adjusting for the wrong kind of\nvariable (covered fully in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§6.1\" role=\"link\" tabindex=\"0\">§6.1</a>'s mediator/collider discussion) manufactures bias that wasn't there\nto begin with.</li>\n</ul>\n<p>🧪 <strong>Worked example — how badly the groups differ, measured by SMD:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Covariate</th>\n<th>Trainees</th>\n<th>Survey controls</th>\n<th>|SMD|</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Earnings, '75 ($)</td>\n<td>$1,532</td>\n<td>$13,651</td>\n<td><strong>1.75</strong></td>\n</tr>\n<tr>\n<td>Earnings, '74 ($)</td>\n<td>$2,096</td>\n<td>$14,017</td>\n<td><strong>1.57</strong></td>\n</tr>\n<tr>\n<td>Share married</td>\n<td>19%</td>\n<td>71%</td>\n<td><strong>1.23</strong></td>\n</tr>\n<tr>\n<td>No high-school degree</td>\n<td>30%</td>\n<td>71%</td>\n<td><strong>0.90</strong></td>\n</tr>\n<tr>\n<td>Age (years)</td>\n<td>25.8</td>\n<td>33.2</td>\n<td><strong>0.80</strong></td>\n</tr>\n<tr>\n<td>Schooling (years)</td>\n<td>10.3</td>\n<td>12.0</td>\n<td><strong>0.68</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;SMD exceeds 1 on several rows&quot;</em> — far above the 0.1 rule-of-thumb threshold from Prerequisite 2,\nconfirming these groups are severely imbalanced before treatment even enters the picture. <em>&quot;Balance\nthe selected covariates: -$8,498 naive, none balanced → moves toward the truth +$1,794.&quot;</em></p>\n<h3>5.1 Decomposing the Naive Estimate</h3>\n<p><em>&quot;Balance the groups covariate by covariate and the estimate moves toward the truth.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\underbrace{\\mathbb{E}[Y\\mid T{=}1]-\\mathbb{E}[Y\\mid T{=}0]}_{\\text{naive}} = \\text{ATT} + \\underbrace{\\mathbb{E}[Y(0)\\mid T{=}1]-\\mathbb{E}[Y(0)\\mid T{=}0]}_{\\text{selection bias}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><munder><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>naive</mtext></munder></mrow><mo>=</mo><mtext>ATT</mtext><mo>+</mo><mrow><munder><munder><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>selection bias</mtext></munder></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> the naive gap you'd naturally compute splits, exactly, into two pieces\nadded together — the <strong>real causal effect on the treated</strong> (ATT), and a <strong>selection bias term</strong>\ncomparing what the <em>treated</em> group's untreated outcome <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> would have been to what the <em>control</em>\ngroup's actual untreated outcome <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is. The second term has nothing to do with the treatment's\neffect — it's purely the pre-existing gap between the two groups.</p>\n<ul>\n<li><strong>ATT:</strong> the real effect on the treated, <math data-tex=\"+\\$1{,}794\"><mrow><mo form=\"prefix\" stretchy=\"false\">+</mo><mi>$</mi><mn>1,794</mn></mrow></math>.</li>\n<li><strong>Selection bias:</strong> the baseline gap before training — <strong>controls already out-earned trainees.</strong></li>\n<li><strong>Balance a covariate, remove its share; close the gap, only the effect remains.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example — balancing covariates one at a time, watching the estimate move:</strong> <em>&quot;Family\n(a). Could adding more controls always help, or could a wrong one open a new gap?&quot;</em> — with all 8\ncovariates balanced, the estimate after balancing lands essentially at the true <strong>$1,794</strong>.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this decomposition is the algebraic proof of <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>'s puzzle.</strong> The naive $-8,498\ncomparison isn't &quot;wrong&quot; in some vague sense — it is <em>literally</em> $$1{,}794 + (\\text{a large\nnegative selection-bias term})$. Balancing covariates (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> onward gives the concrete recipes)\nworks by driving that second term toward zero, leaving only the first term — the actual causal\neffect — behind.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s8\" data-title=\"Good and Bad Controls\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Good and Bad Controls</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Adding a covariate can create bias that was not there before.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Opposite mistakes:</strong> confounding <strong>omits</strong> a cause; bad controls <strong>include</strong> the wrong variable.</p>\n</blockquote>\n<p>Using the running DAG <math data-tex=\"T\\to M\\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math> (mediator), <math data-tex=\"T\\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>Y</mi></mrow></math> (direct causal effect), <math data-tex=\"T\\to C\\leftarrow Y\"><mrow><mi>T</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>\n(collider):</p>\n<ul>\n<li><strong>Mediator</strong> <math data-tex=\"T\\to M\\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>M</mi><mo>→</mo><mi>Y</mi></mrow></math>: on the causal path. <strong>Controlling absorbs part of the effect.</strong></li>\n<li><strong>Collider</strong> <math data-tex=\"T\\to C\\leftarrow Y\"><mrow><mi>T</mi><mo>→</mo><mi>C</mi><mo stretchy=\"false\">←</mo><mi>Y</mi></mrow></math>: conditioning <strong>opens a spurious path</strong> — the exact collider-bias\nmechanism from Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>.</li>\n<li><strong>Even a clean trial breaks if you condition on a post-treatment variable.</strong></li>\n<li>A pure <strong>predictor of <math data-tex=\"T\"><mi>T</mi></math> only</strong> (unrelated to <math data-tex=\"Y\"><mi>Y</mi></math>): unbiased, but <strong>inflates variance</strong> — it costs\nyou statistical precision without introducing bias, a different and milder problem than the other\ntwo.</li>\n</ul>\n<p>🧪 <strong>Worked example, with the actual estimates:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Control choice</th>\n<th>Result on this dataset</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>No bad control (correctly adjust for confounders only)</td>\n<td><strong>estimate on truth $1,794</strong> — recovers the experimental truth</td>\n</tr>\n<tr>\n<td>Control for <math data-tex=\"M\"><mi>M</mi></math> (the mediator)</td>\n<td><strong>biased estimate -$110</strong></td>\n</tr>\n<tr>\n<td>Control for <math data-tex=\"C\"><mi>C</mi></math> (the collider)</td>\n<td><strong>biased estimate -$806</strong> — <em>&quot;collider opens a spurious path, fabricating a shift&quot;</em></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most expensive mistake this section warns against.</strong> <em>&quot;Adjust for confounders and\npredictors of <math data-tex=\"Y\"><mi>Y</mi></math>; never mediators, colliders, or post-treatment variables.&quot;</em> Both wrong-variable\nchoices swing the dataset's estimate substantially away from the $1,794 truth (to -$110 and -$806\nrespectively) — and critically, <strong>there is no purely statistical signal in the data that flags this\nas a mistake.</strong> Both bad-control estimates look like ordinary numbers; only knowledge of the causal\ngraph (is this variable a mediator? a collider? a confounder?) tells you which controls are safe.\nThis is why Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s chain/fork/collider classification is a prerequisite for this entire\nlecture, not optional background.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s9\" data-title=\"Unconfoundedness\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">Unconfoundedness</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">10 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Conditional on the recorded covariates, assignment is as good as random.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A trial <strong>buys</strong> comparability. Observational work has to <strong>assume</strong> it.&quot;</em></p>\n</blockquote>\n<blockquote class=\"aside-quote\">\n<p><strong>Unconfoundedness</strong> — given <math data-tex=\"X\"><mi>X</mi></math>, treatment carries no extra information on outcomes.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\{Y(0),Y(1)\\} \\perp T \\mid X\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>⟂</mo><mi>T</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi></mrow></math></div>\n<ul>\n<li><strong>Untestable:</strong> concerns the never-observed <math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> of the treated.</li>\n<li>An <strong>unrecorded cause <math data-tex=\"U\"><mi>U</mi></math></strong> drives both <math data-tex=\"T\"><mi>T</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>: an open <strong>back-door path</strong>.</li>\n<li><strong>Stronger <math data-tex=\"U\"><mi>U</mi></math> drifts the estimate further from truth. Data cannot say how much.</strong></li>\n</ul>\n<p>🧪 <strong>Worked demonstration:</strong> with hidden-cause strength set to &quot;none,&quot; the estimate sits exactly at\nthe truth: <strong>estimate $1,794</strong> matching <strong>truth +$1,794</strong>. As the strength of a simulated hidden\nconfounder <math data-tex=\"U\"><mi>U</mi></math> increases, the estimate drifts progressively away from $1,794 — and nothing in the\nobserved data itself signals that this drift is happening.</p>\n<figure class=\"iv\" id=\"iv-causal-inference-22-0\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;Hidden-confounder strength vs. estimate drift&quot;,&quot;concept&quot;:&quot;Unconfoundedness is untestable — the data can look exactly the same whether or not a hidden confounder exists&quot;,&quot;control&quot;:&quot;\\&quot;Strength of hidden cause U\\&quot; slider, from \\&quot;none\\&quot; to progressively stronger&quot;,&quot;observe&quot;:&quot;The estimate (starts at $1,794, matching the known truth) drifts away from the truth as the slider is dragged upward — with no signal anywhere in the observed data that this drift is happening&quot;,&quot;insight&quot;:&quot;A dataset with a strong hidden confounder and a dataset with none can produce identical-looking observed data — the gap between \\&quot;estimate\\&quot; and \\&quot;truth\\&quot; only becomes visible here because the slide is simulating a ground truth you would never actually have access to. In real observational work you cannot run this slider — you can only ever assume you're near \\&quot;none.\\&quot;&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows a DAG (T → Y, with an unobserved node U feeding a dashed back-door path into both T and Y) next to a \\&quot;Strength of hidden cause U\\&quot; slider and a live estimate readout. At \\&quot;none,\\&quot; estimate ($1,794) exactly matches truth (+$1,794); the reader can reason through why increasing U's strength would open the back-door path further and drift the estimate, exactly as this section's prose describes.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">Hidden-confounder strength vs. estimate drift</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Unconfoundedness is untestable — the data can look exactly the same whether or not a hidden confounder exists</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>\"Strength of hidden cause U\" slider, from \"none\" to progressively stronger</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The estimate (starts at $1,794, matching the known truth) drifts away from the truth as the slider is dragged upward — with no signal anywhere in the observed data that this drift is happening</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>A dataset with a strong hidden confounder and a dataset with none can produce identical-looking observed data — the gap between \"estimate\" and \"truth\" only becomes visible here because the slide is simulating a ground truth you would never actually have access to. In real observational work you cannot run this slider — you can only ever assume you're near \"none.\"</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows a DAG (T → Y, with an unobserved node U feeding a dashed back-door path into both T and Y) next to a \"Strength of hidden cause U\" slider and a live estimate readout. At \"none,\" estimate (<math><mrow><mn>1,794</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>e</mi><mi>x</mi><mi>a</mi><mi>c</mi><mi>t</mi><mi>l</mi><mi>y</mi><mi>m</mi><mi>a</mi><mi>t</mi><mi>c</mi><mi>h</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>r</mi><mi>u</mi><mi>t</mi><mi>h</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">+</mo></mrow></math>1,794); the reader can reason through why increasing U's strength would open the back-door path further and drift the estimate, exactly as this section's prose describes.</p>\n    </div>\n  </figure>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The single most important honesty point in the entire lecture.</strong> Unlike positivity (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>) or\nSUTVA (<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>), unconfoundedness is fundamentally <strong>untestable</strong> from the data you have — it concerns\n<math data-tex=\"Y(0)\"><mrow><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for the treated group, which by the fundamental problem of causal inference (Lecture 21 <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§3.2\" role=\"link\" tabindex=\"0\">§3.2</a>)\nis never observed for anyone in that group. Every adjustment method in <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a> <em>assumes</em>\nunconfoundedness; none of them can verify it. This is the sense in which observational causal\ninference always rests on an assumption a randomized trial doesn't need.</p>\n</aside>\n<h3>7.1 Positivity and Common Support</h3>\n<p><em>&quot;Where the two age distributions overlap, every trainee has a comparable control.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Positivity</strong> — both arms possible at every covariate value.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"0 &lt; P(T{=}1\\mid X{=}x) &lt; 1 \\quad\\text{for all } x\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mn>0</mn><mo>&lt;</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>&lt;</mo><mn>1</mn><mspace width=\"1em\"></mspace><mtext>for all </mtext><mi>x</mi></mrow></math></div>\n<ul>\n<li>Need a <strong>treated and untreated</strong> example of each kind of person.</li>\n<li>Where ages <strong>overlap</strong>, each trainee has a comparable control.</li>\n<li>An age with <strong>only one arm</strong> is <strong>extrapolated</strong>: no counterpart exists.</li>\n<li><strong>Outside common support, data alone cannot settle the question.</strong></li>\n</ul>\n<p>🧪 <strong>Worked example:</strong> at the real, <strong>unshifted baseline</strong> (&quot;shift control ages older by: 0 yrs&quot;),\nthe chart reads <em>&quot;trainees with a comparable control: <strong>185 of 185</strong>&quot;</em> — full positivity holds for\nthis covariate in the actual dataset; every trainee's age has at least one comparable control.\nThe slide then runs an interactive simulation: dragging the &quot;shift control ages older by&quot; slider to\n<strong>+9 years</strong> (an artificial, hypothetical shift of the control population's age distribution, not a\nproperty of the real data) shrinks the count to <em>&quot;trainees with a comparable control: <strong>118 of\n185</strong>&quot;</em> — 67 of 185 trainees (36%) would fall outside the age range where any comparable control\nexists, <strong>if</strong> the control population's ages were shifted this way. Shifting the slider progressively\nolder shrinks the green &quot;common support&quot; region and grows the red &quot;control-only ages&quot; /\n&quot;trainee-only ages&quot; regions directly on the chart — a visual, quantified demonstration that\npositivity is a <em>property of the specific data at hand</em> (which can hold at baseline and still be\nfragile to plausible shifts), not a theoretical abstraction.</p>\n<figure class=\"iv\" id=\"iv-causal-inference-22-1\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;Shift control ages older — positivity under stress&quot;,&quot;concept&quot;:&quot;Positivity (common support) can hold perfectly at baseline and still be fragile to a plausible population shift&quot;,&quot;control&quot;:&quot;\\&quot;Shift control ages older by\\&quot; slider, from 0 to +9 years&quot;,&quot;observe&quot;:&quot;The age-distribution histogram's shaded \\&quot;common support\\&quot; (green) region shrinks while the \\&quot;control-only\\&quot; / \\&quot;trainee-only\\&quot; (red) regions grow; the live count reads \\&quot;185 of 185\\&quot; at 0 years and drops to \\&quot;118 of 185\\&quot; at +9 years&quot;,&quot;insight&quot;:&quot;Positivity is not a yes/no property of a method — it's a property of the specific data at hand, and it can be excellent today (185/185 real trainees have a comparable control) while being one plausible demographic shift away from a serious violation (118/185, a 36% loss of common support). A reader who only sees the 185/185 baseline number would miss how fragile that overlap actually is.&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows an overlapping-histogram chart of trainee ages (orange) vs. control ages (teal), a live \\&quot;trainees with a comparable control: N of 185\\&quot; counter, and the \\&quot;shift control ages older by\\&quot; slider. At 0 years (the real, unshifted data) the counter reads 185 of 185 — full positivity holds. Dragging to +9 years (a simulated, hypothetical shift, not the real data) drops the counter to 118 of 185, exactly as described in the worked example above.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">Shift control ages older — positivity under stress</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Positivity (common support) can hold perfectly at baseline and still be fragile to a plausible population shift</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>\"Shift control ages older by\" slider, from 0 to +9 years</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The age-distribution histogram's shaded \"common support\" (green) region shrinks while the \"control-only\" / \"trainee-only\" (red) regions grow; the live count reads \"185 of 185\" at 0 years and drops to \"118 of 185\" at +9 years</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Positivity is not a yes/no property of a method — it's a property of the specific data at hand, and it can be excellent today (185/185 real trainees have a comparable control) while being one plausible demographic shift away from a serious violation (118/185, a 36% loss of common support). A reader who only sees the 185/185 baseline number would miss how fragile that overlap actually is.</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows an overlapping-histogram chart of trainee ages (orange) vs. control ages (teal), a live \"trainees with a comparable control: N of 185\" counter, and the \"shift control ages older by\" slider. At 0 years (the real, unshifted data) the counter reads 185 of 185 — full positivity holds. Dragging to +9 years (a simulated, hypothetical shift, not the real data) drops the counter to 118 of 185, exactly as described in the worked example above.</p>\n    </div>\n  </figure>\n<h3>7.2 SUTVA</h3>\n<p><em>&quot;A single well-defined treatment, with no interference between units.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>SUTVA (Stable Unit Treatment Value Assumption)</strong> — no interference across units; one well-defined\ntreatment version.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"Y_i = Y_i(T_i)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<ul>\n<li>If treatment <strong>leaks</strong> to a control, the gap <strong>understates</strong> the true effect.</li>\n<li>Randomisation fixes <em>assignment</em>, not effects transmitted <em>between</em> units.</li>\n<li><strong>Marketplace example:</strong> one seller's coupon empties a rival's stock.</li>\n</ul>\n<p>🧪 <strong>Worked example — interference between units, made concrete:</strong> if a treated unit's action\nlifts an &quot;untreated neighbour's&quot; outcome by 45% via spillover (interference), the <strong>measured $987\nunderstates the true $1,794</strong> — the interference doesn't just add noise, it systematically biases the\nmeasured effect <em>toward zero</em>, because part of the treatment's true impact leaked into the &quot;control&quot;\ngroup's outcome, shrinking the observed treated-vs-control gap.</p>\n<figure class=\"iv\" id=\"iv-causal-inference-22-2\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Spillover toggle — SUTVA violated&quot;,&quot;concept&quot;:&quot;SUTVA is a distinct failure mode from unconfoundedness/positivity — it's about one unit's outcome leaking into another unit's measured outcome, not about assignment or overlap&quot;,&quot;control&quot;:&quot;\\&quot;Interference between units\\&quot; toggle — \\&quot;No spillover\\&quot; vs. \\&quot;Spillover leaks\\&quot;&quot;,&quot;observe&quot;:&quot;With \\&quot;No spillover\\&quot; selected, the diagram shows the control unit's outcome as unaffected and the measured effect exactly equals the true effect ($1,794). Switching to \\&quot;Spillover leaks\\&quot; adds a dashed interference arrow from the treated unit to its \\&quot;untreated\\&quot; neighbour, the neighbour's outcome is lifted 45%, and the measured effect drops to $987 — a $807 understatement of the true $1,794&quot;,&quot;insight&quot;:&quot;SUTVA violations don't just add noise like a confounder would — they systematically bias the estimate toward zero (make a real effect look smaller than it is), because part of the treatment's true impact has leaked into the group you're using as your counterfactual baseline. Randomizing who gets treated fixes *assignment* bias; it does nothing to stop one unit's treatment from spilling onto another unit's outcome.&quot;,&quot;fallback&quot;:&quot;The lecture's own slide shows two treated/control unit icons connected by an \\&quot;interference between units\\&quot; toggle. \\&quot;No spillover\\&quot; (baseline): the control's outcome is marked \\&quot;unaffected,\\&quot; measured effect = true effect $1,794. \\&quot;Spillover leaks\\&quot; (toggled): a dashed arrow appears from treated to control labeled \\&quot;interference,\\&quot; the control's outcome is marked \\&quot;lifted 45%,\\&quot; and the readout changes to \\&quot;measured $987 understates true $1,794\\&quot; — exactly the numbers in the worked example above.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Spillover toggle — SUTVA violated</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>SUTVA is a distinct failure mode from unconfoundedness/positivity — it's about one unit's outcome leaking into another unit's measured outcome, not about assignment or overlap</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>\"Interference between units\" toggle — \"No spillover\" vs. \"Spillover leaks\"</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>With \"No spillover\" selected, the diagram shows the control unit's outcome as unaffected and the measured effect exactly equals the true effect (<math><mrow><mn>1,794</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>.</mi><mi>S</mi><mi>w</mi><mi>i</mi><mi>t</mi><mi>c</mi><mi>h</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>t</mi><mi>o</mi><mi>&quot;</mi><mi>S</mi><mi>p</mi><mi>i</mi><mi>l</mi><mi>l</mi><mi>o</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>l</mi><mi>e</mi><mi>a</mi><mi>k</mi><mi>s</mi><mi>&quot;</mi><mi>a</mi><mi>d</mi><mi>d</mi><mi>s</mi><mi>a</mi><mi>d</mi><mi>a</mi><mi>s</mi><mi>h</mi><mi>e</mi><mi>d</mi><mi>i</mi><mi>n</mi><mi>t</mi><mi>e</mi><mi>r</mi><mi>f</mi><mi>e</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>c</mi><mi>e</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi><mi>f</mi><mi>r</mi><mi>o</mi><mi>m</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>u</mi><mi>n</mi><mi>i</mi><mi>t</mi><mi>t</mi><mi>o</mi><mi>i</mi><mi>t</mi><mi>s</mi><mi>&quot;</mi><mi>u</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>&quot;</mi><mi>n</mi><mi>e</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>b</mi><mi>o</mi><mi>u</mi><mi>r</mi><mo separator=\"true\">,</mo><mi>t</mi><mi>h</mi><mi>e</mi><mi>n</mi><mi>e</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>b</mi><mi>o</mi><mi>u</mi><msup><mi>r</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>s</mi><mi>o</mi><mi>u</mi><mi>t</mi><mi>c</mi><mi>o</mi><mi>m</mi><mi>e</mi><mi>i</mi><mi>s</mi><mi>l</mi><mi>i</mi><mi>f</mi><mi>t</mi><mi>e</mi><mi>d</mi><mn>45</mn></mrow></math>987 — a <math><mrow><mn>807</mn><mi>u</mi><mi>n</mi><mi>d</mi><mi>e</mi><mi>r</mi><mi>s</mi><mi>t</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>m</mi><mi>e</mi><mi>n</mi><mi>t</mi><mi>o</mi><mi>f</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>t</mi><mi>r</mi><mi>u</mi><mi>e</mi></mrow></math>1,794</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>SUTVA violations don't just add noise like a confounder would — they systematically bias the estimate toward zero (make a real effect look smaller than it is), because part of the treatment's true impact has leaked into the group you're using as your counterfactual baseline. Randomizing who gets treated fixes *assignment* bias; it does nothing to stop one unit's treatment from spilling onto another unit's outcome.</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The lecture's own slide shows two treated/control unit icons connected by an \"interference between units\" toggle. \"No spillover\" (baseline): the control's outcome is marked \"unaffected,\" measured effect = true effect <math><mrow><mn>1,794.</mn><mi>&quot;</mi><mi>S</mi><mi>p</mi><mi>i</mi><mi>l</mi><mi>l</mi><mi>o</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>l</mi><mi>e</mi><mi>a</mi><mi>k</mi><mi>s</mi><mi>&quot;</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mi>o</mi><mi>g</mi><mi>g</mi><mi>l</mi><mi>e</mi><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi>a</mi><mi>d</mi><mi>a</mi><mi>s</mi><mi>h</mi><mi>e</mi><mi>d</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi><mi>a</mi><mi>p</mi><mi>p</mi><mi>e</mi><mi>a</mi><mi>r</mi><mi>s</mi><mi>f</mi><mi>r</mi><mi>o</mi><mi>m</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>t</mi><mi>o</mi><mi>c</mi><mi>o</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>l</mi><mi>l</mi><mi>a</mi><mi>b</mi><mi>e</mi><mi>l</mi><mi>e</mi><mi>d</mi><mi>&quot;</mi><mi>i</mi><mi>n</mi><mi>t</mi><mi>e</mi><mi>r</mi><mi>f</mi><mi>e</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>c</mi><mi>e</mi><mo separator=\"true\">,</mo><mi>&quot;</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>c</mi><mi>o</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><msup><mi>l</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-med-pad\">′</mo></msup><mi>s</mi><mi>o</mi><mi>u</mi><mi>t</mi><mi>c</mi><mi>o</mi><mi>m</mi><mi>e</mi><mi>i</mi><mi>s</mi><mi>m</mi><mi>a</mi><mi>r</mi><mi>k</mi><mi>e</mi><mi>d</mi><mi>&quot;</mi><mi>l</mi><mi>i</mi><mi>f</mi><mi>t</mi><mi>e</mi><mi>d</mi><mn>45</mn></mrow></math>987 understates true $1,794\" — exactly the numbers in the worked example above.</p>\n    </div>\n  </figure>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is a genuinely different failure mode from unconfoundedness and\npositivity.</strong> Unconfoundedness is about whether treatment assignment is related to outcomes;\npositivity is about whether both arms exist at every covariate value; SUTVA is about whether one\nunit's <em>outcome</em> can be affected by <em>another</em> unit's <em>treatment status</em> — a leakage/spillover\nproblem, not a confounding problem. All three must hold simultaneously for the adjustment methods\nin <a class=\"xref\" data-xref-lec=\"causal-inference-22\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> onward to correctly recover a causal effect.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-22-s10\" data-title=\"Stratification (Subclassification)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Stratification (Subclassification)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-22-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Partition on the covariates, then average the within-bucket gaps.&quot;</em></p>\n<blockquote class=\"aside-quote\">\n<p><strong>Stratification</strong> — split into <math data-tex=\"K\"><mi>K</mi></math> buckets on covariate <math data-tex=\"X\"><mi>X</mi></math>. Here: <strong>age, four bins.</strong></p>\n</blockquote>\n<ul>\n<li><strong>Partition, do not pair:</strong> every unit drops into one bin, treated and control pooled.</li>\n<li>Within a bin, <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is roughly constant, so <math data-tex=\"\\bar Y_{
