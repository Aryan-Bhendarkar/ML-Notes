/* ═══════════════════════════════════════════════════════════════════════
   STUDY LAMP — one mode, warm and dim.  Warm charcoal ground (never blue-
   black), warm paper-grey text at ~12:1, a single soft-amber accent for
   structure only: section numbers, your position, boxed results, progress.
   Links are a separate desaturated slate-blue so a link never looks like a
   heading.  The six callout hues keep one fixed meaning across every module.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#1B1A17; --surface:#242119; --surface-2:#16140F; --raised:#2C2820;
  --rule:#37332B; --rule-2:#4C4739;
  --ink:#EDE6D7; --ink-2:#B4AA95; --ink-3:#7C7361;
  --accent:#8CDCA6; --accent-dim:#4FA073; --accent-wash:#1E3025;
  --link:#93BFCE;
  --c-bg:#93B0D6; --c-key:#E6BA55; --c-warn:#E89170;
  --c-lab:#79C7A2; --c-int:#C0A6E4; --c-res:#A6CE8E; --c-recon:#D6A06E;
  --hl-1:#F0D488; --hl-2:#83D0C8; --hl-3:#F0A892; --hl-4:#C4AEF0;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 44px -20px rgba(0,0,0,.75);
  --wash:.14;
  --font-body:Charter,"Sitka Text","Iowan Old Style","Palatino Linotype",Cambria,Georgia,serif;
  --font-ui:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --font-mono:"Cascadia Code","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --measure:64ch;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:19px;line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-wash);color:#fff}
a{color:var(--link);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:#A9C6D2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px}
.skip:focus{left:12px;top:9px;z-index:100;background:var(--surface);padding:10px 14px;border:1px solid var(--accent);border-radius:8px}
button{font-family:var(--font-ui);color:inherit}

/* ── header — as little as possible ─────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.top-in{max-width:1680px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;gap:16px}
.home-l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.home-l:hover{color:var(--ink)}
.home-l b{color:var(--ink);font-weight:600}
.mprog{flex:1;max-width:340px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mprog-track{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.mprog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.ic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--rule-2);border-radius:8px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;padding:0}
.ic:hover{color:var(--ink);border-color:var(--accent)}
.readbar{height:2px;background:var(--accent);width:0}
.views{max-width:1680px;margin:0 auto;padding:1px 22px 0;display:flex;gap:1px;font-family:var(--font-ui)}
.view-t{font:inherit;font-size:11.5px;padding:7px 12px;border:0;border-bottom:2px solid transparent;background:none;
  color:var(--ink-3);cursor:pointer}
.view-t:hover{color:var(--ink-2)}
.view-t[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1680px;margin:0 auto;padding:0 22px;display:grid;
  grid-template-columns:274px minmax(0,1fr) 264px;gap:40px;align-items:start}
@media(max-width:1360px){.shell{grid-template-columns:250px minmax(0,1fr)}.rail-r{position:fixed;right:0;top:52px;bottom:0;
  width:300px;background:var(--surface);border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s;z-index:30;padding:20px}
  .rail-r.open{transform:none;box-shadow:var(--shadow)}}
@media(max-width:1040px){.shell{grid-template-columns:minmax(0,1fr);padding:0 16px}.rail-l{display:none}}
.rail{position:sticky;top:52px;max-height:calc(100vh - 58px);overflow-y:auto;padding:22px 4px 90px;
  font-family:var(--font-ui);font-size:12.5px;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
.rl-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:22px 0 8px;padding-left:10px}
.rl-h:first-child{margin-top:0}

/* ── the course spine (left rail) ──────────────────────────────────── */
.spine-mod{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--ink);padding:2px 10px 8px}
.lec{margin-bottom:1px}
.lec-b{width:100%;text-align:left;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid transparent;
  background:none;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:9px;line-height:1.3}
.lec-b:hover{background:var(--raised);color:var(--ink)}
.lec-b.on{background:var(--raised);color:var(--ink);border-color:var(--rule-2)}
.lec-n{font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;flex:none;
  width:17px;height:17px;border:1px solid var(--accent-dim);border-radius:4px;display:grid;place-items:center}
.lec-b.on .lec-n{background:var(--accent);color:#231a0b;border-color:var(--accent)}
.lec-lab{flex:1;font-weight:600}
.lec-bar{width:34px;height:3px;border-radius:2px;background:var(--rule);flex:none;overflow:hidden}
.lec-bar i{display:block;height:100%;background:var(--c-lab)}
.secs{list-style:none;margin:2px 0 8px;padding:0 0 0 12px;margin-left:14px;border-left:1px solid var(--rule);display:none}
.secs.open{display:block}
.secs a{display:flex;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:12px;line-height:1.4}
.secs a:hover{background:var(--raised);color:var(--ink)}
.secs a.cur{color:var(--accent);font-weight:650}
.secs a.done{color:var(--ink-3)}
.spine-part{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;
  padding:9px 8px 3px;margin-top:2px}
.spine-part:first-child{margin-top:0}
.secs a[data-kind="recap"]{color:var(--ink-3);font-style:italic;font-size:11px}
.secs a[data-kind="back"]{color:var(--ink-3)}
.secs a[data-kind="divider"]{color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;margin-top:6px;pointer-events:auto}
.secs a[data-kind="divider"] .n{display:none}
.secs a .n{flex:none;width:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.secs a.done .n::after{content:"✓";color:var(--c-lab)}
.secs a.cur .n{color:var(--accent)}
.othermod a{display:flex;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink-3);font-size:12px}
.othermod a:hover{background:var(--raised);color:var(--ink)}
.othermod .m-n{flex:none;font-variant-numeric:tabular-nums}
.othermod .m-p{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* ── right rail: your work only ────────────────────────────────────── */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-b{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;font:inherit;font-family:var(--font-ui);
  font-size:12px;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.phase-b:hover{border-color:var(--accent);color:var(--ink)}
.phase-b .box{width:15px;height:15px;border:1.5px solid var(--rule-2);border-radius:5px;flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:9px;color:transparent}
.phase-b.done{color:var(--ink)}
.phase-b.done .box{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.phase-b.done .box::after{content:"✓";font-weight:800}
.phase-b b{font-weight:650;display:block}
.phase-b small{color:var(--ink-3);font-weight:400}
.phase-b .go{margin-left:auto;color:var(--accent);flex:none;font-size:13px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{margin-bottom:4px}
.rlist button{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);font-size:11.5px;line-height:1.45;
  padding:6px 9px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;
  border-left:3px solid var(--h,var(--rule-2))}
.rlist button:hover{color:var(--ink);border-color:var(--accent)}
.rlist li[data-c="1"] button{--h:var(--hl-1)} .rlist li[data-c="2"] button{--h:var(--hl-2)}
.rlist li[data-c="3"] button{--h:var(--hl-3)} .rlist li[data-c="4"] button{--h:var(--hl-4)}
.empty{font-size:11.5px;color:var(--ink-3);font-style:italic;padding:0 10px;line-height:1.5}
.rr-close{display:none}
@media(max-width:1360px){.rr-close{display:block;position:absolute;top:12px;right:14px;background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}}

/* ── reading column ───────────────────────────────────────────────── */
main{padding:38px 0 200px;min-width:0;position:relative}
.doc{max-width:var(--measure)}
.lecture-head{margin:0 0 8px}
.lecture-head .kicker{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);
  text-transform:uppercase;margin-bottom:8px}
.lecture-head h1{font-family:var(--font-body);font-size:34px;font-weight:700;line-height:1.16;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lecture-head .meta{font-family:var(--font-ui);font-size:13px;color:var(--ink-3);margin-top:10px}
.frontmatter{margin:22px 0 8px;padding-bottom:4px}
.part-head{margin:3.4em 0 0}
.part-head h1{font-family:var(--font-body);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);margin:0 0 .2em;padding-bottom:.5em;border-bottom:2px solid var(--accent-dim)}
.part-head + section h2,.part-head h1 + section h2{border-top:0;padding-top:.3em;margin-top:.8em}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}

h2{font-family:var(--font-body);font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.008em;
  margin:2.9em 0 .55em;padding-top:1.15em;border-top:1px solid var(--rule);position:relative;
  display:flex;align-items:baseline;gap:12px;text-wrap:balance;scroll-margin-top:66px}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}
section[data-kind="recap"] h2{font-style:italic;color:var(--ink-2);font-size:22px}
section[data-kind="back"] h2{font-family:var(--font-ui);font-size:23px;font-weight:680}
section[data-kind="divider"]{margin:2.6em 0 0}
section[data-kind="divider"] h2{border-top:0;padding:0 0 .5em;margin:0;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:2px solid var(--accent-dim)}
section[data-kind="divider"] .sec-n,section[data-kind="divider"] .sec-meta{display:none}
.sec-n{position:absolute;left:-56px;top:calc(1.15em + .15em);font-family:var(--font-ui);font-size:12px;font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;width:44px;padding-top:.3em}
@media(max-width:1200px){.sec-n{position:static;border-left:2px solid var(--accent);padding:0 0 0 8px;width:auto;text-align:left;align-self:stretch;display:flex;align-items:center}}
.sec-t{flex:1;min-width:0}
.sec-meta{flex:none;display:flex;align-items:center;gap:9px;align-self:center}
.sec-time{font-family:var(--font-ui);font-size:11px;color:var(--ink-3);font-weight:500}
.sec-check{width:21px;height:21px;border:1.5px solid var(--rule-2);border-radius:6px;background:var(--surface);cursor:pointer;
  display:grid;place-items:center;font-size:11px;color:transparent;padding:0;transition:.12s;flex:none}
.sec-check:hover{border-color:var(--c-lab)}
.sec-check.on{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.sec-check.on::after{content:"✓";font-weight:800}
h3{font-family:var(--font-ui);font-size:18px;font-weight:660;margin:1.9em 0 .45em;line-height:1.3}
h4{font-family:var(--font-ui);font-size:15.5px;font-weight:660;color:var(--ink-2);margin:1.5em 0 .35em}
.doc p{margin:0 0 1.1em}
strong{font-weight:700;color:#F1EADD}
em{font-style:italic}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
sup,sub{line-height:0}

.doc ul,.doc ol{margin:0 0 1.15em;padding-left:1.4em}
.doc li{margin:.35em 0}
.doc li::marker{color:var(--ink-3)}
.doc ul{list-style:none;padding-left:1.2em}
.doc ul>li{position:relative}
.doc ul>li::before{content:"";position:absolute;left:-.95em;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent-dim)}
.doc dt{font-weight:700;font-family:var(--font-ui);font-size:15px;margin-top:.7em}
.doc dd{margin:.15em 0 1em}

code{font-family:var(--font-mono);font-size:.8em;background:var(--surface-2);padding:.12em .38em;border-radius:4px;border:1px solid var(--rule)}
.code{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:15px 17px;overflow-x:auto;margin:0 0 1.3em;line-height:1.6}
.code code{background:none;border:0;padding:0;font-size:13.5px}
figure.ascii{margin:0 0 1.4em;background:var(--surface-2);border:1px solid var(--rule);border-left:2px solid var(--accent-dim);
  border-radius:8px;padding:16px 18px;overflow-x:auto}
figure.ascii pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre;color:var(--ink-2)}

.table-wrap{overflow-x:auto;margin:0 0 1.4em}
.table-wrap.bound{margin-top:-.5em}
table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;font-size:12px;color:var(--ink-3);border-bottom-color:var(--rule-2)}
tbody tr:last-child td{border-bottom:0}
.symtab{border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.symtab td:first-child{font-family:var(--font-mono);white-space:nowrap;color:var(--ink)}

.mblk{display:block;overflow-x:auto;overflow-y:hidden;margin:1.5em 0;padding:6px 2px;text-align:center}
.mblk.bound{margin-bottom:.3em}
math{font-size:1.05em}
.mblk math{font-size:1.15em}
.mblk[data-boxed] .tml-fbox,.mblk[data-boxed] menclose{background:var(--accent-wash);border-color:var(--accent)!important}
.mfail{color:var(--c-warn);font-family:var(--font-mono);font-size:.85em}

/* callouts — left rule + faint wash, no box */
.callout{margin:0 0 1.4em;padding:4px 0 4px 16px;border-left:2px solid var(--k);--k:var(--ink-3)}
.callout>*:last-child{margin-bottom:0}
.callout-h{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--k);margin:0 0 5px;display:flex;align-items:center;gap:7px}
.callout-badge{font-size:12px}
.callout-bg{--k:var(--c-bg)} .callout-key{--k:var(--c-key)} .callout-warn{--k:var(--c-warn)}
.callout-lab{--k:var(--c-lab)} .callout-int{--k:var(--c-int)} .callout-res{--k:var(--c-res)} .callout-recon{--k:var(--c-recon)}
.callout-warn{border-left-width:3px;background:color-mix(in srgb,var(--c-warn) 7%,transparent);padding:8px 0 8px 16px}
.aside-quote{margin:0 0 1.3em;padding-left:15px;border-left:2px solid var(--rule-2);color:var(--ink-2);font-style:italic}
blockquote{margin:.7em 0 0;padding-left:13px;border-left:2px solid var(--rule-2);color:var(--ink-2)}

/* recall cards — flat */
.recall{border-bottom:1px solid var(--rule);margin:0 0 6px;padding-bottom:6px}
.recall-q{width:100%;text-align:left;font:inherit;font-family:var(--font-body);font-size:16.5px;padding:11px 4px;
  background:none;border:0;color:var(--ink);cursor:pointer;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.recall-q:hover{color:#fff}
.recall-n{font-family:var(--font-ui);font-size:10.5px;font-weight:750;color:var(--accent);flex:none;margin-top:4px;font-variant-numeric:tabular-nums;min-width:16px}
.recall-t{flex:1;min-width:0}
.recall-x{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);flex:none;margin-top:5px;font-weight:600}
.recall-a{padding:2px 4px 10px 31px;font-size:16.5px}
.recall-a>*:first-child{margin-top:10px}
.recall[data-open] .recall-x{color:var(--accent)}
.rate{display:flex;gap:7px;margin-top:14px;padding-top:11px;border-top:1px dashed var(--rule)}
.rate-b{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:14px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.rate-b:hover{border-color:var(--k,var(--accent));color:var(--k,var(--accent))}
.rate-b.on{background:var(--k);border-color:var(--k);color:#161310}
.rate-b[data-r="1"]{--k:var(--c-lab)} .rate-b[data-r="2"]{--k:var(--c-key)} .rate-b[data-r="3"]{--k:var(--c-warn)}
.recall[data-rated] .recall-n::after{font-size:9px;margin-left:2px}
.recall[data-rated="1"] .recall-n::after{content:"●";color:var(--c-lab)}
.recall[data-rated="2"] .recall-n::after{content:"●";color:var(--c-key)}
.recall[data-rated="3"] .recall-n::after{content:"●";color:var(--c-warn)}

.tryfirst{font-family:var(--font-ui);font-size:10.5px;font-weight:650;padding:3px 10px;border-radius:12px;
  border:1px solid var(--c-lab);color:var(--c-lab);background:none;cursor:pointer;margin-left:auto}
.tryfirst:hover{background:var(--c-lab);color:#12241a}
.masked{filter:blur(5px);opacity:.32;user-select:none;pointer-events:none}

/* interactive */
.iv{border:1px solid var(--rule-2);border-radius:10px;margin:0 0 1.6em;background:var(--surface);overflow:hidden}
.iv-cap{display:flex;align-items:baseline;gap:10px;padding:10px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.iv-kind{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:var(--ink-3);flex:none}
.iv-title{font-size:13.5px;font-weight:650;color:var(--ink)}
.iv-live{margin-left:auto;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--c-lab)}
.iv-mount{padding:16px}
.iv-fallback{padding:13px 15px 15px;font-family:var(--font-ui);font-size:13.5px}
.iv-meta{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.iv-row{display:contents}
.iv-meta dt{color:var(--ink-3);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.iv-meta dd{margin:0;color:var(--ink-2)}
.iv-fb-prose{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
.iv.is-live .iv-fallback{border-top:1px dashed var(--rule)}
.iv.is-live .iv-fb-prose,.iv.is-live .iv-meta{display:none}
.iv-ctl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:12px;font-family:var(--font-ui);font-size:12px}
.iv-ctl label{display:flex;flex-direction:column;gap:3px;color:var(--ink-2);font-weight:600}
.iv-ctl input[type=range]{width:170px;accent-color:var(--accent)}
.iv-ctl .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.iv svg{max-width:100%;height:auto;display:block}
.iv .plot-bg{fill:var(--surface-2)}
.iv .plot-axis{stroke:var(--rule-2);stroke-width:1}
.iv .plot-grid{stroke:var(--rule);stroke-width:1}
.iv .plot-label{fill:var(--ink-3);font-family:var(--font-ui);font-size:10px}
.iv .readout{font-family:var(--font-ui);font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.iv .readout b{color:var(--ink);font-variant-numeric:tabular-nums}

/* highlights */
.hl{border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  background:color-mix(in srgb,var(--h) 30%,transparent);
  box-shadow:inset 0 -.42em 0 color-mix(in srgb,var(--h) 16%,transparent)}
.hl[data-c="1"]{--h:var(--hl-1)} .hl[data-c="2"]{--h:var(--hl-2)} .hl[data-c="3"]{--h:var(--hl-3)} .hl[data-c="4"]{--h:var(--hl-4)}
#hlbar{position:fixed;z-index:60;display:none;gap:4px;background:var(--surface);border:1px solid var(--rule-2);border-radius:9px;padding:5px;box-shadow:var(--shadow)}
#hlbar.on{display:flex}
.sw{width:25px;height:25px;border-radius:6px;border:1px solid var(--rule-2);cursor:pointer;padding:0;font-family:var(--font-ui);
  font-size:10px;font-weight:700;color:#161310;display:grid;place-items:center}
.sw[data-c="1"]{background:var(--hl-1)} .sw[data-c="2"]{background:var(--hl-2)}
.sw[data-c="3"]{background:var(--hl-3)} .sw[data-c="4"]{background:var(--hl-4)} .sw[data-c="0"]{background:var(--surface-2);color:var(--ink-2)}

/* focus mode */
body.focus .rail,body.focus .views,body.focus .top-r{opacity:.08;pointer-events:none}
body.focus .doc{--measure:58ch}
body.focus section:not(.live){opacity:.25}
section{transition:opacity .25s}

/* module + phase views */
.view{display:none}
.view.on{display:block;max-width:70ch}
.view h1{font-family:var(--font-body);font-size:30px;font-weight:700;margin:0 0 6px}
.view-lead{font-family:var(--font-ui);font-size:14px;color:var(--ink-2);max-width:58ch;margin:0 0 26px}
.qcard{border:1px solid var(--rule);border-radius:9px;padding:13px 16px;margin-bottom:10px;background:var(--surface)}
.qcard.r3{border-left:3px solid var(--c-warn)} .qcard.r2{border-left:3px solid var(--c-key)}
.qcard .from{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.qcard .due{font-family:var(--font-ui);font-size:9.5px;color:var(--c-key);font-weight:700;text-transform:uppercase;letter-spacing:.05em;float:right}
.pill{font-family:var(--font-ui);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:10px;border:1px solid var(--k);color:var(--k);--k:var(--ink-3);white-space:nowrap}
.pill.intro{--k:var(--c-lab)} .pill.solid{--k:var(--c-key)} .pill.hard{--k:var(--c-warn)}
#gf{width:100%;font:inherit;font-family:var(--font-ui);font-size:15px;padding:10px 14px;border:1px solid var(--rule-2);
  border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:16px}
.phase-view-h{font-family:var(--font-ui);font-size:12px;color:var(--ink-3);margin:0 0 20px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
.phase-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.phase-nav button{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;
  border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.phase-nav button:hover{border-color:var(--accent);color:var(--ink)}
.phase-nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#231a0b}
.phase-nav .phase-mark{margin-left:auto;border-color:var(--c-lab);color:var(--c-lab)}

/* search */
#sd{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(4px);display:none;padding-top:11vh}
#sd.on{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--rule-2);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
#sq{width:100%;font:inherit;font-family:var(--font-ui);font-size:17px;padding:16px 20px;border:0;background:none;color:var(--ink);border-bottom:1px solid var(--rule)}
#sq:focus{outline:none}
#sr{max-height:58vh;overflow-y:auto;padding:7px}
.sri{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);padding:9px 13px;border:0;background:none;border-radius:8px;cursor:pointer;display:block;color:var(--ink)}
.sri:hover,.sri.sel{background:var(--accent-wash)}
.sri b{font-size:13.5px;font-weight:640;display:block}
.sri span{font-size:11px;color:var(--ink-3)}
.sri mark{background:color-mix(in srgb,var(--hl-1) 45%,transparent);color:inherit;border-radius:2px}
.sri .scope{font-size:9.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

dialog{border:1px solid var(--rule-2);border-radius:13px;background:var(--surface);color:var(--ink);padding:24px 28px;max-width:460px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.sh{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-family:var(--font-ui);font-size:13px;align-items:center}
.note{border-left:3px solid var(--c-key);background:color-mix(in srgb,var(--c-key) 8%,transparent);padding:9px 13px;border-radius:0 6px 6px 0;margin:.5em 0 1.1em;font-size:14px;font-family:var(--font-ui)}
.note-x{float:right;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 0 0 8px}
.addn{opacity:0;position:absolute;left:-26px;top:2px;width:19px;height:19px;border-radius:6px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:12px;line-height:1;padding:0;transition:opacity .12s}
.doc p{position:relative}
.doc p:hover .addn{opacity:1}
@media(max-width:1200px){.addn{display:none}}

/* ── review session ────────────────────────────────────────────────── */
.b-review{position:relative}
.b-review .due-dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--c-key);color:#1b1408;font-size:9px;font-weight:800;display:grid;place-items:center;font-family:var(--font-ui)}
#rev{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center}
#rev.on{display:flex}
.rev-top{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;padding:18px 22px;font-family:var(--font-ui);font-size:12px;color:var(--ink-3)}
.rev-prog{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.rev-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.rev-x{background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}
.rev-card{flex:1;width:100%;max-width:680px;padding:0 22px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.rev-kind{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.rev-kind span{color:var(--ink-3);font-weight:600;margin-left:8px}
.rev-front{font-size:22px;line-height:1.5;color:var(--ink)}
.rev-back{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule);font-size:17px;line-height:1.7;color:var(--ink-2)}
.rev-back.hidden{display:none}
.rev-back math{color:var(--ink)}
.rev-actions{width:100%;max-width:680px;padding:20px 22px 40px;display:flex;gap:10px;font-family:var(--font-ui)}
.rev-reveal{flex:1;padding:14px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.rev-reveal:hover{border-color:var(--accent)}
.rev-grade{flex:1;padding:14px 10px;border-radius:10px;border:1px solid var(--k);background:none;color:var(--k);
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.rev-grade:hover{background:var(--k);color:#161310}
.rev-grade small{font-size:10px;opacity:.7;font-weight:500}
.rev-grade[data-g="0"]{--k:var(--c-warn)} .rev-grade[data-g="1"]{--k:var(--c-key)} .rev-grade[data-g="2"]{--k:var(--c-lab)}
.rev-done{text-align:center;font-family:var(--font-ui);max-width:420px;padding:40px 22px}
.rev-done h2{font-family:var(--font-body);font-size:26px;margin:0 0 10px;color:var(--ink)}
.rev-done p{font-size:14px;color:var(--ink-2);line-height:1.7}
.rev-done .big{font-size:44px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>

</div>

<div id="hlbar" role="toolbar" aria-label="Highlight colour">
  <button class="sw" data-c="1" title="Remember this (1)"></button>
  <button class="sw" data-c="2" title="I understand this (2)"></button>

</div>

</div>

<dialog id="hd">
  <h3 style="margin:0 0 14px;font-family:var(--font-ui);font-size:16px">Keyboard</h3>

    Highlights, notes, ratings and progress live in this browser only.</p>
  <div style="margin-top:15px;display:flex;gap:8px">
    <button class="rate-b" id="b-exp">Export data</button>
    <button class="rate-b" id="b-imp">Import</button>
    <button class="rate-b" style="margin-left:auto" onclick="hd.close()">Close</button>
  </div>

Unicode range 1D49C to 1D4B5.

math {
  font-family: "Cambria Math", 'STIXTwoMath-Regular', 'NotoSansMath-Regular', math;
  font-style: normal;
  font-weight: normal;
  line-height: normal;
  font-size-adjust: none;
  text-indent: 0;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  direction: ltr;
  /* Prevent Firefox from omitting the dot on i or j. */
  font-feature-settings: "dtls" off;
}

math * {
  border-color: currentColor;
}

/* display: block is necessary in Firefox and Safari.
 * Not in Chromium, which recognizes display: "block math" written inline. */
 math.tml-display {
  display: block;
  width: 100%;
}

*.mathcal {
  /* NotoSans */
  font-feature-settings: 'ss01';
}

math .mathscr {
  font-family: "Temml";
}

mo.tml-prime {
  font-family: Temml;
}

/* Cramped superscripts in WebKit */
mfrac > :nth-child(2),
msqrt,
mover > :first-child {
  math-shift: compact
}

.menclose {
  display: inline-block;
  position: relative;
  padding: 0.5ex 0ex;
}
.tml-cancelto {
  display: inline-block;
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.5ex 0ex;
  background-color: currentColor;
  /* Use the SVG as an alpha mask (painted by background-color) */
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-position: 0 0;
          mask-position: 0 0;
}

@supports (-moz-appearance: none) {
  /* \vec w/o italic correction for Firefox */
  .tml-vec {
    transform: scale(0.75)
  }
  /* Fix \cancelto in Firefox */
  .ff-narrow {
    width: 0em;
  }
  .ff-nudge-left {
    margin-left: -0.2em;
  }
  /* Squash hidden mrows in \bordermatrix. Messes with centering, but necessary to squash. */
  .ff-squash mtd {
    display: block;
    height: 0;
  }
}

@supports (not (-moz-appearance: none)) {
  /* Chromium and WebKit */
  /* prime vertical alignment */
  mo.tml-prime {
    font-family: Temml;
  }
  /* Italic correction on superscripts */
  .tml-sml-pad {
    padding-left: 0.05em;
  }
  .tml-med-pad {
    padding-left: 0.10em;
  }
  .tml-lrg-pad {
    padding-left: 0.15em;
  }
}

@supports (-webkit-backdrop-filter: blur(1px)) {
  /* WebKit vertical & italic correction on accents */
  .wbk-acc {
    /* lower by x-height distance */
    transform: translate(0em, 0.431em);
  }
  .wbk-sml {
    transform: translate(0.07em, 0);
  }
  .wbk-sml-acc {
    transform: translate(0.07em, 0.431em);
  }
  .wbk-sml-vec {
    transform: scale(0.75) translate(0.07em, 0);
  }
  .wbk-med {
    transform: translate(0.14em, 0);
  }
  .wbk-med-acc {
    transform: translate(0.14em, 0.431em);
  }
  .wbk-med-vec {
    transform: scale(0.75) translate(0.14em, 0);
  }
  .wbk-lrg {
    transform: translate(0.21em, 0);
  }
  .wbk-lrg-acc {
    transform: translate(0.21em, 0.431em);
  }
  .wbk-lrg-vec {
    transform: scale(0.75) translate(0.21em, 0);
  }
}

/* \cancel & \phase use background images. Get them to print. */
menclose {
  -webkit-print-color-adjust: exact;  /* Chrome & Edge */
          print-color-adjust: exact;
}

/* Array cell justification in Firefox & WebKit */
.tml-right {
  text-align: right;
}
.tml-left {
  text-align: left;
}

/* For CD labels that grow to the left in Firefox and WebKit */
.tml-shift-left { margin-left:-200% }

<script id="DATA" type="application/json">{"slug":"causal-inference","name":"Causal Inference","lectures":[{"id":"causal-inference-21","num":"21","file":"causal-inference-01","kind":"lecture","title":"Causal Inference — Part 1: Foundations, Graphical Models, and do-Calculus","h1":"Causal Inference — Part 1: Foundations, Graphical Models, and do-Calculus","subtitle":"Foundations, Graphical Models, and do-Calculus","spineLabel":"Part 1","short":"Foundations, Graphical Models, and do-Calculus","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~53:23. Built from the raw capture in <code>output/Lecture_21 - Module 7 Causal Inference Part 1/</code> (53 raw frames), not <code>slides_deduped/</code> — see project memory <code>slides-deduped-is-lossy</code>. This\ndeck is unusually citation-dense for the course — every major concept is traced to its original\npaper (Simpson 1951, Rubin 1974, Pearl 1988/1995/2000, Dawid 1979, Verma &amp; Pearl 1988, Fisher\n1935) — and this file preserves those citations rather than dropping them. Instructor not named in\nthe webcam tile (same gap as some earlier lectures).</p>\n</blockquote>\n<hr>\n</div><section id=\"causal-inference-21-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>State precisely why <math data-tex=\"P(Y\\mid X) \\ne P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≠</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong>, and explain in your own words why a\nmodel that predicts well can still give the wrong answer to &quot;what happens if we act?&quot;</li>\n<li><strong>Diagnose Simpson's paradox</strong> in a real dataset — explain exactly how a confounder can flip the\nsign of an association between the aggregate and every subgroup.</li>\n<li><strong>Write and interpret the Rubin potential-outcomes switching equation</strong>, and explain why causal\ninference is fundamentally a missing-data problem.</li>\n<li><strong>Read a DAG as a factorization of a joint distribution</strong>, and distinguish what deleting an edge\nmeans (an intervention) from what conditioning on a node means (an observation).</li>\n<li><strong>Classify any three-node substructure as a chain, fork, or collider</strong>, and predict — correctly,\nincluding the counterintuitive collider case — whether conditioning on the middle node blocks or\nopens the path between the outer two.</li>\n<li><strong>Apply the three rules of do-calculus</strong> to reduce an interventional expression to a purely\nobservational one, and recognize when that reduction is (and isn't) possible.</li>\n<li><strong>State the backdoor and frontdoor adjustment formulas</strong>, explain when each applies, and choose\nbetween them given a specific causal graph.</li>\n<li><strong>Explain exactly what randomization buys you in an RCT</strong>, and name the four practical limitations\nthat push real problems back toward observational methods.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-21-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — Conditional probability and expectation, briefly</h3>\n<p>You need to be comfortable reading <math data-tex=\"P(Y\\mid X)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (&quot;the probability of <math data-tex=\"Y\"><mi>Y</mi></math> given <math data-tex=\"X\"><mi>X</mi></math>&quot;) and\n<math data-tex=\"\\mathbb{E}[Y\\mid X]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> (&quot;the expected value of <math data-tex=\"Y\"><mi>Y</mi></math> given <math data-tex=\"X\"><mi>X</mi></math>&quot;) as <em>statements about a fixed,\nunmanipulated population</em> — you are looking at whichever rows of a dataset happen to have that value\nof <math data-tex=\"X\"><mi>X</mi></math>, and asking what <math data-tex=\"Y\"><mi>Y</mi></math> looks like among them. This is the single most important habit to bring\ninto this lecture, because the entire subject exists to explain why that quantity is not always the\none you actually want.</p>\n<h3>Prerequisite 2 — What &quot;i.i.d.&quot; means, and why it matters here</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>i.i.d. (independent and identically distributed)</strong> — the standard assumption that every data\npoint is drawn independently from the same fixed underlying distribution.</p>\n<p><em>Why it exists:</em> almost every supervised learning guarantee (generalization bounds, consistency of\nthe empirical risk minimizer) depends on this assumption. <em>Why it matters here:</em> the moment someone\n<strong>acts</strong> on a model's output (a pricing team raises prices for items predicted to sell well), the\ndistribution the next batch of data is drawn from is no longer the one the model was trained on —\nthe i.i.d. assumption silently breaks, and this lecture is largely about what to do once it has.</p>\n</blockquote>\n<h3>Prerequisite 3 — Random variables and joint distributions</h3>\n<p>A <strong>joint distribution</strong> <math data-tex=\"P(X_1,\\ldots,X_p)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>X</mi><mi>p</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> describes the probability of every combination of values\nseveral random variables could simultaneously take. This lecture's graphical models section (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)\nis entirely about a compact way to <em>write down</em> a joint distribution using a graph — if joint\ndistributions are unfamiliar, know only that <math data-tex=\"P(X,Y,Z)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Y</mi><mo separator=\"true\">,</mo><mi>Z</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is &quot;the probability of seeing this particular\n<math data-tex=\"X\"><mi>X</mi></math>, this particular <math data-tex=\"Y\"><mi>Y</mi></math>, and this particular <math data-tex=\"Z\"><mi>Z</mi></math>, all at once.&quot;</p>\n<h3>Prerequisite 4 — Expectation notation, <math data-tex=\"\\mathbb{E}[\\cdot]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></h3>\n<p><math data-tex=\"\\mathbb{E}[Y]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> means &quot;the average value of <math data-tex=\"Y\"><mi>Y</mi></math>, weighted by how likely each value is.&quot; $\\mathbb{E}[Y\n\\mid T{=}1]<math data-tex=\"means &quot;the average value of\"><mrow><mi>m</mi><mi>e</mi><mi>a</mi><mi>n</mi><mi>s</mi><mi>&quot;</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>a</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>a</mi><mi>g</mi><mi>e</mi><mi>v</mi><mi>a</mi><mi>l</mi><mi>u</mi><mi>e</mi><mi>o</mi><mi>f</mi></mrow></math>Y<math data-tex=\", computed only over the subpopulation where\"><mrow><mo separator=\"true\">,</mo><mi>c</mi><mi>o</mi><mi>m</mi><mi>p</mi><mi>u</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>o</mi><mi>n</mi><mi>l</mi><mi>y</mi><mi>o</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>t</mi><mi>h</mi><mi>e</mi><mi>s</mi><mi>u</mi><mi>b</mi><mi>p</mi><mi>o</mi><mi>p</mi><mi>u</mi><mi>l</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mi>w</mi><mi>h</mi><mi>e</mi><mi>r</mi><mi>e</mi></mrow></math>T=1$.&quot; This\nnotation appears in nearly every formula in this lecture (the ATE, the do-calculus rules, the RCT\nformula) and always means exactly this.</p>\n<hr>\n</section><section id=\"causal-inference-21-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>This lecture answers one question with three progressively more powerful tools: <strong>given data where\nyou only ever <em>observed</em> what happened, how do you answer a question about what <em>would</em> happen if\nyou <em>acted</em>?</strong></p>\n<figure class=\"ascii\"><pre>Prediction (&quot;what will Y be?&quot;)          Causal question (&quot;what if we set X = x?&quot;)\n        │                                          │\n        │ P(Y | X)  ≠  P(Y | do(X))  — these are DIFFERENT quantities, in general\n        │\n        ▼\nWhy they differ: confounding — a common cause Z of both X and Y creates an association\nbetween X and Y even when X has no effect on Y at all (Simpson's paradox, §2)\n        │\n        ▼\nTwo formal languages for the same problem:\n        │\n        ├──▶ Potential Outcomes (Rubin) — define τ = Y(1) - Y(0) per unit; the\n        │    &quot;fundamental problem&quot; is that you only ever observe ONE of Y(1), Y(0) (§3)\n        │\n        └──▶ Structural Causal Models / DAGs (Pearl) — encode causal structure as a\n             graph; P(Y | do(X)) means &quot;delete X's incoming edges, then read off Y&quot; (§4)\n                        │\n                        ▼\n             Conditional independence in a graph — chains, forks, colliders (§5)\n                        │\n                        ▼\n             d-separation — a complete, mechanical procedure for reading every\n             conditional independence directly off the graph (§6)\n                        │\n                        ▼\n             do-calculus — three rules that let you REDUCE a do(·) expression to a\n             plain observational one, when the graph permits it (§7)\n                        │\n                        ▼\n             Backdoor / frontdoor adjustment — the two most common, ready-made\n             recipes built from those three rules (§8)\n                        │\n                        ▼\n             RCTs — sidestep the entire identification problem by randomizing,\n             but at a real cost in money, ethics, and generalizability (§9)</pre></figure>\n<p>Every later technique in this lecture is a way of answering the same question — <em>&quot;what is\n<math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>?&quot;</em> — with progressively fewer assumptions about what you're allowed to\nmanipulate directly.</p>\n<hr>\n</section><section id=\"causal-inference-21-s3\" data-title=\"Why Causality Matters\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">Why Causality Matters</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 The central distinction</h3>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Observing <math data-tex=\"P(Y\\mid X)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is not the same as intervening <math data-tex=\"P(Y\\mid\\text{do}(X))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.&quot;</em></p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"P(Y\\mid X) \\;\\ne\\; P(Y\\mid\\text{do}(X))\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.2778em\"></mspace><mo>≠</mo><mspace width=\"0.2778em\"></mspace><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Left: conditioning on observed data. Right: forcing <math data-tex=\"X\"><mi>X</mi></math> to a value.</em></p>\n<ul>\n<li><strong>Prediction</strong> optimizes <math data-tex=\"\\hat y\"><mover><mi>y</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math>; breaks when we change the system.</li>\n<li><strong>Causal question:</strong> <em>&quot;if we <strong>set</strong> <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>, how does <math data-tex=\"Y\"><mi>Y</mi></math> change?&quot;</em></li>\n<li>🧪 <strong>Example, as given:</strong> A model finds patients on Drug A have lower readmission. But sicker\npatients were prescribed Drug B. The correlation is confounded by severity.</li>\n</ul>\n<blockquote class=\"aside-quote\">\n<p><strong>do-operator, <math data-tex=\"\\text{do}(X{=}x)\"><mrow><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — notation for a <em>forced</em> intervention: every unit in the\npopulation is set to <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>, overriding whatever would normally have determined <math data-tex=\"X\"><mi>X</mi></math>, and everything\ndownstream is then observed.</p>\n<p><em>In everyday words:</em> <math data-tex=\"P(Y\\mid X{=}x)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> asks &quot;among people who happened to have <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math>, what does <math data-tex=\"Y\"><mi>Y</mi></math>\nlook like?&quot; <math data-tex=\"P(Y\\mid\\text{do}(X{=}x))\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> asks &quot;if I reached in and <em>set</em> everyone's <math data-tex=\"X\"><mi>X</mi></math> to <math data-tex=\"x\"><mi>x</mi></math>\n(regardless of what they would have chosen), what would <math data-tex=\"Y\"><mi>Y</mi></math> look like?&quot; These can give completely\ndifferent numbers whenever something else influences <em>both</em> who ends up with <math data-tex=\"X=x\"><mrow><mi>X</mi><mo>=</mo><mi>x</mi></mrow></math> <em>and</em> what <math data-tex=\"Y\"><mi>Y</mi></math>\nturns out to be.</p>\n<p><em>Why it exists:</em> it is the formal notation that separates &quot;what we happened to see&quot; from &quot;what\nwould happen if we acted,&quot; and — as the rest of this lecture shows — that gap is exactly where a\n<strong>confounder</strong> lives.</p>\n</blockquote>\n<h3>1.2 Three paradigms, contrasted directly</h3>\n<p><strong>Supervised learning:</strong> Learn <math data-tex=\"f:\\mathcal{X}\\to\\mathcal{Y}\"><mrow><mi>f</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi class=\"mathcal\">𝒳</mi><mo>→</mo><mi class=\"mathcal\">𝒴</mi></mrow></math> minimizing expected loss under\n<math data-tex=\"P_{\\text{data}}\"><msub><mi>P</mi><mtext>data</mtext></msub></math>.</p>\n<div class=\"mblk\"><math data-tex=\"\\hat f = \\underset{f\\in\\mathcal{F}}{\\arg\\min}\\ \\mathbb{E}_{(X,Y)\\sim P}\\big[\\ell(f(X),Y)\\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>f</mi><mo stretchy=\"false\" class=\"chr-lrg wbk-lrg-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><mrow><munder><mrow><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></mrow><mrow><mi>f</mi><mo>∈</mo><mi class=\"mathcal\">ℱ</mi></mrow></munder></mrow><mtext> </mtext><msub><mi>𝔼</mi><mrow><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">(</mo><mi>X</mi><mo separator=\"true\">,</mo><mi>Y</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>∼</mo><mi>P</mi></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><mi>ℓ</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>f</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mi>Y</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<ul>\n<li>Assumes data is i.i.d. from a fixed distribution <math data-tex=\"P\"><mi>P</mi></math>.</li>\n<li>Optimizes a single objective (accuracy, AUC, MSE).</li>\n<li><strong>No notion of actions, interventions, or counterfactuals.</strong></li>\n<li><strong>Breaks when <math data-tex=\"P\"><mi>P</mi></math> shifts due to deployment decisions</strong> (covariate shift, concept drift).</li>\n<li>🧪 <strong>Example:</strong> A demand forecast predicts sales accurately. But when the pricing team <strong>acts</strong> on\nit (raises price for high-demand items), the input distribution changes and the forecast degrades.</li>\n</ul>\n<p><strong>Causal inference:</strong> Estimate effects of interventions from observational (or experimental) data.</p>\n<div class=\"mblk\"><math data-tex=\"\\tau = \\mathbb{E}[Y(1)-Y(0)] = \\mathbb{E}[Y\\mid\\text{do}(T{=}1)] - \\mathbb{E}[Y\\mid\\text{do}(T{=}0)]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>τ</mi><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<ul>\n<li>Target is a <strong>treatment effect</strong>, not a prediction.</li>\n<li>Requires <strong>identification</strong>: assumptions that link the causal quantity to a statistical one that\ncan actually be computed from data.</li>\n<li><strong>Invariant under intervention by construction</strong> — this is the entire point: a correctly identified\ncausal effect does not degrade the way the demand forecast above did.</li>\n<li><strong>Two frameworks:</strong> potential outcomes (Rubin) and structural causal models (Pearl) — the two this\nlecture builds, in <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> and <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a> respectively.</li>\n<li>🧪 <strong>Example:</strong> Does a new blood-pressure medication reduce stroke risk? Estimate <math data-tex=\"\\tau\"><mi>τ</mi></math> from an RCT\nor, when randomization is infeasible, from observational EHR (electronic health record) data with\nappropriate adjustment.</li>\n</ul>\n<p><strong>Reinforcement learning:</strong> Learn a policy <math data-tex=\"\\pi\"><mi>π</mi></math> that maximizes cumulative reward through sequential\ndecisions.</p>\n<div class=\"mblk\"><math data-tex=\"\\pi^* = \\underset{\\pi}{\\arg\\max}\\ \\mathbb{E}_\\pi\\!\\left[\\sum_{t=0}^{T}\\gamma^t R_t\\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>π</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mo>=</mo><mrow><munder><mrow><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mi>max</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></mrow><mi>π</mi></munder></mrow><mtext> </mtext><msub><mi>𝔼</mi><mi>π</mi></msub><mrow style=\"margin-left:-0.1667em;\"></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><mi>T</mi></munderover></mrow><msup><mi>γ</mi><mi>t</mi></msup><msub><mi>R</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<ul>\n<li>Agent interacts with an environment over time.</li>\n<li>Actions affect future states (sequential, non-i.i.d.).</li>\n<li>Exploration/exploitation trade-off.</li>\n<li><strong>Uses causal structure implicitly</strong> (actions cause state transitions).</li>\n<li>🧪 <strong>Example:</strong> An RL agent decides daily replenishment quantities for a warehouse. Each decision\naffects future inventory and costs. <strong>Off-policy evaluation (a causal problem)</strong> is needed before\ndeploying a new policy.</li>\n</ul>\n<h3>1.3 Reconciliation — same data, different questions</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Supervised ML</strong></th>\n<th><strong>Causal Inference</strong></th>\n<th><strong>RL</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Question</td>\n<td>What will <math data-tex=\"Y\"><mi>Y</mi></math> be?</td>\n<td>What if we set <math data-tex=\"T\"><mi>T</mi></math>?</td>\n<td>Which action sequence?</td>\n</tr>\n<tr>\n<td>Target</td>\n<td><math data-tex=\"\\mathbb{E}[Y\\mid X]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td><math data-tex=\"\\mathbb{E}[Y\\mid\\text{do}(T)]\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mtext>do</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n<td><math data-tex=\"V^\\pi = \\mathbb{E}_\\pi[\\sum\\gamma^tR_t]\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mo>=</mo><msub><mi>𝔼</mi><mi>π</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mo movablelimits=\"false\">∑</mo><msup><mi>γ</mi><mi>t</mi></msup><msub><mi>R</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></td>\n</tr>\n<tr>\n<td>Data</td>\n<td>i.i.d. samples</td>\n<td>Obs. or experimental</td>\n<td>Trajectories</td>\n</tr>\n<tr>\n<td>Key challenge</td>\n<td>Generalization</td>\n<td><strong>Identification</strong></td>\n<td>Exploration</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>CI appears inside RL</strong> (off-policy evaluation) <strong>and inside ML</strong> (domain adaptation, fairness).</li>\n<li><strong>All three share estimation machinery:</strong> IPW (inverse propensity weighting), doubly-robust\nestimators, semiparametric efficiency.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this table is the thesis of the whole &quot;motivation&quot; section.</strong> These three fields\nare not separate disciplines that happen to share notation; they are three different <em>questions</em>\nasked of related kinds of data, and causal inference's central machinery (identification,\nconfounding adjustment) shows up as a genuine subroutine inside both of the other two — off-policy\nevaluation in RL and domain-shift/fairness analysis in supervised ML are, underneath, causal\ninference problems in disguise.</p>\n</aside>\n<h3>Knowledge check — correlation or causation?</h3>\n<p>The lecture poses three statements as a self-check, without revealing worked answers on-screen — work\nthrough each using the definitions above before reading on:</p>\n<ol>\n<li><em>&quot;Countries spending more on healthcare have higher life expectancy.&quot;</em></li>\n<li><em>&quot;In an RCT, patients receiving the new antibiotic cleared infection 2 days faster.&quot;</em></li>\n<li><em>&quot;Factories that adopted predictive maintenance had 15% fewer breakdowns last year.&quot;</em></li>\n</ol>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Working through it.</strong> Statement 2 is the only one built from <em>randomization</em> — an RCT\nguarantees <math data-tex=\"T\\perp\\{Y(0),Y(1)\\}\"><mrow><mi>T</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>Y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math> (<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>), so the observed difference is a valid causal effect: the new\nantibiotic <em>causes</em> faster clearance. Statements 1 and 3 are both <strong>observational</strong> associations\nwith an obvious confounder available: wealthier countries can afford both more healthcare spending\n<em>and</em> have other life-expectancy-improving factors (diet, sanitation, education) — spending and life\nexpectancy could easily share a common cause without spending having a large direct effect.\nSimilarly, factories that <em>adopt</em> predictive maintenance may systematically differ (better-funded,\nbetter-managed, newer equipment) from factories that don't — the 15% figure is a correlation between\n<strong>adopting the practice</strong> and <strong>fewer breakdowns</strong>, not necessarily a measurement of the practice's\nisolated causal effect. Both 1 and 3 need the adjustment machinery in <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a> (or an RCT) before their\nnumbers can be read causally.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s4\" data-title=\"Correlation ≠ Causation\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Correlation ≠ Causation</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A confounder <math data-tex=\"Z\"><mi>Z</mi></math> induces <math data-tex=\"\\rho_{XY}\\ne0\"><mrow><msub><mi>ρ</mi><mrow><mi>X</mi><mi>Y</mi></mrow></msub><mo>≠</mo><mn>0</mn></mrow></math> even when <math data-tex=\"X\\not\\to Y\"><mrow><mi>X</mi><mo>↛</mo><mi>Y</mi></mrow></math>.&quot;</em></p>\n</blockquote>\n<h3>2.1 Spurious correlation — firefighters vs. property damage</h3>\n<p>A scatter plot of firefighters deployed vs. property damage shows a strong, clean positive\nrelationship. <em>&quot;Larger fires cause both more firefighters and more damage. Sending fewer firefighters\nwould <strong>increase</strong> damage.&quot;</em> The confounder here is <strong>fire severity</strong> — it drives both axes of the\nplot simultaneously, producing a strong correlation between two quantities where intervening on one\n(sending fewer firefighters) would not reduce, and would likely worsen, the other.</p>\n<h3>2.2 Simpson's Paradox — hospital recovery</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Simpson's paradox</strong> — a pattern where an association observed in the aggregate population\n<strong>reverses</strong> when the same population is broken into subgroups, or vice versa. Named for Simpson\n(1951), <em>&quot;The Interpretation of Interaction in Contingency Tables.&quot;</em></p>\n</blockquote>\n<p>The lecture's example, hospital recovery rates:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Aggregate</strong></th>\n<th><strong>Mild cases</strong></th>\n<th><strong>Severe cases</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hospital A</td>\n<td><strong>70%</strong></td>\n<td>93%</td>\n<td>73%</td>\n</tr>\n<tr>\n<td>Hospital B</td>\n<td><strong>80%</strong></td>\n<td>87%</td>\n<td>69%</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Hospital A treats more severe patients.&quot;</em></p>\n<aside class=\"callout callout-lab\"><p class=\"callout-h\"><span class=\"callout-badge\">🧪</span>Worked example</p><p><strong>Working through the <em>qualitative</em> mechanism (an illustrative reconstruction — the slide shows\nonly the percentages above, no raw counts).</strong> Suppose Hospital A sees mostly severe cases (say, 800\nsevere patients and 200 mild) while Hospital B sees mostly mild cases (say, 200 severe and 800\nmild). If Hospital A had the <strong>higher</strong> recovery rate in <em>both</em> the mild subgroup and the severe\nsubgroup, its aggregate rate could still come out <strong>lower</strong> than Hospital B's simply because\nHospital A's patient mix is weighted much more heavily toward the harder-to-treat severe category,\npulling its blended average down further than Hospital B's easier mix pulls Hospital B's average\ndown. This is the general <em>mechanism</em> Simpson's paradox relies on — a confounder (case severity)\ncorrelated with both which hospital a patient ends up at and the outcome.</p>\n<p>⚠️ <strong>verify this — the slide's own numbers are themselves arithmetically inconsistent, not just an\nunreconstructed teaching device.</strong> An aggregate rate must always lie <em>between</em> its subgroup rates\n(it is a weighted average of them). But <code>slide_032.jpg</code>'s own aggregate figure for Hospital A (70%)\nsits <em>below both</em> of Hospital A's own subgroup rates (93% mild, 73% severe) — no patient-count split\nwhatsoever could reproduce a 70% aggregate from subgroups of 93% and 73% (the true weighted average\nwould always be somewhere between 73% and 93%). The 800/200 counts above were chosen only to\nillustrate the <em>direction</em> of the mechanism (a severity-skewed mix can pull an aggregate below where\nnaive intuition expects) — plugging them into the slide's own subgroup rates actually yields ≈77%\n(mild-heavy weighting would be needed for ≈83%), not the slide's stated 70%, confirming the\ninconsistency is in the source slide itself, not an error introduced here. Treat the qualitative\nlesson (case-mix confounding can reverse an aggregate comparison) as sound, but do not treat the\nspecific &quot;70%&quot; as arithmetically derivable from 73%/93% — it isn't, on any patient split.</p>\n</aside>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight.</strong> Case severity is the confounder <math data-tex=\"Z\"><mi>Z</mi></math>: it affects <em>both</em> which hospital a patient\nis more likely to end up at (severe cases may be preferentially referred to Hospital A, a more\nspecialized center) <em>and</em> the outcome <math data-tex=\"Y\"><mi>Y</mi></math> directly (severe cases are simply harder to treat,\nregardless of hospital). Comparing raw aggregate recovery rates conflates &quot;which hospital is\nbetter&quot; with &quot;which hospital sees harder cases&quot; — exactly the trap Simpson's paradox names. The fix\nis to compare <strong>within</strong> severity strata (which the mild/severe breakdown already does), or to use\nthe adjustment formulas in <a class=\"xref\" data-xref-lec=\"causal-inference-21\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>.</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Where people get confused.</strong> Simpson's paradox is not a statistical anomaly or a rare edge\ncase — it is the <em>direct, generic consequence</em> of a confounder that is correlated with the exposure\nat unequal rates across subgroups. Any time group sizes and outcome rates both vary across strata,\nthe aggregate can reverse the within-stratum pattern. The lesson is structural: <strong>always ask what\nvariable determines both who gets the treatment/exposure and what the outcome tends to be</strong>, before\ntrusting an aggregate comparison.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-21-s5\" data-title=\"Potential Outcomes Framework\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Potential Outcomes Framework</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-21-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>Rubin causal model</strong> — formalizes counterfactuals: every unit <math data-tex=\"i\"><mi>i</mi></math> has <em>two</em> potential outcomes,\n<math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (what would happen if treated) and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (what would happen if not treated), only one of\nwhich is ever actually observed. Rubin (1974), <em>&quot;Estimating causal effects of treatments in\nrandomized and nonrandomized studies.&quot;</em></p>\n</blockquote>\n<h3>3.1 The switching equation</h3>\n<div class=\"mblk\"><math data-tex=\"Y_i = T_i\\cdot Y_i(1) + (1-T_i)\\cdot Y_i(0)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><mo>⋅</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>Switching equation: observed outcome depends on assignment <math data-tex=\"T_i\\in\\{0,1\\}\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>∈</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>.</em></p>\n<p><strong>Words before symbols:</strong> the outcome you actually <em>see</em> for unit <math data-tex=\"i\"><mi>i</mi></math> is just whichever potential\noutcome corresponds to the treatment that unit actually received — if <math data-tex=\"T_i=1\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>1</mn></mrow></math> (treated), you see\n<math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>; if <math data-tex=\"T_i=0\"><mrow><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>0</mn></mrow></math> (untreated), you see <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. The equation is a bookkeeping device: it says\n&quot;the observed <math data-tex=\"Y\"><mi>Y</mi></math> is a <em>selector</em> that reveals one of the two potential outcomes and hides the\nother,&quot; nothing more.</p>\n<h3>3.2 The individual treatment effect and the fundamental problem</h3>\n<div class=\"mblk\"><math data-tex=\"\\tau_i = Y_i(1) - Y_i(0) \\quad\\text{(never jointly observed)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>τ</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"1em\"></mspace><mtext>(never jointly observed)</mtext></mrow></math></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The fundamental problem of causal inference, stated directly.</strong> <em>&quot;Only one potential outcome\nper unit is observed. Causal inference is a missing-data problem.&quot;</em> You can never compute <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math>\nfor any single unit <math data-tex=\"i\"><mi>i</mi></math>, because you never see both <math data-tex=\"Y_i(1)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"Y_i(0)\"><mrow><msub><mi>Y</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for the same person at the\nsame time — the other one is, by construction, a counterfactual that did not happen. Every method in\nthis lecture is a strategy for estimating some <em>aggregate</em> of <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math> across many units, without\never needing any single unit's individual <math data-tex=\"\\tau_i\"><msub><mi>τ</mi><mi>i</mi></msub></math>.</p>\n</aside>\n<h3>3.3 Three aggregate estimands</h3>\n<div class=\"mblk bound\"><math data-tex=\"\\text{ATE} = \\mathbb{E}[\\tau_i] \\qquad \\text{ATT} = \\mathbb{E}[\\tau_i\\mid T_i{=}1] \\qquad \\text{CATE}(x) = \\mathbb{E}[\\tau_i\\mid X_i{=}x]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>ATE</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mspace width=\"2em\"></mspace><mtext>ATT</mtext><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>T</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mspace width=\"2em\"></mspace><mtext>CATE</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>τ</mi><mi>i</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>X</mi><mi>i</mi></msub><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ATE</strong></td>\n<td>&quot;average treatment effect&quot;</td>\n<td>The average effect across the <em>whole</em> population, treated and untreated alike</td>\n</tr>\n<tr>\n<td><strong>ATT</strong></td>\n<td>&quot;average treatment effect on the treated&quot;</td>\n<td>The average effect, but only among units that <em>actually</em> received treatment</td>\n</tr>\n<tr>\n<td><strong>CATE(<math data-tex=\"x\"><mi>x</mi></math>)</strong></td>\n<td>&quot;conditional average treatment effect&quot;</td>\n<td>The average effect <em>within</em> the subgroup defined by covariate value <math data-tex=\"X{=}x\"><mrow><mi>X</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mi>x</mi></mrow></math> — a personalized or subgroup-specific effect</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — why three, not one.</strong> ATE answers &quot;should this treatment be rolled out to\neveryone?&quot; ATT answers &quot;for the people who got it, did it actually help?&quot; (useful when treatment\nassignment wasn't random, so the treated group may differ systematically from the general\npopulation). CATE answers &quot;for a person with <em>these specific characteristics</em>, how much would this\nhelp?&quot; — the estimand behind personalized/precision interventions. They can differ substantially\nwhenever treatment effects vary across the population and treatment assignment corr
