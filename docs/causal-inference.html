z = φ(x)</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"dee53fb425842a954-flowchart-H1-4\" data-look=\"classic\" transform=\"translate(443.890625, 27.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-71.984375\" y=\"-19.75\" width=\"143.96875\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-51.984375, -9.75)\"><rect></rect><foreignObject width=\"103.96875\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>treatment head h₁</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"dee53fb425842a954-flowchart-M1-5\" data-look=\"classic\" transform=\"translate(578.9140625, 27.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-32.9453125\" y=\"-19.75\" width=\"65.890625\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-12.9453125, -9.75)\"><rect></rect><foreignObject width=\"25.890625\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>μ̂₁(x)</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"dee53fb425842a954-flowchart-HE-7\" data-look=\"classic\" transform=\"translate(443.890625, 97.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-66.46875\" y=\"-19.75\" width=\"132.9375\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-46.46875, -9.75)\"><rect></rect><foreignObject width=\"92.9375\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>propensity head</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"dee53fb425842a954-flowchart-E-8\" data-look=\"classic\" transform=\"translate(578.9140625, 97.25)\"><rect class=\"basic label-container\" style=\"\" x=\"-30.3125\" y=\"-19.75\" width=\"60.625\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-10.3125, -9.75)\"><rect></rect><foreignObject width=\"20.625\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>ê(x)</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"dee53fb425842a954-flowchart-H0-10\" data-look=\"classic\" transform=\"translate(443.890625, 166.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-64.171875\" y=\"-19.75\" width=\"128.34375\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-44.171875, -9.75)\"><rect></rect><foreignObject width=\"88.34375\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>control head h₀</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"dee53fb425842a954-flowchart-M0-11\" data-look=\"classic\" transform=\"translate(578.9140625, 166.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-33.0390625\" y=\"-19.75\" width=\"66.078125\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-13.0390625, -9.75)\"><rect></rect><foreignObject width=\"26.078125\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>μ̂₀(x)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"dee53fb425842a954-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"dee53fb425842a954-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"dee53fb425842a954-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<p><strong>Why add a propensity head at all, when the goal is the outcome heads <math data-tex=\"\\hat\\mu_0,\\hat\\mu_1\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo separator=\"true\">,</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub></mrow></math>?</strong>\nPredicting <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is an <em>auxiliary task</em> — the representation <math data-tex=\"\\phi(x)\"><mrow><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is trained so that it's\nsimultaneously useful for predicting the outcome <strong>and</strong> the treatment assignment. This is a form\nof multi-task learning: forcing <math data-tex=\"\\phi(x)\"><mrow><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> to retain enough information to predict <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> prevents\nthe representation from over-compressing away exactly the covariates that matter for confounding\nadjustment — the same covariates the propensity-score machinery in <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §11\" role=\"link\" tabindex=\"0\">Part 2 §11</a> relies on.</p>\n<p><strong>Targeted regularization:</strong> DragonNet adds a small correction term to the loss, in the spirit of\n<a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §14\" role=\"link\" tabindex=\"0\">Part 2 §14</a>'s doubly robust AIPW correction — a one-step update that nudges the outcome predictions\nusing the fitted propensity, specifically to reduce the <em>final</em> CATE estimate's bias, not just the\noutcome-prediction loss. This targets the actual estimand (<math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>) rather than only the\nintermediate nuisance functions.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — DragonNet closes the loop TarNet/CFRNet leave open.</strong> TarNet balances\nimplicitly; CFRNet balances explicitly via an IPM penalty on the <em>representation</em>; DragonNet adds\na <em>propensity</em> signal and a <em>targeted</em> correction so that the final effect estimate, not just the\nintermediate representation, is what the extra machinery is optimizing for.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s8\" data-title=\"Orthogonal Causal ML — The DML Framework\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Orthogonal Causal ML — The DML Framework</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>6.1 The problem: regularization bias in nuisance functions</h3>\n<p>Parts 1–2 established that every causal estimator reduces to estimating nuisance functions —\n<math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. When these are estimated with ML models (random forests, neural nets,\netc.), the regularization that makes them good <em>predictors</em> introduces bias that propagates into\nthe treatment effect estimate.</p>\n<p><strong>The critical insight:</strong> even with more data, this bias doesn't vanish. The ML model's\nregularization creates a systematic error in the nuisance estimates, and that systematic error\ntranslates directly into a systematic error in <math data-tex=\"\\hat\\tau\"><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math>. Increasing <math data-tex=\"n\"><mi>n</mi></math> reduces variance but\nnot this bias — the sampling distribution of the estimator remains centered away from the true\nvalue.</p>\n<p>The <strong>DML (Double/Debiased Machine Learning)</strong> framework, introduced by Chernozhukov et al.\n(2018), solved this with three key ideas:</p>\n<ol>\n<li><strong>Partialing out</strong> — remove confounders by regressing out their effects first.</li>\n<li><strong>Neyman orthogonality</strong> — make the estimator insensitive to first-order nuisance errors.</li>\n<li><strong>Cross-fitting</strong> — prevent overfitting from using the same data for nuisance estimation and\ntreatment effect estimation.</li>\n</ol>\n<hr>\n</section><section id=\"causal-inference-23-s9\" data-title=\"The Three Ideas of DML\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">The Three Ideas of DML</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>7.1 Partialing Out (Robinson Decomposition)</h3>\n<p>Consider the partially linear structural model:</p>\n<div class=\"mblk\"><math data-tex=\"Y = \\tau_0 T + g(X) + \\epsilon\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>Y</mi><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math></div>\n<p>where <math data-tex=\"\\tau_0\"><msub><mi>τ</mi><mn>0</mn></msub></math> is the treatment effect (a constant), <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is the unknown confounding function,\nand <math data-tex=\"\\epsilon \\perp (T, X)\"><mrow><mi>ϵ</mi><mo>⟂</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo separator=\"true\">,</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</p>\n<p><strong>The problem:</strong> <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is unknown, and any error in estimating it biases <math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>.</p>\n<p><strong>Robinson's trick:</strong> take conditional expectations of the structural equation:</p>\n<div class=\"mblk\"><math data-tex=\"\\mathbb{E}[Y|X] = \\tau_0 \\cdot \\mathbb{E}[T|X] + g(X)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mo>⋅</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>T</mi><mi>|</mi><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>Subtract:</p>\n<div class=\"mblk\"><math data-tex=\"Y - \\mathbb{E}[Y|X] = \\tau_0 \\cdot (T - \\mathbb{E}[T|X])\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>Y</mi><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>T</mi><mo>−</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>T</mi><mi>|</mi><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>Define <strong>residuals:</strong></p>\n<div class=\"mblk\"><math data-tex=\"\\tilde{Y} = Y - m(X), \\quad \\tilde{T} = T - e(X)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>Y</mi><mo>−</mo><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>T</mi><mo>−</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>where <math data-tex=\"m(X) = \\mathbb{E}[Y|X]\"><mrow><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>Y</mi><mi>|</mi><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> and <math data-tex=\"e(X) = \\mathbb{E}[T|X]\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>T</mi><mi>|</mi><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math> are the nuisance functions. Then:</p>\n<div class=\"mblk\"><math data-tex=\"\\tilde{Y} = \\tau_0 \\cdot \\tilde{T} + \\epsilon\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><msub><mi>τ</mi><mn>0</mn></msub><mo>⋅</mo><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>+</mo><mi>ϵ</mi></mrow></math></div>\n<p><strong>Words before symbols:</strong> the confounding function <math data-tex=\"g(X)\"><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> has completely disappeared. Whatever\nrelationship <math data-tex=\"X\"><mi>X</mi></math> has with <math data-tex=\"Y\"><mi>Y</mi></math> that's <em>not</em> through <math data-tex=\"T\"><mi>T</mi></math> has been removed by subtracting the\nconditional expectation. Whatever relationship <math data-tex=\"X\"><mi>X</mi></math> has with <math data-tex=\"T\"><mi>T</mi></math> (confounding) has been removed\nby subtracting the propensity. What remains — the relationship between <math data-tex=\"\\tilde{Y}\"><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover></math> and\n<math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math> — is the direct causal effect <math data-tex=\"\\tau_0\"><msub><mi>τ</mi><mn>0</mn></msub></math>.</p>\n<p>This is a <strong>residual-on-residual regression</strong>: regress the outcome residual on the treatment\nresidual. The slope is <math data-tex=\"\\tau_0\"><msub><mi>τ</mi><mn>0</mn></msub></math>.</p>\n<p><strong>Connection to the DAG:</strong> the confounders <math data-tex=\"X\"><mi>X</mi></math> impact both <math data-tex=\"T\"><mi>T</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math>. By removing their\npredictable influence on both (via <math data-tex=\"m(X)\"><mrow><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"e(X)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>), we eliminate the backdoor path. Whatever\nrelationship survives between the residuals is the causal (front-door) effect.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — partialing out is the algebraic realization of blocking the backdoor path.</strong>\n<a class=\"xref\" data-xref-lec=\"causal-inference-01\" data-xref=\"Part 1 §8\" role=\"link\" tabindex=\"0\">Part 1 §8</a>'s backdoor adjustment formula sums over confounder strata to remove their effect.\nRobinson's decomposition achieves the same goal through subtraction rather than summation — it's\na continuous, ML-compatible version of the same insight.</p>\n</aside>\n<h3>7.2 Neyman Orthogonality</h3>\n<blockquote class=\"aside-quote\">\n<p>The term &quot;Neyman orthogonality&quot; traces back to <strong>Neyman (1959), &quot;Optimal Asymptotic Tests of\nComposite Hypotheses&quot;</strong> — confirmed directly on the slide footer for this section — decades before\nits modern application to ML-based causal inference by Chernozhukov et al. (2018).</p>\n</blockquote>\n<p>The residual-on-residual estimator requires knowing <math data-tex=\"m(X)\"><mrow><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and <math data-tex=\"e(X)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> exactly. In practice, we\nestimate them with ML, introducing errors <math data-tex=\"\\delta_m\"><msub><mi>δ</mi><mi>m</mi></msub></math> and <math data-tex=\"\\delta_e\"><msub><mi>δ</mi><mi>e</mi></msub></math>. The question is: <strong>how do\nthese errors affect <math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math>?</strong></p>\n<p>Define the <strong>moment condition</strong> (score function):</p>\n<div class=\"mblk\"><math data-tex=\"\\psi(\\tilde{Y}, \\tilde{T}, \\tau) = (\\tilde{Y} - \\tau \\cdot \\tilde{T}) \\cdot \\tilde{T} = 0\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>ψ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo separator=\"true\">,</mo><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo separator=\"true\">,</mo><mi>τ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>−</mo><mi>τ</mi><mo>⋅</mo><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mn>0</mn></mrow></math></div>\n<p>This is the &quot;set the derivative of the loss to zero&quot; condition from OLS — at the correct <math data-tex=\"\\tau_0\"><msub><mi>τ</mi><mn>0</mn></msub></math>,\nthe expected score is zero.</p>\n<p><strong>Without orthogonality:</strong> errors in the nuisance estimates propagate linearly — if the nuisance\nerror is <math data-tex=\"\\delta\"><mi>δ</mi></math>, the bias in <math data-tex=\"\\hat\\tau_0\"><msub><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub></math> is <math data-tex=\"O(\\delta)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>δ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</p>\n<p><strong>Neyman orthogonality</strong> requires the derivative condition:</p>\n<div class=\"mblk\"><math data-tex=\"\\left. \\frac{\\partial \\mathbb{E}[\\psi]}{\\partial \\eta} \\right|_{\\eta=\\eta_0} = 0\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\"></mo><mfrac><mrow><mi>∂</mi><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>ψ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow><mrow><mi>∂</mi><mi>η</mi></mrow></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">|</mo></mrow><mrow><mi>η</mi><mo>=</mo><msub><mi>η</mi><mn>0</mn></msub></mrow></msub><mo>=</mo><mn>0</mn></mrow></math></div>\n<p>where <math data-tex=\"\\eta = (m, e)\"><mrow><mi>η</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>m</mi><mo separator=\"true\">,</mo><mi>e</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> represents the nuisance functions. If this holds, the bias drops to\n<math data-tex=\"O(\\delta^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>δ</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — the product of the two nuisance errors rather than their sum.</p>\n<p><strong>Intuition:</strong> the moment condition is designed so that first-order errors in <math data-tex=\"m\"><mi>m</mi></math> and <math data-tex=\"e\"><mi>e</mi></math> cancel\nout. Only second-order interactions between the two errors remain. This is like a Taylor expansion\nwhere the first derivative is zero — the function is &quot;flat&quot; at the true parameter, so small\nperturbations have negligible effect.</p>\n<pre class=\"code\"><code>Nuisance error δ on x-axis, bias in τ̂ on y-axis:\n\nWithout orthogonality:  bias ∝ O(δ)        — linear relationship\nWith orthogonality:     bias ∝ O(δ²)       — quadratic, much smaller for small δ</code></pre>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Why this is the theoretical breakthrough.</strong> Before DML, using ML for nuisance estimation\nmeant accepting irreducible regularization bias in the treatment effect. Neyman orthogonality\nprovides a <em>principled way to suppress that bias</em> without requiring the ML models to be unbiased\nthemselves — you just need them to be &quot;not too wrong&quot; (small <math data-tex=\"\\delta\"><mi>δ</mi></math>), and the second-order\nsuppression does the rest.</p>\n</aside>\n<h3>7.3 Cross-Fitting</h3>\n<p>Even with Neyman orthogonality, there's one remaining problem: if the <em>same data</em> is used to both\ntrain the nuisance models AND estimate <math data-tex=\"\\tau_0\"><msub><mi>τ</mi><mn>0</mn></msub></math>, the fitted nuisance models' errors become\n<strong>correlated with the outcomes</strong>, reintroducing overfitting bias.</p>\n<p><strong>Cross-fitting</strong> fixes this by splitting the data into <math data-tex=\"K\"><mi>K</mi></math> folds:</p>\n<pre class=\"code\"><code>For each fold k = 1, ..., K:\n    1. Train nuisance models m(X), e(X) on ALL data EXCEPT fold k\n    2. Compute residuals Ỹ, T̃ on fold k using the out-of-fold predictions\n    3. Accumulate the moment conditions across folds\n\nFinal: solve the averaged moment condition for τ̂₀</code></pre>\n<p><strong>Why this works:</strong> the residuals on fold <math data-tex=\"k\"><mi>k</mi></math> are computed using models that <em>never saw</em> fold\n<math data-tex=\"k\"><mi>k</mi></math>'s data — so the estimation errors are uncorrelated with the outcomes in fold <math data-tex=\"k\"><mi>k</mi></math>. This\nbreaks the overfitting channel.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — cross-fitting is to causal ML what k-fold cross-validation is to supervised\nlearning.</strong> In supervised learning, you hold out data to get an unbiased estimate of\ngeneralization error. In causal ML, you hold out data to get an unbiased estimate of the\ntreatment effect — the underlying principle is identical, but the target is different.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s10\" data-title=\"DML in Summary\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">DML in Summary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>DML Idea</th>\n<th>Problem It Solves</th>\n<th>Mechanism</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Partialing out</strong></td>\n<td>Confounders contaminate the T-Y relationship</td>\n<td>Regress out confounders' effects via residualization</td>\n</tr>\n<tr>\n<td><strong>Neyman orthogonality</strong></td>\n<td>Nuisance estimation errors bias <math data-tex=\"\\hat\\tau\"><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math> at <math data-tex=\"O(\\delta)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>δ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Design the score function so first-order errors cancel</td>\n</tr>\n<tr>\n<td><strong>Cross-fitting</strong></td>\n<td>Overfitting from same-data nuisance estimation</td>\n<td>Train nuisance models out-of-fold to decorrelate errors</td>\n</tr>\n</tbody>\n</table></div>\n<p>The combined DML estimator is: <strong>consistent</strong>, <strong>asymptotically normal</strong>, and admits <strong>valid\nconfidence intervals</strong> — even when nuisance functions are estimated by flexible ML models with\nnon-negligible regularization bias.</p>\n<hr>\n</section><section id=\"causal-inference-23-s11\" data-title=\"R-Learner — DML for Heterogeneous Effects\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">R-Learner — DML for Heterogeneous Effects</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>R-Learner</strong> — Nie &amp; Wager (2021), &quot;Quasi-Oracle Estimation of Heterogeneous Treatment Effects,&quot;\n<em>Biometrika</em> — confirmed directly on the slide's own footer and body text.</p>\n</blockquote>\n<p>The DML framework (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>–<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>) estimates a <strong>constant</strong> treatment effect <math data-tex=\"\\tau_0\"><msub><mi>τ</mi><mn>0</mn></msub></math>. The <strong>R-Learner</strong>\nextends it to estimate a <strong>function</strong> <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — heterogeneous effects.</p>\n<p>Starting from the partially linear model with a <em>functional</em> treatment effect:</p>\n<div class=\"mblk\"><math data-tex=\"Y = \\tau(X) \\cdot T + g(X) + \\epsilon\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>Y</mi><mo>=</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mi>T</mi><mo>+</mo><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>ϵ</mi></mrow></math></div>\n<p>After Robinson's partialing-out transformation (<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>), the residual-on-residual equation becomes:</p>\n<div class=\"mblk\"><math data-tex=\"\\tilde{Y} = \\tau(X) \\cdot \\tilde{T} + \\epsilon\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mo>=</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mo>+</mo><mi>ϵ</mi></mrow></math></div>\n<p><strong>R-Learner's objective:</strong> find the function <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> that minimizes the weighted sum of squared\nresiduals, using the treatment residual as a weight:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\underset{\\tau}{\\arg\\min} \\sum_{i=1}^{n} \\big(\\tilde{Y}_i - \\tau(X_i) \\cdot \\tilde{T}_i\\big)^2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mrow><munder><mrow><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></mrow><mi>τ</mi></munder></mrow><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><mo>−</mo><mi>τ</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>⋅</mo><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup></mrow></math></div>\n<blockquote class=\"aside-quote\">\n<p>🟡 <strong>Simplification, for fidelity.</strong> The slide's own objective includes an additional, explicitly\n<strong>optional</strong> regularizer term <math data-tex=\"\\Lambda_n(\\tau)\"><mrow><msub><mrow><mi mathvariant=\"normal\">Λ</mi><mspace></mspace></mrow><mi>n</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>τ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> added to this sum (e.g., a penalty controlling the\ncomplexity of <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>) — omitted above because the slide itself labels it optional and the loss\nabove is the core R-Learner idea. If you're implementing this from scratch, know that a\nregularization term is standard practice for controlling the flexibility of the fitted <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</p>\n</blockquote>\n<p><strong>Words before symbols:</strong> this is OLS, but instead of fitting a constant slope, we're fitting a\n<em>function</em> <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> that maps each covariate value to its own treatment effect. The &quot;regressors&quot;\nare the treatment residuals <math data-tex=\"\\tilde{T}_i\"><msub><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi></msub></math> (confounders removed), and the &quot;weights&quot; are proportional\nto <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> — units where the treatment residual is large (high variation in treatment\nassignment) get more weight.</p>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — how the R-Learner generalizes OLS.</strong> In standard OLS, <math data-tex=\"\\hat\\beta = (X^TX)^{-1}X^TY\"><mrow><mover><mi>β</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo>=</mo><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>X</mi><mi class=\"tml-med-pad\">T</mi></msup><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mn>1</mn></mrow></msup><msup><mi>X</mi><mi class=\"tml-med-pad\">T</mi></msup><mi>Y</mi></mrow></math> —\nthe slope is a constant. The R-Learner replaces the constant slope with a <em>function</em> <math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>,\noptimized via a similar least-squares criterion but with the critical modification that both the\n&quot;regressors&quot; (<math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math>) and the &quot;targets&quot; (<math data-tex=\"\\tilde{Y}\"><mover><mi>Y</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover></math>) have been residualized to remove\nconfounding. The <math data-tex=\"\\tilde{T}_i^2\"><msubsup><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>i</mi><mn>2</mn></msubsup></math> weighting naturally downweights units where treatment\nassignment was deterministic (low <math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math>) and upweights units where it was near-random\n(high <math data-tex=\"\\tilde{T}\"><mover><mi>T</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover></math>).</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s12\" data-title=\"DR-Learner — Doubly Robust + Orthogonal + Meta-Learner\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">DR-Learner — Doubly Robust + Orthogonal + Meta-Learner</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>DR-Learner</strong> — Kennedy (2023), &quot;Towards optimal doubly robust estimation of heterogeneous causal\neffects&quot; — confirmed directly on the slide's own footer (&quot;Doubly-robust learner · Kennedy (2023)&quot;).</p>\n</blockquote>\n<p>The <strong>DR-Learner</strong> combines the doubly robust property from <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §14\" role=\"link\" tabindex=\"0\">Part 2 §14</a> (AIPW) with the\northogonal/cross-fitting machinery of DML, wrapped in a meta-learner interface:</p>\n<p><strong>Stage 1:</strong> Estimate nuisance functions <math data-tex=\"\\hat\\mu_1(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, <math data-tex=\"\\hat\\mu_0(x)\"><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, <math data-tex=\"\\hat e(x)\"><mrow><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> using ML.</p>\n<p><strong>Stage 2:</strong> For each unit, compute the <strong>AIPW pseudo-outcome:</strong></p>\n<div class=\"mblk\"><math data-tex=\"\\hat{\\Delta}_i = \\underbrace{\\hat\\mu_1(X_i) - \\hat\\mu_0(X_i)}_{\\text{regression component}} + \\underbrace{\\frac{T_i}{\\hat e(X_i)}\\big(Y_i - \\hat\\mu_1(X_i)\\big) - \\frac{1-T_i}{1-\\hat e(X_i)}\\big(Y_i - \\hat\\mu_0(X_i)\\big)}_{\\text{IPW correction}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mover><mrow><mi mathvariant=\"normal\">Δ</mi><mspace></mspace></mrow><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>i</mi></msub><mo>=</mo><mrow><munder><munder><mrow><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>regression component</mtext></munder></mrow><mo>+</mo><mrow><munder><munder><mrow><mfrac><msub><mi>T</mi><mi>i</mi></msub><mrow><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></mfrac><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>1</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mo>−</mo><mfrac><mrow><mn>1</mn><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub></mrow><mrow><mn>1</mn><mo>−</mo><mover><mi>e</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></mfrac><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>Y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>μ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mn>0</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>IPW correction</mtext></munder></mrow></mrow></math></div>\n<p>This pseudo-outcome is a <strong>noisy, per-unit estimate of <math data-tex=\"\\tau(x_i)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — a &quot;doubly robust&quot;\ndenoising of the raw treatment effect.</p>\n<p><strong>Stage 3:</strong> Regress the pseudo-outcomes on <math data-tex=\"X\"><mi>X</mi></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat\\tau(x) = \\underset{\\tau}{\\arg\\min} \\sum_i \\big(\\hat\\Delta_i - \\tau(X_i)\\big)^2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mrow><munder><mrow><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></mrow><mi>τ</mi></munder></mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>i</mi></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mover><mrow><mi mathvariant=\"normal\">Δ</mi><mspace></mspace></mrow><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>i</mi></msub><mo>−</mo><mi>τ</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mi>i</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup></mrow></math></div>\n<p><strong>Two key properties:</strong></p>\n<ol>\n<li><strong>Doubly robust</strong> (from <a class=\"xref\" data-xref-lec=\"causal-inference-02\" data-xref=\"Part 2 §14\" role=\"link\" tabindex=\"0\">Part 2 §14</a>): consistent if <em>either</em> the outcome model OR the propensity\nmodel is correctly specified — you don't need both to be right.</li>\n<li><strong>Neyman orthogonal</strong> (from <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>): nuisance estimation errors propagate at second order,\n<math data-tex=\"O(\\delta^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>δ</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, not first order.</li>\n</ol>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — DR-Learner is the &quot;best of both worlds&quot; estimator.</strong> It inherits AIPW's\ndouble robustness (insurance against one model being wrong), DML's orthogonality (suppression of\nregularization bias), and the meta-learner's ability to estimate <em>heterogeneous</em> effects via the\nfinal-stage regression on <math data-tex=\"X\"><mi>X</mi></math>.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s13\" data-title=\"The Full Landscape\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">The Full Landscape</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>11a. The lecture's own comparison table</h3>\n<p>This is the deck's actual closing summary table (&quot;Comparison of HTE estimators&quot;), reproduced\ndirectly — a complete side-by-side of every method covered in this lecture, including <strong>DragonNet</strong>\n(<a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§5.4\" role=\"link\" tabindex=\"0\">§5.4</a>), which the synthesis view in <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>b below doesn't separately break out:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Generation</th>\n<th>Models learned</th>\n<th>Main objective</th>\n<th>Neyman orthogonal?</th>\n<th>Doubly robust?</th>\n<th>Handles imbalance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>S-learner</strong></td>\n<td>Meta-learner</td>\n<td><math data-tex=\"f(x,t)\"><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>t</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Single outcome model; <math data-tex=\"\\hat\\tau(x)=f(x,1)-f(x,0)\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>No</td>\n<td>No</td>\n<td>Moderate</td>\n</tr>\n<tr>\n<td><strong>T-learner</strong></td>\n<td>Meta-learner</td>\n<td><math data-tex=\"\\mu_0(x),\\mu_1(x)\"><mrow><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Separate outcome models; <math data-tex=\"\\hat\\tau(x)=\\mu_1(x)-\\mu_0(x)\"><mrow><mover><mi>τ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>No</td>\n<td>No</td>\n<td>Poor</td>\n</tr>\n<tr>\n<td><strong>X-learner</strong></td>\n<td>Meta-learner</td>\n<td><math data-tex=\"\\mu_0(x),\\mu_1(x),\\tau_0(x),\\tau_1(x)\"><mrow><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>τ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>τ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, optionally <math data-tex=\"e(x)\"><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Impute treatment effects and learn CATE directly</td>\n<td>No</td>\n<td>No</td>\n<td>Excellent</td>\n</tr>\n<tr>\n<td><strong>R-learner</strong></td>\n<td>Orthogonal / DML-style</td>\n<td><math data-tex=\"m(x),e(x),\\tau(x)\"><mrow><mi>m</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Minimize residualized R-loss</td>\n<td><strong>Yes</strong></td>\n<td>No</td>\n<td>Good</td>\n</tr>\n<tr>\n<td><strong>DR-learner</strong></td>\n<td>Orthogonal + doubly robust</td>\n<td><math data-tex=\"\\mu_0(x),\\mu_1(x),e(x),\\tau(x)\"><mrow><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Regress doubly-robust pseudo-outcome</td>\n<td><strong>Yes</strong></td>\n<td><strong>Yes</strong></td>\n<td>Good</td>\n</tr>\n<tr>\n<td><strong>Causal forest</strong></td>\n<td>Forest-based orthogonal estimator</td>\n<td><math data-tex=\"\\tau(x)\"><mrow><mi>τ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (plus nuisances internally)</td>\n<td>Honest splitting to maximize treatment-effect heterogeneity</td>\n<td>Yes*</td>\n<td>No</td>\n<td>Good</td>\n</tr>\n<tr>\n<td><strong>TARNet</strong></td>\n<td>Deep representation learning</td>\n<td><math data-tex=\"\\Phi(x),\\mu_0(x),\\mu_1(x)\"><mrow><mrow><mi mathvariant=\"normal\">Φ</mi><mspace></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Shared representation + treatment-specific outcome heads</td>\n<td>No</td>\n<td>No</td>\n<td>Moderate</td>\n</tr>\n<tr>\n<td><strong>CFRNet</strong></td>\n<td>Deep representation learning</td>\n<td><math data-tex=\"\\Phi(x),\\mu_0(x),\\mu_1(x)\"><mrow><mrow><mi mathvariant=\"normal\">Φ</mi><mspace></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>TARNet + representation balancing (MMD / Wasserstein)</td>\n<td>No</td>\n<td>No</td>\n<td>Good</td>\n</tr>\n<tr>\n<td><strong>DragonNet</strong></td>\n<td>Deep semiparametric learning</td>\n<td><math data-tex=\"\\Phi(x),\\mu_0(x),\\mu_1(x),e(x)\"><mrow><mrow><mi mathvariant=\"normal\">Φ</mi><mspace></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msub><mi>μ</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>TARNet + propensity head + targeted regularization</td>\n<td>No (efficiency-inspired)</td>\n<td>No</td>\n<td>Good</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>* Orthogonality holds for the local-centering (residual-on-residual) causal forest of Athey,\nTibshirani &amp; Wager (2019), not the original Wager &amp; Athey (2018) formulation — see the ⚠️ callout\nin <a class=\"xref\" data-xref-lec=\"causal-inference-23\" data-xref=\"§4.2\" role=\"link\" tabindex=\"0\">§4.2</a>.</em></p>\n<h3>11b. A synthesis view — mapped onto the canonical DAG</h3>\n<p>The table above tells you <em>what</em> each method does; this is my own reorganization of <em>why</em> — every\nmethod in Parts 1–3 can also be understood as a different strategy for removing the causal\ninfluence of confounders on the treatment-outcome relationship. Here's how each method maps onto\nthe canonical DAG (<math data-tex=\"X \\to T\"><mrow><mi>X</mi><mo>→</mo><mi>T</mi></mrow></math>, <math data-tex=\"X \\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>Y</mi></mrow></math>, <math data-tex=\"T \\to Y\"><mrow><mi>T</mi><mo>→</mo><mi>Y</mi></mrow></math>):</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>How it removes confounding</th>\n<th>Edge targeted</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>RCT</strong></td>\n<td>Randomizes <math data-tex=\"T\"><mi>T</mi></math>, breaking the <math data-tex=\"X \\to T\"><mrow><mi>X</mi><mo>→</mo><mi>T</mi></mrow></math> edge</td>\n<td>Eliminates confounding by design</td>\n</tr>\n<tr>\n<td><strong>Matching/stratification</strong></td>\n<td>Conditions on <math data-tex=\"X\"><mi>X</mi></math>, blocking the backdoor path</td>\n<td>Blocks <math data-tex=\"X \\to T\"><mrow><mi>X</mi><mo>→</mo><mi>T</mi></mrow></math> and <math data-tex=\"X \\to Y\"><mrow><mi>X</mi><mo>→</mo><mi>Y</mi></mrow></math></td>\n</tr>\n<tr>\n<td><strong>Propensity weighting</strong></td>\n<td>Reweights to create a pseudo-population where <math data-tex=\"T \\perp X\"><mrow><mi>T</mi><mo>⟂</mo><mi>X</mi></mrow></math></td>\n<td>Eliminates <math data-tex=\"X \\to T\"><mrow><mi>X</mi><mo>→</mo><mi>T</mi></mrow></math> influence</td>\n</tr>\n<tr>\n<td><strong>Meta-learners (S/T/X)</strong></td>\n<td>Models <math data-tex=\"\\mu_t(x)\"><mrow><msub><mi>μ</mi><mi>t</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> to adjust for <math data-tex=\"X\"><mi>X</mi></math></td>\n<td>Conditions on <math data-tex=\"X\"><mi>X</mi></math> via outcome models</td>\n</tr>\n<tr>\n<td><strong>Causal forests</strong></td>\n<td>Partitions <math data-tex=\"X\"><mi>X</mi></math>-space, estimates within leaves</td>\n<td>Stratifies on <math data-tex=\"X\"><mi>X</mi></math> with honest estimation</td>\n</tr>\n<tr>\n<td><strong>TarNet/CFRNet/DragonNet</strong></td>\n<td>Learns balanced <math data-tex=\"\\phi(x)\"><mrow><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> where <math data-tex=\"T \\perp \\phi(X)\"><mrow><mi>T</mi><mo>⟂</mo><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Transforms <math data-tex=\"X\"><mi>X</mi></math> to eliminate confounding in <math data-tex=\"\\mathcal{Z}\"><mi class=\"mathcal\">𝒵</mi></math></td>\n</tr>\n<tr>\n<td><strong>DML / R-Learner</strong></td>\n<td>Residualizes both <math data-tex=\"T\"><mi>T</mi></math> and <math data-tex=\"Y\"><mi>Y</mi></math> on <math data-tex=\"X\"><mi>X</mi></math>, estimates on residuals</td>\n<td>Removes <math data-tex=\"X\"><mi>X</mi></math>'s influence on both arms simultaneously</td>\n</tr>\n<tr>\n<td><strong>DR-Learner</strong></td>\n<td>AIPW pseudo-outcomes + orthogonal regression</td>\n<td>Combines residualization with double robustness</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing — the unified view.</strong> Whether you're doing propensity weighting, matching,\nrepresentation learning, or DML, the goal is always the same: make the comparison between\ntreated and control groups as if the confounders <math data-tex=\"X\"><mi>X</mi></math> didn't exist. Each method does this through\na different mechanism — weighting, conditioning, residualizing, or learning a balanced\nrepresentation — but they're all solving the same problem of blocking the backdoor path.</p>\n</aside>\n<hr>\n</section><section id=\"causal-inference-23-s14\" data-title=\"Beyond Treatment Effects — Frontiers of Causal ML\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">Beyond Treatment Effects — Frontiers of Causal ML</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>The lecture concludes with a survey of applications where causal reasoning enhances standard ML:</p>\n<h3>12.1 Robust and generalizable ML</h3>\n<p>Standard supervised learning assumes train and test distributions match. When they don't (domain\nshift), predictions fail — e.g., a cow detector trained on grassy backgrounds fails on beach\nbackgrounds. Causal ML seeks to learn <strong>invariant features</strong> (the causal mechanisms) rather than\nspurious correlations.</p>\n<h3>12.2 Causal generative modeling</h3>\n<p>Instead of sampling from a learned distribution, causal generative models ask: <em>&quot;what would this\nMRI look like if the patient didn't have the disease?&quot;</em> or <em>&quot;how would this face change if age\nincreased while everything else stayed fixed?&quot;</em> Applications include controllable diffusion models\nand counterfactual data augmentation.</p>\n<h3>12.3 Causal RL</h3>\n<ul>\n<li><strong>Dynamic treatment regimes:</strong> sequences of treatments (e.g., titrating drug dosage over time).</li>\n<li><strong>Causal bandits:</strong> exploiting causal structure to predict outcomes under interventions.</li>\n<li><strong>World models:</strong> learning environment dynamics via causal reasoning.</li>\n<li><strong>Off-policy evaluation:</strong> estimating a new policy's value from data collected under an old\npolicy — a fundamentally causal problem.</li>\n<li><strong>Counterfactual credit assignment:</strong> determining which specific action in a sequence caused\nthe reward.</li>\n</ul>\n<h3>12.4 Fairness and explainability</h3>\n<ul>\n<li><strong>Counterfactual fairness:</strong> <em>&quot;would this person's loan application have been approved if their\nrace were different, all else equal?&quot;</em> — a causal question, not a statistical one.</li>\n<li><strong>Explainability:</strong> identifying which variables causally drive a model's decisions, beyond\ncorrelational feature importance.</li>\n</ul>\n<h3>12.5 LLMs and causal reasoning</h3>\n<ul>\n<li>Automatically extracting causal knowledge from scientific literature to build causal graphs.</li>\n<li>Studying whether LLMs reason about interventions and counterfactuals, or merely exploit\nstatistical associations (and hallucinate).</li>\n</ul>\n<hr>\n</section><section id=\"causal-inference-23-s15\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"causal-inference-23-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"505\" style=\"max-width:100%;height:auto\" id=\"d48cf444540759c8f\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 504.296875 774.5\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#d48cf444540759c8f{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d48cf444540759c8f .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;s
