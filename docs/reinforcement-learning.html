1.8em\">|</mo><mspace width=\"0.2778em\"></mspace><msub><mi>S</mi><mi>t</mi></msub><mo>=</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><strong>Interpretation:</strong> &quot;how good is it to be in state <math data-tex=\"s\"><mi>s</mi></math> under policy <math data-tex=\"\\pi\"><mi>π</mi></math>?&quot; — a single number\nsummarizing the long-term value of that state.</p>\n<h3>8.2 Action-value function Q^π(s,a)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Action-value function (Q-function)</strong> — the expected cumulative discounted reward starting from\nstate <math data-tex=\"s\"><mi>s</mi></math>, taking action <math data-tex=\"a\"><mi>a</mi></math>, and then following policy <math data-tex=\"\\pi\"><mi>π</mi></math>.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"Q^\\pi(s,a) = \\mathbb{E}_\\pi[G_t | S_t = s, A_t = a]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>𝔼</mi><mi>π</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>G</mi><mi>t</mi></msub><mi>|</mi><msub><mi>S</mi><mi>t</mi></msub><mo>=</mo><mi>s</mi><mo separator=\"true\">,</mo><msub><mi>A</mi><mi>t</mi></msub><mo>=</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p><strong>Interpretation:</strong> &quot;how good is it to take action <math data-tex=\"a\"><mi>a</mi></math> in state <math data-tex=\"s\"><mi>s</mi></math> under policy <math data-tex=\"\\pi\"><mi>π</mi></math>?&quot;</p>\n<h3>8.3 The relationship between V and Q</h3>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s) = \\sum_a \\pi(a|s) \\cdot Q^\\pi(s,a)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>a</mi></munder></mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> the value of being in state <math data-tex=\"s\"><mi>s</mi></math> is the weighted average of the values\nof all possible actions from that state, weighted by the policy's probability of choosing each\naction. If the policy is deterministic (<math data-tex=\"\\pi(a^*|s) = 1\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>a</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn></mrow></math> for one action <math data-tex=\"a^*\"><msup><mi>a</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup></math>), then\n<math data-tex=\"V^\\pi(s) = Q^\\pi(s, a^*)\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><msup><mi>a</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s11\" data-title=\"Bellman Expectation Equations\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Bellman Expectation Equations</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>9.1 The Bellman equation for V^π</h3>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s) = \\sum_a \\pi(a|s) \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot V^\\pi(s') \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>a</mi></munder></mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><strong>Words before symbols:</strong> the value of state <math data-tex=\"s\"><mi>s</mi></math> under policy <math data-tex=\"\\pi\"><mi>π</mi></math> equals:</p>\n<ol>\n<li><strong>Average over actions</strong> (weighted by <math data-tex=\"\\pi(a|s)\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>): for each action <math data-tex=\"a\"><mi>a</mi></math> that <math data-tex=\"\\pi\"><mi>π</mi></math> might take...</li>\n<li><strong>Immediate reward</strong> <math data-tex=\"R(s,a)\"><mrow><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> plus...</li>\n<li><strong>Discounted expected value of the next state</strong>: averaged over all possible next states <math data-tex=\"s'\"><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></math>\nweighted by transition probabilities <math data-tex=\"P(s'|s,a)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, each valued at <math data-tex=\"V^\\pi(s')\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</li>\n</ol>\n<p><strong>The &quot;backup&quot; diagram:</strong></p>\n<pre class=\"code\"><code>          s\n         /|\\\n        / | \\\n      a₁  a₂  a₃    ← weighted by π(a|s)\n      |   |   |\n      s'₁ s'₂ s'₃  ← weighted by P(s'|s,a)\n      |   |   |\n     V(s'₁) V(s'₂) V(s'₃)</code></pre>\n<p>The value at <math data-tex=\"s\"><mi>s</mi></math> &quot;backs up&quot; from the values of the states it can reach.</p>\n<p><strong>Key property:</strong> this is a <strong>system of linear equations</strong> — if you know <math data-tex=\"P\"><mi>P</mi></math>, <math data-tex=\"R\"><mi>R</mi></math>, and <math data-tex=\"\\pi\"><mi>π</mi></math>,\nyou can solve for <math data-tex=\"V^\\pi\"><msup><mi>V</mi><mi>π</mi></msup></math> by matrix inversion.</p>\n<h3>9.2 Worked example: 2-state MDP</h3>\n<p>Two states <math data-tex=\"s_1, s_2\"><mrow><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>s</mi><mn>2</mn></msub></mrow></math>. Actions: stay or go. <math data-tex=\"\\gamma = 0.9\"><mrow><mi>γ</mi><mo>=</mo><mn>0.9</mn></mrow></math>. Policy: <math data-tex=\"\\pi(\\text{stay}|s_1) = 1\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>stay</mtext><mi>|</mi><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn></mrow></math>,\n<math data-tex=\"\\pi(\\text{go}|s_2) = 1\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>go</mtext><mi>|</mi><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn></mrow></math> (deterministic).</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>State</th>\n<th>Action</th>\n<th>Reward</th>\n<th>Next state</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math></td>\n<td>stay</td>\n<td>2</td>\n<td><math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math></td>\n<td>go</td>\n<td>0</td>\n<td><math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math></td>\n<td>stay</td>\n<td>1</td>\n<td><math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math></td>\n<td>go</td>\n<td>3</td>\n<td><math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math></td>\n</tr>\n</tbody>\n</table></div>\n<p>Under the policy <math data-tex=\"\\pi\"><mi>π</mi></math>, <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math> always &quot;stays&quot; (self-loop) and <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math> always &quot;goes&quot; (transitions to\n<math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>) — this is the row of the table each state actually follows, shown in <strong>bold</strong> logic below.\nBellman equations under this policy [slide 137]:</p>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s_1) = R(s_1,\\text{stay}) + \\gamma \\cdot V^\\pi(s_1) = 2 + 0.9 \\cdot V^\\pi(s_1)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mtext>stay</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s_2) = R(s_2,\\text{go}) + \\gamma \\cdot V^\\pi(s_1) = 3 + 0.9 \\cdot V^\\pi(s_1)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>3</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>Simplifying:</p>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s_1) = 2 + 0.9 \\cdot V^\\pi(s_1) \\implies 0.1 \\cdot V^\\pi(s_1) = 2 \\implies V^\\pi(s_1) = 20\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"0.2778em\"></mspace><mn>0.1</mn><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"0.2778em\"></mspace><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>20</mn></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s_2) = 3 + 0.9 \\cdot V^\\pi(s_1) = 3 + 0.9 \\times 20 = 21\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>3</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>3</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><mn>20</mn><mo>=</mo><mn>21</mn></mrow></math></div>\n<p><strong>Matrix form</strong> [slide 137]: $V = b + \\gamma P V \\implies (I - \\gamma P) V = b \\implies V = (I -\n\\gamma P)^{-1} b<math data-tex=\". In this MDP,\"><mrow><mi>.</mi><mi>I</mi><mi>n</mi><mi>t</mi><mi>h</mi><mi>i</mi><mi>s</mi><mi>M</mi><mi>D</mi><mi>P</mi><mo separator=\"true\">,</mo></mrow></math>\\begin{bmatrix} 0.1 &amp; 0 \\ -0.9 &amp; 1\\end{bmatrix}\n\\begin{bmatrix}V(s_1)\\V(s_2)\\end{bmatrix} = \\begin{bmatrix}2\\3\\end{bmatrix}$, giving the same\nresult: <math data-tex=\"V^\\pi(s_1)=20\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>20</mn></mrow></math>, <math data-tex=\"V^\\pi(s_2)=21\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>21</mn></mrow></math>.</p>\n<p>This works because the system is linear — a direct consequence of the expectation (weighted\naverage) in the Bellman equation.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>A previous version of this file had the <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math> row of the transition table backwards</strong>\n(claiming &quot;<math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>, stay → <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>&quot; and &quot;<math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>, go → <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>&quot;), which produced the wrong value\n<math data-tex=\"V^\\pi(s_2)=30\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>30</mn></mrow></math>. The lecture's own slides [137, 139, 140] agree unambiguously: under this policy,\n&quot;stay&quot; from <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math> is a <strong>self-loop</strong> back into <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math> (reward 1), and &quot;go&quot; from <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math> transitions\n<strong>to <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math></strong> (reward 3) — so <math data-tex=\"V^\\pi(s_2)=21\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>21</mn></mrow></math>, not 30. This correction propagates through <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§10.2\" role=\"link\" tabindex=\"0\">§10.2</a> and\n<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§12.2\" role=\"link\" tabindex=\"0\">§12.2</a> below.</p>\n</aside>\n<h3>9.3 Bellman equation for Q^π</h3>\n<div class=\"mblk\"><math data-tex=\"Q^\\pi(s,a) = R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\sum_{a'} \\pi(a'|s') \\cdot Q^\\pi(s',a')\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></munder></mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mi>|</mi><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo separator=\"true\">,</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>Key difference from V:</strong> the Q-backup averages over the <strong>next action</strong> <math data-tex=\"a'\"><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></math> (weighted by\n<math data-tex=\"\\pi(a'|s')\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mi>|</mi><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>), not the current action (which is given as the argument to Q).</p>\n<pre class=\"code\"><code>V-backup:  s → {a} → s'         (average over next s')\nQ-backup:  s, a → s' → {a'}     (average over next s' AND next a')</code></pre>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — V vs. Q reflects two different questions.</strong> <math data-tex=\"V^\\pi(s)\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> asks <em>&quot;how good is\nthis state?&quot;</em> — useful for evaluating a state. <math data-tex=\"Q^\\pi(s,a)\"><mrow><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> asks <em>&quot;how good is this action in\nthis state?&quot;</em> — useful for choosing actions. Policy improvement (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>) requires Q-values because\nyou need to compare actions, not just states.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-24-s12\" data-title=\"Bellman Optimality Equations\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">Bellman Optimality Equations</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>10.1 From expectation to optimality</h3>\n<p>The Bellman <em>expectation</em> equation averages over actions weighted by <math data-tex=\"\\pi\"><mi>π</mi></math>. The Bellman\n<em>optimality</em> equation replaces the average with <strong>max</strong>:</p>\n<div class=\"mblk\"><math data-tex=\"V^*(s) = \\max_a \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot V^*(s') \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><munder><mi>max</mi><mi>a</mi></munder><mo>⁡</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"Q^*(s,a) = R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot \\max_{a'} Q^*(s',a')\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\" class=\"tml-med-pad\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><munder><mi>max</mi><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></munder><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><msup><mi>Q</mi><mo class=\"tml-med-pad\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo separator=\"true\">,</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>The critical difference:</strong> the max operator makes the equation <strong>nonlinear</strong> — you cannot solve\nit by matrix inversion. Iterative methods (value iteration, policy iteration) are required.</p>\n<h3>10.2 Worked example: the same 2-state MDP</h3>\n<div class=\"mblk\"><math data-tex=\"V^*(s_1) = \\max\\begin{cases} 2 + 0.9 \\cdot V^*(s_1) &amp; \\text{(stay)} \\\\ 0 + 0.9 \\cdot V^*(s_2) &amp; \\text{(go)} \\end{cases}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>max</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">{</mo><mtable><mtr><mtd class=\"tml-left\" style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>2</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mtd><mtd class=\"tml-left\" style=\"padding-left:1em;padding-right:0em;\"><mtext>(stay)</mtext></mtd></mtr><mtr><mtd class=\"tml-left\" style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>0</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mtd><mtd class=\"tml-left\" style=\"padding-left:1em;padding-right:0em;\"><mtext>(go)</mtext></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\"></mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"V^*(s_2) = \\max\\begin{cases} 1 + 0.9 \\cdot V^*(s_2) &amp; \\text{(stay)} \\\\ 3 + 0.9 \\cdot V^*(s_1) &amp; \\text{(go)} \\end{cases}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>max</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">{</mo><mtable><mtr><mtd class=\"tml-left\" style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>1</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mtd><mtd class=\"tml-left\" style=\"padding-left:1em;padding-right:0em;\"><mtext>(stay)</mtext></mtd></mtr><mtr><mtd class=\"tml-left\" style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>3</mn><mo>+</mo><mn>0.9</mn><mo>⋅</mo><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mtd><mtd class=\"tml-left\" style=\"padding-left:1em;padding-right:0em;\"><mtext>(go)</mtext></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\"></mo></mrow></mrow></math></div>\n<p><strong>Interactive exploration:</strong></p>\n<ul>\n<li>With default rewards (stay at <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>: reward 2, go from <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>: reward 3): optimal policy is\n&quot;stay at <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>, go from <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>&quot; — confirmed below in <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§12.2\" role=\"link\" tabindex=\"0\">§12.2</a> by computing every Q-value directly\n[slides 139–140]: <math data-tex=\"V^*(s_1)=20\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>20</mn></mrow></math>, <math data-tex=\"V^*(s_2)=21\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>21</mn></mrow></math>.</li>\n<li>Increase the &quot;go&quot; reward at <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>: at some point, the optimal policy switches to &quot;go from <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>&quot;\nbecause the immediate reward outweighs staying.</li>\n<li>Decrease the &quot;stay&quot; reward at <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>: eventually &quot;go from <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>&quot; becomes better because <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>'s\nstay value drops below the transition to <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>.</li>\n</ul>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The optimal value always dominates:</strong> <math data-tex=\"V^*(s) \\geq V^\\pi(s)\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≥</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for any policy <math data-tex=\"\\pi\"><mi>π</mi></math> and\nstate <math data-tex=\"s\"><mi>s</mi></math>. No policy can exceed the optimal value — you can only match it.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-24-s13\" data-title=\"Policy Evaluation\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">Policy Evaluation</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Given a fixed policy <math data-tex=\"\\pi\"><mi>π</mi></math>, compute <math data-tex=\"V^\\pi(s)\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for all <math data-tex=\"s\"><mi>s</mi></math>.</p>\n<p><strong>Method 1 — Direct solution (matrix inversion):</strong> when <math data-tex=\"P\"><mi>P</mi></math> and <math data-tex=\"\\pi\"><mi>π</mi></math> are known and the state\nspace is small, solve the linear system <math data-tex=\"(I - \\gamma P^\\pi) V = R^\\pi\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>I</mi><mo>−</mo><mi>γ</mi><msup><mi>P</mi><mi class=\"tml-med-pad\">π</mi></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>V</mi><mo>=</mo><msup><mi>R</mi><mi class=\"tml-med-pad\">π</mi></msup></mrow></math> directly.</p>\n<p><strong>Method 2 — Iterative evaluation:</strong> start with <math data-tex=\"V_0(s) = 0\"><mrow><msub><mi>V</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math> for all <math data-tex=\"s\"><mi>s</mi></math>, then repeatedly apply\nthe Bellman expectation update:</p>\n<div class=\"mblk\"><math data-tex=\"V_{k+1}(s) \\leftarrow \\sum_a \\pi(a|s) \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot V_k(s') \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>V</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>a</mi></munder></mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mi>V</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p>Converges to <math data-tex=\"V^\\pi\"><msup><mi>V</mi><mi>π</mi></msup></math> as <math data-tex=\"k \\to \\infty\"><mrow><mi>k</mi><mo>→</mo><mi>∞</mi></mrow></math> (guaranteed by the contraction mapping theorem when\n<math data-tex=\"\\gamma &lt; 1\"><mrow><mi>γ</mi><mo>&lt;</mo><mn>1</mn></mrow></math>).</p>\n<p>🧪 <strong>Worked example — iterating toward <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.2\" role=\"link\" tabindex=\"0\">§9.2</a>'s known answer.</strong> Applying this update to <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.2\" role=\"link\" tabindex=\"0\">§9.2</a>'s\n2-state MDP under <math data-tex=\"\\pi_0\"><msub><mi>π</mi><mn>0</mn></msub></math> (equations <math data-tex=\"V(s_1) \\leftarrow 2 + 0.9\\,V(s_1)\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><mn>2</mn><mo>+</mo><mn>0.9</mn><mspace width=\"0.1667em\"></mspace><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>,\n<math data-tex=\"V(s_2) \\leftarrow 3 + 0.9\\,V(s_1)\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><mn>3</mn><mo>+</mo><mn>0.9</mn><mspace width=\"0.1667em\"></mspace><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>), starting from <math data-tex=\"V_0(s_1)=V_0(s_2)=0\"><mrow><msub><mi>V</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>V</mi><mn>0</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math>:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><math data-tex=\"k\"><mi>k</mi></math></th>\n<th><math data-tex=\"V_k(s_1)\"><mrow><msub><mi>V</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th><math data-tex=\"V_k(s_2)\"><mrow><msub><mi>V</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>0.000</td>\n<td>0.000</td>\n</tr>\n<tr>\n<td>1</td>\n<td>2.000</td>\n<td>3.000</td>\n</tr>\n<tr>\n<td>2</td>\n<td>3.800</td>\n<td>4.800</td>\n</tr>\n<tr>\n<td>3</td>\n<td>5.420</td>\n<td>6.420</td>\n</tr>\n<tr>\n<td>4</td>\n<td>6.878</td>\n<td>7.878</td>\n</tr>\n<tr>\n<td>5</td>\n<td>8.190</td>\n<td>9.190</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\to\\infty\"><mrow><mo>→</mo><mi>∞</mi></mrow></math></td>\n<td><strong>20.000</strong></td>\n<td><strong>21.000</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>Each step closes the gap to the true fixed point <math data-tex=\"(20, 21)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>20</mn><mo separator=\"true\">,</mo><mn>21</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math> by a factor of exactly <math data-tex=\"\\gamma=0.9\"><mrow><mi>γ</mi><mo>=</mo><mn>0.9</mn></mrow></math>\n(e.g. the gap at <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math> shrinks <math data-tex=\"18 \\to 16.2 \\to 14.58 \\to \\ldots\"><mrow><mn>18</mn><mo>→</mo><mn>16.2</mn><mo>→</mo><mn>14.58</mn><mo>→</mo><mo>…</mo></mrow></math>, each term <math data-tex=\"0.9\\times\"><mrow><mn>0.9</mn><mo>×</mo></mrow></math> the last)\n— this <em>is</em> the contraction mapping theorem made concrete: convergence is geometric with rate\n<math data-tex=\"\\gamma\"><mi>γ</mi></math>, so full precision takes many iterations, but the direction and rate are exact from\niteration 1.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s14\" data-title=\"Policy Improvement and Policy Iteration\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">Policy Improvement and Policy Iteration</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>12.1 Policy improvement</h3>\n<p>Given <math data-tex=\"V^\\pi\"><msup><mi>V</mi><mi>π</mi></msup></math>, construct a new policy <math data-tex=\"\\pi'\"><msup><mi>π</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></math> that is <strong>greedy</strong> with respect to <math data-tex=\"Q^\\pi\"><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\pi'(s) = \\arg\\max_a Q^\\pi(s,a)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>π</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><munder><mi>max</mi><mi>a</mi></munder><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><msup><mi>Q</mi><mi class=\"tml-med-pad\">π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>The policy improvement theorem:</strong> <math data-tex=\"V^{\\pi'}(s) \\geq V^{\\pi}(s)\"><mrow><msup><mi>V</mi><msup><mi>π</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≥</mo><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> for all <math data-tex=\"s\"><mi>s</mi></math> — the greedy\npolicy is always at least as good as the original.</p>\n<h3>12.2 Policy iteration</h3>\n<p>Alternate between evaluation and improvement until convergence:</p>\n<pre class=\"code\"><code>π₀ → evaluate → V^π₀ → improve → π₁ → evaluate → V^π₁ → improve → π₂ → ...</code></pre>\n<p><strong>Each improvement step is guaranteed to be at least as good.</strong> Since the number of deterministic\npolicies is finite (for finite MDPs), policy iteration converges in a finite number of steps.</p>\n<p><strong>Worked example</strong> [slides 137, 139, 140] — starting with <math data-tex=\"\\pi_0\"><msub><mi>π</mi><mn>0</mn></msub></math> = &quot;stay at <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math>, go from\n<math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math>&quot;:</p>\n<ol>\n<li><strong>Evaluate:</strong> <math data-tex=\"V^{\\pi_0}(s_1) = 20\"><mrow><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>20</mn></mrow></math>, <math data-tex=\"V^{\\pi_0}(s_2) = 21\"><mrow><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>21</mn></mrow></math> (from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.2\" role=\"link\" tabindex=\"0\">§9.2</a>).</li>\n<li><strong>Compute Q-values for ALL actions</strong> (not just the ones <math data-tex=\"\\pi_0\"><msub><mi>π</mi><mn>0</mn></msub></math> takes):\n<ul>\n<li><math data-tex=\"Q^{\\pi_0}(s_1, \\text{stay}) = 2 + 0.9 \\times V^{\\pi_0}(s_1) = 2 + 0.9 \\times 20 = 20.0\"><mrow><msup><mi>Q</mi><msub class=\"tml-med-pad\"><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mtext>stay</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><mn>20</mn><mo>=</mo><mn>20.0</mn></mrow></math></li>\n<li><math data-tex=\"Q^{\\pi_0}(s_1, \\text{go}) = 0 + 0.9 \\times V^{\\pi_0}(s_2) = 0 + 0.9 \\times 21 = 18.9\"><mrow><msup><mi>Q</mi><msub class=\"tml-med-pad\"><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><mn>21</mn><mo>=</mo><mn>18.9</mn></mrow></math></li>\n<li><math data-tex=\"Q^{\\pi_0}(s_2, \\text{stay}) = 1 + 0.9 \\times V^{\\pi_0}(s_2) = 1 + 0.9 \\times 21 = 19.9\"><mrow><msup><mi>Q</mi><msub class=\"tml-med-pad\"><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mtext>stay</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><mn>21</mn><mo>=</mo><mn>19.9</mn></mrow></math></li>\n<li><math data-tex=\"Q^{\\pi_0}(s_2, \\text{go}) = 3 + 0.9 \\times V^{\\pi_0}(s_1) = 3 + 0.9 \\times 20 = 21.0\"><mrow><msup><mi>Q</mi><msub class=\"tml-med-pad\"><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>3</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>3</mn><mo>+</mo><mn>0.9</mn><mo>×</mo><mn>20</mn><mo>=</mo><mn>21.0</mn></mrow></math></li>\n</ul>\n</li>\n<li><strong>Improve</strong> (greedy w.r.t. these Q-values):\n<math data-tex=\"\\pi_1(s_1) = \\arg\\max\\{Q(s_1,\\text{stay})=20.0,\\ Q(s_1,\\text{go})=18.9\\} = \\text{stay}\"><mrow><msub><mi>π</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mi>max</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mtext>stay</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>20.0</mn><mo separator=\"true\">,</mo><mtext> </mtext><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>18.9</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>=</mo><mtext>stay</mtext></mrow></math>;\n<math data-tex=\"\\pi_1(s_2) = \\arg\\max\\{Q(s_2,\\text{stay})=19.9,\\ Q(s_2,\\text{go})=21.0\\} = \\text{go}\"><mrow><msub><mi>π</mi><mn>1</mn></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow><mi>max</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mtext>stay</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>19.9</mn><mo separator=\"true\">,</mo><mtext> </mtext><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>21.0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>=</mo><mtext>go</mtext></mrow></math>.</li>\n<li><strong>Conclusion:</strong> <math data-tex=\"\\pi_1 = \\{s_1:\\text{stay},\\ s_2:\\text{go}\\} = \\pi_0\"><mrow><msub><mi>π</mi><mn>1</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><msub><mi>s</mi><mn>1</mn></msub><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mtext>stay</mtext><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>s</mi><mn>2</mn></msub><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo>=</mo><msub><mi>π</mi><mn>0</mn></msub></mrow></math> — <strong>the policy is\nunchanged.</strong> By the policy improvement theorem, an unchanged policy means <math data-tex=\"\\pi_0\"><msub><mi>π</mi><mn>0</mn></msub></math> was <em>already</em>\noptimal: <math data-tex=\"\\pi_0 = \\pi^*\"><mrow><msub><mi>π</mi><mn>0</mn></msub><mo>=</mo><msup><mi>π</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup></mrow></math>, with <math data-tex=\"V^*(s_1)=20\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>20</mn></mrow></math>, <math data-tex=\"V^*(s_2)=21\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>21</mn></mrow></math>.</li>\n</ol>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>This is the honest, common outcome of policy iteration, not a special case.</strong> The initial\npolicy in this example happens to already be greedy with respect to its own value function, so\nthe loop converges in <strong>zero</strong> improvement steps — you evaluate once, check that no action beats\nthe current one anywhere, and stop. If <math data-tex=\"\\pi_1 \\ne \\pi_0\"><mrow><msub><mi>π</mi><mn>1</mn></msub><mo>≠</mo><msub><mi>π</mi><mn>0</mn></msub></mrow></math> had come out of step 3, you would repeat:\nevaluate <math data-tex=\"\\pi_1\"><msub><mi>π</mi><mn>1</mn></msub></math> → improve → evaluate → ... until the policy stops changing, exactly as <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§12.2\" role=\"link\" tabindex=\"0\">§12.2</a>'s\ndiagram above shows.</p>\n<p>⚠️ <strong>A previous version of this file's step 1 used the wrong value <math data-tex=\"V^{\\pi_0}(s_2)=30\"><mrow><msup><mi>V</mi><msub><mi>π</mi><mn>0</mn></msub></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>30</mn></mrow></math></strong> (see the\n<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.2\" role=\"link\" tabindex=\"0\">§9.2</a> correction above) and, compounding the error, mis-transcribed the Q-values so that the\n&quot;improved&quot; policy appeared to switch both actions to &quot;go&quot; — the opposite of the correct,\nslide-verified result that the original policy was already optimal.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-24-s15\" data-title=\"Value Iteration\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">Value Iteration</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Combine evaluation and improvement in one step — update V directly using the Bellman optimality\nequation:</p>\n<div class=\"mblk\"><math data-tex=\"V_{k+1}(s) \\leftarrow \\max_a \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot V_k(s') \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>V</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><munder><mi>max</mi><mi>a</mi></munder><mo>⁡</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mi>V</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p>After convergence, recover the optimal policy:</p>\n<div class=\"mblk\"><math data-tex=\"\\pi^*(s) = \\arg\\max_a \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot V^*(s') \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>π</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><munder><mi>max</mi><mi>a</mi></munder><mo>⁡</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><strong>Relationship to dynamic programming:</strong> value iteration is the RL analogue of dynamic programming's\n&quot;solve subproblems bottom-up.&quot; Each iteration solves a one-step-ahead subproblem and uses the\nresult to improve the overall solution.</p>\n<p><strong>Convergence guarantee:</strong> the contraction mapping theorem guarantees that value iteration\nconverges to <math data-tex=\"V^*\"><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup></math> as long as <math data-tex=\"\\gamma &lt; 1\"><mrow><mi>γ</mi><mo>&lt;</mo><mn>1</mn></mrow></math>. The contraction factor is <math data-tex=\"\\gamma\"><mi>γ</mi></math>, so the error\nshrinks by a factor of <math data-tex=\"\\gamma\"><mi>γ</mi></math> each iteration.</p>\n<p>🧪 <strong>Worked example — value iteration on <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.2\" role=\"link\" tabindex=\"0\">§9.2</a>'s 2-state MDP.</strong> Using\n<math data-tex=\"V(s_1)\\leftarrow\\max\\{2+0.9V(s_1),\\ 0.9V(s_2)\\}\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><mrow><mi>max</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mn>2</mn><mo>+</mo><mn>0.9</mn><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mtext> </mtext><mn>0.9</mn><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math> and\n<math data-tex=\"V(s_2)\\leftarrow\\max\\{1+0.9V(s_2),\\ 3+0.9V(s_1)\\}\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><mrow><mi>max</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mn>1</mn><mo>+</mo><mn>0.9</mn><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mtext> </mtext><mn>3</mn><mo>+</mo><mn>0.9</mn><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>, starting from <math data-tex=\"V_0=(0,0)\"><mrow><msub><mi>V</mi><mn>0</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><math data-tex=\"k\"><mi>k</mi></math></th>\n<th><math data-tex=\"V_k(s_1)\"><mrow><msub><mi>V</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th>argmax at <math data-tex=\"s_1\"><msub><mi>s</mi><mn>1</mn></msub></math></th>\n<th><math data-tex=\"V_k(s_2)\"><mrow><msub><mi>V</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th>argmax at <math data-tex=\"s_2\"><msub><mi>s</mi><mn>2</mn></msub></math></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>2.000</td>\n<td>stay</td>\n<td>3.000</td>\n<td>go</td>\n</tr>\n<tr>\n<td>2</td>\n<td>3.800</td>\n<td>stay</td>\n<td>4.800</td>\n<td>go</td>\n</tr>\n<tr>\n<td>3</td>\n<td>5.420</td>\n<td>stay</td>\n<td>6.420</td>\n<td>go</td>\n</tr>\n<tr>\n<td>4</td>\n<td>6.878</td>\n<td>stay</td>\n<td>7.878</td>\n<td>go</td>\n</tr>\n<tr>\n<td>5</td>\n<td>8.190</td>\n<td>stay</td>\n<td>9.190</td>\n<td>go</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\to\\infty\"><mrow><mo>→</mo><mi>∞</mi></mrow></math></td>\n<td><strong>20.000</strong></td>\n<td>stay</td>\n<td><strong>21.000</strong></td>\n<td>go</td>\n</tr>\n</tbody>\n</table></div>\n<p>The argmax at each state stabilizes on &quot;stay&quot;/&quot;go&quot; from the very first sweep and never flips —\nvalue iteration here rediscovers <math data-tex=\"\\pi^*=\\{s_1:\\text{stay}, s_2:\\text{go}\\}\"><mrow><msup><mi>π</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><msub><mi>s</mi><mn>1</mn></msub><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mtext>stay</mtext><mo separator=\"true\">,</mo><msub><mi>s</mi><mn>2</mn></msub><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mtext>go</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math> well before the value\nestimates themselves finish converging, which is typical: the <em>policy</em> often stabilizes long\nbefore the <em>values</em> do.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s16\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">14</span>\n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>THE RL FOUNDATION STACK\n════════════════════════\n\n   ┌─────────────────────────────────────────────┐\n   │  Applications: games, LLMs, robotics, finance │\n   └──────────────────┬──────────────────────────┘\n                      │ all rest on\n   ┌──────────────────▼──────────────────────────┐\n   │  RL Algorithms: Q-Learning, DQN, Actor-Critic │\n   │  (covered in Parts 2–3 of this module)        │\n   └──────────────────┬──────────────────────────┘\n                      │ all solve\n   ┌──────────────────▼──────────────────────────┐\n   │  Bellman Equations                            │\n   │  Expectation: V^π(s) = Σ π(a|s)[R + γV(s')] │\n   │  Optimality:  V*(s) = max_a [R + γV*(s')]    │\n   └──────────────────┬──────────────────────────┘\n                      │ which define\n   ┌──────────────────▼──────────────────────────┐\n   │  MDP = (S, A, P, R, γ)                       │\n   │  Markov property: future ⊥ past | present    │\n   └──────────────────┬──────────────────────────┘\n                      │ which captures\n   ┌──────────────────▼──────────────────────────┐\n   │  Agent-Environment Loop                       │\n   │  observe s → take a → get r, s' → repeat     │\n   └─────────────────────────────────────────────┘</pre></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li>\n<p><strong>RL is fundamentally different from supervised learning because the agent's actions change\nthe data distribution.</strong> In supervised learning, the i.i.d. assumption holds — each training\nexample is independent. In RL, choosing action <math data-tex=\"a\"><mi>a</mi></math> in state <math data-tex=\"s\"><mi>s</mi></math> transitions to a <em>different</em>\nstate <math data-tex=\"s'\"><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></math>, which determines what data the agent sees next. This sequential, non-i.i.d.\nstructure is what makes RL both harder and more powerful than supervised learning.</p>\n</li>\n<li>\n<p><strong>The Bellman equations are the foundational recursive decomposition of RL.</strong> Every RL\nalgorithm — from tabular Q-learning to deep policy gradients — is ultimately a method for\nsolving (approximately) some Bellman equation. Understanding the exact form (expectation vs.\noptimality, V vs. Q) is prerequisite to understanding what each algorithm is actually computing.</p>\n</li>\n<li>\n<p><strong>The discount factor γ is not just a mathematical convenience — it encodes a design decision\nabout time preference.</strong> The choice of γ determines how far ahead the agent plans, how it\ntrades off immediate versus delayed rewards, and whether the return is even well-defined (for\ncontinuing tasks). Changing γ changes the <em>problem</em>, not just the solution.</p>\n</li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-24-s17\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">13 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">How does RL differ from supervised learning in three specific ways?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>(1) <strong>No supervisor:</strong> RL has no correct-label teacher — only a scalar reward signal that may be\ndelayed. (2) <strong>Delayed feedback:</strong> the agent takes a sequence of actions before knowing whether\nthe outcome was good; in supervised learning, the loss is computed immediately after each\nprediction. (3) <strong>Non-i.i.d. data:</strong> the agent's actions change the state, which determines the\nnext observation — the data distribution depends on the agent's own policy, violating the i.i.d.\nassumption that supervised learning relies on.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Define an MDP and explain why the Markov property matters for computational tractability.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>An MDP is a 5-tuple (S, A, P, R, γ). The Markov property states that P(s_{t+1} | s_t, a_t)\ndoesn't depend on the history s_1, a_1, ..., s_{t-1}, a_{t-1} — the current state is sufficient.\nThis matters because without it, the agent would need to track arbitrarily long histories, making\nthe state space (and therefore the value function) grow exponentially with time. With the Markov\nproperty, the value function is just V(s): a function of the current state alone, which is\ntractable to learn and store.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why is γ < 1 mandatory for continuing tasks but optional for episodic tasks?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>For continuing tasks (infinite horizon), the return G_t = Σ_{k=0}^∞ γ^k R_{t+k+1} is an\ninfinite sum. If γ = 1 and rewards are nonzero, this sum diverges — the return is infinite and\nthe value function is undefined. With γ &lt; 1, the geometric series converges to a finite value\n(1/(1-γ) times the average reward). For episodic tasks, the sum is finite (T - t terms), so it\nconverges regardless of γ.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">State the Bellman expectation equation for V^π and explain what \"backup\" means graphically.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>V^π(s) = Σ_a π(a|s) [R(s,a) + γ Σ_{s'} P(s'|s,a) V^π(s')]. Graphically, the value at state s\n&quot;backs up&quot; to the values of the next states s' it can reach: each next state's value is weighted\nby the transition probability, each action is weighted by the policy, and the immediate reward is\nadded. The value function is recursively defined in terms of the values of successor states.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain why the Bellman optimality equation is nonlinear and requires iterative solution.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The optimality equation replaces the policy-weighted average (Σ_a π(a|s) · ...) with a max\noperator (max_a [...]). The max makes the equation nonlinear — you cannot write it as a linear\nsystem Ax = b and solve by matrix inversion. Instead, iterative methods like value iteration\n(repeatedly apply the max update until convergence) or policy iteration (alternate evaluation and\nimprovement) are needed.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">In the worked 2-state MDP, what happens to the optimal policy when you increase the \"go\" reward at s₁?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Initially, staying at s₁ (reward 2) dominates going (reward 0). As the &quot;go&quot; reward increases,\nthere's a crossover point where 0 + 0.9·V*(s₂) &gt; 2 + 0.9·V*(s₁) — the discounted future value\nof being in s₂ outweighs the immediate staying reward. At that point, the optimal policy at s₁\nswitches from &quot;stay&quot; to &quot;go.&quot; The policy change is discontinuous (a threshold effect) while the\nvalue function changes smoothly.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is the effective planning horizon and how does it relate to γ?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The effective planning horizon is 1/(1-γ). At γ = 0.9, the agent plans ~10 steps ahead (rewards\nbeyond 10 steps contribute less than ~35% of their undiscounted value). At γ = 0.99, it plans\n~100 steps ahead. This directly controls how &quot;farsighted&quot; the agent is — a low γ makes it myopic\n(greedy for immediate reward), a high γ makes it willing to endure short-term pain for long-term\ngain.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the difference between policy evaluation, policy improvement, and policy iteration.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Policy evaluation: given a fixed policy π, compute V^π(s) for all states (by solving the linear\nsystem or iterating the Bellman expectation equation). Policy improvement: given V^π, construct a\nnew greedy policy π'(s) = argmax_a Q^π(s,a) that is guaranteed to be at least as good. Policy\niteration: alternate evaluation → improvement → evaluation → ... until the policy stops changing,\nat which point you've found π*.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why is γ = 0.9 the \"typical choice\"? What goes wrong with γ too low or too high?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>γ = 0.9 gives an effective horizon of 10 steps — long enough to plan meaningfully, short enough\nfor convergence. γ too low (e.g., 0.1, horizon ~1 step): the agent is too myopic to discover\ndelayed rewards; it may never find the treasure at the end of a maze because it only sees the\nimmediate +1 steps. γ too high (e.g., 0.999, horizon ~1000 steps): convergence is very slow (the\ncontraction factor is γ, so error shrinks slowly), and the agent may overvalue distant, uncertain\noutcomes.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A grid-world agent with γ = 0.9 consistently chooses the action leading to a +5 immediate reward over a path that yields +10 after 3 steps. Is this a bug or a feature? How would you change the behavior?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>With γ = 0.9, the +10 after 3 steps is discounted to 10 × 0.9³ ≈ 7.3, which exceeds the +5\nimmediate reward — so the agent <em>should</em> prefer the delayed path if the value function is correct.\nIf it doesn't, either (1) the value function hasn't converged yet (run more iterations), or (2)\nthe environment dynamics are being learned incorrectly (the agent doesn't yet know that the\n+10 path is reachable). Increasing γ (e.g., to 0.95, horizon 20) would make the delayed reward\neven more attractive, but the root cause is likely insufficient training, not γ being wrong.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li>\n<p><em>&quot;The Markov property says the current state suffices. But what if it doesn't — for exampl
