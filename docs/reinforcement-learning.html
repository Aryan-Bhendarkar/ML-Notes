e,\nin a POMDP where the state is partially observable? How would the framework need to change?&quot;</em> —\nin a POMDP (Partially Observable MDP), the agent doesn't observe the true state s_t directly\nbut instead receives an observation o_t drawn from P(o_t | s_t). The agent must maintain a\n<em>belief state</em> — a probability distribution over possible states — which is itself Markov. The\nframework extends from MDPs to POMDPs by replacing the state value function V(s) with a\nvalue function over belief distributions V(b), dramatically increasing computational complexity.</p>\n</li>\n<li>\n<p><em>&quot;Why does the contraction mapping theorem require γ &lt; 1 specifically? What mathematical\nproperty does γ &lt; 1 provide?&quot;</em> — the Bellman operator T defined by the expectation equation is\na contraction in the sup-norm with factor γ: ||TV₁ - TV₂||<em>∞ ≤ γ ||V₁ - V₂||</em>∞. The Banach\nfixed-point theorem then guarantees a unique fixed point (V^π) and convergence from any\nstarting point. When γ = 1, the operator is no longer a contraction (it's a non-expansive map),\nand the fixed point may not exist or may not be unique (e.g., in continuing tasks with\nnon-zero rewards, every state has infinite value).</p>\n</li>\n<li>\n<p><em>&quot;The lecture says policy iteration converges in a finite number of steps for finite MDPs.\nWhy finite rather than just 'converges'?&quot;</em> — because there are only |A|^|S| possible\ndeterministic policies for a finite MDP. Each improvement step either changes the policy (to a\nstrictly better one, by the policy improvement theorem) or leaves it unchanged (meaning it's\noptimal). Since the number of policies is finite and each step is strictly improving, the\nprocess must terminate in at most |A|^|S| steps — not just converging asymptotically, but\nreaching the optimum in finite time.</p>\n</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li>\n<p><strong>The Bellman expectation equation for V^π</strong> — <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.1\" role=\"link\" tabindex=\"0\">§9.1</a>: derive from the definition V^π(s) =\nE_π[G_t | S_t = s] by splitting G_t into R_{t+1} + γG_{t+1}, conditioning on the first\naction and first transition, and recognizing that E_π[G_{t+1} | S_{t+1} = s'] = V^π(s').</p>\n</li>\n<li>\n<p><strong>The relationship V^π(s) = Σ_a π(a|s) Q^π(s,a)</strong> — <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§8.3\" role=\"link\" tabindex=\"0\">§8.3</a>: derive by definition — V^π(s) is\nthe expectation of G_t given S_t = s, which decomposes over actions via the law of total\nexpectation: E[G_t | S_t = s] = Σ_a P(A_t = a | S_t = s) E[G_t | S_t = s, A_t = a] = Σ_a\nπ(a|s) Q^π(s,a).</p>\n</li>\n<li>\n<p><strong>Policy improvement theorem (sketch)</strong> — <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§12.1\" role=\"link\" tabindex=\"0\">§12.1</a>: starting from V^π, define π' as greedy w.r.t.\nQ^π. Show V^π'(s) ≥ V^π(s) by expanding V^π'(s) = Q^π(s, π'(s)) ≥ Q^π(s, π(s)) = V^π(s),\nwhere the inequality holds because π' chooses the argmax action.</p>\n</li>\n</ol>\n<h3>Applied scenario — Amazon warehouse robot navigation</h3>\n<p><strong>Framing:</strong> An Amazon warehouse robot must navigate from a pickup location to a shelf, grab a\npackage, and deliver it to a packing station. The robot receives +1 for each step toward the goal,\n+10 for successful delivery, -5 for collisions, and 0 otherwise.</p>\n<p><strong>MDP formulation:</strong></p>\n<ul>\n<li><strong>States:</strong> robot position (x, y), orientation, package held (yes/no), target shelf ID.</li>\n<li><strong>Actions:</strong> move forward, turn left, turn right, grab, release.</li>\n<li><strong>Transitions:</strong> stochastic — the robot may slip on wet floors, encounter other robots, or\nhave grasp failures (P(grab succeeds) = 0.9).</li>\n<li><strong>Discount factor:</strong> γ = 0.95 (planning ~20 steps ahead — appropriate for a warehouse aisle\nthat's ~15-20 steps long).</li>\n<li><strong>Reward function:</strong> encodes the business goal — fast, collision-free delivery.</li>\n</ul>\n<p><strong>Policy learning:</strong> start with a random policy, use policy iteration to find the optimal\nnavigation policy. The Bellman optimality equation's max operator naturally selects the fastest\ncollision-free path.</p>\n<p><strong>Failure modes:</strong></p>\n<ul>\n<li>γ too low: the robot becomes myopic, preferring short-term collision avoidance over reaching\nthe delivery goal.</li>\n<li>Reward misspecification: if +1 per step is too high relative to +10 for delivery, the robot\nmay wander indefinitely to collect step rewards.</li>\n<li>Partial observability: if the robot can't see around corners, the Markov property is violated —\nthe robot needs a belief state or memory.</li>\n</ul>\n<p><strong>What you'd ship:</strong> a value-iteration-trained policy with γ = 0.95, combined with a safety layer\nthat overrides the learned policy when a collision is imminent (constraining the max operator to\nsafe actions only).</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Invent and Simplify</strong> — the MDP framework reduces a complex\nwarehouse navigation problem to five well-defined elements (S, A, P, R, γ), making it tractable.\n<strong>Bias for Action</strong> — value iteration provides a concrete, computable policy rather than a vague\n&quot;navigate well&quot; directive.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s18\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>Action-value function Q^π(s,a)</strong> — expected cumulative discounted reward from state <math data-tex=\"s\"><mi>s</mi></math>,\ntaking action <math data-tex=\"a\"><mi>a</mi></math>, then following policy <math data-tex=\"\\pi\"><mi>π</mi></math>.</li>\n<li><strong>Bellman equation</strong> — recursive equation expressing the value of a state (or state-action\npair) in terms of the values of successor states.</li>\n<li><strong>Bellman expectation equation</strong> — the Bellman equation averaged over actions weighted by the\npolicy <math data-tex=\"\\pi\"><mi>π</mi></math>; used for policy evaluation.</li>\n<li><strong>Bellman optimality equation</strong> — the Bellman equation with max over actions; defines the\noptimal value function <math data-tex=\"V^*\"><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup></math>.</li>\n<li><strong>Contraction mapping theorem</strong> — guarantees convergence of iterative Bellman updates when\n<math data-tex=\"\\gamma &lt; 1\"><mrow><mi>γ</mi><mo>&lt;</mo><mn>1</mn></mrow></math>; the Bellman operator is a contraction with factor <math data-tex=\"\\gamma\"><mi>γ</mi></math>.</li>\n<li><strong>Continuing task</strong> — an RL task with no natural terminal state; the agent interacts forever.</li>\n<li><strong>Discount factor γ</strong> — controls how much future rewards are valued relative to immediate\nrewards; <math data-tex=\"\\gamma \\in [0,1)\"><mrow><mi>γ</mi><mo>∈</mo><mo form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1</mn><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></math>.</li>\n<li><strong>Effective planning horizon</strong> — <math data-tex=\"\\frac{1}{1-\\gamma}\"><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mi>γ</mi></mrow></mfrac></math>; approximately how many steps ahead the\nagent &quot;cares about.&quot;</li>\n<li><strong>Episodic task</strong> — an RL task that breaks into finite episodes from start to terminal state.</li>\n<li><strong>Greedy policy</strong> — a policy that always chooses the action with the highest Q-value:\n<math data-tex=\"\\pi(s) = \\arg\\max_a Q(s,a)\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>max</mi><mi>a</mi></msub><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</li>\n<li><strong>Markov Decision Process (MDP)</strong> — 5-tuple <math data-tex=\"(\\mathcal{S}, \\mathcal{A}, P, R, \\gamma)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi class=\"mathcal\">𝒮</mi><mo separator=\"true\">,</mo><mi class=\"mathcal\">𝒜</mi><mo separator=\"true\">,</mo><mi>P</mi><mo separator=\"true\">,</mo><mi>R</mi><mo separator=\"true\">,</mo><mi>γ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math>\ndefining a sequential decision problem.</li>\n<li><strong>Markov property</strong> — the future depends only on the present state, not the history.</li>\n<li><strong>Policy <math data-tex=\"\\pi\"><mi>π</mi></math></strong> — a rule for choosing actions, either deterministic (<math data-tex=\"\\pi(s) = a\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>a</mi></mrow></math>) or\nstochastic (<math data-tex=\"\\pi(a|s)\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> = probability).</li>\n<li><strong>Policy improvement</strong> — constructing a new greedy policy from a value function; guaranteed to\nbe at least as good.</li>\n<li><strong>Policy iteration</strong> — alternating policy evaluation and policy improvement until convergence.</li>\n<li><strong>Return <math data-tex=\"G_t\"><msub><mi>G</mi><mi>t</mi></msub></math></strong> — cumulative discounted reward from time <math data-tex=\"t\"><mi>t</mi></math> onward:\n<math data-tex=\"G_t = \\sum_{k=0}^{\\infty} \\gamma^k R_{t+k+1}\"><mrow><msub><mi>G</mi><mi>t</mi></msub><mo>=</mo><msubsup><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mi>∞</mi></msubsup><msup><mi>γ</mi><mi>k</mi></msup><msub><mi>R</mi><mrow><mi>t</mi><mo>+</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow></math>.</li>\n<li><strong>Reward hypothesis</strong> — all goals can be described as maximizing expected cumulative reward.</li>\n<li><strong>State value function V^π(s)</strong> — expected cumulative discounted reward from state <math data-tex=\"s\"><mi>s</mi></math> under\npolicy <math data-tex=\"\\pi\"><mi>π</mi></math>.</li>\n<li><strong>Transition probability <math data-tex=\"P(s'|s,a)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></strong> — probability of reaching state <math data-tex=\"s'\"><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></math> from state <math data-tex=\"s\"><mi>s</mi></math>\nunder action <math data-tex=\"a\"><mi>a</mi></math>.</li>\n<li><strong>Value iteration</strong> — iteratively applying the Bellman optimality update to converge to <math data-tex=\"V^*\"><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup></math>.</li>\n</ul>\n<hr>\n</section><section id=\"reinforcement-learning-24-s19\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Name three specific ways RL differs from supervised learning and explain why each matters.\n<em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Define an MDP as a 5-tuple and explain what each element represents in a grid-world example.\n<em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>)</em></li>\n<li>State the Markov property and give one example where it holds and one where it doesn't.\n<em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>)</em></li>\n<li>Explain why γ &lt; 1 is mandatory for continuing tasks but optional for episodic tasks. Compute\nthe return for a reward sequence [1, 1, 1, ...] with γ = 0.9 and γ = 1. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>, <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>Define V^π(s) and Q^π(s,a) and state their mathematical relationship. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>)</em></li>\n<li>Write the Bellman expectation equation for V^π and solve the 2-state MDP example from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9.2\" role=\"link\" tabindex=\"0\">§9.2</a>.\n<em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n<li>Explain why the Bellman optimality equation is nonlinear and cannot be solved by matrix\ninversion. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>Describe policy iteration's alternating steps and explain why the policy improvement theorem\nguarantees convergence. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>)</em></li>\n<li>What is the effective planning horizon for γ = 0.99? For γ = 0.5? <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>A robot in a maze gets -1 per step and +100 at the goal. With γ = 0.9 and a path that's 5\nsteps long, what is the discounted return? With γ = 0.5? <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>)</em></li>\n<li>Explain why a purely deterministic policy may fail in exploration-heavy environments and how\nstochastic policies address this. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>)</em></li>\n<li>State the contraction mapping theorem's role in RL and explain what happens when its\nassumption (γ &lt; 1) is violated. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>)</em></li>\n<li>In the grid-world simulation, explain why a random policy produces uniformly poor state values\nwhile the greedy policy produces meaningful values. <em>(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>, interactive demo)</em></li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-24-s20\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s20\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>\n<p><strong>Sutton &amp; Barto, &quot;Reinforcement Learning: An Introduction&quot; (2nd ed., 2018)</strong> — ⚠️ <strong>named on\nthe slides</strong> [slide 148] as the primary textbook reference. <code>solid</code>. The standard RL textbook;\ncovers everything in this lecture and all subsequent topics in the module.</p>\n</li>\n<li>\n<p><strong>David Silver's RL course (UCL/DeepMind)</strong> — ⚠️ <strong>named on the slides</strong> [slide 148] as\nrecommended video lectures. <code>solid</code>. Free lecture series that mirrors this module's structure\nclosely.</p>\n</li>\n<li>\n<p><strong>Stanford CS234: Reinforcement Learning</strong> — ⚠️ <strong>named on the slides</strong> [slide 148]. <code>solid</code>.\nMore mathematically rigorous than Silver's course.</p>\n</li>\n<li>\n<p><strong>Berkeley CS285: Deep Reinforcement Learning</strong> — ⚠️ <strong>named on the slides</strong> [slide 148]. <code>hard</code>.\nFocuses on deep RL methods (DQN, policy gradients, model-based RL) — the natural next step after\nthis foundational lecture.</p>\n</li>\n<li>\n<p><strong>Mnih et al. (2015), &quot;Human-level control through deep reinforcement learning&quot; (DQN)</strong> —\n⚠️ not named on the slides but referenced implicitly as the Atari result. <code>hard</code>. The paper\nthat launched deep RL.</p>\n</li>\n<li>\n<p><strong>OpenAI Five (2019)</strong> — ⚠️ not named on the slides but referenced as the Dota 2 result.\n<code>solid</code>. Demonstrates self-play at scale.</p>\n</li>\n<li>\n<p><strong>OpenAI Spinning Up (spinningup.openai.com)</strong> — ⚠️ <strong>named on the slides</strong> [slide 148,\n&quot;References &amp; Further Reading&quot; — corrected from a previous, wrong citation to slide 72, which is\nactually the discount-factor demo] as recommended online resource. <code>solid</code>. A practical\nintroduction to deep RL algorithms.</p>\n</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — items 1–4 are explicitly recommended on the lecture's own slides. Items\n5–6 are referenced implicitly through the applications discussion but not cited by author —\ntitle/venue/year not on a slide, so only the standard bibliographic record backs them.</p>\n<p>✅ <strong>Citation check (enhancement pass).</strong> Independently verified against primary/secondary sources:\nSutton &amp; Barto's <em>Reinforcement Learning: An Introduction</em> is the 2018 2nd edition (MIT Press);\nMnih et al. (2015) &quot;Human-level control through deep reinforcement learning&quot; is <em>Nature</em> <strong>518</strong>,\n529–533 (DOI 10.1038/nature14236) — title, author list, journal, volume, and year all confirmed\nexact. No corrections needed to any citation in this list.\ntreat as suggested background reading.</p>\n</aside>\n</section>","sections":[{"id":"reinforcement-learning-24-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s1","num":"","title":"Before we start: what you need to know","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s2","num":"","title":"The big picture","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s3","num":"1","title":"What Is Reinforcement Learning?","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s4","num":"2","title":"The RL Framework","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s5","num":"3","title":"Episodic vs. Continuing Tasks","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s6","num":"4","title":"Real-World Applications","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s7","num":"5","title":"Markov Decision Processes (MDPs)","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s8","num":"6","title":"Transition Probabilities","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s9","num":"7","title":"Reward Functions and the Discount Factor","mins":5,"kind":"content","part":""},{"id":"reinforcement-learning-24-s10","num":"8","title":"Value Functions","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s11","num":"9","title":"Bellman Expectation Equations","mins":4,"kind":"content","part":""},{"id":"reinforcement-learning-24-s12","num":"10","title":"Bellman Optimality Equations","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s13","num":"11","title":"Policy Evaluation","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s14","num":"12","title":"Policy Improvement and Policy Iteration","mins":2,"kind":"content","part":""},{"id":"reinforcement-learning-24-s15","num":"13","title":"Value Iteration","mins":1,"kind":"content","part":""},{"id":"reinforcement-learning-24-s16","num":"14","title":"Putting it together","mins":2,"kind":"back","part":""},{"id":"reinforcement-learning-24-s17","num":"","title":"Interview prep — Amazon Applied Scientist","mins":13,"kind":"back","part":""},{"id":"reinforcement-learning-24-s18","num":"","title":"Glossary","mins":2,"kind":"back","part":""},{"id":"reinforcement-learning-24-s19","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"reinforcement-learning-24-s20","num":"","title":"Going deeper","mins":2,"kind":"back","part":""}],"interactiveCount":1},{"id":"reinforcement-learning-25","num":"25","file":"reinforcement-learning-02","kind":"lecture","title":"Reinforcement Learning — Part 2: From Planning to Learning","h1":"Reinforcement Learning — Part 2: From Planning to Learning","subtitle":"From Planning to Learning","spineLabel":"Part 2","short":"From Planning to Learning","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~55:00. Originally drafted from <code>slides_deduped/</code> (70 slides) with OCR + transcript\nverification, then <strong>audited against the raw 134-frame capture</strong> in\n<code>output/Lecture_25 - Module 8 Reinforcement Learning Part 2/</code> per this project's standard\nmethodology (see project memory <code>slides-deduped-is-lossy</code>) — one real gap (Thompson Sampling) and\none under-transcribed demo (the grid-world policy-evaluation sweeps, now in <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>) were found and\nfixed; a subsequent quality-review pass independently re-verified the sweep numbers in <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a> and\n<a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a> pixel-for-pixel against the raw frames and confirmed both are exact (see\n<code>QUALITY_REVIEW.md</code>). Instructor: previously credited as <strong>&quot;Naman Kanan&quot;</strong>, but no slide in the\ndeck shows a nameplate with that name. The lecture's own interactive-demo slides\n(<code>slide_015.jpg</code>–<code>slide_052.jpg</code>) repeatedly show a browser address bar reading\n<code>file:///Users/nkhetan/RL_Interactive_Examples/...</code> — the macOS account name <strong>&quot;nkhetan&quot;</strong> is the\nonly direct evidence of the instructor's identity anywhere in the raw capture, suggesting a surname\n<strong>Khetan</strong> (first initial &quot;N&quot;) rather than &quot;Naman Kanan.&quot; ⚠️ <strong>This is still not a full\nconfirmation</strong> — no slide shows a full first name — so the credit below is stated as inferred, not\nconfirmed. This lecture is the bridge from Part 1's definitions (MDPs, Bellman equations) to actual\nalgorithms that solve problems — starting from the ideal case (full model known) and progressively\nremoving assumptions until arriving at DQN, which learns Atari games from raw pixels.</p>\n</blockquote>\n<hr>\n</div><section id=\"reinforcement-learning-25-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain the three limitations of dynamic programming</strong> (needs complete model, curse of\ndimensionality, discrete spaces only) and why we need model-free methods.</li>\n<li><strong>Solve a small MDP using value iteration</strong> and explain why it converges (contraction mapping).</li>\n<li><strong>Define the exploration-exploitation tradeoff</strong> and implement epsilon-greedy, softmax, and\nUCB strategies, explaining when each is preferred.</li>\n<li><strong>Explain why multi-armed bandits are the simplest RL problem</strong> and compute regret for a given\nstrategy.</li>\n<li><strong>Distinguish contextual bandits from full RL</strong> and explain why industry prefers the bandit\nsetting (immediate rewards, no sequential consequences).</li>\n<li><strong>Derive the TD(0) update rule</strong> from the Bellman equation and explain bootstrapping,\nthe TD target, and the TD error δ.</li>\n<li><strong>Explain why TD learning is &quot;the best of both worlds&quot;</strong> compared to DP and Monte Carlo.</li>\n<li><strong>Implement SARSA and Q-learning</strong> and explain the single-word difference (max vs. actual a')\nthat changes everything.</li>\n<li><strong>Explain the on-policy vs. off-policy distinction</strong> using behavior and target policies, and\nwhy off-policy enables experience replay.</li>\n<li><strong>State the deadly triad</strong> (off-policy + function approximation + bootstrapping) and explain\nwhy DQN uses all three yet remains stable.</li>\n<li><strong>Describe the DQN architecture</strong> (84×84×4 input, 3 conv layers, FC layer, Q-output) and\nexplain each design choice.</li>\n<li><strong>Explain the two DQN tricks</strong> (experience replay + target network) and how each solves a\nspecific problem.</li>\n<li><strong>Name and describe four DQN variants</strong> (Double DQN, Dueling, Prioritized Replay, Rainbow)\nand what each improves.</li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-25-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — Part 1 vocabulary</h3>\n<p>This lecture assumes familiarity with MDPs (5-tuple), Bellman expectation and optimality\nequations, V(s) and Q(s,a), policy iteration, and value iteration from Part 1. If these are\nunfamiliar, read Part 1 first.</p>\n<h3>Prerequisite 2 — Neural network basics</h3>\n<p>DQN (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>) replaces a Q-table with a neural network. You need to understand: forward pass\n(input → output), backpropagation (computing gradients), and loss functions (mean squared error).\nNo deep architectural knowledge is needed — the DQN network is just 3 convolutional layers +\n1 fully connected layer.</p>\n<h3>Prerequisite 3 — Gradient descent</h3>\n<p>The DQN training loop uses gradient descent to minimize a loss. You need to know: we adjust\nweights θ in the direction that reduces loss, controlled by a learning rate α.</p>\n<hr>\n</section><section id=\"reinforcement-learning-25-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>This lecture follows an <strong>organized journey where each step removes an assumption:</strong></p>\n<figure class=\"ascii\"><pre>Dynamic Programming (§2–§3)\n   Assumption: COMPLETE model (P, R known)\n   Remove it → need model-free methods\n        │\n        ▼\nExploration vs. Exploitation (§4)\n   Problem: what to try when you don't know the world\n   Strategies: ε-greedy, softmax, UCB\n        │\n        ▼\nMulti-Armed Bandits (§5)\n   Simplest RL: no states, no transitions, pure exploration\n   Bandits are the most widely deployed RL in industry\n        │\n        ▼\nTemporal Difference Learning (§6–§7)\n   The HEART of the course\n   Learn from experience, no model, update every step\n   TD(0), SARSA (on-policy), Q-learning (off-policy)\n        │\n        ▼\nOn-policy vs. Off-policy (§8)\n   The distinction that unlocks data efficiency\n   Off-policy → experience replay → DQN\n        │\n        ▼\nDeep Q-Networks (§9–§11)\n   Replace Q-table with neural network\n   Two tricks: replay + target network\n   Result: superhuman Atari from raw pixels</pre></figure>\n<p>Two threads to hold the entire time:</p>\n<ol>\n<li><strong>Almost every algorithm is a version of the same idea:</strong> update my estimate toward reward +\ndiscounted future value.</li>\n<li><strong>There is constant tension</strong> between using what you already know (exploit) and discovering\nsomething better (explore).</li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-25-s3\" data-title=\"Recap: What Is Reinforcement Learning?\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">Recap: What Is Reinforcement Learning?</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;RL is learning what to do — how to map situations to actions — so as to maximize a numerical\nreward signal.&quot;</em> — Sutton &amp; Barto</p>\n</blockquote>\n<p>Two features unique to RL:</p>\n<ul>\n<li><strong>Trial-and-error search</strong> — no labels, must discover by trying.</li>\n<li><strong>Delayed reward</strong> — actions affect not just immediate reward but all future rewards.</li>\n</ul>\n<p>Part 1 gave us the language (MDPs, Bellman equations). Part 2 is where the equations turn into\n<strong>algorithms that actually solve problems.</strong></p>\n<hr>\n</section><section id=\"reinforcement-learning-25-s4\" data-title=\"Dynamic Programming — Planning with a Known Model\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Dynamic Programming — Planning with a Known Model</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>2.1 What DP means in RL</h3>\n<p>DP computes the optimal policy when you have <strong>full knowledge</strong> of the environment — the complete\nMDP (S, A, P, R, γ).</p>\n<blockquote class=\"aside-quote\">\n<p><strong>Analogy:</strong> a GPS with a complete map and live traffic data. It doesn't drive around trying\nroutes (that would be learning). It computes the shortest route directly from the map. That's\nDP — planning on a known model.</p>\n</blockquote>\n<h3>2.2 The three limitations (why DP isn't enough)</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Limitation</th>\n<th>Why it's a problem</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Needs complete model</strong></td>\n<td>Real agents don't know P(s'|s,a)</td>\n<td>A robot doesn't have physics equations for every surface</td>\n</tr>\n<tr>\n<td><strong>Curse of dimensionality</strong></td>\n<td>Sweeps over ALL states every iteration</td>\n<td>Chess: ~10⁴⁷ states. Go: ~10¹⁷⁰. Atari: effectively infinite</td>\n</tr>\n<tr>\n<td><strong>Discrete spaces only</strong></td>\n<td>Continuous control has infinite states</td>\n<td>Robot arm joint angles are continuous</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The punchline that sets up the entire rest of the talk:</strong> both DP methods require the\nfull model P(s'|s,a). In the real world, we almost never have that. We need methods that\n<strong>learn from experience without a model.</strong></p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-25-s5\" data-title=\"Policy Iteration and Value Iteration (Review + Demo)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Policy Iteration and Value Iteration (Review + Demo)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">8 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>3.1 Policy evaluation (iterative)</h3>\n<p>Given a fixed policy π, compute V^π(s) by repeatedly applying the Bellman expectation update\nuntil convergence. Each sweep pushes reward information one step backward through the state space.</p>\n<p>🧪 <strong>Worked example — evaluating a bad policy honestly.</strong> The demo's grid: γ=0.9, step reward −1,\nGOAL +10, PIT −10, policy = <strong>uniform random</strong> (¼ probability each direction, so it often stumbles\ninto the pit). Every <math data-tex=\"V^\\pi(s)\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> starts at 0.00, then the start cell's value is recomputed each\nsweep by averaging its four neighbors' <em>current</em> values:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Sweep</th>\n<th><math data-tex=\"V^\\pi(\\text{start})\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>start</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th>Sweep</th>\n<th><math data-tex=\"V^\\pi(\\text{start})\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>start</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><math data-tex=\"\\tfrac14(-1.00-1.00-1.00-10.00)=\"><mrow><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>1.00</mn><mo>−</mo><mn>1.00</mn><mo>−</mo><mn>1.00</mn><mo>−</mo><mn>10.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo></mrow></math> <strong>−3.25</strong></td>\n<td>10</td>\n<td><strong>−15.58</strong></td>\n</tr>\n<tr>\n<td>2</td>\n<td><math data-tex=\"\\tfrac14(-1.90-3.93-3.93-12.93)=\"><mrow><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>1.90</mn><mo>−</mo><mn>3.93</mn><mo>−</mo><mn>3.93</mn><mo>−</mo><mn>12.93</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo></mrow></math> <strong>−5.67</strong></td>\n<td>15</td>\n<td><strong>−17.96</strong></td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>−10.88</strong></td>\n<td>20</td>\n<td><strong>−19.23</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>This is policy evaluation working exactly as designed, on a genuinely bad policy.</strong> A uniform\nrandom walker in a grid with a −10 pit spends much of its (infinite-horizon, γ=0.9) future\nblundering into that pit, so its true value keeps drifting more negative for many sweeps before\nsettling — the algorithm isn't broken, the <em>policy</em> is bad, and the numbers say so honestly. This\nis the same iterative Bellman-expectation update from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-01\" data-xref=\"Part 1 §11\" role=\"link\" tabindex=\"0\">Part 1 §11</a>, just watched sweep by sweep on\na policy worth evaluating critically instead of trusting.</p>\n<figure class=\"iv\" id=\"iv-reinforcement-learning-25-0\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Policy Evaluation — Sweeping a Bad Policy Honestly&quot;,&quot;concept&quot;:&quot;Iterative policy evaluation under a fixed policy (here: uniform random)&quot;,&quot;control&quot;:&quot;Step through sweeps one at a time (or auto-run) on the 3×3 grid&quot;,&quot;observe&quot;:&quot;Every cell's V^π(s) updates from its neighbors' current values each sweep; the start cell drifts from 0.00 down toward its converged value around −20.7 as the pit's influence propagates backward&quot;,&quot;insight&quot;:&quot;A worsening value estimate isn't a broken algorithm — it's the algorithm correctly discovering that a uniform-random walker in a grid with a −10 pit is, in expectation, a bad plan&quot;,&quot;fallback&quot;:&quot;The sweep table above (sweeps 1, 2, 5, 10, 15, 20 → −3.25, −5.67, −10.88, −15.58, −17.96, −19.23 at the start cell) shows the same convergence a static reader can follow by hand.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Policy Evaluation — Sweeping a Bad Policy Honestly</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Iterative policy evaluation under a fixed policy (here: uniform random)</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through sweeps one at a time (or auto-run) on the 3×3 grid</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Every cell's V^π(s) updates from its neighbors' current values each sweep; the start cell drifts from 0.00 down toward its converged value around −20.7 as the pit's influence propagates backward</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>A worsening value estimate isn't a broken algorithm — it's the algorithm correctly discovering that a uniform-random walker in a grid with a −10 pit is, in expectation, a bad plan</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The sweep table above (sweeps 1, 2, 5, 10, 15, 20 → −3.25, −5.67, −10.88, −15.58, −17.96, −19.23 at the start cell) shows the same convergence a static reader can follow by hand.</p>\n    </div>\n  </figure>\n<h3>3.2 Policy iteration</h3>\n<p>Alternate two steps:</p>\n<ol>\n<li><strong>Evaluate:</strong> compute V^π for current policy.</li>\n<li><strong>Improve:</strong> at every state, switch to the greedy action: π'(s) = argmax_a Q^π(s,a).</li>\n</ol>\n<p><strong>Policy Improvement Theorem:</strong> the new policy is guaranteed to be ≥ the old one. Since there\nare finitely many policies and each round strictly improves, the process <strong>must converge to π*.</strong></p>\n<p><strong>Downside:</strong> Step 1 (full evaluation) is expensive — many sweeps over all states before each\nimprovement.</p>\n<p>🧪 <strong>Worked example — a genuinely bad policy, evaluated honestly, then fixed in one flip.</strong> This\nis a <em>different</em> demo from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>'s (same grid: γ=0.9, step −1, GOAL +10, PIT −10, but this one\nstarts from a <strong>deterministic</strong> policy: every cell points <strong>all → Right</strong>). The bottom-left cell's\narrow therefore points straight at the pit:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Sweep</th>\n<th><math data-tex=\"V(\\text{start})\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>start</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n<th>Sweep</th>\n<th><math data-tex=\"V(\\text{start})\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>start</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><math data-tex=\"-10+0.9(0.00)=\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>10</mn><mo>+</mo><mn>0.9</mn><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo></mrow></math> <strong>−10.00</strong></td>\n<td>4</td>\n<td><strong>−34.39</strong></td>\n</tr>\n<tr>\n<td>2</td>\n<td><math data-tex=\"-10+0.9(-10.00)=\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>10</mn><mo>+</mo><mn>0.9</mn><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>10.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo></mrow></math> <strong>−19.00</strong></td>\n<td>56</td>\n<td>−99.73</td>\n</tr>\n<tr>\n<td>3</td>\n<td><math data-tex=\"-10+0.9(-19.00)=\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>10</mn><mo>+</mo><mn>0.9</mn><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>19.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo></mrow></math> <strong>−27.10</strong></td>\n<td>57</td>\n<td><strong>≈ −100.00</strong> (converged)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Evaluation on this policy crashes almost to <math data-tex=\"-100\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>100</mn></mrow></math></strong> — the theoretical floor for a state that\nnever escapes a <math data-tex=\"-10\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>10</mn></mrow></math> step (its own discounted self-loop value is <math data-tex=\"-10/(1-0.9)=-100\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>10</mn><mi>/</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.9</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>100</mn></mrow></math>), because the\npolicy sends the agent to fall into the pit, restart, and fall in again, forever. <strong>Improve</strong> then\nlooks at this converged <math data-tex=\"V^\\pi\"><msup><mi>V</mi><mi>π</mi></msup></math> and asks, for the bottom-left cell, &quot;would any other action beat\n'go right into the pit forever'?&quot; — yes: going up leads toward better-valued cells instead. The\narrow flips from → to ↑. Re-evaluating under the new policy and repeating Improve converges, by\niteration 5, to exactly the same optimal values <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>'s Value Iteration demo reaches independently:\n<math data-tex=\"V^*(\\text{start})=4.58\"><mrow><msup><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>start</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>4.58</mn></mrow></math> (and <math data-tex=\"6.20\"><mn>6.20</mn></math>, <math data-tex=\"8.00\"><mn>8.00</mn></math>, <math data-tex=\"10.00\"><mn>10.00</mn></math> elsewhere in the grid) — <strong>two structurally\ndifferent algorithms (alternate full evaluation vs. one-step max) landing on the identical answer</strong>,\nwhich is exactly the guarantee the policy improvement theorem promises.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This is a separate interactive demo from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>'s</strong>, not the same one re-run: <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a> shows a\n<strong>uniform-random</strong> policy settling to a <em>moderately</em> bad value (~−20.7) because random wandering\nonly occasionally wanders into the pit; this section's policy is <em>deterministically</em> aimed at the\npit, so its evaluated value crashes far lower, toward the theoretical worst case of −100. Both are\nreal, both are useful teaching points, and neither is a contradiction of the other.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-reinforcement-learning-25-1\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Policy Iteration — Crash, Then One Flip Fixes It&quot;,&quot;concept&quot;:&quot;Policy iteration's evaluate → improve loop, on a policy that starts genuinely bad&quot;,&quot;control&quot;:&quot;Step through evaluation sweeps under the deterministic \\&quot;all → Right\\&quot; policy, then trigger Improve&quot;,&quot;observe&quot;:&quot;V(start) crashing sweep by sweep toward roughly −100 while evaluation faithfully reports the policy's true (terrible) worth; then, after Improve, the bottom-left cell's arrow flips from → to ↑ and the value climbs back up over the next few evaluate/improve rounds&quot;,&quot;insight&quot;:&quot;Evaluation's job is only to report the truth about whatever policy it's given, however bad — Improve is what fixes it, and here a single flipped arrow is enough to send the policy to the same optimum value iteration reaches independently&quot;,&quot;fallback&quot;:&quot;The worked-example table above (sweeps 1–57: −10.00 → −19.00 → −27.10 → −34.39 → roughly −100.00) followed by the post-Improve convergence to 4.58/6.20/8.00/10.00, matching §3.3's value-iteration result exactly.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Policy Iteration — Crash, Then One Flip Fixes It</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Policy iteration's evaluate → improve loop, on a policy that starts genuinely bad</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through evaluation sweeps under the deterministic \"all → Right\" policy, then trigger Improve</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>V(start) crashing sweep by sweep toward roughly −100 while evaluation faithfully reports the policy's true (terrible) worth; then, after Improve, the bottom-left cell's arrow flips from → to ↑ and the value climbs back up over the next few evaluate/improve rounds</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Evaluation's job is only to report the truth about whatever policy it's given, however bad — Improve is what fixes it, and here a single flipped arrow is enough to send the policy to the same optimum value iteration reaches independently</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The worked-example table above (sweeps 1–57: −10.00 → −19.00 → −27.10 → −34.39 → roughly −100.00) followed by the post-Improve convergence to 4.58/6.20/8.00/10.00, matching <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>'s value-iteration result exactly.</p>\n    </div>\n  </figure>\n<h3>3.3 Value iteration — the efficient shortcut</h3>\n<p><strong>Insight:</strong> why fully evaluate before improving? Fold both into one step:</p>\n<div class=\"mblk\"><math data-tex=\"V(s) \\leftarrow \\max_a \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) \\cdot V(s') \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo stretchy=\"false\">←</mo><munder><mi>max</mi><mi>a</mi></munder><mo>⁡</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>γ</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p>Replace the policy-weighted average with a <strong>max</strong> — merges evaluation and improvement into a\nsingle update.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Policy Iteration</th>\n<th>Value Iteration</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Outer loops</td>\n<td>Fewer</td>\n<td>More</td>\n</tr>\n<tr>\n<td>Each loop</td>\n<td>Full evaluation (expensive)</td>\n<td>Single sweep (cheap)</td>\n</tr>\n<tr>\n<td>Preferred for</td>\n<td>Small problems</td>\n<td>Large problems</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Demo:</strong> value iteration on the 3×3 grid — watch values spread outward from +10 goal, one ring\nper sweep, converging in ~5 sweeps to V(start) ≈ 4.58.</p>\n<figure class=\"iv\" id=\"iv-reinforcement-learning-25-2\" data-iv=\"{&quot;type&quot;:&quot;animation&quot;,&quot;title&quot;:&quot;Value Iteration — Values Spreading From the Goal&quot;,&quot;concept&quot;:&quot;Value iteration folds evaluation and improvement into one max-based update&quot;,&quot;control&quot;:&quot;Step forward sweep by sweep on the 3×3 grid&quot;,&quot;observe&quot;:&quot;Values spread outward from the +10 goal cell one ring per sweep, converging in ~5 sweeps&quot;,&quot;insight&quot;:&quot;Because every sweep already takes the max over actions, there's no separate improvement phase to wait for — the optimal policy falls out for free the moment V converges, unlike §3.2's alternating evaluate/improve loop&quot;,&quot;fallback&quot;:&quot;The description above — values spread outward from the goal one ring per sweep, converging in ~5 sweeps to V(start) ≈ 4.58, the same fixed point §3.2's policy iteration reaches by a structurally different route.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · animation</span>\n      <span class=\"iv-title\">Value Iteration — Values Spreading From the Goal</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Value iteration folds evaluation and improvement into one max-based update</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step forward sweep by sweep on the 3×3 grid</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Values spread outward from the +10 goal cell one ring per sweep, converging in ~5 sweeps</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Because every sweep already takes the max over actions, there's no separate improvement phase to wait for — the optimal policy falls out for free the moment V converges, unlike <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.2\" role=\"link\" tabindex=\"0\">§3.2</a>'s alternating evaluate/improve loop</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The description above — values spread outward from the goal one ring per sweep, converging in ~5 sweeps to V(start) ≈ 4.58, the same fixed point <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.2\" role=\"link\" tabindex=\"0\">§3.2</a>'s policy iteration reaches by a structurally different route.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"reinforcement-learning-25-s6\" data-title=\"Exploration vs. Exploitation\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Exploration vs. Exploitation</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>4.1 The fundamental tension</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Exploit</strong></th>\n<th><strong>Explore</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>What</td>\n<td>Pick the action with highest estimated value</td>\n<td>Pick a more uncertain action to gather information</td>\n</tr>\n<tr>\n<td>Upside</td>\n<td>Maximize immediate expected reward</td>\n<td>Might discover something much better</td>\n</tr>\n<tr>\n<td>Downside</td>\n<td>Stuck in local optimum forever</td>\n<td>Costs reward now (new thing might be worse)</td>\n</tr>\n<tr>\n<td>Analogy</td>\n<td>Always go to your favorite restaurant</td>\n<td>Try the new restaurant that just opened</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The practical answer:</strong> explore more early (when you know nothing and information is precious),\nexploit more later (once you understand the landscape).</p>\n<p><strong>Amazon framing:</strong> &quot;Do we show the customer the product we <em>know</em> they click on (exploit), or\ntest a new listing that might convert even better (explore)?&quot;</p>\n<h3>4.2 Strategy 1: ε-Greedy</h3>\n<p>With probability (1-ε): pick the greedy action (highest Q-value). With probability ε: pick a\nrandom action.</p>\n<p><strong>Decaying ε:</strong> start near 1 (almost pure exploration), slowly decay toward 0.01 (explore early,\nexploit late). DQN uses ε decaying from 1.0 to 0.1 over 1 million frames.</p>\n<p><strong>Pros:</strong> trivially simple, no assumptions about rewards, shockingly strong baseline.\n<strong>Cons:</strong> exploration is <em>uniform</em> — a clearly terrible action gets the same exploration\nprobability as a promising one. Wastes exploration budget.</p>\n<h3>4.3 Strategy 2: Softmax (Boltzmann exploration)</h3>\n<div class=\"mblk\"><math data-tex=\"P(a) = \\frac{e^{Q(a)/\\tau}}{\\sum_{a'} e^{Q(a')/\\tau}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mfrac><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>/</mi><mi>τ</mi></mrow></msup><mrow><msub><mo movablelimits=\"false\">∑</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></msub><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>/</mi><mi>τ</mi></mrow></msup></mrow></mfrac></mrow></math></div>\n<p>τ (temperature) controls the balance: τ → ∞ means uniform random (explore); τ → 0 means always\nbest (exploit).</p>\n<p><strong>Advantage over ε-greedy:</strong> explores in proportion to value — a slightly worse action gets\nslightly less probability, not equal probability.</p>\n<h3>4.4 Strategy 3: UCB (Upper Confidence Bound)</h3>\n<p><strong>Words before symbols:</strong> pick the action whose estimated value, plus a bonus for how little we\nknow about it, is highest — the bonus shrinks the more that action has already been tried and\ngrows the more total rounds have passed.</p>\n<div class=\"mblk bound\"><math data-tex=\"a^* = \\arg\\max_a \\left[ Q(a) + c \\sqrt{\\frac{\\ln t}{N(a)}} \\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>a</mi><mo form=\"prefix\" stretchy=\"false\">∗</mo></msup><mo>=</mo><mrow><mi>arg</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><munder><mi>max</mi><mi>a</mi></munder><mo>⁡</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>+</mo><mi>c</mi><msqrt><mfrac><mrow><mrow><mi>ln</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>t</mi></mrow><mrow><mi>N</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac></msqrt><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"Q(a)\"><mrow><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;estimated value of arm <math data-tex=\"a\"><mi>a</mi></math>&quot;</td>\n<td>Average reward observed from arm <math data-tex=\"a\"><mi>a</mi></math> so far (the exploit term)</td>\n</tr>\n<tr>\n<td><math data-tex=\"c\"><mi>c</mi></math></td>\n<td>&quot;exploration constant&quot;</td>\n<td>A tunable constant controlling how large the uncertainty bonus is; higher <math data-tex=\"c\"><mi>c</mi></math> → more exploration</td>\n</tr>\n<tr>\n<td><math data-tex=\"t\"><mi>t</mi></math></td>\n<td>&quot;round number&quot;</td>\n<td>How many pulls (across all arms) have happened so far</td>\n</tr>\n<tr>\n<td><math data-tex=\"N(a)\"><mrow><mi>N</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;times arm <math data-tex=\"a\"><mi>a</mi></math> was pulled&quot;</td>\n<td>The count in the bonus's denominator — small <math data-tex=\"N(a)\"><mrow><mi>N</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> inflates the bonus</td>\n</tr>\n</tbody>\n</table></div>\n<p>The second term is an <strong>uncertainty bonus:</strong> N(a) is how many times action a has been tried.\nRarely tried → big bonus → try it. Frequently tried → small bonus → exploit it.</p>\n<p><strong>Slogan:</strong> &quot;Be optimistic in the face of uncertainty.&quot;</p>\n<p><strong>No ε schedule, no temperature</strong> — self-adapting. Provable regret bounds of O(√(KT ln T)).</p>\n<h3>4.4a Thompson Sampling</h3>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Source note.</strong> The lecture's own closing summary states directly: <em>&quot;Multi-Armed Bandits:\nSimplest RL. <strong>Thompson Sampling dominates in industry.</strong>&quot;</em> — but the deck has no dedicated\nslide walking through its mechanism the way it does for ε-greedy/softmax/UCB. This subsection is\nwritten from standard background knowledge to fill that gap, not transcribed from a slide.</p>\n</aside>\n<blockquote class=\"aside-quote\">\n<p><strong>Thompson Sampling</strong> — a Bayesian exploration strategy: maintain a probability distribution\n(a <em>belief</em>) over each arm's true payout rate, and at each step, <strong>sample</strong> one plausible payout\nvalue from each arm's belief distribution, then pull the arm whose sampled value is highest.</p>\n</blockquote>\n<p>For a bandit with binary (success/fail) rewards, each arm's belief is typically a <strong>Beta\ndistribution</strong> <math data-tex=\"\\text{Beta}(\\alpha_a,\\beta_a)\"><mrow><mtext>Beta</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>α</mi><mi>a</mi></msub><mo separator=\"true\">,</mo><msub><mi>β</mi><mi>a</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, updated after every pull: a success increments\n<math data-tex=\"\\alpha_a\"><msub><mi>α</mi><mi>a</mi></msub></math>, a failure increments <math data-tex=\"\\beta_a\"><msub><mi>β</mi><mi>a</mi></msub></math>. Arms with more data have tighter (more confident)\ndistributions; arms with little data have wide, uncertain distributions.</p>\n<p><strong>Why it explores automatically, with no tunable schedule:</strong> an arm that's been pulled rarely has a\nwide belief distribution, so its <em>sampled</em> value is highly variable — it will occasionally sample\nvery high and get tried, even if its current average looks mediocre. An arm that's been pulled\noften and performs well has a narrow, high-centered distribution — it gets sampled high (and thus\nchosen) consistently. Exploration and exploitation fall out of the <em>same</em> sampling step, rather than\nbeing controlled by a separate hyperparameter like <math data-tex=\"\\varepsilon\"><mi>ε</mi></math> or <math data-tex=\"\\tau\"><mi>τ</mi></math>.</p>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Why it tends to beat UCB and ε-greedy in practice.</strong> Thompson Sampling's exploration is\ncalibrated to genuine posterior uncertainty rather than a hand-tuned bonus term or a fixed random\nrate — it naturally explores <em>more</em> for arms with little data and <em>less</em> for arms it's already\nconfident about, without any schedule to tune. This is consistent with the strong, repeated\nempirical results favoring it in real-world bandit deployments (ad selection, recommendations)\nthat the lecture's summary slide is referring to.</p>\n</aside>\n<h3>4.5 Comparison</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Strategy</th>\n<th>Complexity</th>\n<th>Tuning</th>\n<th>Exploration quality</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ε-greedy</td>\n<td>Trivial</td>\n<td>ε schedule</td>\n<td>Uniform (wasteful)</td>\n</tr>\n<tr>\n<td>Softmax</td>\n<td>Simple</td>\n<td>Temperature τ</td>\n<td>Proportional to value</td>\n</tr>\n<tr>\n<td>UCB</td>\n<td>Moderate</td>\n<td>None (self-adapting)</td>\n<td>Optimal regret bounds</td>\n</tr>\n<tr>\n<td>Thompson Sampling</td>\n<td>Moderate (needs a posterior model)</td>\n<td>None (self-calibrating)</td>\n<td>Posterior-calibrated; often best empirically</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n</section><section id=\"reinforcement-learning-25-s7\" data-title=\"Multi-Armed Bandits\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Multi-Armed Bandits</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>5.1 The simplest RL problem</h3>\n<p>K slot machines (&quot;arms&quot;), each with an unknown payout rate. Pull one arm, get a reward. Goal:\nmaximize total reward over T pulls.</p>\n<p><strong>Why it's the simplest RL:</strong> no states (same situation every time), no transitions (pulling\ndoesn't change the world), no planning — pure exploration vs. exploitation.</p>\n<p><strong>Scoreboard:</strong> Regret = (best arm's mean × T) − (your total reward). Lower regret = better.\nBest algorithms achieve O(√T) regret → average regret per pull shrinks to zero.</p>\n<p><strong>Industry applications:</strong> A/B testing, ad selection, clinical trials, product recommendations,\nsearch ranking, dynamic pricing — anywhere you repeatedly choose under uncertainty with quick\nfeedback.</p>\n<h3>5.2 Contextual bandits</h3>\n<p>A plain bandit gives the same answer to everyone. A <strong>contextual bandit</strong> asks: &quot;which arm is\nbest <em>for this context?</em>&quot;</p>\n<ol>\n<li>Observe context (user features, time of day, location).</li>\n<li>Choose action from K arms.</li>\n<li>Receive <strong>immediate</strong> reward.</li>\n<li>Learn which actions work best for which contexts.</li>\n</ol>\n<p><strong>Key distinction from full RL:</strong> the reward is immediate — your action does NOT change the\nfuture state. No delayed consequences, no long-horizon credit assignment.</p>\n<p><strong>The spectrum:</strong></p>\n<pre class=\"code\"><code>MAB (no context) → Contextual Bandits (context, immediate reward) → Full RL (actions affect future)</code></pre>\n<p><strong>Amazon example:</strong> user browsed electronics, it's evening, they're in Seattle → context goes\ninto model → picks which of 5 recommendation widgets to show → user clicks → model updates.</p>\n<hr>\n</section><section id=\"reinforcement-learning-25-s8\" data-title=\"Temporal Difference Learning — The Heart of the Course\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Temporal Difference Learning — The Heart of the Course</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>6.1 TD between DP and Monte Carlo</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>DP</strong></th>\n<th><strong>Monte Carlo</strong></th>\n<th><strong>TD Learning</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Needs model?</td>\n<td>Yes</td>\n<td><strong>No</strong></td>\n<td><strong>No</strong></td>\n</tr>\n<tr>\n<td>Wait for episode end?</td>\n<td>No (every step)</td>\n<td><strong>Yes</strong> (full episode)</td>\n<td><strong>No</strong> (every step)</td>\n</tr>\n<tr>\n<td>Bootstraps?</td>\n<td>Yes</td>\n<td>No</td>\n<td><strong>Yes</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>TD takes the <strong>best of both worlds:</strong> model-free like MC, updates every step like DP, and\nbootstraps.</p>\n<p><strong>Bootstrapping:</strong> updating an estimate using another estimate (rather than waiting for the true\nfinal outcome). DP bootstraps off a known model. TD bootstraps off its own current guesses about\nthe future.</p>\n<h3>6.2 The TD(0) update rule</h3>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;If you remember one equation from today, make it this one.&quot;</em></p>\n</blockquote>\n<div class=\"mblk bound\"><math data-tex=\"V(s) \\leftarrow V(s) + \\alpha \\big[ R + \\gamma V(s') - V(s) \\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo stretchy=\"false\">←</mo><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mi>α</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><mi>R</mi><mo>+</mo><mi>γ</mi><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>V(s)</td>\n<td>Current estimate of state s's value</td>\n</tr>\n<tr>\n<td>α</td>\n<td>Learning rate (small step, e.g., 0.1)</td>\n</tr>\n<tr>\n<td>R</td>\n<td>Actual reward received</td>\n</tr>\n<tr>\n<td>γ</td>\n<td>Discount factor</td>\n</tr>\n<tr>\n<td>V(s')</td>\n<td>Current estimate of the next state's value</td>\n</tr>\n<tr>\n<td><strong>R + γV(s')</strong></td>\n<td><strong>TD target</strong> — fresh, usually better estimate of what s is worth</td>\n</tr>\n<tr>\n<td><strong>R + γV(s') − V(s)</strong></td>\n<td><strong>TD error δ</strong> — the surprise, the learning signal</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Plain English:</strong> &quot;I thought state s was worth V(s). Then I took a step, got reward R, and\nlanded in s' which I currently think is worth V(s'). So actually s is worth about R + γV(s').\nI was off by δ. Let me nudge V(s) a small fraction α toward the better target.&quot;</p>\n<p><strong>Key:</strong> we update <strong>immediately</strong> after one step, using our own estimate of the future. No\ntrue return needed. No waiting for episode end.</p>\n<p>🧪 <strong>Worked example — the demo's own first 10 steps.</strong> Same grid as <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> (α=0.1, γ=0.9, step −1,\nGOAL +10, PIT −10), random-walk policy, all <math data-tex=\"V(s)=0.00\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0.00</mn></mrow></math> initially, agent starting bottom-left:</p>\n<figure class=\"ascii\"><pre>All values 0. Agent at the start cell.\nstep 1 ←: δ = (−1 + 0.9×−0.10) − 0.00  = −1.00; V(cell) ← −0.10\nstep 2 ↑: δ = (−1 + 0.9×0.00)  − −0.10 = −0.90; V(cell) ← −0.19\nstep 3 ←: δ = (−1 + 0.9×−0.10) − 0.00  = −1.00; V(cell) ← −0.10\nstep 4 →: δ = (−1 + 0.9×0.00)  − −0.10 = −0.90; V(cell) ← −0.19\nstep 5 →: δ = (−1 + 0.9×0.00)  − 0.00  = −1.00; V(cell) ← −0.10\nstep 6 →: δ = (−1 + 0.9×−0.10) − 0.00  = −1.00; V(cell) ← −0.10\nstep 7 ←: δ = (−1 + 0.9×−0.10) − −0.10 = −0.99; V(cell) ← −0.20\nstep 8 ↑: δ = (−1 + 0.9×0.00)  − −0.10 = −0.90; V(cell) ← −0.19\nstep 9 ↓: δ = (−1 + 0.9×−0.19) − 0.00  = −1.17; V(cell) ← −0.12\nstep 10 ↓: δ = (−10 + 0.9×−0.19) − −0.19 = −9.98; V(cell) ← −1.19  (fell in PIT → back to start)</pre></figure>\n<p>Notice how tiny, ordinary steps (δ ≈ −1) nudge V(cell) by a fraction α of the error, but falling\nin the pit produces one sharp δ ≈ −10 update — the same update rule handles both without any\nspecial-casing. After 80 steps (1 full episode) of this random walk, the V-table reads: start\ncell −5.52, the cell directly above the pit −3.58, the cell adjacent to the goal −0.05 — negative\nalmost everywhere except right next to the goal, the same overall shape <a class=\"xref\" data-xref-lec=\"reinforcement-learning-25\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>'s full-sweep policy\nevaluation reaches, but built up here from one noisy real step at a time instead of an averaged\nsweep over the whole grid.</p>\n<figure class=\"iv\" id=\"iv-reinforcement-learning-25-3\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;TD(0) Learning — One Step at a Time&quot;,&quot;concept&quot;:&quot;The TD(0) update learns V(s) online from one step of real experience, with no model and no waiting for the episode to end&quot;,&quot;control&quot;:&quot;Click \\&quot;One step\\&quot; to take a single step of the random-walk policy on the 3×3 grid, or \\&quot;Auto-walk\\&quot; to run many steps continuously&quot;,&quot;observe&quot;:&quot;The V-table cell the agent just left nudges toward its TD target after every single step; an ordinary step produces a small nudge, falling into the pit produces one sharp negative jump&quot;,&quot;insight&quot;:&quot;TD(0) never waits for the episode to end or needs a model of the grid — every step, however small, moves exactly one cell's estimate a little closer to the truth, and the same rule handles both routine steps and the rare disaster&quot;,&quot;fallback&quot;:&quot;The step-by-step trace above (steps 1–10, with the fall into the PIT at step 10) plus the resulting V-table after 80 steps (start −5.52, above-pit −3.58, next-to-goal −0.05).&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">TD(0) Learning — One Step at a Time</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>The TD(0) update learns V(s) online from one step of real experience, with no model and no waiting for the episode to end</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Click \"One step\" to take a single step of the random-walk policy on the 3×3 grid, or \"Auto-walk\" to run many steps continuously</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The V-table cell the agent just left nudges toward its TD target after every single step; an ordinary step produces a small nudge, falling into the pit produces one sharp negative jump</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>TD(0) never waits for the episode to end or needs a model of the grid — every step, however small, moves exactly one cell's estimate a little closer to the truth, and the same rule handles both routine steps and the rare disaster</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The step-by-step trace above (steps 1–10, with the fall into the PIT at step 10) plus the resulting V-table after 80 steps (start −5.52, above-pit −3.58, next-to-goal −0.05).</p>\n    </div>\n  </figure>\n<h3>6.3 Why TD is powerful</h3>\n<ul>\n<li><strong>Model-free:</strong> no transition probabilities needed.</li>\n<li><strong>Online:</strong> learn mid-episode, don't wait for end.</li>\n<li><strong>Works in continuing tasks</strong> where MC simply can't (infinite episodes).</li>\n<li><strong>Lower variance than MC</strong> (but introduces some bias from bootstrapping).</li>\n<li><strong>Most widely used family of RL algorithms in practice.</strong></li>\n</ul>\n<hr>\n</section><section id=\"reinforcement-learning-25-s9\" data-title=\"SARSA and Q-Learning — TD Control\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">SARSA and Q-Learning — TD Control</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-25-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>7.1 SARSA — On-Policy TD Control</h3>\n<p>To choose actions, we need Q(s,a) — the value of <em>taking action a in state s</em>.</p>\n<div class=\"mblk\"><math data-tex=\"Q(s,a) \\leftarrow Q(s,a) + \\alpha \\big[ R + \\gamma Q(s', a') - Q(s,a) \\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo stretchy=\"false\">←</mo><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mi>α</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><mi>R</mi><mo>+</mo><mi>γ</mi><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo separator=\"true\">,</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<p><strong>The name spells out the update:</strong> State, Action, Reward, next State, next Action.</p>\n<p><strong>The crucial word: ACTUALLY.</strong> a' is the action we <em>will</em> take next, chosen by our real\nε-greedy policy. If the policy explores, SARSA values <em>include</em> that exploration cost. It\nlearns the value of the policy it's actually following — that's what <strong>on-policy</strong> means.</p>\n<p><strong>Algorithm sketch:</strong></p>\n<ol>\n<li>In state s, pick action a (ε-greedy).</li>\n<li>Take a, get reward R, arrive at s'.</li>\n<li>In s', pick next action a' (ε-greedy) — uses <strong>same</strong> policy.</li>\n<li>Update Q(s,a).</li>\n<li>s ← s', a ← a', repeat.</li>\n</ol>\n<p><strong>Consequence:</strong> SARSA learns a <strong>safe policy</strong> that accounts for its own exploration.</p>\n<h3>7.2 Q-Learning — Off-Policy TD Control</h3>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The most important single algorithm in the course.&quot;</em></p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"Q(s,a) \\leftarrow Q(s,a) + \\alpha \\big[ R + \\gamma \\max_{a'} Q(s', a') - Q(s,a) \\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo stretchy=\"false\">←</mo><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mi>α</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><mi>R</mi><mo>+</mo><mi>γ</mi><mspace width=\"0.1667em\"></mspace><munder><mi>max</mi><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup></munder><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo separator=\"true\">,</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><mi>Q</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<p><strong>One word different from SARSA:</strong> max instead of a'.</p>\n<ul>\n<li>SARSA uses Q(s', a') — value of what we'll <em>actually</em> do next.</li>\n<li>Q-learning uses max Q(s', a') — value of the <em>best possible</em> next action.</li>\n</ul>\n<p><strong
