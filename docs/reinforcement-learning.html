<style>
/* ═══════════════════════════════════════════════════════════════════════
   STUDY LAMP — one mode, warm and dim.  Warm charcoal ground (never blue-
   black), warm paper-grey text at ~12:1, a single soft-amber accent for
   structure only: section numbers, your position, boxed results, progress.
   Links are a separate desaturated slate-blue so a link never looks like a
   heading.  The six callout hues keep one fixed meaning across every module.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#1B1A17; --surface:#242119; --surface-2:#16140F; --raised:#2C2820;
  --rule:#37332B; --rule-2:#4C4739;
  --ink:#EDE6D7; --ink-2:#B4AA95; --ink-3:#7C7361;
  --accent:#8CDCA6; --accent-dim:#4FA073; --accent-wash:#1E3025;
  --link:#93BFCE;
  --c-bg:#93B0D6; --c-key:#E6BA55; --c-warn:#E89170;
  --c-lab:#79C7A2; --c-int:#C0A6E4; --c-res:#A6CE8E; --c-recon:#D6A06E;
  --hl-1:#F0D488; --hl-2:#83D0C8; --hl-3:#F0A892; --hl-4:#C4AEF0;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 44px -20px rgba(0,0,0,.75);
  --wash:.14;
  --font-body:Charter,"Sitka Text","Iowan Old Style","Palatino Linotype",Cambria,Georgia,serif;
  --font-ui:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --font-mono:"Cascadia Code","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --measure:64ch;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:19px;line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-wash);color:#fff}
a{color:var(--link);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:#A9C6D2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px}
.skip:focus{left:12px;top:9px;z-index:100;background:var(--surface);padding:10px 14px;border:1px solid var(--accent);border-radius:8px}
button{font-family:var(--font-ui);color:inherit}

/* ── header — as little as possible ─────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.top-in{max-width:1680px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;gap:16px}
.home-l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.home-l:hover{color:var(--ink)}
.home-l b{color:var(--ink);font-weight:600}
.mprog{flex:1;max-width:340px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mprog-track{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.mprog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.ic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--rule-2);border-radius:8px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;padding:0}
.ic:hover{color:var(--ink);border-color:var(--accent)}
.readbar{height:2px;background:var(--accent);width:0}
.views{max-width:1680px;margin:0 auto;padding:1px 22px 0;display:flex;gap:1px;font-family:var(--font-ui)}
.view-t{font:inherit;font-size:11.5px;padding:7px 12px;border:0;border-bottom:2px solid transparent;background:none;
  color:var(--ink-3);cursor:pointer}
.view-t:hover{color:var(--ink-2)}
.view-t[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1680px;margin:0 auto;padding:0 22px;display:grid;
  grid-template-columns:274px minmax(0,1fr) 264px;gap:40px;align-items:start}
@media(max-width:1360px){.shell{grid-template-columns:250px minmax(0,1fr)}.rail-r{position:fixed;right:0;top:52px;bottom:0;
  width:300px;background:var(--surface);border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s;z-index:30;padding:20px}
  .rail-r.open{transform:none;box-shadow:var(--shadow)}}
@media(max-width:1040px){.shell{grid-template-columns:minmax(0,1fr);padding:0 16px}.rail-l{display:none}}
.rail{position:sticky;top:52px;max-height:calc(100vh - 58px);overflow-y:auto;padding:22px 4px 90px;
  font-family:var(--font-ui);font-size:12.5px;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
.rl-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:22px 0 8px;padding-left:10px}
.rl-h:first-child{margin-top:0}

/* ── the course spine (left rail) ──────────────────────────────────── */
.spine-mod{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--ink);padding:2px 10px 8px}
.lec{margin-bottom:1px}
.lec-b{width:100%;text-align:left;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid transparent;
  background:none;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:9px;line-height:1.3}
.lec-b:hover{background:var(--raised);color:var(--ink)}
.lec-b.on{background:var(--raised);color:var(--ink);border-color:var(--rule-2)}
.lec-n{font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;flex:none;
  width:17px;height:17px;border:1px solid var(--accent-dim);border-radius:4px;display:grid;place-items:center}
.lec-b.on .lec-n{background:var(--accent);color:#231a0b;border-color:var(--accent)}
.lec-lab{flex:1;font-weight:600}
.lec-bar{width:34px;height:3px;border-radius:2px;background:var(--rule);flex:none;overflow:hidden}
.lec-bar i{display:block;height:100%;background:var(--c-lab)}
.secs{list-style:none;margin:2px 0 8px;padding:0 0 0 12px;margin-left:14px;border-left:1px solid var(--rule);display:none}
.secs.open{display:block}
.secs a{display:flex;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:12px;line-height:1.4}
.secs a:hover{background:var(--raised);color:var(--ink)}
.secs a.cur{color:var(--accent);font-weight:650}
.secs a.done{color:var(--ink-3)}
.spine-part{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;
  padding:9px 8px 3px;margin-top:2px}
.spine-part:first-child{margin-top:0}
.secs a[data-kind="recap"]{color:var(--ink-3);font-style:italic;font-size:11px}
.secs a[data-kind="back"]{color:var(--ink-3)}
.secs a[data-kind="divider"]{color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;margin-top:6px;pointer-events:auto}
.secs a[data-kind="divider"] .n{display:none}
.secs a .n{flex:none;width:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.secs a.done .n::after{content:"✓";color:var(--c-lab)}
.secs a.cur .n{color:var(--accent)}
.othermod a{display:flex;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink-3);font-size:12px}
.othermod a:hover{background:var(--raised);color:var(--ink)}
.othermod .m-n{flex:none;font-variant-numeric:tabular-nums}
.othermod .m-p{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* ── right rail: your work only ────────────────────────────────────── */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-b{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;font:inherit;font-family:var(--font-ui);
  font-size:12px;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.phase-b:hover{border-color:var(--accent);color:var(--ink)}
.phase-b .box{width:15px;height:15px;border:1.5px solid var(--rule-2);border-radius:5px;flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:9px;color:transparent}
.phase-b.done{color:var(--ink)}
.phase-b.done .box{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.phase-b.done .box::after{content:"✓";font-weight:800}
.phase-b b{font-weight:650;display:block}
.phase-b small{color:var(--ink-3);font-weight:400}
.phase-b .go{margin-left:auto;color:var(--accent);flex:none;font-size:13px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{margin-bottom:4px}
.rlist button{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);font-size:11.5px;line-height:1.45;
  padding:6px 9px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;
  border-left:3px solid var(--h,var(--rule-2))}
.rlist button:hover{color:var(--ink);border-color:var(--accent)}
.rlist li[data-c="1"] button{--h:var(--hl-1)} .rlist li[data-c="2"] button{--h:var(--hl-2)}
.rlist li[data-c="3"] button{--h:var(--hl-3)} .rlist li[data-c="4"] button{--h:var(--hl-4)}
.empty{font-size:11.5px;color:var(--ink-3);font-style:italic;padding:0 10px;line-height:1.5}
.rr-close{display:none}
@media(max-width:1360px){.rr-close{display:block;position:absolute;top:12px;right:14px;background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}}

/* ── reading column ───────────────────────────────────────────────── */
main{padding:38px 0 200px;min-width:0;position:relative}
.doc{max-width:var(--measure)}
.lecture-head{margin:0 0 8px}
.lecture-head .kicker{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);
  text-transform:uppercase;margin-bottom:8px}
.lecture-head h1{font-family:var(--font-body);font-size:34px;font-weight:700;line-height:1.16;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lecture-head .meta{font-family:var(--font-ui);font-size:13px;color:var(--ink-3);margin-top:10px}
.frontmatter{margin:22px 0 8px;padding-bottom:4px}
.part-head{margin:3.4em 0 0}
.part-head h1{font-family:var(--font-body);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);margin:0 0 .2em;padding-bottom:.5em;border-bottom:2px solid var(--accent-dim)}
.part-head + section h2,.part-head h1 + section h2{border-top:0;padding-top:.3em;margin-top:.8em}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}

h2{font-family:var(--font-body);font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.008em;
  margin:2.9em 0 .55em;padding-top:1.15em;border-top:1px solid var(--rule);position:relative;
  display:flex;align-items:baseline;gap:12px;text-wrap:balance;scroll-margin-top:66px}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}
section[data-kind="recap"] h2{font-style:italic;color:var(--ink-2);font-size:22px}
section[data-kind="back"] h2{font-family:var(--font-ui);font-size:23px;font-weight:680}
section[data-kind="divider"]{margin:2.6em 0 0}
section[data-kind="divider"] h2{border-top:0;padding:0 0 .5em;margin:0;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:2px solid var(--accent-dim)}
section[data-kind="divider"] .sec-n,section[data-kind="divider"] .sec-meta{display:none}
.sec-n{position:absolute;left:-56px;top:calc(1.15em + .15em);font-family:var(--font-ui);font-size:12px;font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;width:44px;padding-top:.3em}
@media(max-width:1200px){.sec-n{position:static;border-left:2px solid var(--accent);padding:0 0 0 8px;width:auto;text-align:left;align-self:stretch;display:flex;align-items:center}}
.sec-t{flex:1;min-width:0}
.sec-meta{flex:none;display:flex;align-items:center;gap:9px;align-self:center}
.sec-time{font-family:var(--font-ui);font-size:11px;color:var(--ink-3);font-weight:500}
.sec-check{width:21px;height:21px;border:1.5px solid var(--rule-2);border-radius:6px;background:var(--surface);cursor:pointer;
  display:grid;place-items:center;font-size:11px;color:transparent;padding:0;transition:.12s;flex:none}
.sec-check:hover{border-color:var(--c-lab)}
.sec-check.on{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.sec-check.on::after{content:"✓";font-weight:800}
h3{font-family:var(--font-ui);font-size:18px;font-weight:660;margin:1.9em 0 .45em;line-height:1.3}
h4{font-family:var(--font-ui);font-size:15.5px;font-weight:660;color:var(--ink-2);margin:1.5em 0 .35em}
.doc p{margin:0 0 1.1em}
strong{font-weight:700;color:#F1EADD}
em{font-style:italic}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
sup,sub{line-height:0}

.doc ul,.doc ol{margin:0 0 1.15em;padding-left:1.4em}
.doc li{margin:.35em 0}
.doc li::marker{color:var(--ink-3)}
.doc ul{list-style:none;padding-left:1.2em}
.doc ul>li{position:relative}
.doc ul>li::before{content:"";position:absolute;left:-.95em;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent-dim)}
.doc dt{font-weight:700;font-family:var(--font-ui);font-size:15px;margin-top:.7em}
.doc dd{margin:.15em 0 1em}

code{font-family:var(--font-mono);font-size:.8em;background:var(--surface-2);padding:.12em .38em;border-radius:4px;border:1px solid var(--rule)}
.code{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:15px 17px;overflow-x:auto;margin:0 0 1.3em;line-height:1.6}
.code code{background:none;border:0;padding:0;font-size:13.5px}
figure.ascii{margin:0 0 1.4em;background:var(--surface-2);border:1px solid var(--rule);border-left:2px solid var(--accent-dim);
  border-radius:8px;padding:16px 18px;overflow-x:auto}
figure.ascii pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre;color:var(--ink-2)}

.table-wrap{overflow-x:auto;margin:0 0 1.4em}
.table-wrap.bound{margin-top:-.5em}
table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;font-size:12px;color:var(--ink-3);border-bottom-color:var(--rule-2)}
tbody tr:last-child td{border-bottom:0}
.symtab{border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.symtab td:first-child{font-family:var(--font-mono);white-space:nowrap;color:var(--ink)}

.mblk{display:block;overflow-x:auto;overflow-y:hidden;margin:1.5em 0;padding:6px 2px;text-align:center}
.mblk.bound{margin-bottom:.3em}
math{font-size:1.05em}
.mblk math{font-size:1.15em}
.mblk[data-boxed] .tml-fbox,.mblk[data-boxed] menclose{background:var(--accent-wash);border-color:var(--accent)!important}
.mfail{color:var(--c-warn);font-family:var(--font-mono);font-size:.85em}

/* callouts — left rule + faint wash, no box */
.callout{margin:0 0 1.4em;padding:4px 0 4px 16px;border-left:2px solid var(--k);--k:var(--ink-3)}
.callout>*:last-child{margin-bottom:0}
.callout-h{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--k);margin:0 0 5px;display:flex;align-items:center;gap:7px}
.callout-badge{font-size:12px}
.callout-bg{--k:var(--c-bg)} .callout-key{--k:var(--c-key)} .callout-warn{--k:var(--c-warn)}
.callout-lab{--k:var(--c-lab)} .callout-int{--k:var(--c-int)} .callout-res{--k:var(--c-res)} .callout-recon{--k:var(--c-recon)}
.callout-warn{border-left-width:3px;background:color-mix(in srgb,var(--c-warn) 7%,transparent);padding:8px 0 8px 16px}
.aside-quote{margin:0 0 1.3em;padding-left:15px;border-left:2px solid var(--rule-2);color:var(--ink-2);font-style:italic}
blockquote{margin:.7em 0 0;padding-left:13px;border-left:2px solid var(--rule-2);color:var(--ink-2)}

/* recall cards — flat */
.recall{border-bottom:1px solid var(--rule);margin:0 0 6px;padding-bottom:6px}
.recall-q{width:100%;text-align:left;font:inherit;font-family:var(--font-body);font-size:16.5px;padding:11px 4px;
  background:none;border:0;color:var(--ink);cursor:pointer;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.recall-q:hover{color:#fff}
.recall-n{font-family:var(--font-ui);font-size:10.5px;font-weight:750;color:var(--accent);flex:none;margin-top:4px;font-variant-numeric:tabular-nums;min-width:16px}
.recall-t{flex:1;min-width:0}
.recall-x{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);flex:none;margin-top:5px;font-weight:600}
.recall-a{padding:2px 4px 10px 31px;font-size:16.5px}
.recall-a>*:first-child{margin-top:10px}
.recall[data-open] .recall-x{color:var(--accent)}
.rate{display:flex;gap:7px;margin-top:14px;padding-top:11px;border-top:1px dashed var(--rule)}
.rate-b{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:14px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.rate-b:hover{border-color:var(--k,var(--accent));color:var(--k,var(--accent))}
.rate-b.on{background:var(--k);border-color:var(--k);color:#161310}
.rate-b[data-r="1"]{--k:var(--c-lab)} .rate-b[data-r="2"]{--k:var(--c-key)} .rate-b[data-r="3"]{--k:var(--c-warn)}
.recall[data-rated] .recall-n::after{font-size:9px;margin-left:2px}
.recall[data-rated="1"] .recall-n::after{content:"●";color:var(--c-lab)}
.recall[data-rated="2"] .recall-n::after{content:"●";color:var(--c-key)}
.recall[data-rated="3"] .recall-n::after{content:"●";color:var(--c-warn)}

.tryfirst{font-family:var(--font-ui);font-size:10.5px;font-weight:650;padding:3px 10px;border-radius:12px;
  border:1px solid var(--c-lab);color:var(--c-lab);background:none;cursor:pointer;margin-left:auto}
.tryfirst:hover{background:var(--c-lab);color:#12241a}
.masked{filter:blur(5px);opacity:.32;user-select:none;pointer-events:none}

/* interactive */
.iv{border:1px solid var(--rule-2);border-radius:10px;margin:0 0 1.6em;background:var(--surface);overflow:hidden}
.iv-cap{display:flex;align-items:baseline;gap:10px;padding:10px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.iv-kind{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:var(--ink-3);flex:none}
.iv-title{font-size:13.5px;font-weight:650;color:var(--ink)}
.iv-live{margin-left:auto;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--c-lab)}
.iv-mount{padding:16px}
.iv-fallback{padding:13px 15px 15px;font-family:var(--font-ui);font-size:13.5px}
.iv-meta{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.iv-row{display:contents}
.iv-meta dt{color:var(--ink-3);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.iv-meta dd{margin:0;color:var(--ink-2)}
.iv-fb-prose{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
.iv.is-live .iv-fallback{border-top:1px dashed var(--rule)}
.iv.is-live .iv-fb-prose,.iv.is-live .iv-meta{display:none}
.iv-ctl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:12px;font-family:var(--font-ui);font-size:12px}
.iv-ctl label{display:flex;flex-direction:column;gap:3px;color:var(--ink-2);font-weight:600}
.iv-ctl input[type=range]{width:170px;accent-color:var(--accent)}
.iv-ctl .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.iv svg{max-width:100%;height:auto;display:block}
.iv .plot-bg{fill:var(--surface-2)}
.iv .plot-axis{stroke:var(--rule-2);stroke-width:1}
.iv .plot-grid{stroke:var(--rule);stroke-width:1}
.iv .plot-label{fill:var(--ink-3);font-family:var(--font-ui);font-size:10px}
.iv .readout{font-family:var(--font-ui);font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.iv .readout b{color:var(--ink);font-variant-numeric:tabular-nums}

/* highlights */
.hl{border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  background:color-mix(in srgb,var(--h) 30%,transparent);
  box-shadow:inset 0 -.42em 0 color-mix(in srgb,var(--h) 16%,transparent)}
.hl[data-c="1"]{--h:var(--hl-1)} .hl[data-c="2"]{--h:var(--hl-2)} .hl[data-c="3"]{--h:var(--hl-3)} .hl[data-c="4"]{--h:var(--hl-4)}
#hlbar{position:fixed;z-index:60;display:none;gap:4px;background:var(--surface);border:1px solid var(--rule-2);border-radius:9px;padding:5px;box-shadow:var(--shadow)}
#hlbar.on{display:flex}
.sw{width:25px;height:25px;border-radius:6px;border:1px solid var(--rule-2);cursor:pointer;padding:0;font-family:var(--font-ui);
  font-size:10px;font-weight:700;color:#161310;display:grid;place-items:center}
.sw[data-c="1"]{background:var(--hl-1)} .sw[data-c="2"]{background:var(--hl-2)}
.sw[data-c="3"]{background:var(--hl-3)} .sw[data-c="4"]{background:var(--hl-4)} .sw[data-c="0"]{background:var(--surface-2);color:var(--ink-2)}

/* focus mode */
body.focus .rail,body.focus .views,body.focus .top-r{opacity:.08;pointer-events:none}
body.focus .doc{--measure:58ch}
body.focus section:not(.live){opacity:.25}
section{transition:opacity .25s}

/* module + phase views */
.view{display:none}
.view.on{display:block;max-width:70ch}
.view h1{font-family:var(--font-body);font-size:30px;font-weight:700;margin:0 0 6px}
.view-lead{font-family:var(--font-ui);font-size:14px;color:var(--ink-2);max-width:58ch;margin:0 0 26px}
.qcard{border:1px solid var(--rule);border-radius:9px;padding:13px 16px;margin-bottom:10px;background:var(--surface)}
.qcard.r3{border-left:3px solid var(--c-warn)} .qcard.r2{border-left:3px solid var(--c-key)}
.qcard .from{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.qcard .due{font-family:var(--font-ui);font-size:9.5px;color:var(--c-key);font-weight:700;text-transform:uppercase;letter-spacing:.05em;float:right}
.pill{font-family:var(--font-ui);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:10px;border:1px solid var(--k);color:var(--k);--k:var(--ink-3);white-space:nowrap}
.pill.intro{--k:var(--c-lab)} .pill.solid{--k:var(--c-key)} .pill.hard{--k:var(--c-warn)}
#gf{width:100%;font:inherit;font-family:var(--font-ui);font-size:15px;padding:10px 14px;border:1px solid var(--rule-2);
  border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:16px}
.phase-view-h{font-family:var(--font-ui);font-size:12px;color:var(--ink-3);margin:0 0 20px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
.phase-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.phase-nav button{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;
  border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.phase-nav button:hover{border-color:var(--accent);color:var(--ink)}
.phase-nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#231a0b}
.phase-nav .phase-mark{margin-left:auto;border-color:var(--c-lab);color:var(--c-lab)}

/* search */
#sd{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(4px);display:none;padding-top:11vh}
#sd.on{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--rule-2);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
#sq{width:100%;font:inherit;font-family:var(--font-ui);font-size:17px;padding:16px 20px;border:0;background:none;color:var(--ink);border-bottom:1px solid var(--rule)}
#sq:focus{outline:none}
#sr{max-height:58vh;overflow-y:auto;padding:7px}
.sri{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);padding:9px 13px;border:0;background:none;border-radius:8px;cursor:pointer;display:block;color:var(--ink)}
.sri:hover,.sri.sel{background:var(--accent-wash)}
.sri b{font-size:13.5px;font-weight:640;display:block}
.sri span{font-size:11px;color:var(--ink-3)}
.sri mark{background:color-mix(in srgb,var(--hl-1) 45%,transparent);color:inherit;border-radius:2px}
.sri .scope{font-size:9.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

dialog{border:1px solid var(--rule-2);border-radius:13px;background:var(--surface);color:var(--ink);padding:24px 28px;max-width:460px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.sh{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-family:var(--font-ui);font-size:13px;align-items:center}
.note{border-left:3px solid var(--c-key);background:color-mix(in srgb,var(--c-key) 8%,transparent);padding:9px 13px;border-radius:0 6px 6px 0;margin:.5em 0 1.1em;font-size:14px;font-family:var(--font-ui)}
.note-x{float:right;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 0 0 8px}
.addn{opacity:0;position:absolute;left:-26px;top:2px;width:19px;height:19px;border-radius:6px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:12px;line-height:1;padding:0;transition:opacity .12s}
.doc p{position:relative}
.doc p:hover .addn{opacity:1}
@media(max-width:1200px){.addn{display:none}}

/* ── review session ────────────────────────────────────────────────── */
.b-review{position:relative}
.b-review .due-dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--c-key);color:#1b1408;font-size:9px;font-weight:800;display:grid;place-items:center;font-family:var(--font-ui)}
#rev{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center}
#rev.on{display:flex}
.rev-top{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;padding:18px 22px;font-family:var(--font-ui);font-size:12px;color:var(--ink-3)}
.rev-prog{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.rev-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.rev-x{background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}
.rev-card{flex:1;width:100%;max-width:680px;padding:0 22px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.rev-kind{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.rev-kind span{color:var(--ink-3);font-weight:600;margin-left:8px}
.rev-front{font-size:22px;line-height:1.5;color:var(--ink)}
.rev-back{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule);font-size:17px;line-height:1.7;color:var(--ink-2)}
.rev-back.hidden{display:none}
.rev-back math{color:var(--ink)}
.rev-actions{width:100%;max-width:680px;padding:20px 22px 40px;display:flex;gap:10px;font-family:var(--font-ui)}
.rev-reveal{flex:1;padding:14px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.rev-reveal:hover{border-color:var(--accent)}
.rev-grade{flex:1;padding:14px 10px;border-radius:10px;border:1px solid var(--k);background:none;color:var(--k);
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.rev-grade:hover{background:var(--k);color:#161310}
.rev-grade small{font-size:10px;opacity:.7;font-weight:500}
.rev-grade[data-g="0"]{--k:var(--c-warn)} .rev-grade[data-g="1"]{--k:var(--c-key)} .rev-grade[data-g="2"]{--k:var(--c-lab)}
.rev-done{text-align:center;font-family:var(--font-ui);max-width:420px;padding:40px 22px}
.rev-done h2{font-family:var(--font-body);font-size:26px;margin:0 0 10px;color:var(--ink)}
.rev-done p{font-size:14px;color:var(--ink-2);line-height:1.7}
.rev-done .big{font-size:44px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>

<header class="top">

    <a class="home-l" href="./index.html">‹ <b>Reinforcement Learning</b></a>

      <button class="ic b-review" id="b-review" title="Review due cards (R)" aria-label="Review">↻<span class="due-dot" id="dueDot" hidden></span></button>
      <button class="ic" id="b-search" title="Search (Ctrl+K)" aria-label="Search">⌕</button>
      <button class="ic" id="b-focus" title="Focus mode (F)" aria-label="Focus mode">◑</button>
      <button class="ic" id="b-work" title="Your highlights & notes" aria-label="Your work">✎</button>
      <button class="ic" id="b-help" title="Shortcuts &amp; data (?)" aria-label="Shortcuts and data">?</button>
    </div>
  </div>
  <div class="views" id="views" role="tablist"></div>
  <div class="readbar" id="readbar"></div>

<div class="shell">

  <aside class="rail rail-r" id="railR" aria-label="Your work on this page">

  </aside>
</div>

<div id="rev" role="dialog" aria-label="Review session" aria-modal="true">

    <button class="rev-x" id="revX" aria-label="End session">✕</button>
    <span id="revCount">0 / 0</span>
    <div class="rev-prog"><i id="revProg"></i></div>
    <span id="revNew"></span>
  </div>
  <div class="rev-card" id="revCard"></div>
  <div class="rev-actions" id="revActions"></div>
</div>

<div id="hlbar" role="toolbar" aria-label="Highlight colour">
  <button class="sw" data-c="1" title="Remember this (1)"></button>
  <button class="sw" data-c="2" title="I understand this (2)"></button>
  <button class="sw" data-c="3" title="Weak spot — come back (3)"></button>
  <button class="sw" data-c="4" title="Interview material (4)"></button>
  <button class="sw" data-c="0" title="Remove">✕</button>
</div>

<div id="sd" role="dialog" aria-label="Search this module">
  <div class="sbox"><input id="sq" placeholder="Search this module…" autocomplete="off" spellcheck="false"><div id="sr"></div></div>
</div>

<dialog id="hd">
  <h3 style="margin:0 0 14px;font-family:var(--font-ui);font-size:16px">Keyboard</h3>
  <div class="sh">
    <span class="kbd">J</span><span>Next section</span>
    <span class="kbd">K</span><span>Previous section</span>
    <span class="kbd">[</span><span>Previous lecture</span>
    <span class="kbd">]</span><span>Next lecture</span>

    <span class="kbd">F</span><span>Focus mode</span>
    <span class="kbd">1–4</span><span>Highlight selected text</span>
    <span class="kbd">0</span><span>Remove highlight</span>
    <span class="kbd">?</span><span>This panel</span>
  </div>
  <p style="margin:16px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--font-ui)">
    Highlights, notes, ratings and progress live in this browser only.</p>
  <div style="margin-top:15px;display:flex;gap:8px">
    <button class="rate-b" id="b-exp">Export data</button>
    <button class="rate-b" id="b-imp">Import</button>
    <button class="rate-b" style="margin-left:auto" onclick="hd.close()">Close</button>
  </div>

Unicode range 1D49C to 1D4B5.

math {
  font-family: "Cambria Math", 'STIXTwoMath-Regular', 'NotoSansMath-Regular', math;
  font-style: normal;
  font-weight: normal;
  line-height: normal;
  font-size-adjust: none;
  text-indent: 0;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  direction: ltr;
  /* Prevent Firefox from omitting the dot on i or j. */
  font-feature-settings: "dtls" off;
}

math * {
  border-color: currentColor;
}

/* display: block is necessary in Firefox and Safari.
 * Not in Chromium, which recognizes display: "block math" written inline. */
 math.tml-display {
  display: block;
  width: 100%;
}

*.mathcal {
  /* NotoSans */
  font-feature-settings: 'ss01';
}

math .mathscr {
  font-family: "Temml";
}

mo.tml-prime {
  font-family: Temml;
}

/* Cramped superscripts in WebKit */
mfrac > :nth-child(2),
msqrt,
mover > :first-child {
  math-shift: compact
}

.menclose {
  display: inline-block;
  position: relative;
  padding: 0.5ex 0ex;
}
.tml-cancelto {
  display: inline-block;
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.5ex 0ex;
  background-color: currentColor;
  /* Use the SVG as an alpha mask (painted by background-color) */
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-position: 0 0;
          mask-position: 0 0;
}

@supports (-moz-appearance: none) {
  /* \vec w/o italic correction for Firefox */
  .tml-vec {
    transform: scale(0.75)
  }
  /* Fix \cancelto in Firefox */
  .ff-narrow {
    width: 0em;
  }
  .ff-nudge-left {
    margin-left: -0.2em;
  }
  /* Squash hidden mrows in \bordermatrix. Messes with centering, but necessary to squash. */
  .ff-squash mtd {
    display: block;
    height: 0;
  }
}

@supports (not (-moz-appearance: none)) {
  /* Chromium and WebKit */
  /* prime vertical alignment */
  mo.tml-prime {
    font-family: Temml;
  }
  /* Italic correction on superscripts */
  .tml-sml-pad {
    padding-left: 0.05em;
  }
  .tml-med-pad {
    padding-left: 0.10em;
  }
  .tml-lrg-pad {
    padding-left: 0.15em;
  }
}

@supports (-webkit-backdrop-filter: blur(1px)) {
  /* WebKit vertical & italic correction on accents */
  .wbk-acc {
    /* lower by x-height distance */
    transform: translate(0em, 0.431em);
  }
  .wbk-sml {
    transform: translate(0.07em, 0);
  }
  .wbk-sml-acc {
    transform: translate(0.07em, 0.431em);
  }
  .wbk-sml-vec {
    transform: scale(0.75) translate(0.07em, 0);
  }
  .wbk-med {
    transform: translate(0.14em, 0);
  }
  .wbk-med-acc {
    transform: translate(0.14em, 0.431em);
  }
  .wbk-med-vec {
    transform: scale(0.75) translate(0.14em, 0);
  }
  .wbk-lrg {
    transform: translate(0.21em, 0);
  }
  .wbk-lrg-acc {
    transform: translate(0.21em, 0.431em);
  }
  .wbk-lrg-vec {
    transform: scale(0.75) translate(0.21em, 0);
  }
}

/* \cancel & \phase use background images. Get them to print. */
menclose {
  -webkit-print-color-adjust: exact;  /* Chrome & Edge */
          print-color-adjust: exact;
}

/* Array cell justification in Firefox & WebKit */
.tml-right {
  text-align: right;
}
.tml-left {
  text-align: left;
}

/* For CD labels that grow to the left in Firefox and WebKit */
.tml-shift-left { margin-left:-200% }

<script id="DATA" type="application/json">{"slug":"reinforcement-learning","name":"Reinforcement Learning","lectures":[{"id":"reinforcement-learning-24","num":"24","file":"reinforcement-learning-01","kind":"lecture","title":"Reinforcement Learning — Part 1: Foundations, MDPs, and Bellman Equations","h1":"Reinforcement Learning — Part 1: Foundations, MDPs, and Bellman Equations","subtitle":"Foundations, MDPs, and Bellman Equations","spineLabel":"Part 1","short":"Foundations, MDPs, and Bellman Equations","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~53:00. Built from the raw capture in <code>output/Lecture_24 - Module 8 Reinforcement Learning Part 1/</code> (150 raw frames), not <code>slides_deduped/</code> — see project memory\n<code>slides-deduped-is-lossy</code>. Instructor: <strong>Sayambhu Sen</strong>, Applied Scientist, Alexa team at Amazon —\nconfirmed from the slide nameplate; the same instructor as Lecture 18 (Sequential Learning Part\n1). This is the first lecture in the reinforcement learning series, establishing the foundational\nvocabulary, the Markov Decision Process framework, and the Bellman equations that underpin all RL\nalgorithms.</p>\n</blockquote>\n<hr>\n</div><section id=\"reinforcement-learning-24-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>State precisely how reinforcement learning differs from supervised and unsupervised learning</strong> — no supervisor, delayed scalar rewards, sequential decisions, and the agent's actions affect future data.</li>\n<li><strong>Define the agent-environment loop</strong> and name its components: state, action, reward, policy π, and transition dynamics.</li>\n<li><strong>Distinguish episodic from continuing tasks</strong> and explain why the discount factor γ is mandatory for continuing tasks (to prevent divergent sums) but optional for episodic ones.</li>\n<li><strong>Explain the reward hypothesis</strong> — that all goals can be described as maximizing expected cumulative reward — and give examples of how reward functions encode goals.</li>\n<li><strong>Define a Markov Decision Process (MDP) as a 5-tuple</strong> (S, A, P, R, γ) and state the Markov property and its implications for modeling.</li>\n<li><strong>Explain why transition probabilities are usually unknown</strong> and how the agent must learn them from interaction.</li>\n<li><strong>Compute the discounted return G_t</strong> for a given reward sequence and explain the effective planning horizon 1/(1-γ).</li>\n<li><strong>Define and distinguish the state value function V^π(s) and the action-value function Q^π(s,a)</strong>, and explain their relationship V^π(s) = Σ_a π(a|s) Q^π(s,a).</li>\n<li><strong>State the Bellman expectation equation for both V and Q</strong>, explain what &quot;backup&quot; means graphically, and solve a 2-state MDP example by matrix inversion.</li>\n<li><strong>State the Bellman optimality equation</strong> and explain why the max operator makes it nonlinear, requiring iterative solution rather than matrix inversion.</li>\n<li><strong>Explain policy iteration</strong> — the alternating cycle of policy evaluation and policy improvement — and prove by example that a greedy policy improvement is guaranteed to be at least as good.</li>\n<li><strong>Explain value iteration</strong> and its relationship to dynamic programming, and state the contraction mapping theorem guaranteeing convergence when γ &lt; 1.</li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-24-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — Expected value and summation</h3>\n<p>You need to be comfortable with <math data-tex=\"\\mathbb{E}[X] = \\sum_x x \\cdot P(X=x)\"><mrow><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><msub><mo movablelimits=\"false\">∑</mo><mi>x</mi></msub><mi>x</mi><mo>⋅</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo>=</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (discrete expectation)\nand infinite geometric series: <math data-tex=\"\\sum_{k=0}^{\\infty} \\gamma^k = \\frac{1}{1-\\gamma}\"><mrow><msubsup><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mi>∞</mi></msubsup><msup><mi>γ</mi><mi>k</mi></msup><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mi>γ</mi></mrow></mfrac></mrow></math> when\n<math data-tex=\"0 \\leq \\gamma &lt; 1\"><mrow><mn>0</mn><mo>≤</mo><mi>γ</mi><mo>&lt;</mo><mn>1</mn></mrow></math>. These appear in every Bellman equation.</p>\n<h3>Prerequisite 2 — Probability distributions</h3>\n<p>A probability distribution <math data-tex=\"P(s'|s,a)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> gives the probability of transitioning to state <math data-tex=\"s'\"><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></math> from\nstate <math data-tex=\"s\"><mi>s</mi></math> under action <math data-tex=\"a\"><mi>a</mi></math>. The normalization property <math data-tex=\"\\sum_{s'} P(s'|s,a) = 1\"><mrow><msub><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></msub><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn></mrow></math> for all <math data-tex=\"s,a\"><mrow><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi></mrow></math>\nis required and used throughout.</p>\n<h3>Prerequisite 3 — Matrix inversion (conceptual)</h3>\n<p>For a small system of linear equations <math data-tex=\"Ax = b\"><mrow><mi>A</mi><mi>x</mi><mo>=</mo><mi>b</mi></mrow></math>, the solution is <math data-tex=\"x = A^{-1}b\"><mrow><mi>x</mi><mo>=</mo><msup><mi>A</mi><mrow class=\"tml-lrg-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mn>1</mn></mrow></msup><mi>b</mi></mrow></math>. This is used to\nsolve Bellman expectation equations for small MDPs (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-24\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>). You don't need to compute inverses by\nhand — the point is that the system is <em>linear</em> and therefore solvable in closed form, unlike the\nBellman <em>optimality</em> equation.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>This lecture establishes the mathematical language of reinforcement learning — the vocabulary\n(agents, environments, policies, rewards), the formal framework (MDPs), and the core equations\n(Bellman expectation and optimality) that every subsequent RL algorithm builds on.</p>\n<figure class=\"ascii\"><pre>Three ML paradigms (§1)\n   Supervised: input-output pairs, correct labels\n   Unsupervised: no labels, discover structure\n   RL: no supervisor, delayed rewards, sequential decisions\n        │\n        ▼\nThe RL framework (§2–§4)\n   Agent-environment loop: observe state → take action → get reward + next state\n   Policy π(a|s): rule for choosing actions (deterministic or stochastic)\n   Episodic vs. continuing tasks\n        │\n        ▼\nMarkov Decision Process (§5–§7)\n   5-tuple (S, A, P, R, γ)\n   Markov property: future depends only on present\n   Discount factor γ: controls planning horizon\n   Return G_t = Σ γ^k R_{t+k+1}\n        │\n        ▼\nValue functions (§8)\n   V^π(s): how good is state s under policy π?\n   Q^π(s,a): how good is taking action a in state s under π?\n   Relationship: V^π(s) = Σ_a π(a|s) Q^π(s,a)\n        │\n        ▼\nBellman equations (§9–§12)\n   Expectation: V^π(s) = Σ_a π(a|s) [R + γ Σ_{s'} P(s'|s,a) V^π(s')]\n   Optimality: V*(s) = max_a [R + γ Σ_{s'} P(s'|s,a) V*(s')]\n   Policy iteration: evaluate → improve → evaluate → ...\n   Value iteration: combine evaluate + improve in one step\n        │\n        ▼\nFoundation for all RL algorithms: Q-learning, DQN, actor-critic, PPO, ...</pre></figure>\n<hr>\n</section><section id=\"reinforcement-learning-24-s3\" data-title=\"What Is Reinforcement Learning?\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">What Is Reinforcement Learning?</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 The three ML paradigms</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Supervised</strong></th>\n<th><strong>Unsupervised</strong></th>\n<th><strong>Reinforcement</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Data</td>\n<td>Input-output pairs</td>\n<td>No labels</td>\n<td>No labels, no correct answers</td>\n</tr>\n<tr>\n<td>Feedback</td>\n<td>Correct label at each step</td>\n<td>None</td>\n<td>Scalar reward signal, often delayed</td>\n</tr>\n<tr>\n<td>Learning signal</td>\n<td>Prediction error (loss)</td>\n<td>Structure (clusters, manifolds)</td>\n<td>Reward (cumulative)</td>\n</tr>\n<tr>\n<td>Time matters?</td>\n<td>No (i.i.d.)</td>\n<td>No (i.i.d.)</td>\n<td><strong>Yes</strong> — actions affect future data</td>\n</tr>\n<tr>\n<td>Analogy</td>\n<td>Student with answer key</td>\n<td>Student exploring patterns</td>\n<td>Trial-and-error explorer</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;In supervised learning the input directly gets the output. In reinforcement learning you take\na set of actions and at the end you know whether you got the reward or not.&quot;</em></p>\n</blockquote>\n<p><strong>Key distinction:</strong> RL has no supervisor providing correct actions at each step — only a scalar\nreward that may come much later. The agent must discover <em>which</em> actions led to good outcomes\nthrough trial and error.</p>\n<h3>1.2 The reward hypothesis</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Reward hypothesis</strong> (Sutton &amp; Barto) — all goals can be described by the maximization of\nexpected cumulative reward.</p>\n</blockquote>\n<p>Every objective in RL — winning a game, balancing a pole, maximizing revenue — is encoded as a\nscalar reward signal that the agent tries to maximize over time. The reward function is the\n<em>only</em> communication channel between the environment and the agent about what &quot;good&quot; means.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s4\" data-title=\"The RL Framework\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">The RL Framework</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>2.1 The agent-environment loop</h3>\n<figure class=\"ascii\"><pre>    ┌────────────────────────────────────────────┐\n    │                                            │\n    │  ┌─────────┐  action a_t   ┌────────────┐  │\n    │  │         │──────────────▶│            │  │\n    │  │  Agent  │               │ Environment│  │\n    │  │         │◀──────────────│            │  │\n    │  └─────────┘  state s_{t+1}, reward r_{t+1} └─┘\n    │                                            │\n    └────────────────────────────────────────────┘</pre></figure>\n<p>At each time step <math data-tex=\"t\"><mi>t</mi></math>:</p>\n<ol>\n<li>Agent observes state <math data-tex=\"s_t\"><msub><mi>s</mi><mi>t</mi></msub></math>.</li>\n<li>Agent selects action <math data-tex=\"a_t\"><msub><mi>a</mi><mi>t</mi></msub></math> based on policy <math data-tex=\"\\pi(a_t | s_t)\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</li>\n<li>Environment transitions to <math data-tex=\"s_{t+1}\"><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub></math> with probability <math data-tex=\"P(s_{t+1} | s_t, a_t)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</li>\n<li>Environment emits reward <math data-tex=\"r_{t+1} = R(s_t, a_t, s_{t+1})\"><mrow><msub><mi>r</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</li>\n<li>Repeat.</li>\n</ol>\n<h3>2.2 Policy π</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Policy</strong> <math data-tex=\"\\pi\"><mi>π</mi></math> — a rule for choosing actions. Maps states to actions (deterministic) or\nstates to probability distributions over actions (stochastic).</p>\n</blockquote>\n<ul>\n<li><strong>Deterministic:</strong> <math data-tex=\"\\pi(s) = a\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>a</mi></mrow></math> — given state <math data-tex=\"s\"><mi>s</mi></math>, always take action <math data-tex=\"a\"><mi>a</mi></math>.</li>\n<li><strong>Stochastic:</strong> <math data-tex=\"\\pi(a|s)\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> = probability of taking action <math data-tex=\"a\"><mi>a</mi></math> in state <math data-tex=\"s\"><mi>s</mi></math>.\n<ul>\n<li>Example: <math data-tex=\"\\pi(\\text{left}|s) = 0.6\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>left</mtext><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0.6</mn></mrow></math>, <math data-tex=\"\\pi(\\text{right}|s) = 0.3\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>right</mtext><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0.3</mn></mrow></math>, <math data-tex=\"\\pi(\\text{up}|s) = 0.1\"><mrow><mi>π</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>up</mtext><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0.1</mn></mrow></math>.</li>\n</ul>\n</li>\n</ul>\n<p><strong>Why stochastic policies exist:</strong> exploration — trying new actions reveals new states and new\nreward structures. A purely deterministic policy may never discover the best actions because it\nnever tries them.</p>\n<h3>2.3 Actions: discrete vs. continuous</h3>\n<ul>\n<li><strong>Discrete:</strong> finite set of actions (up, down, left, right, fire).</li>\n<li><strong>Continuous:</strong> real-valued actions (torque applied to a motor joint, amount of investment).</li>\n<li>Within discrete actions: deterministic policies (one action per state) or stochastic\n(probability distribution).</li>\n</ul>\n<hr>\n</section><section id=\"reinforcement-learning-24-s5\" data-title=\"Episodic vs. Continuing Tasks\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Episodic vs. Continuing Tasks</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>3.1 Episodic tasks</h3>\n<p>The interaction breaks naturally into <strong>episodes</strong> — finite sequences from a start state to a\nterminal state. After reaching the terminal state, the environment resets.</p>\n<p><strong>Examples:</strong> chess, maze navigation, a single game of Go, one deal of cards. In the grid world:\nthe episode runs from START → hallway → fork → treasure (reward +10) or trap (reward -10).</p>\n<p>Return: <math data-tex=\"G_t = \\sum_{k=0}^{T-t-1} \\gamma^k R_{t+k+1}\"><mrow><msub><mi>G</mi><mi>t</mi></msub><mo>=</mo><msubsup><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>T</mi><mo>−</mo><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msubsup><msup><mi>γ</mi><mi>k</mi></msup><msub><mi>R</mi><mrow><mi>t</mi><mo>+</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow></math> where <math data-tex=\"T\"><mi>T</mi></math> is the terminal time step.\n<math data-tex=\"\\gamma = 1\"><mrow><mi>γ</mi><mo>=</mo><mn>1</mn></mrow></math> is allowed because the sum is finite.</p>\n<h3>3.2 Continuing tasks</h3>\n<p>No natural endpoint — the agent interacts forever (or until an arbitrary cutoff).</p>\n<p><strong>Examples:</strong> stock trading, server control, robot motor control, a robot balancing a pole\nindefinitely. In the grid world: the agent can roam indefinitely among non-terminal states\nwith no natural endpoint.</p>\n<p>Return: <math data-tex=\"G_t = \\sum_{k=0}^{\\infty} \\gamma^k R_{t+k+1}\"><mrow><msub><mi>G</mi><mi>t</mi></msub><mo>=</mo><msubsup><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mi>∞</mi></msubsup><msup><mi>γ</mi><mi>k</mi></msup><msub><mi>R</mi><mrow><mi>t</mi><mo>+</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow></math>. <strong>γ &lt; 1 is mandatory</strong> — if\n<math data-tex=\"\\gamma = 1\"><mrow><mi>γ</mi><mo>=</mo><mn>1</mn></mrow></math> and rewards are non-zero, the sum diverges to infinity.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The γ = 1 rule:</strong> for continuing tasks, you can have <math data-tex=\"\\gamma = 1\"><mrow><mi>γ</mi><mo>=</mo><mn>1</mn></mrow></math> or infinite horizon,\nbut <strong>not both</strong>. At least one must be finite for the return to be well-defined.</p>\n</aside>\n<h3>3.3 The OpenAI Gym interface</h3>\n<pre class=\"code code-python\"><code class=\"language-python\">env = gym.make('CartPole-v1')\nobs, info = env.reset()\nfor step in range(max_steps):\n    action = agent.act(obs)              # policy π\n    obs, reward, terminated, truncated, info = env.step(action)\n    if terminated or truncated:\n        obs, info = env.reset()</code></pre>\n<ul>\n<li><code>terminated</code>: the episode ended naturally (pole fell, goal reached).</li>\n<li><code>truncated</code>: the episode was cut short by a time limit.</li>\n<li><code>obs</code>: the state (e.g., cart position, velocity, pole angle, angular velocity).</li>\n</ul>\n<hr>\n</section><section id=\"reinforcement-learning-24-s6\" data-title=\"Real-World Applications\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Real-World Applications</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>4.1 Gaming — where RL first showed its power</h3>\n<ul>\n<li><strong>TD-Gammon (1992):</strong> the earliest major RL milestone — learned to play backgammon at\nworld-class level via self-play.</li>\n<li><strong>Atari games (2013–2015):</strong> DeepMind's DQN learned to play 49 Atari games from raw pixels\nalone, beating human experts on many. No feature engineering — just pixels in, game actions out.</li>\n<li><strong>AlphaGo (2016):</strong> DeepMind defeated world champion Lee Sedol at Go, first using human data +\nRL.</li>\n<li><strong>AlphaGo Zero (2017):</strong> beat AlphaGo 100-0 after 3 days of self-play with <strong>no human data</strong>.</li>\n<li><strong>OpenAI Five (2018–2019):</strong> defeated professional Dota 2 players using self-play, no human\ndemonstrations.</li>\n</ul>\n<p><strong>The common thread:</strong> all three used a <strong>simulation environment</strong> where the model could play\nmillions of games against itself, learning from failures and rare successes.</p>\n<h3>4.2 RL milestones timeline</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Year</th>\n<th>Milestone</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1992</td>\n<td>TD-Gammon (backgammon via self-play)</td>\n</tr>\n<tr>\n<td>2013</td>\n<td>DQN (Atari from raw pixels)</td>\n</tr>\n<tr>\n<td>2016</td>\n<td>AlphaGo defeats Lee Sedol</td>\n</tr>\n<tr>\n<td>2017</td>\n<td>AlphaGo Zero (no human data)</td>\n</tr>\n<tr>\n<td>2018</td>\n<td>OpenAI Five (Dota 2)</td>\n</tr>\n<tr>\n<td>2022</td>\n<td>ChatGPT (RLHF for language models)</td>\n</tr>\n<tr>\n<td>2024</td>\n<td>Large-scale reasoning models (DeepSeek et al.)</td>\n</tr>\n</tbody>\n</table></div>\n<h3>4.3 Beyond gaming</h3>\n<ul>\n<li><strong>LLMs:</strong> ChatGPT, Claude, and DeepSeek use RL extensively (RLHF — reinforcement learning from\nhuman feedback) to align model outputs with human preferences beyond what supervised fine-tuning\nalone can achieve.</li>\n<li><strong>Robotics:</strong> sim-to-real transfer — train in simulation, deploy on physical robots.</li>\n<li><strong>Self-driving cars:</strong> lane keeping, navigation.</li>\n<li><strong>Finance:</strong> portfolio optimization, trading strategies.</li>\n<li><strong>Recommendations:</strong> YouTube, Netflix.</li>\n<li><strong>Data centers:</strong> 40% cooling savings (DeepMind).</li>\n</ul>\n<hr>\n</section><section id=\"reinforcement-learning-24-s7\" data-title=\"Markov Decision Processes (MDPs)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Markov Decision Processes (MDPs)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>5.1 The 5-tuple</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>MDP (Markov Decision Process)</strong> — defined by a 5-tuple $(\\mathcal{S}, \\mathcal{A}, P, R,\n\\gamma)$:</p>\n</blockquote>\n<div class=\"table-wrap symtab\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Meaning</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"\\mathcal{S}\"><mi class=\"mathcal\">𝒮</mi></math></td>\n<td>Set of all possible states</td>\n<td>Grid coordinates {(1,1), (1,2), ...}</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\mathcal{A}\"><mi class=\"mathcal\">𝒜</mi></math></td>\n<td>Set of all possible actions</td>\n<td>{up, down, left, right}</td>\n</tr>\n<tr>\n<td><math data-tex=\"P(s'|s,a)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Transition probability</td>\n<td>P(right | (1,1), right) = 0.8</td>\n</tr>\n<tr>\n<td><math data-tex=\"R(s,a,s')\"><mrow><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo separator=\"true\">,</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Reward function</td>\n<td>R((1,1), right, (2,1)) = 0</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\gamma\"><mi>γ</mi></math></td>\n<td>Discount factor ∈ [0,1]</td>\n<td>0.9</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The power of the MDP framework:</strong> once you define these five elements, <em>any</em> RL problem can be\nreduced to the same equations — the math is universal regardless of whether the domain is chess,\nrobotics, or stock trading.</p>\n<h3>5.2 The Markov property</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Markov property</strong> — the future is independent of the past given the present. The current\nstate <math data-tex=\"s_t\"><msub><mi>s</mi><mi>t</mi></msub></math> contains all the information needed to predict the future.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"P(s_{t+1} | s_t, a_t) = P(s_{t+1} | s_1, a_1, s_2, a_2, \\ldots, s_t, a_t)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mi>|</mi><msub><mi>s</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>s</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><strong>What this buys you:</strong> you don't need to remember history. As long as the state is\n<em>sufficiently informative</em> (encodes everything relevant about the past), you can make optimal\ndecisions based only on the current state.</p>\n<p><strong>Examples:</strong></p>\n<ul>\n<li>✅ <strong>Chess board position:</strong> the current position fully determines what moves are legal and\nwhat outcomes are possible — you don't need to know how the game got there.</li>\n<li>❌ <strong>Driving duration:</strong> &quot;how long have I been driving&quot; requires remembering the start time —\nthe current state alone isn't enough.</li>\n</ul>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The Markov property is an assumption, not always true.</strong> In practice, many problems are\n&quot;approximately Markov&quot; — the current state captures <em>most</em> of the relevant information. The\ntrade-off: assuming Markov makes modeling tractable; violating it means the agent's decisions\nmay be suboptimal.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-24-s8\" data-title=\"Transition Probabilities\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Transition Probabilities</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"mblk\"><math data-tex=\"P(s'|s,a) \\geq 0 \\quad \\text{for all } s, a, s'\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≥</mo><mn>0</mn><mspace width=\"1em\"></mspace><mtext>for all </mtext><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo separator=\"true\">,</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\sum_{s'} P(s'|s,a) = 1 \\quad \\text{for all } s, a\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mi>|</mi><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn><mspace width=\"1em\"></mspace><mtext>for all </mtext><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi></mrow></math></div>\n<p><strong>Grid world example:</strong> from state (1,1) with action &quot;right&quot; (slippery stochastic transitions):</p>\n<ul>\n<li>P(right | (1,1), right) = 0.8 (moves right as intended)</li>\n<li>P(up | (1,1), right) = 0.1 (slips up)</li>\n<li>P(down | (1,1), right) = 0.1 (slips down)</li>\n<li>P(left | (1,1), right) = 0 (cannot move left when trying to move right)</li>\n<li>Sum = 0.8 + 0.1 + 0.1 = 1.0 ✓</li>\n<li><strong>Intended travel hits a wall → agent stays in current cell</strong> (not listed as a separate\ntransition; the 0.8 probability of &quot;right&quot; only succeeds if there's no wall).</li>\n</ul>\n<p><strong>Key point:</strong> in most real problems, transition probabilities are <strong>unknown</strong> — the agent must\nlearn the dynamics of the environment through interaction, not from a known model.</p>\n<hr>\n</section><section id=\"reinforcement-learning-24-s9\" data-title=\"Reward Functions and the Discount Factor\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">Reward Functions and the Discount Factor</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>7.1 Reward function</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Reward</strong> <math data-tex=\"R(s,a,s')\"><mrow><mi>R</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><mi>a</mi><mo separator=\"true\">,</mo><msup><mi>s</mi><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime tml-sml-pad\">′</mo></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — a scalar signal emitted at each transition, defining the goal.</p>\n</blockquote>\n<ul>\n<li>Usually <strong>zero</strong> until a terminal or desired state is reached.</li>\n<li>In CartPole: +1 per step the pole stays upright, terminal when the pole tips too far or the cart\ndrifts too far (exact thresholds given just below — see the sourcing caveat there).</li>\n<li>The reward function is the environment designer's way of telling the agent what to optimize.</li>\n</ul>\n<p><strong>CartPole state vector (4 continuous variables):</strong></p>\n<ul>\n<li>Cart position <math data-tex=\"x\"><mi>x</mi></math> (continuous)</li>\n<li>Cart velocity <math data-tex=\"\\dot{x}\"><mover><mi>x</mi><mo stretchy=\"false\" class=\"chr-sml wbk-sml-acc\" style=\"math-depth:0;\">˙</mo></mover></math> (continuous)</li>\n<li>Pole angle <math data-tex=\"\\theta\"><mi>θ</mi></math> (continuous, radians from vertical)</li>\n<li>Pole angular velocity <math data-tex=\"\\dot{\\theta}\"><mover><mi>θ</mi><mo stretchy=\"false\" class=\"wbk-acc\" style=\"math-depth:0;\">˙</mo></mover></math> (continuous)</li>\n<li>Actions: {push_left, push_right} (discrete)</li>\n<li>Terminal conditions: <math data-tex=\"|x| &gt; 2.4\"><mrow><mi>|</mi><mi>x</mi><mi>|</mi><mo>&gt;</mo><mn>2.4</mn></mrow></math>, <math data-tex=\"|\\theta| &gt; 12°\"><mrow><mi>|</mi><mi>θ</mi><mi>|</mi><mo>&gt;</mo><mn>12</mn><mi>°</mi></mrow></math>, or episode length &gt; 500 steps — these are the\nstandard Gymnasium <code>CartPole-v1</code> defaults; the slide itself states states/actions/reward but not\nthese exact thresholds, so treat them as the well-known environment spec rather than a slide quote.</li>\n<li>Physics: deterministic transitions (not stochastic like the grid world)</li>\n</ul>\n<h3>7.2 Discount factor γ</h3>\n<div class=\"mblk\"><math data-tex=\"G_t = \\sum_{k=0}^{\\infty} \\gamma^k R_{t+k+1}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>G</mi><mi>t</mi></msub><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mi>∞</mi></munderover></mrow><msup><mi>γ</mi><mi>k</mi></msup><msub><mi>R</mi><mrow><mi>t</mi><mo>+</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow></math></div>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><math data-tex=\"\\gamma\"><mi>γ</mi></math></th>\n<th>Interpretation</th>\n<th>Effective horizon</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>Only cares about immediate reward</td>\n<td>1 step</td>\n</tr>\n<tr>\n<td>0.9</td>\n<td>Far-sighted but still convergent</td>\n<td><math data-tex=\"\\frac{1}{1-0.9} = 10\"><mrow><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mn>0.9</mn></mrow></mfrac><mo>=</mo><mn>10</mn></mrow></math> steps</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Values all future rewards equally</td>\n<td><math data-tex=\"\\infty\"><mi>∞</mi></math> (diverges for continuing tasks)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Why discounting matters — three reasons:</strong></p>\n<ol>\n<li><strong>Convergence:</strong> ensures infinite sums converge (required for continuing tasks).</li>\n<li><strong>Uncertainty:</strong> far-future rewards are less certain — discounting reflects this.</li>\n<li><strong>Myopia:</strong> &quot;cash now is better than cash later&quot; — immediate rewards are naturally more\nvaluable than delayed ones of the same magnitude.</li>\n</ol>\n<h3>7.3 Interactive demo — which path does the agent choose?</h3>\n<p>The lecture's interactive demo presents multiple scenarios with different γ values:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>γ</th>\n<th>Effective horizon</th>\n<th>Path A (immediate +5, then +1/step)</th>\n<th>Path B (delayed +10 after 10 steps)</th>\n<th>Agent's choice</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0.90</td>\n<td>10 steps</td>\n<td>8.69</td>\n<td>15.90</td>\n<td><strong>Path B</strong> (delayed reward still visible)</td>\n</tr>\n<tr>\n<td>0.99</td>\n<td>100 steps</td>\n<td>9.85</td>\n<td>23.92</td>\n<td><strong>Path B</strong> (far-sighted, values delayed reward highly)</td>\n</tr>\n<tr>\n<td>0.68</td>\n<td>~3 steps</td>\n<td>6.82</td>\n<td>5.58</td>\n<td><strong>Path A</strong> (myopic, immediate reward dominates)</td>\n</tr>\n<tr>\n<td>0.14</td>\n<td>~1.2 steps</td>\n<td>5.16</td>\n<td>1.16</td>\n<td><strong>Path A</strong> (very myopic)</td>\n</tr>\n<tr>\n<td>0.00</td>\n<td>1 step</td>\n<td>5.00</td>\n<td>1.00</td>\n<td><strong>Path A</strong> (only sees immediate reward)</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>A previous version of this table labeled the 5.16/1.16 row &quot;γ = 0.10.&quot;</strong> The lecture's own\ndemo screen [slide 72] shows these exact values (5.16, 1.16) computed at <strong>γ = 0.14</strong> (its own\nannotation reads &quot;Eff. horizon: 1.2 steps&quot;), not γ = 0.10 — corrected above.</p>\n</aside>\n<p><strong>Key insight from the demo:</strong> as γ decreases, the agent becomes progressively more myopic —\nit can no longer &quot;see&quot; the delayed +10 reward because it's discounted to near-zero. At γ = 0.9,\nthe +10 after 10 steps is still worth 10 × 0.9¹⁰ ≈ 3.5, which combined with the intermediate\n+1/step rewards totals 15.90, beating Path A's 8.69. But at γ = 0.1, the same +10 is discounted\nto 10 × 0.1¹⁰ ≈ 0 — invisible.</p>\n<p><strong>Effective planning horizon:</strong> <math data-tex=\"\\frac{1}{1-\\gamma}\"><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mi>γ</mi></mrow></mfrac></math>. At <math data-tex=\"\\gamma = 0.9\"><mrow><mi>γ</mi><mo>=</mo><mn>0.9</mn></mrow></math>, the agent effectively\nplans 10 steps ahead. At <math data-tex=\"\\gamma = 0.99\"><mrow><mi>γ</mi><mo>=</mo><mn>0.99</mn></mrow></math>, it plans 100 steps ahead. At <math data-tex=\"\\gamma = 0.1\"><mrow><mi>γ</mi><mo>=</mo><mn>0.1</mn></mrow></math>, only\n~1 step ahead.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — γ controls the agent's time preference.</strong> A low <math data-tex=\"\\gamma\"><mi>γ</mi></math> makes the agent\nmyopic (greedy for immediate reward); a high <math data-tex=\"\\gamma\"><mi>γ</mi></math> makes it farsighted (willing to endure\nshort-term pain for long-term gain). The choice of <math data-tex=\"\\gamma\"><mi>γ</mi></math> is a design decision that encodes\nhow much the problem designer values future versus immediate rewards.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-reinforcement-learning-24-0\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;γ and the Agent's Time Horizon&quot;,&quot;concept&quot;:&quot;The discount factor γ sets the agent's effective planning horizon and decides which of two reward paths looks better&quot;,&quot;control&quot;:&quot;Drag γ continuously from 0.00 to 0.99&quot;,&quot;observe&quot;:&quot;The per-step decay bars (γ⁰, γ¹, γ²...) reshape, Path A's and Path B's G₀ recompute live, and the \\&quot;Agent chooses\\&quot; banner flips between Path A and Path B as γ crosses the point where they're equal&quot;,&quot;insight&quot;:&quot;Path B's delayed +10 only \\&quot;counts\\&quot; once γ is high enough that γ¹⁰ isn't already ≈0 — below that crossover the same +10 reward is mathematically invisible to the agent, no matter how large it is&quot;,&quot;fallback&quot;:&quot;The table above gives five sampled γ values (0.00, 0.14, 0.68, 0.90, 0.99) with both paths' computed G₀ and which path wins at each — γ=0.90 and 0.99 favor Path B (15.90, 23.92 vs. 8.69, 9.85); γ=0.68, 0.14, and 0.00 favor Path A (6.82, 5.16, 5.00 vs. 5.58, 1.16, 1.00), with the crossover between γ=0.68 and γ=0.90.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">γ and the Agent's Time Horizon</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>The discount factor γ sets the agent's effective planning horizon and decides which of two reward paths looks better</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Drag γ continuously from 0.00 to 0.99</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The per-step decay bars (γ⁰, γ¹, γ²...) reshape, Path A's and Path B's G₀ recompute live, and the \"Agent chooses\" banner flips between Path A and Path B as γ crosses the point where they're equal</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Path B's delayed +10 only \"counts\" once γ is high enough that γ¹⁰ isn't already ≈0 — below that crossover the same +10 reward is mathematically invisible to the agent, no matter how large it is</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The table above gives five sampled γ values (0.00, 0.14, 0.68, 0.90, 0.99) with both paths' computed G₀ and which path wins at each — γ=0.90 and 0.99 favor Path B (15.90, 23.92 vs. 8.69, 9.85); γ=0.68, 0.14, and 0.00 favor Path A (6.82, 5.16, 5.00 vs. 5.58, 1.16, 1.00), with the crossover between γ=0.68 and γ=0.90.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"reinforcement-learning-24-s10\" data-title=\"Value Functions\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Value Functions</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-24-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>8.1 State value function V^π(s)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>State value function</strong> — the expected cumulative discounted reward starting from state <math data-tex=\"s\"><mi>s</mi></math>\nand following policy <math data-tex=\"\\pi\"><mi>π</mi></math> forever.</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"V^\\pi(s) = \\mathbb{E}_\\pi[G_t | S_t = s] = \\mathbb{E}_\\pi\\left[\\sum_{k=0}^{\\infty} \\gamma^k R_{t+k+1} \\;\\Big|\\; S_t = s\\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>V</mi><mi>π</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>𝔼</mi><mi>π</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>G</mi><mi>t</mi></msub><mi>|</mi><msub><mi>S</mi><mi>t</mi></msub><mo>=</mo><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><msub><mi>𝔼</mi><mi>π</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mi>∞</mi></munderover></mrow><msup><mi>γ</mi><mi>k</mi></msup><msub><mi>R</mi><mrow><mi>t</mi><mo>+</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mspace width=\"0.2778em\"></mspace><mo fence=\"false\" stretchy=\"true\" symmetric=\"true\" minsize=\"1.8em\" maxsize=\"
