ss=\"mblk bound\"><math data-tex=\"\\nabla_\\theta J(\\theta) = \\mathbb{E}\\left[\\sum_t \\nabla_\\theta \\log \\pi_\\theta(a_t|s_t) \\cdot (G_t - b(s_t))\\right]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mi>J</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>t</mi></munder></mrow><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>G</mi><mi>t</mi></msub><mo>−</mo><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"\\nabla_\\theta \\log \\pi_\\theta(a_t\\vert s_t)\"><mrow><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;the score function&quot;</td>\n<td>Same as <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§2.1\" role=\"link\" tabindex=\"0\">§2.1</a> — the direction in parameter space that makes action <math data-tex=\"a_t\"><msub><mi>a</mi><mi>t</mi></msub></math> more probable</td>\n</tr>\n<tr>\n<td><math data-tex=\"G_t\"><msub><mi>G</mi><mi>t</mi></msub></math></td>\n<td>&quot;the return from <math data-tex=\"t\"><mi>t</mi></math>&quot;</td>\n<td>Same discounted return as <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§2.1\" role=\"link\" tabindex=\"0\">§2.1</a>: <math data-tex=\"\\sum_{k=t}^{T}\\gamma^{k-t}R_k\"><mrow><msubsup><mo movablelimits=\"false\">∑</mo><mrow><mi>k</mi><mo>=</mo><mi>t</mi></mrow><mi>T</mi></msubsup><msup><mi>γ</mi><mrow><mi>k</mi><mo>−</mo><mi>t</mi></mrow></msup><msub><mi>R</mi><mi>k</mi></msub></mrow></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"b(s_t)\"><mrow><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;the baseline&quot;</td>\n<td>Any function of the state <em>alone</em> (never the action) subtracted to reduce variance; commonly <math data-tex=\"V(s_t)\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"G_t - b(s_t)\"><mrow><msub><mi>G</mi><mi>t</mi></msub><mo>−</mo><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;the centered return&quot;</td>\n<td>How much better the actual return was than the baseline expected — this, not raw <math data-tex=\"G_t\"><msub><mi>G</mi><mi>t</mi></msub></math>, is what scales the update</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Key insight:</strong> subtracting a baseline b(s_t) that doesn't depend on the action a_t <strong>reduces\nvariance without introducing bias.</strong></p>\n<p><strong>Derivation — why the baseline term's expectation is exactly zero:</strong> for a fixed state <math data-tex=\"s_t\"><msub><mi>s</mi><mi>t</mi></msub></math>,\nsince <math data-tex=\"b(s_t)\"><mrow><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> doesn't depend on the action, it can be pulled out of the sum over actions:</p>\n<div class=\"mblk\"><math data-tex=\"\\mathbb{E}_{a_t \\sim \\pi_\\theta}\\big[\\nabla_\\theta \\log \\pi_\\theta(a_t|s_t)\\cdot b(s_t)\\big]\n= b(s_t) \\sum_{a_t} \\pi_\\theta(a_t|s_t) \\nabla_\\theta \\log \\pi_\\theta(a_t|s_t)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝔼</mi><mrow><msub><mi>a</mi><mi>t</mi></msub><mo>∼</mo><msub><mi>π</mi><mi>θ</mi></msub></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>π</mi><mi>θ</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>⋅</mo><mi>b</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo><mo>=</mo><mi>b</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><msub><mi>a</mi><mi>t</mi></msub></munder></mrow><msub><mi>π</mi><mi>θ</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>π</mi><mi>θ</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></math></div>\n<p>Using <math data-tex=\"\\nabla_\\theta \\log \\pi_\\theta(a|s) = \\nabla_\\theta \\pi_\\theta(a|s) / \\pi_\\theta(a|s)\"><mrow><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>/</mi><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>|</mi><mi>s</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, the\n<math data-tex=\"\\pi_\\theta(a_t|s_t)\"><mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> factors cancel:</p>\n<div class=\"mblk\"><math data-tex=\"= b(s_t) \\sum_{a_t} \\nabla_\\theta \\pi_\\theta(a_t|s_t) = b(s_t)\\, \\nabla_\\theta \\sum_{a_t} \\pi_\\theta(a_t|s_t) = b(s_t) \\, \\nabla_\\theta (1) = 0\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mo>=</mo><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><msub><mi>a</mi><mi>t</mi></msub></munder></mrow><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><munder><mo movablelimits=\"false\">∑</mo><msub><mi>a</mi><mi>t</mi></msub></munder></mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math></div>\n<p>(the last step uses <math data-tex=\"\\sum_{a_t}\\pi_\\theta(a_t|s_t)=1\"><mrow><msub><mo movablelimits=\"false\">∑</mo><msub><mi>a</mi><mi>t</mi></msub></msub><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn></mrow></math> for every <math data-tex=\"\\theta\"><mi>θ</mi></math>, since <math data-tex=\"\\pi_\\theta(\\cdot|s_t)\"><mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">⋅</mo><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>\nis always a valid probability distribution — so its gradient with respect to <math data-tex=\"\\theta\"><mi>θ</mi></math> is exactly\nzero). Subtracting <em>any</em> state-dependent <math data-tex=\"b(s_t)\"><mrow><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> therefore adds zero to the gradient's\n<strong>expectation</strong> while changing the <strong>variance</strong> of individual samples — which is exactly what a\nbaseline is for.</p>\n<p><strong>Common baselines:</strong></p>\n<ul>\n<li><strong>Constant baseline:</strong> average reward (simple but doesn't adapt to state value).</li>\n<li><strong>State-value baseline:</strong> b(s_t) = V(s_t) — the most common. The advantage G_t − V(s_t)\nmeasures &quot;how much better was this action compared to average?&quot;</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — baselines center the reward signal.</strong> Without a baseline, every update is\nrelative to zero. With baseline V(s), updates become relative to &quot;what was expected in this\nstate.&quot; Actions that are merely average get zero gradient; only truly good or bad actions\ngenerate learning signals.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-26-s6\" data-title=\"Actor-Critic Methods\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Actor-Critic Methods</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>4.1 The core idea</h3>\n<p>Actor-critic solves REINFORCE's biggest flaw (waiting for full episodes) by combining:</p>\n<ul>\n<li><strong>Actor</strong> (policy network π(a|s; θ)): decides <strong>what to do</strong> — learns the policy.</li>\n<li><strong>Critic</strong> (value network V(s; φ)): evaluates <strong>how good it is</strong> — learns the value function.</li>\n</ul>\n<h3>4.2 Why both?</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Actor alone</th>\n<th>Critic alone</th>\n<th>Together</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Variance</td>\n<td>High (pure policy gradient)</td>\n<td>—</td>\n<td><strong>Low</strong> (bootstrapping)</td>\n</tr>\n<tr>\n<td>Continuous actions</td>\n<td>✓</td>\n<td>✗</td>\n<td><strong>✓</strong></td>\n</tr>\n<tr>\n<td>Updates</td>\n<td>End of episode</td>\n<td>Every step</td>\n<td><strong>Every step</strong></td>\n</tr>\n<tr>\n<td>Sample efficiency</td>\n<td>Low</td>\n<td>—</td>\n<td><strong>High</strong></td>\n</tr>\n</tbody>\n</table></div>\n<h3>4.3 The loop</h3>\n<pre class=\"code\"><code>State s → Actor → Action a → Environment → Reward R, next state s'\n                                       → Critic → TD error/advantage → update Actor</code></pre>\n<p><strong>Key advantages over REINFORCE:</strong></p>\n<ol>\n<li><strong>Updates every step</strong> — no waiting for episode end.</li>\n<li><strong>Lower variance</strong> — bootstrapping replaces long-term path randomness with smooth critic\nestimates.</li>\n<li><strong>Stable training</strong> — combines policy optimization flexibility with value function stability.</li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-26-s7\" data-title=\"A2C — Advantage Actor-Critic\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">A2C — Advantage Actor-Critic</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>5.1 The advantage function</h3>\n<p><strong>Words before symbols:</strong> the advantage of an action is simply how much better it did than the\nstate's own average action-value.</p>\n<div class=\"mblk\"><math data-tex=\"A(s_t, a_t) = Q(s_t, a_t) - V(s_t)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>A</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p>&quot;How much better was this specific action compared to the average action in this state?&quot;</p>\n<p><strong>Practical approximation</strong> (avoids needing two value functions):</p>\n<div class=\"mblk bound\"><math data-tex=\"A(s_t, a_t) \\approx R_t + \\gamma V(s_{t+1}) - V(s_t) = \\delta_t\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>A</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><msub><mi>R</mi><mi>t</mi></msub><mo>+</mo><mi>γ</mi><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>δ</mi><mi>t</mi></msub></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"A(s_t,a_t)\"><mrow><mi>A</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;the advantage&quot;</td>\n<td>How much better action <math data-tex=\"a_t\"><msub><mi>a</mi><mi>t</mi></msub></math> was than the state's average action</td>\n</tr>\n<tr>\n<td><math data-tex=\"Q(s_t,a_t)\"><mrow><mi>Q</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;action-value&quot;</td>\n<td>Expected return from taking <math data-tex=\"a_t\"><msub><mi>a</mi><mi>t</mi></msub></math> in <math data-tex=\"s_t\"><msub><mi>s</mi><mi>t</mi></msub></math> then following the policy</td>\n</tr>\n<tr>\n<td><math data-tex=\"V(s_t)\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;state-value / baseline&quot;</td>\n<td>Expected return from <math data-tex=\"s_t\"><msub><mi>s</mi><mi>t</mi></msub></math>, averaged over the policy's own actions (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>'s <math data-tex=\"b(s_t)\"><mrow><mi>b</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>)</td>\n</tr>\n<tr>\n<td><math data-tex=\"R_t\"><msub><mi>R</mi><mi>t</mi></msub></math></td>\n<td>&quot;immediate reward&quot;</td>\n<td>Reward received at step <math data-tex=\"t\"><mi>t</mi></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\delta_t\"><msub><mi>δ</mi><mi>t</mi></msub></math></td>\n<td>&quot;TD error&quot;</td>\n<td>The one-step bootstrapped stand-in for the advantage — reuses only the critic, no separate <math data-tex=\"Q\"><mi>Q</mi></math> network needed</td>\n</tr>\n</tbody>\n</table></div>\n<p>The TD error δ_t IS the advantage estimate.</p>\n<h3>5.2 The updates</h3>\n<p><strong>Words before symbols:</strong> the critic is trained like ordinary supervised regression — minimize the\nsquared gap between its prediction and its own one-step-ahead target — while the actor takes an\nordinary policy-gradient step, just scaled by the advantage instead of the raw return.</p>\n<p><strong>Critic update</strong> (minimize MSE between predicted value and TD target):</p>\n<div class=\"mblk\"><math data-tex=\"L_{\\text{critic}}(\\phi) = \\frac{1}{T}\\sum_t \\big(G_t - V(s_t; \\phi)\\big)^2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>L</mi><mtext>critic</mtext></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>ϕ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mfrac><mn>1</mn><mi>T</mi></mfrac><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>t</mi></munder></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><msub><mi>G</mi><mi>t</mi></msub><mo>−</mo><mi>V</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mi>t</mi></msub><mo separator=\"true\">;</mo><mi>ϕ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><msup><mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mrow></mrow></mrow><mn>2</mn></msup></mrow></math></div>\n<p>where G_t = R_t + γV(s_{t+1}; φ) is the TD target.</p>\n<p><strong>Actor update</strong> (scale policy gradient by advantage):</p>\n<div class=\"mblk bound\"><math data-tex=\"\\theta \\leftarrow \\theta + \\alpha \\sum_t \\nabla_\\theta \\log \\pi_\\theta(a_t|s_t) \\cdot A_t\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>θ</mi><mo stretchy=\"false\">←</mo><mi>θ</mi><mo>+</mo><mi>α</mi><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>t</mi></munder></mrow><msub><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>θ</mi></msub><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>π</mi><mi>θ</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mi>|</mi><msub><mi>s</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><msub><mi>A</mi><mi>t</mi></msub></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"\\phi\"><mi>ϕ</mi></math></td>\n<td>&quot;critic's parameters&quot;</td>\n<td>Weights of the value network <math data-tex=\"V(s;\\phi)\"><mrow><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">;</mo><mi>ϕ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"G_t\"><msub><mi>G</mi><mi>t</mi></msub></math></td>\n<td>&quot;TD target&quot; (reused notation)</td>\n<td><math data-tex=\"R_t + \\gamma V(s_{t+1};\\phi)\"><mrow><msub><mi>R</mi><mi>t</mi></msub><mo>+</mo><mi>γ</mi><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mo separator=\"true\">;</mo><mi>ϕ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — here it's the critic's own regression target, not <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>'s Monte Carlo return</td>\n</tr>\n<tr>\n<td><math data-tex=\"L_{\\text{critic}}\"><msub><mi>L</mi><mtext>critic</mtext></msub></math></td>\n<td>&quot;critic loss&quot;</td>\n<td>Mean squared error between the critic's prediction and its bootstrapped target</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\theta\"><mi>θ</mi></math></td>\n<td>&quot;actor's parameters&quot;</td>\n<td>Weights of the policy network <math data-tex=\"\\pi_\\theta\"><msub><mi>π</mi><mi>θ</mi></msub></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\alpha\"><mi>α</mi></math></td>\n<td>&quot;learning rate&quot;</td>\n<td>Step size for the actor's gradient-ascent update</td>\n</tr>\n<tr>\n<td><math data-tex=\"A_t\"><msub><mi>A</mi><mi>t</mi></msub></math></td>\n<td>&quot;advantage at step <math data-tex=\"t\"><mi>t</mi></math>&quot;</td>\n<td>From <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a> — scales the policy-gradient step by how good the action actually was</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Shared architecture:</strong> initial layers shared between actor and critic, with separate output\nheads.</p>\n<hr>\n</section><section id=\"reinforcement-learning-26-s8\" data-title=\"A3C — Asynchronous Advantage Actor-Critic\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">A3C — Asynchronous Advantage Actor-Critic</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>6.1 Key innovation</h3>\n<p>Multiple parallel workers, each exploring simultaneously.</p>\n<p><strong>Architecture:</strong></p>\n<ul>\n<li><strong>Global network:</strong> central parameters for actor and critic.</li>\n<li><strong>Worker threads:</strong> each with a local copy of the global network.</li>\n</ul>\n<h3>6.2 The workflow</h3>\n<ol>\n<li>Workers interact independently with their own environment copies.</li>\n<li>Each worker computes gradients from its collected experience.</li>\n<li>Workers send gradients to update the global network <strong>asynchronously</strong> (don't wait for others).</li>\n<li>Workers sync local parameters to the updated global network and continue.</li>\n</ol>\n<h3>6.3 Why async works</h3>\n<ul>\n<li><strong>Decorrelated experience</strong> — each worker uses a slightly different policy version, creating\ndiversity similar to experience replay.</li>\n<li><strong>Faster wall-clock training</strong> on multi-core CPUs.</li>\n<li><strong>Natural exploration</strong> through diverse worker experiences.</li>\n</ul>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>A3C is largely superseded by A2C + GPU parallelism.</strong> A2C batches experiences from\nparallel actors for a single larger update, leveraging GPU parallelism more effectively than\nA3C's asynchronous updates.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-26-s9\" data-title=\"GAE — Generalized Advantage Estimation\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">GAE — Generalized Advantage Estimation</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>7.1 The bias-variance tradeoff</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Bias</th>\n<th>Variance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1-step TD (A2C)</td>\n<td>High</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>Monte Carlo (REINFORCE)</td>\n<td>Zero</td>\n<td>High</td>\n</tr>\n</tbody>\n</table></div>\n<p>GAE bridges this with a single parameter λ:</p>\n<div class=\"mblk\"><math data-tex=\"\\hat{A}_t^{\\text{GAE}(\\gamma,\\lambda)} = \\sum_{l=0}^{\\infty} (\\gamma\\lambda)^l \\delta_{t+l}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msubsup><mover><mi>A</mi><mo stretchy=\"false\" class=\"chr-lrg wbk-lrg-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi><mrow><mtext>GAE</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>γ</mi><mo separator=\"true\">,</mo><mi>λ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></msubsup><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>l</mi><mo>=</mo><mn>0</mn></mrow><mi>∞</mi></munderover></mrow><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>γ</mi><mi>λ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>l</mi></msup><msub><mi>δ</mi><mrow><mi>t</mi><mo>+</mo><mi>l</mi></mrow></msub></mrow></math></div>\n<p><strong>Words before symbols:</strong> the advantage at time <math data-tex=\"t\"><mi>t</mi></math> is an exponentially-weighted sum of every TD\nerror from <math data-tex=\"t\"><mi>t</mi></math> onward, with the weight shrinking by a factor of <math data-tex=\"\\gamma\\lambda\"><mrow><mi>γ</mi><mi>λ</mi></mrow></math> at each further\nstep — near-term surprises count almost fully, distant ones fade out.</p>\n<div class=\"table-wrap symtab\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"\\hat{A}_t^{\\text{GAE}(\\gamma,\\lambda)}\"><msubsup><mover><mi>A</mi><mo stretchy=\"false\" class=\"chr-lrg wbk-lrg-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mi>t</mi><mrow><mtext>GAE</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>γ</mi><mo separator=\"true\">,</mo><mi>λ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></msubsup></math></td>\n<td>&quot;the GAE advantage estimate&quot;</td>\n<td>How much better state-action pair at <math data-tex=\"t\"><mi>t</mi></math> did than expected, blending many horizons</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\delta_{t+l}\"><msub><mi>δ</mi><mrow><mi>t</mi><mo>+</mo><mi>l</mi></mrow></msub></math></td>\n<td>&quot;the TD error <math data-tex=\"l\"><mi>l</mi></math> steps ahead&quot;</td>\n<td><math data-tex=\"R_{t+l} + \\gamma V(s_{t+l+1}) - V(s_{t+l})\"><mrow><msub><mi>R</mi><mrow><mi>t</mi><mo>+</mo><mi>l</mi></mrow></msub><mo>+</mo><mi>γ</mi><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mi>l</mi><mo>+</mo><mn>1</mn></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>V</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mi>l</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\gamma\"><mi>γ</mi></math></td>\n<td>&quot;discount factor&quot;</td>\n<td>Same discount factor as everywhere else in this module</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\lambda\"><mi>λ</mi></math></td>\n<td>&quot;the GAE trace parameter&quot;</td>\n<td>Dials how much weight distant TD errors keep; <math data-tex=\"\\lambda=0\"><mrow><mi>λ</mi><mo>=</mo><mn>0</mn></mrow></math> keeps only the first term</td>\n</tr>\n</tbody>\n</table></div>\n<p>where δ_t = R_t + γV(s_{t+1}) − V(s_t) is the TD error.</p>\n<h3>7.2 How λ controls the tradeoff</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>λ</th>\n<th>Effect</th>\n<th>Equivalent to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>Only 1-step TD</td>\n<td>A2C (low variance, high bias)</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Full Monte Carlo</td>\n<td>REINFORCE (high variance, zero bias)</td>\n</tr>\n<tr>\n<td>0.95–0.99</td>\n<td><strong>Sweet spot</strong></td>\n<td>Balanced bias-variance</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — λ is a dial, not a switch.</strong> You can smoothly interpolate between the\ntwo extremes. λ = 0.95 is typical — you get most of Monte Carlo's low bias while keeping most\nof TD's low variance.</p>\n</aside>\n<h3>7.3 PPO — Proximal Policy Optimization</h3>\n<p>PPO is used throughout the rest of this lecture (the hands-on demo in <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>, the RLHF fine-tuning\nstep in <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§9.5\" role=\"link\" tabindex=\"0\">§9.5</a>) but deserves its own definition first, since everything after this point assumes it.</p>\n<blockquote class=\"aside-quote\">\n<p><strong>PPO (Proximal Policy Optimization)</strong> — an on-policy, actor-critic algorithm that updates the\npolicy using ordinary policy-gradient/advantage machinery (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>–<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>, GAE from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§7.1–7\" role=\"link\" tabindex=\"0\">§7.1–7</a>.2 for the\nadvantage estimate), but <strong>clips</strong> how far a single update is allowed to move the policy, so one\nbad batch of data can't destabilize training.</p>\n</blockquote>\n<p><strong>The problem PPO solves:</strong> a plain policy-gradient step (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>'s REINFORCE, or A2C's actor update\nin <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>) can occasionally take a <em>too-large</em> step — a batch of unusually good or bad returns pushes\n<math data-tex=\"\\theta\"><mi>θ</mi></math> far enough that the policy changes dramatically in one update, sometimes catastrophically.\nTrust-region methods fix this by explicitly constraining how much the policy is allowed to change\nper update; PPO is the practical, easy-to-implement approximation of that idea.</p>\n<p><strong>The clipped objective, in words first:</strong> measure how much the <em>new</em> policy's probability of the\naction taken differs from the <em>old</em> policy's probability of that same action — call this ratio\n<math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. If the advantage was positive (the action was good), increasing <math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> increases\nthe objective — but PPO <strong>clips</strong> this benefit once <math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> moves too far from 1, so the update\ncan't over-reward a single lucky batch. Symmetrically for negative advantages.</p>\n<div class=\"mblk bound\"><math data-tex=\"r(\\theta) = \\frac{\\pi_\\theta(a\\mid s)}{\\pi_{\\theta_{\\text{old}}}(a\\mid s)} \\qquad L^{\\text{CLIP}}(\\theta) = \\mathbb{E}\\Big[\\min\\big(r(\\theta)\\,\\hat A,\\ \\text{clip}(r(\\theta),\\,1-\\epsilon,\\,1+\\epsilon)\\,\\hat A\\big)\\Big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mfrac><mrow><msub><mi>π</mi><mi>θ</mi></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>s</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow><mrow><msub><mi>π</mi><msub><mi>θ</mi><mtext>old</mtext></msub></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>s</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></mfrac><mspace width=\"2em\"></mspace><msup><mi>L</mi><mtext class=\"tml-sml-pad\">CLIP</mtext></msup><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mi>𝔼</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.8em\" maxsize=\"1.8em\">[</mo><mrow><mi>min</mi><mo>⁡</mo></mrow><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mspace width=\"0.1667em\"></mspace><mover><mi>A</mi><mo stretchy=\"false\" class=\"chr-lrg wbk-lrg-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo separator=\"true\">,</mo><mtext> </mtext><mtext>clip</mtext><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mspace width=\"0.1667em\"></mspace><mn>1</mn><mo>−</mo><mi>ϵ</mi><mo separator=\"true\">,</mo><mspace width=\"0.1667em\"></mspace><mn>1</mn><mo>+</mo><mi>ϵ</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mspace width=\"0.1667em\"></mspace><mover><mi>A</mi><mo stretchy=\"false\" class=\"chr-lrg wbk-lrg-acc\" style=\"math-depth:0;\">ˆ</mo></mover><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.8em\" maxsize=\"1.8em\">]</mo></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;probability ratio&quot;</td>\n<td>How much more (or less) likely the new policy is to take the same action, vs. the old policy</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\hat A\"><mover><mi>A</mi><mo stretchy=\"false\" class=\"chr-lrg wbk-lrg-acc\" style=\"math-depth:0;\">ˆ</mo></mover></math></td>\n<td>&quot;advantage estimate&quot;</td>\n<td>From GAE (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>), positive if the action beat expectations</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\epsilon\"><mi>ϵ</mi></math></td>\n<td>&quot;clip range&quot;</td>\n<td>Typically 0.1–0.2; how far <math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is allowed to move from 1 before the benefit is capped</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\min(\\cdot,\\cdot)\"><mrow><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">⋅</mo><mo separator=\"true\">,</mo><mo form=\"prefix\" stretchy=\"false\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;take the more conservative estimate&quot;</td>\n<td>Prevents the objective from rewarding an update that moved <math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> <em>outside</em> the clip range, in either direction</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Why this makes training stable without a hard trust-region constraint:</strong> the <math data-tex=\"\\min\"><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></math> with the\nclipped term means that once <math data-tex=\"r(\\theta)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> exceeds <math data-tex=\"1+\\epsilon\"><mrow><mn>1</mn><mo>+</mo><mi>ϵ</mi></mrow></math> (for a positive-advantage action), the\nobjective's gradient with respect to <math data-tex=\"\\theta\"><mi>θ</mi></math> in that direction goes to zero — there's no more\nincentive to push the policy further in that update. This achieves, cheaply and without a second-order\nconstrained optimization step, roughly the same effect a full trust-region method achieves with much\nmore machinery.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — PPO is a safety rail on top of everything already covered, not a new learning\nsignal.</strong> It still uses the actor-critic architecture (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>), the advantage function (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a>), and GAE\n(<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§7.1–7\" role=\"link\" tabindex=\"0\">§7.1–7</a>.2) exactly as described — the only change is capping how much a single batch of data is\nallowed to move <math data-tex=\"\\theta\"><mi>θ</mi></math>. This is why PPO shows up as <em>the</em> practical default across so much of\nmodern RL (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>'s hands-on demo, <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§9.5\" role=\"link\" tabindex=\"0\">§9.5</a>'s RLHF fine-tuning step) — it's the same machinery, made safe\nto run unattended on noisy, real-world reward signals.</p>\n</aside>\n<hr>\n</section><section id=\"reinforcement-learning-26-s10\" data-title=\"Multi-Agent RL\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Multi-Agent RL</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>8.1 The challenge: non-stationarity</h3>\n<p>When multiple agents learn simultaneously, each agent's environment includes the other agents'\npolicies — which are changing. This breaks single-agent RL's assumption of a stationary\nenvironment.</p>\n<h3>8.2 Three paradigms</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Goal</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cooperative</strong></td>\n<td>Maximize common reward</td>\n<td>Warehouse robots collaborating on package delivery</td>\n</tr>\n<tr>\n<td><strong>Competitive</strong></td>\n<td>Maximize own reward by minimizing opponent's</td>\n<td>Chess, poker, self-driving competition</td>\n</tr>\n<tr>\n<td><strong>Self-Play</strong></td>\n<td>Agent plays against copies of itself</td>\n<td>AlphaGo, AlphaZero</td>\n</tr>\n</tbody>\n</table></div>\n<h3>8.3 Cooperative: CTDE (Centralized Training, Decentralized Execution)</h3>\n<p><strong>During training:</strong> give access to everything (all observations, all actions, global state).\nThis makes credit assignment easier.</p>\n<p><strong>During execution:</strong> each agent acts independently using only its own observations.</p>\n<p><strong>Algorithms:</strong> QMIX, MAPPO.</p>\n<h3>8.4 Self-play: the auto-curriculum</h3>\n<p>The agent plays against its current best policy. As it improves, its opponent automatically\nimproves too. The difficulty scales perfectly with the agent's skill level — never too easy, never\ntoo hard.</p>\n<p><strong>The virtuous cycle:</strong> self-play → policy improvement → harder opponent → more improvement → ...\n→ superhuman.</p>\n<blockquote class=\"aside-quote\">\n<p>This is exactly how AlphaGo Zero achieved 100-0 against AlphaGo after 3 days of self-play\nwith no human data.</p>\n</blockquote>\n<hr>\n</section><section id=\"reinforcement-learning-26-s11\" data-title=\"RL with Human Feedback (RLHF)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">RL with Human Feedback (RLHF)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>9.1 The problem: aligning LLMs</h3>\n<p>Language models trained on raw internet can generate fluent text but may produce harmful,\nunhelpful, or misaligned outputs. The problem: it's hard to specify a reward function for human\nconcepts like &quot;politeness&quot; or &quot;helpfulness.&quot;</p>\n<h3>9.2 The solution: learn reward from preferences</h3>\n<p>Humans can easily compare two outputs and say which is better, even without writing an explicit\nformula. RLHF learns a reward model from these comparisons, then optimizes the policy against\nthe learned reward.</p>\n<h3>9.3 The five-stage pipeline</h3>\n<figure class=\"ascii\"><pre>1. Pretrain: LM on large text corpus\n        ↓\n2. SFT (Supervised Fine-Tuning): Fine-tune on curated demonstrations\n        ↓\n3. Collect Preferences: Generate response pairs from SFT, humans label A &gt; B\n        ↓\n4. Train Reward Model: Learn R(prompt, response) from preference data\n        ↓\n5. RL Fine-Tuning: Optimize LLM with PPO using learned reward + KL penalty</pre></figure>\n<h3>9.4 The reward model</h3>\n<p><strong>Bradley-Terry model:</strong></p>\n<div class=\"mblk\"><math data-tex=\"P(A \\succ B) = \\sigma\\big(r(A) - r(B)\\big)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>A</mi><mo>≻</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>=</mo><mi>σ</mi><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo></mrow></math></div>\n<p><strong>Words before symbols:</strong> the probability that a human prefers response A over response B is the\nsigmoid of the <em>difference</em> in their learned reward scores — the bigger the reward gap, the more\nconfidently A should be preferred.</p>\n<div class=\"table-wrap symtab\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"P(A \\succ B)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>A</mi><mo>≻</mo><mi>B</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;probability A beats B&quot;</td>\n<td>Predicted chance a human labels A as the better response</td>\n</tr>\n<tr>\n<td><math data-tex=\"r(A)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>A</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, <math data-tex=\"r(B)\"><mrow><mi>r</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>B</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;the reward model's scores&quot;</td>\n<td>Scalar quality scores the reward model assigns to each response</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\sigma(\\cdot)\"><mrow><mi>σ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">⋅</mo><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;sigmoid&quot;</td>\n<td><math data-tex=\"\\sigma(x) = 1/(1+e^{-x})\"><mrow><mi>σ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn><mi>/</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mi>x</mi></mrow></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>; squashes any real number into a valid probability in <math data-tex=\"(0,1)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math></td>\n</tr>\n</tbody>\n</table></div>\n<p>where σ is the sigmoid function. The loss maximizes the likelihood of human preferences:</p>\n<div class=\"mblk\"><math data-tex=\"L = -\\mathbb{E}_{(A,B,y)}\\big[y \\log \\sigma(r(A)-r(B)) + (1-y) \\log \\sigma(r(B)-r(A))\\big]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>L</mi><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><msub><mi>𝔼</mi><mrow><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">(</mo><mi>A</mi><mo separator=\"true\">,</mo><mi>B</mi><mo separator=\"true\">,</mo><mi>y</mi><mo form=\"postfix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">)</mo></mrow></msub><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[</mo><mi>y</mi><mrow><mspace width=\"0.1667em\"></mspace><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>σ</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mo form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>y</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mrow><mspace width=\"0.1667em\"></mspace><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>σ</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>−</mo><mi>r</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo form=\"postfix\" stretchy=\"false\">)</mo><mo fence=\"false\" symmetric=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]</mo></mrow></math></div>\n<h3>9.5 PPO fine-tuning</h3>\n<p><strong>Words before symbols:</strong> the reward PPO actually optimizes is the learned reward-model score,\nminus a penalty that grows the further the current policy's outputs drift from the supervised\nfine-tuned model's.</p>\n<div class=\"mblk bound\"><math data-tex=\"R_{\\text{total}} = R_{\\text{model}}(\\text{response}) - \\beta \\cdot \\text{KL}(\\pi_\\theta \\| \\pi_{\\text{SFT}})\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>R</mi><mtext>total</mtext></msub><mo>=</mo><msub><mi>R</mi><mtext>model</mtext></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>response</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mi>β</mi><mo>⋅</mo><mtext>KL</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>π</mi><mi>θ</mi></msub><mi>‖</mi><msub><mi>π</mi><mtext>SFT</mtext></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"R_{\\text{total}}\"><msub><mi>R</mi><mtext>total</mtext></msub></math></td>\n<td>&quot;the reward PPO optimizes&quot;</td>\n<td>Learned reward minus the drift penalty — what <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§7.3\" role=\"link\" tabindex=\"0\">§7.3</a>'s PPO objective actually maximizes here</td>\n</tr>\n<tr>\n<td><math data-tex=\"R_{\\text{model}}(\\text{response})\"><mrow><msub><mi>R</mi><mtext>model</mtext></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>response</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;reward model score&quot;</td>\n<td>Output of the Bradley-Terry-trained reward model (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§9.4\" role=\"link\" tabindex=\"0\">§9.4</a>) on the generated response</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\beta\"><mi>β</mi></math></td>\n<td>&quot;KL coefficient&quot;</td>\n<td>Controls how strongly the policy is anchored to <math data-tex=\"\\pi_{\\text{SFT}}\"><msub><mi>π</mi><mtext>SFT</mtext></msub></math>; higher <math data-tex=\"\\beta\"><mi>β</mi></math> = more conservative</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\text{KL}(\\pi_\\theta\\|\\pi_{\\text{SFT}})\"><mrow><mtext>KL</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>π</mi><mi>θ</mi></msub><mi>‖</mi><msub><mi>π</mi><mtext>SFT</mtext></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;KL divergence&quot;</td>\n<td>How far the current policy's output distribution has drifted from the supervised fine-tuned model's</td>\n</tr>\n</tbody>\n</table></div>\n<p>The KL penalty prevents the model from diverging too far from the pre-trained behavior — acts\nas a &quot;rubber band&quot; connecting back to the supervised fine-tuning policy.</p>\n<h3>9.6 Beyond RLHF</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>What it changes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>DPO (Direct Preference Optimization)</strong></td>\n<td>Skips the reward model entirely; directly optimizes policy from preferences</td>\n</tr>\n<tr>\n<td><strong>RLAIF</strong></td>\n<td>Uses AI feedback instead of human feedback</td>\n</tr>\n<tr>\n<td><strong>Constitutional AI</strong></td>\n<td>Self-critique and revision against a set of principles</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p>👉 <em>See also:</em> <a class=\"xref\" data-xref-lec=\"genai-llm-02\" role=\"link\" tabindex=\"0\">GenAI &amp; LLM Part 2</a> covers this entire\npipeline in far more depth from the LLM-alignment side — the same Bradley-Terry reward model and\nKL-penalized PPO objective above, plus a full derivation of DPO's closed-form reward\nreparameterization and a worked GRPO example (the algorithm behind DeepSeek-R1).</p>\n</blockquote>\n<hr>\n</section><section id=\"reinforcement-learning-26-s12\" data-title=\"Challenges in RL\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">Challenges in RL</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Challenge</th>\n<th>Problem</th>\n<th>Mitigations</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Sample efficiency</strong></td>\n<td>Millions of interactions needed</td>\n<td>Model-based RL, offline RL, transfer learning</td>\n</tr>\n<tr>\n<td><strong>Reward shaping</strong></td>\n<td>Designing good reward functions is hard</td>\n<td>Inverse RL, RLHF, reward decomposition</td>\n</tr>\n<tr>\n<td><strong>Sparse rewards</strong></td>\n<td>Agent rarely gets feedback</td>\n<td>Curiosity-driven exploration, hindsight experience replay</td>\n</tr>\n<tr>\n<td><strong>Stability</strong></td>\n<td>Training oscillates or diverges</td>\n<td>Target networks, gradient clipping, PPO clipping</td>\n</tr>\n<tr>\n<td><strong>Exploration vs. exploitation</strong></td>\n<td>Balancing trying new things vs. using known strategies</td>\n<td>(Covered in <a class=\"xref\" data-xref-lec=\"reinforcement-learning-02\" data-xref=\"Part 2 §4\" role=\"link\" tabindex=\"0\">Part 2 §4</a>)</td>\n</tr>\n<tr>\n<td><strong>Credit assignment</strong></td>\n<td>Which action in a long sequence caused the reward?</td>\n<td>Temporal difference methods, attention mechanisms</td>\n</tr>\n<tr>\n<td><strong>Sim-to-real transfer</strong></td>\n<td>Policies trained in simulation fail in real world</td>\n<td>Domain randomization, system identification</td>\n</tr>\n<tr>\n<td><strong>Safety &amp; constraints</strong></td>\n<td>How to explore safely (self-driving car can't run a red light)</td>\n<td>Constrained MDPs, safe RL, conservative policy optimization</td>\n</tr>\n<tr>\n<td><strong>Reproducibility</strong></td>\n<td>High variance across random seeds, sensitive to hyperparameters</td>\n<td>Multiple seeds, hyperparameter sweeps, reporting variance</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p>👉 <em>See also:</em> <a class=\"xref\" data-xref-lec=\"causal-inference-03\" role=\"link\" tabindex=\"0\">Causal Inference Part 3, §12.3</a>\nframes credit assignment as a specifically <em>counterfactual</em> question — &quot;what would the reward\nhave been had a different action been taken at that step?&quot; — the same off-policy-evaluation\nmachinery from <a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s on/off-policy distinction, viewed from the causal-inference side.</p>\n</blockquote>\n<hr>\n</section><section id=\"reinforcement-learning-26-s13\" data-title=\"RL Frameworks &amp; Tools\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">RL Frameworks &amp; Tools</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Framework</th>\n<th>Best for</th>\n<th>Key feature</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Gymnasium</strong> (OpenAI Gym)</td>\n<td>Single-agent environments</td>\n<td>The standard API</td>\n</tr>\n<tr>\n<td><strong>PettingZoo</strong></td>\n<td>Multi-agent environments</td>\n<td>Clean interfaces for cooperative/competitive tasks</td>\n</tr>\n<tr>\n<td><strong>Stable-Baselines3</strong></td>\n<td>Quick prototyping (PyTorch)</td>\n<td>Production-ready, reliable implementations</td>\n</tr>\n<tr>\n<td><strong>RLlib (Ray)</strong></td>\n<td>Scalable distributed RL</td>\n<td>Multi-agent support, multi-GPU training</td>\n</tr>\n<tr>\n<td><strong>CleanRL</strong></td>\n<td>Education &amp; research</td>\n<td>Single-file implementations, great for learning</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Choosing the right tool:</strong></p>\n<ul>\n<li>Learning/research → CleanRL</li>\n<li>Production scale → RLlib</li>\n<li>LLM fine-tuning → TRL + transformers + PEFT</li>\n<li>Environments → Gymnasium (single-agent), PettingZoo (multi-agent), MuJoCo (continuous control)</li>\n</ul>\n<hr>\n</section><section id=\"reinforcement-learning-26-s14\" data-title=\"Hands-on Demo Summary\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">Hands-on Demo Summary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><strong>Environment:</strong> CartPole. <strong>Library:</strong> Stable-Baselines3.</p>\n<p>🧪 <strong>The actual head-to-head result</strong> [slide 73, &quot;Demo Code — Evaluation &amp; Visualization&quot;]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Algorithm</th>\n<th>Type</th>\n<th>Key hyperparameters</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>DQN</strong></td>\n<td>Off-policy, value-based</td>\n<td><code>learning_rate=1e-3</code>, <code>buffer_size=50000</code>, <code>exploration_fraction=0.2</code> (20% of training spent exploring)</td>\n<td><strong>~9.2 avg reward</strong> — failed to learn in 20k steps</td>\n</tr>\n<tr>\n<td><strong>PPO</strong></td>\n<td>On-policy, policy gradient (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§7.3\" role=\"link\" tabindex=\"0\">§7.3</a>)</td>\n<td><code>learning_rate=3e-4</code>, <code>gae_lambda=0.95</code>, <code>clip_range=0.2</code></td>\n<td><strong>500.0 avg reward</strong> — perfect score, after ~9k steps</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>A previous version of this table read &quot;−9.2 avg reward&quot; and &quot;~8k steps.&quot;</strong> The source slide\nreads <strong>&quot;~9.2 avg reward&quot;</strong> (an <em>approximately-equal</em> sign misread as a minus sign — CartPole's\nreward is +1 per step the pole stays up, so a negative average reward isn't possible in this\nenvironment at all, which is a strong sanity check that &quot;−9.2&quot; was wrong) and <strong>&quot;~9k steps&quot;</strong> for\nPPO's convergence point. The &quot;roughly 40%&quot; figure below is corrected to <strong>~45%</strong> accordingly\n(<math data-tex=\"9\\text{k}/20\\text{k}=0.45\"><mrow><mn>9</mn><mtext>k</mtext><mi>/</mi><mn>20</mn><mtext>k</mtext><mo>=</mo><mn>0.45</mn></mrow></math>).</p>\n</aside>\n<p>Slide 80's pole-angle-over-time chart shows DQN's line (dashed, &quot;DQN (9 steps)&quot;) rising <strong>smoothly\nand monotonically</strong> from near 0° past the ±12° failure threshold over its 9 recorded steps — a\npredictable, rapid climb straight to failure, not noise or instability. PPO's line (solid, &quot;PPO\n(500 steps)&quot;) stays flat and near zero for the full 500-step run. PPO reaches the environment's\nmaximum possible score in roughly <strong>45%</strong> of the training steps DQN was given, and DQN still hadn't\nlearned a working policy by the end.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Why this specific matchup, on this specific environment, favors PPO so sharply.</strong> CartPole's\naction space is technically discrete (<code>push_left</code>/<code>push_right</code>), so DQN <em>can</em> run on it — but this\nresult isn't really about discrete-vs-continuous (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>'s usual DQN-vs-policy-gradient framing). It's\nthat PPO's clipped, stable updates (<a class=\"xref\" data-xref-lec=\"reinforcement-learning-26\" data-xref=\"§7.3\" role=\"link\" tabindex=\"0\">§7.3</a>) converge reliably within a small hyperparameter budget,\nwhile this particular DQN configuration's exploration schedule (<code>exploration_fraction=0.2</code>) simply\ndidn't give it enough time to find the rewarding region of policy space in 20k steps. A longer DQN\nrun or different exploration schedule would likely do better — the takeaway is about training\nstability and sample efficiency in practice, not a fundamental limitation of value-based methods.</p>\n</aside>\n<p><strong>Code pattern:</strong></p>\n<pre class=\"code code-python\"><code class=\"language-python\">from stable_baselines3 import DQN, PPO\nmodel = PPO(&quot;MlpPolicy&quot;, &quot;CartPole-v1&quot;, verbose=1)\nmodel.learn(total_timesteps=100_000)</code></pre>\n<hr>\n</section><section id=\"reinforcement-learning-26-s15\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>THE COMPLETE RL JOURNEY (Parts 1–3)\n════════════════════════════════════\n\n   Part 1: Foundations\n   MDPs, Bellman equations, V(s), Q(s,a)\n   Policy iteration, value iteration\n        │\n        ▼\n   Part 2: Planning → Learning\n   Dynamic Programming (full model known)\n   → TD Learning (model-free)\n   → SARSA (on-policy) vs Q-learning (off-policy)\n   → DQN (neural nets + replay + target net)\n   → Superhuman Atari from pixels\n        │\n        │  Limitation: discrete actions only\n        ▼\n   Part 3: Beyond DQN\n   Policy Gradients (REINFORCE) → handles continuous actions\n   Baselines → reduce variance\n   Actor-Critic (A2C, A3C, GAE) → every-step updates, bias-variance dial\n   Multi-Agent RL → cooperative, competitive, self-play\n   RLHF → align LLMs with human preferences\n   Challenges → sample efficiency, reward design, stability, safety\n   Frameworks → Gymnasium, Stable-Baselines3, RLlib, CleanRL</pre></figure>\n<p><strong>Five key takeaways:</strong></p>\n<ol>\n<li>Policy gradients unlock what value-based methods cannot — continuous actions and stochastic\npolicies.</li>\n<li>Actor-critic is the backbone of modern RL — combines policy flexibility with value stability.</li>\n<li>Multi-agent RL extends RL to real-world complexity — cooperative (CTDE), competitive, self-play.</li>\n<li>RLHF is how modern LLMs are aligned — learn reward from human preferences, optimize with PPO.</li>\n<li>RL has significant practical challenges — but frameworks and tools make them tractable.</li>\n</ol>\n<hr>\n</section><section id=\"reinforcement-learning-26-s16\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">12 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"reinforcement-learning-26-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why can't DQN handle continuous actions, and how do policy gradients solve this?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>DQN selects actions by taking argmax over Q-values: π(s) = argmax_a Q(s,a). With discrete\nactions, this is just a lookup. With continuous actions (e.g., robot joint torque), argmax\nbecomes an intractable optimization problem — you'd need to search over an infinite set.\nPolicy gradients sidestep this entirely: the policy π(a|s; θ) directly outputs action\ndistribution parameters (e.g., mean and variance of a Gaussian), and the gradient ∇_θ J(θ)\ntells us how to adjust θ to increase expected reward — no argmax needed.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive the policy gradient theorem. Why is the log-likelihood trick key?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>J(θ) = E_τ[P(τ|θ) · R(τ)]. Taking gradient: ∇_θ J(θ) = E[∇_θ P(τ|θ)/P(τ|θ) · P(τ|θ) · R(τ)]\n= E[∇_θ log P(τ|θ) · R(τ)]. The log-likelihood trick ∇_θ P = P · ∇_θ log P converts the\ngradient of a probability into a form where we can take the expectation — the key step that\nlets us avoid differentiating through the environment dynamics. Expanding log P(τ|θ) shows\nonly the policy terms π_θ(a_t|s_t) depend on θ; the dynamics P(s'|s,a) vanish.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is REINFORCE's main weakness and how does the actor-critic architecture fix it?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>REINFORCE's main weakness is high variance — it uses full Monte Carlo returns G_t from single\nepisodes, which are extremely noisy. This makes learning unstable and slow. Actor-critic fixes\nthis by replacing G_t with a critic's bootstrapped estimate. The critic V(s) provides a\nlow-variance baseline for every step, enabling: (1) every-step updates (no waiting for episode\nend), (2) lower variance through bootstrapping, and (3) higher sample efficiency. The tradeoff:\nintroducing some bias from the critic's imperfect estimates.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the advantage function and why A2C uses it instead of raw Q-values.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The advantage A(s,a) = Q(s,a) − V(s) measures &quot;how much better was action a compared to the\naverage action in state s.&quot; Using advantage instead of raw Q-values centers the learning signal:\nactions that are merely average get zero gradient. A2C approximates this as A ≈ R + γV(s') − V(s)\n(the TD error), which avoids needing two separate networks. The advantage function stabilizes\nlearning by reducing the variance of gradient estimates — the critic's V(s) acts as a learned\nbaseline.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">How does GAE bridge the bias-variance tradeoff, and what λ value is typical?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>GAE defines Â_t = Σ_{l=0}^∞ (γλ)^l δ_{t+l}, where δ_t is the TD error. λ controls the\ntradeoff: λ=0 gives 1-step TD (low variance, high bias — same as A2C); λ=1 gives full Monte\nCarlo (zero bias, high variance — same as REINFORCE). Typical value: λ = 0.95, which gets most\nof Monte Carlo's low bias while retaining most of TD's low variance. The exponential weighting\n(γλ)^l means distant TD errors contribute less, naturally truncating the variance explosion.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is CTDE and why is it the standard paradigm for cooperative multi-agent RL?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>CTDE = Centralized Training, Decentralized Execution. During training, agents have access to\neverything (all observations, all actions, global state) — making credit assignment much easier.\nDuring execution, each agent acts independently using only its own local observations. This\nbreaks the non-stationarity problem (other agents' policies are fixed during training) while\nstill producing decentralized policies that can be deployed. QMIX and MAPPO are standard CTDE\nalgorithms.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Describe self-play's \"auto-curriculum\" and why it leads to superhuman performance.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>In self-play, the agent plays against copies of its current policy. As the agent improves, its\nopponent automatically improves too — the difficulty scales perfectly with the agent's skill\nlevel. This creates a virtuous cycle: self-play → policy improvement → harder opponent → more\nimprovement → superhuman. AlphaGo Zero used this to achieve 100-0 against AlphaGo after 3 days\nof self-play with zero human data. The key insight: the agent generates its own training data,\nand the opponent is always at exactly the right difficulty level — never too easy (no learning)\nor too hard (no signal).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the RLHF pipeline and why the KL penalty is necessary.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>RLHF has 5 stages: pretrain → SFT → collect human preferences → train reward model (Bradley-Terry)\n→ PPO fine-tune. The KL penalty β · KL(π_θ ‖ π_SFT) prevents the policy from diverging too far\nfrom the supervised fine-tuned model. Without it, the agent might find reward model exploits —\noutputs that score high on the learned reward but are nonsensical to humans. The KL penalty acts\nas a &quot;rubber band&quot; keeping the model anchored to reasonable outputs. β controls the strength:\nhigher β = more conservative (closer to SFT), lower β = more aggressive optimization.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Name three alternatives to RLHF and explain what each changes.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>(1) DPO (Direct Preference Optimization): skips the reward model entirely — directly optimizes\nthe policy from preference pairs, reducing the pipeline from 5 stages to 3. (2) RLAIF: uses AI\nfeedback instead of human feedback — reduces annotation cost by having a strong AI model generate\npreferences instead of humans. (3) Constitutional AI: the model self-critiques and revises its\noutputs against a set of written principles — reduces the need for human labelers while\nmaintaining alignment with explicit values.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A self-driving car needs to learn a policy. Which RL approach would you use and why? What challenges are most critical?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>I'd use PPO (actor-critic with clipped objective) because: (1) the action space is continuous\n(steering angle, acceleration), ruling out DQN. (2) PPO is stable — critical for safety. (3)\nThe advantage function with GAE provides good bias-variance balance. Most critical challenges:\nsafety (can't explore by running red lights → constrained MDPs), sim-to-real transfer (train in\nsimulation, deploy on real roads → domain randomization), sparse rewards (most driving is\nuneventful → reward shaping), and credit assignment (which action in a 30-minute drive caused\nthe accident?). RLHF could be used for human preference alignment — &quot;which driving style do\nhumans find safer/more comfortable?&quot;</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li>\n<p><em>&quot;Why does the log-likelihood trick work? What mathematical property makes ∇_θ P = P · ∇_θ log P\ntrue?&quot;</em> — This follows from the chain rule: d/dx log f(x) = f'(x)/f(x), so f'(x) = f(x) ·\nd/dx log f(x). Applying this to P(τ|θ): ∇_θ P(τ|θ) = P(τ|θ) · ∇_θ log P(τ|θ). The trick\nconverts the gradient of a probability (which is hard to estimate) into a product of the\nprobability times the gradient of its log (which is easy — just the score function).</p>\n</li>\n<li>\n<p><em>&quot;Why can't on-policy methods like REINFORCE use experience replay?&quot;</em> — REINFORCE computes\nG_t by running the current policy π_θ to completion. Old experiences were generated by a\ndifferent policy π_{θ_old}, so their returns G_t are computed under the wrong policy — using\nthem would bias the gradient estimate. Q-learning is off-policy because its target\nmax_a' Q(s',a') doesn't depend on what action was actually taken, making old data always valid.\nREINFORCE's G_t depends on the full trajectory under the
