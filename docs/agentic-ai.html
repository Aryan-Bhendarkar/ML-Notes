/* ═══════════════════════════════════════════════════════════════════════
   STUDY LAMP — one mode, warm and dim.  Warm charcoal ground (never blue-
   black), warm paper-grey text at ~12:1, a single soft-amber accent for
   structure only: section numbers, your position, boxed results, progress.
   Links are a separate desaturated slate-blue so a link never looks like a
   heading.  The six callout hues keep one fixed meaning across every module.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#1B1A17; --surface:#242119; --surface-2:#16140F; --raised:#2C2820;
  --rule:#37332B; --rule-2:#4C4739;
  --ink:#EDE6D7; --ink-2:#B4AA95; --ink-3:#7C7361;
  --accent:#8CDCA6; --accent-dim:#4FA073; --accent-wash:#1E3025;
  --link:#93BFCE;
  --c-bg:#93B0D6; --c-key:#E6BA55; --c-warn:#E89170;
  --c-lab:#79C7A2; --c-int:#C0A6E4; --c-res:#A6CE8E; --c-recon:#D6A06E;
  --hl-1:#F0D488; --hl-2:#83D0C8; --hl-3:#F0A892; --hl-4:#C4AEF0;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 44px -20px rgba(0,0,0,.75);
  --wash:.14;
  --font-body:Charter,"Sitka Text","Iowan Old Style","Palatino Linotype",Cambria,Georgia,serif;
  --font-ui:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --font-mono:"Cascadia Code","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --measure:64ch;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:19px;line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-wash);color:#fff}
a{color:var(--link);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:#A9C6D2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px}
.skip:focus{left:12px;top:9px;z-index:100;background:var(--surface);padding:10px 14px;border:1px solid var(--accent);border-radius:8px}
button{font-family:var(--font-ui);color:inherit}

/* ── header — as little as possible ─────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.top-in{max-width:1680px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;gap:16px}
.home-l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.home-l:hover{color:var(--ink)}
.home-l b{color:var(--ink);font-weight:600}
.mprog{flex:1;max-width:340px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mprog-track{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.mprog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.ic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--rule-2);border-radius:8px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;padding:0}
.ic:hover{color:var(--ink);border-color:var(--accent)}
.readbar{height:2px;background:var(--accent);width:0}
.views{max-width:1680px;margin:0 auto;padding:1px 22px 0;display:flex;gap:1px;font-family:var(--font-ui)}
.view-t{font:inherit;font-size:11.5px;padding:7px 12px;border:0;border-bottom:2px solid transparent;background:none;
  color:var(--ink-3);cursor:pointer}
.view-t:hover{color:var(--ink-2)}
.view-t[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1680px;margin:0 auto;padding:0 22px;display:grid;
  grid-template-columns:274px minmax(0,1fr) 264px;gap:40px;align-items:start}
@media(max-width:1360px){.shell{grid-template-columns:250px minmax(0,1fr)}.rail-r{position:fixed;right:0;top:52px;bottom:0;
  width:300px;background:var(--surface);border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s;z-index:30;padding:20px}
  .rail-r.open{transform:none;box-shadow:var(--shadow)}}
@media(max-width:1040px){.shell{grid-template-columns:minmax(0,1fr);padding:0 16px}.rail-l{display:none}}
.rail{position:sticky;top:52px;max-height:calc(100vh - 58px);overflow-y:auto;padding:22px 4px 90px;
  font-family:var(--font-ui);font-size:12.5px;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
.rl-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:22px 0 8px;padding-left:10px}
.rl-h:first-child{margin-top:0}

/* ── the course spine (left rail) ──────────────────────────────────── */
.spine-mod{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--ink);padding:2px 10px 8px}
.lec{margin-bottom:1px}
.lec-b{width:100%;text-align:left;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid transparent;
  background:none;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:9px;line-height:1.3}
.lec-b:hover{background:var(--raised);color:var(--ink)}
.lec-b.on{background:var(--raised);color:var(--ink);border-color:var(--rule-2)}
.lec-n{font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;flex:none;
  width:17px;height:17px;border:1px solid var(--accent-dim);border-radius:4px;display:grid;place-items:center}
.lec-b.on .lec-n{background:var(--accent);color:#231a0b;border-color:var(--accent)}
.lec-lab{flex:1;font-weight:600}
.lec-bar{width:34px;height:3px;border-radius:2px;background:var(--rule);flex:none;overflow:hidden}
.lec-bar i{display:block;height:100%;background:var(--c-lab)}
.secs{list-style:none;margin:2px 0 8px;padding:0 0 0 12px;margin-left:14px;border-left:1px solid var(--rule);display:none}
.secs.open{display:block}
.secs a{display:flex;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:12px;line-height:1.4}
.secs a:hover{background:var(--raised);color:var(--ink)}
.secs a.cur{color:var(--accent);font-weight:650}
.secs a.done{color:var(--ink-3)}
.spine-part{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;
  padding:9px 8px 3px;margin-top:2px}
.spine-part:first-child{margin-top:0}
.secs a[data-kind="recap"]{color:var(--ink-3);font-style:italic;font-size:11px}
.secs a[data-kind="back"]{color:var(--ink-3)}
.secs a[data-kind="divider"]{color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;margin-top:6px;pointer-events:auto}
.secs a[data-kind="divider"] .n{display:none}
.secs a .n{flex:none;width:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.secs a.done .n::after{content:"✓";color:var(--c-lab)}
.secs a.cur .n{color:var(--accent)}
.othermod a{display:flex;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink-3);font-size:12px}
.othermod a:hover{background:var(--raised);color:var(--ink)}
.othermod .m-n{flex:none;font-variant-numeric:tabular-nums}
.othermod .m-p{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* ── right rail: your work only ────────────────────────────────────── */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-b{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;font:inherit;font-family:var(--font-ui);
  font-size:12px;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.phase-b:hover{border-color:var(--accent);color:var(--ink)}
.phase-b .box{width:15px;height:15px;border:1.5px solid var(--rule-2);border-radius:5px;flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:9px;color:transparent}
.phase-b.done{color:var(--ink)}
.phase-b.done .box{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.phase-b.done .box::after{content:"✓";font-weight:800}
.phase-b b{font-weight:650;display:block}
.phase-b small{color:var(--ink-3);font-weight:400}
.phase-b .go{margin-left:auto;color:var(--accent);flex:none;font-size:13px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{margin-bottom:4px}
.rlist button{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);font-size:11.5px;line-height:1.45;
  padding:6px 9px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;
  border-left:3px solid var(--h,var(--rule-2))}
.rlist button:hover{color:var(--ink);border-color:var(--accent)}
.rlist li[data-c="1"] button{--h:var(--hl-1)} .rlist li[data-c="2"] button{--h:var(--hl-2)}
.rlist li[data-c="3"] button{--h:var(--hl-3)} .rlist li[data-c="4"] button{--h:var(--hl-4)}
.empty{font-size:11.5px;color:var(--ink-3);font-style:italic;padding:0 10px;line-height:1.5}
.rr-close{display:none}
@media(max-width:1360px){.rr-close{display:block;position:absolute;top:12px;right:14px;background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}}

/* ── reading column ───────────────────────────────────────────────── */
main{padding:38px 0 200px;min-width:0;position:relative}
.doc{max-width:var(--measure)}
.lecture-head{margin:0 0 8px}
.lecture-head .kicker{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);
  text-transform:uppercase;margin-bottom:8px}
.lecture-head h1{font-family:var(--font-body);font-size:34px;font-weight:700;line-height:1.16;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lecture-head .meta{font-family:var(--font-ui);font-size:13px;color:var(--ink-3);margin-top:10px}
.frontmatter{margin:22px 0 8px;padding-bottom:4px}
.part-head{margin:3.4em 0 0}
.part-head h1{font-family:var(--font-body);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);margin:0 0 .2em;padding-bottom:.5em;border-bottom:2px solid var(--accent-dim)}
.part-head + section h2,.part-head h1 + section h2{border-top:0;padding-top:.3em;margin-top:.8em}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}

h2{font-family:var(--font-body);font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.008em;
  margin:2.9em 0 .55em;padding-top:1.15em;border-top:1px solid var(--rule);position:relative;
  display:flex;align-items:baseline;gap:12px;text-wrap:balance;scroll-margin-top:66px}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}
section[data-kind="recap"] h2{font-style:italic;color:var(--ink-2);font-size:22px}
section[data-kind="back"] h2{font-family:var(--font-ui);font-size:23px;font-weight:680}
section[data-kind="divider"]{margin:2.6em 0 0}
section[data-kind="divider"] h2{border-top:0;padding:0 0 .5em;margin:0;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:2px solid var(--accent-dim)}
section[data-kind="divider"] .sec-n,section[data-kind="divider"] .sec-meta{display:none}
.sec-n{position:absolute;left:-56px;top:calc(1.15em + .15em);font-family:var(--font-ui);font-size:12px;font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;width:44px;padding-top:.3em}
@media(max-width:1200px){.sec-n{position:static;border-left:2px solid var(--accent);padding:0 0 0 8px;width:auto;text-align:left;align-self:stretch;display:flex;align-items:center}}
.sec-t{flex:1;min-width:0}
.sec-meta{flex:none;display:flex;align-items:center;gap:9px;align-self:center}
.sec-time{font-family:var(--font-ui);font-size:11px;color:var(--ink-3);font-weight:500}
.sec-check{width:21px;height:21px;border:1.5px solid var(--rule-2);border-radius:6px;background:var(--surface);cursor:pointer;
  display:grid;place-items:center;font-size:11px;color:transparent;padding:0;transition:.12s;flex:none}
.sec-check:hover{border-color:var(--c-lab)}
.sec-check.on{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.sec-check.on::after{content:"✓";font-weight:800}
h3{font-family:var(--font-ui);font-size:18px;font-weight:660;margin:1.9em 0 .45em;line-height:1.3}
h4{font-family:var(--font-ui);font-size:15.5px;font-weight:660;color:var(--ink-2);margin:1.5em 0 .35em}
.doc p{margin:0 0 1.1em}
strong{font-weight:700;color:#F1EADD}
em{font-style:italic}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
sup,sub{line-height:0}

.doc ul,.doc ol{margin:0 0 1.15em;padding-left:1.4em}
.doc li{margin:.35em 0}
.doc li::marker{color:var(--ink-3)}
.doc ul{list-style:none;padding-left:1.2em}
.doc ul>li{position:relative}
.doc ul>li::before{content:"";position:absolute;left:-.95em;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent-dim)}
.doc dt{font-weight:700;font-family:var(--font-ui);font-size:15px;margin-top:.7em}
.doc dd{margin:.15em 0 1em}

code{font-family:var(--font-mono);font-size:.8em;background:var(--surface-2);padding:.12em .38em;border-radius:4px;border:1px solid var(--rule)}
.code{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:15px 17px;overflow-x:auto;margin:0 0 1.3em;line-height:1.6}
.code code{background:none;border:0;padding:0;font-size:13.5px}
figure.ascii{margin:0 0 1.4em;background:var(--surface-2);border:1px solid var(--rule);border-left:2px solid var(--accent-dim);
  border-radius:8px;padding:16px 18px;overflow-x:auto}
figure.ascii pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre;color:var(--ink-2)}

/* mermaid diagrams, pre-rendered to SVG at build time */
figure.diagram{margin:0 0 1.5em;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;
  padding:20px 18px;overflow-x:auto;text-align:center}
figure.diagram svg{max-width:100%;height:auto}
figure.diagram .edgeLabel,figure.diagram .edgeLabel p{background:var(--surface-2)!important;color:var(--ink-2)!important}
figure.diagram .cluster rect{rx:8;ry:8}
figure.diagram figcaption{margin-top:12px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-3);text-align:center}
figure.diagram-raw pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre;color:var(--ink-3);text-align:left}

.table-wrap{overflow-x:auto;margin:0 0 1.4em}
.table-wrap.bound{margin-top:-.5em}
table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;font-size:12px;color:var(--ink-3);border-bottom-color:var(--rule-2)}
tbody tr:last-child td{border-bottom:0}
.symtab{border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.symtab td:first-child{font-family:var(--font-mono);white-space:nowrap;color:var(--ink)}

.mblk{display:block;overflow-x:auto;overflow-y:hidden;margin:1.5em 0;padding:6px 2px;text-align:center}
.mblk.bound{margin-bottom:.3em}
math{font-size:1.05em}
.mblk math{font-size:1.15em}
.mblk[data-boxed] .tml-fbox,.mblk[data-boxed] menclose{background:var(--accent-wash);border-color:var(--accent)!important}
.mfail{color:var(--c-warn);font-family:var(--font-mono);font-size:.85em}

/* callouts — left rule + faint wash, no box */
.callout{margin:0 0 1.4em;padding:4px 0 4px 16px;border-left:2px solid var(--k);--k:var(--ink-3)}
.callout>*:last-child{margin-bottom:0}
.callout-h{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--k);margin:0 0 5px;display:flex;align-items:center;gap:7px}
.callout-badge{font-size:12px}
.callout-bg{--k:var(--c-bg)} .callout-key{--k:var(--c-key)} .callout-warn{--k:var(--c-warn)}
.callout-lab{--k:var(--c-lab)} .callout-int{--k:var(--c-int)} .callout-res{--k:var(--c-res)} .callout-recon{--k:var(--c-recon)}
.callout-warn{border-left-width:3px;background:color-mix(in srgb,var(--c-warn) 7%,transparent);padding:8px 0 8px 16px}
.aside-quote{margin:0 0 1.3em;padding-left:15px;border-left:2px solid var(--rule-2);color:var(--ink-2);font-style:italic}
blockquote{margin:.7em 0 0;padding-left:13px;border-left:2px solid var(--rule-2);color:var(--ink-2)}

/* recall cards — flat */
.recall{border-bottom:1px solid var(--rule);margin:0 0 6px;padding-bottom:6px}
.recall-q{width:100%;text-align:left;font:inherit;font-family:var(--font-body);font-size:16.5px;padding:11px 4px;
  background:none;border:0;color:var(--ink);cursor:pointer;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.recall-q:hover{color:#fff}
.recall-n{font-family:var(--font-ui);font-size:10.5px;font-weight:750;color:var(--accent);flex:none;margin-top:4px;font-variant-numeric:tabular-nums;min-width:16px}
.recall-t{flex:1;min-width:0}
.recall-x{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);flex:none;margin-top:5px;font-weight:600}
.recall-a{padding:2px 4px 10px 31px;font-size:16.5px}
.recall-a>*:first-child{margin-top:10px}
.recall[data-open] .recall-x{color:var(--accent)}
.rate{display:flex;gap:7px;margin-top:14px;padding-top:11px;border-top:1px dashed var(--rule)}
.rate-b{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:14px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.rate-b:hover{border-color:var(--k,var(--accent));color:var(--k,var(--accent))}
.rate-b.on{background:var(--k);border-color:var(--k);color:#161310}
.rate-b[data-r="1"]{--k:var(--c-lab)} .rate-b[data-r="2"]{--k:var(--c-key)} .rate-b[data-r="3"]{--k:var(--c-warn)}
.recall[data-rated] .recall-n::after{font-size:9px;margin-left:2px}
.recall[data-rated="1"] .recall-n::after{content:"●";color:var(--c-lab)}
.recall[data-rated="2"] .recall-n::after{content:"●";color:var(--c-key)}
.recall[data-rated="3"] .recall-n::after{content:"●";color:var(--c-warn)}

.tryfirst{font-family:var(--font-ui);font-size:10.5px;font-weight:650;padding:3px 10px;border-radius:12px;
  border:1px solid var(--c-lab);color:var(--c-lab);background:none;cursor:pointer;margin-left:auto}
.tryfirst:hover{background:var(--c-lab);color:#12241a}
.masked{filter:blur(5px);opacity:.32;user-select:none;pointer-events:none}

/* interactive */
.iv{border:1px solid var(--rule-2);border-radius:10px;margin:0 0 1.6em;background:var(--surface);overflow:hidden}
.iv-cap{display:flex;align-items:baseline;gap:10px;padding:10px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.iv-kind{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:var(--ink-3);flex:none}
.iv-title{font-size:13.5px;font-weight:650;color:var(--ink)}
.iv-live{margin-left:auto;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--c-lab)}
.iv-mount{padding:16px}
.iv-fallback{padding:13px 15px 15px;font-family:var(--font-ui);font-size:13.5px}
.iv-meta{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.iv-row{display:contents}
.iv-meta dt{color:var(--ink-3);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.iv-meta dd{margin:0;color:var(--ink-2)}
.iv-fb-prose{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
.iv.is-live .iv-fallback{border-top:1px dashed var(--rule)}
.iv.is-live .iv-fb-prose,.iv.is-live .iv-meta{display:none}
.iv-ctl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:12px;font-family:var(--font-ui);font-size:12px}
.iv-ctl label{display:flex;flex-direction:column;gap:3px;color:var(--ink-2);font-weight:600}
.iv-ctl input[type=range]{width:170px;accent-color:var(--accent)}
.iv-ctl .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.iv svg{max-width:100%;height:auto;display:block}
.iv .plot-bg{fill:var(--surface-2)}
.iv .plot-axis{stroke:var(--rule-2);stroke-width:1}
.iv .plot-grid{stroke:var(--rule);stroke-width:1}
.iv .plot-label{fill:var(--ink-3);font-family:var(--font-ui);font-size:10px}
.iv .readout{font-family:var(--font-ui);font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.iv .readout b{color:var(--ink);font-variant-numeric:tabular-nums}

/* highlights */
.hl{border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  background:color-mix(in srgb,var(--h) 30%,transparent);
  box-shadow:inset 0 -.42em 0 color-mix(in srgb,var(--h) 16%,transparent)}
.hl[data-c="1"]{--h:var(--hl-1)} .hl[data-c="2"]{--h:var(--hl-2)} .hl[data-c="3"]{--h:var(--hl-3)} .hl[data-c="4"]{--h:var(--hl-4)}
#hlbar{position:fixed;z-index:60;display:none;gap:4px;background:var(--surface);border:1px solid var(--rule-2);border-radius:9px;padding:5px;box-shadow:var(--shadow)}
#hlbar.on{display:flex}
.sw{width:25px;height:25px;border-radius:6px;border:1px solid var(--rule-2);cursor:pointer;padding:0;font-family:var(--font-ui);
  font-size:10px;font-weight:700;color:#161310;display:grid;place-items:center}
.sw[data-c="1"]{background:var(--hl-1)} .sw[data-c="2"]{background:var(--hl-2)}
.sw[data-c="3"]{background:var(--hl-3)} .sw[data-c="4"]{background:var(--hl-4)} .sw[data-c="0"]{background:var(--surface-2);color:var(--ink-2)}

/* focus mode */
body.focus .rail,body.focus .views,body.focus .top-r{opacity:.08;pointer-events:none}
body.focus .doc{--measure:58ch}
body.focus section:not(.live){opacity:.25}
section{transition:opacity .25s}

/* module + phase views */
.view{display:none}
.view.on{display:block;max-width:70ch}
.view h1{font-family:var(--font-body);font-size:30px;font-weight:700;margin:0 0 6px}
.view-lead{font-family:var(--font-ui);font-size:14px;color:var(--ink-2);max-width:58ch;margin:0 0 26px}
.qcard{border:1px solid var(--rule);border-radius:9px;padding:13px 16px;margin-bottom:10px;background:var(--surface)}
.qcard.r3{border-left:3px solid var(--c-warn)} .qcard.r2{border-left:3px solid var(--c-key)}
.qcard .from{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.qcard .due{font-family:var(--font-ui);font-size:9.5px;color:var(--c-key);font-weight:700;text-transform:uppercase;letter-spacing:.05em;float:right}
.pill{font-family:var(--font-ui);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:10px;border:1px solid var(--k);color:var(--k);--k:var(--ink-3);white-space:nowrap}
.pill.intro{--k:var(--c-lab)} .pill.solid{--k:var(--c-key)} .pill.hard{--k:var(--c-warn)}
#gf{width:100%;font:inherit;font-family:var(--font-ui);font-size:15px;padding:10px 14px;border:1px solid var(--rule-2);
  border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:16px}
.phase-view-h{font-family:var(--font-ui);font-size:12px;color:var(--ink-3);margin:0 0 20px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
.phase-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.phase-nav button{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;
  border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.phase-nav button:hover{border-color:var(--accent);color:var(--ink)}
.phase-nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#231a0b}
.phase-nav .phase-mark{margin-left:auto;border-color:var(--c-lab);color:var(--c-lab)}

/* search */
#sd{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(4px);display:none;padding-top:11vh}
#sd.on{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--rule-2);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
#sq{width:100%;font:inherit;font-family:var(--font-ui);font-size:17px;padding:16px 20px;border:0;background:none;color:var(--ink);border-bottom:1px solid var(--rule)}
#sq:focus{outline:none}
#sr{max-height:58vh;overflow-y:auto;padding:7px}
.sri{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);padding:9px 13px;border:0;background:none;border-radius:8px;cursor:pointer;display:block;color:var(--ink)}
.sri:hover,.sri.sel{background:var(--accent-wash)}
.sri b{font-size:13.5px;font-weight:640;display:block}
.sri span{font-size:11px;color:var(--ink-3)}
.sri mark{background:color-mix(in srgb,var(--hl-1) 45%,transparent);color:inherit;border-radius:2px}
.sri .scope{font-size:9.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

dialog{border:1px solid var(--rule-2);border-radius:13px;background:var(--surface);color:var(--ink);padding:24px 28px;max-width:460px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.sh{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-family:var(--font-ui);font-size:13px;align-items:center}
.note{border-left:3px solid var(--c-key);background:color-mix(in srgb,var(--c-key) 8%,transparent);padding:9px 13px;border-radius:0 6px 6px 0;margin:.5em 0 1.1em;font-size:14px;font-family:var(--font-ui)}
.note-x{float:right;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 0 0 8px}
.addn{opacity:0;position:absolute;left:-26px;top:2px;width:19px;height:19px;border-radius:6px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:12px;line-height:1;padding:0;transition:opacity .12s}
.doc p{position:relative}
.doc p:hover .addn{opacity:1}
@media(max-width:1200px){.addn{display:none}}

/* ── review session ────────────────────────────────────────────────── */
.b-review{position:relative}
.b-review .due-dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--c-key);color:#1b1408;font-size:9px;font-weight:800;display:grid;place-items:center;font-family:var(--font-ui)}
#rev{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center}
#rev.on{display:flex}
.rev-top{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;padding:18px 22px;font-family:var(--font-ui);font-size:12px;color:var(--ink-3)}
.rev-prog{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.rev-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.rev-x{background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}
.rev-card{flex:1;width:100%;max-width:680px;padding:0 22px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.rev-kind{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.rev-kind span{color:var(--ink-3);font-weight:600;margin-left:8px}
.rev-front{font-size:22px;line-height:1.5;color:var(--ink)}
.rev-back{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule);font-size:17px;line-height:1.7;color:var(--ink-2)}
.rev-back.hidden{display:none}
.rev-back math{color:var(--ink)}
.rev-actions{width:100%;max-width:680px;padding:20px 22px 40px;display:flex;gap:10px;font-family:var(--font-ui)}
.rev-reveal{flex:1;padding:14px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.rev-reveal:hover{border-color:var(--accent)}
.rev-grade{flex:1;padding:14px 10px;border-radius:10px;border:1px solid var(--k);background:none;color:var(--k);
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.rev-grade:hover{background:var(--k);color:#161310}
.rev-grade small{font-size:10px;opacity:.7;font-weight:500}
.rev-grade[data-g="0"]{--k:var(--c-warn)} .rev-grade[data-g="1"]{--k:var(--c-key)} .rev-grade[data-g="2"]{--k:var(--c-lab)}
.rev-done{text-align:center;font-family:var(--font-ui);max-width:420px;padding:40px 22px}
.rev-done h2{font-family:var(--font-body);font-size:26px;margin:0 0 10px;color:var(--ink)}
.rev-done p{font-size:14px;color:var(--ink-2);line-height:1.7}
.rev-done .big{font-size:44px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>

<header class="top">
  <div class="top-in">
    <a class="home-l" href="./index.html">‹ <b>Agentic AI</b></a>

    <div class="top-r">
      <button class="ic b-review" id="b-review" title="Review due cards (R)" aria-label="Review">↻<span class="due-dot" id="dueDot" hidden></span></button>
      <button class="ic" id="b-search" title="Search (Ctrl+K)" aria-label="Search">⌕</button>
      <button class="ic" id="b-focus" title="Focus mode (F)" aria-label="Focus mode">◑</button>
      <button class="ic" id="b-work" title="Your highlights & notes" aria-label="Your work">✎</button>
      <button class="ic" id="b-help" title="Shortcuts &amp; data (?)" aria-label="Shortcuts and data">?</button>
    </div>
  </div>
  <div class="views" id="views" role="tablist"></div>

<div class="shell">

</div>

<div id="rev" role="dialog" aria-label="Review session" aria-modal="true">

    <button class="rev-x" id="revX" aria-label="End session">✕</button>
    <span id="revCount">0 / 0</span>
    <div class="rev-prog"><i id="revProg"></i></div>
    <span id="revNew"></span>
  </div>
  <div class="rev-card" id="revCard"></div>
  <div class="rev-actions" id="revActions"></div>
</div>

<div id="hlbar" role="toolbar" aria-label="Highlight colour">
  <button class="sw" data-c="1" title="Remember this (1)"></button>
  <button class="sw" data-c="2" title="I understand this (2)"></button>
  <button class="sw" data-c="3" title="Weak spot — come back (3)"></button>
  <button class="sw" data-c="4" title="Interview material (4)"></button>
  <button class="sw" data-c="0" title="Remove">✕</button>
</div>

<div id="sd" role="dialog" aria-label="Search this module">

</div>

<dialog id="hd">
  <h3 style="margin:0 0 14px;font-family:var(--font-ui);font-size:16px">Keyboard</h3>
  <div class="sh">
    <span class="kbd">J</span><span>Next section</span>
    <span class="kbd">K</span><span>Previous section</span>

    <span class="kbd">0</span><span>Remove highlight</span>
    <span class="kbd">?</span><span>This panel</span>
  </div>
  <p style="margin:16px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--font-ui)">
    Highlights, notes, ratings and progress live in this browser only.</p>
  <div style="margin-top:15px;display:flex;gap:8px">
    <button class="rate-b" id="b-exp">Export data</button>
    <button class="rate-b" id="b-imp">Import</button>
    <button class="rate-b" style="margin-left:auto" onclick="hd.close()">Close</button>
  </div>

Unicode range 1D49C to 1D4B5.

math {
  font-family: "Cambria Math", 'STIXTwoMath-Regular', 'NotoSansMath-Regular', math;
  font-style: normal;
  font-weight: normal;
  line-height: normal;
  font-size-adjust: none;
  text-indent: 0;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  direction: ltr;
  /* Prevent Firefox from omitting the dot on i or j. */
  font-feature-settings: "dtls" off;
}

math * {
  border-color: currentColor;
}

/* display: block is necessary in Firefox and Safari.
 * Not in Chromium, which recognizes display: "block math" written inline. */
 math.tml-display {
  display: block;
  width: 100%;
}

*.mathcal {
  /* NotoSans */
  font-feature-settings: 'ss01';
}

math .mathscr {
  font-family: "Temml";
}

mo.tml-prime {
  font-family: Temml;
}

/* Cramped superscripts in WebKit */
mfrac > :nth-child(2),
msqrt,
mover > :first-child {
  math-shift: compact
}

.menclose {
  display: inline-block;
  position: relative;
  padding: 0.5ex 0ex;
}
.tml-cancelto {
  display: inline-block;
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.5ex 0ex;
  background-color: currentColor;
  /* Use the SVG as an alpha mask (painted by background-color) */
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-position: 0 0;
          mask-position: 0 0;
}

@supports (-moz-appearance: none) {
  /* \vec w/o italic correction for Firefox */
  .tml-vec {
    transform: scale(0.75)
  }
  /* Fix \cancelto in Firefox */
  .ff-narrow {
    width: 0em;
  }
  .ff-nudge-left {
    margin-left: -0.2em;
  }
  /* Squash hidden mrows in \bordermatrix. Messes with centering, but necessary to squash. */
  .ff-squash mtd {
    display: block;
    height: 0;
  }
}

@supports (not (-moz-appearance: none)) {
  /* Chromium and WebKit */
  /* prime vertical alignment */
  mo.tml-prime {
    font-family: Temml;
  }
  /* Italic correction on superscripts */
  .tml-sml-pad {
    padding-left: 0.05em;
  }
  .tml-med-pad {
    padding-left: 0.10em;
  }
  .tml-lrg-pad {
    padding-left: 0.15em;
  }
}

@supports (-webkit-backdrop-filter: blur(1px)) {
  /* WebKit vertical & italic correction on accents */
  .wbk-acc {
    /* lower by x-height distance */
    transform: translate(0em, 0.431em);
  }
  .wbk-sml {
    transform: translate(0.07em, 0);
  }
  .wbk-sml-acc {
    transform: translate(0.07em, 0.431em);
  }
  .wbk-sml-vec {
    transform: scale(0.75) translate(0.07em, 0);
  }
  .wbk-med {
    transform: translate(0.14em, 0);
  }
  .wbk-med-acc {
    transform: translate(0.14em, 0.431em);
  }
  .wbk-med-vec {
    transform: scale(0.75) translate(0.14em, 0);
  }
  .wbk-lrg {
    transform: translate(0.21em, 0);
  }
  .wbk-lrg-acc {
    transform: translate(0.21em, 0.431em);
  }
  .wbk-lrg-vec {
    transform: scale(0.75) translate(0.21em, 0);
  }
}

/* \cancel & \phase use background images. Get them to print. */
menclose {
  -webkit-print-color-adjust: exact;  /* Chrome & Edge */
          print-color-adjust: exact;
}

/* Array cell justification in Firefox & WebKit */
.tml-right {
  text-align: right;
}
.tml-left {
  text-align: left;
}

/* For CD labels that grow to the left in Firefox and WebKit */
.tml-shift-left { margin-left:-200% }

<script id="DATA" type="application/json">{"slug":"agentic-ai","name":"Agentic AI","lectures":[{"id":"agentic-ai-27","num":"27","file":"agentic-ai-01","kind":"lecture","title":"Agentic AI — Part 1: Fundamentals, Architectures, and Reasoning","h1":"Agentic AI — Part 1: Fundamentals, Architectures, and Reasoning","subtitle":"Fundamentals, Architectures, and Reasoning","spineLabel":"Part 1","short":"Fundamentals, Architectures, and Reasoning","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~32:00. Originally drafted from <code>slides_deduped/</code> (23 slides) with OCR + transcript\nverification, then <strong>audited against the raw 53-frame capture</strong> in\n<code>output/Lecture_27 - Bonus Module Agentic AI Part 1/</code> per this project's standard methodology\n(see project memory <code>slides-deduped-is-lossy</code>) — a whole missing architecture (Plan-and-Execute,\n<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a) was found and added. Instructor: <strong>Harsh Agarwal</strong>, Applied Scientist, International ML\nteam at Amazon — no name overlay was visible in this deck's own frames, but Lecture 28 (same\nmodule, consecutive part) has a confirmed nameplate reading &quot;Harsh Agarwal,&quot; and both lectures\nare almost certainly delivered by the same instructor. This module covers how agents work on top\nof LLM architectures — the loop that turns a language model from a one-shot answerer into a\nsystem that perceives, reasons, and acts.</p>\n</blockquote>\n<hr>\n</div><section id=\"agentic-ai-27-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Distinguish chatbot, copilot, and agent</strong> by who controls the next step in the loop.</li>\n<li><strong>Describe the agent loop</strong> (think → act → observe) and explain why closing this loop is what\nmakes an agentic system.</li>\n<li><strong>Explain the autonomy ladder</strong> — L1 tool call → L2 multi-step (ReAct) → L3 plan &amp; adapt → L4\nmulti-agent — and identify where the &quot;do I need an agent?&quot; threshold actually sits.</li>\n<li><strong>Calculate how errors compound</strong> in multi-step agents (the 0.95^n problem) and explain why\na &quot;95% reliable step&quot; does NOT mean a &quot;95% reliable agent.&quot;</li>\n<li><strong>Decide when to use an agent</strong> vs. a simple LLM call vs. a fixed workflow, based on path\ncomplexity and action reversibility.</li>\n<li><strong>Implement the ReAct framework</strong> (Reasoning + Acting) and explain why combining thought,\naction, and observation prevents hallucination.</li>\n<li><strong>Explain the Reflection framework</strong> — how agents learn from mistakes without retraining the\nLLM, via memory banks.</li>\n<li><strong>Implement Tree of Thought</strong> — exploring multiple reasoning branches with backtracking —\nand explain when it outperforms single-chain reasoning.</li>\n<li><strong>Design guardrails</strong> — thinking vs. acting decision, confidence thresholds for human\ninterruption, and validate-retry-escalate patterns.</li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-27-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>📚 Prerequisite 1 — What an LLM call actually is</h3>\n<p>An <strong>LLM (large language model)</strong> takes a sequence of text (a &quot;prompt&quot;) and produces a probability\ndistribution over what text should come next, then samples from it — one token at a time. A single\n&quot;call&quot; to an LLM is stateless: it has no memory of anything beyond what's in the prompt you send it\nthis time. Everything this lecture builds — tools, loops, memory — exists because a raw LLM call,\nby itself, can only do this one thing: text in, text out.</p>\n<h3>📚 Prerequisite 2 — Tokens and context window, briefly</h3>\n<p>A <strong>token</strong> is roughly a word-piece — the unit an LLM actually processes (see Lecture 18's\ntokenization material for the full mechanics). The <strong>context window</strong> is the maximum number of\ntokens a single LLM call can take as input. Every idea in this lecture about &quot;injecting a memory&quot;\nor &quot;the schema is the prompt&quot; ultimately means: some text gets added to what fits inside this\nwindow before the next call.</p>\n<h3>📚 Prerequisite 3 — What &quot;calling a function&quot; means, for a non-programmer reader</h3>\n<p>When this lecture says an agent &quot;calls a tool&quot; or &quot;calls <code>search_database()</code>,&quot; it means: the LLM\noutputs a piece of structured text specifying a function name and arguments (e.g. <code>search(&quot;green parks Mumbai&quot;)</code>), and separate code — not the LLM itself — actually runs that function and returns\na result. The LLM never executes anything; it only ever <em>requests</em> that something be executed. This\ndistinction becomes important in Lecture 28's tool-calling material and is assumed throughout this\nlecture's &quot;Act&quot; step.</p>\n<hr>\n</section><section id=\"agentic-ai-27-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>LLMs are one-shot: you ask, they answer, they stop. <strong>Agents close the loop</strong> — the LLM\ndecides what to do next based on what it just observed:</p>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"817\" style=\"max-width:100%;height:auto\" id=\"d1b5dedb0f3003444\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 816.84375 257.375\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#d1b5dedb0f3003444{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d1b5dedb0f3003444 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d1b5dedb0f3003444 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d1b5dedb0f3003444 .error-icon{fill:#16140F;}#d1b5dedb0f3003444 .error-text{fill:#B4AA95;stroke:#B4AA95;}#d1b5dedb0f3003444 .edge-thickness-normal{stroke-width:1px;}#d1b5dedb0f3003444 .edge-thickness-thick{stroke-width:3.5px;}#d1b5dedb0f3003444 .edge-pattern-solid{stroke-dasharray:0;}#d1b5dedb0f3003444 .edge-thickness-invisible{stroke-width:0;fill:none;}#d1b5dedb0f3003444 .edge-pattern-dashed{stroke-dasharray:3;}#d1b5dedb0f3003444 .edge-pattern-dotted{stroke-dasharray:2;}#d1b5dedb0f3003444 .marker{fill:#7C7361;stroke:#7C7361;}#d1b5dedb0f3003444 .marker.cross{stroke:#7C7361;}#d1b5dedb0f3003444 svg{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;}#d1b5dedb0f3003444 p{margin:0;}#d1b5dedb0f3003444 .label{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-seri 99/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>LLM</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"d1b5dedb0f3003444-flowchart-o1-2\" data-look=\"classic\" transform=\"translate(339.15625, 52.75)\"><rect class=\"basic label-container\" style=\"\" x=\"-59.8125\" y=\"-19.75\" width=\"119.625\" height=\"39.5\"></rect><g class=\"label\" style=\"\" transform=\"translate(-39.8125, -9.75)\"><rect></rect><foreignObject width=\"79.625\" height=\"19.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p>output (done)</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id=\"d1b5dedb0f3003444-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"d1b5dedb0f3003444-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"d1b5dedb0f3003444-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<p>This module covers:</p>\n<ol>\n<li>What makes something an agent (vs. chatbot vs. copilot)</li>\n<li>How agents think (ReAct, Reflection, Tree of Thought)</li>\n<li>When agents fail (error compounding, infinite loops)</li>\n<li>How to guardrail them (confidence thresholds, human gates)</li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-27-s3\" data-title=\"What Is an Agent?\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">What Is an Agent?</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 The chatbot → copilot → agent spectrum</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Chatbot</strong></th>\n<th><strong>Copilot</strong></th>\n<th><strong>Agent</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Who drives?</td>\n<td>You drive every turn</td>\n<td>Model suggests, you approve</td>\n<td>Model owns the loop</td>\n</tr>\n<tr>\n<td>Interaction</td>\n<td>Q&amp;A, open-ended text</td>\n<td>Autocomplete, suggestions</td>\n<td>Autonomous task execution</td>\n</tr>\n<tr>\n<td>Example</td>\n<td>FAQ chatbot</td>\n<td>Copilot autocomplete</td>\n<td><strong>ReAct web researcher</strong>, <strong>SWE-bench coder</strong>, <strong>Multi-agent orchestrator</strong></td>\n</tr>\n<tr>\n<td>Loop control</td>\n<td>Human closes the loop</td>\n<td>Human approves each step</td>\n<td><strong>Agent decides when to stop</strong></td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A chatbot answers questions. A coding agent runs the test, reads the failure, then edits and\nre-runs on its own — nobody approves each step.&quot;</em></p>\n</blockquote>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>A RAG bot with tools is still a chatbot</strong> [slide 12] — retrieving documents and answering\nis still &quot;human drives each turn&quot;: the human asks a new question every turn, the bot never\ndecides its own next step. A copilot and a true agent differ only on <em>who owns the loop</em>, not on\nwhether tools are involved at all.</p>\n</aside>\n<h3>1.2 The agent loop: think → act → observe</h3>\n<p>Every agentic system follows this three-phase cycle:</p>\n<ol>\n<li><strong>Think (Reason):</strong> The LLM analyzes the task, the available tools, and what it knows so far.\nIt creates a plan or chain of thought.</li>\n<li><strong>Act (Execute):</strong> The LLM calls a tool (search, database lookup, code execution, API call)\nwith specific parameters.</li>\n<li><strong>Observe (Feedback):</strong> The tool returns results. The LLM reads them, decides if the task is\ncomplete, and either stops or loops back to Think.</li>\n</ol>\n<p><strong>The key insight:</strong> the LLM needs access to <em>tools</em> — specialized functions that do one thing\nwell (search, read file, run code, send email). The agent's prompt includes descriptions of all\navailable tools, and the LLM decides which to call and with what parameters.</p>\n<hr>\n</section><section id=\"agentic-ai-27-s4\" data-title=\"The Autonomy Ladder [slide 13–14]\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">The Autonomy Ladder [slide 13–14]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><strong>How much of the control flow you hand to the model, one rung at a time.</strong> The deck's own ladder\nis keyed to a single worked task, so you can see exactly where each rung succeeds or fails rather\nthan reasoning about autonomy in the abstract:</p>\n<blockquote class=\"aside-quote\">\n<p><strong>THE TASK</strong> — <em>&quot;I can come Monday but my passport delay may push me to Wednesday. Can I still\nsurf Tuesday with cancellation insurance?&quot;</em></p>\n</blockquote>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Level</th>\n<th>What runs</th>\n<th>Control-flow code</th>\n<th>On this task</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L1 — Tool call</strong></td>\n<td>A single tool call, no loop</td>\n<td><code>run_function(llm_tool, llm_args)</code></td>\n<td>❌ <strong>Partial / wrong answer</strong> — one lookup can't reconcile &quot;Monday,&quot; &quot;Wednesday,&quot; and &quot;Tuesday&quot; against an insurance policy in one shot</td>\n</tr>\n<tr>\n<td><strong>L2 — Multi-step (ReAct)</strong></td>\n<td>A self-directed loop — the model decides when to stop</td>\n<td><code>while llm_should_continue(): step()</code></td>\n<td>✅ <strong>Answered</strong> — this is the deck's own <strong>&quot;do I need an agent?&quot; threshold</strong>: below this line, hardcode it; at or above, you need an agent</td>\n</tr>\n<tr>\n<td><strong>L3 — Plan &amp; adapt</strong></td>\n<td>Autonomous goal pursuit</td>\n<td><code>plan → execute → replan</code></td>\n<td>Handles multi-step plans that must revise themselves mid-request</td>\n</tr>\n<tr>\n<td><strong>L4 — Multi-agent</strong></td>\n<td>Delegation / collaboration</td>\n<td><code>if llm_trigger(): run_agent()</code></td>\n<td>One agent spawns others for sub-tasks</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The principle:</strong> <em>&quot;A plan that changes mid-request can't be answered by one fixed lookup. Give\nthe model more say over what runs next: a tool call becomes a loop. Agency is a dial, not a\nswitch: more autonomy, harder to control.&quot;</em> L2 (ReAct) is the practical floor for most real\nagentic tasks — it's the first rung on this ladder that actually <em>answers</em> the worked example\nabove, not just partially addresses it.</p>\n<aside class=\"callout callout-bg\"><p class=\"callout-h\"><span class=\"callout-badge\">📚</span>Background</p><p><strong>Note on the earlier chatbot/copilot/agent framing (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§1.1\" role=\"link\" tabindex=\"0\">§1.1</a>)</strong> — that spectrum and this ladder\ndescribe the same underlying idea (how much control the model has) from two different angles:\n<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§1.1\" role=\"link\" tabindex=\"0\">§1.1</a> is about who <em>drives the conversation</em>, this ladder is about what <em>code structure</em> each\nlevel of control actually compiles down to (a single call vs. a loop vs. a replanning loop vs.\nagent-spawns-agent).</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Agents fail fast and silently.</strong> If you give an autonomous agent a complex task without\nguardrails, a single error at step 3 poisons every subsequent step. The overall success rate\ndrops exponentially with the number of steps — this is the most critical thing to understand\nabout agentic systems.</p>\n</aside>\n<hr>\n</section><section id=\"agentic-ai-27-s5\" data-title=\"Why Agents Are Hard: Error Compounding\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Why Agents Are Hard: Error Compounding</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>3.1 The 0.95^n problem [slide 16–18]</h3>\n<p>The formula says: <strong>if every step succeeds independently with the same probability, the chance\nall of them succeed together shrinks fast — multiplying probabilities less than 1 always makes the\nresult smaller, and doing it n times compounds that shrinkage.</strong></p>\n<div class=\"mblk bound\"><math data-tex=\"P(\\text{all } n \\text{ steps succeed}) = p^n\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>all </mtext><mi>n</mi><mtext> steps succeed</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msup><mi>p</mi><mi class=\"tml-med-pad\">n</mi></msup></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"p\"><mi>p</mi></math></td>\n<td>&quot;per-step success probability&quot;</td>\n<td>The chance a single step of the agent succeeds (e.g. 0.95 for &quot;95% reliable&quot;)</td>\n</tr>\n<tr>\n<td><math data-tex=\"n\"><mi>n</mi></math></td>\n<td>&quot;number of steps&quot;</td>\n<td>How many sequential steps the agent's task requires</td>\n</tr>\n</tbody>\n</table></div>\n<p>If each step has 95% success rate, the end-to-end success rate over n steps is <math data-tex=\"0.95^n\"><msup><mn>0.95</mn><mi>n</mi></msup></math>:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Steps (n)</th>\n<th>End-to-end success rate</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>95%</td>\n</tr>\n<tr>\n<td>5</td>\n<td>77%</td>\n</tr>\n<tr>\n<td>10</td>\n<td>60%</td>\n</tr>\n<tr>\n<td>20</td>\n<td>36%</td>\n</tr>\n<tr>\n<td>40</td>\n<td><strong>12.9%</strong></td>\n</tr>\n<tr>\n<td>100</td>\n<td><strong>0.6%</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;A 95% reliable step does NOT make a 95% reliable agent.&quot;</em></p>\n<figure class=\"iv\" id=\"iv-agentic-ai-27-0\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;Error compounding — 0.95^n&quot;,&quot;concept&quot;:&quot;Why per-step reliability doesn't translate into agent reliability&quot;,&quot;control&quot;:&quot;Drag n (number of steps) from 1 to 100&quot;,&quot;observe&quot;:&quot;End-to-end success rate falls off a cliff well before n=100&quot;,&quot;insight&quot;:&quot;A step that \\&quot;almost always works\\&quot; still makes a long agent almost always fail — the fix is guardrails, not a marginally better model&quot;,&quot;fallback&quot;:&quot;The static table above (n=1→95%, n=40→12.9%, n=100→0.6%) already shows the full curve; read down the rows in order to see the same shape a slider would animate.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">Error compounding — 0.95^n</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why per-step reliability doesn't translate into agent reliability</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Drag n (number of steps) from 1 to 100</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>End-to-end success rate falls off a cliff well before n=100</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>A step that \"almost always works\" still makes a long agent almost always fail — the fix is guardrails, not a marginally better model</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The static table above (n=1→95%, n=40→12.9%, n=100→0.6%) already shows the full curve; read down the rows in order to see the same shape a slider would animate.</p>\n    </div>\n  </figure>\n<h3>3.2 Common failure modes</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Failure mode</th>\n<th>What happens</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Infinite loop</strong></td>\n<td>Agent repeats the same validation cycle forever, burning compute</td>\n<td>Agent can't satisfy its own acceptance criteria</td>\n</tr>\n<tr>\n<td><strong>Hallucinated action</strong></td>\n<td>Agent assumes a tool exists that doesn't, then hallucinates its output</td>\n<td>Agent calls <code>search_database()</code> but the function doesn't exist</td>\n</tr>\n<tr>\n<td><strong>Poisoned pipeline</strong></td>\n<td>One wrong step makes all subsequent steps invalid</td>\n<td>Agent writes wrong function signature, all callers break</td>\n</tr>\n<tr>\n<td><strong>Cost explosion</strong></td>\n<td>Each retry adds API costs; errors compound into massive bills</td>\n<td>Agent retries 50 times on an impossible task</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — error compounding is why guardrails matter more than raw capability.</strong> An\nagent that's brilliant at each individual step but has no way to detect or recover from errors\nwill fail catastrophically on multi-step tasks. The solution isn't a smarter LLM — it's\nunit tests, confidence thresholds, and human gates at critical points.</p>\n</aside>\n<hr>\n</section><section id=\"agentic-ai-27-s6\" data-title=\"When to Use an Agent\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">When to Use an Agent</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Task type</th>\n<th>Best approach</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Simple lookup (search Google)</td>\n<td>Direct LLM call or manual</td>\n<td>No need for the agent overhead</td>\n</tr>\n<tr>\n<td>Fixed workflow (always 3 steps)</td>\n<td>Hardcoded pipeline</td>\n<td>Cheaper, deterministic, debuggable</td>\n</tr>\n<tr>\n<td><strong>Dynamic, unknown path</strong></td>\n<td><strong>Agent</strong></td>\n<td>Path can't be scripted in advance</td>\n</tr>\n<tr>\n<td>Irreversible action (drop DB, cancel flight)</td>\n<td>Agent + <strong>human gate</strong></td>\n<td>Cost of failure too high for full automation</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The rule of thumb:</strong> reach for an agent <em>only</em> when the path is unknown AND the task has\nmultiple moving parts that benefit from automation. If you can predict every step in advance,\nhardcode it — it's cheaper and more reliable.</p>\n<hr>\n</section><section id=\"agentic-ai-27-s7\" data-title=\"Agentic Reasoning Frameworks\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Agentic Reasoning Frameworks</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">12 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>5.1 ReAct (Reasoning + Acting)</h3>\n<p>The most fundamental agentic framework. Every step follows the cycle:</p>\n<pre class=\"code\"><code>Thought: &quot;I need to find green parks in Mumbai. Let me search for that.&quot;\nAction: search(&quot;green parks Mumbai&quot;)\nObservation: [3 results: Park A, Park B, Park C]\nThought: &quot;Park B is actually a garden, not a park. Let me verify the others.&quot;\nAction: lookup(&quot;Park A details&quot;)\nObservation: [3.2 acres, public, open daily]\nThought: &quot;Park A matches. Let me check Park C too.&quot;\n...\nThought: &quot;I have enough information. Stopping here.&quot;</code></pre>\n<p><strong>Why it works:</strong></p>\n<ul>\n<li><strong>Thought</strong> prevents hallucination by grounding every action in reasoning.</li>\n<li><strong>Action</strong> prevents the LLM from making things up (it must call a real tool).</li>\n<li><strong>Observation</strong> feeds real-world data back, closing the loop.</li>\n</ul>\n<p><strong>Without observation:</strong> the LLM hallucinates tool outputs.\n<strong>Without thought:</strong> the LLM calls tools randomly without reasoning about results.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>ReAct isn't an unqualified win</strong> [slide 26] — on the HotpotQA benchmark, ReAct still trails\nplain Chain-of-Thought reasoning (<strong>27.4 vs. 29.4 exact-match</strong>). Grounding every step in a real\ntool call trades one failure mode for another: it eliminates <em>hallucination</em> but introduces\n<em>retrieval errors</em> (the tool call itself can return the wrong or an unhelpful result). ReAct wins\nwhen grounding matters more than raw single-shot reasoning accuracy — it is not strictly better\nin every setting.</p>\n</aside>\n<h3>5.2 Reflection — Learning from Mistakes Without Retraining</h3>\n<p>The agent learns from its own failures by:</p>\n<ol>\n<li><strong>Retrospective analysis:</strong> After a task fails, the LLM examines the entire chain of events\nand identifies where/why it went wrong.</li>\n<li><strong>Memory bank:</strong> Store the lesson (e.g., &quot;don't use multiplication when not allowed&quot;) in a\npersistent memory store.</li>\n<li><strong>Context injection:</strong> On the next attempt, inject the memory into the prompt so the LLM\nknows to avoid the same mistake.</li>\n</ol>\n<p><strong>Key point:</strong> the LLM's weights are never updated. Learning happens entirely through context\nengineering — the memory bank is just text appended to future prompts.</p>\n<p><strong>Result:</strong> success rate improves dramatically with each trial, without any retraining. This is\na form of RL operating at the prompt level.</p>\n<p>🧪 <strong>The number behind &quot;dramatically&quot;</strong> [slide 28]: with reflection <strong>on</strong>, the agent climbs from\n~22% of tasks solved at trial 0 to <strong>130/134 solved (≈97%) by trial 12</strong> — a smooth, steady climb.\nWith reflection <strong>off</strong> (retry only, no lesson stored), the curve <strong>stalls near ~55–58% by trial\n7</strong> and plateaus there — the agent keeps retrying but keeps making the same mistake, so extra\nattempts stop buying any improvement. The gap between these two curves <em>is</em> what &quot;learning without\nretraining&quot; is worth in practice.</p>\n<h3>5.2a Plan-and-Execute</h3>\n<p>The lecture's own &quot;four ways to build an agent&quot; slide names ReAct, Reflection, Plan-and-Execute,\nand search-over-thoughts (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>) as the four architectures — this is the third.</p>\n<blockquote class=\"aside-quote\">\n<p><strong>Plan-and-Execute</strong> — a <strong>strong-model Planner</strong> drafts the entire plan in a single call, a\n<strong>cheap-model Executor</strong> carries out each step with tools, and a <strong>Replan</strong> edge repairs the plan\nwhen a step fails, looping back to the planner.</p>\n</blockquote>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"532\" style=\"max-width:100%;height:auto\" id=\"de131074cecf7bfd9\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 531.359375 75\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#de131074cecf7bfd9{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#de131074cecf7bfd9 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#de131074cecf7bfd9 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#de131074cecf7bfd9 .error-icon{fill:#16140F;}#de131074cecf7bfd9 .error-text{fill:#B4AA95;stroke:#B4AA95;}#de131074cecf7bfd9 .edge-thickness-normal{stroke-width:1px;}#de131074cecf7bfd9 .edge-thickness-thick{stroke-width:3.5px;}#de131074cecf7bfd9 .edge-pattern-solid{stroke-dasharray:0;}#de131074cecf7bfd9 .edge-thickness-invisible{stroke-width:0;fill:none;}#de131074cecf7bfd9 .edge-pattern-dashed{stroke-dasharray:3;}#de131074cecf7bfd9 .edge-pattern-dotted{stroke-dasharray:2;}#de  max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>Planner</b><br><small>strong model, 1 call</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"de131074cecf7bfd9-flowchart-E-1\" data-look=\"classic\" transform=\"translate(241.53125, 37.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-69.453125\" y=\"-29.5\" width=\"138.90625\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-49.453125, -19.5)\"><rect></rect><foreignObject width=\"98.90625\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>Executor</b><br><small>cheap model + tools</small></p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"de131074cecf7bfd9-flowchart-R-2\" data-look=\"classic\" transform=\"translate(466.671875, 37.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-56.6875\" y=\"-29.5\" width=\"113.375\" height=\"59\"></rect><g class=\"label\" style=\"\" transform=\"translate(-36.6875, -19.5)\"><rect></rect><foreignObject width=\"73.375\" height=\"39\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;\"><span class=\"nodeLabel \"><p><b>Replan</b><br><small>on a failed step</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"de131074cecf7bfd9-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"de131074cecf7bfd9-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"de131074cecf7bfd9-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"#4C4739\" stop-opacity=\"1\"></stop></linearGradient></svg></figure>\n<p><strong>Why split planner and executor at all?</strong> A single expensive model call drafts the whole plan\nonce; a cheap model then just <em>executes</em> each already-decided step, which is a much easier job than\nplanning. This is a cost optimization on top of a capability one — most of the work (running tools,\nchecking outputs) doesn't need the strong model at all.</p>\n<p>🧪 <strong>The benchmark that makes the risk concrete — a 3-block Blocksworld stacking problem, 600\ninstances, zero-shot, plans checked by the VAL verifier:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Planner</th>\n<th>Success rate</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fast Downward</strong> (classical, symbolic planner)</td>\n<td><strong>100.0%</strong></td>\n</tr>\n<tr>\n<td>GPT-4</td>\n<td>34.6%</td>\n</tr>\n<tr>\n<td>Claude 3.5 Sonnet</td>\n<td>54.8%</td>\n</tr>\n<tr>\n<td>o1-preview</td>\n<td>97.8%</td>\n</tr>\n</tbody>\n</table></div>\n<p>The block-stacking problem itself never changes — only the <strong>names</strong> of the blocks and actions do\n(familiar block-stacking words like <code>pickup</code>, <code>stack(A,B)</code>, <code>on(C,A)</code> vs. obfuscated equivalents).\n<strong>Renaming the actions leaves the problem mathematically identical, yet the LLM bars collapse toward\n~0% under obfuscation while the classical planner still holds 100%.</strong></p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>&quot;The LLM is a good plan <em>proposer</em> but a poor plan <em>guarantor</em>.&quot;</strong> A plan that <em>reads</em> well\n— plausible-sounding steps, familiar terminology — can still be logically infeasible, and an LLM\nplanner has no built-in way to verify its own plan's validity the way a symbolic planner does.\nThis is exactly why the <strong>Replan</strong> edge exists: don't trust the plan blindly, check each step's\nactual outcome and loop back when it fails, rather than assuming a good-looking plan is a correct\none.</p>\n</aside>\n<h3>5.3 Tree of Thought — Exploring Multiple Branches [slide 38]</h3>\n<p>Instead of one chain of thought, explore <em>multiple</em> reasoning branches, score each one, and\nbacktrack from dead ends — this is the deck's own &quot;Game of 24&quot; example (reach 24 using the four\nnumbers <code>4 4 6 8</code> exactly once each), redrawn here to match the slide's actual tree:</p>\n<figure class=\"diagram\"><svg preserveAspectRatio=\"xMidYMid meet\" width=\"684\" style=\"max-width:100%;height:auto\" id=\"de483c8348f1e493e\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" viewBox=\"0 0 683.4921875 264\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#de483c8348f1e493e{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:13px;fill:#EDE6D7;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#de483c8348f1e493e .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#de483c8348f1e493e .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#de483c8348f1e493e .error-icon{fill:#16140F;}#de483c8348f1e493e .error-text{fill:#B4AA95;stroke:#B4AA95;}#de483c8348f1e493e .edge-thickness-normal{stroke-width:1px;}#de483c8348f1e493e .edge-thickness-thick{stroke-width:3.5px;}#de483c8348f1e493e .edge-pattern-solid{stroke-dasharray:0;}#de483c8348f1e493e .edge-thickness-invisible{stroke-width:0;fill:none;}#de483c8348f1e493e .edge-pattern-dashed{stroke-dasharray:3;}#de483c8348f1e493e .edge-pattern-dotted{stroke-dasharray:2;}#de483c8348f1e49
