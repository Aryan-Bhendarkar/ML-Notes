list, human-in-loop\n\n  MEMORY to persist\n  ├── Working (context) → Short-term → Long-term → Episodic\n  ├── Episodic + Reflection = learn from failure without retraining\n  ├── Four patterns: vector, sliding+summary, structured, hierarchical\n  └── Curation: write, read, update, forget\n\n  MCP to connect\n  ├── Host → Client → Server (one protocol)\n  ├── Tools (model) + Resources (app) + Prompts (user)\n  ├── stdio (local) or HTTP+SSE (remote)\n  └── N×M → N+M (USB-C for AI tools)\n\n  Tools to act, memory to persist, protocol to connect.\n  → One capable agent, working alone.\n  → Next: how does one agent become MANY?</pre></figure>\n<hr>\n</section><section id=\"agentic-ai-28-s22\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">14 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s22\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why can't an LLM fix a bug without tools? What four limitations do tools address?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>An LLM is text-in, text-out. It can't access the file system (can't read/edit files), can't\nexecute code (can't run tests), has a knowledge cutoff (can't know current state), and its\npredictions are approximate (a database query knows the answer; an LLM guesses). Tools give\nit search for knowledge, calculators for compute, file systems and APIs for action, and\ndatabases for exact answers. Without tools, the LLM can only <em>describe</em> a fix — it can't\n<em>implement</em> one.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why is \"the schema is the prompt\" such an important insight?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>When you give a model tools, it decides which to call and with what arguments <em>solely</em> by\nreading the schema descriptions — there's no other signal. A vague description like &quot;gets data&quot;\nwith a parameter named &quot;q&quot; gives the model no guidance; it'll guess and probably guess wrong.\nA clear description like &quot;Find a customer's orders by email. Use for 'where is my order'\nquestions&quot; with typed, enum-constrained parameters gives the model precise guidance. The\nschema <em>is</em> the prompt — it needs the same care as prompt engineering.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Design the tool routing strategy for an e-commerce platform with 500 tools.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Direct selection won't work — 500 schemas stuffed into context is expensive and error-prone.\nUse a two-tier approach: (1) A cheap classifier model routes the user's intent to a category\n(billing, inventory, shipping, etc.), then (2) expose only the ~20 tools in that category to\nthe main model. For the main model's tool calls, use retrieval: embed all 500 tool descriptions,\nand for each query fetch the top-5 most relevant. This keeps cost and error rate flat regardless\nof total toolbox size.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What's the difference between context window and memory? Why does it matter?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Context window is the current conversation — large but bounded, volatile, vanishes when the\nsession ends. Memory persists across sessions via external stores. Context is working memory;\nmemory is long-term knowledge. The distinction matters because an agent without memory restarts\nfrom zero every session — it redoes all work, repeats all mistakes, and never builds on past\nexperience. Real memory (long-term preferences, episodic failure lessons) lets the agent start\neach session ahead.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain episodic memory and the reflection loop. How does an agent improve without retraining?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Episodic memory stores past experiences — what was attempted, what happened, and why it failed.\nAfter a failure, the agent writes a short self-reflection (&quot;I failed because I forgot to handle\nX&quot;) and stores it. On retry, the reflection is injected into context before the next attempt.\nThe agent enters attempt 2 already knowing what not to do. It avoids the same dead end and\nsucceeds. The model weights never change — all learning happens through context engineering.\nThis shares STaR's &quot;learn from your own output&quot; spirit (<code>GenAI &amp; LLM Part 2 §13</code>) but not its\nmechanism: STaR retrains on self-generated rationales; reflection only re-injects a lesson into\ncontext at inference time.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain MCP's architecture. Why did it collapse N×M to N+M?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>MCP has three roles: host (the app), client (protocol adapter inside the host), and server\n(exposes tools/data). Before MCP, every model had to integrate every tool individually (N×M).\nWith MCP, tool builders ship MCP servers (model-agnostic) and host builders speak MCP\n(tool-agnostic). A database team ships a server without knowing which model is used. The host\ndiscovers tools at runtime. This collapses to N+M connections through one standard protocol —\nlike USB-C replacing every device having its own charger.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">When should you use MCP vs. plain function calling?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Function calling is the mechanism: one model, few fixed tools, hardcoded wiring. Use it when\nyou have a single model with a small, stable tool set — MCP would be overkill. MCP is the\necosystem: many tools, multiple hosts, runtime discovery, composability across vendors. Use it\nwhen your toolbox grows beyond a dozen tools, when you want tools to work across different\nmodels/hosts, or when you need runtime tool discovery. Under the hood, MCP feeds function\ncalling — the host discovers MCP tools and converts them to function calls for whatever model\nit uses.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">A tool call fails validation and the agent retries with a different tool. How should episodic memory interact with this recovery, and what's the risk of getting it wrong?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>This combines <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6.1\" role=\"link\" tabindex=\"0\">§6.1</a>'s escalation ladder with <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s episodic memory. If the agent stores &quot;tool X\nfailed for this task type&quot; as an episodic lesson, future attempts at similar tasks can skip\nstraight to the working alternative — genuine learning without retraining. The risk (per <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s\n&quot;timeliness&quot; caveat) is over-generalizing a one-off failure: if tool X failed because of a\ntransient outage, not a real incompatibility, a stale lesson would wrongly avoid a perfectly good\ntool forever. The fix is to record <em>why</em> the tool failed (transient vs. structural), not just\n<em>that</em> it failed, so recall can distinguish the two cases.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">You're designing an MCP server for a tool with a destructive action (deleting records). Which security principle from §6.2 applies, and how does it interact with MCP's host/client/server split from §12?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>'s human-in-the-loop and least-privilege principles apply directly, but MCP's architecture\nchanges <em>where</em> they're enforced: the server should scope the tool as narrowly as possible\n(least privilege) regardless of which host calls it, but the pause-for-approval gate is a <em>host</em>\nconcern (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>'s &quot;Host&quot; role), since different hosts may want different approval UX. This is a case\nwhere the tool-level security guarantee (server) and the human-approval workflow (host) are\ndeliberately split across MCP's roles rather than both living in the tool.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">When would you choose a router (§5) over a vector-store memory pattern (§10) for helping the model use the right tool at the right time — and could you use both together?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>These solve different problems that look similar: a router (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>) selects which <em>tools</em> are exposed\nto the model this turn, based on classifying the current request's intent. A vector-store memory\npattern (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>) recalls <em>past experiences</em> (&quot;have I seen something like this before?&quot;), which can\ninclude which tool worked last time for a similar task. In practice you'd combine them: the router\nnarrows the toolbox by category, and episodic/vector memory further biases tool selection within\nthat category based on what has worked historically — <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a> explicitly notes combining memory\npatterns is common, and the same logic extends to combining a scaling strategy with a memory\npattern.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s cost curves show retrieval scaling nearly flat as the toolbox grows — what's the hidden\ncost retrieval pays that direct selection doesn't?&quot;</em> — retrieval requires embedding and indexing\nevery tool description up front, and its per-query cost is now a vector search plus however many\ncandidate tools get returned — it trades away direct selection's simplicity (dump everything into\ncontext) for an extra retrieval step, which is cheap at scale but isn't free at small scale, which\nis exactly why direct selection remains preferred while the toolbox is still small (&quot;a few dozen\ntools,&quot; per the deck's own wording — see <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s ⚠️ note on why no numeric ceiling is claimed for\nrouter or retrieval).</li>\n<li><em>&quot;Episodic memory (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>) stores 'I failed because of Y' as text. What happens if that lesson is\nwrong or was only true in one specific context?&quot;</em> — this is the same staleness risk <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s three\ncaveats name directly (timeliness: &quot;stale memory is worse than no memory&quot;). A wrong or\noverly-specific lesson injected into every future prompt can actively mislead the agent in a new\ncontext where the original failure's cause doesn't apply — which is why the &quot;forget&quot; operation\n(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>'s memory curation) needs to actively prune lessons, not just accumulate them indefinitely.</li>\n</ul>\n<h3>Applied scenario — Amazon customer-support agent with MCP-backed tools</h3>\n<p><strong>Framing:</strong> Amazon wants a customer-support agent that can look up an order, check a return policy,\nand issue a refund — using tools that different internal teams (Orders, Policy, Payments) each own\nand maintain independently.</p>\n<p><strong>Why MCP, not just function calling (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>):</strong> three different teams own three different backend\nsystems, and the support agent might eventually need to run on multiple hosts (a chat widget, an\ninternal agent console, a mobile app). Per <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>'s own guidance, this is exactly the &quot;many tools,\nmultiple hosts&quot; case that justifies MCP over hardcoded function calling — each team ships its own\nMCP server (an Orders server, a Policy server, a Payments server) without ever coordinating with\nwhichever model or host ends up calling it (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>'s &quot;tool builders and model builders never have to\ncoordinate&quot;).</p>\n<p><strong>Tool schema design (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>):</strong> the refund tool specifically needs the schema-design discipline of <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§4.2\" role=\"link\" tabindex=\"0\">§4.2</a>\n— a clear description (&quot;issue a refund for a specific order; requires manager approval above $100&quot;),\nminimal required parameters, and an enum for refund reason rather than free text, since the model's\ntool selection accuracy depends entirely on how well these are written.</p>\n<p><strong>Memory (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>–<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>):</strong> long-term memory (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>) should store a customer's known preferences and past\nissue history across sessions, so a returning customer doesn't have to re-explain context; episodic\nmemory (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>) is the natural fit for the agent learning &quot;last time a return like this needed a photo\nfirst&quot; without retraining.</p>\n<p><strong>Security (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>):</strong> the refund tool is a textbook case for <strong>human-in-the-loop</strong> — a destructive,\nhard-to-reverse action (money leaving the business) should pause for approval above a threshold, per\n<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>'s principle, not be left to full automation regardless of the agent's confidence.</p>\n<p><strong>Failure modes:</strong> a poorly-scoped Payments MCP server that grants more than &quot;issue a refund up to\n$X&quot; (violating least privilege, <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>) turns one compromised or confused tool call into a much larger\nfinancial exposure than intended.</p>\n<p><strong>What you'd ship:</strong> three narrowly-scoped MCP servers (Orders, Policy, Payments), each following\nleast-privilege and allowlisting, exposed to a single support-agent host over stdio (internal,\nlocal) or HTTP+SSE (if the servers are centrally hosted), with human approval gated on refund amount.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Ownership</strong> — letting the Payments team own and evolve their MCP\nserver independently of whichever model or host calls it is a direct instance of <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>'s &quot;teams ship\nservers without touching any model.&quot; <strong>Insist on the Highest Standards</strong> — least-privilege tool\nscoping (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>) on a refund-issuing tool is exactly the kind of guardrail that's cheap to add early\nand expensive to retrofit after an incident.</p>\n<hr>\n</section><section id=\"agentic-ai-28-s23\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s23\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>Allowlisting</strong> — naming exactly which tools an agent may call; default to deny.</li>\n<li><strong>Circuit breaker</strong> — stop calling a failed tool for a cooldown period; prevents cascading failure.</li>\n<li><strong>Context window</strong> — the current conversation in memory; bounded, volatile, session-scoped.</li>\n<li><strong>Episodic memory</strong> — memory of past experiences with reflection-style lessons (&quot;tried X, failed because Y&quot;).</li>\n<li><strong>Graceful degradation</strong> — answering without a tool when it's unavailable; being honest about limitations.</li>\n<li><strong>Hierarchical memory</strong> — detailed for recent past, fuzzy/abstract for distant past (mimics human memory).</li>\n<li><strong>Human-in-the-loop</strong> — pausing for human approval before irreversible actions.</li>\n<li><strong>Least privilege</strong> — giving each tool the narrowest scope that does the job.</li>\n<li><strong>MCP (Model Context Protocol)</strong> — Anthropic's open protocol for universal tool connectivity (N×M → N+M).</li>\n<li><strong>Memory curation</strong> — the four operations: write, read, update, forget.</li>\n<li><strong>Parallel tool calls</strong> — requesting multiple independent tool calls in one turn; harness runs concurrently.</li>\n<li><strong>Reflection</strong> — self-analysis after failure, stored in episodic memory, injected on retry.</li>\n<li><strong>Router</strong> — cheap classifier that routes intent to the relevant tool subset.</li>\n<li><strong>Schema-constrained JSON</strong> — tool parameters emitted in a parseable format; ensures arguments validate every time.</li>\n<li><strong>Short-term memory</strong> — within-session memory: recent turns word-for-word, older turns summarized.</li>\n<li><strong>stdio</strong> — MCP transport where the server is a local subprocess; fast, private.</li>\n<li><strong>Structured memory</strong> — typed store for entities/facts (user name, plan, preferences); exact, no drift.</li>\n<li><strong>Tool schema</strong> — name + description + JSON parameter definition; functions as the prompt for tool selection.</li>\n<li><strong>Vector store</strong> — embed everything; retrieve by semantic similarity; best for &quot;have I seen this before?&quot;</li>\n<li><strong>Working memory</strong> — the current context window; fast but bounded.</li>\n</ul>\n<hr>\n</section><section id=\"agentic-ai-28-s24\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s24\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Why can't an LLM multiply two large numbers correctly? What tool fixes this? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Describe the four-step tool-calling mechanism. Who executes the tool — the model or the harness? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>)</em></li>\n<li>When should tool calls be parallel vs. sequential? How does the model decide? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>Why is &quot;the schema is the prompt&quot; an important insight? Give a bad and good example. <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Compare direct selection, router, and retrieval strategies for tool access. When does each break down? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>)</em></li>\n<li>What's the escalation ladder when a tool fails? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)</em></li>\n<li>Why is context window not the same as memory? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>)</em></li>\n<li>Describe the four tiers of memory and where each lives. <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>)</em></li>\n<li>How does episodic memory + reflection enable learning without retraining? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n<li>What are the four memory implementation patterns? When would you use vector store vs. structured memory? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>What three roles does MCP define? What does each control? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>)</em></li>\n<li>Explain the difference between MCP tools, resources, and prompts. <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§13\" role=\"link\" tabindex=\"0\">§13</a>)</em></li>\n<li>When should you use MCP vs. plain function calling? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-28-s25\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s25\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>\n<p><strong>Packer et al. (2023), &quot;MemGPT: Towards LLMs as Operating Systems,&quot; arXiv:2310.08560</strong> —\n✅ confirmed directly in the footer of <code>slide_025.jpg</code>/<code>slide_026.jpg</code>, and independently\nre-verified via WebSearch: authors Charles Packer, Sarah Wooders, Kevin Lin, Vivian Fang,\nShishir G. Patil, Ion Stoica, Joseph E. Gonzalez; arXiv:2310.08560, submitted Oct 2023. <code>solid</code>.\nThis is the actual source of <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s four-tier memory taxonomy (working/short-term/long-term/\nepisodic), modeled explicitly on OS memory hierarchies (RAM vs. disk).</p>\n</li>\n<li>\n<p><strong>Anthropic (2024), &quot;Model Context Protocol Specification&quot;</strong> — ✅ verified via WebSearch: MCP\nwas introduced by Anthropic in November 2024; the official spec lives at\nmodelcontextprotocol.io/specification/latest. <code>solid</code>. Defines the protocol formally.</p>\n</li>\n<li>\n<p><strong>LangChain docs, &quot;Tool Use / Function Calling&quot;</strong> — ⚠️ this is a live, versioned documentation\nsite rather than a fixed citable paper — the general existence and subject matter are correct,\nbut no single stable title/date/URL can be &quot;confirmed&quot; the way a paper can. Point readers to\nthe current LangChain docs site rather than treating this as a dated reference. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>OpenAI (2023), &quot;Function calling and other API updates&quot;</strong> — ⚠️ this is a product/API blog\nannouncement rather than a paper; the pattern and rough date (mid-2023, alongside GPT-4 function\ncalling) are correct, but the exact post title should be re-checked against OpenAI's blog before\nciting verbatim. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>Shinn et al. (2023), &quot;Reflexion: Language Agents with Verbal Reinforcement Learning&quot;</strong>\n— ✅ verified via WebSearch: authors Noah Shinn, Federico Cassano, Edward Berman, Ashwin\nGopinath, Karthik Narasimhan, Shunyu Yao; arXiv:2303.11366; published NeurIPS 2023. <code>hard</code>.\nFoundational — the paper behind the reflection/episodic memory pattern.</p>\n</li>\n<li>\n<p><strong>Anthropic (2024), &quot;Building Effective Agents&quot;</strong> — ✅ verified via WebSearch: authored by Erik\nSchluntz and Barry Zhang at Anthropic, published <strong>December 2024</strong> (the file's prior &quot;2025&quot; date\nwas off by a year — corrected here). <code>solid</code>. Covers tool design, failure handling, and\nproduction patterns.</p>\n</li>\n<li>\n<p><strong>Google (2025), &quot;Agent-to-Agent Protocol (A2A)&quot;</strong> — ✅ verified via WebSearch: Google announced\nthe Agent2Agent (A2A) protocol on April 9, 2025 at Google Cloud Next; contributed to the Linux\nFoundation in June 2025. <code>solid</code>. Google's competing standard for agent interoperability,\nmentioned in Part 3.</p>\n</li>\n</ol>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>verify this</strong> — items 3 and 4 point to living documentation/blog pages rather than fixed\npapers, so their exact title wording should be re-checked against the current page before quoting\nit verbatim; all other items above are now confirmed against their primary source (author list,\narXiv ID, or announcement date), with item 6's year corrected from 2025 to 2024.</p>\n</aside>\n</section>","sections":[{"id":"agentic-ai-28-s0","num":"","title":"What you'll understand after reading this","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s1","num":"","title":"Before we start: what you need to know","mins":2,"kind":"content","part":""},{"id":"agentic-ai-28-s2","num":"","title":"The big picture","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s3","num":"","title":"Part A — Tools","mins":1,"kind":"divider","part":""},{"id":"agentic-ai-28-s4","num":"1","title":"Why LLMs Need Tools","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s5","num":"2","title":"How Tool Calling Works","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s6","num":"3","title":"Parallel Tool Calls","mins":2,"kind":"content","part":""},{"id":"agentic-ai-28-s7","num":"4","title":"Tool Schema Design — The Schema Is the Prompt","mins":2,"kind":"content","part":""},{"id":"agentic-ai-28-s8","num":"5","title":"Scaling Tool Access [slide 16]","mins":3,"kind":"content","part":""},{"id":"agentic-ai-28-s9","num":"6","title":"Tool Failure Handling and Security","mins":2,"kind":"content","part":""},{"id":"agentic-ai-28-s10","num":"","title":"Part B — Memory","mins":1,"kind":"divider","part":""},{"id":"agentic-ai-28-s11","num":"7","title":"Why Memory Matters","mins":2,"kind":"content","part":""},{"id":"agentic-ai-28-s12","num":"8","title":"Four Tiers of Memory [slide 25–26]","mins":2,"kind":"content","part":""},{"id":"agentic-ai-28-s13","num":"9","title":"Episodic Memory and Reflection","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s14","num":"10","title":"Memory Implementation Patterns","mins":3,"kind":"content","part":""},{"id":"agentic-ai-28-s15","num":"","title":"Part C — MCP (Model Context Protocol)","mins":1,"kind":"divider","part":""},{"id":"agentic-ai-28-s16","num":"11","title":"The Problem MCP Solves","mins":3,"kind":"content","part":""},{"id":"agentic-ai-28-s17","num":"12","title":"MCP Architecture — Three Roles","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s18","num":"13","title":"Three MCP Capabilities","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s19","num":"14","title":"MCP Transports and Ecosystem","mins":3,"kind":"content","part":""},{"id":"agentic-ai-28-s20","num":"15","title":"MCP vs. Function Calling","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s21","num":"16","title":"Module Recap","mins":1,"kind":"content","part":""},{"id":"agentic-ai-28-s22","num":"","title":"Interview prep — Amazon Applied Scientist","mins":14,"kind":"back","part":""},{"id":"agentic-ai-28-s23","num":"","title":"Glossary","mins":2,"kind":"back","part":""},{"id":"agentic-ai-28-s24","num":"","title":"Check yourself","mins":1,"kind":"back","part":""},{"id":"agentic-ai-28-s25","num":"","title":"Going deeper","mins":3,"kind":"back","part":""}],"interactiveCount":4},{"id":"agentic-ai-29","num":"29","file":"agentic-ai-03","kind":"lecture","title":"Agentic AI — Part 3: Multi-Agent Systems, Workflows, and Production","h1":"Agentic AI — Part 3: Multi-Agent Systems, Workflows, and Production","subtitle":"Multi-Agent Systems, Workflows, and Production","spineLabel":"Part 3","short":"Multi-Agent Systems, Workflows, and Production","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~51:00. Originally drafted from <code>slides_deduped/</code> (35 slides) with OCR + transcript\nverification, then <strong>audited against the raw 84-frame capture</strong> in\n<code>output/Lecture_29 - Bonus Module Agentic AI Part 3/</code> per this project's standard methodology\n(see project memory <code>slides-deduped-is-lossy</code>) — a fabricated numeric detail was found and\nremoved (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§15.3\" role=\"link\" tabindex=\"0\">§15.3</a>), and three real gaps were found and added: the production-gap framing statistics\n(<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>), the &quot;3–10x engineer amplification&quot; table (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>), and the full evaluation-benchmarks +\n&quot;where agents are heading&quot; material (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>a). Instructor: <strong>Harsh Agarwal</strong>, Applied Scientist,\nInternational ML team at Amazon — no name overlay was visible in this deck's own frames, but\nLecture 28 (same module) has a confirmed nameplate reading &quot;Harsh Agarwal,&quot; and all three parts\nare almost certainly delivered by the same instructor. This is the capstone module — it covers\nhow single agents become orchestrated teams, how workflows chain agents into reliable pipelines,\nwhy code agents have an unfair advantage, and what it takes to ship agents to production safely.</p>\n</blockquote>\n<hr>\n</div><section id=\"agentic-ai-29-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain why multi-agent systems outperform single agents</strong> — specialization, parallelism, robustness, scalability.</li>\n<li><strong>Choose a multi-agent topology</strong> — supervisor, peer-to-peer, or hierarchical — based on control requirements.</li>\n<li><strong>Select a communication pattern</strong> — message passing, shared blackboard, or structured handoff — based on state needs.</li>\n<li><strong>Explain the A2A protocol</strong> — Google's agent-to-agent standard: agent cards, task lifecycle, streaming.</li>\n<li><strong>Implement four workflow patterns</strong> — sequential, parallel fan-in/fan-out, conditional routing, iterative loop.</li>\n<li><strong>Chain all four patterns</strong> in a real system (the PR review pipeline).</li>\n<li><strong>Explain the ReAct framework</strong> — thought → action → observe → repeat — and why it's the most important pattern in agentic AI.</li>\n<li><strong>Describe human-in-the-loop patterns</strong> — approval gates, escalation, feedback loops.</li>\n<li><strong>Explain why code agents have an unfair advantage</strong> — verifiable output, rich tooling, structured environment, high economic value.</li>\n<li><strong>Describe the code agent's feedback loop</strong> — read → plan → edit → test → repeat — and why it converges in 2–5 iterations.</li>\n<li><strong>Map the code agent landscape in 2026</strong> — Claude Code, Codex, Cursor/Windsurf, Devin, Computer Use.</li>\n<li><strong>Explain production reliability patterns</strong> — retries with backoff, fallback models, circuit breakers, idempotency.</li>\n<li><strong>Design cost management</strong> — token budgets, model routing, caching, early stopping.</li>\n<li><strong>Implement observability</strong> — trajectory logging, distributed tracing, anomaly detection.</li>\n<li><strong>Know when NOT to use an agent</strong> — low latency, high stakes without verification, simple one-step tasks.</li>\n<li><strong>Explain prompt injection</strong> — direct vs. indirect, why it's fundamentally hard, defense-in-depth.</li>\n<li><strong>Design defense-in-depth</strong> — input filtering → sandboxing → tool permissions → output validation + kill switch.</li>\n<li><strong>Choose a framework</strong> — LangGraph, CrewAI, Claude Agent SDK, LlamaIndex — based on use case.</li>\n<li><strong>Build a RAG agent in 20 lines</strong> — LangGraph with retrieve → reason → tool → respond.</li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-29-s1\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Parts 1 and 2 built a single capable agent: it thinks (ReAct), acts (tools), remembers (memory), and connects (MCP). Now the question:</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;What happens when you give this model tools, put them in teams, and ship them to a real user?&quot;</em></p>\n</blockquote>\n<pre class=\"code\"><code>PART 1          PART 2          PART 3 (this lecture)\n━━━━━━━━        ━━━━━━━━        ━━━━━━━━━━━━━━━━━━━━━━\nOne agent       One agent       Many agents\nThinks          Acts + Remembers Coordinated\nReasoning       Tools + Memory  Workflows + Production</code></pre>\n<p>This module covers four blocks:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Block</th>\n<th>Topics</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Multi-Agent Systems</strong></td>\n<td>Why multiple agents, topologies, communication, A2A</td>\n</tr>\n<tr>\n<td><strong>Workflows</strong></td>\n<td>Sequential, parallel, conditional, loop patterns; ReAct in production</td>\n</tr>\n<tr>\n<td><strong>Code Agents</strong></td>\n<td>Why code works, edit-test-fix loop, landscape 2026</td>\n</tr>\n<tr>\n<td><strong>Production</strong></td>\n<td>Reliability, cost, observability, safety, guardrails</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n</section><section id=\"agentic-ai-29-s2\" data-title=\"Part A — Multi-Agent Systems\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part A — Multi-Agent Systems</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<hr>\n</section><section id=\"agentic-ai-29-s3\" data-title=\"Why Multiple Agents?\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">Why Multiple Agents?</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Why does your WhatsApp group outperform any single genius? One friend finds the restaurant,\nanother checks reviews, a third books the table.&quot;</em></p>\n</blockquote>\n<p>Four reasons:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Reason</th>\n<th>What it means</th>\n<th>Analogy</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Specialization</strong></td>\n<td>Each agent does one thing well</td>\n<td>Dedicated backend dev vs. mediocre full-stack</td>\n</tr>\n<tr>\n<td><strong>Parallelism</strong></td>\n<td>Independent tasks run concurrently</td>\n<td>Splitting a literature review among classmates</td>\n</tr>\n<tr>\n<td><strong>Robustness</strong></td>\n<td>Agents verify each other's work</td>\n<td>Peer code review, but instant and tireless</td>\n</tr>\n<tr>\n<td><strong>Scalability</strong></td>\n<td>Add an agent for new capability; no retraining</td>\n<td>Adding a new microservice</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A focused prompt outperforms a kitchen-sink prompt every time.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-29-s4\" data-title=\"Multi-Agent Topologies\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Multi-Agent Topologies</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Three fundamental patterns — the choice depends on how much control you need:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Topology</th>\n<th>Structure</th>\n<th>Analogy</th>\n<th>Upside</th>\n<th>Downside</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Supervisor</strong></td>\n<td>One orchestrator delegates to workers</td>\n<td>Principal engineer at Amazon</td>\n<td>Clear hierarchy, centralized control</td>\n<td>Bottleneck at supervisor</td>\n</tr>\n<tr>\n<td><strong>Peer-to-Peer</strong></td>\n<td>Agents communicate directly; no boss</td>\n<td>Random Slack channel</td>\n<td>Flexibility, self-organization</td>\n<td>Hard to control, risk of infinite loops</td>\n</tr>\n<tr>\n<td><strong>Hierarchical</strong></td>\n<td>Tree of supervisors and sub-managers</td>\n<td>Amazon org chart: VP → Director → Manager → SDE</td>\n<td>Scales to complex orgs</td>\n<td>Escalation overhead</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Think of Amazon's org chart: VP to Director to Manager to SDE. If your skip-level doesn't\nknow, escalate.&quot;</em></p>\n</blockquote>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Correction to an earlier correction, found during this module's enhancement pass.</strong> A prior\nquality-review note (kept in <code>QUALITY_REVIEW.md</code> as an audit trail) claimed a sub-agent-reported\n&quot;researcher/coder/reviewer with <code>depends_on</code>&quot; dispatch code example could not be found on the\ndeck, after checking <code>slide_005.jpg</code>–<code>slide_010.jpg</code>, <code>slide_014.jpg</code>, <code>slide_016.jpg</code>, and\n<code>slide_024.jpg</code>. That investigation searched the wrong slide range: the code <strong>is</strong> on the deck,\nat <code>slide_018.jpg</code> (&quot;What multi-agent delegation looks like,&quot; dedup slide 9/35) — directly\nre-opened and confirmed during this pass. The real code:</p>\n<pre class=\"code\"><code>supervisor.dispatch([\n  { agent: &quot;researcher&quot;,\n    task: &quot;Find top 5 papers on RLHF published 2025+&quot;,\n    return: &quot;structured_citations&quot; },\n  { agent: &quot;coder&quot;,\n    task: &quot;Implement RLHF reward model from paper #1&quot;,\n    depends_on: &quot;researcher.result[0]&quot; },\n  { agent: &quot;reviewer&quot;,\n    task: &quot;Review code for correctness + security&quot;,\n    depends_on: &quot;coder.output&quot; }\n]);\n// Parallel where possible, sequential where dependent</code></pre>\n<p>The slide's own caption: <em>&quot;Notice: the supervisor doesn't do the work — it routes, tracks\ndependencies, and aggregates. Agents run in parallel when they can, sequentially when they\nmust.&quot;</em> In this specific example, every task actually depends on the previous one\n(<code>coder</code> needs <code>researcher</code>'s output, <code>reviewer</code> needs <code>coder</code>'s output), so despite the\n&quot;parallel where possible&quot; framing, this particular dispatch runs fully sequentially — a useful\ndetail to notice, since it shows the supervisor's dependency tracking doing real work (correctly\n<em>not</em> parallelizing a chain), not just its ability to fan out independent tasks. This is the\ndeck's actual concrete illustration of Supervisor delegation, alongside the Supervisor+worker\nnetwork diagram on <code>slide_016.jpg</code> (&quot;Real systems use a hybrid approach&quot;) already reflected in\nthis file's &quot;Hybrid in practice&quot; table below (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>).</p>\n</aside>\n<figure class=\"iv\" id=\"iv-agentic-ai-29-0\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Supervisor dispatch — resolving depends_on&quot;,&quot;concept&quot;:&quot;A supervisor doesn't just fan tasks out — it reads a dependency graph and decides what can run now vs. what must wait&quot;,&quot;control&quot;:&quot;Step through the dispatch list (researcher → coder → reviewer) one task at a time&quot;,&quot;observe&quot;:&quot;Researcher starts immediately (no depends_on); coder stays blocked until researcher.result[0] exists; reviewer stays blocked until coder.output exists — so despite being dispatched together, the three run one after another, not in parallel&quot;,&quot;insight&quot;:&quot;\\&quot;Parallel where possible, sequential where dependent\\&quot; is a real scheduling decision, not a slogan — a chain of depends_on collapses the \\&quot;fan out\\&quot; case into the \\&quot;one after another\\&quot; case, and the supervisor's job is to compute that automatically from the graph, not to have a human hardcode it&quot;,&quot;fallback&quot;:&quot;The dispatch code and its dependency chain are given in full above — trace it by hand: researcher has no depends_on (runs first); coder's depends_on: \\&quot;researcher.result[0]\\&quot; names researcher; reviewer's depends_on: \\&quot;coder.output\\&quot; names coder — so the order is forced to researcher → coder → reviewer regardless of dispatch order.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Supervisor dispatch — resolving depends_on</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>A supervisor doesn't just fan tasks out — it reads a dependency graph and decides what can run now vs. what must wait</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through the dispatch list (researcher → coder → reviewer) one task at a time</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Researcher starts immediately (no depends_on); coder stays blocked until researcher.result[0] exists; reviewer stays blocked until coder.output exists — so despite being dispatched together, the three run one after another, not in parallel</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>\"Parallel where possible, sequential where dependent\" is a real scheduling decision, not a slogan — a chain of depends_on collapses the \"fan out\" case into the \"one after another\" case, and the supervisor's job is to compute that automatically from the graph, not to have a human hardcode it</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The dispatch code and its dependency chain are given in full above — trace it by hand: researcher has no depends_on (runs first); coder's depends_on: \"researcher.result[0]\" names researcher; reviewer's depends_on: \"coder.output\" names coder — so the order is forced to researcher → coder → reviewer regardless of dispatch order.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"agentic-ai-29-s5\" data-title=\"Communication Patterns\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Communication Patterns</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>How agents talk to each other — three patterns with different trade-offs:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pattern</th>\n<th>How it works</th>\n<th>Analogy</th>\n<th>Upside</th>\n<th>Downside</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Message passing</strong></td>\n<td>Structured typed messages between agents</td>\n<td>Microservice API</td>\n<td>Clean interface, decoupled</td>\n<td>No shared state; every context must be explicitly passed</td>\n</tr>\n<tr>\n<td><strong>Shared blackboard</strong></td>\n<td>Common state object all agents read/write</td>\n<td>Shared Google Doc</td>\n<td>Great for iterative refinement; everyone sees full picture</td>\n<td>Race conditions, state conflicts, hard to debug</td>\n</tr>\n<tr>\n<td><strong>Structured handoff</strong></td>\n<td>Explicit task delegation with full context</td>\n<td>Relay race baton pass</td>\n<td>Clear ownership at every moment; easy to retry</td>\n<td>Context serialized at each boundary</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;In practice, real systems use a hybrid approach — they mix all three.&quot;</em></p>\n</blockquote>\n<h3>Hybrid in practice</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Framework</th>\n<th>Pattern used</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Claude Code</strong></td>\n<td>Handoffs for tool calls, messages between sub-agents, shared context via conversation</td>\n</tr>\n<tr>\n<td><strong>LangGraph</strong></td>\n<td>Blackboard (graph state object) with conditional edges as routers and checkpoints for recovery</td>\n</tr>\n<tr>\n<td><strong>CrewAI</strong></td>\n<td>Role-based agent delegation with shared memory across the crew; sequential and parallel modes</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n</section><section id=\"agentic-ai-29-s6\" data-title=\"A2A Protocol (Agent-to-Agent)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">A2A Protocol (Agent-to-Agent)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Google's open protocol for agents to discover, communicate, and collaborate regardless of\nframework.</p>\n<h3>4.1 Core concepts [slide 14]</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Concept</th>\n<th>What it is</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Agent Card</strong></td>\n<td>JSON &quot;business card&quot; — name, skills, endpoint, auth</td>\n</tr>\n<tr>\n<td><strong>Task object</strong></td>\n<td>Unit of work with standard lifecycle: submitted → working → done/failed</td>\n</tr>\n<tr>\n<td><strong>Streaming</strong></td>\n<td>Real-time progress updates between agents</td>\n</tr>\n<tr>\n<td><strong>Push notifications</strong></td>\n<td>Agents notify each other of state changes</td>\n</tr>\n<tr>\n<td><strong>Discovery</strong></td>\n<td>Agents can find other agents' capabilities without hardcoding endpoints in advance</td>\n</tr>\n<tr>\n<td><strong>Interop</strong></td>\n<td>The whole point of the protocol — agents built in different frameworks (LangGraph, CrewAI, custom) can still talk to each other</td>\n</tr>\n<tr>\n<td><strong>HTTP+SSE</strong></td>\n<td>A2A's transport for streaming task updates — the same idea MCP uses for its own remote transport (<a class=\"xref\" data-xref-lec=\"agentic-ai-02\" data-xref=\"Part 2 §14.1\" role=\"link\" tabindex=\"0\">Part 2 §14.1</a>)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The deck's own Agent Card example</strong> [slide 14] — the &quot;business card&quot; a supervisor agent might\nread to discover what a specialist agent can do:</p>\n<pre class=\"code code-json\"><code class=\"language-json\">// Agent Card (like a business card for an AI agent)\n{\n  &quot;name&quot;: &quot;research-agent&quot;,\n  &quot;description&quot;: &quot;Finds and summarizes academic papers&quot;,\n  &quot;url&quot;: &quot;https://research-agent.example.com&quot;,\n  &quot;capabilities&quot;: [&quot;search&quot;, &quot;summarize&quot;, &quot;cite&quot;],\n  &quot;authentication&quot;: { &quot;type&quot;: &quot;bearer&quot; }\n}\n\n// Any A2A-compatible agent can now discover and call this one</code></pre>\n<p>An orchestrator agent built in a completely different framework can read this card, see it can\ncall <code>search</code>/<code>summarize</code>/<code>cite</code>, and dispatch a task — without either side needing to know what\nthe other is built on.</p>\n<h3>4.2 Why it matters</h3>\n<p>Right now, if you build an agent in LangGraph and I build one in CrewAI, they can't talk.\nA2A is trying to be the HTTP of agent communication — a universal protocol everyone agrees on.</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;It's early, but it's the direction things are heading.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-29-s7\" data-title=\"Part B — Workflows\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part B — Workflows</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<hr>\n</section><section id=\"agentic-ai-29-s8\" data-title=\"Four Workflow Patterns\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Four Workflow Patterns</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>These are control flows applied to agents — if you write code, you already know them:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pattern</th>\n<th>What it does</th>\n<th>When to use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Sequential</strong></td>\n<td>A → B → C; pipeline where each agent adds/transforms</td>\n<td>Strict ordering required</td>\n</tr>\n<tr>\n<td><strong>Parallel (fan-out/fan-in)</strong></td>\n<td>Dispatch simultaneously, aggregate at end</td>\n<td>Independent sub-tasks</td>\n</tr>\n<tr>\n<td><strong>Conditional (router)</strong></td>\n<td>If X → agent A; elif Y → agent B; else → agent C</td>\n<td>Branching logic needed</td>\n</tr>\n<tr>\n<td><strong>Iterative (loop)</strong></td>\n<td>While not done: generate → test → fix; repeat</td>\n<td>Need convergence on quality</td>\n</tr>\n</tbody>\n</table></div>\n<figure class=\"ascii\"><pre>Sequential:     A → B → C (total latency = sum of steps)\n\nParallel:       ┌→ A →┐\n                ├→ B →├→ aggregate (latency = slowest step)\n                └→ C →┘\n\nConditional:    input → router → if bug: fix agent\n                         → if clean: approval\n\nLoop:           generate → test → fail? → fix → test → pass? → done\n                    ↑                              │\n                    └──────────────────────────────┘</pre></figure>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The key: you need a clear stopping condition or you burn your money forever.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-29-s9\" data-title=\"Putting It All Together: The PR Review Pipeline\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Putting It All Together: The PR Review Pipeline</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>A real system chains all four patterns into one flow:</p>\n<figure class=\"ascii\"><pre>┌─────────────────────────────────────────────────────────────┐\n│  STEP 1: PARALLEL FAN-OUT                                   │\n│  Lint + Type-check + Security scan (all run at once)        │\n│                         ↓                                   │\n│  STEP 2: CONDITIONAL ROUTER                                 │\n│  Found bugs? → Fix agent │ Clean? → Approval                │\n│                         ↓                                   │\n│  STEP 3: REACT LOOP                                         │\n│  Think → Act (fix) → Observe (test) → loop until green     │\n│                         ↓                                   │\n│  STEP 4: SEQUENTIAL FINISH                                  │\n│  Human review → Merge → Deploy                              │\n└─────────────────────────────────────────────────────────────┘</pre></figure>\n<p>Each step uses a different workflow pattern — combined into one pipeline.</p>\n<hr>\n</section><section id=\"agentic-ai-29-s10\" data-title=\"The ReAct Framework in Production\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">The ReAct Framework in Production</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>The most important pattern in agentic AI right now:</p>\n<figure class=\"ascii\"><pre>THOUGHT: &quot;Test failed because of null pointer on line 42.\n          I should add a null check.&quot;\n    ↓\nACTION:  Edit file — add null check on line 42\n    ↓\nOBSERVE: Run tests → still failing? → new error on line 67\n    ↓\nTHOUGHT: &quot;Line 67 issue is upstream — need to fix the parent function&quot;\n    ↓\nACTION:  Edit parent function\n    ↓\nOBSERVE: Tests pass → done</pre></figure>\n<p><strong>In one line:</strong> Think → Act → Observe → Repeat</p>\n<p>This tight loop is what makes agents converge instead of failing randomly. The agent has\nspecific, actionable information at each step, and each loop narrows the gap.</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;This is the most important pattern in agentic AI right now.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-29-s11\" data-title=\"Human-in-the-Loop Patterns\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Human-in-the-Loop Patterns</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Full autonomy is rarely appropriate. Three checkpoint patterns:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pattern</th>\n<th>When</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Approval gate</strong></td>\n<td>Before irreversible actions</td>\n<td>&quot;About to delete production table — confirm?&quot;</td>\n</tr>\n<tr>\n<td><strong>Escalation</strong></td>\n<td>When agent is uncertain (below confidence threshold)</td>\n<td>&quot;Two valid approaches — which do you want?&quot;</td>\n</tr>\n<tr>\n<td><strong>Feedback loop</strong></td>\n<td>Human corrects, agent adapts</td>\n<td>&quot;Not quite — change this part&quot; → agent incorporates</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The agent that escalates appropriately is more useful than the one that guesses and gets\nit wrong half the time.&quot;</em></p>\n</blockquote>\n<p><strong>The trajectory:</strong> gradually increasing autonomy as trust builds — like training a junior\ndeveloper. At first you correct a lot; over time they internalize your standards.</p>\n<hr>\n</section><section id=\"agentic-ai-29-s12\" data-title=\"Part C — Code Agents\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part C — Code Agents</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<hr>\n</section><section id=\"agentic-ai-29-s13\" data-title=\"Why Code Agents Have an Unfair Advantage\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Why Code Agents Have an Unfair Advantage</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>$600B+ is being invested in AI. Where's the first real ROI? <strong>Code agents.</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Why code works</th>\n<th>General-purpose agent</th>\n<th>Code agent</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Verifiability</strong></td>\n<td>&quot;Seems reasonable&quot;</td>\n<td>Tests pass or don't. No ambiguity</td>\n</tr>\n<tr>\n<td><strong>Rich tooling</strong></td>\n<td>Build everything from scratch</td>\n<td>LSP, debuggers, git, linters — decades of tools for free</td>\n</tr>\n<tr>\n<td><strong>Structured environment</strong></td>\n<td>Messy natural language</td>\n<td>File systems, ASTs, dependency graphs — machine-readable</td>\n</tr>\n<tr>\n<td><strong>Economic value</strong></td>\n<td>Hard to quantify</td>\n<td>Software engineering is expensive — even 30% automation saves billions across the industry</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Amazon, Google, and Microsoft all report 25–50% of new code is now AI-assisted.&quot;</em></p>\n</blockquote>\n<p>🧪 <strong>What this looks like concretely — amplifying engineers 3–10x, not replacing them:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Before: manual everything</th>\n<th>After: agent-assisted</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Write boilerplate</td>\n<td>Write boilerplate by hand</td>\n<td><strong>&quot;Add pagination to this endpoint&quot;</strong> — one-line prompt</td>\n</tr>\n<tr>\n<td>Debug</td>\n<td><strong>Debug by staring at logs for hours</strong></td>\n<td>Agent reads codebase, writes code, runs tests</td>\n</tr>\n<tr>\n<td>Context-switching</td>\n<td>Context-switch between 12 files mentally</td>\n<td><strong>You review the PR diff, not write it</strong></td>\n</tr>\n<tr>\n<td>Workflow</td>\n<td>Google + StackOverflow + copy-paste + pray</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Throughput</strong></td>\n<td>2 PRs/day</td>\n<td><strong>10 PRs/day — same quality</strong></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this table is the concrete version of <a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s &quot;unfair advantage.&quot;</strong> Verifiability\n(tests pass or don't) is <em>why</em> an agent can be trusted to do the boilerplate and debugging steps\nunsupervised — the same reason a search engine can't safely replace a paragraph of writing but a\ntest suite can safely gate a code edit. The engineer's role shifts from typing every line to\nreviewing and directing — architecture, product judgment, and verifying the agent's output remain\nsquarely human.</p>\n</aside>\n<h3>The core loop: Edit → Test → Fix</h3>\n<figure class=\"ascii\"><pre>Read Code → Plan Edit → Write Code → Run Tests\n    ↑                                      │\n    └──── tests fail? ←───────────────────┘\n                                    tests pass → done</pre></figure>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Without the loop</th>\n<th>With the loop</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Write code once, hope it works</td>\n<td>Write → test → fail → read error → fix → test again</td>\n</tr>\n<tr>\n<td>No feedback signal</td>\n<td>Precise, actionable feedback at every step</td>\n</tr>\n<tr>\n<td>Quality = first-shot accuracy</td>\n<td>Converges in 2–5 iterations</td>\n</tr>\n<tr>\n<td>~70% for simple tasks, ~20% for complex</td>\n<td>Solves ~55% of real GitHub issues (SWE-bench)</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;That's why code agents work and 'write me an essay' agents plateau. The code agent gets\nprecise, immediate, machine-generated feedback on exactly what's wrong and exactly where.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-29-s14\" data-title=\"The Code Agent Landscape in 2026\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">The Code Agent Landscape in 2026</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Agent</th>\n<th>Type</th>\n<th>Key feature</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Claude Code</strong> (Anthropic)</td>\n<td>CLI agent, MCP-based</td>\n<td>Terminal, IDE, web app; multi-agent workflows built in</td>\n</tr>\n<tr>\n<td><strong>Codex</strong> (OpenAI)</td>\n<td>Cloud agent, sandboxed</td>\n<td>Deep GitHub integration, parallel task execution in isolated containers</td>\n</tr>\n<tr>\n<td><strong>Cursor / Windsurf</strong></td>\n<td>IDE-integrated</td>\n<td>Agent mode inside editor, inline diff suggestions, background agents</td>\n</tr>\n<tr>\n<td><strong>Devin</strong> (Cognition)</td>\n<td>Fully autonomous SWE agent</td>\n<td>Browser + terminal + editor; <strong>works on Slack like a teammate</strong>; $2B+ valuation (2025)</td>\n</tr>\n<tr>\n<td><strong>SWE-bench SOTA</strong> (benchmark, not a single product)</td>\n<td>Real GitHub issues</td>\n<td><strong>~55% on Verified</strong>, up from ~3% in 2023 — still hard: large refactors, design decisions remain human</td>\n</tr>\n<tr>\n<td><strong>Computer Use</strong></td>\n<td>Screenshot → understand → click</td>\n<td>Claude Computer Use, OpenAI Operator; legacy systems, testing, RPA; measured on <strong>WebArena, OSWorld</strong> benchmarks</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Corrected against the source slide</strong> [slide 41] — the notes previously merged Devin and\n&quot;SWE-bench SOTA&quot; into one row and misattributed Devin's &quot;works on Slack like a teammate&quot; line to\nComputer Use. On the deck, Devin and the SWE-bench SOTA figure are two separate cards, and\nComputer Use's real bullets are about screenshot-driven UI automation and the WebArena/OSWorld\nbenchmarks — it makes no claim about working on Slack.</p>\n</aside>\n<p><strong>What's still hard:</strong> large refactors spanning dozens of files, design decisions (queue vs.\ndatabase?), legacy systems, understanding product requirements and team conventions.</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The meta skill of 2026 isn't typing code faster. It's knowing what to build, how to\ndecompose it into agent-sized tasks, how to verify the output, and when to override the\nagent's judgment.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-29-s15\" data-title=\"Part D — Production\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part D — Production</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Great demo. Ships to production. Costs $47 per user per day. Crashes at 2am.&quot;</em> <strong>90% of agent\nprojects never leave the prototype stage.</strong> The gap isn't engineering intelligence — it's cost\ncontrol, reliability, and observability. <strong>The boring stuff is what makes it real.</strong></p>\n</blockquote>\n<p>This section is the answer to that gap: the same unglamorous, load-bearing engineering that makes\nany backend system trustworthy, applied to agents specifically.</p>\n<hr>\n</section><section id=\"agentic-ai-29-s16\" data-title=\"Reliability Patterns\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">Reliability Patterns</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>LLM APIs fail, timeout, return garbage. Rate limits hit at the worst moment. Tools go down.\nThe same patterns backend engineers have used for decades:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pattern</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Retries with exponential backoff</strong></td>\n<td>Wait 1s, 2s, 4s... don't hammer a struggling service</td>\n</tr>\n<tr>\n<td><strong>Fallback model</strong></td>\n<td>Primary too slow/down → route to faster/cheaper alternative; quality drops 10% but user gets a response</td>\n</tr>\n<tr>\n<td><strong>Circuit breaker</strong></td>\n<td>Tool failed 5× in a row → stop calling for 30s; don't cascade downstream failure</td>\n</tr>\n<tr>\n<td><strong>Idempotency</strong></td>\n<td>Every action safe to retry; if send-email called twice, only send once</td>\n</tr>\n<tr>\n<td><strong>Timeouts</strong></td>\n<td>Bound every LLM call — never let a hung call hang the whole agent</td>\n</tr>\n</tbody>\n</table></div>\n<hr>\n</section><section id=\"agentic-ai-29-s17\" data-title=\"Cost Management\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">Cost Management</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Agents are expensive. Every reasoning step is tokens. A complex task might involve 50\nback-and-forth turns, each with growing context, at $15/M output tokens for a frontier model.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Strategy</th>\n<th>How it works</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Token budgets</strong></td>\n<td>Hard ceiling per task (e.g., <strong>50,000 tokens</strong>); return best attempt if exceeded</td>\n</tr>\n<tr>\n<td><strong>Model routing</strong></td>\n<td>Classification → small/fast model (Haiku); complex reasoning → big model (Opus)</td>\n</tr>\n<tr>\n<td><strong>Caching</strong></td>\n<td>Same question twice → don't recompute; <strong>prompt caching saves ~90% on repeated context</strong></td>\n</tr>\n<tr>\n<td><strong>Early stopping</strong></td>\n<td>Solution passes tests after 2 iterations? Stop. Don't iterate to 5.</td>\n</tr>\n<tr>\n<td><strong>Cost alerts</strong></td>\n<td>Alert <em>before</em> a runaway loop bankrupts you, not after</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Good enough is a valid answer.&quot;</em></p>\n</blockquote>\n<p>🧪 <strong>The deck's own worked config</strong> [slide 53] — a concrete reliability + cost setup combining\n<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a> and <a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a> into one object:</p>\n<pre class=\"code\"><code>config = {\n  max_tokens_per_task: 50_000,       // hard budget\n  primary_model: &quot;claude-opus-4&quot;,    // quality\n  fallback_model: &quot;claude-haiku-4&quot;,  // cost-effective fallback\n  max_retries: 3,\n  timeout_ms: 30_000\n}</code></pre>\n<p>This single config block encodes four separate patterns at once: a <strong>token budget</strong> (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>), a\n<strong>fallback model</strong> (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>), <strong>retries</strong> (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>), and a <strong>timeout</strong> (<a class=\"xref\" data-xref-lec=\"agentic-ai-29\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>) — production reliability and\ncost management are usually the same few knobs turned together, not separate systems.</p>\n<hr>\n</section><section id=\"agentic-ai-29-s18\" data-title=\"Observability\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">Observability</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Agents do unpredictable things. You need full visibility:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Tool</th>\n<th>What it provides</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Trajectory logging</strong></td>\n<td>Every thought, tool call, response, decision point — not just the final answer</td>\n</tr>\n<tr>\n<td><strong>Distributed tracing</strong></td>\n<td>Single trace ID following a request across LLM → tool → service → database</td>\n</tr>\n<tr>\n<td><strong>Anomaly detection</strong></td>\n<td>Loop detection (the same call repeating with no progress) and cost spikes flagged automatically</td>\n</tr>\n<tr>\n<td><strong>Dashboards</strong></td>\n<td>Latency percentiles + token usage tracked over time</td>\n</tr>\n<tr>\n<td><strong>Audit trails</strong></td>\n<td>Human-readable logs of every action taken, for compliance</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Corrected against the source slide</strong> [slide 56] — the notes previously invented specific\nanomaly-detection numbers (&quot;$20 in tokens,&quot; &quot;called 10× in a row&quot;) that do not appear anywhere on\nthe deck; the slide names the anomaly <em>types</em> (loop detection, cost spikes) with no numeric\nthresholds attached. The dashboards and audit-trail rows were also previously missing entirely.</p>\n</aside>\n<hr>\n</section><section id=\"agentic-ai-29-s19\" data-title=\"When NOT to Use an Agent\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">14</span>\n      <span class=\"sec-t\">When NOT to Use an Agent</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-29-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Scenario</th>\n<th>Why not</th>\n<th>Better approach</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Deterministic tasks</td>\n<td>The logic is fully known in advance — no LLM needed</td>\n<td>Just write the code</td>\n</tr>\n<tr>\n<td>Low latency (&lt; 50ms)</td>\n<td>Can't afford 3 rounds of LLM reasoning</td>\n<td>Direct API call</td>\n</tr>\n<tr>\n<td>High stakes, no verification</td>\n<td>Irreversible action, no automated correctness check</td>\n<td>Human in the loop</td>\n</tr>\n<tr>\n<td>Simple one-step task / simple retrieval</td>\n<td>Agent overhead adds latency and cost for no benefit</td>\n<td>Template/database query, or RAG without the agent loop</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Use an agent when the task requires reasoning across multiple steps with tool use. If it's\none step, one tool, one answer — skip the agentic framework.&quot;</em></p>\n</blockquote>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>The deck's own quotable rule of thumb</strong> [slide 56]: <em>&quot;if the task is deterministic and you\ncan write the logic in &lt;50 lines, skip the agent. Agents shine on ambiguous, multi-step,\ntool-rich problems.&quot;</em> This is the sharpest single test in the whole modul
