e human approves each one before it's applied. An agent owns the entire loop — it decides\nwhat to do next, executes tool calls, observes results, and determines when the task is complete\nwithout human intervention at each step. The key distinction is who controls the next step.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does error compounding make long-horizon agents unreliable, and what's the mathematical relationship?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>If each step has success probability p, the end-to-end success over n steps is p^n. At p=0.95\nand n=40, success drops to ~12.9%. At n=100, it's 0.6%. This exponential decay means that even\nindividually reliable steps produce unreliable agents over long horizons. The solution isn't\nmaking each step slightly better — it's adding guardrails (unit tests, confidence gates, human\nescalation) that catch and correct errors before they compound.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain the ReAct framework and why all three components (thought, action, observation) are necessary.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>ReAct cycles through Thought → Action → Observation. Thought prevents random tool calls by\ngrounding each action in reasoning. Action prevents hallucination by requiring the LLM to call\na real tool instead of making things up. Observation feeds real-world results back, preventing\nthe LLM from operating on stale or incorrect information. Remove thought → random tool calls.\nRemove action → hallucinated outputs. Remove observation → the LLM never sees real results and\ncan't correct course.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">How does the Reflection framework enable learning without retraining?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>After a task fails, the LLM performs retrospective analysis to identify where/why it went wrong.\nThis analysis is stored in a memory bank (just text). On subsequent attempts, the memory is\ninjected into the prompt, giving the LLM explicit knowledge of past failures. The model weights\nnever change — all learning happens through context engineering. This is essentially a form of\nin-context learning / prompt-level RL.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">When should you use Tree of Thought instead of a single chain of thought?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Tree of Thought is better when: (1) the answer is not deterministic — multiple valid paths exist;\n(2) early steps can be validated to prune bad branches before committing; (3) backtracking is\npossible (you can undo a wrong step). It outperforms best-of-N chain-of-thought because it\nprunes invalid branches early rather than sampling complete chains. The tradeoff is higher token\ncost, though the gap narrows with larger budgets.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Design the confidence threshold for a customer-service agent that can issue refunds.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Issuing refunds is semi-reversible (can be corrected but costs trust/money). Set a confidence\nthreshold based on the cost asymmetry: asking the human for approval costs ~1 unit (time),\nwhile a wrong refund costs ~10 units (money + trust). The sweet spot is where total cost\n(minimize human interruptions + minimize wrong actions × 10) is minimized — typically around\n0.4-0.5 threshold. Below this: ask human. Above: execute automatically. Always escalate for\nrefunds above a dollar threshold regardless of confidence.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a shows a classical planner beating every LLM on a plan-validity benchmark. Does this mean\nLLMs should never be used for planning?&quot;</em> — no; the benchmark isolates plan <em>feasibility</em>\nspecifically, which classical planners are built to guarantee. LLMs remain far better at the step\nthe classical planner can't do at all: proposing a plausible plan from an ambiguous, natural-\nlanguage goal in an environment with no formal symbolic model. The practical answer the lecture\nitself gives is Plan-and-Execute's Replan loop — use the LLM to propose, then verify/repair rather\nthan trusting the proposal outright.</li>\n<li><em>&quot;Error compounding (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>) assumes each step's failure is independent. When would that assumption\nbreak down, and which direction would it bias the 0.95ⁿ estimate?&quot;</em> — if failures are <em>correlated</em>\n(e.g. one bad early tool-call result systematically confuses every later step, rather than each\nstep failing independently), the true end-to-end success rate is typically <em>worse</em> than the\nindependent-steps estimate suggests, since a single upstream mistake can poison many downstream\nsteps at once rather than contributing one independent 5% failure chance.</li>\n</ul>\n<h3>Whiteboard-ready derivation</h3>\n<p><strong>The 0.95ⁿ error-compounding curve</strong> — <a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>: if each of <math data-tex=\"n\"><mi>n</mi></math> steps succeeds independently with\nprobability <math data-tex=\"p\"><mi>p</mi></math>, the probability all <math data-tex=\"n\"><mi>n</mi></math> succeed is <math data-tex=\"p^n\"><msup><mi>p</mi><mi class=\"tml-med-pad\">n</mi></msup></math> (independent events multiply). At <math data-tex=\"p=0.95\"><mrow><mi>p</mi><mo>=</mo><mn>0.95</mn></mrow></math>:\n<math data-tex=\"n=10 \\to 0.95^{10}\\approx0.60\"><mrow><mi>n</mi><mo>=</mo><mn>10</mn><mo>→</mo><msup><mn>0.95</mn><mn>10</mn></msup><mo>≈</mo><mn>0.60</mn></mrow></math>; <math data-tex=\"n=40\\to0.95^{40}\\approx0.129\"><mrow><mi>n</mi><mo>=</mo><mn>40</mn><mo>→</mo><msup><mn>0.95</mn><mn>40</mn></msup><mo>≈</mo><mn>0.129</mn></mrow></math>; <math data-tex=\"n=100\\to0.95^{100}\\approx0.006\"><mrow><mi>n</mi><mo>=</mo><mn>100</mn><mo>→</mo><msup><mn>0.95</mn><mn>100</mn></msup><mo>≈</mo><mn>0.006</mn></mrow></math> —\nreproduce these by hand and confirm against <a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>'s table.</p>\n<h3>Applied scenario — Amazon returns-processing agent</h3>\n<p><strong>Framing:</strong> Amazon wants an agent that reads a customer's return request, checks it against policy,\nand either approves a refund automatically or routes it to a human.</p>\n<p><strong>Why this needs an agent, not a fixed workflow (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>):</strong> the <em>path</em> is genuinely unpredictable — a\nreturn might need a policy lookup, an order-history check, an image-quality check on a &quot;damaged\nitem&quot; photo, and possibly a follow-up question to the customer, in an order that depends on what's\nfound at each step. This isn't a fixed 3-step pipeline; it's exactly the &quot;dynamic, unknown path&quot;\ncase <a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a> says warrants an agent.</p>\n<p><strong>Architecture (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a):</strong> Plan-and-Execute fits well here — a stronger model drafts the overall plan\n(&quot;check policy → check order history → check photo if applicable → decide&quot;), and a cheaper model\nexecutes each step's tool calls. A Replan edge handles the case where, say, the photo-quality check\ncomes back ambiguous and the plan needs to add a customer follow-up step.</p>\n<p><strong>Guardrails (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>):</strong> issuing a refund is a <strong>moderate-cost, not fully reversible</strong> action — apply\n<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6.1\" role=\"link\" tabindex=\"0\">§6.1</a>'s think-vs-act framing: cheap, reversible steps (looking up order history) execute immediately;\nthe final refund decision goes through a confidence threshold (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>) tuned to this specific cost\nasymmetry (a wrongly-denied legitimate return costs customer trust; a wrongly-approved fraudulent\nreturn costs money directly) — not a threshold borrowed from a different task.</p>\n<p><strong>Failure modes:</strong> error compounding (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>) is a real risk across a 4–5 step pipeline — even at 95%\nper-step reliability, a 5-step return-processing chain succeeds only ~77% of the time end to end, so\nvalidate-retry-escalate (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>) at each step matters more than it would for a 1–2 step task.</p>\n<p><strong>What you'd ship:</strong> Plan-and-Execute with a confidence-gated final approval step, unit-test-style\nvalidation on each tool call's output (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>), and an escalation path to a human agent whenever\nconfidence falls below the calibrated threshold or a step fails validation twice.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Customer Obsession</strong> — an agent that escalates an ambiguous return\nrather than guessing protects the customer relationship more than one that always resolves\nautomatically. <strong>Insist on the Highest Standards</strong> — the validate-retry-escalate pattern (<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>)\nexists specifically so a plausible-looking but wrong decision doesn't ship silently.</p>\n<hr>\n</section><section id=\"agentic-ai-27-s11\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>Agent</strong> — an LLM-based system that closes the loop: thinks, acts (tool calls), observes\nresults, and decides the next step autonomously.</li>\n<li><strong>Autonomy ladder</strong> — the four rungs of control-flow structure: L1 tool call (single call) → L2\nmulti-step/ReAct (self-directed loop — where the &quot;do I need an agent?&quot; threshold sits) → L3 plan\n&amp; adapt (plan → execute → replan) → L4 multi-agent (delegation).</li>\n<li><strong>Copilot</strong> — a model that suggests actions but requires human approval before each step.</li>\n<li><strong>Error compounding</strong> — the exponential degradation of success probability over multi-step\ntasks (0.95^n).</li>\n<li><strong>Hallucinated action</strong> — an agent assuming a tool exists that doesn't, then fabricating its\noutput.</li>\n<li><strong>LATS (Language Agent Tree Search)</strong> — Tree of Thought with a more structured, search-guided\nexpansion/scoring/backtracking step, closer to Monte Carlo Tree Search.</li>\n<li><strong>Memory bank</strong> — persistent storage for lessons learned from past failures; injected into\nprompts on retry.</li>\n<li><strong>Plan-and-Execute</strong> — a strong-model Planner drafts the full plan once; a cheap-model Executor\nruns each step; a Replan edge repairs failures. Good plan <em>proposer</em>, poor plan <em>guarantor</em>.</li>\n<li><strong>ReAct</strong> — Reasoning + Acting framework: Think → Act → Observe cycle.</li>\n<li><strong>Reflection</strong> — learning from mistakes via retrospective analysis and memory, without\nretraining.</li>\n<li><strong>Tree of Thought</strong> — exploring multiple reasoning branches with backtracking, pruned by\nvalidation at each step.</li>\n<li><strong>Validate → Retry → Escalate</strong> — the guardrail pattern that prevents infinite loops.</li>\n</ul>\n<hr>\n</section><section id=\"agentic-ai-27-s12\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>What is the key difference between a chatbot, a copilot, and an agent? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Calculate the end-to-end success rate for a 10-step agent where each step is 90% reliable.\nWhat about 95%? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>Why does a &quot;95% reliable step&quot; NOT mean a &quot;95% reliable agent&quot; for a 40-step task? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>When should you use an agent vs. a hardcoded workflow? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Explain the ReAct framework. What goes wrong if you remove the &quot;observation&quot; step? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.1\" role=\"link\" tabindex=\"0\">§5.1</a>)</em></li>\n<li>How does Reflection enable learning without retraining the LLM? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>)</em>\n6a. Why did the classical planner hold 100% success on the Blocksworld benchmark under both\nfamiliar and obfuscated block names, while GPT-4 and Claude 3.5 Sonnet's success rates collapsed\nunder obfuscation? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a)</em></li>\n<li>When is Tree of Thought better than best-of-N chain-of-thought? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.3\" role=\"link\" tabindex=\"0\">§5.3</a>)</em></li>\n<li>Design a confidence threshold system for an agent that can send customer emails. <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)</em></li>\n<li>What is the validate-retry-escalate pattern and why is it essential? <em>(<a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-27-s13\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-27-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>\n<p><strong>Yao et al. (2023), &quot;Tree of Thoughts: Deliberate Problem Solving with Large Language Models&quot;</strong>\n— ✅ verified via WebSearch against the paper's own listing: authors Shunyu Yao, Dian Yu, Jeffrey\nZhao, Izhak Shafran, Thomas L. Griffiths, Yuan Cao, Karthik Narasimhan; arXiv:2305.10601;\npublished NeurIPS 2023. Named on the slides as the Tree of Thought paper. <code>solid</code>.</p>\n</li>\n<li>\n<p><strong>Yao et al. (2023), &quot;ReAct: Synergizing Reasoning and Acting in Language Models&quot;</strong> — ✅ verified\nvia WebSearch: authors Shunyu Yao, Jeffrey Zhao, Dian Yu, Nan Du, Izhak Shafran, Karthik\nNarasimhan, Yuan Cao; arXiv:2210.03629; published ICLR 2023. Named on the slides as the ReAct\nframework. <code>hard</code>. Foundational paper for agentic reasoning.</p>\n</li>\n<li>\n<p><strong>Shinn et al. (2023), &quot;Reflexion: Language Agents with Verbal Reinforcement Learning&quot;</strong> —\n✅ verified via WebSearch: authors Noah Shinn, Federico Cassano, Edward Berman, Ashwin Gopinath,\nKarthik Narasimhan, Shunyu Yao; arXiv:2303.11366; published NeurIPS 2023. Referenced as the\nreflection framework. <code>solid</code>. The paper on agent self-reflection.</p>\n</li>\n<li>\n<p><strong>Zhou et al. (2023), &quot;Language Agent Tree Search Unifies Reasoning, Acting, and Planning in\nLanguage Models&quot; (LATS)</strong> — ✅ verified via WebSearch: authors Andy Zhou, Kai Yan, Michal\nShlapentokh-Rothman, Haohan Wang, Yu-Xiong Wang; arXiv:2310.04406, posted 2023 (published ICML\n2024). Not named on the slides by full citation, but the deck's own &quot;ToT / LATS&quot; slide names the\nmethod directly. <code>hard</code>.</p>\n</li>\n<li>\n<p><strong>Valmeekam et al. (2023), &quot;PlanBench: An Extensible Benchmark for Evaluating Large Language\nModels on Planning and Reasoning about Change&quot;</strong> — ✅ verified via WebSearch: authors Karthik\nValmeekam, Matthew Marquez, Alberto Olmo, Sarath Sreedharan, Subbarao Kambhampati;\narXiv:2206.10498 (posted 2022, published NeurIPS 2023 Datasets &amp; Benchmarks track — the &quot;2023&quot;\ncitation year tracks its NeurIPS publication). Not named on the slides directly — this remains\nthe likely source of the Blocksworld/VAL-verified benchmark shown in <a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a, given the matching\nmethodology (block-renaming, VAL plan verification), but the attribution to <a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a's specific\nnumbers is still an inference, not a slide-confirmed citation. <code>hard</code>.</p>\n</li>\n</ol>\n<blockquote class=\"aside-quote\">\n<p>The citations above (authors, arXiv IDs, venues) are now confirmed against the papers' own arXiv\nlistings. What remains unconfirmed is only the <em>attribution</em> of item 5 (PlanBench) as the exact\nsource of <a class=\"xref\" data-xref-lec=\"agentic-ai-27\" data-xref=\"§5.2\" role=\"link\" tabindex=\"0\">§5.2</a>a's Blocksworld benchmark — the deck itself never names this paper, so treat that\nspecific link as a plausible, well-matched inference rather than a slide-stated fact.</p>\n</blockquote>\n</section>","sections":[{"id":"agentic-ai-27-s0","num":"","title":"What you'll understand after reading this","mins":1,"kind":"content","part":""},{"id":"agentic-ai-27-s1","num":"","title":"Before we start: what you need to know","mins":2,"kind":"content","part":""},{"id":"agentic-ai-27-s2","num":"","title":"The big picture","mins":1,"kind":"content","part":""},{"id":"agentic-ai-27-s3","num":"1","title":"What Is an Agent?","mins":2,"kind":"content","part":""},{"id":"agentic-ai-27-s4","num":"2","title":"The Autonomy Ladder [slide 13–14]","mins":3,"kind":"content","part":""},{"id":"agentic-ai-27-s5","num":"3","title":"Why Agents Are Hard: Error Compounding","mins":3,"kind":"content","part":""},{"id":"agentic-ai-27-s6","num":"4","title":"When to Use an Agent","mins":1,"kind":"content","part":""},{"id":"agentic-ai-27-s7","num":"5","title":"Agentic Reasoning Frameworks","mins":9,"kind":"content","part":""},{"id":"agentic-ai-27-s8","num":"6","title":"Agent Guardrails","mins":6,"kind":"content","part":""},{"id":"agentic-ai-27-s9","num":"7","title":"Putting it together","mins":2,"kind":"back","part":""},{"id":"agentic-ai-27-s10","num":"","title":"Interview prep — Amazon Applied Scientist","mins":9,"kind":"back","part":""},{"id":"agentic-ai-27-s11","num":"","title":"Glossary","mins":2,"kind":"back","part":""},{"id":"agentic-ai-27-s12","num":"","title":"Check yourself","mins":1,"kind":"back","part":""},{"id":"agentic-ai-27-s13","num":"","title":"Going deeper","mins":3,"kind":"back","part":""}],"interactiveCount":2},{"id":"agentic-ai-28","num":"28","file":"agentic-ai-02","kind":"lecture","title":"Agentic AI — Part 2: Tools, Memory, and MCP","h1":"Agentic AI — Part 2: Tools, Memory, and MCP","subtitle":"Tools, Memory, and MCP","spineLabel":"Part 2","short":"Tools, Memory, and MCP","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime ~32:00. Originally drafted from <code>slides_deduped/</code> (21 slides) with OCR + transcript\nverification, then <strong>audited against the raw 52-frame capture</strong> in\n<code>output/Lecture_28 - Bonus Module Agentic AI Part 2/</code> per this project's standard methodology\n(see project memory <code>slides-deduped-is-lossy</code>) — no missing named framework was found; the deck's\nown three-part structure (Tools/Memory/MCP) matches this file's sections closely. Instructor:\n<strong>Harsh Agarwal</strong>, Applied Scientist, International ML team at Amazon — confirmed from the slide\nnameplate. This module covers the three capabilities that turn a language model into an agent:\ntools to act, memory to persist, and a protocol (MCP) to connect them.</p>\n</blockquote>\n<hr>\n</div><section id=\"agentic-ai-28-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain why LLMs need tools</strong> — the four limitations (knowledge cutoff, compute, action, accuracy) and how tools solve each.</li>\n<li><strong>Describe the tool-calling loop</strong> — declare schema, model selects, code executes, result returns — and why the model never runs anything itself.</li>\n<li><strong>Design good tool schemas</strong> — clear descriptions, minimal required params, enums over free text, examples in descriptions.</li>\n<li><strong>Choose a tool routing strategy</strong> — direct selection vs. router vs. retrieval, based on toolbox size.</li>\n<li><strong>Handle tool failures gracefully</strong> — retry → different tool → ask user, with timeouts and graceful degradation.</li>\n<li><strong>Apply security principles</strong> — least privilege, allowlisting, human-in-the-loop for destructive actions.</li>\n<li><strong>Distinguish context window from memory</strong> — why context is bounded/volatile and real memory persists across sessions.</li>\n<li><strong>Describe the four tiers of memory</strong> — working, short-term, long-term, episodic — and where each lives.</li>\n<li><strong>Explain episodic memory and reflection</strong> — how agents learn from failure without retraining.</li>\n<li><strong>Compare four memory implementation patterns</strong> — vector store, sliding window + summary, structured, hierarchical.</li>\n<li><strong>Explain MCP's architecture</strong> — host, client, server roles; tools, resources, prompts capabilities.</li>\n<li><strong>Distinguish MCP from function calling</strong> — protocol layer vs. mechanism, and when each is appropriate.</li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-28-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — This lecture assumes Part 1's agent loop</h3>\n<p>This file builds directly on <a class=\"xref\" data-xref-lec=\"agentic-ai-01\" role=\"link\" tabindex=\"0\"><code>agentic-ai-01.md</code></a>: the agent loop (think → act →\nobserve), the distinction between chatbot/copilot/agent, and error compounding are all used here\nwithout re-derivation. If those are unfamiliar, read Part 1 first.</p>\n<h3>Prerequisite 2 — JSON, briefly</h3>\n<p>A <strong>tool schema</strong> (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>) is written as <strong>JSON</strong> — a plain-text format for structured data, built from\nnested <code>{key: value}</code> objects and <code>[item, item]</code> lists, with typed values (strings, numbers,\nbooleans). You don't need to write JSON by hand for this lecture, but you do need to recognize that\n&quot;the model emits a JSON tool call&quot; means the model outputs text like <code>{&quot;tool&quot;: &quot;search_orders&quot;, &quot;email&quot;: &quot;user@example.com&quot;}</code> — a structured, machine-parseable request, not free prose.</p>\n<h3>Prerequisite 3 — REST APIs, briefly</h3>\n<p>Several examples in this lecture (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>, <a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>) assume a basic notion of an <strong>API call</strong> — a request sent\nto some external service (e.g., &quot;call the weather API&quot;) that returns a structured response. A tool\ncall, at the mechanical level, is usually just this: the harness turns the model's tool-call request\ninto a normal API call (or a local function call) and returns the response.</p>\n<hr>\n</section><section id=\"agentic-ai-28-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Part 1 established that an agent closes the loop: Think → Act → Observe. But <em>what</em> makes it possible for an LLM to actually act? Three capabilities:</p>\n<figure class=\"ascii\"><pre>PASSIVE LLM                          ACTIVE AGENT\n─────────────                        ────────────\nText in → Text out                   Text in → Tool calls → Results → Text out\nNo memory across turns               Memory persists across turns\nNo standard integration              MCP connects to any tool</pre></figure>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>What it enables</th>\n<th>Section</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Tools</strong></td>\n<td>Act on the world — read files, run tests, call APIs</td>\n<td><a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>–<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a></td>\n</tr>\n<tr>\n<td><strong>Memory</strong></td>\n<td>Persist across time — remember past decisions and failures</td>\n<td><a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>–<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a></td>\n</tr>\n<tr>\n<td><strong>MCP</strong></td>\n<td>Connect to anything — one protocol, universal tool access</td>\n<td><a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>–<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a></td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;What actually separates an agent from a chatbot are these very three things. Tools so it\ncan act on the world. Memory so it can persist across time. And a protocol so it can connect\nto the tools without a custom integration required each time.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s3\" data-title=\"Part A — Tools\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part A — Tools</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<hr>\n</section><section id=\"agentic-ai-28-s4\" data-title=\"Why LLMs Need Tools\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">Why LLMs Need Tools</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 The four limitations</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Limitation</th>\n<th>What's wrong</th>\n<th>The fix</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Knowledge cutoff</strong></td>\n<td>Trained at some point in the past; can't know today's events</td>\n<td>Search / retrieval tool</td>\n</tr>\n<tr>\n<td><strong>Compute</strong></td>\n<td>Fumbles exact arithmetic; predicts digits instead of calculating</td>\n<td>Calculator / code sandbox</td>\n</tr>\n<tr>\n<td><strong>Can't act</strong></td>\n<td>Text in → text out; can't touch files, hit APIs, or click buttons</td>\n<td>File system, browser, APIs</td>\n</tr>\n<tr>\n<td><strong>Accuracy</strong></td>\n<td>Even when it could guess, a real tool is exact; a DB query <em>knows</em> the answer</td>\n<td>Database / structured query</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Ask an LLM to multiply two big numbers. It's bound to fumble — it predicts digits instead\nof calculating.&quot;</em></p>\n</blockquote>\n<h3>1.2 The running example: a code agent</h3>\n<p>A code agent can't fix a bug by <em>describing</em> the fix in a paragraph. It has to:</p>\n<ol>\n<li><strong>Read</strong> the file (tool call)</li>\n<li><strong>Edit</strong> the file (tool call)</li>\n<li><strong>Run tests</strong> (tool call)</li>\n<li><strong>Observe</strong> failures (result)</li>\n<li><strong>Repeat</strong> until tests pass</li>\n</ol>\n<p>Talking or generating text isn't enough. The agent needs tools.</p>\n<hr>\n</section><section id=\"agentic-ai-28-s5\" data-title=\"How Tool Calling Works\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">How Tool Calling Works</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>2.1 The four-step mechanism</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Step</th>\n<th>Who does it</th>\n<th>What happens</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>1. Declare</strong></td>\n<td>You (developer)</td>\n<td>Each tool gets a name, description, and JSON parameter schema</td>\n</tr>\n<tr>\n<td><strong>2. Select</strong></td>\n<td>Model</td>\n<td>Trained on tool-use data; emits a structured call (not prose)</td>\n</tr>\n<tr>\n<td><strong>3. Execute</strong></td>\n<td>Your code (harness)</td>\n<td>The model <em>never</em> runs anything — the harness runs the function</td>\n</tr>\n<tr>\n<td><strong>4. Return</strong></td>\n<td>Harness → model</td>\n<td>Result goes back into context; model decides next move</td>\n</tr>\n</tbody>\n</table></div>\n<figure class=\"ascii\"><pre>┌─────────────────────────────────────────────┐\n│  Model says: &quot;call run_tests({file: 'x.py'})&quot;│\n│         ↓                                   │\n│  Your harness executes run_tests()           │\n│         ↓                                   │\n│  Result: {passed: 0, failed: 2, errors: [...]}│\n│         ↓                                   │\n│  Result injected into model context          │\n│         ↓                                   │\n│  Model decides: &quot;I need to edit line 42&quot;     │\n└─────────────────────────────────────────────┘</pre></figure>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The most important one that people miss a lot — the model never runs anything by itself.\nThe harness sees the request and actually runs the function.&quot;</em></p>\n</blockquote>\n<h3>2.2 The full loop</h3>\n<pre class=\"code\"><code>Ask → Execute → Observe → Decide → Ask → Execute → ...</code></pre>\n<p>The code agent asks to run tests. The harness runs them. Failures come back as context.\nThe model reads the failures and decides what files to edit. The loop repeats.</p>\n<hr>\n</section><section id=\"agentic-ai-28-s6\" data-title=\"Parallel Tool Calls\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Parallel Tool Calls</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>When tool calls don't depend on each other, the model requests them all in one turn and\nthe harness runs them concurrently:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Scenario</th>\n<th>Latency</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3 independent reads in <strong>parallel</strong></td>\n<td>1 round trip</td>\n</tr>\n<tr>\n<td>3 independent reads <strong>sequentially</strong></td>\n<td>3 × round trip</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The model decides which calls are parallel and which are sequential.</strong> If call B needs the\nresult of call A, the model keeps them sequential automatically.</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Our code agent wants to understand a bug. It reads three different files. If those reads\ndon't depend on each other, we can do all three of once in one round trip, and the latency\ncollapses.&quot;</em></p>\n</blockquote>\n<p>Each call is emitted as schema-constrained JSON, so arguments parse every time.</p>\n<figure class=\"iv\" id=\"iv-agentic-ai-28-0\" data-iv=\"{&quot;type&quot;:&quot;animation&quot;,&quot;title&quot;:&quot;Parallel vs. sequential tool calls — time to finish&quot;,&quot;concept&quot;:&quot;Why independent tool calls should fan out in one turn instead of running one at a time&quot;,&quot;control&quot;:&quot;Toggle between \\&quot;parallel\\&quot; and \\&quot;sequential\\&quot; for the same 3 tool calls&quot;,&quot;observe&quot;:&quot;Parallel finishes at 1 round trip (all three bars complete together); sequential finishes at 3 round trips (call 1, then call 2, then call 3, back to back)&quot;,&quot;insight&quot;:&quot;The wall-clock savings come from the harness running independent calls concurrently, not from the model \\&quot;being faster\\&quot; — the model still emits the same 3 calls, only the execution schedule changes&quot;,&quot;fallback&quot;:&quot;The table above already gives the two reference points — parallel done @ 1 round trip, sequential done @ 3 round trips [slide 9] — the difference an animation would show is exactly the gap between those two numbers.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · animation</span>\n      <span class=\"iv-title\">Parallel vs. sequential tool calls — time to finish</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why independent tool calls should fan out in one turn instead of running one at a time</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle between \"parallel\" and \"sequential\" for the same 3 tool calls</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Parallel finishes at 1 round trip (all three bars complete together); sequential finishes at 3 round trips (call 1, then call 2, then call 3, back to back)</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>The wall-clock savings come from the harness running independent calls concurrently, not from the model \"being faster\" — the model still emits the same 3 calls, only the execution schedule changes</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The table above already gives the two reference points — parallel done @ 1 round trip, sequential done @ 3 round trips [slide 9] — the difference an animation would show is exactly the gap between those two numbers.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"agentic-ai-28-s7\" data-title=\"Tool Schema Design — The Schema Is the Prompt\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Tool Schema Design — The Schema Is the Prompt</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>Tool schema</strong> — a structured description of one tool: its name, a plain-English description\nof what it does and when to use it, and a typed list of parameters it accepts.</p>\n<p><em>In everyday words:</em> it's the &quot;instruction label&quot; on a function, written for the model instead\nof for a human programmer — the model never sees your code, only this label.</p>\n<p><em>Concretely:</em> <code>{&quot;name&quot;: &quot;search_orders&quot;, &quot;description&quot;: &quot;Find a customer's orders by email. Use for 'where is my order' questions.&quot;, &quot;parameters&quot;: {&quot;email&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;required&quot;: true}, &quot;status&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;enum&quot;: [&quot;open&quot;, &quot;shipped&quot;, &quot;all&quot;]}}}</code>.</p>\n<p><em>Why it exists:</em> the model can't read your source code or guess your function's intent from its\nname alone — without a schema, it has no way to know a tool exists, what it does, or what\narguments it expects.</p>\n</blockquote>\n<p>This is a critical insight: <strong>when you give a model tools, the schema you write <em>is</em> the\nprompt.</strong> The model learns which tools to call and with what arguments purely by reading\nyour descriptions.</p>\n<h3>4.1 Bad vs. good schema</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Bad</th>\n<th>Good</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Name</strong></td>\n<td><code>get_data</code></td>\n<td><code>search_orders</code></td>\n</tr>\n<tr>\n<td><strong>Description</strong></td>\n<td>&quot;gets data&quot;</td>\n<td>&quot;Find a customer's orders by email. Use for 'where is my order' questions.&quot;</td>\n</tr>\n<tr>\n<td><strong>Param q</strong></td>\n<td><code>type: string</code></td>\n<td><code>email: type: string, required</code> + <code>status: enum[open, shipped, all]</code></td>\n</tr>\n</tbody>\n</table></div>\n<h3>4.2 Design principles</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Principle</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Clear descriptions</strong></td>\n<td>Model picks tools by reading these — vague text → wrong call</td>\n</tr>\n<tr>\n<td><strong>Minimal required params</strong></td>\n<td>Every required field is another chance for the model to fail</td>\n</tr>\n<tr>\n<td><strong>Enums over free text</strong></td>\n<td>Where the value comes from a fixed set, constrain it</td>\n</tr>\n<tr>\n<td><strong>Examples in description</strong></td>\n<td>Measurably improves tool selection accuracy</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Treat your tool schemas like prompt engineering — because that's exactly what they are.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s8\" data-title=\"Scaling Tool Access [slide 16]\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Scaling Tool Access [slide 16]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>When you have hundreds or thousands of tools, the model can't reason well over a giant menu.\nThree strategies:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Strategy</th>\n<th>How it works</th>\n<th>Scales to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Direct selection</strong></td>\n<td>Dump all tools into context, let the model pick</td>\n<td>&quot;Fine up to a few dozen tools&quot; (the deck's own wording — no more precise ceiling is given)</td>\n</tr>\n<tr>\n<td><strong>Router</strong></td>\n<td>A cheap model classifies intent first; expose only the relevant subset</td>\n<td>Qualitatively &quot;much flatter&quot; cost/error growth than direct selection — no numeric ceiling stated on the deck</td>\n</tr>\n<tr>\n<td><strong>Retrieval</strong></td>\n<td>Embed every tool description; fetch top-k most relevant per query</td>\n<td>Qualitatively &quot;nearly flat&quot; cost/error growth — the deck's chosen approach for very large toolboxes, again with no numeric ceiling stated</td>\n</tr>\n</tbody>\n</table></div>\n<pre class=\"code\"><code>Cost &amp; error rate vs. number of tools:\n\nDirect:    ████████████████████████ (blows up)\nRouter:    ████████████████ (much flatter)  \nRetrieval: ██████████ (nearly flat)</code></pre>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The slide gives one precise number, not three</strong> [slide 16] — &quot;fine up to a few dozen tools&quot;\nis the deck's own wording for direct selection. Router and retrieval are shown only as relative\n<em>shapes</em> on a cost/error-rate-vs-tools curve (flatter, flattest), with no numeric tool-count\nceiling stated for either. Treat &quot;~100 tools&quot; or &quot;1000+ tools&quot; as illustrative round numbers you\nmight reach for in practice, not values this deck actually gives — don't cite them as if sourced.</p>\n</aside>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The naive approach is fine until it isn't — post a dozen tools, as your toolbox explodes\nyou need to either route or retrieve.&quot;</em></p>\n</blockquote>\n<figure class=\"iv\" id=\"iv-agentic-ai-28-1\" data-iv=\"{&quot;type&quot;:&quot;graph&quot;,&quot;title&quot;:&quot;Cost &amp; error rate vs. number of tools&quot;,&quot;concept&quot;:&quot;Why the tool-access strategy that works at small scale breaks at large scale&quot;,&quot;control&quot;:&quot;Drag \\&quot;tools available\\&quot; from a few to many&quot;,&quot;observe&quot;:&quot;The direct-selection curve climbs steeply as tools increase; the router curve climbs much more slowly; the retrieval curve stays nearly flat&quot;,&quot;insight&quot;:&quot;All three strategies work fine at small scale — the curves only diverge once the toolbox grows large, which is exactly why \\&quot;just dump everything in context\\&quot; quietly breaks in production long after it worked fine in a demo&quot;,&quot;fallback&quot;:&quot;The ASCII bar chart above (direct ████████████████████████ vs. router ████████████████ vs. retrieval ██████████) already encodes the same three relative growth rates a graph would animate — read the bar lengths as the three curves' shapes at high tool count.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · graph</span>\n      <span class=\"iv-title\">Cost &amp; error rate vs. number of tools</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why the tool-access strategy that works at small scale breaks at large scale</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Drag \"tools available\" from a few to many</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The direct-selection curve climbs steeply as tools increase; the router curve climbs much more slowly; the retrieval curve stays nearly flat</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>All three strategies work fine at small scale — the curves only diverge once the toolbox grows large, which is exactly why \"just dump everything in context\" quietly breaks in production long after it worked fine in a demo</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The ASCII bar chart above (direct ████████████████████████ vs. router ████████████████ vs. retrieval ██████████) already encodes the same three relative growth rates a graph would animate — read the bar lengths as the three curves' shapes at high tool count.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"agentic-ai-28-s9\" data-title=\"Tool Failure Handling and Security\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Tool Failure Handling and Security</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>6.1 The escalation ladder</h3>\n<p>When a tool fails, recover in order — cheapest and most automatic first:</p>\n<pre class=\"code\"><code>1. Retry          → transient network blip?\n2. Different tool → same job, different implementation\n3. Ask user       → last resort</code></pre>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Failure type</th>\n<th>Recovery</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Execution fails</td>\n<td>Retry → different tool → ask user</td>\n</tr>\n<tr>\n<td>Malformed parameters</td>\n<td>Feed validation error back to model → self-corrects</td>\n</tr>\n<tr>\n<td>Timeout</td>\n<td>Bound every call; hung tool must not hang the agent</td>\n</tr>\n<tr>\n<td>Tool unavailable</td>\n<td>Graceful degradation: answer without it, be honest</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A good agent treats a failed call as information, not a dead end.&quot;</em></p>\n</blockquote>\n<h3>6.2 Security — every tool is an attack surface</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Principle</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Least privilege</strong></td>\n<td>Give each tool the narrowest scope — a read tool should never write</td>\n</tr>\n<tr>\n<td><strong>Allowlisting</strong></td>\n<td>Name exactly which tools an agent may call; default to deny</td>\n</tr>\n<tr>\n<td><strong>Human-in-the-loop</strong></td>\n<td>Destructive or irreversible actions (delete data, send money) → pause for approval</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><strong>Least privilege</strong> — a security rule that says every tool should be granted only the narrowest\naccess it actually needs to do its job, never more.</p>\n<p><em>In everyday words:</em> don't hand someone your whole house key when they only need to water one\nplant — give them access to exactly that plant and nothing else.</p>\n<p><em>Concretely:</em> a tool that looks up a customer's order status should have read-only database\naccess scoped to the orders table; it should not also be able to write to that table or read the\npayments table, even if it's technically the &quot;same database.&quot;</p>\n<p><em>Why it exists:</em> every tool an agent can call is a potential point of failure — if the model\nhallucinates a bad call, gets tricked by a prompt injection (<a class=\"xref\" data-xref-lec=\"agentic-ai-28\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a> in Part 3), or a tool's own logic\nhas a bug, the <em>narrowest possible scope</em> on that tool bounds how much damage any single mistake\ncan do.</p>\n</blockquote>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Every tool you give an agent is a hole that you have punched in the sandbox. Grant the\nleast that works.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s10\" data-title=\"Part B — Memory\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part B — Memory</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<hr>\n</section><section id=\"agentic-ai-28-s11\" data-title=\"Why Memory Matters\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">Why Memory Matters</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>7.1 The problem: stateless agents redo everything</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Agent type</th>\n<th>Behavior over session</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Stateless</strong> (no memory)</td>\n<td>Re-derives everything each turn; repeats mistakes; work done climbs linearly</td>\n</tr>\n<tr>\n<td><strong>With memory</strong></td>\n<td>Builds on what it knows; work done plateaus; stops repeating dead ends</td>\n</tr>\n</tbody>\n</table></div>\n<figure class=\"ascii\"><pre>Work redone per turn over a session:\n\nStateless:    /  /  /  /  /  /  /  (keeps climbing)\nWith memory:  /──/──/────────────── (flattens out)</pre></figure>\n<figure class=\"iv\" id=\"iv-agentic-ai-28-2\" data-iv=\"{&quot;type&quot;:&quot;graph&quot;,&quot;title&quot;:&quot;Work redone per turn, over a session&quot;,&quot;concept&quot;:&quot;Why a stateless agent gets slower and more error-prone the longer a session runs&quot;,&quot;control&quot;:&quot;Drag \\&quot;turn number\\&quot; forward across a session&quot;,&quot;observe&quot;:&quot;The stateless curve keeps climbing (more re-derivation every turn); the with-memory curve rises briefly then flattens out&quot;,&quot;insight&quot;:&quot;The cost of statelessness isn't fixed — it compounds with session length, so a demo that looks fine at turn 3 can be re-deriving most of its own past work by turn 20&quot;,&quot;fallback&quot;:&quot;The ASCII sketch above (\\&quot;stateless: / / / / / / / (keeps climbing)\\&quot; vs. \\&quot;with memory: /──/──/────────────── (flattens out)\\&quot;) already shows the same two shapes a graph would animate.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · graph</span>\n      <span class=\"iv-title\">Work redone per turn, over a session</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why a stateless agent gets slower and more error-prone the longer a session runs</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Drag \"turn number\" forward across a session</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The stateless curve keeps climbing (more re-derivation every turn); the with-memory curve rises briefly then flattens out</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>The cost of statelessness isn't fixed — it compounds with session length, so a demo that looks fine at turn 3 can be re-deriving most of its own past work by turn 20</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The ASCII sketch above (\"stateless: / / / / / / / (keeps climbing)\" vs. \"with memory: /──/──/────────────── (flattens out)\") already shows the same two shapes a graph would animate.</p>\n    </div>\n  </figure>\n<h3>7.2 Context window ≠ memory</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Context window</th>\n<th>Real memory</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Lifetime</td>\n<td>Current session only</td>\n<td>Across sessions</td>\n</tr>\n<tr>\n<td>Capacity</td>\n<td>Bounded, fills up</td>\n<td>Scalable (external store)</td>\n</tr>\n<tr>\n<td>Volatility</td>\n<td>Vanishes when session ends</td>\n<td>Persists indefinitely</td>\n</tr>\n<tr>\n<td>Use</td>\n<td>Working scratchpad</td>\n<td>Learned facts, preferences, past failures</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Context window is large, but bounded, and it's going to vanish the moment the session ends.\nReal memory means persisting what matters so the next session starts ahead.&quot;</em></p>\n</blockquote>\n<h3>7.3 The three verbs of memory</h3>\n<ol>\n<li><strong>Store</strong> — decide what's worth keeping (keyword: <em>not everything</em>)</li>\n<li><strong>Recall</strong> — surface the right memory at the right moment (retrieval)</li>\n<li><strong>Drop</strong> — actively remove what's wrong or outdated</li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-28-s12\" data-title=\"Four Tiers of Memory [slide 25–26]\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Four Tiers of Memory [slide 25–26]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Sorted by how long they last and where they live. This taxonomy is the deck's own citation of\n<strong>MemGPT</strong> (Packer et al., &quot;MemGPT: Towards LLMs as Operating Systems,&quot; arXiv:2310.08560, 2023) —\nvisible in the slide's footer — which frames an LLM's context window the way an OS treats RAM:\na small, fast, volatile tier backed by larger, slower, persistent storage tiers underneath it.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Tier</th>\n<th>What it stores</th>\n<th>Lifetime</th>\n<th>Location</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Working</strong></td>\n<td>Current conversation + scratchpad</td>\n<td>Current turn</td>\n<td>Context window</td>\n</tr>\n<tr>\n<td><strong>Short-term</strong></td>\n<td>Summarized history, key decisions</td>\n<td>Within session</td>\n<td>Summarized context</td>\n</tr>\n<tr>\n<td><strong>Long-term</strong></td>\n<td>User preferences, learned facts</td>\n<td>Across sessions</td>\n<td>External database</td>\n</tr>\n<tr>\n<td><strong>Episodic</strong></td>\n<td>Past experiences, failure lessons</td>\n<td>Indefinite</td>\n<td>External store (reflection-style)</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><strong>Episodic memory</strong> — a persistent record of specific past attempts and their outcomes,\nespecially failures, stored as text and re-injected into future prompts.</p>\n<p><em>In everyday words:</em> it's the agent's own diary of &quot;what I tried and what happened&quot; — not facts\nabout the world (that's long-term memory), but facts about the agent's <em>own history</em>.</p>\n<p><em>Concretely:</em> &quot;Attempt 1: tried to parse the CSV assuming a header row; failed because this file\nhas none. Lesson: check for a header before parsing.&quot; — this sentence, stored once, is what\nepisodic memory actually looks like.</p>\n<p><em>Why it exists:</em> without it, an agent that fails a task and retries has no way to avoid repeating\nthe exact same mistake — every attempt would start from zero, wasting the one thing a failure\nactually produces: information about what doesn't work.</p>\n</blockquote>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Last time I tried approach X and it failed because of Y&quot; — that's episodic memory, and it\nlets an agent learn from failure without any retraining.</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s13\" data-title=\"Episodic Memory and Reflection\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Episodic Memory and Reflection</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>This is genuinely powerful — the agent gets better between attempt 1 and attempt 2 without\ntouching any weights or doing any fine-tuning.</p>\n<h3>9.1 The reflection loop</h3>\n<pre class=\"code\"><code>Attempt 1:\n  Agent tries to fix a bug → fails\n  Agent REFLECTS: &quot;I failed because I forgot to handle the null case&quot;\n  → Reflection stored in episodic memory\n\nAttempt 2:\n  Episodic memory pulled back into context BEFORE attempt\n  Agent already knows what NOT to do\n  → Agent succeeds, tests pass green</code></pre>\n<h3>9.2 Why this works</h3>\n<ul>\n<li>The agent remembers its own mistake and doesn't repeat it</li>\n<li>No retraining, no fine-tuning — just context engineering</li>\n<li>Shares the &quot;learn from your own output&quot; spirit of <strong>STaR</strong> (<code>GenAI &amp; LLM Part 2 §13</code>, Zelikman et\nal. 2022), but by a genuinely different mechanism: <strong>STaR retrains</strong> the model's weights on its\nown self-generated rationales, while reflection here only <strong>re-injects a written lesson into the\nprompt at inference time</strong> — the weights never change. Same instinct (bootstrap improvement from\nthe model's own attempts), opposite mechanism (gradient update vs. context engineering).</li>\n</ul>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The difference between an agent that keeps banging its head on the same wall forever and\nthe one that actually gets somewhere.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s14\" data-title=\"Memory Implementation Patterns\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">Memory Implementation Patterns</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Four common patterns, each trading off recall quality against cost/complexity:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pattern</th>\n<th>How it works</th>\n<th>Best for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Vector store</strong></td>\n<td>Embed everything; retrieve by semantic similarity</td>\n<td>&quot;Have I seen something like this before?&quot;</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><strong>Vector store</strong> — a database that stores each piece of text as a numeric vector (an\n&quot;embedding&quot;) capturing its meaning, and lets you retrieve the stored items whose meaning is\nclosest to a new query.</p>\n<p><em>In everyday words:</em> instead of searching for exact keyword matches, you search by &quot;what this\nmeans&quot; — two sentences that say the same thing in different words end up as nearby vectors.</p>\n<p><em>Concretely:</em> store &quot;user reported checkout button not responding on mobile Safari&quot; as a vector;\nlater, a new query &quot;customer says the buy button doesn't work on their iPhone&quot; retrieves it even\nthough the two sentences share almost no exact words.</p>\n<p><em>Why it exists:</em> an agent's memory of past experiences is written in free-form natural language,\nnot fixed keys — semantic similarity search is the only practical way to ask &quot;have I seen\nsomething like this before?&quot; over a growing pile of unstructured text.</p>\n</blockquote>\n<p>| <strong>Sliding window + summary</strong> | Keep recent turns word-for-word; compress older into running summary | Simple, effective baseline |\n| <strong>Structured memory</strong> | Extract entities/facts into typed store (name, plan, preferences) | Exact variables, no drift |\n| <strong>Hierarchical</strong> | Detailed for recent past; fuzzy/abstract for distant past | Mimics human memory |</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;You'll often need to combine all of these — a vector store for episodic recall plus\nstructured memory for hard facts is a really common pairing.&quot;</em></p>\n</blockquote>\n<h3>Memory curation operations</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Operation</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Write</strong></td>\n<td>Decide what's worth keeping (not everything!)</td>\n</tr>\n<tr>\n<td><strong>Read</strong></td>\n<td>Surface the right memory at the right moment (retrieval problem)</td>\n</tr>\n<tr>\n<td><strong>Update</strong></td>\n<td>When a fact changes, revise it (user switched plans → update)</td>\n</tr>\n<tr>\n<td><strong>Forget</strong></td>\n<td>Actively remove wrong or outdated information</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Three caveats</h3>\n<ol>\n<li><strong>Curation</strong> — knowing what to keep vs. tossing everything</li>\n<li><strong>Relevance</strong> — pulling the right memory at the right time (retrieval)</li>\n<li><strong>Timeliness</strong> — <em>&quot;the world changes and memory does not&quot;</em> [slide 34], unless you actively\nupdate it. ⚠️ <em>Author's gloss, not a direct quote:</em> a memory that's gone stale can actively\nmislead the agent into repeating an outdated assumption with false confidence — arguably worse\nthan having no memory and reasoning from scratch each time.</li>\n</ol>\n<hr>\n</section><section id=\"agentic-ai-28-s15\" data-title=\"Part C — MCP (Model Context Protocol)\" data-kind=\"divider\"><h2>\n      \n      <span class=\"sec-t\">Part C — MCP (Model Context Protocol)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<hr>\n</section><section id=\"agentic-ai-28-s16\" data-title=\"The Problem MCP Solves\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">The Problem MCP Solves</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>MCP (Model Context Protocol)</strong> — an open, standardized protocol that lets any AI model connect\nto any tool or data source through a common interface, instead of a custom integration for every\nmodel-tool pairing.</p>\n<p><em>In everyday words:</em> it's a universal connector — like USB-C letting any laptop charge from any\ncharger, instead of every phone brand needing its own plug.</p>\n<p><em>Concretely:</em> a database team ships one &quot;database MCP server.&quot; Any host — a chat app using\nClaude, one using GPT, one using Gemini — can now query that database, because all three speak\nMCP, without the database team writing three separate integrations.</p>\n<p><em>Why it exists:</em> before MCP, connecting <math data-tex=\"N\"><mi>N</mi></math> models to <math data-tex=\"M\"><mi>M</mi></math> tools required roughly <math data-tex=\"N \\times M\"><mrow><mi>N</mi><mo>×</mo><mi>M</mi></mrow></math>\ncustom integrations (see the diagram below) — a combinatorial cost that made every new tool or\nevery new model expensive to add to the ecosystem.</p>\n</blockquote>\n<p>Before MCP, every model had to integrate every tool by hand:</p>\n<figure class=\"ascii\"><pre>Before MCP (N models × M tools = N×M connections):\n\n  Model A ──┬── Tool 1\n            ├── Tool 2\n            ├── Tool 3\n            \n  Model B ──┬── Tool 1  (re-integrated!)\n            ├── Tool 2  (re-integrated!)\n            └── Tool 3  (re-integrated!)</pre></figure>\n<p>Every tool has a different API, auth flow, and parameter schema. You're rewriting the same\nintegration over and over.</p>\n<h3>The USB-C analogy</h3>\n<p>Think of when every device had its own charger — Motorola, BlackBerry, Samsung all different.\nThen USB-C: one standard connector. MCP is USB-C for AI tools.</p>\n<figure class=\"ascii\"><pre>After MCP (N hosts + M servers = N+M, with one protocol):\n\n  Host A ───┐\n  Host B ───┤── MCP Protocol ──┬── Server 1 (database)\n  Host C ───┘                  ├── Server 2 (file system)\n                               └── Server 3 (browser)</pre></figure>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;You collapse from N×M to N+M — from an entangled mesh to a clean hub.&quot;</em></p>\n</blockquote>\n<figure class=\"iv\" id=\"iv-agentic-ai-28-3\" data-iv=\"{&quot;type&quot;:&quot;diagram&quot;,&quot;title&quot;:&quot;N×M before MCP vs. N+M after&quot;,&quot;concept&quot;:&quot;Why a shared protocol layer changes the integration math, not just the convenience&quot;,&quot;control&quot;:&quot;Toggle between \\&quot;before MCP\\&quot; and \\&quot;after MCP\\&quot;&quot;,&quot;observe&quot;:&quot;Before: every host connects directly to every server (a full mesh, N×M lines). After: every host and server connects only to the protocol layer (N+M lines total)&quot;,&quot;insight&quot;:&quot;The saving isn't just fewer lines on a diagram — it means a tool builder and a model builder never have to coordinate with each other at all, because both only need to speak MCP once&quot;,&quot;fallback&quot;:&quot;The two ASCII diagrams above (\\&quot;Before MCP\\&quot; and \\&quot;After MCP\\&quot;) already show the same mesh-vs-hub contrast a toggle would animate — count the connection lines in each to see the N×M vs. N+M difference directly.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · diagram</span>\n      <span class=\"iv-title\">N×M before MCP vs. N+M after</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why a shared protocol layer changes the integration math, not just the convenience</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle between \"before MCP\" and \"after MCP\"</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Before: every host connects directly to every server (a full mesh, N×M lines). After: every host and server connects only to the protocol layer (N+M lines total)</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>The saving isn't just fewer lines on a diagram — it means a tool builder and a model builder never have to coordinate with each other at all, because both only need to speak MCP once</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The two ASCII diagrams above (\"Before MCP\" and \"After MCP\") already show the same mesh-vs-hub contrast a toggle would animate — count the connection lines in each to see the N×M vs. N+M difference directly.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"agentic-ai-28-s17\" data-title=\"MCP Architecture — Three Roles\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">MCP Architecture — Three Roles</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Role</th>\n<th>What it is</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Host</strong></td>\n<td>The app you use</td>\n<td>IDE, chat client, code agent</td>\n</tr>\n<tr>\n<td><strong>Client</strong></td>\n<td>Lives inside the host; one per server; speaks the protocol</td>\n<td>Protocol adapter</td>\n</tr>\n<tr>\n<td><strong>Server</strong></td>\n<td>Expresses capabilities (tools, data, prompts)</td>\n<td>Database server, file system server</td>\n</tr>\n</tbody>\n</table></div>\n<p>The key insight: <strong>a team can build and ship an MCP server without touching any model.</strong>\nThe database team ships a database server — they don't care whether you're using Claude,\nGPT, or Gemini.</p>\n<figure class=\"ascii\"><pre>Host ──→ Client ──→ Server ──→ Actual tool/data\n                                    ↓\nHost ←── Client ←── Server ←── Result</pre></figure>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Tool builders and model builders never have to coordinate. That's how the ecosystem\nscales.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s18\" data-title=\"Three MCP Capabilities\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">Three MCP Capabilities</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>What it exposes</th>\n<th>Who controls it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Tools</strong></td>\n<td>Callable functions with schemas (what we covered in Part A)</td>\n<td><strong>Model</strong> — decides which to call and when</td>\n</tr>\n<tr>\n<td><strong>Resources</strong></td>\n<td>Readable data — files, API responses, DB rows</td>\n<td><strong>App</strong> — decides what data to feed in</td>\n</tr>\n<tr>\n<td><strong>Prompts</strong></td>\n<td>Reusable prompt templates (<code>/review-pr</code>, <code>/summarize</code>)</td>\n<td><strong>User</strong> — triggers them</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;The model picks tools, the app provides resources, and the user fires prompts. Three\ndifferent parties in control.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s19\" data-title=\"MCP Transports and Ecosystem\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">14</span>\n      <span class=\"sec-t\">MCP Transports and Ecosystem</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>14.1 Two transports</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Transport</th>\n<th>Where the server lives</th>\n<th>Use case</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>stdio</strong> (standard in/out)</td>\n<td>Local subprocess on your machine</td>\n<td>Local files, git, scripts</td>\n</tr>\n<tr>\n<td><strong>HTTP + SSE</strong> (streamable HTTP)</td>\n<td>Remote server on the network</td>\n<td>Hosted multi-user SaaS tools</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><strong>stdio / HTTP+SSE</strong> — the two &quot;pipes&quot; an MCP client and server can talk over: <strong>stdio</strong>\n(standard input/output) pipes messages between two processes running on the same machine;\n<strong>HTTP+SSE</strong> (HTTP with Server-Sent Events) sends messages over the network with a persistent\nstream for the server to push updates back.</p>\n<p><em>In everyday words:</em> stdio is like passing notes between two people in the same room; HTTP+SSE\nis like a phone call where either side can talk at any time — same conversation, different\ndistance.</p>\n<p><em>Concretely:</em> a local git-tools MCP server your IDE spawns as a subprocess uses stdio; a\ncentrally-hosted company-wide search server that many users' agents connect to over the internet\nuses HTTP+SSE.</p>\n<p><em>Why it exists:</em> MCP needs a transport that works whether the server is a lightweight script\nrunning next to your editor or a shared, always-on service — the protocol on top (tools,\nresources, prompts) is identical either way, so your agent code doesn't need to know or care\nwhich transport is underneath it.</p>\n</blockquote>\n<p>Your agent code does not change between them. Swapping a local tool for a remote tool is\njust a config detail — same protocol, different pipe.</p>\n<h3>14.2 Why MCP matters</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Benefit</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Build once</strong></td>\n<td>Works with any compatible host</td>\n</tr>\n<tr>\n<td><strong>Discovery</strong></td>\n<td>Agent can ask server at runtime &quot;what tools do you have?&quot;</td>\n</tr>\n<tr>\n<td><strong>Composability</strong></td>\n<td>Chain several servers together (file system + DB + browser)</td>\n</tr>\n<tr>\n<td><strong>Capability-based security</strong></td>\n<td>Host grants only the access it needs to</td>\n</tr>\n</tbody>\n</table></div>\n<h3>14.3 Ecosystem adoption</h3>\n<p>MCP was created by Anthropic in 2024. Crucially, it got adopted by <strong>OpenAI, Google,\nMicrosoft, Amazon</strong> — the competitors. Now thousands of community servers exist, built\nnatively into Claude Code, VS Code, and JetBrains.</p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;A standard wins when building to it is easier than building around it. Once your\ncompetitors start adopting your standard, it has real impact.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s20\" data-title=\"MCP vs. Function Calling\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">15</span>\n      <span class=\"sec-t\">MCP vs. Function Calling</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s20\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Common misconception: MCP <em>is</em> function calling. They're related but different layers:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Function Calling</th>\n<th>MCP</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Level</strong></td>\n<td>Mechanism (how one model calls one tool)</td>\n<td>Ecosystem (protocol connecting many)</td>\n</tr>\n<tr>\n<td><strong>Scope</strong></td>\n<td>Model-specific, provider-specific</td>\n<td>Model-agnostic, universal</td>\n</tr>\n<tr>\n<td><strong>Discovery</strong></td>\n<td>Hardcoded</td>\n<td>Runtime discoverable</td>\n</tr>\n<tr>\n<td><strong>When to use</strong></td>\n<td>One model, few fixed tools</td>\n<td>Many tools, multiple hosts</td>\n</tr>\n</tbody>\n</table></div>\n<p>Under the hood, an MCP host takes discovered tools and turns them into ordinary function\ncalls for whatever model it's using. <strong>MCP feeds function calling.</strong></p>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;If you've got one model and a few fixed tools, function calling works great — MCP is\noverkill. If you've got many tools and want to work across hosts, that's when you reach\nMCP.&quot;</em></p>\n</blockquote>\n<hr>\n</section><section id=\"agentic-ai-28-s21\" data-title=\"Module Recap\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">16</span>\n      <span class=\"sec-t\">Module Recap</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"agentic-ai-28-s21\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>PASSIVE LLM → CAPABLE AGENT\n═════════════════════════════\n\n  TOOLS to act\n  ├── Model selects → Harness executes → Result returns\n  ├── Parallel calls when independent\n  ├── Schema design = prompt engineering\n  ├── Scale: direct → router → retrieval\n  ├── Failure: retry → different tool → ask user\n  └── Security: least privilege, allow
