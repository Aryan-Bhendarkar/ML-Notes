ass=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What exactly does the output projection W_O in multi-head attention accomplish, and why can't concatenation alone do that job?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Each attention head is computed completely independently, using its own <math data-tex=\"W_Q^i, W_K^i, W_V^i\"><mrow><msubsup><mi>W</mi><mi>Q</mi><mi>i</mi></msubsup><mo separator=\"true\">,</mo><msubsup><mi>W</mi><mi>K</mi><mi>i</mi></msubsup><mo separator=\"true\">,</mo><msubsup><mi>W</mi><mi>V</mi><mi>i</mi></msubsup></mrow></math>, so\nsimply concatenating the heads' outputs side by side stacks information with zero interaction between\nheads. <math data-tex=\"W_O\"><msub><mi>W</mi><mi>O</mi></msub></math> is a learned matrix applied to that concatenation specifically to mix information\n<em>across</em> heads and project the result back down to the model's dimension <math data-tex=\"d\"><mi>d</mi></math> — without it, whatever\neach head separately discovered could never be combined into a single unified representation for the\nnext layer.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain BERT's 80/10/10 masking trick and the specific failure it prevents.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Of the ~15% of tokens selected for masking, 80% become the literal <code>[MASK]</code> token, 10% become a random\nother word, and 10% are left unchanged (but still counted in the loss). If every selected token were\nalways replaced with <code>[MASK]</code>, the model would only ever need to build good representations for\nmasked positions — but fine-tuning never presents a <code>[MASK]</code> token at all, creating a train/inference\nmismatch where the model has never had to build a good vector for an ordinary, unmasked, &quot;used\nnormally&quot; token. The random and unchanged cases force BERT to produce useful representations at\nevery position, not just the artificially masked ones.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Compare how BERT and GPT each turn \"predicting a hidden/next word\" into unlimited free training data, and connect this to why their attention patterns must differ.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Both exploit that raw text is its own label: BERT hides ~15% of tokens and asks the model to recover\nthem, while GPT asks the model to predict each next token given everything before it — neither needs\nhuman annotation, just running text. But this drives a hard constraint on attention pattern: BERT's\nobjective is only valid with <em>bidirectional</em> attention, since predicting a masked token from context\non both sides is the entire point (and is impossible to game, because the masked token itself is\nhidden from the model). GPT's objective would be trivially &quot;solved&quot; by copying under bidirectional\nattention (position <math data-tex=\"i{+}1\"><mrow><mi>i</mi><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">+</mo><mn>1</mn></mrow></math> would be directly visible when predicting position <math data-tex=\"i\"><mi>i</mi></math>), so it strictly\nrequires causal (masked) attention, where each position only ever sees strictly earlier tokens.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Order the parameter-efficient fine-tuning ladder and, for each step, name specifically what problem it introduces even as it solves the previous step's problem.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Full fine-tuning → updates all weights: huge compute/memory, a full model copy per task, and it can\noverwrite pre-trained knowledge. Adapters → freeze the base, train small inserted layers: fixes the\nstorage-per-task problem (save only the small adapter), but the inserted layers add inference latency\nand you still backprop through the whole frozen model, so training compute stays high. LoRA → freeze\nthe base, train a low-rank update added alongside existing weights (not inserted into the forward\npath): keeps the storage win and removes the adapter's inference-latency cost, since the update can be\nmerged back into the frozen weights after training — but the frozen base itself still has to be held\nin memory at full precision. QLoRA → additionally quantizes that frozen base to 4-bit: fixes the\nremaining memory problem, enabling fine-tuning of tens-of-billions-of-parameter models on a single\nGPU.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A colleague sees \"0.70 vs. 0.88 test accuracy, from-scratch vs. pre-trained\" and asks whether this proves pre-training is always worth an 18-point gain. What's the correct, more careful answer?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The 0.70-vs-0.88 result (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§21\" role=\"link\" tabindex=\"0\">§21</a>) isolates one specific comparison — the same architecture, same\nfine-tuning procedure, same small labeled dataset, differing only in initialization — and the gap\nreflects how much <em>this particular</em> small dataset benefits from language understanding transferred\nfrom pre-training. The size of that gap is expected to shrink as the labeled fine-tuning dataset grows\nlarge enough for a from-scratch model to learn language structure on its own, and would differ for\nother task types, dataset sizes, or domains far from the pre-training corpus (e.g. highly specialized\ntechnical text) — so this specific number demonstrates the <em>existence and direction</em> of pre-training's\nvalue, not a universal 18-point constant.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;Why is byte-level BPE (GPT-2's tokenizer) specifically immune to the <code>[UNK]</code> problem that\ncharacter-level BPE isn't?&quot;</em> — because its base vocabulary is the 256 possible raw bytes, and every\npossible Unicode character decomposes into some sequence of bytes, so there is no character that\ncan fail to have a representable base token — unlike character-level BPE trained on a specific\ncorpus, whose base vocabulary is only the characters that corpus happened to contain.</li>\n<li><em>&quot;WordPiece's score formula divides by freq(a)·freq(b) — what happens to this score for two pieces\nthat are each individually very rare but never co-occur?&quot;</em> — freq(a,b) would be at or near zero, so\nthe score would also be near zero regardless of how small the denominator is; the formula rewards\npairs that co-occur <em>more than their individual frequencies predict</em>, not merely pairs that are\nindividually rare.</li>\n<li><em>&quot;If RoPE rotates queries and keys by an angle depending on relative distance, what property does\nthis guarantee that a simple additive positional encoding does not?&quot;</em> — the dot product between a\nrotated query and rotated key depends only on their relative position (the difference in rotation\nangles), not their absolute positions, so the same relative distance produces the same attention\nscore contribution regardless of where in the sequence it occurs — this is precisely the &quot;distance\nmatters more than absolute index&quot; property motivating the RoPE/ALiBi section (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7.4\" role=\"link\" tabindex=\"0\">§7.4</a>).</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>WordPiece's score formula, contrasted with BPE's selection rule</strong> — <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>'s worked example, showing\nBPE picks <code>u+g</code> (count 20) while WordPiece picks <code>g+s</code> (score 0.050 from count 5), and why dividing\nby individual frequencies produces the reversal.</li>\n<li><strong>The causal mask's effect on softmax</strong> — <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§11.1\" role=\"link\" tabindex=\"0\">§11.1</a>'s derivation: setting <math data-tex=\"\\text{score}_{ij}=-\\infty\"><mrow><msub><mtext>score</mtext><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math>\nfor <math data-tex=\"j&gt;i\"><mrow><mi>j</mi><mo>&gt;</mo><mi>i</mi></mrow></math> before softmax forces <math data-tex=\"e^{-\\infty}=0\"><mrow><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mi>∞</mi></mrow></msup><mo>=</mo><mn>0</mn></mrow></math> for those entries, producing an exactly\nlower-triangular, still-valid (rows summing to 1) attention weight matrix.</li>\n<li><strong>Cross-entropy loss from a single worked prediction</strong> — <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§16.2\" role=\"link\" tabindex=\"0\">§16.2</a>'s example: predicted probability\n0.91 for the true next word &quot;on&quot; gives loss <math data-tex=\"-\\log(0.91)\\approx0.094\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0.91</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>0.094</mn></mrow></math>; reproduce this and explain\nwhy a wrong-but-confident prediction (e.g. 0.05 probability on the true word) produces a much\nlarger loss (<math data-tex=\"-\\log(0.05)\\approx3.0\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0.05</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>3.0</mn></mrow></math>).</li>\n</ol>\n<h3>Applied scenario — Amazon customer-support ticket triage</h3>\n<p><strong>Framing:</strong> Amazon needs to automatically classify incoming customer-support messages (order issue,\nbilling question, product defect, general inquiry, ...) and route them to the right team, with only a\nfew thousand labeled historical tickets available per category.</p>\n<p><strong>Data:</strong> Free-text customer messages — short, often with typos, abbreviations, and product-specific\nterminology (SKU codes, brand names) not present in general web text.</p>\n<p><strong>Model:</strong> This is squarely an <strong>encoder-only</strong> problem (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>) — the task is <em>understanding</em> a fixed\ninput and producing a classification, not generating new text, so BERT-family bidirectional attention\nis the natural fit over GPT's causal, generation-oriented design (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§20\" role=\"link\" tabindex=\"0\">§20</a>'s summary table makes this\nmapping directly: encoder-only → understanding; decoder-only → generation). Given the small labeled\nset (a few thousand tickets), fine-tune a pre-trained BERT/RoBERTa checkpoint with a new classification\nhead on the <code>[CLS]</code> vector (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§15.5\" role=\"link\" tabindex=\"0\">§15.5</a>) rather than training from scratch — the notebook's own 0.70-vs-0.88\nresult (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§21\" role=\"link\" tabindex=\"0\">§21</a>) is the direct empirical argument for why. Given the typo-heavy, jargon-heavy text, a\nWordPiece or subword tokenizer (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>) handles unseen SKU-like tokens more gracefully than a word-level\nscheme would, falling back to subword pieces rather than <code>[UNK]</code>.</p>\n<p><strong>Metric:</strong> Per-class F1 (not just accuracy), since ticket categories are likely imbalanced (far more\n&quot;order status&quot; tickets than rare categories), echoing the class-imbalance concern the notebook itself\nchecks with a class-balance plot (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§21\" role=\"link\" tabindex=\"0\">§21</a>).</p>\n<p><strong>Failure modes:</strong> A model fine-tuned only on historical ticket text may fail on genuinely new issue\ntypes (e.g. a new product launch introducing new failure modes) — this is exactly the kind of\ndistribution shift full fine-tuning risks <em>overwriting</em> general language understanding to overfit to,\nwhich is one of full fine-tuning's three named problems in <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§18\" role=\"link\" tabindex=\"0\">§18</a>; a LoRA-based fine-tune, which touches\nfar fewer parameters, is less prone to this kind of catastrophic overwriting while still adapting to\nthe ticket domain.</p>\n<p><strong>What you'd ship:</strong> A pre-trained BERT-family encoder fine-tuned via LoRA (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§18\" role=\"link\" tabindex=\"0\">§18</a>) on the labeled ticket\nset, with a lightweight classification head over <code>[CLS]</code>, monitored with per-class F1 and periodic\nre-evaluation as new ticket types emerge.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Customer Obsession</strong> — correctly routing a ticket the first time,\nincluding one full of typos or unfamiliar product jargon, is the entire point of choosing a\nsubword tokenizer robust to exactly that kind of text over a brittle word-level scheme. <strong>Insist on\nthe Highest Standards</strong> — using per-class F1 rather than aggregate accuracy, and explicitly\nstress-testing the confusion matrix (as the notebook itself does in <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§21\" role=\"link\" tabindex=\"0\">§21</a>) rather than accepting a\nsingle headline accuracy number, is what catches a model that looks good on average but silently\nfails one important minority category.</p>\n<hr>\n</section><section id=\"sequential-learning-20-s26\" data-title=\"Glossary\" data-kind=\"back\" data-part=\"Part 3 — Language Models\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s26\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>ALiBi</strong> — attention with linear biases; adds a distance-proportional penalty to attention scores\ninstead of modifying embeddings, for strong length extrapolation.</li>\n<li><strong>Add &amp; Norm</strong> — the residual-connection-then-LayerNorm pattern applied after each Transformer\nsub-layer.</li>\n<li><strong>Adapter tuning</strong> — freezing the base model and inserting small trainable layers inside each\nblock; fewer trained parameters but added inference latency.</li>\n<li><strong>BPE (Byte Pair Encoding)</strong> — subword tokenizer built by iteratively merging the most <em>frequent</em>\nadjacent pair; used by GPT.</li>\n<li><strong>Causal mask</strong> — setting attention scores for future positions to <math data-tex=\"-\\infty\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math> before softmax, so a\ndecoder token can only attend to itself and earlier tokens.</li>\n<li><strong>Cross-attention</strong> — an attention sub-layer where queries come from one sequence (the decoder) and\nkeys/values come from another (the encoder output).</li>\n<li><strong>Decoder-only</strong> — a Transformer configuration using only causal (masked) self-attention; the GPT\nfamily.</li>\n<li><strong>Encoder-decoder</strong> — a Transformer configuration with a bidirectional encoder and a causal decoder\njoined by cross-attention; the T5/BART family.</li>\n<li><strong>Encoder-only</strong> — a Transformer configuration using only bidirectional self-attention; the BERT\nfamily.</li>\n<li><strong>Feed-forward network (FFN)</strong> — the per-token sub-layer that expands to a wider hidden dimension,\napplies GELU, and projects back down.</li>\n<li><strong>GELU</strong> — a smooth non-linearity, <math data-tex=\"x\\cdot\\Phi(x)\"><mrow><mi>x</mi><mo>⋅</mo><mrow><mi mathvariant=\"normal\">Φ</mi><mspace></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, used in the Transformer feed-forward layer.</li>\n<li><strong>LoRA (Low-Rank Adaptation)</strong> — freezing the base weights and training a small low-rank update\nadded alongside them; no added inference latency, since it merges back after training.</li>\n<li><strong>Masked Language Model (MLM)</strong> — BERT's pre-training objective: hide ~15% of tokens, predict them\nfrom bidirectional context.</li>\n<li><strong>Next Sentence Prediction (NSP)</strong> — BERT's second pre-training objective: classify whether sentence\nB truly follows sentence A.</li>\n<li><strong>PEFT (Parameter-Efficient Fine-Tuning)</strong> — the family of techniques (adapters, LoRA, QLoRA)\ntraining far fewer than all of a model's parameters.</li>\n<li><strong>Positional encoding</strong> — a position-dependent vector added to each token embedding, giving\nattention a sense of order it otherwise lacks.</li>\n<li><strong>QLoRA</strong> — LoRA applied on top of a 4-bit-quantized frozen base, enabling fine-tuning of very large\nmodels on a single GPU.</li>\n<li><strong>RoPE</strong> — rotary position embedding; rotates queries and keys by an angle dependent on relative\ndistance.</li>\n<li><strong>Sinusoidal positional encoding</strong> — the original Transformer's fixed sine/cosine formula for\nbuilding position vectors.</li>\n<li><strong>Top-k sampling</strong> — keep only the <math data-tex=\"k\"><mi>k</mi></math> most likely next tokens, renormalize, then sample.</li>\n<li><strong>Top-p (nucleus) sampling</strong> — keep the smallest set of next tokens whose probabilities sum to <math data-tex=\"p\"><mi>p</mi></math>,\nthen sample.</li>\n<li><strong>Temperature</strong> — a scalar dividing logits before softmax; <math data-tex=\"T&lt;1\"><mrow><mi>T</mi><mo>&lt;</mo><mn>1</mn></mrow></math> sharpens the distribution, <math data-tex=\"T&gt;1\"><mrow><mi>T</mi><mo>&gt;</mo><mn>1</mn></mrow></math>\nflattens it.</li>\n<li><strong>Unigram LM / SentencePiece</strong> — subword tokenizer that prunes a large candidate piece set down,\nkeeping the maximum-likelihood segmentation; used by T5.</li>\n<li><strong>WordPiece</strong> — subword tokenizer merging the pair with the highest score\n(freq(a,b)/(freq(a)·freq(b))); used by BERT.</li>\n</ul>\n<hr>\n</section><section id=\"sequential-learning-20-s27\" data-title=\"Check yourself\" data-kind=\"back\" data-part=\"Part 3 — Language Models\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s27\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>State the three-way tension word-level and character-level tokenization each fall into, and\nexplain how subword tokenization resolves it. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Work through BPE tokenizing an unseen word using a small set of learned merge rules, then explain\nwhy byte-level BPE specifically eliminates the <code>[UNK]</code> case. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>)</em></li>\n<li>Compute WordPiece's score for a pair appearing 5 times when its two components appear 20 and 25\ntimes individually, and compare it to a pair appearing 20 times whose components each appear 100\ntimes. Which does WordPiece prefer? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>Explain the Unigram/SentencePiece training direction (top-down pruning) and how it differs from\nBPE and WordPiece's direction. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Why does self-attention alone treat &quot;dog bites man&quot; and &quot;man bites dog&quot; identically, and what\nfixes this? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>)</em></li>\n<li>Name one strength and one limitation of learned (absolute) positional encoding, and explain why\nRoPE/ALiBi were developed as alternatives. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7.3–7\" role=\"link\" tabindex=\"0\">§7.3–7</a>.4)</em></li>\n<li>Diagram a single Transformer block from input to output, labeling both Add &amp; Norm steps and both\nsub-layers. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>)</em></li>\n<li>Derive why setting future-position scores to <math data-tex=\"-\\infty\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math> before softmax (rather than zeroing weights\nafter) is necessary for causal masking. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§11.1\" role=\"link\" tabindex=\"0\">§11.1</a>)</em></li>\n<li>Explain the two changes that turn an encoder block into a decoder block. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§11.2\" role=\"link\" tabindex=\"0\">§11.2</a>)</em></li>\n<li>State BERT's two pre-training objectives and explain why NSP's necessity is flagged as unsettled\nby the lecture itself. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§15.3–15\" role=\"link\" tabindex=\"0\">§15.3–15</a>.4)</em></li>\n<li>Derive GPT's autoregressive factorization formula in words, then explain why next-token\nprediction alone is described as &quot;so powerful.&quot; <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§16.1\" role=\"link\" tabindex=\"0\">§16.1</a>)</em></li>\n<li>Compare temperature, top-k, and top-p sampling — which one adapts its candidate-set size to the\nmodel's confidence, and how? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§16.3\" role=\"link\" tabindex=\"0\">§16.3</a>)</em></li>\n<li>Order the four-step parameter-efficient fine-tuning ladder and state, for each step, the specific\ncost of the previous step that it fixes. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§18\" role=\"link\" tabindex=\"0\">§18</a>)</em></li>\n<li>State the from-scratch vs. pre-trained test accuracy result from the hands-on notebook, and\nexplain what specifically was held constant to make that comparison meaningful. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§21\" role=\"link\" tabindex=\"0\">§21</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-20-s28\" data-title=\"Going deeper\" data-kind=\"back\" data-part=\"Part 3 — Language Models\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s28\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Sennrich, Haddow, Birch (2016), &quot;Neural Machine Translation of Rare Words with Subword Units&quot;</strong>\n— brought BPE to NLP; named directly on the lecture's own slide [slide 17]. <code>solid</code> · primary\nsource for <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>.</li>\n<li><strong>Devlin et al. (2018/2019), &quot;BERT: Pre-training of Deep Bidirectional Transformers for Language\nUnderstanding&quot;</strong> — the original BERT paper, source of WordPiece's use, MLM, and NSP. <code>solid</code> ·\nprimary source for <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> and <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§15\" role=\"link\" tabindex=\"0\">§15</a>.</li>\n<li><strong>Kudo &amp; Richardson (2018), &quot;SentencePiece&quot;</strong> and <strong>Kudo (2018), &quot;Subword Regularization&quot;</strong> — the\nUnigram LM / SentencePiece tokenizer, named directly [slide 30]. <code>solid</code> · primary source for <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>.</li>\n<li><strong>Vaswani et al. (2017), &quot;Attention Is All You Need&quot;</strong> — the Transformer paper; primary source for\nthe full architecture in <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>–<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§12\" role=\"link\" tabindex=\"0\">§12</a>, sinusoidal positional encoding, and the encoder-decoder structure.\n<code>solid</code> · essential, continues directly from Lecture 19's closing pointer.</li>\n<li><strong>Radford, Narasimhan, Salimans, Sutskever (2018), &quot;Improving Language Understanding by\nGenerative Pre-Training&quot;</strong> (GPT-1) and <strong>Radford, Wu, Child, Luan, Amodei, Sutskever (2019),\n&quot;Language Models are Unsupervised Multitask Learners&quot;</strong> (GPT-2) — two separate papers, not one:\nGPT-1 established the decoder-only, autoregressive pre-training paradigm taught in <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§16\" role=\"link\" tabindex=\"0\">§16</a>; GPT-2\nscaled it up and introduced the byte-level BPE tokenizer referenced in <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>. <code>solid</code>.</li>\n<li><strong>Raffel et al. (2020), &quot;Exploring the Limits of Transfer Learning with a Unified Text-to-Text\nTransformer&quot; (T5)</strong> — the encoder-decoder, text-to-text paradigm and span-denoising objective in\n<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§19\" role=\"link\" tabindex=\"0\">§19</a>. <code>solid</code>.</li>\n<li><strong>Hu et al. (2021), &quot;LoRA: Low-Rank Adaptation of Large Language Models&quot;</strong> and <strong>Dettmers et al.\n(2023), &quot;QLoRA: Efficient Finetuning of Quantized LLMs&quot;</strong> — primary sources for <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§18\" role=\"link\" tabindex=\"0\">§18</a>'s final two\nrungs of the PEFT ladder. <code>hard</code> · read after full fine-tuning and adapters are clear.</li>\n<li><strong>Su et al. (2021), &quot;RoFormer&quot; (RoPE)</strong> and <strong>Press, Smith, Lewis (2021), &quot;ALiBi&quot;</strong> — primary\nsources for <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7.4\" role=\"link\" tabindex=\"0\">§7.4</a>'s relative-position methods, named directly on the lecture's slides. <code>hard</code>.</li>\n</ol>\n<blockquote class=\"aside-quote\">\n<p><strong>Externally verified</strong> (module enhancement pass, 2026-08-30) — titles, full author lists, years,\nand venues for #1–8 above were independently checked against each paper's primary listing\n(arXiv/ACL Anthology/JMLR) and confirmed exact: Sennrich, Haddow &amp; Birch, ACL 2016; Devlin, Chang,\nLee &amp; Toutanova, arXiv 2018 / NAACL 2019; Kudo &amp; Richardson, EMNLP 2018 (SentencePiece); GPT-1\n(Radford, Narasimhan, Salimans &amp; Sutskever, 2018) and GPT-2 (Radford, Wu, Child, Luan, Amodei &amp;\nSutskever, 2019) confirmed as two separate papers with two separate titles — previously stated here\nas one paper covering both, now corrected; Raffel et al., JMLR 2020 (T5); Hu et al., arXiv 2021\n(LoRA); Dettmers, Pagnoni, Holtzman &amp; Zettlemoyer, arXiv 2023 (QLoRA); Su, Lu, Pan, Wen &amp; Liu, arXiv\n2021 (RoFormer/RoPE); Press, Smith &amp; Lewis, arXiv 2021 (ALiBi). The lecture's own slides gave only\nshort in-line citations (author + year), not full bibliographic detail — the fuller detail above\ncomes from this external check, not from the slides themselves.</p>\n</blockquote>\n</section>","sections":[{"id":"sequential-learning-20-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"sequential-learning-20-s1","num":"","title":"Before we start: what you need to know","mins":3,"kind":"content","part":""},{"id":"sequential-learning-20-s2","num":"","title":"The big picture","mins":1,"kind":"content","part":""},{"id":"sequential-learning-20-s3","num":"1","title":"Why Word-Level and Character-Level Both Fail","mins":2,"kind":"content","part":"Part 1 — Sub-word Tokenization"},{"id":"sequential-learning-20-s4","num":"2","title":"Method 1 — Byte Pair Encoding (BPE)","mins":3,"kind":"content","part":"Part 1 — Sub-word Tokenization"},{"id":"sequential-learning-20-s5","num":"3","title":"Method 2 — WordPiece","mins":2,"kind":"content","part":"Part 1 — Sub-word Tokenization"},{"id":"sequential-learning-20-s6","num":"4","title":"Method 3 — Unigram LM / SentencePiece","mins":2,"kind":"content","part":"Part 1 — Sub-word Tokenization"},{"id":"sequential-learning-20-s7","num":"5","title":"Comparison — Same Goal, Three Different Strategies [slide 32]","mins":1,"kind":"content","part":"Part 1 — Sub-word Tokenization"},{"id":"sequential-learning-20-s8","num":"6","title":"A Model Sees Numbers, Not Text [slide 7]","mins":1,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s9","num":"7","title":"Positional Encoding — the Problem","mins":4,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s10","num":"8","title":"Inside One Transformer Block [slide 66]","mins":1,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s11","num":"9","title":"Self-Attention — Query, Key, Value: a Soft Lookup [slide 67]","mins":3,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s12","num":"10","title":"Finishing the Block — the Feed-Forward Network [slide 75]","mins":1,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s13","num":"11","title":"Encoder vs. Decoder — Two Kinds of Stack [slide 81]","mins":4,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s14","num":"12","title":"The Full Transformer Architecture [slide 91]","mins":1,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s15","num":"13","title":"The Decoder — the Prediction Head [slide 93]","mins":1,"kind":"content","part":"Part 2 — Transformer Architecture"},{"id":"sequential-learning-20-s16","num":"14","title":"Three Families, One Paradigm [slide 97]","mins":1,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s17","num":"15","title":"Family 1 — Encoder-Only: BERT","mins":5,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s18","num":"16","title":"Family 2 — Decoder-Only: GPT","mins":4,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s19","num":"17","title":"Adapting a Pre-Trained Decoder [slide 126]","mins":1,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s20","num":"18","title":"Parameter-Efficient Fine-Tuning — Shrinking What You Train [slide 132]","mins":5,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s21","num":"19","title":"Family 3 — Encoder-Decoder: T5 [slide 136]","mins":1,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s22","num":"20","title":"Recap — One Block, Three Families, One Paradigm [slide 138]","mins":1,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s23","num":"21","title":"The Hands-On Notebook — Fine-Tuning a Text Classifier, Step by Step","mins":2,"kind":"content","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s24","num":"","title":"Putting it together","mins":3,"kind":"back","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s25","num":"","title":"Interview prep — Amazon Applied Scientist","mins":16,"kind":"back","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s26","num":"","title":"Glossary","mins":3,"kind":"back","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s27","num":"","title":"Check yourself","mins":2,"kind":"back","part":"Part 3 — Language Models"},{"id":"sequential-learning-20-s28","num":"","title":"Going deeper","mins":3,"kind":"back","part":"Part 3 — Language Models"}],"interactiveCount":5}],"course":[{"slug":"supervised-learning","name":"Supervised Learning","lect on"},{"num":"20","short":"Part 3 · Subword Tokenization, the Transformer, and Language…"}]},{"slug":"causal-inference","name":"Causal Inference","lectures":3,"sections":61,"index":[{"num":"21","short":"Part 1 · Foundations, Graphical Models, and do-Calculus"},{"num":"22","short":"Part 2 · Treatment Effects, Identification, and Classical…"},{"num":"23","short":"Part 3 · Causal ML Methods for Treatment Effect Estimation"}]},{"slug":"reinforcement-learning","name":"Reinforcement Learning","lectures":3,"sections":62,"index":[{"num":"24","short":"Part 1 · Foundations, MDPs, and Bellman Equations"},{"num":"25","short":"Part 2 · From Planning to Learning"},{"num":"26","short":"Part 3 · From Policy Gradients to Human Feedback"}]},{"slug":"agentic-ai","name":"Agentic AI","lectures":3,"sections":61,"index":[{"num":"27","short":"Part 1 · Fundamentals, Architectures, and Reasoning"},{"num":"28","short":"Part 2 · Tools, Memory, and MCP"},{"num":"29","short":"Part 3 · Multi-Agent Systems, Workflows, and Production"}]}]}</script>
<script>"use strict";
/* Real interactive figures for Supervised Learning.  Keyed by the `title:` in
   the source `interactive` block.  Anything without an entry here keeps its
   fallback prose (which teaches the point completely on its own). */

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
// a minimal cartesian plotter: data coords -> pixel coords, axes, grid
function mkPlot(mount, { w = 460, h = 300, xr, yr, xlab, ylab, pad = 34 }){
  const svg = el('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h });
  el('rect', { x: 0, y: 0, width: w, height: h, class: 'plot-bg', rx: 6 }, svg);
  const X = v => pad + (v - xr[0]) / (xr[1] - xr[0]) * (w - pad - 8);
  const Y = v => (h - pad) - (v - yr[0]) / (yr[1] - yr[0]) * (h - pad - 10);
  for (let i = 0; i <= 4; i++){
    const gx = xr[0] + (xr[1] - xr[0]) * i / 4, gy = yr[0] + (yr[1] - yr[0]) * i / 4;
    el('line', { x1: X(gx), y1: Y(yr[0]), x2: X(gx), y2: Y(yr[1]), class: 'plot-grid' }, svg);
    el('line', { x1: X(xr[0]), y1: Y(gy), x2: X(xr[1]), y2: Y(gy), class: 'plot-grid' }, svg);
    const tx = el('text', { x: X(gx), y: h - pad + 13, class: 'plot-label', 'text-anchor': 'middle' }, svg);
    tx.textContent = (+gx.toFixed(2)).toString();
    const ty = el('text', { x: pad - 5, y: Y(gy) + 3, class: 'plot-label', 'text-anchor': 'end' }, svg);
    ty.textContent = (+gy.toFixed(2)).toString();
  }
  el('line', { x1: X(xr[0]), y1: Y(yr[0]), x2: X(xr[1]), y2: Y(yr[0]), class: 'plot-axis' }, svg);
  el('line', { x1: X(xr[0]), y1: Y(yr[0]), x2: X(xr[0]), y2: Y(yr[1]), class: 'plot-axis' }, svg);
  if (xlab) { const t = el('text', { x: w - 6, y: h - pad + 13, class: 'plot-label', 'text-anchor': 'end' }, svg); t.textContent = xlab; }
  if (ylab) { const t = el('text', { x: pad - 5, y: 12, class: 'plot-label', 'text-anchor': 'end' }, svg); t.textContent = ylab; }
  mount.appendChild(svg);
  const api = {
    svg, X, Y,
    curve(fn, attrs){
      let d = '';
      for (let i = 0; i <= 240; i++){
        const x = xr[0] + (xr[1] - xr[0]) * i / 240;
        const y = fn(x);
        if (!isFinite(y)) { d += ' M'; continue; }
        d += `${d && d.slice(-2) !== ' M' ? 'L' : 'M'}${X(x).toFixed(1)},${Y(Math.max(yr[0], Math.min(yr[1], y))).toFixed(1)} `;
      }
      return el('path', Object.assign({ d, fill: 'none', 'stroke-width': 2 }, attrs), svg);
    },
    seg(x1, y1, x2, y2, attrs){ return el('line', Object.assign({ x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), 'stroke-width': 2 }, attrs), svg); },
    dot(x, y, r, attrs){ return el('circle', Object.assign({ cx: X(x), cy: Y(y), r }, attrs), svg); },
  };
  return api;
}
function ctl(mount, defs, onChange){
  const bar = document.createElement('div'); bar.className = 'iv-ctl';
  const state = {};
  defs.forEach(d => {
    state[d.key] = d.value;
    const lab = document.createElement('label');
    lab.innerHTML = `${d.label} <span>${d.type === 'range'
      ? `<input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.value}"><span class="val"> ${d.fmt ? d.fmt(d.value) : d.value}</span>`
      : d.options.map(o => `<label style="flex-direction:row;gap:4px;font-weight:500"><input type="radio" name="${d.key}" value="${o}" ${o === d.value ? 'checked' : ''}>${o}</label>`).join(' ')}</span>`;
    if (d.type === 'range') {
      const inp = lab.querySelector('input'), out = lab.querySelector('.val');
      inp.addEventListener('input', () => { state[d.key] = +inp.value; out.textContent = ' ' + (d.fmt ? d.fmt(+inp.value) : inp.value); onChange(state); });
    } else {
      lab.querySelectorAll('input').forEach(r => r.addEventListener('change', () => { state[d.key] = r.value; onChange(state); }));
    }
    bar.appendChild(lab);
  });
  mount.appendChild(bar);
  return state;
}
function readout(mount){ const d = document.createElement('div'); d.className = 'readout'; mount.appendChild(d); return d; }

const INTERACTIVE = {};

/* ── L2 §2 — One outlier, two fits ─────────────────────────────────── */
INTERACTIVE['One outlier, two fits'] = (mount, spec) => {
  const base = [];
  for (let i = 0; i < 18; i++){ const x = i / 17 * 8 + 1; base.push([x, 0.6 * x + 2 + (Math.sin(i * 91.7) * 0.7)]); }
  const P = mkPlot(mount, { xr: [0, 10], yr: [0, 14], xlab: 'x', ylab: 'y' });
  const fitLine = wfn => P.curve(wfn, {});
  const mseL = P.curve(x => x, { stroke: 'var(--c-warn)' });
  const maeL = P.curve(x => x, { stroke: 'var(--accent)' });
  const outDot = P.dot(6, 12, 6, { fill: 'var(--c-warn)', cursor: 'ns-resize' });
  base.forEach(([x, y]) => P.dot(x, y, 3, { fill: 'var(--ink-3)' }));
  const out = readout(mount);
  let oy = 12;
  function fitMSE(pts){ // least squares
    const n = pts.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
    pts.forEach(([x, y]) => { sx += x; sy += y; sxx += x * x; sxy += x * y; });
    const m = (n * sxy - sx * sy) / (n * sxx - sx * sx); return [m, (sy - m * sx) / n];
  }
  function fitMAE(pts){ // coordinate-descent-ish: minimise sum|y-mx-b| over a grid
    let best = [0.6, 2], bs = 1e9;
    for (let m = -0.5; m <= 2; m += 0.02) for (let b = -2; b <= 8; b += 0.1){
      let s = 0; for (const [x, y] of pts) s += Math.abs(y - m * x - b);
      if (s < bs) { bs = s; best = [m, b]; }
    }
    return best;
  }
  function draw(){
    const pts = base.concat([[6, oy]]);
    const [m1, b1] = fitMSE(pts), [m2, b2] = fitMAE(pts);
    mseL.setAttribute('d', pathFor(P, x => m1 * x + b1));
    maeL.setAttribute('d', pathFor(P, x => m2 * x + b2));
    outDot.setAttribute('cy', P.Y(oy));
    out.innerHTML = `outlier at y = <b>${oy.toFixed(1)}</b> &nbsp;·&nbsp;
      <span style="color:var(--c-warn)">MSE fit</span> ŷ = <b>${m1.toFixed(2)}</b>x + <b>${b1.toFixed(2)}</b> &nbsp;·&nbsp;
      <span style="color:var(--accent)">MAE fit</span> ŷ = <b>${m2.toFixed(2)}</b>x + <b>${b2.toFixed(2)}</b>`;
  }
  const pathFor = (P, fn) => { let d = ''; for (let i = 0; i <= 60; i++){ const x = i / 60 * 10; d += (i ? 'L' : 'M') + P.X(x).toFixed(1) + ',' + P.Y(fn(x)).toFixed(1) + ' '; } return d; };
  let drag = false;
  const svg = P.svg;
  const yAt = ev => { const r = svg.getBoundingClientRect(); const py = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    const vb = svg.viewBox.baseVal; const sy = py / r.height * vb.height;
    return Math.max(2, Math.min(14, (300 - 34 - sy) / (300 - 34 - 10) * 14)); };
  outDot.addEventListener('pointerdown', e => { drag = true; outDot.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (!drag) return; oy = yAt(e); draw(); });
  svg.addEventListener('pointerup', () => drag = false);
  draw();
};

/* ── L2 §4 — The delta dial (Huber between MSE and MAE) ────────────── */
INTERACTIVE['The delta dial'] = (mount) => {
  const P = mkPlot(mount, { xr: [-6, 6], yr: [0, 8], xlab: 'error  e', ylab: 'loss' });
  P.curve(e => 0.5 * e * e, { stroke: 'var(--ink-3)', 'stroke-dasharray': '4 3' });     // MSE ½e²
  P.curve(e => Math.abs(e), { stroke: 'var(--ink-3)', 'stroke-dasharray': '1 3' });      // MAE |e|
  const hub = P.curve(e => e, { stroke: 'var(--accent)', 'stroke-width': 2.5 });
  const zoneL = P.seg(-2, 0, -2, 8, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const zoneR = P.seg(2, 0, 2, 8, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const out = readout(mount);
  const st = ctl(mount, [{ key: 'd', label: 'δ', type: 'range', min: 0.3, max: 5, step: 0.1, value: 2, fmt: v => v.toFixed(1) }], s => draw(s.d));
  function huber(e, d){ const a = Math.abs(e); return a <= d ? 0.5 * e * e : d * (a - d / 2); }
  function draw(d){
    let dd = ''; for (let i = 0; i <= 240; i++){ const e = -6 + 12 * i / 240; dd += (i ? 'L' : 'M') + P.X(e).toFixed(1) + ',' + P.Y(Math.min(8, huber(e, d))).toFixed(1) + ' '; }
    hub.setAttribute('d', dd);

  P.curve(p => 2 * p * (1 - p), { stroke: 'var(--accent)' });                              // Gini
  P.curve(p => p <= 0 || p >= 1 ? 0 : -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p)) / 2, { stroke: 'var(--c-key)', 'stroke-dasharray': '4 3' }); // entropy/2

/* ── GenAI · L3 / Sequential · L3 — temperature + top-p on a distribution */
INTERACTIVE['Temperature and top-p, live'] = (mount) => {
  const PROMPTS = {
    'confident (“capital of France is …”)': [4.2, 1.4, 0.9, 0.6, 0.3, 0.1, 0.0, -0.3],
    'open-ended (“the weather was …”)': [1.1, 1.0, 0.95, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5],
  };
  const wrap = document.createElement('div'); mount.insertBefore(wrap, mount.firstChild);
  const out = readout(mount);
  const st = ctl(mount, [
    { key: 'prompt', label: 'prompt', type: 'radio', value: Object.keys(PROMPTS)[0], options: Object.keys(PROMPTS) },
    { key: 'T', label: 'temperature', type: 'range', min: 0.1, max: 2, step: 0.05, value: 1, fmt: v => v.toFixed(2) },
    { key: 'p', label: 'top-p', type: 'range', min: 0.1, max: 1, step: 0.05, value: 0.9, fmt: v => v.toFixed(2) },
  ], s => draw(s.prompt, s.T, s.p));
  function draw(prompt, T, p){
    const logits = PROMPTS[prompt];
    const ex = logits.map(z => Math.exp(z / T)); const Z = ex.reduce((a, b) => a + b, 0);
    const probs = ex.map(e => e / Z);
    const order = probs.map((v, i) => i).sort((a, b) => probs[b] - probs[a]);
    let cum = 0; const kept = new Set();
    for (const i of order){ kept.add(i); cum += probs[i]; if (cum >= p) break; }
    wrap.innerHTML = probs.map((v, i) => `<div style="display:flex;align-items:center;gap:8px;margin:2px 0;font-family:var(--font-ui);font-size:11px">
      <span style="width:22px;color:var(--ink-3)">t${i + 1}</span>
      <div style="flex:1;height:12px;background:var(--rule);border-radius:3px;overflow:hidden">

      <span style="width:38px;text-align:right;font-variant-numeric:tabular-nums">${(v * 100).toFixed(1)}%</span></div>`).join('');
    out.innerHTML = `T = <b>${T.toFixed(2)}</b>, top-p = <b>${p.toFixed(2)}</b> keeps <b>${kept.size} of ${probs.length}</b> tokens.

  }
  draw(Object.keys(PROMPTS)[0], 1, 0.9);
};

/* ── GenAI · L3 — the quantization cliff ─────────────────────────── */
INTERACTIVE['The quantization cliff'] = (mount) => {
  const P = mkPlot(mount, { xr: [2, 16], yr: [0, 4], xlab: 'bits per weight', ylab: 'perplexity increase vs FP16' });
  P.curve(b => Math.max(0, Math.pow(Math.max(0, 4 - b), 2) * 0.6), { stroke: 'var(--c-warn)' });
  const dot = P.dot(4, 0, 4, { fill: 'var(--accent)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'b', label: 'bits', type: 'range', min: 2, max: 16, step: 0.5, value: 4, fmt: v => v }], s => draw(s.b));
  function draw(b){
    const dppl = Math.max(0, Math.pow(Math.max(0, 4 - b), 2) * 0.6);
    const size = (13 * b / 16).toFixed(1);
    dot.setAttribute('cx', P.X(b)); dot.setAttribute('cy', P.Y(Math.min(4, dppl)));
    out.innerHTML = `<b>${b}</b>-bit → model ≈ <b>${size} GB</b>, perplexity <b>+${dppl.toFixed(2)}</b> vs FP16.
      ${b >= 4 ? 'Flat — memory savings almost for free down to ~4 bits.' : 'Past the cliff — every further bit now costs real accuracy.'}
      The engineering call is knowing <em>where</em> the cliff sits, not just that quantization "helps".`;
  }
  draw(4);
};

/* ── GenAI · L4 — forward diffusion, scrub t ─────────────────────── */
INTERACTIVE['Diffusion step t, from clean image to pure noise'] = (mount) => {
  const G = 16, cell = 12;
  const svg = el('svg', { viewBox: `0 0 ${G * cell} ${G * cell}`, width: G * cell, height: G * cell });
  // a simple recognisable shape: a diagonal gradient disc
  const base = [];
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++){
    const r = Math.hypot(x - G / 2 + .5, y - G / 2 + .5);
    base.push(r < G * 0.36 ? 0.82 : 0.12);
  }
  const rects = base.map((v, i) => el('rect', { x: (i % G) * cell, y: ((i / G) | 0) * cell, width: cell, height: cell, fill: '#000' }, svg));
  mount.appendChild(svg);
  const out = readout(mount);
  ctl(mount, [{ key: 't', label: 'noise level  t', type: 'range', min: 0, max: 100, step: 1, value: 0, fmt: v => v + '%' }], s => draw(s.t));
  const rand = i => (Math.sin(i * 999.13 + 7.7) * 43758.5453) % 1;
  function draw(t){
    const a = t / 100;
    base.forEach((v, i) => {
      const n = 0.5 + 0.5 * Math.sin(i * 12.9898 + t * 0.6);   // per-frame pseudo-noise
      const g = Math.round(255 * ((1 - a) * v + a * n));
      rects[i].setAttribute('fill', `rgb(${g},${g},${g})`);
    });
    out.innerHTML = `t = <b>${t}%</b> — ${t === 0 ? 'the clean image x₀.' : t >= 99 ? 'pure Gaussian static x_T.' : 'a well-defined point x_t on one fixed path.'}
      The forward process has no parameters, so every x_t is reproducible; the reverse model's whole job is to undo one step of this.`;
  }
  draw(0);
};

/* ── GenAI · L4 — classifier-free guidance scale ─────────────────── */
INTERACTIVE['Guidance scale w'] = (mount) => {
  const P = mkPlot(mount, { xr: [0, 14], yr: [0, 100], xlab: 'guidance scale  w', ylab: '%' });
  const sig = (x, k, m) => 100 / (1 + Math.exp(-k * (x - m)));
  P.curve(w => sig(w, 0.6, 3), { stroke: 'var(--accent)' });        // adherence
  P.curve(w => 100 - sig(w, 0.55, 4), { stroke: 'var(--c-int)' });  // diversity
  P.seg(6, 0, 6, 100, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  P.seg(10, 0, 10, 100, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const dA = P.dot(3, 50, 4, { fill: 'var(--accent)' }), dD = P.dot(3, 50, 4, { fill: 'var(--c-int)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'w', label: 'w', type: 'range', min: 0, max: 14, step: 0.5, value: 3, fmt: v => v.toFixed(1) }], s => draw(s.w));
  function draw(w){
    const a = sig(w, 0.6, 3), d = 100 - sig(w, 0.55, 4);
    dA.setAttribute('cx', P.X(w)); dA.setAttribute('cy', P.Y(a));
    dD.setAttribute('cx', P.X(w)); dD.setAttribute('cy', P.Y(d));
    out.innerHTML = `w = <b>${w.toFixed(1)}</b> — <span style="color:var(--accent)">prompt adherence ${a.toFixed(0)}%</span>,
      <span style="color:var(--c-int)">diversity ${d.toFixed(0)}%</span>.
      They cross near w ≈ 3 and the sweet spot is ~6–10. They're one effect read two ways — past the band you buy adherence you can see and lose diversity you can see.`;
  }
  draw(3);
};

/* ── Sequential · L1 — TF-IDF weight vs document frequency ───────── */
INTERACTIVE['TF-IDF Weight as Document Frequency Changes'] = (mount) => {
  const N = 1000, TF = 3;
  const P = mkPlot(mount, { xr: [1, 1000], yr: [0, 25], xlab: 'documents containing the term  nₜ', ylab: 'tf-idf  (tf = 3)' });
  P.curve(n => TF * Math.log(N / n), { stroke: 'var(--accent)' });
  const dot = P.dot(5, 0, 4, { fill: 'var(--accent)' });
  P.dot(990, TF * Math.log(N / 990), 3, { fill: 'var(--c-warn)' });   // "the"
  P.dot(5, TF * Math.log(N / 5), 3, { fill: 'var(--c-lab)' });        // "fish"
  const out = readout(mount);
  ctl(mount, [{ key: 'n', label: 'nₜ', type: 'range', min: 1, max: 1000, step: 1, value: 5, fmt: v => v }], s => draw(s.n));
  function draw(n){
    const idf = Math.log(N / n), w = TF * idf;
    dot.setAttribute('cx', P.X(n)); dot.setAttribute('cy', P.Y(Math.min(25, w)));
    out.innerHTML = `nₜ = <b>${n}</b> → idf = ln(1000/${n}) = <b>${idf.toFixed(2)}</b>, tf-idf = <b>${w.toFixed(2)}</b>.
      "fish" (nₜ≈5) scores <b>${(TF * Math.log(N / 5)).toFixed(1)}</b>; "the" (nₜ≈990) scores <b>${(TF * Math.log(N / 990)).toFixed(2)}</b> —
      idf swings the weight by orders of magnitude, it isn't a small correction.`;
  }
  draw(5);
};

/* ── Unsupervised · L1 — cut the dendrogram ─────────────────────── */
INTERACTIVE['Cut the dendrogram'] = (mount) => {
  // 9 leaves, a fixed Ward merge sequence (height at which each pair joins)
  const merges = [ [0, 1, 2], [3, 4, 3], [5, 6, 4], [2, 7, 6], [8, -1, 7], [0, 3, 9], [5, 8, 12], [0, 5, 16] ];
  const W = 380, H = 240, pad = 24;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  el('rect', { x: 0, y: 0, width: W, height: H, class: 'plot-bg', rx: 6 }, svg);
  const leafX = i => pad + i * (W - 2 * pad) / 8;
  const Y = h => H - pad - h / 17 * (H - 2 * pad);
  // draw simple connectors bottom-up
  const pos = {}; for (let i = 0; i < 9; i++) pos[i] = { x: leafX(i), y: H - pad };
  let cid = 9;
  merges.forEach(([a, b, h]) => {
    const A = pos[a], B = pos[b] || A;
    const nx = (A.x + B.x) / 2, ny = Y(h);
    el('path', { d: `M${A.x},${A.y} V${ny} H${B.x} V${B.y}`, fill: 'none', stroke: 'var(--ink-3)', 'stroke-width': 1.4 }, svg);
    pos[cid++] = { x: nx, y: ny };
  });
  for (let i = 0; i < 9; i++){ const t = el('text', { x: leafX(i), y: H - 6, class: 'plot-label', 'text-anchor': 'middle' }, svg); t.textContent = String.fromCharCode(65 + i); }
  const cutLine = el('line', { x1: pad, x2: W - pad, y1: Y(10), y2: Y(10), stroke: 'var(--accent)', 'stroke-width': 2 }, svg);
  mount.appendChild(svg);
  const out = readout(mount);
  ctl(mount, [{ key: 'h', label: 'cut height', type: 'range', min: 1, max: 17, step: 0.5, value: 10, fmt: v => v.toFixed(1) }], s => draw(s.h));
  function draw(h){
    cutLine.setAttribute('y1', Y(h)); cutLine.setAttribute('y2', Y(h));
    const k = 9 - merges.filter(m => m[2] <= h).length;
    out.innerHTML = `cut at height <b>${h.toFixed(1)}</b> → <b>${Math.max(1, k)}</b> clusters.
      Nothing is recomputed — every K from 1 (above the root) to 9 (below every leaf) is already in this one tree,
      unlike K-Means' "re-run for every K".`;
  }
  draw(10);
};

/* ── RL · L1 — γ and the effective horizon ──────────────────────── */
INTERACTIVE["γ and the Agent's Time Horizon"] = (mount) => {
  const P = mkPlot(mount, { xr: [0, 60], yr: [0, 1], xlab: 'steps into the future  t', ylab: 'weight  γᵗ' });
  const curve = P.curve(t => Math.pow(0.9, t), { stroke: 'var(--accent)' });
  const mk = P.seg(10, 0, 10, 1, { stroke: 'var(--rule-2)', 'stroke-dasharray': '2 2' });
  const out = readout(mount);
  ctl(mount, [{ key: 'g', label: 'γ', type: 'range', min: 0, max: 0.99, step: 0.01, value: 0.9, fmt: v => v.toFixed(2) }], s => draw(s.g));
  function draw(g){
    let d = ''; for (let i = 0; i <= 60; i++) d += (i ? 'L' : 'M') + P.X(i) + ',' + P.Y(Math.pow(g, i)) + ' ';
    curve.setAttribute('d', d);
    const hor = g < 1 ? 1 / (1 - g) : Infinity;
    mk.setAttribute('x1', P.X(Math.min(60, hor))); mk.setAttribute('x2', P.X(Math.min(60, hor)));
    out.innerHTML = `γ = <b>${g.toFixed(2)}</b> → effective horizon 1/(1−γ) ≈ <b>${isFinite(hor) ? hor.toFixed(0) : '∞'}</b> steps.
      A reward ${Math.round(hor)} steps away is already discounted to ~37% of its face value.
      ${g < 0.5 ? 'Near-sighted: only the next move matters.' : g > 0.97 ? 'Far-sighted — and slow, high-variance to learn.' : ''}`;
  }
  draw(0.9);
};

/* ── DimRed · L1 — volume of a ball inside its cube ─────────────── */
function lgamma(x){
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
INTERACTIVE['Ball inside a cube, as dimension grows'] = (mount) => {
  const P = mkPlot(mount, { xr: [1, 20], yr: [-8, 0], xlab: 'dimension  d', ylab: 'log₁₀ (ball ÷ cube)' });
  const ratio = d => Math.exp((d / 2) * Math.log(Math.PI) - lgamma(d / 2 + 1)) / Math.pow(2, d);
  P.curve(d => Math.log10(ratio(d)), { stroke: 'var(--accent)' });
  const dot = P.dot(3, Math.log10(ratio(3)), 4, { fill: 'var(--accent)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'd', label: 'dimension', type: 'range', min: 1, max: 20, step: 1, value: 3, fmt: v => v }], s => draw(s.d));
  function draw(d){
    const r = ratio(d);
    dot.setAttribute('cx', P.X(d)); dot.setAttribute('cy', P.Y(Math.max(-8, Math.log10(r))));
    out.innerHTML = `d = <b>${d}</b> — the inscribed ball fills <b>${r < 1e-3 ? r.toExponential(1) : (r * 100).toFixed(1) + '%'}</b> of the cube.
      By d = 10 it's under 0.25%; essentially all the cube's volume is in the corners the ball never reaches.
      That emptiness is the curse of dimensionality in one number.`;
  }
  draw(3);
};

/* ── DimRed · L1 — distance concentration ───────────────────────── */
INTERACTIVE['Distances concentrate as dimension grows'] = (mount) => {
  const P = mkPlot(mount, { xr: [1, 100], yr: [0, 1], xlab: 'dimension  d', ylab: '(max − min) ÷ min distance' });
  P.curve(d => 1.8 / Math.sqrt(d), { stroke: 'var(--accent)' });
  const dot = P.dot(2, 1.8 / Math.SQRT2, 4, { fill: 'var(--accent)' });
  const out = readout(mount);
  ctl(mount, [{ key: 'd', label: 'dimension', type: 'range', min: 2, max: 100, step: 1, value: 2, fmt: v => v }], s => draw(s.d));
  function draw(d){
    const c = 1.8 / Math.sqrt(d);
    dot.setAttribute('cx', P.X(d)); dot.setAttribute('cy', P.Y(Math.min(1, c)));
    out.innerHTML = `d = <b>${d}</b> — nearest and farthest point differ by only <b>${(c * 100).toFixed(0)}%</b> of the near distance.
      As d grows every pair of points drifts toward the same distance, so "nearest neighbour" stops meaning much — the ~1/√d shape is why.`;
  }
  draw(2);
};

/* ── phase-driven filtered views ── */
function showPhaseView(kind){
  const L = LECS[curLec];
  const t = document.createElement('div'); t.innerHTML = L.html;
  view = 'phase:' + kind;
  doc.className = 'doc';
  let body;
  if (kind === 'second') {
    const blocks = [...t.querySelectorAll('h3, h4')].filter(e => /🧪/.test(e.textContent));
    body = `<h1>Second pass — ${esc(L.spineLabel || 'this lecture')}</h1>
      <p class="phase-view-h">Every 🧪 worked example in this lecture, its solution blanked.
      Work each on paper first, then reveal. This is where the learning actually happens.</p>`;
    blocks.forEach((e, i) => {
      let inner = ''; let n = e.nextElementSibling;
      while (n && !/^H[1-4]$/.test(n.tagName) && inner.length < 14000) { inner += n.outerHTML; n = n.nextElementSibling; }
      body += `<div class="qcard"><h3 style="margin-top:0;display:flex;gap:10px;align-items:baseline">${e.innerHTML}
        <button class="tryfirst" data-reveal="${i}">Reveal solution</button></h3>
        <div class="masked" id="pv-${i}">${inner}</div></div>`;
    });
    if (!blocks.length) body += `<p class="view-lead">This lecture has no 🧪 blocks — it's mostly conceptual. A second read of the derivations is the equivalent.</p>`;
  } else {
    const wanted = [...t.querySelectorAll('section')].filter(s =>
      /^(interview prep|putting it together|check yourself)/i.test(s.dataset.title || ''));
    body = `<h1>Interview prep — ${esc(L.spineLabel || 'this lecture')}</h1>
      <p class="phase-view-h">The <em>Putting it together</em> threads, the whiteboard derivations, the
      depth-probe table and the check-yourself questions — the “before an interview” pass.</p>`;
    wanted.forEach(s => { body += s.outerHTML; });
    if (!wanted.length) body += `<p class="view-lead">No interview-prep section found in this lecture.</p>`;
  }
  const nav = `<div class="phase-nav">
    <button data-view="reading">‹ Back to reading</button>
    <button data-phase="second" data-act="view" ${kind === 'second' ? 'aria-current="true"' : ''}>Second pass</button>
    <button data-phase="interview" data-act="view" ${kind === 'interview' ? 'aria-current="true"' : ''}>Interview prep</button>
    <button data-phase="${kind}" data-act="toggle" class="phase-mark">Mark ${kind === 'second' ? 'second pass' : 'interview prep'} done</button>
  </div>`;
  doc.innerHTML = `<div class="view on">${nav}${body}</div>`;
  applyRatingsIn(doc);
  markDeadXrefs();
  renderAll();
  window.scrollTo(0, 0);
}

/* ── state into the current DOM ── */
function applyState(){
  $$('.sec-check').forEach(b => b.classList.toggle('on', !!DONE[b.dataset.sec]));
  Object.entries(HL).forEach(([k, v]) => {
    if (v.mod !== MOD || v.lec !== LECS[curLec].id) return;
    const sec = document.getElementById(v.sec);
    if (sec) applyHL(sec, v.start != null ? v.start : findOffset(sec, v.text), (v.len != null ? v.len : v.text.length), v.c, k);
  });
  Object.entries(NOTES).forEach(([k, v]) => {
    if (v.mod !== MOD || v.lec !== LECS[curLec].id) return;
    const sec = document.getElementById(v.sec); if (!sec) return;
    const p = sec.querySelectorAll('p')[v.p];
    if (p && !p.nextElementSibling?.classList.contains('note')) {
      const d = document.createElement('div'); d.className = 'note'; d.dataset.k = k;
      d.innerHTML = `<button class="note-x" title="Delete">✕</button>${esc(v.text)}`;
      p.after(d);
    }
  });
  $$('section p').forEach((p, ix) => {
    if (p.querySelector('.addn')) return;
    const b = document.createElement('button'); b.className = 'addn'; b.textContent = '+';
    b.title = 'Add a note'; b.dataset.p = ix; p.prepend(b);
  });
  $$('h3, h4').forEach(hh => {
    if (!/🧪/.test(hh.textContent) || hh.querySelector('.tryfirst')) return;
    hh.style.display = 'flex'; hh.style.alignItems = 'baseline'; hh.style.gap = '10px';
    const b = document.createElement('button'); b.className = 'tryfirst'; b.textContent = 'Try it first';
    hh.appendChild(b);
  });
  applyRatingsIn(doc);
  markDeadXrefs();
  buildSearch();
}
function applyRatingsIn(root){
  const byFront = {};
  cardPool().forEach(c => { byFront[c.front.slice(0, 48)] = c; });
  root.querySelectorAll('.recall').forEach(rc => {
    const front = (rc.querySelector('.recall-t')?.textContent || '').replace(/\s+/g, ' ').trim();
    const card = byFront[front.slice(0, 48)];
    if (card) {                                   // this recall card is a spaced-review card
      rc.dataset.card = card.key;
      const s = SRS[card.key];
      if (s) rc.dataset.rated = s.box >= 3 ? '1' : s.box >= 1 ? '2' : '3';
    } else {
      const key = recallKey(rc);
      if (RATE[key]) rc.dataset.rated = RATE[key];
    }
    if (rc.dataset.rated)
      rc.querySelectorAll('.rate-b').forEach(b => b.classList.toggle('on', b.dataset.r === rc.dataset.rated));
  });
}
const recallKey = rc => `${MOD}::${LECS[curLec] ? LECS[curLec].id : ''}::${rc.querySelector('.recall-t')?.textContent.trim().slice(0, 90)}`;

function markDeadXrefs(){
  $$('.xref').forEach(a => {
    if (a.dataset.xrefMod) {
      const m = COURSE.find(x => x.slug === a.dataset.xrefMod);
      a.title = m ? 'Open ' + m.name : '';
      a.classList.remove('dead');
      return;
    }
    const lec = a.dataset.xrefLec;
    if (!lec) return;
    if (lec.startsWith(MOD)) a.classList.remove('dead');
    else { a.classList.add('dead'); a.title = 'In another module'; }
  });
}

/* Highlights span multiple text nodes (a <strong> then plain text, etc.), so we
   store a character offset into the section's text and, on apply, wrap every
   text node the range touches — going back-to-front so earlier offsets hold. */
function sectionTextNodes(sec){
  const w = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
  const out = []; let n;
  while ((n = w.nextNode())) {
    if (n.parentElement.closest('script,style,.addn,.note')) continue;
    out.push(n);
  }
  return out;
}
function offsetOfRange(sec, range){
  const nodes = sectionTextNodes(sec);
  const sc = range.startContainer, so = range.startOffset;
  let acc = 0;
  if (sc.nodeType === 3){
    for (const node of nodes){ if (node === sc) return acc + so; acc += node.nodeValue.length; }
    return acc;
  }
  const boundary = sc.childNodes ? sc.childNodes[so] : null;   // point is just before this child
  for (const node of nodes){
    if (boundary && (node === boundary || boundary.contains?.(node))) return acc;
    if (boundary && (node.compareDocumentPosition(boundary) & Node.DOCUMENT_POSITION_PRECEDING)) return acc;
    acc += node.nodeValue.length;
  }
  return acc;
}
function findOffset(sec, text){ return sec.textContent.indexOf(text); }
function applyHL(sec, start, len, c, k){
  if (!sec || start < 0 || sec.querySelector(`.hl[data-k="${k}"]`)) return;
  const end = start + len;
  const nodes = sectionTextNodes(sec);
  let acc = 0; const hits = [];
  for (const node of nodes){
    const s = acc, e = acc + node.nodeValue.length; acc = e;
    if (e <= start || s >= end) continue;
    hits.push({ node, a: Math.max(0, start - s), b: Math.min(node.nodeValue.length, end - s) });
  }
  for (let i = hits.length - 1; i >= 0; i--){
    const { node, a, b } = hits[i];
    if (a >= b || node.parentElement.closest('.hl')) continue;
    const r = document.createRange(); r.setStart(node, a); r.setEnd(node, b);
    const span = document.createElement('span'); span.className = 'hl'; span.dataset.c = c; span.dataset.k = k;
    try { r.surroundContents(span); } catch (e) {}
  }
}
function removeHL(k){
  document.querySelectorAll(`.hl[data-k="${k}"]`).forEach(el => {
    const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); p.normalize();
  });
}
