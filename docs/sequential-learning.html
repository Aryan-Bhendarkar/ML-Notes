/p><p><strong>Attention has no built-in sense of order</strong> [slide 51]. <em>&quot;A token is a weighted sum of value\nvectors, order is irrelevant. If a token gets shuffled around, its attention output stays\nunchanged, even if the sentence's meaning changed completely.&quot;</em> Two example sentences that\nattention alone treats identically: <code>&quot;dog bites man&quot;</code> vs. <code>&quot;man bites dog&quot;</code> [slide 51] — the exact\nsame failure mode identified in Lecture 18 <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§4.2\" role=\"link\" tabindex=\"0\">§4.2</a>'s Bag-of-Words discussion, now shown to apply to\nraw self-attention too, because self-attention is fundamentally a <em>weighted sum</em> over the sequence,\nand weighted sums don't care about order.</p>\n</aside>\n<h3>7.1 The Fix — give every position its own vector, and add it in [slide 53]</h3>\n<div class=\"mblk\"><math data-tex=\"x_i = \\underbrace{e(\\text{token}_i)}_{\\text{what}} + \\underbrace{p_i}_{\\text{where}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mrow><munder><munder><mrow><mi>e</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mtext>token</mtext><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>what</mtext></munder></mrow><mo>+</mo><mrow><munder><munder><msub><mi>p</mi><mi>i</mi></msub><mo stretchy=\"true\" style=\"math-depth:0;\">⏟</mo></munder><mtext>where</mtext></munder></mrow></mrow></math></div>\n<p>Position <math data-tex=\"i\"><mi>i</mi></math> gets a vector <math data-tex=\"p_i\"><msub><mi>p</mi><mi>i</mi></msub></math> of the same size <math data-tex=\"d\"><mi>d</mi></math> as the token embedding. Add it onto the token\nembedding, so the input now carries both <em>what</em> the token is and <em>where</em> it sits.</p>\n<h3>7.2 Method 1 — Sinusoidal (absolute) [slide 57]</h3>\n<div class=\"mblk\"><math data-tex=\"p_{(\\text{pos},2i)} = \\sin\\!\\left(\\frac{\\text{pos}}{10000^{2i/d}}\\right) \\qquad p_{(\\text{pos},2i+1)} = \\cos\\!\\left(\\frac{\\text{pos}}{10000^{2i/d}}\\right)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>p</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>pos</mtext><mo separator=\"true\">,</mo><mn>2</mn><mi>i</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msub><mo>=</mo><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow style=\"margin-left:-0.1667em;\"></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mtext>pos</mtext><msup><mn>10000</mn><mrow><mn>2</mn><mi>i</mi><mi>/</mi><mi>d</mi></mrow></msup></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mspace width=\"2em\"></mspace><msub><mi>p</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>pos</mtext><mo separator=\"true\">,</mo><mn>2</mn><mi>i</mi><mo>+</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></msub><mo>=</mo><mrow><mi>cos</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow style=\"margin-left:-0.1667em;\"></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mtext>pos</mtext><msup><mn>10000</mn><mrow><mn>2</mn><mi>i</mi><mi>/</mi><mi>d</mi></mrow></msup></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></math></div>\n<p><em>&quot;Each dimension is one sine or cosine wave. Early dimensions are fast waves, later dimensions are\nslow waves. Read down a column to see one wave; read across a row to get one position's vector. The\ncombined pattern is unique to each position&quot;</em> [slide 57]. <em>&quot;The intuition. Each position is like a\nclock reading: [a vertical slice through all the waves] picks one value off every wave&quot;</em> [slide 57].</p>\n<h3>7.3 Method 2 — Learned (absolute) [slide 59]</h3>\n<p>No formula — keep a trainable table with one row per position, learned by gradient descent like any\nother weight. <strong>This is what the original BERT and GPT used.</strong></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>✓ Strengths</th>\n<th>✗ Limits</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Simple; the model tunes positions to whatever helps</td>\n<td>Needs a <strong>fixed maximum length</strong> chosen up front</td>\n</tr>\n<tr>\n<td>Matches sinusoidal quality within the trained length</td>\n<td>No row exists for positions <strong>beyond training</strong>, so it cannot extrapolate</td>\n</tr>\n<tr>\n<td></td>\n<td>Encodes absolute index only, with no notion of distance</td>\n</tr>\n</tbody>\n</table></div>\n<h3>7.4 The field's move: RoPE and ALiBi [slide 63]</h3>\n<aside class=\"callout callout-res\"><p class=\"callout-h\"><span class=\"callout-badge\">🔬</span>Research</p><p><strong>Research opportunity — this is an active area.</strong> <em>&quot;What if distance matters more than absolute\nindex?&quot;</em> [slide 61] — a query at position 5 attending to a key at position 8 should encode &quot;gap of\n3,&quot; regardless of whether it's the sentence's 1st-vs-4th token or 100th-vs-103rd. <em>&quot;This is\ngenuinely in practice: Transformer-XL, T5 (a relative position bias), and DeBERTa&quot;</em> [slide 61].</p>\n<p><em>&quot;Why modern LLMs moved to RoPE and ALiBi: because to fit longer context lengths (modern context\nlengths often reach far into the tens of thousands), the fixed vocabulary/window of the older\nmethods runs out. Second, generalizing to context lengths longer than what the embedding was\ntrained on&quot;</em> [slide 63]:</p>\n<ul>\n<li><strong>RoPE (rotary position embedding)</strong> — rotates each query and key by an angle that depends on its\n<em>relative</em> distance; the embedding is rotated, not added. Used by LLaMA, GPT-NeoX, PaLM, Qwen.</li>\n<li><strong>ALiBi (attention with linear biases)</strong> — adds a penalty proportional to how far apart the\nscores go, with the distance embedded via linear biases. No learned position parameters, and\nstrong length extrapolation. Used by BLOOM and MPT.</li>\n</ul>\n</aside>\n<p>The specific model lists attributed to RoPE (LLaMA, GPT-NeoX, PaLM, Qwen) and ALiBi (BLOOM, MPT) are\nstated directly in <code>slide 63</code>'s plain body text — <em>&quot;Used by LLaMA, GPT-NeoX, PaLM, Qwen&quot;</em> and <em>&quot;Used\nby BLOOM and MPT&quot;</em> — not small print, and quoted verbatim above.</p>\n</section><section id=\"sequential-learning-20-s10\" data-title=\"Inside One Transformer Block [slide 66]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Inside One Transformer Block [slide 66]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>&quot;Two sub-layers: attention, then a feed-forward network. After <strong>each</strong> one we add a residual\nshortcut and apply LayerNorm ('Add &amp; Norm'). Shape stays <math data-tex=\"n\\times d\"><mrow><mi>n</mi><mo>×</mo><mi>d</mi></mrow></math> the whole way, so blocks stack\ncleanly.&quot;</em></p>\n</blockquote>\n<figure class=\"ascii\"><pre>        output (n×d)\n             │\n        LayerNorm\n             │\n          (+) ◀── residual ──┐\n             │                │\n        Feed-Forward          │\n             │                │\n        LayerNorm             │\n             │                │\n          (+) ◀── residual ───┤\n             │                │\n      Multi-Head Attention ───┘\n             │\n        input x (n×d)</pre></figure>\n<ul>\n<li><strong>Attention sub-layer</strong> — lets every token gather information from the other tokens. This is where\nwords interact.</li>\n<li><strong>Feed-forward sub-layer</strong> — processes each token on its own, expanding to a wider hidden size and\nback to add capacity.</li>\n<li><strong>Add &amp; Norm</strong> — after each sub-layer, the dashed shortcut adds its input back to its output (so\ngradients flow and nothing is lost), then LayerNorm rescales each vector. <em>&quot;This 'Add then Norm' is\nthe original Transformer; some modern variants normalize first instead.&quot;</em></li>\n<li><em>&quot;Output shape equals input shape, so we just stack this block <strong>N</strong> times.&quot;</em></li>\n</ul>\n</section><section id=\"sequential-learning-20-s11\" data-title=\"Self-Attention — Query, Key, Value: a Soft Lookup [slide 67]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Self-Attention — Query, Key, Value: a Soft Lookup [slide 67]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Think of a search. Each token sends out a <strong>Query</strong> ('what am I looking for?'). Every token also\nadvertises a <strong>Key</strong> ('what I am about') and carries a <strong>Value</strong> ('what I will pass on'). A token\ncompares its query to every key, and blends the values of whoever matches best.&quot;</em></p>\n<ul>\n<li><strong>Query (Q)</strong> — what this token wants to find in the others.</li>\n<li><strong>Key (K)</strong> — a label each token offers, matched against queries.</li>\n<li><strong>Value (V)</strong> — the content a token contributes once it is matched.</li>\n</ul>\n<p><em>&quot;All three (Q, K, V) come from the same input vector, each multiplied by its own learned matrix. The\nentire mechanism is this one formula&quot;</em>:</p>\n<div class=\"mblk\"><math data-tex=\"\\text{Attention}(Q,K,V) = \\text{softmax}\\!\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Attention</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Q</mi><mo separator=\"true\">,</mo><mi>K</mi><mo separator=\"true\">,</mo><mi>V</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>softmax</mtext><mrow style=\"margin-left:-0.1667em;\"></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mrow><mi>Q</mi><msup><mi>K</mi><mi class=\"tml-sml-pad\">⊤</mi></msup></mrow><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>V</mi></mrow></math></div>\n<p><em>(This is identical to Lecture 19 <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>'s scaled dot-product attention formula — this section is\nreusing, not re-deriving, that result.)</em></p>\n<h3>9.1 Multi-Head Attention — combining the heads [slide 71]</h3>\n<div class=\"mblk\"><math data-tex=\"\\text{head}_i = \\text{Attention}(XW_Q^i, XW_K^i, XW_V^i) \\qquad \\text{MultiHead}(X) = \\text{Concat}(\\text{head}_1,\\ldots,\\text{head}_h)\\,W_O\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mtext>head</mtext><mi>i</mi></msub><mo>=</mo><mtext>Attention</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><msubsup><mi>W</mi><mi>Q</mi><mi>i</mi></msubsup><mo separator=\"true\">,</mo><mi>X</mi><msubsup><mi>W</mi><mi>K</mi><mi>i</mi></msubsup><mo separator=\"true\">,</mo><mi>X</mi><msubsup><mi>W</mi><mi>V</mi><mi>i</mi></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"2em\"></mspace><mtext>MultiHead</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>X</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>Concat</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mtext>head</mtext><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mtext>head</mtext><mi>h</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><msub><mi>W</mi><mi>O</mi></msub></mrow></math></div>\n<p>🧪 <strong>Worked example, real numbers</strong> [slide 71]: two 3×2 head outputs (<code>out₁</code>, <code>out₂</code>) are lined up\nside by side into a 3×4 concatenated matrix, then multiplied by a learned <math data-tex=\"4\\times4\"><mrow><mn>4</mn><mo>×</mo><mn>4</mn></mrow></math> matrix <math data-tex=\"W_O\"><msub><mi>W</mi><mi>O</mi></msub></math> to\nproduce the final 3×4 output. <em>&quot;What is <math data-tex=\"W_O\"><msub><mi>W</mi><mi>O</mi></msub></math>, and why? The heads were computed completely\nindependently, so the concatenation just stacks their outputs with no interaction. <math data-tex=\"W_O\"><msub><mi>W</mi><mi>O</mi></msub></math> is a\nlearned matrix that <strong>mixes information across the heads</strong> and projects the result back to size <math data-tex=\"d\"><mi>d</mi></math>.\nWithout it, the heads could never combine what each one found.&quot;</em></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is the exact answer to a question left open in Lecture 19 <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>.</strong> Lecture 19\nshowed multi-head attention runs <math data-tex=\"h\"><mi>h</mi></math> independent attention computations; this slide supplies the\nmissing final step — <em>why</em> the concatenation alone isn't enough, and what <math data-tex=\"W_O\"><msub><mi>W</mi><mi>O</mi></msub></math> specifically\ncontributes (cross-head mixing) that concatenation cannot.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-20-1\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Multi-Head Attention, Head by Head&quot;,&quot;concept&quot;:&quot;Independent per-head attention, concatenation, and the W_O mixing projection&quot;,&quot;control&quot;:&quot;Step through computing head_1 and head_2 independently, then concatenating their outputs, then applying W_O&quot;,&quot;observe&quot;:&quot;Each head's 3×2 output appears side by side (no interaction between them) until the W_O step, where the final 3×4 output visibly blends values from both heads' columns&quot;,&quot;insight&quot;:&quot;Concatenation alone is just stacking — W_O is the one step where information actually crosses between heads&quot;,&quot;fallback&quot;:&quot;The worked out₁/out₂ → concatenate → ×W_O example above shows the identical three stages with real numbers.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Multi-Head Attention, Head by Head</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Independent per-head attention, concatenation, and the W_O mixing projection</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through computing head_1 and head_2 independently, then concatenating their outputs, then applying W_O</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Each head's 3×2 output appears side by side (no interaction between them) until the W_O step, where the final 3×4 output visibly blends values from both heads' columns</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Concatenation alone is just stacking — W_O is the one step where information actually crosses between heads</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The worked out₁/out₂ → concatenate → ×W_O example above shows the identical three stages with real numbers.</p>\n    </div>\n  </figure>\n</section><section id=\"sequential-learning-20-s12\" data-title=\"Finishing the Block — the Feed-Forward Network [slide 75]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">Finishing the Block — the Feed-Forward Network [slide 75]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;This runs on <strong>each token separately</strong>. Attention moved information <em>between</em> tokens; the\nfeed-forward layer lets each token <em>transform its own features</em>. It widens the <math data-tex=\"d=4\"><mrow><mi>d</mi><mo>=</mo><mn>4</mn></mrow></math> vector to a\nroomier <math data-tex=\"d_{ff}=8\"><mrow><msub><mi>d</mi><mrow><mi>f</mi><mi>f</mi></mrow></msub><mo>=</mo><mn>8</mn></mrow></math>, applies a non-linearity, then projects back to <math data-tex=\"d=4\"><mrow><mi>d</mi><mo>=</mo><mn>4</mn></mrow></math>.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\text{FFN}(x) = \\text{GELU}(x\\,W_1)\\,W_2 \\qquad \\text{GELU}(x) = x\\cdot\\Phi(x)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>FFN</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>GELU</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mspace width=\"0.1667em\"></mspace><msub><mi>W</mi><mn>1</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><msub><mi>W</mi><mn>2</mn></msub><mspace width=\"2em\"></mspace><mtext>GELU</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>x</mi><mo>⋅</mo><mrow><mi mathvariant=\"normal\">Φ</mi><mspace></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<blockquote class=\"aside-quote\">\n<p><strong>GELU</strong> — a smooth gate. <math data-tex=\"\\Phi\"><mrow><mi mathvariant=\"normal\">Φ</mi><mspace></mspace></mrow></math> is the standard normal CDF, so GELU keeps large positive values\nalmost unchanged and smoothly pushes negatives toward zero (a softer ReLU). This non-linearity is\nwhat lets the network compute more than a plain weighted sum. In practice a fast tanh approximation\nis used [slide 75].</p>\n</blockquote>\n<p><em>&quot;Dimensions go up, then down: expand <math data-tex=\"4\\to8\"><mrow><mn>4</mn><mo>→</mo><mn>8</mn></mrow></math> (the wider hidden layer gives room to combine\nfeatures); project <math data-tex=\"8\\to4\"><mrow><mn>8</mn><mo>→</mo><mn>4</mn></mrow></math>, back to the model size&quot;</em> [slide 75].</p>\n</section><section id=\"sequential-learning-20-s13\" data-title=\"Encoder vs. Decoder — Two Kinds of Stack [slide 81]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">Encoder vs. Decoder — Two Kinds of Stack [slide 81]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;The block we just built is reused in two ways. The only real difference is <strong>what each token is\nallowed to attend to</strong>.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Encoder — understand the input</strong></th>\n<th><strong>Decoder — generate the output</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sees</td>\n<td>The whole input at once</td>\n<td>Produces tokens left to right, one at a time (autoregressive)</td>\n</tr>\n<tr>\n<td>Attends to</td>\n<td><strong>all</strong> tokens, left and right (bidirectional)</td>\n<td><strong>itself and earlier</strong> tokens only (causal / masked)</td>\n</tr>\n<tr>\n<td>Also</td>\n<td>—</td>\n<td>May also attend to the encoder output (cross-attention)</td>\n</tr>\n<tr>\n<td>Goal</td>\n<td>A rich understanding of the input</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Example</td>\n<td><strong>BERT is encoder-only</strong></td>\n<td><strong>GPT is decoder-only</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Both together = sequence-to-sequence (translation, summarization; T5).&quot;</em></p>\n<h3>11.1 Why the Decoder Must Not Look at the Future [slide 83]</h3>\n<p><em>&quot;In training the decoder sees the whole target sentence at once (for speed). But to predict word\n<math data-tex=\"i\"><mi>i</mi></math> it may use only words <math data-tex=\"1{...}i\"><mrow><mn>1</mn><mrow><mi>.</mi><mi>.</mi><mi>.</mi></mrow><mi>i</mi></mrow></math>. If it could peek at word <math data-tex=\"i{+}1\"><mrow><mi>i</mi><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">+</mo><mn>1</mn></mrow></math> it would just copy the answer\nand learn nothing. At generation the future does not exist yet. So we block every position to the\nright.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\text{score}_{ij} = -\\infty \\ \\text{for } j&gt;i, \\ \\text{then softmax}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mtext>score</mtext><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi><mtext> </mtext><mtext>for </mtext><mi>j</mi><mo>&gt;</mo><mi>i</mi><mo separator=\"true\">,</mo><mtext> </mtext><mtext>then softmax</mtext></mrow></math></div>\n<p><em>&quot;The upper triangle (future positions) is set to <math data-tex=\"-\\infty\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math>, so after softmax those weights are\nexactly 0. Each row becomes a distribution over itself and earlier tokens only. The result is a\nlower-triangular attention matrix. Everything else (multi-head, values, Add &amp; Norm) is unchanged.\nOnly the mask is added.&quot;</em></p>\n<p>🧪 <strong>Worked example</strong> [slide 83] — raw scores for the sentence &quot;the cat sat&quot;:</p>\n<div class=\"mblk\"><math data-tex=\"\\begin{bmatrix}1.4&amp;0.0&amp;1.4\\\\0.0&amp;4.2&amp;1.4\\\\1.4&amp;2.1&amp;2.1\\end{bmatrix} \\xrightarrow{\\text{apply causal mask}} \\begin{bmatrix}1.4&amp;-\\infty&amp;-\\infty\\\\0.0&amp;4.2&amp;-\\infty\\\\1.4&amp;2.1&amp;2.1\\end{bmatrix}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1.4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>0.0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1.4</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0.0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>4.2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1.4</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1.4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>2.1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2.1</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow><mrow><mspace width=\"0.2778em\"></mspace><mover accent=\"false\"><mo stretchy=\"true\" lspace=\"0\" rspace=\"0\">→</mo><mover><mrow><mspace width=\"0.4286em\"></mspace><mtext>apply causal mask</mtext><mspace width=\"0.4286em\"></mspace></mrow><mspace width=\"3.5000em\"></mspace></mover></mover><mspace width=\"0.2778em\"></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1.4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0.0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>4.2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1.4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>2.1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2.1</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p>After softmax, every <math data-tex=\"-\\infty\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math> entry becomes exactly 0 — &quot;the&quot; can only attend to &quot;the&quot;; &quot;cat&quot; can\nattend to &quot;the&quot; and &quot;cat&quot;; &quot;sat&quot; can attend to all three.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This is the exact mechanism, made concrete, that Lecture 19's &quot;why the decoder must not look\nat the future&quot; discussion left implicit.</strong> Setting scores to <math data-tex=\"-\\infty\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math> <em>before</em> the softmax, rather\nthan zeroing the <em>output</em> weights after, is what guarantees the blocked positions get exactly zero\ngradient and exactly zero influence — the mask is baked into the same score-then-softmax pipeline\nas ordinary attention, not bolted on afterward.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-20-2\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Apply Causal Mask, Live&quot;,&quot;concept&quot;:&quot;Setting future-position scores to -infinity before softmax&quot;,&quot;control&quot;:&quot;Toggle the causal mask on/off over the \\&quot;the cat sat\\&quot; raw score matrix and watch the softmax output change&quot;,&quot;observe&quot;:&quot;With the mask off, every row's softmax spreads weight across all three positions; with the mask on, each row's weight collapses to zero for every future position, producing a lower-triangular attention matrix&quot;,&quot;insight&quot;:&quot;The mask is applied before softmax, not after — this is what makes the blocked positions receive exactly zero gradient, not just zero weight in the final output&quot;,&quot;fallback&quot;:&quot;The worked score matrix → masked matrix example above shows the identical before/after transformation with real numbers.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Apply Causal Mask, Live</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Setting future-position scores to -infinity before softmax</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle the causal mask on/off over the \"the cat sat\" raw score matrix and watch the softmax output change</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>With the mask off, every row's softmax spreads weight across all three positions; with the mask on, each row's weight collapses to zero for every future position, producing a lower-triangular attention matrix</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>The mask is applied before softmax, not after — this is what makes the blocked positions receive exactly zero gradient, not just zero weight in the final output</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The worked score matrix → masked matrix example above shows the identical before/after transformation with real numbers.</p>\n    </div>\n  </figure>\n<h3>11.2 The Decoder Block — Same Block Plus Two Changes [slide 85]</h3>\n<p><strong>Change 1 — masked self-attention.</strong> The self-attention is causal: each token attends only to itself\nand earlier tokens (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§11.1\" role=\"link\" tabindex=\"0\">§11.1</a>).</p>\n<p><strong>Change 2 — cross-attention.</strong> An extra sub-layer where the <strong>queries come from the decoder</strong> but\nthe <strong>keys and values come from the encoder output</strong>. This is how each output token reads the input\n— for example, aligning a translated word to its source word.</p>\n<p><em>&quot;Everything else (Add &amp; Norm, residual, feed-forward) is identical to the encoder block. The encoder\nblock is just self-attention + feed-forward, with no mask and no cross-attention.&quot;</em></p>\n</section><section id=\"sequential-learning-20-s14\" data-title=\"The Full Transformer Architecture [slide 91]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">12</span>\n      <span class=\"sec-t\">The Full Transformer Architecture [slide 91]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Encoder stack on the left, decoder stack on the right. Inputs become embeddings plus positional\nencodings; the decoder's masked and cross attention feed a final Linear and Softmax that give the\nnext-word probabilities.&quot;</em></p>\n<figure class=\"ascii\"><pre>     Nx Encoder                              Nx Decoder\n   ┌────────────────┐                    ┌────────────────────┐\n   │   Add &amp; Norm     │                    │      Add &amp; Norm      │\n   │   Feed Forward    │                    │     Feed Forward      │\n   │   Add &amp; Norm     │      encoder       │      Add &amp; Norm      │\n   │ Multi-Head Attn  │───output→ K,V ────▶│  Cross Multi-Head Attn │\n   └────────────────┘                    │      Add &amp; Norm      │\n        │ + positional                    │  Masked Multi-Head Attn│\n   Input Embedding                        └────────────────────┘\n    &quot;the cat sat&quot;                              │ + positional\n                                          Output Embedding\n                                         &quot;outputs (shifted right)&quot;\n                                                    │\n                                                 Linear\n                                                    │\n                                                 Softmax\n                                                    │\n                                          Output Probabilities</pre></figure>\n</section><section id=\"sequential-learning-20-s15\" data-title=\"The Decoder — the Prediction Head [slide 93]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">13</span>\n      <span class=\"sec-t\">The Decoder — the Prediction Head [slide 93]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;This is the last step of any of the top of the decoder. Take the last token's vector <math data-tex=\"h_{\\text{last}}\"><msub><mi>h</mi><mtext>last</mtext></msub></math>,\nmultiply by <math data-tex=\"W_{\\text{vocab}}\"><msub><mi>W</mi><mtext>vocab</mtext></msub></math> to score every word, then softmax over the vocabulary. Only the\ndecoder builds this understanding, the decoder does the prediction. We read only the last position's\nrow because that's where the next word comes from.&quot;</em></p>\n<hr>\n</section><div class=\"part-head\" id=\"sequential-learning-20-p2\"><h1>Part 3 — Language Models</h1>\n</div><section id=\"sequential-learning-20-s16\" data-title=\"Three Families, One Paradigm [slide 97]\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">14</span>\n      <span class=\"sec-t\">Three Families, One Paradigm [slide 97]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Encoder-only</strong></th>\n<th><strong>Decoder-only</strong></th>\n<th><strong>Encoder-decoder</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>e.g.</td>\n<td>BERT, RoBERTa</td>\n<td>GPT, LLaMA</td>\n<td>T5, BART</td>\n</tr>\n<tr>\n<td>Reads</td>\n<td>both directions, for understanding</td>\n<td>left to right, for generation</td>\n<td>reads then writes, for translation</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Pre-train, generate, adapt: the three families and how we put them to work.&quot;</em> Two-step recipe,\nshared by all three [slide 97]: <strong>1 · Pre-train on raw text</strong> (billions of words, no labels, done\nonce) → <strong>2 · Adapt to your task</strong> (little data, fast, one base into many specialists).</p>\n<p><em>&quot;The text is its own label&quot;</em> [slide 99] — the single sentence that explains why pre-training needs\nno human annotation at all: hiding a word and predicting it (BERT family) or hiding the next word and\npredicting it (GPT family) both derive supervision directly from raw text, at effectively unlimited\nscale.</p>\n</section><section id=\"sequential-learning-20-s17\" data-title=\"Family 1 — Encoder-Only: BERT\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">15</span>\n      <span class=\"sec-t\">Family 1 — Encoder-Only: BERT</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>15.1 Inside the Encoder — Every Token Reads the Whole Sentence [slide 102]</h3>\n<p><em>&quot;Bidirectional is the whole point. Every token mixes with tokens on its left and right, so each\noutput vector is rich with context. BERT produces one vector per token, contextual representations —\nit does not generate raw text.&quot;</em></p>\n<p><em>&quot;Here is the puzzle. If it already sees the whole sentence, what can we hide and ask it to predict\nfrom raw text?&quot;</em></p>\n<h3>15.2 Every Input Token Is a Sum of Three Embeddings [slide 104]</h3>\n<p>BERT wraps the input in special tokens: <code>[CLS]</code> (start), the sentence itself, <code>[SEP]</code> (separator),\nand a second segment. Each position's input is the sum of three learned embeddings: <strong>token</strong>\nembedding + <strong>segment</strong> embedding (which of two sentences this token belongs to) + <strong>position</strong>\nembedding. <em>&quot;[CLS] is a summary slot. Its final vector stands for the whole input, and BERT feeds it\nto a classifier. [SEP] ends each sentence.&quot;</em></p>\n<h3>15.3 BERT Pre-training Objective 1 of 2 — Masked Language Model [slide 106]</h3>\n<p><em>&quot;Pick about <strong>15%</strong> of tokens at random and replace each. Because attention is bidirectional, every\nblank is predicted from the full left and right context. The original word is the free label.&quot;</em></p>\n<figure class=\"ascii\"><pre>data in:   the  [MASK]  sat  on  the  mat\n                  │\n                  ▼  BERT, then softmax over the vocabulary at the masked slot\ndata out:  cat 0.83  dog 0.05  kitten 0.04  mat 0.03  rug 0.01  ...</pre></figure>\n<p><strong>loss = cross-entropy between this distribution and the true word &quot;cat&quot;, averaged over the masked\npositions.</strong></p>\n<p><strong>The 80/10/10 trick:</strong></p>\n<ul>\n<li><strong>80%</strong> of chosen tokens become <code>[MASK]</code>.</li>\n<li><strong>10%</strong> become a random word.</li>\n<li><strong>10%</strong> are left unchanged.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why not always mask.</strong> <em>&quot;Fine-tuning never shows a <code>[MASK]</code> token, so always\nmasking would create a train and test mismatch. The random and unchanged cases force BERT to build\na good vector for every token, not only the masked ones&quot;</em> [slide 106]. This is the same category of\nreasoning as GPT's causal masking (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§11.1\" role=\"link\" tabindex=\"0\">§11.1</a>) and the negative-sampling noise distribution in Lecture\n18 <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§6.5\" role=\"link\" tabindex=\"0\">§6.5</a>: a training procedure engineered to specifically avoid a distribution mismatch between what\nthe model sees during training and what it will actually face in use.</p>\n</aside>\n<h3>15.4 BERT Pre-training Objective 2 of 2 — Next Sentence Prediction [slide 108]</h3>\n<p><em>&quot;Half the pairs are true neighbors, half pair A with a random sentence B. BERT reads the <code>[CLS]</code>\nslot and answers IsNext or NotNext, learning how sentences relate (useful for question answering and\nretrieval).&quot;</em></p>\n<pre class=\"code\"><code>real pair:   [CLS] the cat sat [SEP] it purred        → IsNext\nrandom pair: [CLS] the cat sat [SEP] stocks fell       → NotNext</code></pre>\n<p><em>&quot;Trained <strong>together</strong> with masked LM: the token loss plus this sentence-pair loss, summed into\none.&quot;</em></p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Aside for later, flagged by the slide itself:</strong> <em>&quot;RoBERTa dropped NSP entirely and did better\nby training longer on more data. Details come in a later lecture&quot;</em> [slide 108] — the lecture is\nexplicit that NSP's necessity is not settled; it's presented as BERT's original design choice, not\nas a proven-necessary component.</p>\n</aside>\n<h3>15.5 BERT — Fine-Tuning: Reuse the Body, Add a Small Task Head [slide 111]</h3>\n<figure class=\"ascii\"><pre>&quot;the movie was great&quot;\n         │\n   pre-trained BERT (weights reused, lightly updated)\n         │\n   [CLS] vector (size d)\n         │\n   new task head → positive / negative</pre></figure>\n<p><em>&quot;Why so little data is enough. BERT already understands language from pre-training. The head only\nmaps its features to your labels, so a few thousand examples and a few minutes of training are\nenough.&quot;</em></p>\n<p><strong>One body, many heads</strong> — Sentiment: read the <code>[CLS]</code> vector, classify the sentence. NER: classify\n<em>each</em> token's vector (person, place, ...). QA: predict the start and end token of the answer span.</p>\n</section><section id=\"sequential-learning-20-s18\" data-title=\"Family 2 — Decoder-Only: GPT\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">16</span>\n      <span class=\"sec-t\">Family 2 — Decoder-Only: GPT</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>16.1 Step Inside the Decoder — Predict the Next Token, Never Peek Ahead [slide 112]</h3>\n<div class=\"mblk\"><math data-tex=\"p(x_1,\\ldots,x_n) = \\prod_{t=1}^n p(x_t\\mid x_1,\\ldots,x_{t-1})\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>p</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∏</mo><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover></mrow><mi>p</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mi>t</mi></msub><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>x</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<p><em>&quot;A sentence's probability factors into one next-token prediction per position. For this to be\nhonest, position <math data-tex=\"t\"><mi>t</mi></math> must not see tokens after it. A <strong>causal mask</strong> enforces that inside attention.\nSame block as the encoder, one rule changed.&quot;</em></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why this objective is so powerful, stated directly.</strong> <em>&quot;To guess the next word\nwell across all of the web, the model is pushed to learn grammar, facts and a bit of reasoning. One\nobjective, and the same model then handles many tasks straight from a prompt&quot;</em> [slide 112]. This is\nthe single sentence that explains why GPT-style pre-training scales into general-purpose\ncapability: predicting the next token well, at web scale, forces the model to implicitly encode far\nmore than surface grammar.</p>\n</aside>\n<h3>16.2 The Prediction Head — Hidden Vector → Logits → Probabilities [slide 119]</h3>\n<p><em>&quot;Take the block output of the <strong>last</strong> token. Multiply by the vocabulary matrix to score every word,\nthen softmax. Under the causal mask the last token already sees the whole prefix, so this is the\ngenuine next-token distribution.&quot;</em></p>\n<div class=\"mblk\"><math data-tex=\"\\text{logits} = h\\,W_{\\text{vocab}} \\qquad p_i = \\frac{e^{\\text{logit}_i}}{\\sum_j e^{\\text{logit}_j}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>logits</mtext><mo>=</mo><mi>h</mi><mspace width=\"0.1667em\"></mspace><msub><mi>W</mi><mtext>vocab</mtext></msub><mspace width=\"2em\"></mspace><msub><mi>p</mi><mi>i</mi></msub><mo>=</mo><mfrac><msup><mi>e</mi><msub class=\"tml-sml-pad\"><mtext>logit</mtext><mi>i</mi></msub></msup><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>j</mi></msub><msup><mi>e</mi><msub class=\"tml-sml-pad\"><mtext>logit</mtext><mi>j</mi></msub></msup></mrow></mfrac></mrow></math></div>\n<p>🧪 <strong>Worked example, toy 6-word vocabulary</strong> [slide 119]: block output of &quot;sat&quot; is a <math data-tex=\"1\\times4\"><mrow><mn>1</mn><mo>×</mo><mn>4</mn></mrow></math>\nvector <code>[-0.07, -0.26, 1.56, -1.23]</code>; multiplying by <math data-tex=\"W_{\\text{vocab}}\"><msub><mi>W</mi><mtext>vocab</mtext></msub></math> gives scores\n<code>[-0.16, 0.10, 0.16, 4.02, 0.21, -0.14]</code> over the vocabulary <code>{the, cat, sat, on, mat, dog}</code>; softmax\ngives probabilities with <strong>&quot;on&quot; at 0.91</strong> the clear winner. <em>&quot;Prediction: 'on' at 0.91. If the true\nnext word is 'on', the loss is <math data-tex=\"-\\log(0.91)\\approx0.094\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0.91</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>0.094</mn></mrow></math>. Training nudges the weights to push this\nprobability higher across billions of such predictions.&quot;</em></p>\n<h3>16.3 Choosing the Next Word — How Do We Add Variety? [slide 121]</h3>\n<p><em>&quot;The model gives a probability to every next word. <strong>Greedy</strong> takes the single highest (argmax), so\nit never changes. To get varied text we <strong>sample</strong>, after reshaping the distribution.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Mechanism</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Temperature <math data-tex=\"T\"><mi>T</mi></math></strong></td>\n<td>Scale logits by <math data-tex=\"1/T\"><mrow><mn>1</mn><mi>/</mi><mi>T</mi></mrow></math> before softmax: <math data-tex=\"p_i\\propto e^{z_i/T}\"><mrow><msub><mi>p</mi><mi>i</mi></msub><mo>∝</mo><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><msub><mi>z</mi><mi>i</mi></msub><mi>/</mi><mi>T</mi></mrow></msup></mrow></math>. <math data-tex=\"T&lt;1\"><mrow><mi>T</mi><mo>&lt;</mo><mn>1</mn></mrow></math> sharpens the peak (focused, safe). <math data-tex=\"T&gt;1\"><mrow><mi>T</mi><mo>&gt;</mo><mn>1</mn></mrow></math> flattens it (creative, riskier). <math data-tex=\"T\"><mi>T</mi></math> near 0 is greedy.</td>\n</tr>\n<tr>\n<td><strong>Top-k</strong></td>\n<td>Keep the <math data-tex=\"k\"><mi>k</mi></math> most likely words (a fixed count), drop the rest, renormalize, then sample. Simple, but uses the same <math data-tex=\"k\"><mi>k</mi></math> whether the model is sure or not.</td>\n</tr>\n<tr>\n<td><strong>Top-p (nucleus)</strong></td>\n<td>Keep the smallest set whose probabilities sum to <math data-tex=\"p\"><mi>p</mi></math> (an adaptive count). The set shrinks when the model is confident, grows when it's unsure.</td>\n</tr>\n</tbody>\n</table></div>\n<p>🧪 <strong>Worked example, temperature effect</strong> [slide 121-126]: with base probabilities <code>mat=0.31, rug=0.23, sofa=0.17, floor=0.15, chair=0.08, table=0.06</code>, drawing 20 samples at <strong><math data-tex=\"T=1.6\"><mrow><mi>T</mi><mo>=</mo><mn>1.6</mn></mrow></math></strong>: <em>&quot;above 1\nflattens the bars, so the draws spread across more words&quot;</em> — the demo shows 5 distinct words drawn\nout of 6, roughly matching the flattened distribution, versus greedy always picking &quot;mat.&quot;</p>\n<figure class=\"iv\" id=\"iv-sequential-learning-20-3\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;Sampling Strategy Comparison&quot;,&quot;concept&quot;:&quot;How temperature, top-k, and top-p reshape a next-token probability distribution&quot;,&quot;control&quot;:&quot;Drag a temperature slider, or switch to a top-k or top-p mode with its own adjustable parameter, over the mat/rug/sofa/floor/chair/table base distribution&quot;,&quot;observe&quot;:&quot;Higher temperature flattens the bar heights; top-k truncates to a fixed-size bar set; top-p's kept-bar count visibly grows or shrinks depending on how peaked the base distribution already is&quot;,&quot;insight&quot;:&quot;Top-p is the only one of the three whose candidate-set size adapts automatically to model confidence — top-k always keeps exactly k words regardless of how sure the model is&quot;,&quot;fallback&quot;:&quot;The temperature/top-k/top-p mechanism table and the T=1.6 worked example above describe the same three behaviors in words and one concrete run.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">Sampling Strategy Comparison</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>How temperature, top-k, and top-p reshape a next-token probability distribution</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Drag a temperature slider, or switch to a top-k or top-p mode with its own adjustable parameter, over the mat/rug/sofa/floor/chair/table base distribution</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Higher temperature flattens the bar heights; top-k truncates to a fixed-size bar set; top-p's kept-bar count visibly grows or shrinks depending on how peaked the base distribution already is</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Top-p is the only one of the three whose candidate-set size adapts automatically to model confidence — top-k always keeps exactly k words regardless of how sure the model is</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The temperature/top-k/top-p mechanism table and the T=1.6 worked example above describe the same three behaviors in words and one concrete run.</p>\n    </div>\n  </figure>\n</section><section id=\"sequential-learning-20-s19\" data-title=\"Adapting a Pre-Trained Decoder [slide 126]\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">17</span>\n      <span class=\"sec-t\">Adapting a Pre-Trained Decoder [slide 126]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s19\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;A pre-trained decoder already knows a lot. Often you can steer it with words alone, and change\nweights only when you need to.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>1 · Prompting</strong></th>\n<th><strong>2 · Instruction tuning</strong></th>\n<th><strong>3 · RLHF</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>What it does</td>\n<td>Describe the task in the input; the model answers from what it already knows</td>\n<td>Fine-tune on thousands of tasks written as instruction and answer pairs</td>\n<td>Humans rank answers, a reward model learns the ranking, the model is tuned to score higher</td>\n</tr>\n<tr>\n<td>Example</td>\n<td><code>Review: &quot;great film&quot; → Sentiment: positive</code></td>\n<td><code>&quot;Summarize in one line: ...&quot; → learns to follow orders it never saw</code></td>\n<td><code>prefer helpful, honest, harmless replies</code></td>\n</tr>\n<tr>\n<td>Weight change</td>\n<td><strong>weights unchanged</strong> (zero-shot: no examples; few-shot: a few in the prompt / in-context learning)</td>\n<td><strong>all weights updated</strong></td>\n<td><strong>weights tuned by reward</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;Prompting touches no weights. Instruction tuning and RLHF do, and when you change weights you\nrarely need to touch <strong>all</strong> of them&quot;</em> [slide 126] — the sentence that directly motivates <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§18\" role=\"link\" tabindex=\"0\">§18</a>'s\nparameter-efficient fine-tuning ladder.</p>\n</section><section id=\"sequential-learning-20-s20\" data-title=\"Parameter-Efficient Fine-Tuning — Shrinking What You Train [slide 132]\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">18</span>\n      <span class=\"sec-t\">Parameter-Efficient Fine-Tuning — Shrinking What You Train [slide 132]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s20\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Each step keeps the win of the last one and fixes its biggest cost.&quot;</em></p>\n<p><strong>1 · Full fine-tuning.</strong> Update <strong>every</strong> weight in the model for your task. <em>&quot;Three problems:\n<strong>huge</strong> compute and memory, a <strong>full copy</strong> saved per task, and it can <strong>overwrite</strong> the language\nlearned in pre-training&quot;</em> [slide 132].</p>\n<p><strong>2 · Adapter tuning.</strong> Freeze the model, insert small trainable <strong>adapter</strong> layers inside each\nblock, train only those. (Relatives: prefix and prompt tuning.) <em>&quot;Far fewer trained parameters, but\nthe extra layers add <strong>inference latency</strong>, and you still backprop through the whole model, so\ncompute stays high&quot;</em> [slide 133].</p>\n<p><strong>3 · LoRA (Low-Rank Adaptation).</strong> Instead of inserting new layers in the forward path (adapters'\nlatency cost), freeze the original weight matrix and add a small, separately-trained <strong>low-rank</strong>\nupdate <code>B·A</code> alongside it — visible directly in the QLoRA diagram [slide 134] as the <code>&quot;LoRA: B·A trained&quot;</code> module added to the frozen base. Because the update is added to (not inserted into) the\nexisting weights, it can be merged back in after training, adding <strong>no extra inference latency</strong> —\nthe specific cost adapters still carry.</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Capture gap, disclosed.</strong> The interactive 4-step walkthrough this section follows has a\ncaptured frame for step 1/4 (&quot;Full fine-tuning,&quot; <code>slide 132</code>) and step 2/4 (&quot;Adapters,&quot; <code>slide 133</code>), then jumps straight to step 4/4 (&quot;QLoRA,&quot; <code>slide 134</code>) — <strong>step 3/4 (&quot;LoRA&quot;) was never\ncaptured as its own frame</strong> in this lecture's raw output (only 58 seconds elapse between <code>slide 133</code> and <code>slide 134</code> per <code>timestamps.txt</code>, versus 1.5 minutes for the previous step — the\npresenter evidently clicked through this step too quickly for a stable frame to be grabbed). The\ndescription above is not fabricated — it's corroborated by <code>GenAI &amp; LLM Part 1</code> (<code>genai-llm-03.md</code>\n<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>), which independently derives the identical mechanism with real Llama-2-7B numbers — but it is\nnot verifiable from this lecture's own slides, unlike every other claim in this section.</p>\n</aside>\n<p><strong>4 · QLoRA.</strong> <em>&quot;Quantize the frozen base to <strong>4-bit</strong> so it barely uses memory, then train a LoRA\nadapter on top. This is how a model with <strong>tens of billions</strong> of parameters is fine-tuned on a\n<strong>single GPU</strong>&quot;</em> [slide 134].</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — read this ladder as a chain of fixes, not four unrelated techniques.</strong> Full\nfine-tuning's cost is compute+memory+storage+catastrophic forgetting. Adapters fix storage (only\nsave the small adapter, not a full model copy) but add inference latency. LoRA fixes the latency\n(the update merges back into the frozen weights) while keeping the storage win. QLoRA fixes the\n<em>memory</em> problem LoRA still has (the frozen base still has to sit in memory at full precision) by\nquantizing that frozen base to 4-bit. Each step's motivation is stated on its own slide as <em>&quot;fixes\nits biggest cost&quot;</em> — this is the same rhetorical pattern Lecture 19 used throughout (name a\nconcrete failure, then the fix for exactly that failure).</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-20-4\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;The PEFT Ladder, Step by Step&quot;,&quot;concept&quot;:&quot;Full fine-tuning → adapters → LoRA → QLoRA, each fixing the previous step's biggest cost&quot;,&quot;control&quot;:&quot;Step through all 4 rungs of the ladder; at each step, a diagram shows what's frozen vs. trained, and a callout names the one cost that step removes and the one it still has&quot;,&quot;observe&quot;:&quot;The trained-parameter footprint shrinks at each step, while the diagram highlights whether the frozen base is full-precision or 4-bit quantized&quot;,&quot;insight&quot;:&quot;Each rung keeps every previous rung's win and fixes exactly one remaining cost — this is a chain of targeted fixes, not four independent techniques competing for the same job&quot;,&quot;fallback&quot;:&quot;The four-rung description above (with each step's named \\&quot;fixes its biggest cost\\&quot; callout) states the same progression in words; note the step-3/4 (LoRA) frame itself has a capture gap, flagged above.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">The PEFT Ladder, Step by Step</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Full fine-tuning → adapters → LoRA → QLoRA, each fixing the previous step's biggest cost</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through all 4 rungs of the ladder; at each step, a diagram shows what's frozen vs. trained, and a callout names the one cost that step removes and the one it still has</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The trained-parameter footprint shrinks at each step, while the diagram highlights whether the frozen base is full-precision or 4-bit quantized</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Each rung keeps every previous rung's win and fixes exactly one remaining cost — this is a chain of targeted fixes, not four independent techniques competing for the same job</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The four-rung description above (with each step's named \"fixes its biggest cost\" callout) states the same progression in words; note the step-3/4 (LoRA) frame itself has a capture gap, flagged above.</p>\n    </div>\n  </figure>\n</section><section id=\"sequential-learning-20-s21\" data-title=\"Family 3 — Encoder-Decoder: T5 [slide 136]\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">19</span>\n      <span class=\"sec-t\">Family 3 — Encoder-Decoder: T5 [slide 136]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s21\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;It bolts together the two halves you just saw: a bidirectional <strong>encoder</strong> to read (like BERT) and\na causal <strong>decoder</strong> to write (like GPT), joined by <strong>cross-attention</strong>.&quot;</em></p>\n<p><em>&quot;The encoder reads the whole input both ways into context vectors. The decoder writes the output\nleft to right, and at each step its <strong>cross-attention</strong> looks back at those encoder vectors (their K\nand V). Use it when a full input maps to a full output.&quot;</em></p>\n<p><strong>Denoising, then text-to-text.</strong> Pre-train by masking whole <strong>spans</strong> with sentinels <code>&lt;X&gt;</code>, <code>&lt;Y&gt;</code> and\nregenerating them. Then every task is text in, text out:</p>\n<pre class=\"code\"><code>translate to German: the cat sat  →  die Katze saß\nsummarize: a long review ...       →  one-line summary</code></pre>\n</section><section id=\"sequential-learning-20-s22\" data-title=\"Recap — One Block, Three Families, One Paradigm [slide 138]\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">20</span>\n      <span class=\"sec-t\">Recap — One Block, Three Families, One Paradigm [slide 138]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s22\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p><em>&quot;Pre-train once on raw text with a self-supervised objective, then adapt cheaply. The attention\npattern picks the family, the family picks the objective, the objective picks what it is good at.&quot;</em></p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Attention</th>\n<th>Pre-training</th>\n<th>Adapt with</th>\n<th>Best at</th>\n<th>Examples</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Encoder-only</strong></td>\n<td>bidirectional</td>\n<td>masked LM (+ NSP)</td>\n<td>head fine-tuning</td>\n<td>understanding</td>\n<td>BERT, RoBERTa</td>\n</tr>\n<tr>\n<td><strong>Decoder-only</strong></td>\n<td>causal</td>\n<td>next-token</td>\n<td>prompt, instruct, RLHF, LoRA</td>\n<td>generation</td>\n<td>GPT, LLaMA</td>\n</tr>\n<tr>\n<td><strong>Encoder-decoder</strong></td>\n<td>both + cross</td>\n<td>denoising spans</td>\n<td>text-to-text fine-tuning</td>\n<td>seq to seq</td>\n<td>T5, BART</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Masked</strong> hides random tokens and predicts from both sides. <strong>Autoregressive</strong> blocks the future and\npredicts the next token. <strong>Adapt beats retrain</strong>: reuse language, learn only the task.</p>\n<hr>\n</section><section id=\"sequential-learning-20-s23\" data-title=\"The Hands-On Notebook — Fine-Tuning a Text Classifier, Step by Step\" data-kind=\"content\" data-part=\"Part 3 — Language Models\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">21</span>\n      <span class=\"sec-t\">The Hands-On Notebook — Fine-Tuning a Text Classifier, Step by Step</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s23\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>The lecture closes with a Colab notebook (<code>text-classification-step-by-step.ipynb</code>) that fine-tunes a\nsentiment classifier and, critically, <strong>runs the exact same architecture and training procedure\ntwice</strong> — once with randomly initialized weights (&quot;from scratch&quot;) and once starting from a\npre-trained checkpoint — to isolate the effect of pre-training empirically.</p>\n<p><strong>Setup</strong> [slides 139-142]: load a product-review dataset, check class balance and review-length\ndistribution, and tokenize with the DistilBERT/BERT family's subword tokenizer (WordPiece, <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>) or the\nGPT family's BPE tokenizer, mapping text to IDs the same way real systems do.</p>\n<p><strong>The controlled experiment</strong> [slides 145-152]: <em>&quot;We reuse the same training setup for both, so the\nonly thing that changes is whether the model starts from random weights or pre-trained.&quot;</em> Two\n<code>Trainer</code> runs, identical hyperparameters, differing only in the starting checkpoint — a &quot;from\nscratch&quot; <code>AutoModelForSequenceClassification</code> initialized with random weights, and the same\narchitecture loaded from a pre-trained checkpoint.</p>\n<p>🧪 <strong>Result — the value of pre-training, made concrete</strong> [slide 155]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Test accuracy</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>From scratch</td>\n<td><strong>0.70</strong></td>\n</tr>\n<tr>\n<td>Pre-trained</td>\n<td><strong>0.88</strong></td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is the empirical payoff of the entire &quot;pre-train, then adapt&quot; paradigm\n(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§14\" role=\"link\" tabindex=\"0\">§14</a>).</strong> Both models are the <em>same architecture</em>, trained with the <em>same</em> fine-tuning procedure, on\nthe <em>same</em> small labeled dataset. The only difference is whether the weights started from\npre-training on billions of words of raw text or from random initialization. An 18-percentage-point\naccuracy gap is the direct, measured cost of skipping pre-training — not a theoretical argument, a\nnumber from an actual run.</p>\n</aside>\n<p><strong>Confusion matrix and qualitative check</strong> [slides 156-160]: <em>&quot;Where does the pre-trained model get\nthe test set right and wrong?&quot;</em> — the notebook closes by inspecting specific misclassified examples,\ngrounding the aggregate accuracy number in individual cases the reader can reason about directly.</p>\n<hr>\n</section><section id=\"sequential-learning-20-s24\" data-title=\"Putting it together\" data-kind=\"back\" data-part=\"Part 3 — Language Models\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s24\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>Part 1: Tokenization                Part 2: Transformer                Part 3: Language Models\n─────────────────────               ─────────────────────              ─────────────────────\nWord-level: brittle, OOV     ┐                                    ┌─▶ Encoder-only (BERT):\nCharacter-level: O(n²), weak ├─▶ text → subword tokens → IDs ──▶ │    bidirectional, masked LM\nBPE/WordPiece/Unigram:       │                                    │\n&quot;meet in the middle&quot;         ┘   + positional encoding            ├─▶ Decoder-only (GPT):\n                                  (attention has no order sense)   │    causal, next-token\n                                       │                           │\n                                  N × [attend, add&amp;norm,           ├─▶ Encoder-decoder (T5):\n                                       transform, add&amp;norm]        │    both + cross-attention,\n                                       │                           │    denoising spans\n                                  encoder (bidirectional) or       │\n                                  decoder (causal + optional       └─▶ same block, different\n                                  cross-attention)                      attention pattern,\n                                       │                                different objective,\n                                  Linear → Softmax →                   different adaptation\n                                  next-token / masked-token\n                                  probabilities                   Adapt cheaply: prompting →\n                                                                   instruction tuning → RLHF\n                                                                   full fine-tune → adapters →\n                                                                   LoRA → QLoRA\n                                                                        │\n                                                                   empirically: 0.70 → 0.88\n                                                                   test accuracy from\n                                                                   pre-training alone</pre></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li><strong>&quot;Meet in the middle&quot; is the same move, made three times at three different levels of the\nstack.</strong> Subword tokenization meets word-level and character-level in the middle (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>). Attention\nwith positional encoding meets &quot;no order at all&quot; and &quot;hand-coded fixed-order rules&quot; in the middle\n(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>). Parameter-efficient fine-tuning meets &quot;retrain everything&quot; and &quot;touch nothing&quot; in the middle\n(<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§18\" role=\"link\" tabindex=\"0\">§18</a>). Recognizing this pattern makes each new technique in the field easier to place: ask what\ntwo extremes it's balancing.</li>\n<li><strong>Every algorithm in Part 1 shares one outer loop (merge-or-prune-repeatedly) and differs only in\none selection rule</strong> (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>) — frequency, score, or probability. This is the same insight as Lecture\n18's closing comparison of Word2Vec/GloVe/FastText: different statistical formulas solving the\nsame structural problem, not fundamentally different mechanisms.</li>\n<li><strong>&quot;Same block, different mask, different objective&quot; is the entire content of Part 3.</strong> BERT, GPT,\nand T5 are not three different neural network architectures — they are the <em>identical</em> Transformer\nblock from Part 2, configured differently along exactly two axes: which attention pattern\n(bidirectional / causal / both+cross) and which self-supervised pre-training objective (masked LM\n/ next-token / denoising spans). Internalizing this collapses what looks like three separate\nmodels to learn into one architecture plus two configuration choices.</li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-20-s25\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\" data-part=\"Part 3 — Language Models\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">16 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s25\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does word-level tokenization fail, and why doesn't character-level tokenization simply replace it?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Word-level tokenization is brittle to out-of-vocabulary words and typos, and its vocabulary grows\nunboundedly as new words appear. Character-level tokenization fixes OOV entirely (any word is a\nsequence of known characters) but makes sequences far longer — since attention cost is <math data-tex=\"O(n^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, a\n6× longer sequence costs roughly 36× more compute — and individual characters are weak, uninformative\nunits that force the model to spend capacity re-assembling words from scratch.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Walk through how BPE tokenizes a word it has never seen at inference time.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>BPE does no recounting at inference. It splits the new word into individual characters, then applies\nits learned, ordered list of merge rules in sequence — each rule merges a specific adjacent pair if\npresent. If a rule's pair never appears in the new word, it's simply skipped. The result is whatever\nsequence of learned subword pieces (falling back to individual characters where no merge applies)\nbest covers the new word.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What's the actual difference between BPE's and WordPiece's merge rule, given they run the same outer loop?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>BPE merges whichever adjacent pair is most <em>frequent</em> in the corpus. WordPiece merges whichever pair\nhas the highest <em>score</em>, <math data-tex=\"\\text{freq}(a,b)/(\\text{freq}(a)\\cdot\\text{freq}(b))\"><mrow><mtext>freq</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>/</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>freq</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mtext>freq</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — dividing by each\npiece's individual frequency. This means WordPiece can merge a pair that appears only 5 times over one\nthat appears 20 times, if the 5-times pair is disproportionately more common <em>together</em> than its\nindividual pieces' frequencies would predict — favoring pairs that are individually rare but\nconsistently co-occur, over pairs that are merely both common on their own.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does attention need a positional encoding at all — what specifically breaks without one?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Self-attention's output for a given token is a weighted sum over value vectors, and a weighted sum is\ninvariant to the order of its inputs — if the tokens in a sentence were shuffled, and their embeddings\nshuffled along with them, each token's attention output would be identical. This means &quot;dog bites\nman&quot; and &quot;man bites dog&quot; would produce indistinguishable representations under attention alone.\nPositional encoding fixes this by adding a position-dependent vector to each token's embedding before\nattention runs, so the input itself — not the attention mechanism — carries order information.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What specifically does the learned positional encoding method lose relative to sinusoidal, and why?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Learned positional encoding is a trainable table with one row per position, with no fixed maximum\nlength built into a formula — so it needs a chosen maximum sequence length upfront and has literally\nno row (hence no defined behavior) for positions beyond that trained length, meaning it cannot\nextrapolate to longer sequences. Sinusoidal encoding, by contrast, is defined by a formula that\nproduces a valid vector for <em>any</em> position, including ones never seen during training, though in\npractice its extrapolation quality also degrades.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive why a causal mask sets scores to negative infinity rather than simply zeroing the attention weights after softmax.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Setting the raw score <math data-tex=\"\\text{score}_{ij}\"><msub><mtext>score</mtext><mrow><mi>i</mi><mi>j</mi></mrow></msub></math> to <math data-tex=\"-\\infty\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mi>∞</mi></mrow></math> for every future position <math data-tex=\"j&gt;i\"><mrow><mi>j</mi><mo>&gt;</mo><mi>i</mi></mrow></math> <em>before</em> the\nsoftmax guarantees that <math data-tex=\"e^{-\\infty}=0\"><mrow><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mi>∞</mi></mrow></msup><mo>=</mo><mn>0</mn></mrow></math>, so those positions get exactly zero weight <em>and</em> the softmax\ncorrectly renormalizes over only the allowed (current and earlier) positions, preserving a valid\nprobability distribution that sums to 1. Zeroing weights <em>after</em> an ordinary softmax would leave the\nremaining weights not summing to 1, and would not prevent gradient from flowing back through the\n(nonzero, pre-masking) score computation for future positions during training.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" cl
