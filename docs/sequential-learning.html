g> — because it decomposes words into character n-grams, so a novel or misspelled word\nstill gets a vector built from n-grams it <em>has</em> seen, even if the exact whole-word string is new.\nNeither Word2Vec (local context windows over whole-word tokens) nor GloVe (a co-occurrence matrix\nindexed by whole words) has any mechanism to produce a vector for a word absent from their training\nvocabulary [slide 146].</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n</aside>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Choosing between them, practically:</strong> default to Word2Vec (specifically Skip-Gram) for general\nembeddings and analogy-style tasks; reach for GloVe when you specifically want embeddings that\nreflect measurable corpus-wide statistics (e.g. for a corpus-analysis or information-retrieval\nsetting where global co-occurrence <em>is</em> the signal you care about); reach for FastText whenever\nyour text is noisy, contains rare or misspelled words, or is in a morphologically rich language\n(e.g. agglutinative languages where a single word carries many meaningful sub-parts) [slide 138].</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-18-7\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;FastText: Word From Pieces&quot;,&quot;concept&quot;:&quot;Character n-gram decomposition and OOV robustness&quot;,&quot;control&quot;:&quot;Type any word, including a misspelling or a made-up word; watch it decompose into character n-grams and sum into a vector&quot;,&quot;observe&quot;:&quot;The resulting vector's nearest neighbors among a small fixed vocabulary, shown live&quot;,&quot;insight&quot;:&quot;A word never seen during training still lands near its correctly-spelled relatives, because most of its character pieces are shared and already have learned vectors&quot;,&quot;fallback&quot;:&quot;The 'enviroment' → close to 'environment' example above walks the same mechanism by hand.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">FastText: Word From Pieces</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Character n-gram decomposition and OOV robustness</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Type any word, including a misspelling or a made-up word; watch it decompose into character n-grams and sum into a vector</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The resulting vector's nearest neighbors among a small fixed vocabulary, shown live</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>A word never seen during training still lands near its correctly-spelled relatives, because most of its character pieces are shared and already have learned vectors</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The 'enviroment' → close to 'environment' example above walks the same mechanism by hand.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-18-s11\" data-title=\"Evolution of Word Representations\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Evolution of Word Representations</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>The lecture closes Part 5 by placing everything just covered on a timeline [slide 147]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Era</th>\n<th>Method</th>\n<th>Idea</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1960s</td>\n<td>Vector Space Model</td>\n<td>TF-IDF for information retrieval</td>\n</tr>\n<tr>\n<td>1990s</td>\n<td>LSA</td>\n<td>SVD on the term-document matrix</td>\n</tr>\n<tr>\n<td>2003</td>\n<td>Bengio</td>\n<td>Neural Probabilistic Language Model</td>\n</tr>\n<tr>\n<td>2013</td>\n<td><strong>Word2Vec</strong></td>\n<td>Fast, scalable embeddings</td>\n</tr>\n<tr>\n<td>2014</td>\n<td><strong>GloVe</strong></td>\n<td>Global + prediction hybrid</td>\n</tr>\n<tr>\n<td>2017</td>\n<td><strong>FastText</strong></td>\n<td>Subword-aware embeddings</td>\n</tr>\n<tr>\n<td>2018</td>\n<td>ELMo → BERT</td>\n<td>Contextual embeddings</td>\n</tr>\n<tr>\n<td>2020+</td>\n<td>GPT, T5</td>\n<td>Embeddings as a byproduct of LLMs</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Static embeddings → Contextual embeddings</strong> [slide 147].</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The one gap the whole lecture is honest about, by omission.</strong> Every method covered here —\nWord2Vec, GloVe, FastText — produces a <strong>static</strong> embedding: one fixed vector per word, regardless\nof the sentence it appears in. &quot;Bank&quot; gets the <em>same</em> vector whether the sentence is about a river\nbank or a savings bank. The 2018-onward row (ELMo → BERT → GPT) is where that limitation gets\nfixed, by making the embedding a function of the whole sentence — but that mechanism (the\nTransformer's self-attention) is out of scope for this lecture and is presumably where a later\nlecture in this module picks up.</p>\n</aside>\n<hr>\n</section><section id=\"sequential-learning-18-s12\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>                         ┌─────────────────────────┐\n                         │  Distributional          │\n                         │  Hypothesis (Firth 1957) │\n                         │  &quot;company it keeps&quot;      │\n                         └────────────┬─────────────┘\n                                      │ theoretical basis for\n                     ┌────────────────┼────────────────┐\n                     ▼                ▼                ▼\n              ┌────────────┐  ┌──────────────┐  ┌──────────────┐\n              │  Word2Vec   │  │    GloVe      │  │  FastText     │\n              │  (2013)     │  │    (2014)     │  │  (2017)       │\n              │ local window│  │ global co-occ.│  │ char n-grams  │\n              │ prediction  │  │ + log-ratio   │  │ + prediction  │\n              │             │  │ least squares │  │               │\n              └──────┬──────┘  └───────┬───────┘  └───────┬───────┘\n                     │  both fix       │                  │  additionally fixes\n                     └── &quot;no similarity&quot;┘                  │  the OOV problem\n                          (failure #1, #3)                 │  (failure #7)\n                                                            ▼\n                                              ┌──────────────────────────┐\n                                              │ 2018+: contextual         │\n                                              │ embeddings (ELMo→BERT→GPT)│\n                                              │ fixes: one vector per     │\n                                              │ WORD → one vector per     │\n                                              │ word-IN-CONTEXT           │\n                                              └──────────────────────────┘</pre></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li><strong>Every representation scheme is a response to a specific, nameable failure of the previous one.</strong>\nOne-hot → no similarity. BoW → adds document-level counting but loses order. TF-IDF → adds\ndistinctiveness weighting but still discrete. Word2Vec/GloVe/FastText → dense vectors that finally\nmake cosine similarity meaningful. FastText → additionally fixes OOV. Contextual embeddings\n(named but not covered) → additionally fix &quot;one vector per word regardless of context.&quot;</li>\n<li><strong>The <math data-tex=\"3/4\"><mrow><mn>3</mn><mi>/</mi><mn>4</mn></mrow></math>-power smoothing trick appears twice, independently</strong> — in Word2Vec's negative-sampling\nnoise distribution (<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.5\" role=\"link\" tabindex=\"0\">§6.5</a>) and in GloVe's weighting function <math data-tex=\"f(x)\"><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>). Both exist to prevent\nvery frequent items from dominating a learning signal that should also serve rare items — the same\nunderlying problem (frequency imbalance), solved the same way, in two independently designed\nsystems.</li>\n<li><strong>&quot;Local window&quot; vs. &quot;global statistics&quot; is the axis that actually separates these methods</strong>, more\nthan any surface-level architecture difference. Word2Vec (both variants) only ever sees a small\nsliding window at a time; GloVe deliberately steps back and uses the entire corpus's co-occurrence\ntable up front. FastText is a variant <em>of</em> Word2Vec's local-window approach, with subword\ndecomposition layered on top — it does not change the local-vs-global axis at all.</li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-18-s13\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">14 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why can't you compute meaningful cosine similarity between two one-hot vectors?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Any two distinct one-hot vectors are orthogonal by construction — each has a single 1 in a different\nposition, so their dot product is always exactly 0, giving cosine similarity 0 for <em>every</em> pair of\ndistinct words. This isn't a property of any particular vocabulary; it's structural to how one-hot\nvectors are built.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive why TF-IDF assigns a near-zero score to stopwords without any hand-written stopword list.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><math data-tex=\"\\text{idf}(t) = \\log(N/n_t)\"><mrow><mtext>idf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>N</mi><mi>/</mi><msub><mi>n</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. As <math data-tex=\"n_t \\to N\"><mrow><msub><mi>n</mi><mi>t</mi></msub><mo>→</mo><mi>N</mi></mrow></math> (the term appears in nearly every document), the ratio\n<math data-tex=\"N/n_t \\to 1\"><mrow><mi>N</mi><mi>/</mi><msub><mi>n</mi><mi>t</mi></msub><mo>→</mo><mn>1</mn></mrow></math>, and <math data-tex=\"\\log(1) = 0\"><mrow><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math>. Since <math data-tex=\"\\text{tfidf} = \\text{tf}\\times\\text{idf}\"><mrow><mtext>tfidf</mtext><mrow><mspace width=\"0.2778em\"></mspace><mo>=</mo><mspace width=\"0.2778em\"></mspace></mrow><mtext>tf</mtext><mrow><mspace width=\"0.222em\"></mspace><mo>×</mo><mspace width=\"0.222em\"></mspace></mrow><mtext>idf</mtext></mrow></math>, this drives the\nscore to zero regardless of how high tf is. So words appearing in almost every document — exactly the\ndefinition of a stopword — get automatically suppressed by the formula itself.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does BPE produce different vocabulary sizes for GPT-2 (~50K) and GPT-4 (~100K)?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>BPE vocabulary size is a hyperparameter: the algorithm merges the most frequent adjacent pair\nrepeatedly until it hits a target vocabulary size, chosen by whoever trains the tokenizer (also\ndepends on training corpus). It's not a property of the English language — it's a stopping point\nchosen for a trade-off between sequence length (bigger vocab → shorter sequences) and embedding table\nsize (bigger vocab → more parameters just to store the embedding matrix).</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Explain why Skip-Gram uses two separate vectors per word instead of one.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>One vector (<math data-tex=\"v_c\"><msub><mi>v</mi><mi>c</mi></msub></math>) represents the word acting as the center/input; a second (<math data-tex=\"u_o\"><msub><mi>u</mi><mi>o</mi></msub></math>) represents the\nsame word acting as a possible context/output. Decoupling these avoids the awkward case of a word\nneeding to predict itself as its own context, and keeps the softmax's dot-product-based\n&quot;compatibility&quot; score well-defined between two conceptually different roles.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why is negative sampling roughly 100× faster than full softmax, and what's the trade-off?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Full softmax requires computing and normalizing over the whole vocabulary (<math data-tex=\"|V|=100K+\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi><mo>=</mo><mn>100</mn><mi>K</mi><mo>+</mo></mrow></math> exponentials)\nper training example. Negative sampling replaces this with <math data-tex=\"K+1\"><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></math> binary sigmoid classifications\n(<math data-tex=\"K\"><mi>K</mi></math>=5–20 typically), a constant, tiny cost independent of vocabulary size. The trade-off: you're no\nlonger optimizing an exact probability distribution over the full vocabulary, just a local\napproximation — in practice this loses little quality for the massive speedup.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">A colleague samples negative words uniformly at random for negative sampling. What will go wrong, and how does Word2Vec actually do it?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Uniform sampling wastes most negative examples on common function words (&quot;the&quot;, &quot;of&quot;) that provide\nweak gradient signal (the model quickly learns these are unrelated to almost everything and stops\nlearning much from them), while rare, informative words are undersampled. Word2Vec instead samples\nproportional to <math data-tex=\"f(w)^{3/4}\"><mrow><mi>f</mi><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>w</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mn>3</mn><mi>/</mi><mn>4</mn></mrow></msup></mrow></math>, a smoothed frequency distribution that dampens common words and boosts\nrare ones, producing a better learning signal — the same problem GloVe's <math data-tex=\"f(x)=(x/x_{\\max})^{3/4}\"><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mi>/</mi><msub><mi>x</mi><mrow><mi>max</mi><mo>⁡</mo></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mn>3</mn><mi>/</mi><mn>4</mn></mrow></msup></mrow></math>\nweighting solves in a different part of the pipeline.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What does GloVe's objective actually optimize, in plain language, and why use log co-occurrence rather than raw co-occurrence?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>GloVe fits vectors so that <math data-tex=\"w_i^\\top \\tilde w_j + b_i + \\tilde b_j \\approx \\log(X_{ij})\"><mrow><msubsup><mi>w</mi><mi>i</mi><mi class=\"tml-med-pad\">⊤</mi></msubsup><msub><mover><mi>w</mi><mo stretchy=\"false\" class=\"chr-med wbk-med\" style=\"math-depth:0;\">~</mo></mover><mi>j</mi></msub><mo>+</mo><msub><mi>b</mi><mi>i</mi></msub><mo>+</mo><msub><mover><mi>b</mi><mo stretchy=\"false\" style=\"math-depth:0;\">~</mo></mover><mi>j</mi></msub><mo>≈</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>X</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — the dot\nproduct (plus bias terms) should approximate the log of how often words <math data-tex=\"i\"><mi>i</mi></math> and <math data-tex=\"j\"><mi>j</mi></math> co-occur. Using\nthe log compresses the huge dynamic range of raw counts (which can span many orders of magnitude) into\nsomething a bounded dot product can realistically reconstruct, and it's consistent with the ratio\ninsight — since <math data-tex=\"\\log(a/b) = \\log a - \\log b\"><mrow><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mi>/</mi><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>a</mi><mo>−</mo><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>b</mi></mrow></math>, differences of log co-occurrences correspond to\nco-occurrence <em>ratios</em>, which is the signal GloVe is actually trying to capture.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">How does FastText produce a vector for a word it has never seen during training?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>FastText represents every word as the sum of its character n-gram embeddings (e.g. &quot;where&quot; →\n<code>&lt;wh, whe, her, ere, re&gt;</code> plus the whole word). An unseen word is decomposed into the same kind of\nn-grams; if it shares enough n-grams with words the model <em>has</em> seen (which is common for\nmisspellings and morphological variants), it gets a vector by summing those known n-gram embeddings\n— no lookup table entry for the whole word is required.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines #4 concepts] Why does Skip-Gram tend to produce better embeddings for rare words than CBOW, even though CBOW is faster?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>CBOW averages multiple context words into a single input to predict one center word — one training\nsignal per window, and that signal is dominated by whichever context words are most frequent\n(informative gradient gets diluted by averaging). Skip-Gram instead makes a separate prediction for\n<em>each</em> context word from the single center word — <math data-tex=\"2m\"><mrow><mn>2</mn><mi>m</mi></mrow></math> training signals per window instead of 1 — so\na rare center word still gets <math data-tex=\"2m\"><mrow><mn>2</mn><mi>m</mi></mrow></math> chances to have its vector nudged, rather than being averaged away\ninside someone else's context. The cost is <math data-tex=\"2m\\times\"><mrow><mn>2</mn><mi>m</mi><mo>×</mo></mrow></math> more predictions per window, which is exactly\nCBOW's speed advantage running in reverse.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] You need a text representation for a search engine over a corpus of scanned, OCR'd legal documents with frequent OCR typos. Which representation would you choose, and why not the others?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>FastText, because OCR typos are exactly the kind of near-miss spelling variation its character\nn-gram decomposition is designed to be robust to — a misrecognized character still shares most\nn-grams with the correct word. TF-IDF/BoW would treat each OCR error as an entirely separate,\nunrelated vocabulary entry, fragmenting the term-frequency signal across many near-duplicate\n&quot;words.&quot; Word2Vec and GloVe would both simply fail to produce a vector at all for any typo variant\nabsent from training data (the OOV problem) — only FastText's subword mechanism degrades gracefully\nhere.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Why do both Word2Vec's negative-sampling distribution and GloVe's weighting function independently use the same 3/4 exponent?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Both are solving the identical underlying problem from two different angles: a small number of very\nfrequent items (common words as negative samples in Word2Vec; frequent co-occurrence pairs in GloVe)\nthreaten to dominate the training signal and starve rare items of useful gradient updates. Raising to\na power less than 1 compresses the frequency distribution — large values grow relatively slower than\nsmall ones under this transform — which dampens the dominant items and relatively boosts the rare\nones in both settings. The exponent's specific value (3/4) is an empirically tuned choice from the\noriginal papers, not derived from first principles, but the reason for using <em>some</em> sub-linear\nexponent is the same reasoning in both cases.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What structural limitation do Word2Vec, GloVe, and FastText all still share, and what later approach fixes it?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>All three produce a single, fixed (&quot;static&quot;) vector per word regardless of the sentence it appears\nin — &quot;bank&quot; gets the same vector in &quot;river bank&quot; and &quot;savings bank.&quot; Contextual embeddings (ELMo,\nthen BERT and GPT-family models, from 2018 onward) fix this by computing a word's representation as a\nfunction of the entire input sentence via self-attention, so the same word gets different vectors in\ndifferent contexts.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;Why does the softmax denominator make full Skip-Gram intractable at scale, precisely?&quot;</em> — because\nit requires <math data-tex=\"O(|V|)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>|</mi><mi>V</mi><mi>|</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> exponentials and a normalization sum <strong>per training example</strong>, and with\nbillions of training examples and <math data-tex=\"|V|&gt;100K\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi><mo>&gt;</mo><mn>100</mn><mi>K</mi></mrow></math>, this multiplies out to a cost that dominates training\ntime; negative sampling reduces the per-example cost to <math data-tex=\"O(K)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>K</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, independent of <math data-tex=\"|V|\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi></mrow></math>.</li>\n<li><em>&quot;When would GloVe's global co-occurrence matrix actually be a disadvantage compared to Word2Vec's\nstreaming local windows?&quot;</em> — GloVe requires materializing and storing the full <math data-tex=\"|V|\\times|V|\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi><mo>×</mo><mi>|</mi><mi>V</mi><mi>|</mi></mrow></math>\nco-occurrence matrix before training can start, which is memory-expensive for very large\nvocabularies, and it can't easily be updated incrementally as new text streams in, unlike\nWord2Vec's online, window-by-window training.</li>\n<li><em>&quot;What would happen to FastText's embeddings for a word if you set the n-gram range to n=1 only?&quot;</em>\n— it would degenerate toward a bag of single characters, losing almost all the morphological\nsignal that makes FastText useful (n=1 grams are just individual letters, shared by huge numbers of\nunrelated words, so the resulting vector wouldn't discriminate between words at all).</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>TF-IDF's &quot;stopword suppression&quot; property</strong> — shown in Q2 above: as <math data-tex=\"n_t\\to N\"><mrow><msub><mi>n</mi><mi>t</mi></msub><mo>→</mo><mi>N</mi></mrow></math>, $\\log(N/n_t)\\to\n\\log(1)=0<math data-tex=\", driving\"><mrow><mo separator=\"true\">,</mo><mi>d</mi><mi>r</mi><mi>i</mi><mi>v</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></math>\\text{tfidf}\\to 0$ regardless of tf.</li>\n<li><strong>Negative sampling's loss function, term by term</strong> — $J = -\\log\\sigma(u_o^\\top v_c) -\n\\sum_{k=1}^K \\log\\sigma(-u_{w_k}^\\top v_c)<math data-tex=\": minimizing\"><mrow><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mi>m</mi><mi>i</mi><mi>n</mi><mi>i</mi><mi>m</mi><mi>i</mi><mi>z</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></math>J<math data-tex=\"means maximizing\"><mrow><mi>m</mi><mi>e</mi><mi>a</mi><mi>n</mi><mi>s</mi><mi>m</mi><mi>a</mi><mi>x</mi><mi>i</mi><mi>m</mi><mi>i</mi><mi>z</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></math>\\sigma(u_o^\\top v_c)$\n(push the true-pair score toward 1) and maximizing each <math data-tex=\"\\sigma(-u_{w_k}^\\top v_c)\"><mrow><mi>σ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><msubsup><mi>u</mi><msub><mi>w</mi><mi>k</mi></msub><mi class=\"tml-sml-pad\">⊤</mi></msubsup><msub><mi>v</mi><mi>c</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, i.e. minimizing\n<math data-tex=\"\\sigma(u_{w_k}^\\top v_c)\"><mrow><mi>σ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>u</mi><msub><mi>w</mi><mi>k</mi></msub><mi class=\"tml-sml-pad\">⊤</mi></msubsup><msub><mi>v</mi><mi>c</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> (push each negative-pair score toward 0) — two simultaneous, opposite\npushes on <math data-tex=\"v_c\"><msub><mi>v</mi><mi>c</mi></msub></math>.</li>\n<li><strong>The GloVe ratio-cancellation argument</strong> — for probe word <math data-tex=\"k\"><mi>k</mi></math> and target words <math data-tex=\"i,j\"><mrow><mi>i</mi><mo separator=\"true\">,</mo><mi>j</mi></mrow></math>: $\\dfrac{P(k\n\\mid i)}{P(k\\mid j)}<math data-tex=\"cancels\"><mrow><mi>c</mi><mi>a</mi><mi>n</mi><mi>c</mi><mi>e</mi><mi>l</mi><mi>s</mi></mrow></math>k$'s marginal frequency (which appears in both the numerator and\ndenominator's normalization), isolating the part of the co-occurrence signal specific to the\nrelationship between <math data-tex=\"i\"><mi>i</mi></math> and <math data-tex=\"j\"><mi>j</mi></math> (e.g. ice vs. steam), which is exactly why GloVe's objective is\nbuilt around this ratio rather than raw counts.</li>\n</ol>\n<h3>Applied scenario — Amazon product search</h3>\n<p><strong>Framing:</strong> Amazon's product search needs to match a customer's typed query (e.g. &quot;kids waterproof\nsneekers&quot; — note the typo) against product titles and descriptions, ranking the most relevant\nproducts first.</p>\n<p><strong>Data:</strong> Millions of product titles/descriptions, historical query logs, click-through data as an\nimplicit relevance signal.</p>\n<p><strong>Model:</strong> A hybrid, informed directly by this lecture's content. TF-IDF (or BM25, a close cousin) on\ntitle/description text gives a strong, cheap, interpretable baseline for exact and near-exact term\nmatches — useful because e-commerce search still rewards literal keyword matches heavily. Layer\nFastText-style subword embeddings on top specifically to handle the &quot;sneekers&quot; typo case and other\nmisspellings/rare-brand-name matches that a pure TF-IDF term-match would miss entirely (TF-IDF has no\nnotion that &quot;sneekers&quot; and &quot;sneakers&quot; are related — they're different tokens with unrelated document\nfrequencies). Dense embeddings additionally let you retrieve semantically related products even\nwithout exact keyword overlap (&quot;sneakers&quot; query surfacing &quot;trainers&quot;-titled products).</p>\n<p><strong>Metric:</strong> Not raw cosine similarity in isolation — measure downstream <strong>click-through rate</strong> and\n<strong>conversion rate</strong> on ranked results, since a semantically &quot;close&quot; embedding match doesn't guarantee\na customer actually wants that product.</p>\n<p><strong>Failure modes:</strong> A pure dense-embedding approach can &quot;hallucinate&quot; relevance for semantically\nsimilar but practically wrong substitutions (e.g. &quot;kids sneakers&quot; surfacing &quot;adult sneakers&quot; because\nthe words are embedding-close). A pure TF-IDF approach fails completely on the typo case and can't\ngeneralize to true synonyms with no character overlap (&quot;trainers&quot; vs &quot;sneakers&quot; — FastText's\ncharacter n-grams wouldn't help here at all, since the two words share almost no substrings; only a\ngenuinely learned semantic embedding, e.g. Word2Vec/GloVe-style, captures that relationship).</p>\n<p><strong>What you'd ship:</strong> A staged retrieval pipeline — cheap TF-IDF/BM25 keyword retrieval as a fast\nfirst-pass filter over millions of products, FastText-based subword matching specifically to catch\ntypos and rare terms, and a dense semantic embedding re-ranking stage on the smaller shortlisted\ncandidate set, tuned against click-through data rather than embedding similarity alone.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Customer Obsession</strong> — the typo-robustness motivation (FastText\nover plain Word2Vec/GloVe) exists entirely because real customers make typos, and a search system\nthat silently fails on &quot;sneekers&quot; is optimizing for a clean-text assumption that doesn't match how\ncustomers actually type. <strong>Dive Deep</strong> — diagnosing <em>why</em> a keyword-only system fails a specific\nquery (missing subword robustness, not &quot;the model is bad&quot;) requires exactly the mechanism-level\nunderstanding (OOV handling row of the comparison table) this lecture builds.</p>\n<hr>\n</section><section id=\"sequential-learning-18-s14\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>Bag of Words (BoW)</strong> — document representation counting word occurrences, discarding order.</li>\n<li><strong>BPE (Byte Pair Encoding)</strong> — subword tokenization built by iteratively merging the most frequent\nadjacent character/token pair.</li>\n<li><strong>CBOW (Continuous Bag of Words)</strong> — Word2Vec variant predicting the center word from averaged\ncontext word vectors.</li>\n<li><strong>Character n-gram</strong> — a contiguous sequence of <math data-tex=\"n\"><mi>n</mi></math> characters within a word; FastText's building\nblock.</li>\n<li><strong>Cosine similarity</strong> — <math data-tex=\"\\cos(\\theta)=\\frac{a\\cdot b}{\\|a\\|\\|b\\|}\"><mrow><mrow><mi>cos</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>a</mi><mo>⋅</mo><mi>b</mi></mrow><mrow><mi>‖</mi><mi>a</mi><mi>‖</mi><mi>‖</mi><mi>b</mi><mi>‖</mi></mrow></mfrac></mrow></math>; measures vector alignment,\nindependent of magnitude.</li>\n<li><strong>Curse of dimensionality</strong> — problems arising from extremely high-dimensional, sparse vector\nspaces (here: <math data-tex=\"|V|=\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi><mo>=</mo></mrow></math>50K–500K).</li>\n<li><strong>Distributional Hypothesis</strong> — Firth's (1957) principle that words in similar contexts have\nsimilar meanings.</li>\n<li><strong>Document frequency (<math data-tex=\"n_t\"><msub><mi>n</mi><mi>t</mi></msub></math>)</strong> — number of documents containing a given term at least once.</li>\n<li><strong>Embedding</strong> — a dense, learned, fixed-length vector representation of a word.</li>\n<li><strong>FastText</strong> — Word2Vec-style embeddings built from summed character n-gram vectors; handles OOV\nwords.</li>\n<li><strong>GloVe</strong> — embedding method fitting vectors to reconstruct log co-occurrence counts from a global\nco-occurrence matrix.</li>\n<li><strong>Lemmatization</strong> — reducing a word to its dictionary form using grammar/POS information; always\nvalid.</li>\n<li><strong>N-gram</strong> — a contiguous sequence of <math data-tex=\"n\"><mi>n</mi></math> tokens.</li>\n<li><strong>Negative sampling</strong> — approximating softmax training with <math data-tex=\"K\"><mi>K</mi></math> random &quot;fake&quot; (negative) examples\nplus 1 true example, as binary classification.</li>\n<li><strong>Noise distribution</strong> — the (frequency<math data-tex=\"^{3/4}\"><msup><mrow></mrow><mrow><mn>3</mn><mi>/</mi><mn>4</mn></mrow></msup></math>-weighted) distribution used to sample negative\nexamples.</li>\n<li><strong>OOV (Out-of-Vocabulary)</strong> — a word absent from the model's training vocabulary; unrepresentable\nby discrete/atomic-word methods.</li>\n<li><strong>One-hot encoding</strong> — binary vector of length <math data-tex=\"|V|\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi></mrow></math> with a single 1 marking the word's index.</li>\n<li><strong>Sigmoid (<math data-tex=\"\\sigma\"><mi>σ</mi></math>)</strong> — function squashing any real number into <math data-tex=\"(0,1)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math>; used in negative\nsampling's binary classification.</li>\n<li><strong>Skip-Gram</strong> — Word2Vec variant predicting context words from the center word.</li>\n<li><strong>Softmax</strong> — normalizes a set of scores into a probability distribution summing to 1.</li>\n<li><strong>Stemming</strong> — rule-based suffix stripping to a root form; may produce invalid words.</li>\n<li><strong>Stopword</strong> — a very common, low-information word (the, and, of, ...), often removed or\ndown-weighted.</li>\n<li><strong>TF-IDF (Term Frequency × Inverse Document Frequency)</strong> — weighting rewarding terms frequent in a\ndocument but rare corpus-wide.</li>\n<li><strong>Tokenization</strong> — segmenting raw text into discrete units (tokens): word, subword, or character\nlevel.</li>\n<li><strong>Word2Vec</strong> — Mikolov et al.'s (2013) family of shallow neural network embedding methods (Skip-Gram,\nCBOW).</li>\n</ul>\n<hr>\n</section><section id=\"sequential-learning-18-s15\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Why is <math data-tex=\"\\cos(\\text{cat},\\text{dog})=0\"><mrow><mrow><mi>cos</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>cat</mtext><mo separator=\"true\">,</mo><mtext>dog</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math> under one-hot encoding, no matter how the vocabulary is\nordered? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>)</em></li>\n<li>Compute the TF-IDF of a term appearing 2 times in a 10-token document, when it appears in 50 of\n2000 corpus documents. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>)</em></li>\n<li>Why does BPE's stopping point (vocabulary size) directly trade off sequence length against\nembedding table size? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>Name the failure mode that &quot;Dog bites man&quot; = &quot;Man bites dog&quot; demonstrates, and explain which\nrepresentations in this lecture do and don't have it. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>)</em></li>\n<li>Write out Skip-Gram's softmax formula for <math data-tex=\"P(o\\mid c)\"><mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>o</mi><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>c</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> and identify what each of the two vectors\n<math data-tex=\"v_c\"><msub><mi>v</mi><mi>c</mi></msub></math> and <math data-tex=\"u_o\"><msub><mi>u</mi><mi>o</mi></msub></math> represents. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.1\" role=\"link\" tabindex=\"0\">§6.1</a>)</em></li>\n<li>Why does CBOW average context word embeddings before predicting the center word, and what\ninformation does averaging discard? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>)</em></li>\n<li>In negative sampling's loss <math data-tex=\"J\"><mi>J</mi></math>, what happens to <math data-tex=\"J\"><mi>J</mi></math> as <math data-tex=\"\\sigma(u_o^\\top v_c)\\to 1\"><mrow><mi>σ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>u</mi><mi>o</mi><mi class=\"tml-sml-pad\">⊤</mi></msubsup><msub><mi>v</mi><mi>c</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>→</mo><mn>1</mn></mrow></math> and each\n<math data-tex=\"\\sigma(u_{w_k}^\\top v_c)\\to 0\"><mrow><mi>σ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>u</mi><msub><mi>w</mi><mi>k</mi></msub><mi class=\"tml-sml-pad\">⊤</mi></msubsup><msub><mi>v</mi><mi>c</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>→</mo><mn>0</mn></mrow></math>? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.4\" role=\"link\" tabindex=\"0\">§6.4</a>)</em></li>\n<li>Why is <math data-tex=\"f(w)^{3/4}\"><mrow><mi>f</mi><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>w</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mrow><mn>3</mn><mi>/</mi><mn>4</mn></mrow></msup></mrow></math> used instead of <math data-tex=\"f(w)\"><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>w</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> directly when sampling negatives? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.5\" role=\"link\" tabindex=\"0\">§6.5</a>)</em></li>\n<li>Explain, using the ice/steam ratio table, why GloVe uses ratios of co-occurrence probabilities\nrather than raw co-occurrence counts. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>)</em></li>\n<li>Walk through how FastText would represent the misspelled word &quot;recieve&quot; using n-grams shared with\n&quot;receive.&quot; <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>)</em></li>\n<li>Fill in the comparison table from memory: for each of Word2Vec, GloVe, FastText — method,\narchitecture, OOV handling, best-for. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§8.1\" role=\"link\" tabindex=\"0\">§8.1</a>)</em></li>\n<li>What single limitation do all three algorithms in this lecture (Word2Vec, GloVe, FastText) share,\nand what later technique (named but not derived here) fixes it? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-18-s16\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Mikolov et al. (2013), &quot;Efficient Estimation of Word Representations in Vector Space&quot;</strong> — the\noriginal Word2Vec paper introducing Skip-Gram and CBOW. <code>solid</code> · essential primary source for\n<a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>.</li>\n<li><strong>Mikolov et al. (2013), &quot;Distributed Representations of Words and Phrases and their\nCompositionality&quot;</strong> — the companion paper introducing negative sampling and the <math data-tex=\"3/4\"><mrow><mn>3</mn><mi>/</mi><mn>4</mn></mrow></math>-power noise\ndistribution. <code>solid</code> · directly underlies <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.4–6\" role=\"link\" tabindex=\"0\">§6.4–6</a>.5.</li>\n<li><strong>Pennington, Socher, Manning (2014), &quot;GloVe: Global Vectors for Word Representation&quot;</strong> — the\noriginal GloVe paper. <code>solid</code> · primary source for <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>.</li>\n<li><strong>Bojanowski et al. (2017), &quot;Enriching Word Vectors with Subword Information&quot;</strong> — the original\nFastText paper. <code>solid</code> · primary source for <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>.</li>\n<li><strong>Jay Alammar, &quot;The Illustrated Word2Vec&quot;</strong> — a widely used visual walkthrough of Skip-Gram and\nnegative sampling. <code>intro</code> · best paired with <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a> before attempting the derivations yourself.</li>\n<li><strong>Jurafsky &amp; Martin, Speech and Language Processing, 3rd ed., Ch. 6</strong> — the textbook chapter this\nlecture cites directly as its reference [slide 150]; covers vector semantics and embeddings in\nmore mathematical depth. <code>solid</code>.</li>\n<li><strong>Stanford CS224N, Lectures 1–2</strong> — cited directly on the lecture's own references slide [slide\n150] as the course-level treatment of this exact material, including a fuller derivation of the\nSkip-Gram gradient than this lecture has time for. <code>hard</code> · best after this lecture, not instead\nof it.</li>\n<li><strong>A from-scratch NumPy or PyTorch Skip-Gram + negative sampling implementation</strong> (many open\ntutorials reproduce this) — the single most effective way to convert the derivations in <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a> into\nreal understanding: implement the loss in <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§6.4\" role=\"link\" tabindex=\"0\">§6.4</a> and watch <math data-tex=\"v_{\\text{king}}\"><msub><mi>v</mi><mtext>king</mtext></msub></math> actually move toward\n<math data-tex=\"u_{\\text{crown}}\"><msub><mi>u</mi><mtext>crown</mtext></msub></math> over training steps. <code>hard</code>, hands-on.</li>\n</ol>\n<blockquote class=\"aside-quote\">\n<p><strong>Externally verified</strong> (module enhancement pass, 2026-08-30) — all four citations above checked\nagainst their primary listings and confirmed exact: Mikolov, Chen, Corrado &amp; Dean, arXiv 2013\n(&quot;Efficient Estimation...&quot;); Mikolov, Sutskever, Chen, Corrado &amp; Dean, NeurIPS 2013 (&quot;Distributed\nRepresentations...&quot;); Pennington, Socher &amp; Manning, EMNLP 2014 (GloVe); Bojanowski, Grave, Joulin &amp;\nMikolov, TACL 2017 (FastText). The lecture's own references slide [slide 150] cites Word2Vec\ngenerically as a single &quot;Mikolov et al. (2013)&quot; line — it does not separately distinguish the two\nreal, distinct 2013 Mikolov papers listed above as #1–2; that split is correct per the external\ncheck, not per slide-level detail. Pennington (2014) and Bojanowski (2017) are each named\nindividually on the slide and match.</p>\n</blockquote>\n</section>","sections":[{"id":"sequential-learning-18-s0","num":"","title":"What you'll understand after reading this","mins":2,"kind":"content","part":""},{"id":"sequential-learning-18-s1","num":"","title":"Before we start: what you need to know","mins":4,"kind":"content","part":""},{"id":"sequential-learning-18-s2","num":"","title":"The big picture","mins":2,"kind":"content","part":""},{"id":"sequential-learning-18-s3","num":"1","title":"Tokenization — turning a string into units","mins":5,"kind":"content","part":""},{"id":"sequential-learning-18-s4","num":"2","title":"Stemming vs. Lemmatization","mins":5,"kind":"content","part":""},{"id":"sequential-learning-18-s5","num":"3","title":"Discrete Representations","mins":9,"kind":"content","part":""},{"id":"sequential-learning-18-s6","num":"4","title":"Why Discrete Representations Fall Short","mins":4,"kind":"content","part":""},{"id":"sequential-learning-18-s7","num":"5","title":"Distributed Representations — the fix","mins":3,"kind":"content","part":""},{"id":"sequential-learning-18-s8","num":"6","title":"Word2Vec (Mikolov et al., 2013)","mins":12,"kind":"content","part":""},{"id":"sequential-learning-18-s9","num":"7","title":"GloVe (Pennington et al., 2014)","mins":5,"kind":"content","part":""},{"id":"sequential-learning-18-s10","num":"8","title":"FastText (Bojanowski et al., 2017)","mins":5,"kind":"content","part":""},{"id":"sequential-learning-18-s11","num":"9","title":"Evolution of Word Representations","mins":1,"kind":"content","part":""},{"id":"sequential-learning-18-s12","num":"","title":"Putting it together","mins":2,"kind":"back","part":""},{"id":"sequential-learning-18-s13","num":"","title":"Interview prep — Amazon Applied Scientist","mins":14,"kind":"back","part":""},{"id":"sequential-learning-18-s14","num":"","title":"Glossary","mins":3,"kind":"back","part":""},{"id":"sequential-learning-18-s15","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"sequential-learning-18-s16","num":"","title":"Going deeper","mins":3,"kind":"back","part":""}],"interactiveCount":8},{"id":"sequential-learning-19","num":"19","file":"sequential-learning-02","kind":"lecture","title":"Sequential Learning — Part 2: From Context to Attention","h1":"Sequential Learning — Part 2: From Context to Attention","subtitle":"From Context to Attention","spineLabel":"Part 2","short":"From Context to Attention","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Runtime 1:12:00. Built from the raw capture in <code>output/Lecture_19 - Module 6 Sequential Learning Part 2/</code> (136 raw frames), not <code>slides_deduped/</code> — see project memory <code>slides-deduped-is-lossy</code>.\nThe lecture opens by explicitly building on Part 1 (&quot;From Part 1 you know: Word2Vec, GloVe,\nFastText give each word exactly ONE vector, regardless of context&quot; [slide 3]), so this file\nassumes <a class=\"xref\" data-xref-lec=\"sequential-learning-01\" role=\"link\" tabindex=\"0\"><code>sequential-learning-01.md</code></a> has already been read. It closes\nwith an explicit forward pointer to Part 3 (&quot;assembling the Transformer&quot;), so nothing here is a\ncapture gap — the lecture itself stops at self-attention and multi-head attention, by design.</p>\n</blockquote>\n<hr>\n</div><section id=\"sequential-learning-19-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain exactly why a static embedding is insufficient</strong> for a word like &quot;bank,&quot; and describe\nthe architecture (ELMo) that was the field's first fix.</li>\n<li><strong>Derive why RNNs/LSTMs fundamentally cannot parallelize across time</strong>, and quantify how badly\ntheir gradients vanish over a long sequence using the chain rule.</li>\n<li><strong>Draw and explain the encoder-decoder bottleneck</strong> — why compressing an entire sentence into one\nfixed-size vector fails for long inputs, with the empirical BLEU-score evidence.</li>\n<li><strong>Derive the attention mechanism's three-step computation</strong> (score → normalize → aggregate) and\ncompute a full attention output by hand for a 3-token toy example.</li>\n<li><strong>Compare all four standard attention scoring functions</strong> (additive, dot-product, general, scaled\ndot-product) and explain why the field converged on the last one.</li>\n<li><strong>Explain self-attention as attention applied to one sequence</strong>, and state precisely why it fixes\nboth the RNN's parallelism problem and its long-range dependency problem.</li>\n<li><strong>Derive Query/Key/Value from a database-lookup analogy</strong>, and compute Q, K, V from raw token\nembeddings by hand.</li>\n<li><strong>Derive why scaled dot-product attention divides by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math></strong> from a variance argument, not\njust &quot;because the paper says so.&quot;</li>\n<li><strong>Explain multi-head attention as parallel, independent attention computations</strong>, and state what\ndifferent heads empirically specialize in.</li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-19-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — What this lecture assumes about RNNs and LSTMs</h3>\n<p>You do not need the internal gate equations of an LSTM for this lecture (that's assumed background,\nbuilt in an earlier module), but you do need the shape of the problem: an RNN/LSTM processes a\nsequence <strong>one token at a time</strong>, maintaining a running hidden state <math data-tex=\"h_t\"><msub><mi>h</mi><mi>t</mi></msub></math> that summarizes everything\nseen so far. Each new hidden state is computed from the previous one: <math data-tex=\"h_t = f(h_{t-1}, x_t)\"><mrow><msub><mi>h</mi><mi>t</mi></msub><mo>=</mo><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><msub><mi>x</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>. This\nsingle fact — that <math data-tex=\"h_t\"><msub><mi>h</mi><mi>t</mi></msub></math> <em>depends on</em> <math data-tex=\"h_{t-1}\"><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub></math> — is the root cause of every RNN limitation this\nlecture identifies.</p>\n<h3>Prerequisite 2 — Variance, briefly</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Variance</strong> — a measure of how spread out a set of numbers is around their average. If <math data-tex=\"X\"><mi>X</mi></math> has\nmean 0 and variance 1 (&quot;unit variance&quot;), its values typically range over roughly <math data-tex=\"[-2, 2]\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></math>; if its\nvariance were <math data-tex=\"d\"><mi>d</mi></math> instead, its typical range would grow to roughly <math data-tex=\"[-2\\sqrt{d}, 2\\sqrt{d}]\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>2</mn><msqrt><mi>d</mi></msqrt><mo separator=\"true\">,</mo><mn>2</mn><msqrt><mi>d</mi></msqrt><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></math>.</p>\n<p><em>Why it matters here:</em> the derivation for why attention divides by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>) is a direct,\nshort argument about how variance grows when you sum <math data-tex=\"d\"><mi>d</mi></math> independent terms — you need this\ndefinition to follow it, not a full course in probability.</p>\n</blockquote>\n<h3>Prerequisite 3 — Softmax saturation</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Softmax saturation</strong> — when the inputs to a softmax have very different magnitudes, the output\nbecomes extremely &quot;peaked&quot; (close to one-hot: one entry near 1, the rest near 0), and the gradient\nalmost everywhere else becomes vanishingly small.</p>\n<p><em>In everyday words:</em> if one candidate's score is wildly higher than the others, softmax basically\ndeclares a winner with 100% confidence — and once it's that confident, nudging the losing scores up\nor down barely changes anything, so there's almost no gradient signal left to learn from.</p>\n<p><em>Why it exists as a concept here:</em> this is the exact failure that motivates dividing attention\nscores by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a> — without it, raw dot products can grow large enough to saturate the\nsoftmax and stall training.</p>\n</blockquote>\n<h3>Prerequisite 4 — Matrix multiplication as a set of dot products, briefly</h3>\n<p>Q, K, V (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>) are each produced by multiplying a matrix of token embeddings <math data-tex=\"X\"><mi>X</mi></math> by a learned weight\nmatrix (<math data-tex=\"W^Q\"><msup><mi>W</mi><mi>Q</mi></msup></math>, <math data-tex=\"W^K\"><msup><mi>W</mi><mi>K</mi></msup></math>, <math data-tex=\"W^V\"><msup><mi>W</mi><mi>V</mi></msup></math>). All you need: multiplying an <math data-tex=\"n\\times d_{\\text{model}}\"><mrow><mi>n</mi><mo>×</mo><msub><mi>d</mi><mtext>model</mtext></msub></mrow></math> matrix of\ntoken embeddings by a <math data-tex=\"d_{\\text{model}}\\times d_k\"><mrow><msub><mi>d</mi><mtext>model</mtext></msub><mo>×</mo><msub><mi>d</mi><mi>k</mi></msub></mrow></math> weight matrix produces an <math data-tex=\"n\\times d_k\"><mrow><mi>n</mi><mo>×</mo><msub><mi>d</mi><mi>k</mi></msub></mrow></math> matrix —\none new, projected vector per token, each computed as a dot product between that token's original\nembedding and a column of the weight matrix. This is the exact same &quot;embedding = a row of a learned\nmatrix&quot; fact from Part 1's Prerequisite 3, applied three times over (once each for <math data-tex=\"W^Q\"><msup><mi>W</mi><mi>Q</mi></msup></math>, <math data-tex=\"W^K\"><msup><mi>W</mi><mi>K</mi></msup></math>,\n<math data-tex=\"W^V\"><msup><mi>W</mi><mi>V</mi></msup></math>).</p>\n<hr>\n</section><section id=\"sequential-learning-19-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Part 1 answered &quot;how do you turn a word into numbers?&quot; This lecture answers the next question:\n<strong>those numbers were still fixed per word — how do you make a word's representation depend on the\nsentence it's actually in?</strong> The arc is a chain of &quot;here's the fix, but it has a new problem&quot; steps:</p>\n<figure class=\"ascii\"><pre>Static embeddings (Word2Vec/GloVe/FastText)\n   │  problem: &quot;bank&quot; gets ONE vector regardless of context\n   ▼\nELMo — contextual embeddings via a bidirectional LSTM\n   │  problem: still sequential → can't parallelize, gradients still fade over long sequences\n   ▼\nEncoder-Decoder (Seq2Seq) — two RNNs, one reads, one writes\n   │  problem: everything is squeezed through ONE fixed-size &quot;context vector&quot; — the bottleneck\n   ▼\nAttention — decoder looks back at ALL encoder states, weighted by relevance\n   │  problem: attention as introduced here only connects TWO sequences (encoder ↔ decoder);\n   │           it doesn't yet help a single sentence understand itself\n   ▼\nSelf-Attention — the same weighted-lookup idea, but a sequence attends to itself\n   │  fixes: RNN's O(sequence length) path between distant tokens → O(1); and the parallelism problem\n   ▼\nScaled Dot-Product Attention + Multi-Head Attention — the actual mechanism, made numerically stable\n   and given multiple &quot;perspectives&quot; at once\n   │\n   ▼\n[Part 3, not yet covered here] Assembling the Transformer: + positional encoding, layer norm,\nresidual connections, feed-forward layers, masking — then BERT/GPT/T5 as configurations of it</pre></figure>\n<p>Every step in this chain is introduced with the same rhetorical move: name a <em>concrete</em> failure of\nthe previous approach, then show the fix designed specifically to remove it. Track that pattern and\nthe whole lecture becomes predictable.</p>\n<hr>\n</section><section id=\"sequential-learning-19-s3\" data-title=\"The Problem with Static Embeddings\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">The Problem with Static Embeddings</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>The one sentence that reopens the whole problem.</strong> &quot;Word2Vec, GloVe, FastText give each word\nexactly ONE vector, regardless of context&quot; [slide 3]. Two sentences from the deck make this\nconcrete: <em>&quot;I sat by the river bank&quot;</em> vs. <em>&quot;I deposited money at the bank.&quot;</em> <strong>Same word,\ncompletely different meanings, but the same vector</strong> [slide 3].</p>\n</aside>\n<p>The slide's own diagram contrasts this directly: under Word2Vec (static), the single point labeled\n<code>&quot;bank&quot;</code> sits at one fixed location, roughly equidistant from both the <code>river/stream/water</code> cluster\nand the <code>money/loan/deposit</code> cluster — it can't commit to either meaning because it's the same vector\nin every sentence. Under ELMo (contextual), there are <strong>two separate points</strong> — <code>&quot;bank&quot; (river)</code>\nsitting near <code>river/water/stream</code>, and <code>&quot;bank&quot; (financial)</code> sitting near <code>deposit/money/loan</code> [slide\n3] — because ELMo computes a <em>different</em> vector for &quot;bank&quot; depending on the sentence it's in.</p>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>The question the rest of this lecture answers:</strong> <em>&quot;What if the representation could change\nbased on the sentence?&quot;</em> [slide 3]</p>\n</aside>\n<hr>\n</section><section id=\"sequential-learning-19-s4\" data-title=\"ELMo — Embeddings from Language Models\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">ELMo — Embeddings from Language Models</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>ELMo (Embeddings from Language Models)</strong> — Peters et al., 2018. Runs a deep <strong>bidirectional</strong>\nLSTM over the full sentence; the LSTM's hidden states <em>become</em> the word embeddings, so they change\nwith context [slide 6].</p>\n<p><em>In everyday words:</em> instead of looking a word up in a fixed dictionary of vectors, you read the\nwhole sentence with two readers — one going left-to-right, one going right-to-left — and the\nword's representation is built from what both readers currently &quot;know&quot; at that word's position.</p>\n</blockquote>\n<h3>2.1 Architecture, top to bottom [slide 6]</h3>\n<ol>\n<li><strong>Character CNN</strong> for initial embeddings — no fixed vocabulary lookup at all (detailed in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§2.2\" role=\"link\" tabindex=\"0\">§2.2</a>)</li>\n<li><strong>Forward LSTM</strong> (left-to-right) over the sentence</li>\n<li><strong>Backward LSTM</strong> (right-to-left) over the sentence</li>\n<li><strong>Stack 2 layers deep</strong></li>\n<li><strong>Final embedding = weighted sum of all layers</strong></li>\n</ol>\n<figure class=\"ascii\"><pre>Embedding of &quot;stick&quot; in &quot;Let's stick to&quot; — Step #1     [slide 6]\n(Image credit, per the slide's own caption: Jay Alammar, &quot;The Illustrated BERT.&quot;)\n\n           Forward Language Model              Backward Language Model\nLSTM\nLayer #2    ●───▶●───▶●                          ●◀───●◀───●\n              ↑     ↑     ↑                          ↑     ↑     ↑\nLSTM\nLayer #1    ●───▶●───▶●                          ●◀───●◀───●\n              ↑     ↑     ↑                          ↑     ↑     ↑\nEmbedding   [Let's][stick][to]                    [Let's][stick][to]</pre></figure>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why bidirectional matters.</strong> A left-to-right-only reader knows &quot;stick&quot; is\npreceded by &quot;Let's&quot; but has no idea what comes after. A right-to-left-only reader knows the reverse.\nELMo runs <strong>both</strong> and combines them, so the embedding for &quot;stick&quot; reflects the <em>entire</em> sentence —\nboth what came before and what comes after — not just one direction.</p>\n</aside>\n<h3>2.2 Character CNN (Layer 0) — how ELMo handles any word at all</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Character CNN</strong> — before the biLSTM runs, every word is built from its individual characters\nusing convolutional filters, rather than looked up in a fixed vocabulary table [slide 9].</p>\n</blockquote>\n<figure class=\"ascii\"><pre>                     [feeds into biLSTM layers...]\n                              │\n                Character-Level Word Embedding\n                              │\n                        [Concatenate]\n                   ┌──────────┼──────────┐\n                 [max]      [max]      [max]\n                   │           │           │\n             Width-3 Conv Width-4 Conv Width-5 Conv\n                   │           │           │\n             ┌─────┴─────────────────────┴─────┐\n             p   l   a   y   i   n   g   (raw characters, no vocabulary lookup needed)</pre></figure>\n<p>Several convolutional filters of different widths (3, 4, 5 characters) slide over the raw character\nsequence of a word (here &quot;playing&quot;); each filter's outputs are <strong>max-pooled</strong> down to one scalar,\nand all the filters' outputs are concatenated into the character-level word embedding [slide 9].</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is why ELMo handles out-of-vocabulary words.</strong> <em>&quot;No vocabulary needed! Any\nword — even typos or new words — gets a vector. This is why ELMo handles out-of-vocabulary words&quot;</em>\n[slide 9]. Notice this is the exact same structural fix FastText used in <a class=\"xref\" data-xref-lec=\"sequential-learning-01\" data-xref=\"Part 1 §8\" role=\"link\" tabindex=\"0\">Part 1 §8</a> — build a\nword's representation from sub-word pieces (there: character n-grams; here: character convolutions)\nso an unseen word still produces <em>something</em>, rather than nothing.</p>\n</aside>\n<h3>2.3 What Different Layers Capture</h3>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — depth specializes.</strong> Different layers of the stacked biLSTM learn qualitatively\ndifferent things, without being told to [slide 18]:</p>\n</aside>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>Captures</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Layer 0</strong> (character CNN)</td>\n<td>Morphology, word shape (prefix, suffix, capitalization)</td>\n</tr>\n<tr>\n<td><strong>Layer 1</strong> (lower biLSTM)</td>\n<td>Syntax, POS tags, local grammatical structure</td>\n</tr>\n<tr>\n<td><strong>Layer 2</strong> (upper biLSTM)</td>\n<td>Semantics, word sense disambiguation, coreference</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-res\"><p class=\"callout-h\"><span class=\"callout-badge\">🔬</span>Research</p><p><strong>Research opportunity — this finding outlived ELMo itself.</strong> <em>&quot;This insight persists in modern\nLLMs: lower layers = syntax, upper layers = semantics, final layers = task-specific&quot;</em> [slide 18].\nThe specific architecture (a stacked bidirectional LSTM) is now largely obsolete, but the emergent\nproperty — depth specializes from surface form toward meaning — reappears in Transformer-based\nmodels covered in Part 3 onward.</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>ELMo's own limitation, stated directly on the slide.</strong> <em>&quot;Limitation: Still sequential (biLSTM),\nso slow to train&quot;</em> [slide 18]. ELMo fixed the <em>static-vector</em> problem but inherited the <em>sequential\nprocessing</em> problem — which is exactly the problem Part 3 (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> below) develops in full, and which\nattention (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a> onward) is the actual fix for.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-19-0\" data-iv=\"{&quot;type&quot;:&quot;diagram&quot;,&quot;title&quot;:&quot;ELMo's Two Fixes and One Remaining Problem&quot;,&quot;concept&quot;:&quot;Contextual embeddings via bidirectional LSTM, and what they still can't solve&quot;,&quot;control&quot;:&quot;Toggle between \\&quot;Static (Word2Vec)\\&quot; and \\&quot;Contextual (ELMo)\\&quot; views of the same sentence containing \\&quot;bank\\&quot;; separately toggle biLSTM layer 0/1/2 to see which captures morphology vs. syntax vs. semantics&quot;,&quot;observe&quot;:&quot;In contextual mode, \\&quot;bank\\&quot; (river) and \\&quot;bank\\&quot; (financial) separate into two different points; in layer mode, the same word's nearest neighbors shift from spelling-similar words (layer 0) to meaning-similar words (layer 2)&quot;,&quot;insight&quot;:&quot;Fixing \\&quot;one vector per word\\&quot; (contextual embeddings) is orthogonal to fixing \\&quot;sequential processing\\&quot; (still unsolved here) — ELMo only fixes the first&quot;,&quot;fallback&quot;:&quot;The static-vs-contextual comparison in §1 and the layer table above cover the same two points in prose.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · diagram</span>\n      <span class=\"iv-title\">ELMo's Two Fixes and One Remaining Problem</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Contextual embeddings via bidirectional LSTM, and what they still can't solve</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle between \"Static (Word2Vec)\" and \"Contextual (ELMo)\" views of the same sentence containing \"bank\"; separately toggle biLSTM layer 0/1/2 to see which captures morphology vs. syntax vs. semantics</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>In contextual mode, \"bank\" (river) and \"bank\" (financial) separate into two different points; in layer mode, the same word's nearest neighbors shift from spelling-similar words (layer 0) to meaning-similar words (layer 2)</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Fixing \"one vector per word\" (contextual embeddings) is orthogonal to fixing \"sequential processing\" (still unsolved here) — ELMo only fixes the first</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The static-vs-contextual comparison in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a> and the layer table above cover the same two points in prose.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-19-s5\" data-title=\"Why Not Just Use RNNs?\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Why Not Just Use RNNs?</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">6 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Having shown ELMo fixes the <em>static-vector</em> problem, the lecture turns to ELMo's own unfixed\nweakness, in two parts.</p>\n<h3>3.1 The Long-Range Problem [slide 28]</h3>\n<p>Even LSTMs with gates (designed specifically to help information survive longer) suffer from three\ndistinct issues:</p>\n<ol>\n<li><strong>Information fading over long sequences</strong> — token 1's information is diluted by token 50</li>\n<li><strong>Vanishing/exploding gradients</strong> — gradients must flow through <em>every</em> timestep</li>\n<li><strong>No direct connection between distant tokens</strong> — word 1 and word 50 interact <em>only</em> through the\nchain of intermediate hidden states</li>\n</ol>\n<blockquote class=\"aside-quote\">\n<p><strong>Vanishing gradient</strong> — when a gradient, computed via repeated multiplication across many layers\nor timesteps, shrinks toward zero, leaving the network unable to learn from signal that far back.</p>\n<p><em>Why it exists:</em> backpropagation through time multiplies a gradient by (roughly) the recurrent\nweight matrix once per timestep. If that matrix's dominant eigenvalue has magnitude less than 1,\nthe product shrinks geometrically with sequence length.</p>\n</blockquote>\n<p>🧪 <strong>Worked example — the chain rule made explicit</strong> [slide 30]. The interactive demo sets a decay\nfactor <math data-tex=\"|W_h| = 0.70\"><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><mi>|</mi><mo>=</mo><mn>0.70</mn></mrow></math> (i.e. each recurrent step multiplies the signal by a matrix whose dominant\neigenvalue has magnitude <math data-tex=\"0.70 &lt; 1\"><mrow><mn>0.70</mn><mo>&lt;</mo><mn>1</mn></mrow></math>) and traces the gradient of the <em>signal at <math data-tex=\"t=10\"><mrow><mi>t</mi><mo>=</mo><mn>10</mn></mrow></math></em> with respect to\nthe input at <math data-tex=\"t=1\"><mrow><
