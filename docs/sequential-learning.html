            ▼\n                    ┌───────────────────────────────┐\n                    │ Self-attention (§7) applies the │\n                    │ SAME mechanism WITHIN one       │\n                    │ sequence — this is what actually │\n                    │ fixes BOTH of §3's flaws:        │\n                    │  • O(1) path length (no chain)   │\n                    │  • fully parallel (no h_t→h_t+1) │\n                    └────────────┬────────────────────┘\n                                 │\n                    ┌────────────┴────────────────────┐\n                    ▼                                  ▼\n        Scaled Dot-Product (§9)              Multi-Head (§10)\n        makes ONE attention computation      runs SEVERAL attention\n        numerically stable as d_k grows      computations in parallel,\n        (÷√d_k keeps softmax's gradient      each free to specialize\n        alive)                               (positional/syntactic/\n                                              coreference/semantic)\n                                 │\n                                 ▼\n                    [Part 3] + positional encoding, layer norm,\n                    residual connections, feed-forward layers,\n                    masked attention → the full Transformer</pre></figure>\n<p>Three threads run through this lecture:</p>\n<ol>\n<li><strong>Every architecture here is introduced by first naming a concrete failure of the one before it,\nwith a specific, checkable piece of evidence</strong> — a diagram of &quot;bank&quot; sitting at one ambiguous\npoint (static embeddings), a <math data-tex=\"0.70^9\\approx0.04\"><mrow><msup><mn>0.70</mn><mn>9</mn></msup><mo>≈</mo><mn>0.04</mn></mrow></math> gradient-decay calculation (RNN/LSTM),\nBLEU scores dropping past 20 tokens (bottleneck), a softmax entropy of 0.00 (unscaled dot-product).\nNone of these fixes are motivated by &quot;this is just how it's done&quot; — each has a named, demonstrated\nproblem it solves.</li>\n<li><strong>Attention between two sequences and self-attention within one sequence are the same formula</strong>\n(<math data-tex=\"\\text{softmax}(\\text{scaled scores})\\cdot V\"><mrow><mtext>softmax</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>scaled scores</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mi>V</mi></mrow></math>) applied to different inputs — <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.4\" role=\"link\" tabindex=\"0\">§6.4</a>'s explicit\npivot (&quot;this only helps BETWEEN two sequences... apply the same idea, but a sequence attends to\nitself&quot;) is the moment this lecture makes that identity unmistakable.</li>\n<li><strong>&quot;Optimization of the same mechanism&quot; vs. &quot;a genuinely different mechanism&quot; is a distinction the\nlecture draws explicitly in its closing section</strong> — Flash Attention/GQA/MLA are the former, Mamba/\nSSMs are the latter — modeling good practice for evaluating any future &quot;new attention variant&quot; you\nencounter: is it the same softmax-weighted-sum computed more efficiently, or something else?</li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-19-s15\" data-title=\"Interview prep — Amazon Applied Scientist\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Interview prep — Amazon Applied Scientist</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">15 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s15\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Core questions</h3>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why does a static embedding fail on the word \"bank,\" and what specifically does ELMo change to fix it?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>A static embedding (Word2Vec/GloVe/FastText) assigns exactly one fixed vector to &quot;bank&quot; regardless of\nsentence, so &quot;river bank&quot; and &quot;savings bank&quot; get the identical vector despite meaning different\nthings. ELMo instead computes the word's representation as the hidden state of a deep bidirectional\nLSTM run over the <em>whole</em> sentence — since the hidden state at &quot;bank&quot; depends on every other word in\nthat specific sentence, &quot;bank&quot; gets a different vector in each context.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive, roughly, how much gradient signal survives after 9 timesteps in an RNN with recurrent weight magnitude 0.70.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Backpropagation through time multiplies the gradient by (roughly) the recurrent weight matrix once\nper timestep, so after 9 steps the gradient magnitude is scaled by <math data-tex=\"0.70^9 \\approx 0.040\"><mrow><msup><mn>0.70</mn><mn>9</mn></msup><mo>≈</mo><mn>0.040</mn></mrow></math> — about 4%\nof its original size survives. This is a direct consequence of chaining <math data-tex=\"n\"><mi>n</mi></math> multiplications by a\nfactor less than 1, and it's why very early tokens in a long sequence get almost no learning signal\nfrom errors made many steps later.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Why can't an RNN's training be parallelized across time steps, and does this affect inference too?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><math data-tex=\"h_t\"><msub><mi>h</mi><mi>t</mi></msub></math> is defined in terms of <math data-tex=\"h_{t-1}\"><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub></math>, so computing <math data-tex=\"h_{50}\"><msub><mi>h</mi><mn>50</mn></msub></math> strictly requires <math data-tex=\"h_{49}\"><msub><mi>h</mi><mn>49</mn></msub></math> to already\nexist — there's no way to compute both simultaneously. This affects both training (backprop through\ntime inherits the same dependency chain) and inference (generation is inherently step-by-step for an\nRNN) — though for a Transformer specifically, it's <em>training</em> where full parallelism is the big win,\nsince autoregressive generation at inference is still sequential token-by-token regardless of\narchitecture.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What exactly is compressed in the encoder-decoder bottleneck, and why does it get worse for longer sentences specifically?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>The encoder reduces the entire input sequence to a single fixed-size vector (e.g. 512 floats), and\nthe decoder must reconstruct the whole output from only that vector. A 5-word sentence and a 50-word\nparagraph get compressed into the same-sized vector, so the <em>information per input token</em> that\nsurvives into the context vector shrinks as the sentence grows — there's simply less room per token\nto store what mattered, which is why BLEU scores empirically drop sharply past ~20 tokens.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Walk through attention's three-step computation and explain what changes between step 1 (score) and a plain dot-product similarity search.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>(1) Score: compute how relevant each encoder state <math data-tex=\"h_i\"><msub><mi>h</mi><mi>i</mi></msub></math> is to the current decoder state <math data-tex=\"s_t\"><msub><mi>s</mi><mi>t</mi></msub></math>, via\nsome scoring function (e.g. dot-product <math data-tex=\"s_t^\\top h_i\"><mrow><msubsup><mi>s</mi><mi>t</mi><mi class=\"tml-sml-pad\">⊤</mi></msubsup><msub><mi>h</mi><mi>i</mi></msub></mrow></math>). (2) Normalize: pass all the scores at this\ndecoder step through a softmax so they form a proper probability distribution summing to 1. (3)\nAggregate: take the weighted sum of the encoder states using those normalized weights, producing a\nper-step context vector. The difference from plain similarity search is step 2 — softmax turns raw\nsimilarity scores into a <em>distribution</em> used for a weighted average, rather than picking a single\nbest match.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What specifically distinguishes self-attention from the encoder-decoder attention introduced earlier in the lecture?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>They use the identical score→normalize→aggregate mechanism; the difference is entirely in <em>where Q,\nK, and V come from</em>. In encoder-decoder attention, the queries come from the decoder and the keys/\nvalues come from the encoder — two different sequences. In self-attention, Q, K, and V are all\nprojections of the <em>same</em> sequence — every token attends to every other token (including itself)\nwithin one sentence.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Derive why scaled dot-product attention divides by √d_k.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>If the entries of <math data-tex=\"q\"><mi>q</mi></math> and <math data-tex=\"k\"><mi>k</mi></math> are independent with unit variance, their dot product <math data-tex=\"q\\cdot k\"><mrow><mi>q</mi><mo>⋅</mo><mi>k</mi></mrow></math> sums\n<math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> independent unit-variance terms, giving the dot product a variance of <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> (not 1). As <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math>\ngrows, this makes the raw scores grow in typical magnitude, which saturates the softmax (drives it\ntoward a near-one-hot output) and kills the gradient almost everywhere. Dividing every score by\n<math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> rescales the variance back down to exactly 1, keeping the softmax's output — and its\ngradient — well-behaved regardless of <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math>.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">What is Query, Key, and Value each computed from, and why does the lecture use a database analogy?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><math data-tex=\"Q=XW^Q\"><mrow><mi>Q</mi><mo>=</mo><mi>X</mi><msup><mi>W</mi><mi>Q</mi></msup></mrow></math>, <math data-tex=\"K=XW^K\"><mrow><mi>K</mi><mo>=</mo><mi>X</mi><msup><mi>W</mi><mi>K</mi></msup></mrow></math>, <math data-tex=\"V=XW^V\"><mrow><mi>V</mi><mo>=</mo><mi>X</mi><msup><mi>W</mi><mi>V</mi></msup></mrow></math> — three separate learned linear projections of the same input token\nembeddings <math data-tex=\"X\"><mi>X</mi></math>. The database analogy: Q is your search query (&quot;what am I looking for&quot;), K is the\nindex each stored item advertises itself under (&quot;what do I contain&quot;), and V is the actual content\nretrieved once a query matches a key well (&quot;what do I give when matched&quot;). The analogy is apt because\nthe attention score is literally computed as a similarity between Q and K, and the <em>output</em> is built\nonly from V — matching and retrieving are structurally separated.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Explain, using the \"the animal didn't cross the street because it was too tired\" example, exactly why self-attention solves a problem that plain RNN-based encoder-decoder attention (§6) does not.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Encoder-decoder attention (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>) lets a decoder look back at all encoder states — but the encoder\nitself is still a sequential RNN, so <em>within</em> the source sentence, connecting &quot;it&quot; to &quot;animal&quot; still\nrequires the RNN to pass information through every intervening timestep (6 sequential steps in this\nexample), inheriting the vanishing-gradient and no-parallelism problems from <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>. Self-attention\ninstead lets &quot;it,&quot; as a token in the sequence, directly compute a similarity score against every\nother token — including &quot;animal&quot; — in a single matrix operation, with no dependency chain at all.\nThe path length from &quot;it&quot; to &quot;animal&quot; drops from <math data-tex=\"O(\\text{distance})\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>distance</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> to <math data-tex=\"O(1)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] Why does multi-head attention split d_model into h smaller heads rather than just running the same-size attention h separate times?</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>Running <math data-tex=\"h\"><mi>h</mi></math> full-size (<math data-tex=\"d_{\\text{model}}\"><msub><mi>d</mi><mtext>model</mtext></msub></math>-dimensional) attention computations in parallel would cost\n<math data-tex=\"h\\times\"><mrow><mi>h</mi><mo>×</mo></mrow></math> the compute of one. Splitting <math data-tex=\"d_{\\text{model}}\"><msub><mi>d</mi><mtext>model</mtext></msub></math> into <math data-tex=\"h\"><mi>h</mi></math> heads of size $d_k=d_v=\nd_{\\text{model}}/h$ instead keeps the <em>total</em> compute equal to one full-size attention computation\n(the standard example: <math data-tex=\"512 = 8\\times 64\"><mrow><mn>512</mn><mo>=</mo><mn>8</mn><mo>×</mo><mn>64</mn></mrow></math>), while still giving the model <math data-tex=\"h\"><mi>h</mi></math> independent\nQ/K/V projections that can each specialize in a different kind of relationship (positional,\nsyntactic, coreference, semantic) — more representational diversity at the same total cost, not at a\nmultiplied cost.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">[Combines concepts] A colleague claims Flash Attention and Mamba/SSMs are \"both just ways to make attention faster.\" Correct this.</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p>They're in different categories. Flash Attention computes the <em>exact same</em> mathematical function —\nsoftmax-weighted aggregation of values via scaled dot-product attention — just with an IO-aware\nimplementation that reduces memory movement, giving a 2-4× speedup with no change to the underlying\nmath or the model's outputs. Mamba/SSMs are a genuinely <em>different</em> sequence-modeling mechanism with\nno attention computation at all (an <math data-tex=\"O(n)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> state-space model), trading away attention's explicit\npairwise token comparisons for a different way of propagating sequence information. One is an\nengineering optimization of a fixed algorithm; the other is a different algorithm.</p>\n\n        <div class=\"rate\" role=\"group\" aria-label=\"How well did you know this?\">\n          <button type=\"button\" class=\"rate-b\" data-r=\"1\">Got it</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"2\">Shaky</button>\n          <button type=\"button\" class=\"rate-b\" data-r=\"3\">No idea</button>\n        </div>\n      </div></div>\n<h3>Depth probes</h3>\n<ul>\n<li><em>&quot;Why does the LSTM's cell-state path mitigate vanishing gradients but not eliminate them, per the\ndemo's own conclusion?&quot;</em> — the cell state update (<math data-tex=\"c_t = f\\odot c_{t-1} + i\\odot g\"><mrow><msub><mi>c</mi><mi>t</mi></msub><mo>=</mo><mi>f</mi><mo>⊙</mo><msub><mi>c</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>+</mo><mi>i</mi><mo>⊙</mo><mi>g</mi></mrow></math>) replaces\nrepeated <em>multiplication</em> with <em>addition</em>, which doesn't shrink geometrically the way repeated\nmultiplication by a sub-unit factor does — but the forget gate <math data-tex=\"f\"><mi>f</mi></math> is still a value that can itself\npush toward 0 over many steps under certain learned parameters, and gradients still flow through\nevery intermediate timestep's computation graph, so the underlying &quot;many sequential steps&quot; problem\nisn't structurally removed, just softened.</li>\n<li><em>&quot;If multi-head attention costs the same total compute as one big head, why not just use one huge\nhead?&quot;</em> — the <em>compute</em> is equal, but the <em>representational</em> capacity differs: one head can only\nexpress a single learned notion of &quot;relevance&quot; per query-key comparison, while <math data-tex=\"h\"><mi>h</mi></math> independent\nheads, each with their own learned <math data-tex=\"W^Q_i, W^K_i, W^V_i\"><mrow><msubsup><mi>W</mi><mi>i</mi><mi>Q</mi></msubsup><mo separator=\"true\">,</mo><msubsup><mi>W</mi><mi>i</mi><mi>K</mi></msubsup><mo separator=\"true\">,</mo><msubsup><mi>W</mi><mi>i</mi><mi>V</mi></msubsup></mrow></math>, can each converge on a different\nspecialization (as seen empirically in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§10.1\" role=\"link\" tabindex=\"0\">§10.1</a>) — the split is a capacity/diversity choice, not a\ncompute-saving trick.</li>\n<li><em>&quot;Self-attention is <math data-tex=\"O(1)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> path length between any two tokens — what's the hidden cost that trades\nagainst this?&quot;</em> — computing the full <math data-tex=\"n\\times n\"><mrow><mi>n</mi><mo>×</mo><mi>n</mi></mrow></math> score matrix costs <math data-tex=\"O(n^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> in both compute and\nmemory, growing quadratically with sequence length; this is exactly the cost Flash Attention,\nsliding-window attention, and ultimately Mamba/SSMs (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>) are each responding to in a different way.</li>\n</ul>\n<h3>Whiteboard-ready derivations</h3>\n<ol>\n<li><strong>Vanishing gradient magnitude after <math data-tex=\"n\"><mi>n</mi></math> steps</strong> — with recurrent weight magnitude <math data-tex=\"|W_h| &lt; 1\"><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><mi>|</mi><mo>&lt;</mo><mn>1</mn></mrow></math>,\nthe gradient after <math data-tex=\"n\"><mi>n</mi></math> repeated multiplications is <math data-tex=\"|W_h|^n\"><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><msup><mi>|</mi><mi>n</mi></msup></mrow></math>; e.g. <math data-tex=\"0.70^9\\approx0.040\"><mrow><msup><mn>0.70</mn><mn>9</mn></msup><mo>≈</mo><mn>0.040</mn></mrow></math> (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>).</li>\n<li><strong>Why <math data-tex=\"\\text{Var}(q\\cdot k) = d_k\"><mrow><mtext>Var</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>q</mi><mo>⋅</mo><mi>k</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>d</mi><mi>k</mi></msub></mrow></math></strong> — for independent, unit-variance components <math data-tex=\"q_i, k_i\"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo separator=\"true\">,</mo><msub><mi>k</mi><mi>i</mi></msub></mrow></math>, the\ndot product <math data-tex=\"q\\cdot k = \\sum_{i=1}^{d_k} q_i k_i\"><mrow><mi>q</mi><mo>⋅</mo><mi>k</mi><mo>=</mo><msubsup><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><msub><mi>d</mi><mi>k</mi></msub></msubsup><msub><mi>q</mi><mi>i</mi></msub><msub><mi>k</mi><mi>i</mi></msub></mrow></math> sums <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> independent terms, each contributing\nvariance 1 to the sum (since <math data-tex=\"\\text{Var}(q_i k_i)=1\"><mrow><mtext>Var</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>q</mi><mi>i</mi></msub><msub><mi>k</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>1</mn></mrow></math> under these assumptions), giving total\nvariance <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math>; dividing the score by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> therefore divides the variance by <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math>,\nrestoring it to 1 (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>).</li>\n<li><strong>A full attention output computed by hand</strong> — reproduce <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§8\" role=\"link\" tabindex=\"0\">§8</a>'s 6-step derivation (embeddings →\nproject to Q/K/V → score → scale → softmax → weighted sum) for the &quot;I am happy&quot; toy example,\nending in the same <math data-tex=\"\\mathbf{o}_1=[0.28,1.00]\"><mrow><msub><mi>𝐨</mi><mn>1</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0.28,1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, <math data-tex=\"\\mathbf{o}_2=[1.72,1.00]\"><mrow><msub><mi>𝐨</mi><mn>2</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1.72,1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, <math data-tex=\"\\mathbf{o}_3=[1.00,1.00]\"><mrow><msub><mi>𝐨</mi><mn>3</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1.00,1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>.</li>\n</ol>\n<h3>Applied scenario — Amazon customer review summarization</h3>\n<p><strong>Framing:</strong> Amazon wants to generate a short, faithful summary of a product's thousands of customer\nreviews, surfaced on the product detail page.</p>\n<p><strong>Data:</strong> Variable-length customer review text (from a few words to several paragraphs), at massive\nscale across millions of products.</p>\n<p><strong>Model:</strong> This is exactly the encoder-decoder Seq2Seq setting (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>) — input: concatenated/aggregated\nreview text; output: a short summary — but the input can be <em>very</em> long (thousands of reviews), which\nis precisely where <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s bottleneck problem would be most damaging: a single fixed-size context vector\ncannot faithfully represent thousands of reviews' worth of information. This motivates attention (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>)\nat minimum, and in practice a full Transformer encoder-decoder (self-attention throughout, per <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>-<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)\nso the model can directly relate any review sentence to any other, regardless of position, without\nthe RNN's sequential-distance penalty.</p>\n<p><strong>Metric:</strong> Not just BLEU/ROUGE against reference summaries — critically, <strong>faithfulness</strong> (does the\nsummary state anything not supported by the reviews?) and <strong>coverage</strong> (does it reflect the actual\ndistribution of opinions, not just the most verbose review?), since a hallucinated but fluent summary\nis worse than a slightly awkward faithful one for a customer-facing feature.</p>\n<p><strong>Failure modes:</strong> The <math data-tex=\"O(n^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> cost of full self-attention (flagged as a depth probe above) becomes\na real constraint at &quot;thousands of reviews&quot; scale — this is exactly why <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>'s efficiency techniques\n(sliding-window attention, or a two-stage architecture that first clusters/samples reviews before a\nfull-attention pass) matter operationally, not just academically. A model relying on one head's\nlearned coreference resolution could also mis-resolve a pronoun across review boundaries if reviews\nare concatenated without clear separators.</p>\n<p><strong>What you'd ship:</strong> An encoder-decoder Transformer (or, in practice, a pretrained LLM used in a\nsummarization configuration — the direct target of Part 3's &quot;BERT, GPT, T5 are just configurations of\nthis architecture&quot; [slide 136]) with an efficient-attention variant for the long-input encoder side,\nevaluated on faithfulness/coverage metrics with human spot-checks, not automatic metrics alone.</p>\n<p><strong>Leadership Principle tie-in:</strong> <strong>Customer Obsession</strong> — a summarization feature that hallucinates\na product claim not actually supported by reviews directly harms customer trust, which is exactly why\nfaithfulness has to be a first-class metric, not an afterthought to fluency. <strong>Dive Deep</strong> — diagnosing\n<em>why</em> a long-review-set summary degrades (bottleneck vs. quadratic-attention memory limits vs.\ncoreference errors across review boundaries) requires distinguishing the specific mechanisms this\nlecture built, not treating &quot;the model got confused&quot; as a sufficient explanation.</p>\n<hr>\n</section><section id=\"sequential-learning-19-s16\" data-title=\"Glossary\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Glossary</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s16\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ul>\n<li><strong>Additive (Bahdanau) attention</strong> — scoring function using a small learned feedforward network:\n<math data-tex=\"\\mathbf{v}^\\top\\tanh(\\mathbf{W}_1\\mathbf{s}+\\mathbf{W}_2\\mathbf{h})\"><mrow><msup><mi>𝐯</mi><mi>⊤</mi></msup><mrow><mi>tanh</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>𝐖</mi><mn>1</mn></msub><mi>𝐬</mi><mo>+</mo><msub><mi>𝐖</mi><mn>2</mn></msub><mi>𝐡</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>.</li>\n<li><strong>Attention</strong> — computing a weighted sum over a set of states, with weights determined by learned\nrelevance to a query.</li>\n<li><strong>Bottleneck problem</strong> — the failure mode of compressing an entire input sequence into one\nfixed-size vector; degrades with input length.</li>\n<li><strong>Character CNN</strong> — convolutional filters over raw characters, producing a word embedding with no\nfixed vocabulary lookup; ELMo's Layer 0.</li>\n<li><strong>Context vector</strong> — in plain Seq2Seq, the single fixed-size encoder output the decoder reads; in\nattention, a per-decoder-step weighted sum <math data-tex=\"\\mathbf{c}_t\"><msub><mi>𝐜</mi><mi>t</mi></msub></math> instead.</li>\n<li><strong>Dot-Product (Luong) attention</strong> — scoring function <math data-tex=\"\\mathbf{s}^\\top\\mathbf{h}\"><mrow><msup><mi>𝐬</mi><mi>⊤</mi></msup><mi>𝐡</mi></mrow></math>, no extra learned\nparameters.</li>\n<li><strong>ELMo</strong> — Embeddings from Language Models (Peters et al., 2018); contextual embeddings from a deep\nbidirectional LSTM.</li>\n<li><strong>Encoder-Decoder (Seq2Seq)</strong> — two RNNs: one reads the input to a context vector, one generates\noutput from it.</li>\n<li><strong>Flash Attention</strong> — an IO-aware implementation of the same scaled dot-product attention\ncomputation, 2–4× faster, mathematically identical output.</li>\n<li><strong>General (Luong) attention</strong> — scoring function <math data-tex=\"\\mathbf{s}^\\top\\mathbf{W}\\mathbf{h}\"><mrow><msup><mi>𝐬</mi><mi>⊤</mi></msup><mi>𝐖</mi><mi>𝐡</mi></mrow></math>, one learned\nmatrix.</li>\n<li><strong>GQA (Grouped Query Attention)</strong> — inference-memory optimization where groups of query heads share\nKey/Value projections.</li>\n<li><strong>Key (K)</strong> — a token's learned &quot;what do I contain&quot; projection; matched against queries.</li>\n<li><strong>Mamba / SSMs (State Space Models)</strong> — a non-attention sequence architecture, <math data-tex=\"O(n)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> in sequence\nlength.</li>\n<li><strong>MLA (Multi-head Latent Attention)</strong> — inference-memory optimization compressing Key/Value into a\nlow-rank representation.</li>\n<li><strong>Multi-head attention</strong> — running <math data-tex=\"h\"><mi>h</mi></math> independent attention computations in parallel (each with\nits own Q/K/V projections), then concatenating and projecting.</li>\n<li><strong>Query (Q)</strong> — a token's learned &quot;what am I looking for&quot; projection.</li>\n<li><strong>Scaled dot-product attention</strong> — <math data-tex=\"\\text{score}=\\dfrac{\\mathbf{s}^\\top\\mathbf{h}}{\\sqrt{d_k}}\"><mrow><mtext>score</mtext><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>𝐬</mi><mi>⊤</mi></msup><mi>𝐡</mi></mrow><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></mfrac></mstyle></mrow></math>;\nthe dot-product score divided by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> to prevent softmax saturation.</li>\n<li><strong>Self-attention</strong> — attention applied within a single sequence (Q, K, V all from the same input),\nrather than between two different sequences.</li>\n<li><strong>Softmax saturation</strong> — when large-magnitude inputs push a softmax toward a near-one-hot output,\ncollapsing its gradient.</li>\n<li><strong>Value (V)</strong> — a token's learned &quot;what do I give when matched&quot; projection; what's actually\naggregated in the weighted sum.</li>\n<li><strong>Vanishing gradient</strong> — a gradient that shrinks toward zero as it's backpropagated through many\nsequential steps or layers.</li>\n</ul>\n<hr>\n</section><section id=\"sequential-learning-19-s17\" data-title=\"Check yourself\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Check yourself</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s17\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li>Give the specific example sentence this lecture uses to show a static embedding failing, and\nexplain in one sentence why it fails. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§1\" role=\"link\" tabindex=\"0\">§1</a>)</em></li>\n<li>List ELMo's five architectural components in order, and explain what problem the character CNN\n(Layer 0) specifically solves. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>)</em></li>\n<li>Compute <math data-tex=\"0.80^9\"><msup><mn>0.80</mn><mn>9</mn></msup></math> and explain what this number would represent in the RNN vanishing-gradient\ncontext. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>)</em></li>\n<li>Explain the difference between the &quot;long-range problem&quot; and the &quot;parallelism problem&quot; — are they\nthe same failure described twice, or two distinct failures? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>)</em></li>\n<li>Why does the encoder-decoder bottleneck get worse specifically for <em>longer</em> sentences, rather than\nbeing a constant-severity problem? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>)</em></li>\n<li>Write out attention's three-step computation (score, normalize, aggregate) in your own words, then\nin the formulas from <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>)</em></li>\n<li>Name all four attention scoring functions and order them by number of extra learned parameters,\nfewest to most. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>)</em></li>\n<li>What exactly is &quot;still missing&quot; at the end of <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.4\" role=\"link\" tabindex=\"0\">§6.4</a>, and what section fixes it? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.4\" role=\"link\" tabindex=\"0\">§6.4</a>)</em></li>\n<li>Explain the database-lookup analogy for Q, K, V, and state which of the three is used to compute\nthe attention <em>score</em> versus which is used to compute the <em>output</em>. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§7.2\" role=\"link\" tabindex=\"0\">§7.2</a>)</em></li>\n<li>Derive, from a variance argument, why scaled dot-product attention divides by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> rather\nthan by <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> or by some other function of <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math>. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>)</em></li>\n<li>In the multi-head attention formula, what does concatenating <math data-tex=\"h\"><mi>h</mi></math> heads and multiplying by\n<math data-tex=\"\\mathbf{W}^O\"><msup><mi>𝐖</mi><mi>O</mi></msup></math> accomplish, and why is <math data-tex=\"d_k=d_v=d_{\\text{model}}/h\"><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><msub><mi>d</mi><mi>v</mi></msub><mo>=</mo><msub><mi>d</mi><mtext>model</mtext></msub><mi>/</mi><mi>h</mi></mrow></math> chosen specifically? <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>)</em></li>\n<li>Name two of the four head specializations observed empirically, and connect one of them back to\na specific earlier example in this lecture. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§10.1\" role=\"link\" tabindex=\"0\">§10.1</a>)</em></li>\n<li>Explain the distinction the lecture draws between &quot;an optimization of attention&quot; and &quot;a different\nmechanism than attention,&quot; and classify Flash Attention, GQA, and Mamba/SSMs accordingly. <em>(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>)</em></li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-19-s18\" data-title=\"Going deeper\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Going deeper</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s18\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Peters et al. (2018), &quot;Deep contextualized word representations&quot;</strong> — the original ELMo paper,\ncited by name and year directly on the lecture's own slides [slide 6]. <code>solid</code> · primary source\nfor <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§2\" role=\"link\" tabindex=\"0\">§2</a>.</li>\n<li><strong>Bahdanau, Cho, Bengio (2014/2015), &quot;Neural Machine Translation by Jointly Learning to Align and\nTranslate&quot;</strong> — the original additive-attention paper; named directly in the scoring-functions\ncomparison [slide 62]. <code>solid</code> · primary source for <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>'s additive scoring function.</li>\n<li><strong>Luong, Pham, Manning (2015), &quot;Effective Approaches to Attention-based Neural Machine\nTranslation&quot;</strong> — introduces dot-product and general attention, named directly [slide 62]. <code>solid</code>\n· primary source for the other two scoring functions in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.3\" role=\"link\" tabindex=\"0\">§6.3</a>.</li>\n<li><strong>Vaswani et al. (2017), &quot;Attention Is All You Need&quot;</strong> — the Transformer paper; named directly on\nthe evolution timeline [slide 133] as the point where scaled dot-product and multi-head attention\n(<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a>-<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>) were introduced together as a complete architecture. <code>solid</code> · essential — this is where\nPart 3 of this course picks up.</li>\n<li><strong>Jay Alammar, &quot;The Illustrated Transformer&quot;</strong> — a widely used visual walkthrough of exactly the\nQ/K/V mechanism and multi-head splitting diagrammed in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>; the multi-head diagram in this lecture\n[slide 129] is itself in this illustration's style. <code>intro</code> · read before Part 3.</li>\n<li><strong>Dao et al., &quot;FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness&quot;</strong> —\nnamed directly in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a>'s evolution timeline as the 2022 entry. <code>hard</code> · for understanding <em>why</em>\nattention is memory-bound in practice, beyond this lecture's scope.</li>\n<li><strong>Gu &amp; Dao, &quot;Mamba: Linear-Time Sequence Modeling with Selective State Spaces&quot;</strong> — named directly\nin <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§11\" role=\"link\" tabindex=\"0\">§11</a> as the non-attention alternative on the evolution timeline. <code>hard</code> · genuinely different\nmechanism from everything else in this lecture; read only after the attention material is solid.</li>\n</ol>\n<blockquote class=\"aside-quote\">\n<p><strong>Externally verified</strong> (module enhancement pass, 2026-08-30) — author lists, titles, and years for\n#1–7 above checked against primary listings and confirmed exact: Peters, Neumann, Iyyer, Gardner,\nClark, Lee &amp; Zettlemoyer, NAACL 2018 (ELMo); Bahdanau, Cho &amp; Bengio, arXiv Sept 2014 / ICLR May\n2015; Luong, Pham &amp; Manning, EMNLP 2015; Vaswani et al., NeurIPS 2017 (Transformer); Dao, Fu,\nErmon, Rudra &amp; Ré, NeurIPS 2022 (FlashAttention); Gu &amp; Dao, arXiv Dec 2023 (Mamba). The lecture's\nown slides gave author-surname-plus-year citations only [slides 6, 62, 133] — the fuller detail\nabove comes from this external check, not from the slides themselves.</p>\n</blockquote>\n</section>","sections":[{"id":"sequential-learning-19-s0","num":"","title":"What you'll understand after reading this","mins":1,"kind":"content","part":""},{"id":"sequential-learning-19-s1","num":"","title":"Before we start: what you need to know","mins":3,"kind":"content","part":""},{"id":"sequential-learning-19-s2","num":"","title":"The big picture","mins":2,"kind":"content","part":""},{"id":"sequential-learning-19-s3","num":"1","title":"The Problem with Static Embeddings","mins":1,"kind":"content","part":""},{"id":"sequential-learning-19-s4","num":"2","title":"ELMo — Embeddings from Language Models","mins":6,"kind":"content","part":""},{"id":"sequential-learning-19-s5","num":"3","title":"Why Not Just Use RNNs?","mins":6,"kind":"content","part":""},{"id":"sequential-learning-19-s6","num":"4","title":"Encoder-Decoder Architecture (Seq2Seq)","mins":1,"kind":"content","part":""},{"id":"sequential-learning-19-s7","num":"5","title":"The Bottleneck Problem","mins":2,"kind":"content","part":""},{"id":"sequential-learning-19-s8","num":"6","title":"Attention Mechanism","mins":5,"kind":"content","part":""},{"id":"sequential-learning-19-s9","num":"7","title":"Self-Attention","mins":4,"kind":"content","part":""},{"id":"sequential-learning-19-s10","num":"8","title":"Attention Computation, Worked in Full","mins":4,"kind":"content","part":""},{"id":"sequential-learning-19-s11","num":"9","title":"Scaled Dot-Product Attention — deriving the dk","mins":3,"kind":"content","part":""},{"id":"sequential-learning-19-s12","num":"10","title":"Multi-Head Attention","mins":3,"kind":"content","part":""},{"id":"sequential-learning-19-s13","num":"11","title":"Attention Is Still Evolving","mins":2,"kind":"content","part":""},{"id":"sequential-learning-19-s14","num":"","title":"Putting it together","mins":3,"kind":"back","part":""},{"id":"sequential-learning-19-s15","num":"","title":"Interview prep — Amazon Applied Scientist","mins":15,"kind":"back","part":""},{"id":"sequential-learning-19-s16","num":"","title":"Glossary","mins":3,"kind":"back","part":""},{"id":"sequential-learning-19-s17","num":"","title":"Check yourself","mins":2,"kind":"back","part":""},{"id":"sequential-learning-19-s18","num":"","title":"Going deeper","mins":3,"kind":"back","part":""}],"interactiveCount":6},{"id":"sequential-learning-20","num":"20","file":"sequential-learning-03","kind":"lecture","title":"Sequential Learning — Part 3: Subword Tokenization, the Transformer, and Language Models","h1":"Sequential Learning — Part 3: Tokenizers, Transformers, and Language Models","subtitle":"Subword Tokenization, the Transformer, and Language Models","spineLabel":"Part 3","short":"Subword Tokenization, the Transformer, and Language Models","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Instructor: <strong>Ahmed Sanin MV</strong> (different instructor from Parts 1–2; a different, more code-heavy,\ninteractive-demo-driven deck style). Runtime ~1:03:45. Built from the raw capture in\n<code>output/Lecture_20 - Module 6 Sequential Learning Part 3/</code> (160 raw frames), not <code>slides_deduped/</code>\n— see project memory <code>slides-deduped-is-lossy</code>. The deck is organized into three explicit,\nnavigable tabs — <strong>1 Sub-word Tokenization, 2 Transformer Architecture, 3 Language Models</strong> — and\nthis file follows that structure. It closes with a hands-on notebook (text classification,\nfrom-scratch vs. pre-trained), which this file summarizes rather than reproduces line-by-line.</p>\n</blockquote>\n<hr>\n</div><section id=\"sequential-learning-20-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Explain why word-level and character-level tokenization both fail</strong>, and derive subword\ntokenization as the engineered middle ground between them.</li>\n<li><strong>Run BPE, WordPiece, and Unigram/SentencePiece by hand</strong> on a small corpus, and explain precisely\nhow each one's <em>selection rule</em> differs, even though all three share the same &quot;keep merging/keep\nsplitting&quot; outer loop.</li>\n<li><strong>Derive the positional encoding problem</strong> — why attention alone is a bag-of-tokens operation —\nand compare sinusoidal, learned, and relative (RoPE/ALiBi) position schemes.</li>\n<li><strong>Assemble a full Transformer block from its five components</strong> (attention, add &amp; norm,\nfeed-forward, add &amp; norm) and explain what each component contributes.</li>\n<li><strong>Compute causal masking by hand</strong>, and explain precisely why a decoder must never see future\ntokens during training, not just at inference.</li>\n<li><strong>Distinguish encoder-only, decoder-only, and encoder-decoder architectures</strong> by their attention\npattern, pre-training objective, and adaptation method — and name BERT, GPT, and T5 as concrete\ninstances of each.</li>\n<li><strong>Derive BERT's masked-language-model objective</strong>, including the 80/10/10 trick, and explain\nexactly what problem that trick solves.</li>\n<li><strong>Explain GPT's autoregressive objective and next-token prediction head</strong>, and compute a sampling\ndecision by hand under greedy, temperature, top-k, and top-p strategies.</li>\n<li><strong>Order the parameter-efficient fine-tuning ladder</strong> (full fine-tuning → adapters → LoRA → QLoRA)\nby what each step fixes about the one before it.</li>\n<li><strong>State, with a real number, how much pre-training actually buys you</strong> on a downstream task.</li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-20-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — What this lecture assumes from Parts 1–2</h3>\n<p>This lecture assumes self-attention, scaled dot-product attention, and multi-head attention\n(all derived from scratch in <a class=\"xref\" data-xref-lec=\"sequential-learning-02\" role=\"link\" tabindex=\"0\"><code>sequential-learning-02.md</code></a> <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a>–<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§10\" role=\"link\" tabindex=\"0\">§10</a>) as\nsettled background. It does not re-derive <math data-tex=\"\\text{Attention}(Q,K,V)=\\text{softmax}(QK^\\top/\\sqrt{d_k})V\"><mrow><mtext>Attention</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Q</mi><mo separator=\"true\">,</mo><mi>K</mi><mo separator=\"true\">,</mo><mi>V</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>softmax</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>Q</mi><msup><mi>K</mi><mi class=\"tml-sml-pad\">⊤</mi></msup><mi>/</mi><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>V</mi></mrow></math>\nfrom first principles — it uses it immediately as a building block. If any of that formula feels\nunfamiliar, read Part 2 first.</p>\n<h3>Prerequisite 2 — Notation this lecture fixes and reuses throughout</h3>\n<p>The lecture explicitly names a small vocabulary of symbols used in every remaining slide [slide 48]:</p>\n<div class=\"table-wrap symtab\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"n\"><mi>n</mi></math></td>\n<td>number of tokens in the sequence</td>\n</tr>\n<tr>\n<td><math data-tex=\"d\"><mi>d</mi></math></td>\n<td>size of each token vector (<math data-tex=\"d_{\\text{model}}\"><msub><mi>d</mi><mtext>model</mtext></msub></math>)</td>\n</tr>\n<tr>\n<td><math data-tex=\"h\"><mi>h</mi></math></td>\n<td>number of attention heads</td>\n</tr>\n<tr>\n<td><math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math></td>\n<td>size of each head's vectors, <math data-tex=\"d/h\"><mrow><mi>d</mi><mi>/</mi><mi>h</mi></mrow></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"d_{ff}\"><msub><mi>d</mi><mrow><mi>f</mi><mi>f</mi></mrow></msub></math></td>\n<td>hidden width of the feed-forward layer (often <math data-tex=\"4d\"><mrow><mn>4</mn><mi>d</mi></mrow></math>)</td>\n</tr>\n<tr>\n<td><math data-tex=\"N\"><mi>N</mi></math></td>\n<td>how many transformer blocks are stacked</td>\n</tr>\n<tr>\n<td><math data-tex=\"V\"><mi>V</mi></math></td>\n<td>vocabulary size</td>\n</tr>\n</tbody>\n</table></div>\n<p>Its running toy example throughout the Transformer Architecture section uses tiny numbers so every\nmatrix fits on screen: <math data-tex=\"n=3\"><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow></math> (tokens &quot;the&quot;, &quot;cat&quot;, &quot;sat&quot;), <math data-tex=\"d=4\"><mrow><mi>d</mi><mo>=</mo><mn>4</mn></mrow></math>, <math data-tex=\"h=2\"><mrow><mi>h</mi><mo>=</mo><mn>2</mn></mrow></math>, <math data-tex=\"d_k=2\"><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><mn>2</mn></mrow></math>, <math data-tex=\"d_{ff}=8\"><mrow><msub><mi>d</mi><mrow><mi>f</mi><mi>f</mi></mrow></msub><mo>=</mo><mn>8</mn></mrow></math>, <math data-tex=\"N=6\"><mrow><mi>N</mi><mo>=</mo><mn>6</mn></mrow></math>\n[slide 48]. <em>&quot;Real models are far larger (d in the thousands, N in the dozens), but the wiring is\nidentical&quot;</em> [slide 48] — the toy numbers are a teaching device, not a claim about real model sizes.</p>\n<h3>Prerequisite 3 — LayerNorm, briefly</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>LayerNorm (Layer Normalization)</strong> — rescales a single vector so its components have mean 0 and\nunit variance, then applies a learned scale and shift.</p>\n<p><em>Why it matters here:</em> the Transformer block (<a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>) applies LayerNorm after every residual addition\n(&quot;Add &amp; Norm&quot;). You don't need its formula derived to follow this lecture — just that it's a\nper-vector rescaling step that keeps values in a stable numeric range as they pass through many\nstacked blocks, distinct from the residual addition it follows.</p>\n</blockquote>\n<h3>Prerequisite 4 — Cross-entropy loss, briefly</h3>\n<p>Several sections here (BERT's MLM loss, GPT's next-token loss) say &quot;loss = cross-entropy between the\npredicted distribution and the true word.&quot; All you need: cross-entropy loss is <math data-tex=\"-\\log(p)\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>p</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, where <math data-tex=\"p\"><mi>p</mi></math>\nis the probability the model assigned to the <em>correct</em> answer. If the model gives the right word 91%\nprobability, the loss is <math data-tex=\"-\\log(0.91)\\approx0.094\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>0.91</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>0.094</mn></mrow></math> — low, because the model was confident and\ncorrect. If it had given the right word only 10% probability, the loss would be $-\\log(0.10)\\approx\n2.3$ — much higher. Minimizing this loss during training literally means: push probability mass onto\nthe correct word.</p>\n<hr>\n</section><section id=\"sequential-learning-20-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>This lecture closes the arc from tokens to a working, adaptable language model in three acts, and its\nown section titles make the arc explicit:</p>\n<figure class=\"ascii\"><pre>Part 1: Sub-word Tokenization\n   &quot;How do we turn raw text into the integers a neural network can consume, without an impossibly\n    large vocabulary, and without falling apart on words we have never seen?&quot;          [slide 4]\n   │\n   ▼\nPart 2: Transformer Architecture\n   &quot;Follow one sentence as it turns into vectors, flows through attention, and predicts the next\n    word.&quot;                                                                              [slide 41]\n   │\n   ▼\nPart 3: Language Models\n   &quot;Pre-train, generate, adapt: the three families (BERT, GPT, T5) and how we put them to work.&quot;\n                                                                                          [slide 97]</pre></figure>\n<p>Each act ends exactly where the next act's first sentence needs it to: tokenization produces the\ninteger token IDs that become the Transformer's input embeddings; the Transformer produces a generic\narchitecture that BERT, GPT, and T5 each configure differently (same block, different attention\npattern and pre-training objective) to become an actual usable model.</p>\n<hr>\n</section><div class=\"part-head\" id=\"sequential-learning-20-p0\"><h1>Part 1 — Sub-word Tokenization</h1>\n</div><section id=\"sequential-learning-20-s3\" data-title=\"Why Word-Level and Character-Level Both Fail\" data-kind=\"content\" data-part=\"Part 1 — Sub-word Tokenization\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">Why Word-Level and Character-Level Both Fail</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>1.1 Attempt 1 — word-level: split on spaces, give every word an ID [slide 10]</h3>\n<p><code>&quot;the cats are playing&quot;</code> → <code>[&quot;the&quot;, &quot;cats&quot;, &quot;are&quot;, &quot;playing&quot;]</code>. Short sequences, easy to read. But\nthree questions break it:</p>\n<ol>\n<li>What happens when a word shows up that wasn't in the training data, like <em>&quot;tokenization&quot;</em>?</li>\n<li>What about a small typo like <em>&quot;playng&quot;</em>, or related forms like <em>play, plays, playing, played</em>?</li>\n<li>How large does the vocabulary grow if we keep adding every new word?</li>\n</ol>\n<blockquote class=\"aside-quote\">\n<p><strong>Verdict</strong> [slide 10]: <strong>brittle (OOV, typos), blind to morphology, unbounded in size.</strong></p>\n</blockquote>\n<h3>1.2 Attempt 2 — character-level: one token per character [slide 12]</h3>\n<p><code>&quot;playing&quot;</code> → <code>[p,l,a,y,i,n,g]</code>.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>✓ What it fixes</th>\n<th>✗ What it costs</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tiny vocabulary — a few hundred characters cover everything</td>\n<td><strong>Sequences get very long: attention is <math data-tex=\"O(n^2)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, so 6× longer ≈ 36× the compute</strong></td>\n</tr>\n<tr>\n<td>No OOV — any word is a sequence of known characters</td>\n<td>Weak units — a single character means nothing alone; layers are wasted re-assembling words</td>\n</tr>\n<tr>\n<td>Typos and rare words degrade gracefully</td>\n<td>Long-range dependencies span more steps</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The tension, stated directly</strong> [slide 12]: <em>&quot;Words: short &amp; meaningful, but huge vocab + OOV.\nCharacters: tiny vocab &amp; no OOV, but long sequences &amp; weak units. The fix is to meet in the\nmiddle.&quot;</em> This single sentence is the thesis of the entire tokenization section — every remaining\nalgorithm (BPE, WordPiece, Unigram) is a different answer to <em>how</em> to meet in the middle.</p>\n</aside>\n</section><section id=\"sequential-learning-20-s4\" data-title=\"Method 1 — Byte Pair Encoding (BPE)\" data-kind=\"content\" data-part=\"Part 1 — Sub-word Tokenization\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Method 1 — Byte Pair Encoding (BPE)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>BPE</strong> — originally a 1994 compression trick (Gage); brought to NLP by Sennrich, Haddow &amp; Birch\n(2016). Used by <strong>GPT-2/3/4 (byte-level), RoBERTa, BART</strong> [slide 17].</p>\n</blockquote>\n<p><strong>Training — learning the merges</strong> [slide 17]:</p>\n<ol>\n<li><strong>Base vocabulary</strong> = all individual characters. Split every word into characters.</li>\n<li><strong>Count</strong> every adjacent symbol pair across the corpus (weighted by word frequency).</li>\n<li><strong>Merge</strong> the most frequent pair into one new symbol; add it to the vocab and record the merge\nrule.</li>\n<li><strong>Repeat</strong> until the vocabulary reaches the target size (a fixed number of merges).</li>\n</ol>\n<p>Training outputs a <strong>vocabulary</strong> (characters + merged subwords) and an <strong>ordered list of merge\nrules</strong>, replayed at inference.</p>\n<p>🧪 <strong>Worked example — tokenizing a new word</strong> [slide 22]. With merge rules <code>u+g→ug</code>, <code>u+n→un</code>,\n<code>h+ug→hug</code>, <code>p+un→pun</code>, <code>p+ug→pug</code> already learned, tokenizing <code>&quot;bug&quot;</code>:</p>\n<pre class=\"code\"><code>split into characters:   b  u  g\napply u+g → ug:          b  [ug]\n(no further rules apply to &quot;b&quot; + &quot;ug&quot;)\nResult: [&quot;b&quot;, &quot;ug&quot;]</code></pre>\n<p><em>&quot;No recounting at inference: split into characters, then apply the learned merge rules in order&quot;</em>\n[slide 22].</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>A genuine OOV case inside &quot;OOV-free&quot; BPE.</strong> <em>&quot;Try mug: the letter m never appeared in our\ntiny corpus → no base token → [UNK]&quot;</em> [slide 22]. Even BPE's character-level base vocabulary isn't\nautomatically complete if the training corpus never contained a given character. <strong>Real systems fix\nthis with byte-level BPE (GPT-2): the base vocab is the 256 raw bytes, so every possible character\nis representable. There is no [UNK], ever</strong> [slide 22] — this is <em>why</em> GPT's tokenizer specifically\noperates on raw bytes rather than Unicode characters: it makes the &quot;missing base character&quot; failure\nmode structurally impossible.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-20-0\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;BPE Tokenizer, Live&quot;,&quot;concept&quot;:&quot;Applying learned BPE merge rules to a new word at inference time&quot;,&quot;control&quot;:&quot;Type any word (including one containing an unseen character) and step through the learned merge rules being applied in order&quot;,&quot;observe&quot;:&quot;The word splits into characters, then progressively fuses into subword pieces as each applicable merge rule fires; an unrepresentable character falls back to [UNK]&quot;,&quot;insight&quot;:&quot;Tokenization at inference is mechanical rule-replay, not re-counting — and byte-level BPE's 256-byte base vocabulary is what makes [UNK] structurally impossible for GPT's tokenizer specifically&quot;,&quot;fallback&quot;:&quot;The \\&quot;bug\\&quot; → [\\&quot;b\\&quot;,\\&quot;ug\\&quot;] and \\&quot;mug\\&quot; → [UNK] worked examples above trace the identical rule-application steps by hand.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">BPE Tokenizer, Live</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Applying learned BPE merge rules to a new word at inference time</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Type any word (including one containing an unseen character) and step through the learned merge rules being applied in order</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The word splits into characters, then progressively fuses into subword pieces as each applicable merge rule fires; an unrepresentable character falls back to [UNK]</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Tokenization at inference is mechanical rule-replay, not re-counting — and byte-level BPE's 256-byte base vocabulary is what makes [UNK] structurally impossible for GPT's tokenizer specifically</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The \"bug\" → [\"b\",\"ug\"] and \"mug\" → [UNK] worked examples above trace the identical rule-application steps by hand.</p>\n    </div>\n  </figure>\n</section><section id=\"sequential-learning-20-s5\" data-title=\"Method 2 — WordPiece\" data-kind=\"content\" data-part=\"Part 1 — Sub-word Tokenization\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Method 2 — WordPiece</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>WordPiece</strong> — BERT's tokenizer. Runs the <strong>same</strong> character-merging loop as BPE, with two\nchanges [slide 24].</p>\n</blockquote>\n<p><strong>Change 1 — the <code>##</code> marker.</strong> A piece that <em>continues</em> a word gets a <code>##</code> prefix, so a word-start\npiece can be separated from a word-internal one and the word rebuilt exactly. This is the standard\nBERT convention: <code>hugs</code> → <code>[h, ##u, ##g, ##s]</code>; <code>play</code> + <code>##ing</code> → <code>playing</code>.</p>\n<p><strong>Change 2 — the merge rule.</strong> Instead of merging the most <em>frequent</em> pair, WordPiece merges the\npair with the highest <strong>score</strong>:</p>\n<div class=\"mblk\"><math data-tex=\"\\text{score}(a,b) = \\frac{\\text{freq}(a,b)}{\\text{freq}(a)\\cdot\\text{freq}(b)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>score</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mfrac><mrow><mtext>freq</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mtext>freq</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>⋅</mo><mtext>freq</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac></mrow></math></div>\n<p>🧪 <strong>Worked example, same corpus scored both ways</strong> [slide 24]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pair</th>\n<th>Freq</th>\n<th>Score</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>##g + ##s</code></td>\n<td>5</td>\n<td><strong>0.050</strong></td>\n</tr>\n<tr>\n<td><code>##u + ##g</code></td>\n<td>20</td>\n<td>0.028</td>\n</tr>\n<tr>\n<td><code>p + ##u</code></td>\n<td>17</td>\n<td>0.028</td>\n</tr>\n<tr>\n<td><code>##u + ##n</code></td>\n<td>16</td>\n<td>0.028</td>\n</tr>\n<tr>\n<td><code>h + ##u</code></td>\n<td>15</td>\n<td>0.028</td>\n</tr>\n<tr>\n<td><code>b + ##u</code></td>\n<td>4</td>\n<td>0.028</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>BPE merges <code>u+g</code>: the most <em>frequent</em> pair (count 20). WordPiece merges <code>g+s</code>: the highest\n<em>score</em> (0.050), even though it appears only 5 times.</strong></p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why the difference.</strong> <em>&quot;Dividing by the two piece frequencies favours pieces\nthat are individually rare but keep showing up together. That pairing is more informative than\nfusing two already-common pieces&quot;</em> [slide 24]. This is directly analogous to TF-IDF's logic\n(Lecture 18 <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§3.3\" role=\"link\" tabindex=\"0\">§3.3</a>) and to GloVe's ratio insight (Lecture 18 <a class=\"xref\" data-xref-lec=\"sequential-learning-20\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>): a raw count conflates &quot;frequent\npair&quot; with &quot;frequent components,&quot; while dividing by the components' individual frequencies isolates\nhow much <em>more</em> often the pair co-occurs than chance would predict from their individual\ncommonness.</p>\n</aside>\n</section><section id=\"sequential-learning-20-s6\" data-title=\"Method 3 — Unigram LM / SentencePiece\" data-kind=\"content\" data-part=\"Part 1 — Sub-word Tokenization\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Method 3 — Unigram LM / SentencePiece</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>Unigram LM (SentencePiece)</strong> — used by <strong>T5, ALBERT, XLNet</strong>. SentencePiece doesn't split on\nspaces first: it reads raw text and turns each space into a visible <code>_</code> marker, so spacing becomes\npart of the tokens. This makes it <strong>language-agnostic</strong> (works even for languages written without\nspaces) and fully reversible: <code>&quot;I love ML&quot;</code> → <code>[_I, _love, _ML]</code> [slide 30].</p>\n</blockquote>\n<p><strong>The Unigram idea</strong> [slide 30]:</p>\n<ul>\n<li>Every subword in the vocabulary carries a <strong>probability</strong>.</li>\n<li>To tokenize a word, the model looks at <em>all</em> the ways it could be split and keeps the one with the\n<strong>highest combined probability</strong> (found efficiently with the Viterbi algorithm).</li>\n<li>Training works <strong>top-down</strong>: start with a large set of candidate pieces, then repeatedly drop the\nones the corpus needs least, until the vocabulary reaches the target size. <em>(BPE and WordPiece do\nthe opposite: they build up from characters.)</em></li>\n</ul>\n<p>🧪 <strong>Worked example — segmenting &quot;dogs&quot;</strong> [slide 30]. Vocabulary probabilities: <code>dog .40, s .20, do .10, g .10, gs .05, o .05, d .05</code>.</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Segmentation</th>\n<th>Probability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong><code>dog | s</code></strong></td>\n<td><math data-tex=\".40\\times.20=\\mathbf{.0800}\"><mrow><mn>.40</mn><mo>×</mo><mn>.20</mn><mo>=</mo><mn>.𝟎𝟖𝟎𝟎</mn></mrow></math></td>\n</tr>\n<tr>\n<td><code>do | gs</code></td>\n<td><math data-tex=\".10\\times.05=.0050\"><mrow><mn>.10</mn><mo>×</mo><mn>.05</mn><mo>=</mo><mn>.0050</mn></mrow></math></td>\n</tr>\n<tr>\n<td><code>do | g | s</code></td>\n<td><math data-tex=\".10\\times.10\\times.20=.0020\"><mrow><mn>.10</mn><mo>×</mo><mn>.10</mn><mo>×</mo><mn>.20</mn><mo>=</mo><mn>.0020</mn></mrow></math></td>\n</tr>\n<tr>\n<td><code>d | o | g | s</code></td>\n<td><math data-tex=\".05\\times.05\\times.10\\times.20=.00005\"><mrow><mn>.05</mn><mo>×</mo><mn>.05</mn><mo>×</mo><mn>.10</mn><mo>×</mo><mn>.20</mn><mo>=</mo><mn>.00005</mn></mrow></math></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;<code>dog \\| s</code> is the highest-probability path. The model prefers the split that best explains the\nword under its learned piece probabilities&quot;</em> [slide 30].</p>\n</section><section id=\"sequential-learning-20-s7\" data-title=\"Comparison — Same Goal, Three Different Strategies [slide 32]\" data-kind=\"content\" data-part=\"Part 1 — Sub-word Tokenization\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">Comparison — Same Goal, Three Different Strategies [slide 32]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>BPE</strong></th>\n<th><strong>WordPiece</strong></th>\n<th><strong>Unigram / SentencePiece</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Direction</td>\n<td>bottom-up merge</td>\n<td>bottom-up merge</td>\n<td>top-down prune</td>\n</tr>\n<tr>\n<td>Selection rule</td>\n<td>most frequent pair</td>\n<td>highest score, freq/(freq·freq)</td>\n<td>max-likelihood split (probabilistic)</td>\n</tr>\n<tr>\n<td>Piece marker</td>\n<td>space pre-token</td>\n<td><code>##</code> on continuation</td>\n<td><code>_</code> on space</td>\n</tr>\n<tr>\n<td>OOV</td>\n<td>none (byte-level)</td>\n<td><code>[UNK]</code> possible</td>\n<td>none (char fallback)</td>\n</tr>\n<tr>\n<td>Used by</td>\n<td>GPT-2/3/4, RoBERTa</td>\n<td>BERT, DistilBERT</td>\n<td>T5, ALBERT, XLNet</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight, stated directly and worth taking as the section's thesis:</strong> <em>&quot;All three keep\nfrequent text whole and break rare text into reusable pieces. They only differ in <strong>how they choose\nthe pieces</strong>: by count, by score, or by probability&quot;</em> [slide 32].</p>\n</aside>\n<p><strong>What's next in Sequence Learning:</strong> <em>&quot;these tokens become the input IDs that flow into the\nTransformer: embeddings, positional encoding, and attention&quot;</em> [slide 36] — <code>text → subword tokens → IDs → Transformer</code>. This is the exact handoff into Part 2.</p>\n<hr>\n</section><div class=\"part-head\" id=\"sequential-learning-20-p1\"><h1>Part 2 — Transformer Architecture</h1>\n</div><section id=\"sequential-learning-20-s8\" data-title=\"A Model Sees Numbers, Not Text [slide 7]\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">A Model Sees Numbers, Not Text [slide 7]</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><em>A note on ordering:</em> <code>slide 7</code> is actually the deck's 2nd slide overall, displayed while the tab\nbar still shows <strong>&quot;1 Sub-word Tokenization&quot;</strong> as active — several slides before &quot;Attempt 1 —\nword-level&quot; (<code>slide 10</code>), which is the real start of that tab's content. This file places this\nslide's content at the <em>start</em> of Part 2 instead, as a deliberate pedagogical bridge (it's the\nsentence that motivates <em>why</em> tokenization matters — &quot;a Transformer only sees integers&quot; — so it\nreads best right before the Transformer section, not buried inside Part 1). If you check <code>slide 7.jpg</code> directly, expect to see tab 1 highlighted, not tab 2.</p>\n</blockquote>\n<p><em>&quot;A Transformer sees a sequence of integer IDs and looks one up in an embedding table. So before any\nlearning happens, we split into pieces (tokens), and map each piece to an ID. That splitting step is\ntokenization.&quot;</em></p>\n<pre class=\"code\"><code>&quot;The cat sat&quot;\ntokenize →   The   cat   sat\nlook up IDs →  1396  4327  2038\nembed →       [0.21, -0.05, ...], [...], [...]</code></pre>\n<p>This is the literal continuation of Part 1's closing sentence — tokenization's output (integer IDs)\nis the Transformer's input.</p>\n</section><section id=\"sequential-learning-20-s9\" data-title=\"Positional Encoding — the Problem\" data-kind=\"content\" data-part=\"Part 2 — Transformer Architecture\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">Positional Encoding — the Problem</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-20-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful<
