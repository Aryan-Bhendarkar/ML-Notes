<style>
/* ═══════════════════════════════════════════════════════════════════════
   STUDY LAMP — one mode, warm and dim.  Warm charcoal ground (never blue-
   black), warm paper-grey text at ~12:1, a single soft-amber accent for
   structure only: section numbers, your position, boxed results, progress.
   Links are a separate desaturated slate-blue so a link never looks like a
   heading.  The six callout hues keep one fixed meaning across every module.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#1B1A17; --surface:#242119; --surface-2:#16140F; --raised:#2C2820;
  --rule:#37332B; --rule-2:#4C4739;
  --ink:#EDE6D7; --ink-2:#B4AA95; --ink-3:#7C7361;
  --accent:#8CDCA6; --accent-dim:#4FA073; --accent-wash:#1E3025;
  --link:#93BFCE;
  --c-bg:#93B0D6; --c-key:#E6BA55; --c-warn:#E89170;
  --c-lab:#79C7A2; --c-int:#C0A6E4; --c-res:#A6CE8E; --c-recon:#D6A06E;
  --hl-1:#F0D488; --hl-2:#83D0C8; --hl-3:#F0A892; --hl-4:#C4AEF0;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 16px 44px -20px rgba(0,0,0,.75);
  --wash:.14;
  --font-body:Charter,"Sitka Text","Iowan Old Style","Palatino Linotype",Cambria,Georgia,serif;
  --font-ui:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --font-mono:"Cascadia Code","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --measure:64ch;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:19px;line-height:1.75;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-wash);color:#fff}
a{color:var(--link);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:#A9C6D2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px}
.skip:focus{left:12px;top:9px;z-index:100;background:var(--surface);padding:10px 14px;border:1px solid var(--accent);border-radius:8px}
button{font-family:var(--font-ui);color:inherit}

/* ── header — as little as possible ─────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.top-in{max-width:1680px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;gap:16px}
.home-l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.home-l:hover{color:var(--ink)}
.home-l b{color:var(--ink);font-weight:600}
.mprog{flex:1;max-width:340px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mprog-track{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.mprog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.ic{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--rule-2);border-radius:8px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;padding:0}
.ic:hover{color:var(--ink);border-color:var(--accent)}
.readbar{height:2px;background:var(--accent);width:0}
.views{max-width:1680px;margin:0 auto;padding:1px 22px 0;display:flex;gap:1px;font-family:var(--font-ui)}
.view-t{font:inherit;font-size:11.5px;padding:7px 12px;border:0;border-bottom:2px solid transparent;background:none;
  color:var(--ink-3);cursor:pointer}
.view-t:hover{color:var(--ink-2)}
.view-t[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{max-width:1680px;margin:0 auto;padding:0 22px;display:grid;
  grid-template-columns:274px minmax(0,1fr) 264px;gap:40px;align-items:start}
@media(max-width:1360px){.shell{grid-template-columns:250px minmax(0,1fr)}.rail-r{position:fixed;right:0;top:52px;bottom:0;
  width:300px;background:var(--surface);border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s;z-index:30;padding:20px}
  .rail-r.open{transform:none;box-shadow:var(--shadow)}}
@media(max-width:1040px){.shell{grid-template-columns:minmax(0,1fr);padding:0 16px}.rail-l{display:none}}
.rail{position:sticky;top:52px;max-height:calc(100vh - 58px);overflow-y:auto;padding:22px 4px 90px;
  font-family:var(--font-ui);font-size:12.5px;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
.rl-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:22px 0 8px;padding-left:10px}
.rl-h:first-child{margin-top:0}

/* ── the course spine (left rail) ──────────────────────────────────── */
.spine-mod{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--ink);padding:2px 10px 8px}
.lec{margin-bottom:1px}
.lec-b{width:100%;text-align:left;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid transparent;
  background:none;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:9px;line-height:1.3}
.lec-b:hover{background:var(--raised);color:var(--ink)}
.lec-b.on{background:var(--raised);color:var(--ink);border-color:var(--rule-2)}
.lec-n{font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;flex:none;
  width:17px;height:17px;border:1px solid var(--accent-dim);border-radius:4px;display:grid;place-items:center}
.lec-b.on .lec-n{background:var(--accent);color:#231a0b;border-color:var(--accent)}
.lec-lab{flex:1;font-weight:600}
.lec-bar{width:34px;height:3px;border-radius:2px;background:var(--rule);flex:none;overflow:hidden}
.lec-bar i{display:block;height:100%;background:var(--c-lab)}
.secs{list-style:none;margin:2px 0 8px;padding:0 0 0 12px;margin-left:14px;border-left:1px solid var(--rule);display:none}
.secs.open{display:block}
.secs a{display:flex;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:12px;line-height:1.4}
.secs a:hover{background:var(--raised);color:var(--ink)}
.secs a.cur{color:var(--accent);font-weight:650}
.secs a.done{color:var(--ink-3)}
.spine-part{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;
  padding:9px 8px 3px;margin-top:2px}
.spine-part:first-child{margin-top:0}
.secs a[data-kind="recap"]{color:var(--ink-3);font-style:italic;font-size:11px}
.secs a[data-kind="back"]{color:var(--ink-3)}
.secs a[data-kind="divider"]{color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;margin-top:6px;pointer-events:auto}
.secs a[data-kind="divider"] .n{display:none}
.secs a .n{flex:none;width:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.secs a.done .n::after{content:"✓";color:var(--c-lab)}
.secs a.cur .n{color:var(--accent)}
.othermod a{display:flex;gap:8px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink-3);font-size:12px}
.othermod a:hover{background:var(--raised);color:var(--ink)}
.othermod .m-n{flex:none;font-variant-numeric:tabular-nums}
.othermod .m-p{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* ── right rail: your work only ────────────────────────────────────── */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-b{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;font:inherit;font-family:var(--font-ui);
  font-size:12px;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.phase-b:hover{border-color:var(--accent);color:var(--ink)}
.phase-b .box{width:15px;height:15px;border:1.5px solid var(--rule-2);border-radius:5px;flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:9px;color:transparent}
.phase-b.done{color:var(--ink)}
.phase-b.done .box{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.phase-b.done .box::after{content:"✓";font-weight:800}
.phase-b b{font-weight:650;display:block}
.phase-b small{color:var(--ink-3);font-weight:400}
.phase-b .go{margin-left:auto;color:var(--accent);flex:none;font-size:13px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{margin-bottom:4px}
.rlist button{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);font-size:11.5px;line-height:1.45;
  padding:6px 9px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;
  border-left:3px solid var(--h,var(--rule-2))}
.rlist button:hover{color:var(--ink);border-color:var(--accent)}
.rlist li[data-c="1"] button{--h:var(--hl-1)} .rlist li[data-c="2"] button{--h:var(--hl-2)}
.rlist li[data-c="3"] button{--h:var(--hl-3)} .rlist li[data-c="4"] button{--h:var(--hl-4)}
.empty{font-size:11.5px;color:var(--ink-3);font-style:italic;padding:0 10px;line-height:1.5}
.rr-close{display:none}
@media(max-width:1360px){.rr-close{display:block;position:absolute;top:12px;right:14px;background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}}

/* ── reading column ───────────────────────────────────────────────── */
main{padding:38px 0 200px;min-width:0;position:relative}
.doc{max-width:var(--measure)}
.lecture-head{margin:0 0 8px}
.lecture-head .kicker{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);
  text-transform:uppercase;margin-bottom:8px}
.lecture-head h1{font-family:var(--font-body);font-size:34px;font-weight:700;line-height:1.16;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lecture-head .meta{font-family:var(--font-ui);font-size:13px;color:var(--ink-3);margin-top:10px}
.frontmatter{margin:22px 0 8px;padding-bottom:4px}
.part-head{margin:3.4em 0 0}
.part-head h1{font-family:var(--font-body);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);margin:0 0 .2em;padding-bottom:.5em;border-bottom:2px solid var(--accent-dim)}
.part-head + section h2,.part-head h1 + section h2{border-top:0;padding-top:.3em;margin-top:.8em}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}

h2{font-family:var(--font-body);font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.008em;
  margin:2.9em 0 .55em;padding-top:1.15em;border-top:1px solid var(--rule);position:relative;
  display:flex;align-items:baseline;gap:12px;text-wrap:balance;scroll-margin-top:66px}
section:first-of-type h2,.frontmatter + section h2{border-top:0;padding-top:.1em;margin-top:1em}
section[data-kind="recap"] h2{font-style:italic;color:var(--ink-2);font-size:22px}
section[data-kind="back"] h2{font-family:var(--font-ui);font-size:23px;font-weight:680}
section[data-kind="divider"]{margin:2.6em 0 0}
section[data-kind="divider"] h2{border-top:0;padding:0 0 .5em;margin:0;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:2px solid var(--accent-dim)}
section[data-kind="divider"] .sec-n,section[data-kind="divider"] .sec-meta{display:none}
.sec-n{position:absolute;left:-56px;top:calc(1.15em + .15em);font-family:var(--font-ui);font-size:12px;font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;width:44px;padding-top:.3em}
@media(max-width:1200px){.sec-n{position:static;border-left:2px solid var(--accent);padding:0 0 0 8px;width:auto;text-align:left;align-self:stretch;display:flex;align-items:center}}
.sec-t{flex:1;min-width:0}
.sec-meta{flex:none;display:flex;align-items:center;gap:9px;align-self:center}
.sec-time{font-family:var(--font-ui);font-size:11px;color:var(--ink-3);font-weight:500}
.sec-check{width:21px;height:21px;border:1.5px solid var(--rule-2);border-radius:6px;background:var(--surface);cursor:pointer;
  display:grid;place-items:center;font-size:11px;color:transparent;padding:0;transition:.12s;flex:none}
.sec-check:hover{border-color:var(--c-lab)}
.sec-check.on{background:var(--c-lab);border-color:var(--c-lab);color:#12241a}
.sec-check.on::after{content:"✓";font-weight:800}
h3{font-family:var(--font-ui);font-size:18px;font-weight:660;margin:1.9em 0 .45em;line-height:1.3}
h4{font-family:var(--font-ui);font-size:15.5px;font-weight:660;color:var(--ink-2);margin:1.5em 0 .35em}
.doc p{margin:0 0 1.1em}
strong{font-weight:700;color:#F1EADD}
em{font-style:italic}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
sup,sub{line-height:0}

.doc ul,.doc ol{margin:0 0 1.15em;padding-left:1.4em}
.doc li{margin:.35em 0}
.doc li::marker{color:var(--ink-3)}
.doc ul{list-style:none;padding-left:1.2em}
.doc ul>li{position:relative}
.doc ul>li::before{content:"";position:absolute;left:-.95em;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent-dim)}
.doc dt{font-weight:700;font-family:var(--font-ui);font-size:15px;margin-top:.7em}
.doc dd{margin:.15em 0 1em}

code{font-family:var(--font-mono);font-size:.8em;background:var(--surface-2);padding:.12em .38em;border-radius:4px;border:1px solid var(--rule)}
.code{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:15px 17px;overflow-x:auto;margin:0 0 1.3em;line-height:1.6}
.code code{background:none;border:0;padding:0;font-size:13.5px}
figure.ascii{margin:0 0 1.4em;background:var(--surface-2);border:1px solid var(--rule);border-left:2px solid var(--accent-dim);
  border-radius:8px;padding:16px 18px;overflow-x:auto}
figure.ascii pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre;color:var(--ink-2)}

.table-wrap{overflow-x:auto;margin:0 0 1.4em}
.table-wrap.bound{margin-top:-.5em}
table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;font-size:12px;color:var(--ink-3);border-bottom-color:var(--rule-2)}
tbody tr:last-child td{border-bottom:0}
.symtab{border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.symtab td:first-child{font-family:var(--font-mono);white-space:nowrap;color:var(--ink)}

.mblk{display:block;overflow-x:auto;overflow-y:hidden;margin:1.5em 0;padding:6px 2px;text-align:center}
.mblk.bound{margin-bottom:.3em}
math{font-size:1.05em}
.mblk math{font-size:1.15em}
.mblk[data-boxed] .tml-fbox,.mblk[data-boxed] menclose{background:var(--accent-wash);border-color:var(--accent)!important}
.mfail{color:var(--c-warn);font-family:var(--font-mono);font-size:.85em}

/* callouts — left rule + faint wash, no box */
.callout{margin:0 0 1.4em;padding:4px 0 4px 16px;border-left:2px solid var(--k);--k:var(--ink-3)}
.callout>*:last-child{margin-bottom:0}
.callout-h{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--k);margin:0 0 5px;display:flex;align-items:center;gap:7px}
.callout-badge{font-size:12px}
.callout-bg{--k:var(--c-bg)} .callout-key{--k:var(--c-key)} .callout-warn{--k:var(--c-warn)}
.callout-lab{--k:var(--c-lab)} .callout-int{--k:var(--c-int)} .callout-res{--k:var(--c-res)} .callout-recon{--k:var(--c-recon)}
.callout-warn{border-left-width:3px;background:color-mix(in srgb,var(--c-warn) 7%,transparent);padding:8px 0 8px 16px}
.aside-quote{margin:0 0 1.3em;padding-left:15px;border-left:2px solid var(--rule-2);color:var(--ink-2);font-style:italic}
blockquote{margin:.7em 0 0;padding-left:13px;border-left:2px solid var(--rule-2);color:var(--ink-2)}

/* recall cards — flat */
.recall{border-bottom:1px solid var(--rule);margin:0 0 6px;padding-bottom:6px}
.recall-q{width:100%;text-align:left;font:inherit;font-family:var(--font-body);font-size:16.5px;padding:11px 4px;
  background:none;border:0;color:var(--ink);cursor:pointer;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.recall-q:hover{color:#fff}
.recall-n{font-family:var(--font-ui);font-size:10.5px;font-weight:750;color:var(--accent);flex:none;margin-top:4px;font-variant-numeric:tabular-nums;min-width:16px}
.recall-t{flex:1;min-width:0}
.recall-x{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);flex:none;margin-top:5px;font-weight:600}
.recall-a{padding:2px 4px 10px 31px;font-size:16.5px}
.recall-a>*:first-child{margin-top:10px}
.recall[data-open] .recall-x{color:var(--accent)}
.rate{display:flex;gap:7px;margin-top:14px;padding-top:11px;border-top:1px dashed var(--rule)}
.rate-b{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:14px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.rate-b:hover{border-color:var(--k,var(--accent));color:var(--k,var(--accent))}
.rate-b.on{background:var(--k);border-color:var(--k);color:#161310}
.rate-b[data-r="1"]{--k:var(--c-lab)} .rate-b[data-r="2"]{--k:var(--c-key)} .rate-b[data-r="3"]{--k:var(--c-warn)}
.recall[data-rated] .recall-n::after{font-size:9px;margin-left:2px}
.recall[data-rated="1"] .recall-n::after{content:"●";color:var(--c-lab)}
.recall[data-rated="2"] .recall-n::after{content:"●";color:var(--c-key)}
.recall[data-rated="3"] .recall-n::after{content:"●";color:var(--c-warn)}

.tryfirst{font-family:var(--font-ui);font-size:10.5px;font-weight:650;padding:3px 10px;border-radius:12px;
  border:1px solid var(--c-lab);color:var(--c-lab);background:none;cursor:pointer;margin-left:auto}
.tryfirst:hover{background:var(--c-lab);color:#12241a}
.masked{filter:blur(5px);opacity:.32;user-select:none;pointer-events:none}

/* interactive */
.iv{border:1px solid var(--rule-2);border-radius:10px;margin:0 0 1.6em;background:var(--surface);overflow:hidden}
.iv-cap{display:flex;align-items:baseline;gap:10px;padding:10px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-family:var(--font-ui)}
.iv-kind{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:var(--ink-3);flex:none}
.iv-title{font-size:13.5px;font-weight:650;color:var(--ink)}
.iv-live{margin-left:auto;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--c-lab)}
.iv-mount{padding:16px}
.iv-fallback{padding:13px 15px 15px;font-family:var(--font-ui);font-size:13.5px}
.iv-meta{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.iv-row{display:contents}
.iv-meta dt{color:var(--ink-3);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.iv-meta dd{margin:0;color:var(--ink-2)}
.iv-fb-prose{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
.iv.is-live .iv-fallback{border-top:1px dashed var(--rule)}
.iv.is-live .iv-fb-prose,.iv.is-live .iv-meta{display:none}
.iv-ctl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:12px;font-family:var(--font-ui);font-size:12px}
.iv-ctl label{display:flex;flex-direction:column;gap:3px;color:var(--ink-2);font-weight:600}
.iv-ctl input[type=range]{width:170px;accent-color:var(--accent)}
.iv-ctl .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.iv svg{max-width:100%;height:auto;display:block}
.iv .plot-bg{fill:var(--surface-2)}
.iv .plot-axis{stroke:var(--rule-2);stroke-width:1}
.iv .plot-grid{stroke:var(--rule);stroke-width:1}
.iv .plot-label{fill:var(--ink-3);font-family:var(--font-ui);font-size:10px}
.iv .readout{font-family:var(--font-ui);font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.iv .readout b{color:var(--ink);font-variant-numeric:tabular-nums}

/* highlights */
.hl{border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  background:color-mix(in srgb,var(--h) 30%,transparent);
  box-shadow:inset 0 -.42em 0 color-mix(in srgb,var(--h) 16%,transparent)}
.hl[data-c="1"]{--h:var(--hl-1)} .hl[data-c="2"]{--h:var(--hl-2)} .hl[data-c="3"]{--h:var(--hl-3)} .hl[data-c="4"]{--h:var(--hl-4)}
#hlbar{position:fixed;z-index:60;display:none;gap:4px;background:var(--surface);border:1px solid var(--rule-2);border-radius:9px;padding:5px;box-shadow:var(--shadow)}
#hlbar.on{display:flex}
.sw{width:25px;height:25px;border-radius:6px;border:1px solid var(--rule-2);cursor:pointer;padding:0;font-family:var(--font-ui);
  font-size:10px;font-weight:700;color:#161310;display:grid;place-items:center}
.sw[data-c="1"]{background:var(--hl-1)} .sw[data-c="2"]{background:var(--hl-2)}
.sw[data-c="3"]{background:var(--hl-3)} .sw[data-c="4"]{background:var(--hl-4)} .sw[data-c="0"]{background:var(--surface-2);color:var(--ink-2)}

/* focus mode */
body.focus .rail,body.focus .views,body.focus .top-r{opacity:.08;pointer-events:none}
body.focus .doc{--measure:58ch}
body.focus section:not(.live){opacity:.25}
section{transition:opacity .25s}

/* module + phase views */
.view{display:none}
.view.on{display:block;max-width:70ch}
.view h1{font-family:var(--font-body);font-size:30px;font-weight:700;margin:0 0 6px}
.view-lead{font-family:var(--font-ui);font-size:14px;color:var(--ink-2);max-width:58ch;margin:0 0 26px}
.qcard{border:1px solid var(--rule);border-radius:9px;padding:13px 16px;margin-bottom:10px;background:var(--surface)}
.qcard.r3{border-left:3px solid var(--c-warn)} .qcard.r2{border-left:3px solid var(--c-key)}
.qcard .from{font-family:var(--font-ui);font-size:10.5px;color:var(--ink-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.qcard .due{font-family:var(--font-ui);font-size:9.5px;color:var(--c-key);font-weight:700;text-transform:uppercase;letter-spacing:.05em;float:right}
.pill{font-family:var(--font-ui);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:10px;border:1px solid var(--k);color:var(--k);--k:var(--ink-3);white-space:nowrap}
.pill.intro{--k:var(--c-lab)} .pill.solid{--k:var(--c-key)} .pill.hard{--k:var(--c-warn)}
#gf{width:100%;font:inherit;font-family:var(--font-ui);font-size:15px;padding:10px 14px;border:1px solid var(--rule-2);
  border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:16px}
.phase-view-h{font-family:var(--font-ui);font-size:12px;color:var(--ink-3);margin:0 0 20px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
.phase-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.phase-nav button{font-family:var(--font-ui);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;
  border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.phase-nav button:hover{border-color:var(--accent);color:var(--ink)}
.phase-nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#231a0b}
.phase-nav .phase-mark{margin-left:auto;border-color:var(--c-lab);color:var(--c-lab)}

/* search */
#sd{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(4px);display:none;padding-top:11vh}
#sd.on{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--rule-2);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
#sq{width:100%;font:inherit;font-family:var(--font-ui);font-size:17px;padding:16px 20px;border:0;background:none;color:var(--ink);border-bottom:1px solid var(--rule)}
#sq:focus{outline:none}
#sr{max-height:58vh;overflow-y:auto;padding:7px}
.sri{width:100%;text-align:left;font:inherit;font-family:var(--font-ui);padding:9px 13px;border:0;background:none;border-radius:8px;cursor:pointer;display:block;color:var(--ink)}
.sri:hover,.sri.sel{background:var(--accent-wash)}
.sri b{font-size:13.5px;font-weight:640;display:block}
.sri span{font-size:11px;color:var(--ink-3)}
.sri mark{background:color-mix(in srgb,var(--hl-1) 45%,transparent);color:inherit;border-radius:2px}
.sri .scope{font-size:9.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

dialog{border:1px solid var(--rule-2);border-radius:13px;background:var(--surface);color:var(--ink);padding:24px 28px;max-width:460px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.sh{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-family:var(--font-ui);font-size:13px;align-items:center}
.note{border-left:3px solid var(--c-key);background:color-mix(in srgb,var(--c-key) 8%,transparent);padding:9px 13px;border-radius:0 6px 6px 0;margin:.5em 0 1.1em;font-size:14px;font-family:var(--font-ui)}
.note-x{float:right;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 0 0 8px}
.addn{opacity:0;position:absolute;left:-26px;top:2px;width:19px;height:19px;border-radius:6px;border:1px solid var(--rule-2);
  background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:12px;line-height:1;padding:0;transition:opacity .12s}
.doc p{position:relative}
.doc p:hover .addn{opacity:1}
@media(max-width:1200px){.addn{display:none}}

/* ── review session ────────────────────────────────────────────────── */
.b-review{position:relative}
.b-review .due-dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--c-key);color:#1b1408;font-size:9px;font-weight:800;display:grid;place-items:center;font-family:var(--font-ui)}
#rev{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;align-items:center}
#rev.on{display:flex}
.rev-top{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;padding:18px 22px;font-family:var(--font-ui);font-size:12px;color:var(--ink-3)}
.rev-prog{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.rev-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.rev-x{background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer}
.rev-card{flex:1;width:100%;max-width:680px;padding:0 22px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.rev-kind{font-family:var(--font-ui);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.rev-kind span{color:var(--ink-3);font-weight:600;margin-left:8px}
.rev-front{font-size:22px;line-height:1.5;color:var(--ink)}
.rev-back{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule);font-size:17px;line-height:1.7;color:var(--ink-2)}
.rev-back.hidden{display:none}
.rev-back math{color:var(--ink)}
.rev-actions{width:100%;max-width:680px;padding:20px 22px 40px;display:flex;gap:10px;font-family:var(--font-ui)}
.rev-reveal{flex:1;padding:14px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.rev-reveal:hover{border-color:var(--accent)}
.rev-grade{flex:1;padding:14px 10px;border-radius:10px;border:1px solid var(--k);background:none;color:var(--k);
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.rev-grade:hover{background:var(--k);color:#161310}
.rev-grade small{font-size:10px;opacity:.7;font-weight:500}
.rev-grade[data-g="0"]{--k:var(--c-warn)} .rev-grade[data-g="1"]{--k:var(--c-key)} .rev-grade[data-g="2"]{--k:var(--c-lab)}
.rev-done{text-align:center;font-family:var(--font-ui);max-width:420px;padding:40px 22px}
.rev-done h2{font-family:var(--font-body);font-size:26px;margin:0 0 10px;color:var(--ink)}
.rev-done p{font-size:14px;color:var(--ink-2);line-height:1.7}
.rev-done .big{font-size:44px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
</style>
</head>

<header class="top">
  <div class="top-in">
    <a class="home-l" href="./index.html">‹ <b>Sequential Learning</b></a>

    <div class="top-r">
      <button class="ic b-review" id="b-review" title="Review due cards (R)" aria-label="Review">↻<span class="due-dot" id="dueDot" hidden></span></button>
      <button class="ic" id="b-search" title="Search (Ctrl+K)" aria-label="Search">⌕</button>
      <button class="ic" id="b-focus" title="Focus mode (F)" aria-label="Focus mode">◑</button>
      <button class="ic" id="b-work" title="Your highlights & notes" aria-label="Your work">✎</button>
      <button class="ic" id="b-help" title="Shortcuts &amp; data (?)" aria-label="Shortcuts and data">?</button>
    </div>
  </div>
  <div class="views" id="views" role="tablist"></div>
  <div class="readbar" id="readbar"></div>
</header>

<div class="shell">

  <main id="main"><div class="doc" id="doc"></div></main>
  <aside class="rail rail-r" id="railR" aria-label="Your work on this page">

    <div id="railRbody"></div>
  </aside>
</div>

<div id="rev" role="dialog" aria-label="Review session" aria-modal="true">

    <button class="rev-x" id="revX" aria-label="End session">✕</button>
    <span id="revCount">0 / 0</span>
    <div class="rev-prog"><i id="revProg"></i></div>
    <span id="revNew"></span>
  </div>
  <div class="rev-card" id="revCard"></div>
  <div class="rev-actions" id="revActions"></div>
</div>

<div id="hlbar" role="toolbar" aria-label="Highlight colour">
  <button class="sw" data-c="1" title="Remember this (1)"></button>
  <button class="sw" data-c="2" title="I understand this (2)"></button>
  <button class="sw" data-c="3" title="Weak spot — come back (3)"></button>
  <button class="sw" data-c="4" title="Interview material (4)"></button>
  <button class="sw" data-c="0" title="Remove">✕</button>
</div>

<div id="sd" role="dialog" aria-label="Search this module">
  <div class="sbox"><input id="sq" placeholder="Search this module…" autocomplete="off" spellcheck="false"><div id="sr"></div></div>
</div>

<dialog id="hd">
  <h3 style="margin:0 0 14px;font-family:var(--font-ui);font-size:16px">Keyboard</h3>
  <div class="sh">
    <span class="kbd">J</span><span>Next section</span>
    <span class="kbd">K</span><span>Previous section</span>
    <span class="kbd">[</span><span>Previous lecture</span>
    <span class="kbd">]</span><span>Next lecture</span>
    <span class="kbd">Ctrl K</span><span>Search</span>
    <span class="kbd">R</span><span>Review due cards</span>
    <span class="kbd">F</span><span>Focus mode</span>
    <span class="kbd">1–4</span><span>Highlight selected text</span>
    <span class="kbd">0</span><span>Remove highlight</span>
    <span class="kbd">?</span><span>This panel</span>
  </div>
  <p style="margin:16px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--font-ui)">
    Highlights, notes, ratings and progress live in this browser only.</p>
  <div style="margin-top:15px;display:flex;gap:8px">
    <button class="rate-b" id="b-exp">Export data</button>
    <button class="rate-b" id="b-imp">Import</button>
    <button class="rate-b" style="margin-left:auto" onclick="hd.close()">Close</button>
  </div>

Unicode range 1D49C to 1D4B5.

math {
  font-family: "Cambria Math", 'STIXTwoMath-Regular', 'NotoSansMath-Regular', math;
  font-style: normal;
  font-weight: normal;
  line-height: normal;
  font-size-adjust: none;
  text-indent: 0;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  direction: ltr;
  /* Prevent Firefox from omitting the dot on i or j. */
  font-feature-settings: "dtls" off;
}

math * {
  border-color: currentColor;
}

/* display: block is necessary in Firefox and Safari.
 * Not in Chromium, which recognizes display: "block math" written inline. */
 math.tml-display {
  display: block;
  width: 100%;
}

*.mathcal {
  /* NotoSans */
  font-feature-settings: 'ss01';
}

math .mathscr {
  font-family: "Temml";
}

mo.tml-prime {
  font-family: Temml;
}

/* Cramped superscripts in WebKit */
mfrac > :nth-child(2),
msqrt,
mover > :first-child {
  math-shift: compact
}

.menclose {
  display: inline-block;
  position: relative;
  padding: 0.5ex 0ex;
}
.tml-cancelto {
  display: inline-block;
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.5ex 0ex;
  background-color: currentColor;
  /* Use the SVG as an alpha mask (painted by background-color) */
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-position: 0 0;
          mask-position: 0 0;
}

@supports (-moz-appearance: none) {
  /* \vec w/o italic correction for Firefox */
  .tml-vec {
    transform: scale(0.75)
  }
  /* Fix \cancelto in Firefox */
  .ff-narrow {
    width: 0em;
  }
  .ff-nudge-left {
    margin-left: -0.2em;
  }
  /* Squash hidden mrows in \bordermatrix. Messes with centering, but necessary to squash. */
  .ff-squash mtd {
    display: block;
    height: 0;
  }
}

@supports (not (-moz-appearance: none)) {
  /* Chromium and WebKit */
  /* prime vertical alignment */
  mo.tml-prime {
    font-family: Temml;
  }
  /* Italic correction on superscripts */
  .tml-sml-pad {
    padding-left: 0.05em;
  }
  .tml-med-pad {
    padding-left: 0.10em;
  }
  .tml-lrg-pad {
    padding-left: 0.15em;
  }
}

@supports (-webkit-backdrop-filter: blur(1px)) {
  /* WebKit vertical & italic correction on accents */
  .wbk-acc {
    /* lower by x-height distance */
    transform: translate(0em, 0.431em);
  }
  .wbk-sml {
    transform: translate(0.07em, 0);
  }
  .wbk-sml-acc {
    transform: translate(0.07em, 0.431em);
  }
  .wbk-sml-vec {
    transform: scale(0.75) translate(0.07em, 0);
  }
  .wbk-med {
    transform: translate(0.14em, 0);
  }
  .wbk-med-acc {
    transform: translate(0.14em, 0.431em);
  }
  .wbk-med-vec {
    transform: scale(0.75) translate(0.14em, 0);
  }
  .wbk-lrg {
    transform: translate(0.21em, 0);
  }
  .wbk-lrg-acc {
    transform: translate(0.21em, 0.431em);
  }
  .wbk-lrg-vec {
    transform: scale(0.75) translate(0.21em, 0);
  }
}

/* \cancel & \phase use background images. Get them to print. */
menclose {
  -webkit-print-color-adjust: exact;  /* Chrome & Edge */
          print-color-adjust: exact;
}

/* Array cell justification in Firefox & WebKit */
.tml-right {
  text-align: right;
}
.tml-left {
  text-align: left;
}

/* For CD labels that grow to the left in Firefox and WebKit */
.tml-shift-left { margin-left:-200% }

<script id="DATA" type="application/json">{"slug":"sequential-learning","name":"Sequential Learning","lectures":[{"id":"sequential-learning-18","num":"18","file":"sequential-learning-01","kind":"lecture","title":"Sequential Learning — Part 1: Text Representations, From Discrete Symbols to Distributed Embeddings","h1":"Sequential Learning — Part 1: Text Representations","subtitle":"Text Representations, From Discrete Symbols to Distributed Embeddings","spineLabel":"Part 1","short":"Text Representations, From Discrete Symbols to Distributed…","instructor":"","html":"<div class=\"frontmatter\"><blockquote class=\"aside-quote\">\n<p>Instructor: <strong>Sayambhu Sen</strong>. Runtime 57:24. Built from the raw capture in <code>output/Lecture_18 - Module 6 Sequential Learning Part 1/</code> (150 raw frames), not <code>slides_deduped/</code> (83 images) — the\ndedup step is known to merge and drop distinct slides (see project memory <code>slides-deduped-is-lossy</code>).\nThe deck is a clean, self-contained five-part arc — nothing was found truncated or missing.</p>\n</blockquote>\n<hr>\n</div><section id=\"sequential-learning-18-s0\" data-title=\"What you'll understand after reading this\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">What you'll understand after reading this</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s0\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<ol>\n<li><strong>Tokenize text three different ways</strong> (word, subword/BPE, character) and explain exactly which\nproblem each one solves and which it creates.</li>\n<li><strong>Run Byte-Pair Encoding by hand</strong> on a small corpus and explain why GPT-2 and GPT-4 have\ndifferent vocabulary sizes as a direct consequence of this algorithm.</li>\n<li><strong>Build a Bag-of-Words and TF-IDF vector by hand</strong>, and explain in one sentence why TF-IDF\ndownweights &quot;the&quot; and upweights &quot;fish.&quot;</li>\n<li><strong>List all seven reasons discrete text representations fail</strong>, with a concrete example for each,\nand explain why they all trace back to one root cause.</li>\n<li><strong>Derive the Skip-Gram and CBOW objectives</strong>, explain why they're mirror images of each other,\nand explain why &quot;faster&quot; doesn't mean &quot;better&quot; when comparing them.</li>\n<li><strong>Explain negative sampling from first principles</strong> — why softmax over a 100K-word vocabulary is\ntoo expensive, and how turning the problem into K+1 binary classifications fixes it.</li>\n<li><strong>Derive why GloVe uses co-occurrence ratios instead of raw counts</strong>, and read a ratio table the\nway the lecture does.</li>\n<li><strong>Explain how FastText represents a word it has never seen</strong>, using character n-grams, and why\nthis makes it the only one of the three algorithms robust to typos.</li>\n<li><strong>Choose the right embedding method for a task</strong> — general embeddings, corpus-statistics\nanalysis, or noisy/morphologically rich text — and justify the choice.</li>\n</ol>\n<hr>\n</section><section id=\"sequential-learning-18-s1\" data-title=\"Before we start: what you need to know\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">Before we start: what you need to know</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s1\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>Prerequisite 1 — What a word embedding actually is</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Word embedding</strong> — a mapping from a word to a fixed-length vector of real numbers, chosen so\nthat words with similar meaning end up at nearby points in that vector space.</p>\n<p><em>In everyday words:</em> imagine giving every word in the English language a set of GPS coordinates.\n&quot;Cat&quot; and &quot;dog&quot; would sit close together (both pets, both animals); &quot;cat&quot; and &quot;refrigerator&quot; would\nsit far apart. The lecture spends its entire second half explaining how you'd <em>learn</em> those\ncoordinates from raw text, with no dictionary and no human labeling.</p>\n<p><em>Concretely:</em> a 300-dimensional embedding turns the word &quot;cat&quot; into something like\n<code>[0.21, -0.55, 0.83, 0.12, -0.41, ..., 0.67]</code> — 300 numbers, not a name.</p>\n<p><em>Why it exists:</em> every machine learning model needs numbers as input, not strings. The entire\nquestion this lecture answers is: <strong>what numbers, and chosen how?</strong></p>\n</blockquote>\n<h3>Prerequisite 2 — Cosine similarity</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Cosine similarity</strong> — a measure of how &quot;aligned&quot; two vectors are, ignoring their length.\nFormally <math data-tex=\"\\cos(\\theta) = \\dfrac{\\mathbf{a}\\cdot\\mathbf{b}}{\\|\\mathbf{a}\\|\\|\\mathbf{b}\\|}\"><mrow><mrow><mi>cos</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>θ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>𝐚</mi><mo>⋅</mo><mi>𝐛</mi></mrow><mrow><mi>‖</mi><mi>𝐚</mi><mi>‖</mi><mi>‖</mi><mi>𝐛</mi><mi>‖</mi></mrow></mfrac></mstyle></mrow></math>, ranging\nfrom <math data-tex=\"-1\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>1</mn></mrow></math> (opposite directions) through <math data-tex=\"0\"><mn>0</mn></math> (perpendicular, i.e. &quot;unrelated&quot;) to <math data-tex=\"1\"><mn>1</mn></math> (identical\ndirection, i.e. &quot;as similar as possible&quot;).</p>\n<p><em>In everyday words:</em> point two flashlights from the same spot. If they point in the same\ndirection, similarity is high, regardless of how bright either one is.</p>\n<p><em>Concretely:</em> <math data-tex=\"\\mathbf{a} = [1, 0]\"><mrow><mi>𝐚</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, <math data-tex=\"\\mathbf{b} = [0, 1]\"><mrow><mi>𝐛</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>. Dot product <math data-tex=\"= 1\\times0 + 0\\times1 = 0\"><mrow><mo>=</mo><mn>1</mn><mo>×</mo><mn>0</mn><mo>+</mo><mn>0</mn><mo>×</mo><mn>1</mn><mo>=</mo><mn>0</mn></mrow></math>.\nCosine similarity <math data-tex=\"= 0\"><mrow><mo>=</mo><mn>0</mn></mrow></math> — perpendicular, i.e. &quot;no relationship.&quot; This exact calculation is why\none-hot vectors are useless for meaning: <strong>any two distinct one-hot vectors have a dot product of\nzero</strong>, no matter which two words they represent.</p>\n<p><em>Why it exists:</em> it's the standard way to ask &quot;how similar are these two vectors&quot; without caring\nwhether one of them just happens to be a bigger number (e.g. because a document is longer).</p>\n</blockquote>\n<h3>Prerequisite 3 — What a neural network's &quot;hidden layer&quot; does, minimally</h3>\n<p>You don't need the full theory of deep networks for this lecture (that's Module 2), but Word2Vec is\ndescribed as &quot;a simple neural network,&quot; so you need this much: a neural network layer is a matrix\nmultiplication. If <math data-tex=\"W\"><mi>W</mi></math> is a <math data-tex=\"|V| \\times d\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi><mo>×</mo><mi>d</mi></mrow></math> matrix (one row of <math data-tex=\"d\"><mi>d</mi></math> numbers per vocabulary word) and\nyou multiply a one-hot vector for word <math data-tex=\"w\"><mi>w</mi></math> by <math data-tex=\"W\"><mi>W</mi></math>, you get back exactly <strong>row <math data-tex=\"w\"><mi>w</mi></math> of <math data-tex=\"W\"><mi>W</mi></math></strong> — nothing\nmore. This trivial fact is the entire mechanism behind &quot;looking up an embedding&quot;: the embedding\n<em>is</em> a row of a matrix, and training the network <em>is</em> adjusting those rows until they encode\nmeaning.</p>\n<h3>Prerequisite 4 — Logarithms, briefly</h3>\n<p>Several formulas here use <math data-tex=\"\\log\"><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></math>. All you need: <math data-tex=\"\\log\"><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow></math> turns very large or very small numbers into\na manageable, roughly linear scale, and <math data-tex=\"\\log(1) = 0\"><mrow><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math>. So <math data-tex=\"\\text{idf}(t) = \\log(N/n_t)\"><mrow><mtext>idf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>N</mi><mi>/</mi><msub><mi>n</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> is <strong>zero</strong>\nexactly when a term appears in <em>every</em> document (<math data-tex=\"n_t = N\"><mrow><msub><mi>n</mi><mi>t</mi></msub><mo>=</mo><mi>N</mi></mrow></math>) — the formula is built so that\n&quot;appears everywhere&quot; mathematically means &quot;contributes nothing.&quot;</p>\n<hr>\n</section><section id=\"sequential-learning-18-s2\" data-title=\"The big picture\" data-kind=\"content\"><h2>\n      \n      <span class=\"sec-t\">The big picture</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s2\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>This lecture answers one question, in five acts: <strong>how do you turn a word into numbers a model can\nlearn from?</strong></p>\n<p>Act 1 (Preprocessing) gets raw text into clean, comparable units — tokens. Acts 2–3 (Discrete\nRepresentations, then their Limitations) show the <em>obvious</em> first answer — count things, one-hot\nthem — and then systematically demolish it: every discrete scheme turns out to lose similarity,\nword order, or both. Acts 4–5 (Distributed Representations: Word2Vec, then GloVe &amp; FastText) show\nthe fix that dominates the field from 2013 onward: <strong>stop hand-designing the vector, and learn it\nfrom data instead</strong>, using the assumption that words appearing in similar contexts must mean\nsimilar things.</p>\n<figure class=\"ascii\"><pre>Raw text\n   │\n   ▼\n[Part 1] Preprocessing ── tokenize → lowercase → stem/lemmatize → remove stopwords\n   │\n   ▼\n[Part 2] Discrete representations ── One-Hot → Bag-of-Words → TF-IDF → N-grams\n   │            (sparse, |V| dimensions, no notion of similarity)\n   ▼\n[Part 3] Why discrete fails ── 7 named failure modes, all downstream of &quot;no similarity&quot;\n   │\n   ▼\n[Part 4] Distributed representations ── Word2Vec: Skip-Gram &amp; CBOW, negative sampling\n   │            (dense, ~100-300 dimensions, cosine similarity actually means something)\n   ▼\n[Part 5] GloVe &amp; FastText ── global co-occurrence statistics, subword robustness to OOV\n   │\n   ▼\nModern era: contextual embeddings (ELMo/BERT/GPT) — not covered here, named in the closing timeline</pre></figure>\n<p>Every later lecture in this course that touches text (sequence models, LLMs) assumes you already\nhave some numeric representation of a word sitting at the input. This lecture is where that\nrepresentation comes from.</p>\n<hr>\n</section><section id=\"sequential-learning-18-s3\" data-title=\"Tokenization — turning a string into units\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">1</span>\n      <span class=\"sec-t\">Tokenization — turning a string into units</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s3\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>Tokenization</strong> — segmenting raw text into discrete units, called tokens, that a model will treat\nas its atomic vocabulary.</p>\n<p><em>In everyday words:</em> deciding what counts as &quot;one thing.&quot; Is &quot;don't&quot; one token or two? Is\n&quot;COVID-19&quot; one token or three? Tokenization is the set of rules that answers these questions\nconsistently.</p>\n<p><em>Why it exists:</em> every downstream representation in this lecture (one-hot, BoW, TF-IDF, Word2Vec)\nstarts from a fixed list of tokens. Get the tokenization wrong and every later step inherits the\nmistake.</p>\n</blockquote>\n<p>The lecture presents three levels [slide 7]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Level</th>\n<th>Example</th>\n<th>What it captures</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Word-level</strong></td>\n<td><code>&quot;The cat sat on the mat.&quot;</code> → <code>[&quot;The&quot;, &quot;cat&quot;, &quot;sat&quot;, &quot;on&quot;, &quot;the&quot;, &quot;mat&quot;, &quot;.&quot;]</code></td>\n<td>Whole words, split on whitespace/punctuation</td>\n</tr>\n<tr>\n<td><strong>Subword (BPE)</strong></td>\n<td><code>&quot;lowest&quot;</code> → <code>[&quot;low&quot;, &quot;est&quot;]</code></td>\n<td>Word <em>pieces</em> — handles words never seen during training</td>\n</tr>\n<tr>\n<td><strong>Character-level</strong></td>\n<td><code>&quot;hello&quot;</code> → <code>[&quot;h&quot;, &quot;e&quot;, &quot;l&quot;, &quot;l&quot;, &quot;o&quot;]</code></td>\n<td>Individual characters</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is a trade-off, not a ranking.</strong> Word-level tokens are the most\nsemantically meaningful unit but produce huge vocabularies and can't handle a word the tokenizer\nhas never seen (the <strong>out-of-vocabulary</strong>, or <strong>OOV</strong>, problem — this comes back as failure #7 in\nPart 3). Character-level tokens can represent <em>any</em> string with a tiny vocabulary (~100 characters)\nbut produce very long sequences and lose word-level meaning entirely. <strong>Subword tokenization is the\nengineered middle ground</strong> every modern large language model actually uses.</p>\n</aside>\n<h3>Worked example — Byte Pair Encoding (BPE)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Byte Pair Encoding (BPE)</strong> — an algorithm that builds a subword vocabulary by starting from\nindividual characters and iteratively merging the most frequent adjacent pair into a new token.</p>\n<p><em>Why it exists:</em> you want a vocabulary that's word-like for common words (so &quot;the&quot; is one token,\nnot four) but can still fall back to smaller pieces for rare or unseen words (so &quot;unhappiness&quot; can\nbe built from &quot;un&quot; + &quot;happi&quot; + &quot;ness&quot; even if the whole word never appeared during training).</p>\n</blockquote>\n<p>The algorithm [slide 10]:</p>\n<ol>\n<li>Initialize vocabulary = all individual characters</li>\n<li>Count all adjacent token pairs in the corpus</li>\n<li>Merge the most frequent pair → new token</li>\n<li>Repeat until desired vocabulary size is reached</li>\n</ol>\n<p>🧪 <strong>Worked example</strong> — corpus <code>&quot;low lower lowest&quot;</code>, starting from characters:</p>\n<pre class=\"code\"><code>Start:  l  o  w  ␣  l  o  w  e  r  ␣  l  o  w  e  s  t</code></pre>\n<ul>\n<li>Round 1: the pair <code>(&quot;l&quot;, &quot;o&quot;)</code> is the most frequent adjacent pair (appears 3 times, once per\nword). Merge → new token <code>&quot;lo&quot;</code>.</li>\n<li>Round 2: now <code>(&quot;lo&quot;, &quot;w&quot;)</code> is most frequent (still 3 times). Merge → new token <code>&quot;low&quot;</code>.</li>\n<li>Continue: eventually <code>(&quot;e&quot;, &quot;r&quot;)</code> merges to <code>&quot;er&quot;</code>, and so on, until the vocabulary reaches its\ntarget size.</li>\n</ul>\n<p>The slide's shorthand for this: <code>(&quot;l&quot;,&quot;o&quot;) → &quot;lo&quot; → (&quot;lo&quot;,&quot;w&quot;) → &quot;low&quot; → ...</code> [slide 10].</p>\n<aside class=\"callout callout-bg\"><p class=\"callout-h\"><span class=\"callout-badge\">📚</span>Background</p><p><strong>Background the slide assumed — why vocabulary size is a design choice, not a fact.</strong> You stop\nmerging whenever you hit a target vocabulary size, and that target is a <strong>hyperparameter</strong> chosen\nby whoever trains the tokenizer. This is exactly why <strong>GPT-2 uses ~50,257 tokens</strong> and <strong>GPT-4 uses\n~100,258 tokens</strong> [slide 10] — they are BPE vocabularies trained with different stopping points\n(and different training corpora), not two different mathematical objects. A bigger BPE vocabulary\nmeans: more common words get their own single token (shorter sequences, cheaper to process) at the\ncost of a bigger embedding table to store.</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Where people get confused.</strong> BPE does <em>not</em> care about linguistic correctness — it does not\nknow &quot;est&quot; is an English superlative suffix. It only tracks raw co-occurrence frequency. It merges\n&quot;est&quot; because the <em>characters</em> e-s-t happen to co-occur often in this corpus, not because it\nunderstands grammar. That it often <em>lands</em> on linguistically sensible units (like &quot;est&quot; as a\nsuffix) is an emergent, statistical accident, not a designed rule.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-18-0\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;BPE Merge Walkthrough&quot;,&quot;concept&quot;:&quot;Byte Pair Encoding vocabulary construction&quot;,&quot;control&quot;:&quot;Step through merge rounds one at a time on a small toy corpus&quot;,&quot;observe&quot;:&quot;The token boundaries redraw after each merge; frequency counts update live&quot;,&quot;insight&quot;:&quot;Vocabulary size and \\&quot;wordiness\\&quot; are a dial, not a fixed property of the language&quot;,&quot;fallback&quot;:&quot;The static worked example above (low/lower/lowest merging into lo → low → er) shows the same three rounds by hand.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">BPE Merge Walkthrough</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Byte Pair Encoding vocabulary construction</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through merge rounds one at a time on a small toy corpus</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>The token boundaries redraw after each merge; frequency counts update live</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Vocabulary size and \"wordiness\" are a dial, not a fixed property of the language</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The static worked example above (low/lower/lowest merging into lo → low → er) shows the same three rounds by hand.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-18-s4\" data-title=\"Stemming vs. Lemmatization\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">2</span>\n      <span class=\"sec-t\">Stemming vs. Lemmatization</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s4\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Both reduce a word to a &quot;base&quot; form so that, e.g., &quot;walking&quot; and &quot;walked&quot; can be treated as the same\nunderlying concept — but they do it very differently [slide 23]:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Stemming</strong> (Porter, 1980)</th>\n<th><strong>Lemmatization</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>What it does</td>\n<td>Strips suffixes with fixed rules → root form</td>\n<td>Returns the dictionary form (<strong>lemma</strong>), context-aware</td>\n</tr>\n<tr>\n<td>Validity of output</td>\n<td>May <strong>not</strong> be a real word</td>\n<td>Always a valid word</td>\n</tr>\n<tr>\n<td>Speed</td>\n<td>Fast, no context needed</td>\n<td>Slower — uses part-of-speech tags</td>\n</tr>\n<tr>\n<td>Examples</td>\n<td><code>&quot;walking&quot;→&quot;walk&quot;</code> ✓ · <code>&quot;argued&quot;→&quot;argu&quot;</code> ✗ · <code>&quot;universal&quot;→&quot;univers&quot;</code> ✗</td>\n<td><code>&quot;better&quot;→&quot;good&quot;</code> ✓ · <code>&quot;ran&quot;→&quot;run&quot;</code> ✓ · <code>&quot;am/are/is&quot;→&quot;be&quot;</code> ✓</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote class=\"aside-quote\">\n<p><strong>Stemming</strong> — chopping off word endings using hand-written suffix-stripping rules (e.g. drop\n&quot;-ing&quot;, drop &quot;-ed&quot;), with no guarantee the result is a real word.</p>\n<p><em>In everyday words:</em> a blunt pair of scissors that always cuts at roughly the same spot on every\nword, regardless of what the word actually is.</p>\n<p><em>Why it exists:</em> it's cheap (no dictionary lookups, no grammar model) and, for many downstream\ntasks (e.g. building a bag-of-words for search), the exact surface form doesn't matter — you just\nneed &quot;argue,&quot; &quot;argued,&quot; and &quot;arguing&quot; to collapse to <em>the same token</em>, even if that token is the\nnonsense string &quot;argu.&quot;</p>\n</blockquote>\n<blockquote class=\"aside-quote\">\n<p><strong>Lemmatization</strong> — mapping a word to its dictionary headword, using knowledge of part-of-speech\nand irregular forms.</p>\n<p><em>In everyday words:</em> a linguist who actually knows &quot;ran&quot; is the past tense of &quot;run&quot; and &quot;better&quot; is\nthe comparative of &quot;good,&quot; and returns the correct root instead of a mechanical guess.</p>\n<p><em>Why it exists:</em> whenever the output itself needs to be readable, or the task needs to distinguish\n&quot;worse&quot; (comparative of &quot;bad&quot;) from a stem-mangled non-word, lemmatization's slower, dictionary-\nand grammar-aware approach is worth the cost.</p>\n</blockquote>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview framing.</strong> &quot;Stemming is fast and rule-based but can produce invalid words; lemmatization\nis slower and dictionary/POS-based but always returns a real word. Use stemming when speed matters\nmore than readability (e.g., building an inverted search index); use lemmatization whenever the\noutput is shown to a human or fed into something that needs valid words (e.g., a downstream\nlanguage model).&quot;</p>\n</aside>\n<h3>The full preprocessing pipeline, traced on one real sentence</h3>\n<p>The lecture runs an interactive demo on the sentence <em>&quot;The universities and organizations were\nuniversally arguing about fishing policies&quot;</em> [slide 34], and the pipeline stages compound in this\norder:</p>\n<figure class=\"ascii\"><pre>Raw Input   &quot;The universities and organizations were universally arguing about fishing policies.&quot;\n   │  tokenize\n   ▼\nTokenization   [The, universities, and, organizations, were, universally, arguing, about, fishing, policies, .]   — 11 tokens\n   │  lowercase\n   ▼\nLowercasing    [the, universities, and, ...]                                                       — 11 tokens, &quot;The&quot;=&quot;the&quot; now\n   │  strip punctuation\n   ▼\nPunctuation Removal   [the, universities, and, organizations, were, universally, arguing, about, fishing, policies]  — 10 tokens\n   │  drop function words\n   ▼\nStop Word Removal   [universities, organizations, universally, arguing, fishing, policies]         — 6 content words remain</pre></figure>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — order matters, and each stage narrows what the next stage can see.</strong> You must\ntokenize before you can lowercase individual tokens; you must remove punctuation before stop-word\nremoval (<code>&quot;.&quot;</code> isn't a stop word, it's punctuation — a different filter); and stemming/lemmatization\nis applied <em>last</em>, to the already-cleaned content words, so a stemmer never has to deal with\ncapitalization or trailing punctuation. Getting the order wrong (e.g. stemming before lowercasing)\nsilently produces two different stems for &quot;Fishing&quot; and &quot;fishing.&quot;</p>\n</aside>\n<blockquote class=\"aside-quote\">\n<p><strong>Stop word</strong> — an extremely common function word (the, and, of, is, ...) that carries little\ntopic-specific meaning and is often removed before building a discrete text representation.</p>\n<p><em>Why it exists:</em> stop words appear in almost every document, so they add noise to similarity and\nfrequency-based representations without adding information about <em>what a document is about</em>. Note\n— this is also exactly the intuition TF-IDF formalizes mathematically in <a class=\"xref\" data-xref-lec=\"sequential-learning-18\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a> below, rather than\nhandling it with a hand-written stopword list.</p>\n</blockquote>\n<figure class=\"iv\" id=\"iv-sequential-learning-18-1\" data-iv=\"{&quot;type&quot;:&quot;animation&quot;,&quot;title&quot;:&quot;Preprocessing Pipeline, Stage by Stage&quot;,&quot;concept&quot;:&quot;The five-stage NLP preprocessing pipeline&quot;,&quot;control&quot;:&quot;Step through Raw → Tokenize → Lowercase → Strip Punctuation → Remove Stopwords → Stem/Lemmatize&quot;,&quot;observe&quot;:&quot;Tokens highlight, gray out, or transform at each stage; a running token count updates&quot;,&quot;insight&quot;:&quot;Preprocessing is a strict pipeline where each stage's output is the next stage's only input — order is not arbitrary&quot;,&quot;fallback&quot;:&quot;The traced example above walks the same five stages on one real sentence with an explicit token count at each step.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · animation</span>\n      <span class=\"iv-title\">Preprocessing Pipeline, Stage by Stage</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>The five-stage NLP preprocessing pipeline</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through Raw → Tokenize → Lowercase → Strip Punctuation → Remove Stopwords → Stem/Lemmatize</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Tokens highlight, gray out, or transform at each stage; a running token count updates</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Preprocessing is a strict pipeline where each stage's output is the next stage's only input — order is not arbitrary</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The traced example above walks the same five stages on one real sentence with an explicit token count at each step.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-18-s5\" data-title=\"Discrete Representations\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">3</span>\n      <span class=\"sec-t\">Discrete Representations</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">9 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-18-s5\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>With clean tokens in hand, Part 2 asks: how do we turn a <em>token</em> into a <em>number</em>? The lecture builds\nup four schemes in order of sophistication, each one patching a flaw in the last — while foreshadowing\nthat all four still share one fatal flaw, addressed fully in Part 3.</p>\n<h3>3.1 One-Hot Encoding</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>One-hot encoding</strong> — representing each word as a binary vector of length <math data-tex=\"|V|\"><mrow><mi>|</mi><mi>V</mi><mi>|</mi></mrow></math> (the vocabulary\nsize), with a single 1 at that word's assigned index and 0s everywhere else.</p>\n<p><em>In everyday words:</em> giving every word its own numbered locker, and representing the word as &quot;the\nlocker is open&quot; (1) vs. &quot;every other locker is closed&quot; (0).</p>\n<p><em>Concretely</em> [slide 41], with <math data-tex=\"V = \\{\\text{cat}, \\text{dog}, \\text{fish}, \\text{bird}\\}\"><mrow><mi>V</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mtext>cat</mtext><mo separator=\"true\">,</mo><mtext>dog</mtext><mo separator=\"true\">,</mo><mtext>fish</mtext><mo separator=\"true\">,</mo><mtext>bird</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>:\n<math data-tex=\"\\text{cat}=[1,0,0,0]\"><mrow><mtext>cat</mtext><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,0,0,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, <math data-tex=\"\\text{dog}=[0,1,0,0]\"><mrow><mtext>dog</mtext><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1,0,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, <math data-tex=\"\\text{fish}=[0,0,1,0]\"><mrow><mtext>fish</mtext><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,0,1,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>, <math data-tex=\"\\text{bird}=[0,0,0,1]\"><mrow><mtext>bird</mtext><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,0,0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math>.</p>\n</blockquote>\n<aside class=\"callout callout-lab\"><p class=\"callout-h\"><span class=\"callout-badge\">🧪</span>Worked example</p><p><strong>Worked example — why this breaks similarity.</strong> Take the dot product of &quot;cat&quot; and &quot;dog&quot;:\n<math data-tex=\"[1,0,0,0]\\cdot[0,1,0,0] = 1\\times0+0\\times1+0\\times0+0\\times0 = 0\"><mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,0,0,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1,0,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>1</mn><mo>×</mo><mn>0</mn><mo>+</mo><mn>0</mn><mo>×</mo><mn>1</mn><mo>+</mo><mn>0</mn><mo>×</mo><mn>0</mn><mo>+</mo><mn>0</mn><mo>×</mo><mn>0</mn><mo>=</mo><mn>0</mn></mrow></math>. Cosine similarity is therefore\n<math data-tex=\"\\cos(\\text{cat},\\text{dog}) = 0\"><mrow><mrow><mi>cos</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>cat</mtext><mo separator=\"true\">,</mo><mtext>dog</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow></math>. Now compute <math data-tex=\"\\cos(\\text{cat},\\text{refrigerator})\"><mrow><mrow><mi>cos</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>cat</mtext><mo separator=\"true\">,</mo><mtext>refrigerator</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> — also <math data-tex=\"0\"><mn>0</mn></math>,\nby the exact same reasoning, since <em>any</em> two distinct one-hot vectors are orthogonal by\nconstruction. <strong>Every word is equidistant from every other word</strong> [slide 41] — the representation\nmathematically cannot tell you that &quot;cat&quot; is more related to &quot;dog&quot; than to &quot;refrigerator.&quot;</p>\n</aside>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This isn't a tuning problem — it's structural.</strong> No matter how you assign locker numbers, one-\nhot vectors are always mutually orthogonal, by the definition of &quot;one 1, rest 0s.&quot; This is the seed\nof every limitation covered formally in Part 3.</p>\n</aside>\n<h3>3.2 Bag of Words (BoW)</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Bag of Words</strong> — representing a <em>document</em> (not just a word) as a vector counting how many times\neach vocabulary word appears in it, discarding word order entirely.</p>\n<p><em>In everyday words:</em> dumping every word from a document into a bag, then only reporting the count\nof each word type — like a grocery receipt with quantities but no purchase order.</p>\n</blockquote>\n<p>🧪 <strong>Worked example</strong> [slide 44]:</p>\n<ul>\n<li>Doc 1: <em>&quot;John likes to watch movies&quot;</em></li>\n<li>Doc 2: <em>&quot;Mary also likes to watch football&quot;</em></li>\n<li>Vocabulary: <code>[John, likes, to, watch, movies, Mary, also, football]</code></li>\n<li>Doc 1 = <code>[1, 1, 1, 1, 1, 0, 0, 0]</code></li>\n<li>Doc 2 = <code>[0, 1, 1, 1, 0, 1, 1, 1]</code></li>\n</ul>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Fatal flaw: word order is lost.</strong> &quot;Dog bites man&quot; and &quot;Man bites dog&quot; produce the <em>identical</em>\nBoW vector [slide 44] — completely different meanings (one is mundane, the other newsworthy),\nmapped to the same representation. Note this is a <em>different</em> failure from one-hot's &quot;no\nsimilarity&quot; problem — BoW does let you compare two documents by their overlapping words, but it\nthrows away structure within each document.</p>\n</aside>\n<h3>3.3 TF-IDF</h3>\n<p>BoW's raw counts have a subtler problem: a word like &quot;the&quot; gets a huge count in every document,\ndrowning out the words that actually distinguish one document from another. TF-IDF fixes this.</p>\n<blockquote class=\"aside-quote\">\n<p><strong>TF-IDF (Term Frequency × Inverse Document Frequency)</strong> — a weighting scheme where a term gets a\nhigh score exactly when it's <strong>frequent in this document but rare across the corpus</strong>.</p>\n<p><em>Why it exists:</em> raw counts can't distinguish &quot;important to this document&quot; from &quot;common in\nEnglish.&quot; TF-IDF is a formula that mathematically encodes &quot;distinctive,&quot; not just &quot;frequent.&quot;</p>\n</blockquote>\n<p>The words say it before the symbols do: <strong>term frequency measures how much this document talks\nabout the word; inverse document frequency measures how rare that word is corpus-wide; multiplying\nthem rewards words that are both.</strong></p>\n<div class=\"mblk bound\"><math data-tex=\"\\text{tf}(t,d) = \\frac{f(t,d)}{|d|} \\qquad \\text{idf}(t) = \\log\\!\\left(\\frac{N}{n_t}\\right) \\qquad \\text{tfidf}(t,d) = \\text{tf}(t,d)\\times \\text{idf}(t)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>tf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mi>|</mi><mi>d</mi><mi>|</mi></mrow></mfrac><mspace width=\"2em\"></mspace><mtext>idf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mrow style=\"margin-left:-0.1667em;\"></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mi>N</mi><msub><mi>n</mi><mi>t</mi></msub></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mspace width=\"2em\"></mspace><mtext>tfidf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>tf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>×</mo><mtext>idf</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"f(t,d)\"><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>&quot;count of <math data-tex=\"t\"><mi>t</mi></math> in <math data-tex=\"d\"><mi>d</mi></math>&quot;</td>\n<td>Raw occurrences of term <math data-tex=\"t\"><mi>t</mi></math> in document <math data-tex=\"d\"><mi>d</mi></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\lvert d\\rvert\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">|</mo><mi>d</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">|</mo></mrow></math></td>\n<td>&quot;length of <math data-tex=\"d\"><mi>d</mi></math>&quot;</td>\n<td>Total number of tokens in document <math data-tex=\"d\"><mi>d</mi></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"N\"><mi>N</mi></math></td>\n<td>&quot;corpus size&quot;</td>\n<td>Total number of documents in the corpus</td>\n</tr>\n<tr>\n<td><math data-tex=\"n_t\"><msub><mi>n</mi><mi>t</mi></msub></math></td>\n<td>&quot;document frequency of <math data-tex=\"t\"><mi>t</mi></math>&quot;</td>\n<td>Number of documents containing term <math data-tex=\"t\"><mi>t</mi></math> at least once</td>\n</tr>\n</tbody>\n</table></div>\n<p>🧪 <strong>Worked example</strong> [slides 50, 53] — corpus of 1000 documents, document <math data-tex=\"d =\"><mrow><mi>d</mi><mo>=</mo></mrow></math> <em>&quot;cat cat dog cat\nfish&quot;</em> (5 tokens):</p>\n<ul>\n<li><strong>&quot;cat&quot;</strong>: appears 3 times in <math data-tex=\"d\"><mi>d</mi></math>, appears in 100 documents corpus-wide.\n<math data-tex=\"\\text{tf} = 3/5 = 0.6\"><mrow><mtext>tf</mtext><mo>=</mo><mn>3</mn><mi>/</mi><mn>5</mn><mo>=</mo><mn>0.6</mn></mrow></math>. <math data-tex=\"\\text{idf} = \\log(1000/100) = \\log(10) = 2.30\"><mrow><mtext>idf</mtext><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1000</mn><mi>/</mi><mn>100</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>10</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2.30</mn></mrow></math>.\n<math data-tex=\"\\text{tfidf} = 0.6 \\times 2.30 = \\mathbf{1.38}\"><mrow><mtext>tfidf</mtext><mo>=</mo><mn>0.6</mn><mo>×</mo><mn>2.30</mn><mo>=</mo><mn>𝟏.𝟑𝟖</mn></mrow></math>.</li>\n<li><strong>&quot;the&quot;</strong>: appears in 990 of 1000 documents (almost everywhere).\n<math data-tex=\"\\text{idf} = \\log(1000/990) \\approx 0.01 \\approx 0\"><mrow><mtext>idf</mtext><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1000</mn><mi>/</mi><mn>990</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>0.01</mn><mo>≈</mo><mn>0</mn></mrow></math>, so <math data-tex=\"\\text{tfidf}\\approx 0\"><mrow><mtext>tfidf</mtext><mo>≈</mo><mn>0</mn></mrow></math> regardless of tf —\n<strong>suppressed</strong>.</li>\n<li><strong>&quot;fish&quot;</strong>: appears once in <math data-tex=\"d\"><mi>d</mi></math>, appears in only 5 documents corpus-wide.\n<math data-tex=\"\\text{tf} = 1/5 = 0.2\"><mrow><mtext>tf</mtext><mo>=</mo><mn>1</mn><mi>/</mi><mn>5</mn><mo>=</mo><mn>0.2</mn></mrow></math>. <math data-tex=\"\\text{idf} = \\log(1000/5) = \\log(200) = 5.30\"><mrow><mtext>idf</mtext><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1000</mn><mi>/</mi><mn>5</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>200</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>5.30</mn></mrow></math>.\n<math data-tex=\"\\text{tfidf} = 0.2 \\times 5.30 = \\mathbf{1.06}\"><mrow><mtext>tfidf</mtext><mo>=</mo><mn>0.2</mn><mo>×</mo><mn>5.30</mn><mo>=</mo><mn>𝟏.𝟎𝟔</mn></mrow></math> — high, because &quot;fish&quot; is <em>rare</em> even though it\nappeared only once.</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight.</strong> &quot;The&quot; appears far more often in <math data-tex=\"d\"><mi>d</mi></math> (implicitly, in real text) than &quot;fish,&quot; but\nends up with essentially <em>zero</em> weight, while rare-but-present &quot;fish&quot; gets a high score. <strong>Common\nwords → idf ≈ 0 → weight suppressed. Rare, topical words → idf high → weight boosted</strong> [slide 50]\n— this is the formula doing exactly what its plain-English description promised.</p>\n</aside>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview check</strong> [slide 57] — corpus of 1000 docs, term &quot;neural&quot; appears in 10 docs; in\ndocument <math data-tex=\"d\"><mi>d</mi></math>, &quot;neural&quot; appears 4 times out of 20 tokens. What's the TF-IDF weight?</p>\n<div class=\"recall\" data-recall>\n      <button class=\"recall-q\" type=\"button\">\n        <span class=\"recall-n\">Q</span>\n        <span class=\"recall-t\">Work it, then check</span>\n        <span class=\"recall-x\">Reveal</span>\n      </button>\n      <div class=\"recall-a\" hidden>\n<p><math data-tex=\"\\text{tf} = 4/20 = 0.2\"><mrow><mtext>tf</mtext><mo>=</mo><mn>4</mn><mi>/</mi><mn>20</mn><mo>=</mo><mn>0.2</mn></mrow></math>. <math data-tex=\"\\text{idf} = \\log(1000/10) = \\log(100) = 2.0\"><mrow><mtext>idf</mtext><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1000</mn><mi>/</mi><mn>10</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mi>log</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>100</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>2.0</mn></mrow></math> (using <math data-tex=\"\\log_{1
