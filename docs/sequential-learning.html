mi>t</mi><mo>=</mo><mn>1</mn></mrow></math>:</p>\n<div class=\"mblk\"><math data-tex=\"\\text{Signal at } t{=}10 = W_h \\times W_h \\times \\cdots \\times W_h \\quad (9 \\text{ multiplications})\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Signal at </mtext><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>10</mn><mo>=</mo><msub><mi>W</mi><mi>h</mi></msub><mo>×</mo><msub><mi>W</mi><mi>h</mi></msub><mo>×</mo><mo>⋯</mo><mo>×</mo><msub><mi>W</mi><mi>h</mi></msub><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>9</mn><mtext> multiplications</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\text{Gradient magnitude} = 0.70^9 \\approx \\mathbf{0.040}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Gradient magnitude</mtext><mo>=</mo><msup><mn>0.70</mn><mn>9</mn></msup><mo>≈</mo><mn>𝟎.𝟎𝟒𝟎</mn></mrow></math></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight.</strong> <em>&quot;Each cell multiplies by <math data-tex=\"|W_h|\"><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><mi>|</mi></mrow></math>. If <math data-tex=\"|W_h| &lt; 1\"><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><mi>|</mi><mo>&lt;</mo><mn>1</mn></mrow></math>, the signal decays\nexponentially&quot;</em> [slide 30]. After just 9 repeated multiplications, the gradient has shrunk to <strong>4%</strong>\nof its original magnitude — meaning a training signal trying to teach the network something about\ntoken 1 based on an error at token 10 arrives almost entirely destroyed. The demo's own caption:\n<em>&quot;Medium sequences: gradient is weak but non-zero. LSTMs help but don't fully solve this&quot;</em> [slide\n30] — LSTMs' gating mechanism slows the decay but the exponential shrinkage is structural to any\narchitecture that must multiply through every timestep.</p>\n</aside>\n<aside class=\"callout callout-bg\"><p class=\"callout-h\"><span class=\"callout-badge\">📚</span>Background</p><p><strong>Background the slide names directly</strong> [slide 30]: <em>&quot;LSTM solution: the cell state path\n<math data-tex=\"c_t = f\\odot c_{t-1} + i\\odot g\"><mrow><msub><mi>c</mi><mi>t</mi></msub><mo>=</mo><mi>f</mi><mo>⊙</mo><msub><mi>c</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>+</mo><mi>i</mi><mo>⊙</mo><mi>g</mi></mrow></math> avoids this repeated <math data-tex=\"W\"><mi>W</mi></math> multiplication — gradients flow through\naddition, not matrix products.&quot;</em> This is <em>why</em> LSTMs are less prone to vanishing gradients than\nplain RNNs — but note the demo's own conclusion is that this mitigates, not eliminates, the problem.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-19-1\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;The Vanishing Gradient, Forward and Backward&quot;,&quot;concept&quot;:&quot;Why repeated multiplication by a sub-1 weight destroys long-range gradient signal&quot;,&quot;control&quot;:&quot;Three sliders — Sequence Length (tokens), Decay Factor $|W_h|$, Animation Speed — plus \\&quot;Forward Pass,\\&quot; \\&quot;Backward Pass,\\&quot; and \\&quot;Run Forward\\&quot;/\\&quot;Run Backward\\&quot; buttons&quot;,&quot;observe&quot;:&quot;A chain of ten token cells ($t{=}1 \\\\ldots t{=}10$) lights up step by step. Forward Pass animates left to right (information flow); Backward Pass animates right to left (gradient flow) and prints the surviving gradient magnitude under every cell: **1.00, 0.70, 0.49, 0.34, 0.24, 0.17, 0.12, 0.08, 0.06, 0.04** reading from $t{=}10$ back to $t{=}1$ — each step exactly one more multiplication by $|W_h|=0.70$&quot;,&quot;insight&quot;:&quot;The decay isn't a training artifact or a bug in one particular run — dragging the Decay Factor slider below 1 reproduces the same geometric shrinkage at any sequence length, which is the whole point of $|\\\\lambda_{max}(W)|&lt;1 \\\\Rightarrow$ exponential vanishing. Dragging it above 1 produces the mirror-image failure (exploding gradients), which the slide's own caption doesn't animate but the same chain-rule product explains&quot;,&quot;fallback&quot;:&quot;The worked example above already gives the $t{=}1$ endpoint exactly ($0.70^9\\\\approx\\\\mathbf{0.040}$); the demo's own backward-pass readout confirms every intermediate step matches the same $0.70^k$ formula ($k=0\\\\ldots9$), captured directly from `slide_030.jpg` (forward-pass state) and `slide_031.jpg` (backward-pass state, showing the full per-cell decay chain: 1.00 → 0.70 → 0.49 → 0.34 → 0.24 → 0.17 → 0.12 → 0.08 → 0.06 → 0.04).&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">The Vanishing Gradient, Forward and Backward</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why repeated multiplication by a sub-1 weight destroys long-range gradient signal</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Three sliders — Sequence Length (tokens), Decay Factor <math><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><mi>|</mi></mrow></math>, Animation Speed — plus \"Forward Pass,\" \"Backward Pass,\" and \"Run Forward\"/\"Run Backward\" buttons</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>A chain of ten token cells (<math><mrow><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn><mo>…</mo><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>10</mn></mrow></math>) lights up step by step. Forward Pass animates left to right (information flow); Backward Pass animates right to left (gradient flow) and prints the surviving gradient magnitude under every cell: **1.00, 0.70, 0.49, 0.34, 0.24, 0.17, 0.12, 0.08, 0.06, 0.04** reading from <math><mrow><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>10</mn></mrow></math> back to <math><mrow><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn></mrow></math> — each step exactly one more multiplication by <math><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><mi>|</mi><mo>=</mo><mn>0.70</mn></mrow></math></dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>The decay isn't a training artifact or a bug in one particular run — dragging the Decay Factor slider below 1 reproduces the same geometric shrinkage at any sequence length, which is the whole point of <math><mrow><mi>|</mi><msub><mi>λ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>W</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>|</mi><mo>&lt;</mo><mn>1</mn><mo stretchy=\"false\">⇒</mo></mrow></math> exponential vanishing. Dragging it above 1 produces the mirror-image failure (exploding gradients), which the slide's own caption doesn't animate but the same chain-rule product explains</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The worked example above already gives the <math><mrow><mi>t</mi><mo lspace=\"0em\" rspace=\"0em\">=</mo><mn>1</mn></mrow></math> endpoint exactly (<math><mrow><msup><mn>0.70</mn><mn>9</mn></msup><mo>≈</mo><mn>𝟎.𝟎𝟒𝟎</mn></mrow></math>); the demo's own backward-pass readout confirms every intermediate step matches the same <math><msup><mn>0.70</mn><mi>k</mi></msup></math> formula (<math><mrow><mi>k</mi><mo>=</mo><mn>0</mn><mo>…</mo><mn>9</mn></mrow></math>), captured directly from <code>slide_030.jpg</code> (forward-pass state) and <code>slide_031.jpg</code> (backward-pass state, showing the full per-cell decay chain: 1.00 → 0.70 → 0.49 → 0.34 → 0.24 → 0.17 → 0.12 → 0.08 → 0.06 → 0.04).</p>\n    </div>\n  </figure>\n<blockquote class=\"aside-quote\">\n<p>👉 <strong>See also.</strong> <a class=\"xref\" data-xref-lec=\"deep-neural-networks-03\" role=\"link\" tabindex=\"0\"><code>Deep Neural Networks</code> Part 3, §6</a>\nderives this same <math data-tex=\"|W_h|^n\"><mrow><mi>|</mi><msub><mi>W</mi><mi>h</mi></msub><msup><mi>|</mi><mi>n</mi></msup></mrow></math> decay from the chain rule in full generality (with a spectral-radius\nargument), and <a class=\"xref\" data-xref-lec=\"deep-neural-networks-03\" role=\"link\" tabindex=\"0\">§13</a> derives exactly why\nthe LSTM's additive cell-state path slows but doesn't eliminate it — the two modules' derivations\nagree and either can be read first, but Module 2's is the more general treatment.</p>\n</blockquote>\n<h3>3.2 The Parallelism Problem [slide 35]</h3>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This is a distinct problem from vanishing gradients — don't conflate them.</strong> Vanishing\ngradients is about <em>training quality</em> over long sequences. The parallelism problem is about <em>raw\ncompute cost</em>, and would exist even with a hypothetical RNN that never lost gradient signal.</p>\n</aside>\n<p>RNNs are inherently sequential: <math data-tex=\"h_t\"><msub><mi>h</mi><mi>t</mi></msub></math> depends on <math data-tex=\"h_{t-1}\"><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub></math>, which depends on <math data-tex=\"h_{t-2}\"><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>2</mn></mrow></msub></math>, ... . <strong>You\ncannot compute <math data-tex=\"h_{50}\"><msub><mi>h</mi><mn>50</mn></msub></math> until <math data-tex=\"h_{49}\"><msub><mi>h</mi><mn>49</mn></msub></math> is done</strong> [slide 35]. This means:</p>\n<ul>\n<li>Training cannot fully exploit GPU parallelism (GPUs are built to do many independent computations\nat once; a strict dependency chain forces them to wait)</li>\n<li>Longer sequences = linearly more (wall-clock) time</li>\n<li>Scaling to full documents or books is impractical</li>\n</ul>\n<p><strong>What we want</strong> [slide 35]:</p>\n<ul>\n<li>Process all positions in parallel</li>\n<li>Any token can directly attend to any other token</li>\n<li>Constant path length between distant positions</li>\n</ul>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>The pivot sentence of the whole lecture:</strong> <em>&quot;This is exactly what self-attention will give\nus&quot;</em> [slide 35]. Every remaining section is building toward satisfying these three bullet points.</p>\n</aside>\n<hr>\n</section><section id=\"sequential-learning-19-s6\" data-title=\"Encoder-Decoder Architecture (Seq2Seq)\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">4</span>\n      <span class=\"sec-t\">Encoder-Decoder Architecture (Seq2Seq)</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">1 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s6\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>Before attention can be introduced, the lecture needs a concrete setting where it's obviously useful:\ntranslating one sequence into another.</p>\n<blockquote class=\"aside-quote\">\n<p><strong>Encoder-Decoder (Seq2Seq)</strong> — two separate RNNs working together: an <strong>encoder</strong> reads the input\nsequence token by token and produces a single final hidden state (the <strong>context vector</strong>); a\n<strong>decoder</strong> reads that context vector and generates the output sequence token by token [slide 41].</p>\n</blockquote>\n<figure class=\"ascii\"><pre>   ENCODER                              DECODER\n   ┌───┐  ┌───┐  ┌───┐  ┌───┐    ┌──────────┐   ┌───┐  ┌───┐  ┌───┐  ┌───┐\n   │ Je│─▶│suis│─▶│ un│─▶│étud│─▶│  Context  │──▶│ I │─▶│ am│─▶│ a │─▶│stud│\n   └───┘  └───┘  └───┘  └───┘    │  Vector   │   └───┘  └───┘  └───┘  └───┘\n                                  └──────────┘\n                          Entire input compressed into one vector    [slide 41]</pre></figure>\n<p><strong>Used for:</strong> translation, summarization, question answering — any task where the input and output\nsequences have different lengths.</p>\n<hr>\n</section><section id=\"sequential-learning-19-s7\" data-title=\"The Bottleneck Problem\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">5</span>\n      <span class=\"sec-t\">The Bottleneck Problem</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s7\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>The named failure that motivates attention.</strong> <em>&quot;The entire input gets compressed into ONE\nfixed-size vector&quot;</em> [slide 44]. For short sentences this works fine. <strong>For long sentences,\ninformation gets lost.</strong></p>\n</aside>\n<blockquote class=\"aside-quote\">\n<p>Think about it: a 50-word paragraph compressed into 512 floats. The decoder must reconstruct\n<em>everything</em> from just that. <strong>Empirically: BLEU scores drop sharply for sentences longer than 20\ntokens</strong> [slide 44].</p>\n</blockquote>\n<blockquote class=\"aside-quote\">\n<p><strong>BLEU score</strong> — a standard automatic metric for translation quality, comparing a model's output\nagainst reference translations; higher is better. Its mention here is used purely as empirical\nevidence: it's the number that dropped, giving a measurable symptom of the bottleneck problem, not\nsomething the lecture derives.</p>\n</blockquote>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>The solution the slide poses as a question, then the rest of the lecture answers:</strong> <em>&quot;What if\nthe decoder could look back at the full encoder output, not just the last hidden state?&quot;</em> [slide\n44] — this is, verbatim, the definition of attention.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-19-2\" data-iv=\"{&quot;type&quot;:&quot;slider&quot;,&quot;title&quot;:&quot;The Bottleneck, Visualized&quot;,&quot;concept&quot;:&quot;Fixed-size context vector vs. input length&quot;,&quot;control&quot;:&quot;Slide input sentence length from 5 to 50 tokens, with context vector size fixed&quot;,&quot;observe&quot;:&quot;A \\&quot;reconstruction difficulty\\&quot; indicator rises with sentence length while the vector's capacity stays flat; overlay the empirical BLEU-score-vs-length curve&quot;,&quot;insight&quot;:&quot;The bottleneck isn't a bug in this particular model — it's a direct consequence of forcing a variable amount of information through a fixed-size channel&quot;,&quot;fallback&quot;:&quot;The \\&quot;50-word paragraph into 512 floats\\&quot; framing above states the same capacity mismatch in words.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · slider</span>\n      <span class=\"iv-title\">The Bottleneck, Visualized</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Fixed-size context vector vs. input length</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Slide input sentence length from 5 to 50 tokens, with context vector size fixed</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>A \"reconstruction difficulty\" indicator rises with sentence length while the vector's capacity stays flat; overlay the empirical BLEU-score-vs-length curve</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>The bottleneck isn't a bug in this particular model — it's a direct consequence of forcing a variable amount of information through a fixed-size channel</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The \"50-word paragraph into 512 floats\" framing above states the same capacity mismatch in words.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-19-s8\" data-title=\"Attention Mechanism\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">6</span>\n      <span class=\"sec-t\">Attention Mechanism</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">5 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s8\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>6.1 The Key Idea</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Attention</strong> — at each decoder step, compute a <strong>weighted sum over ALL encoder hidden states</strong>,\ninstead of relying on a single fixed context vector [slide 51].</p>\n<p><em>Words before symbols:</em> the weights say <strong>&quot;how relevant is each source word to the word I am\ngenerating right now?&quot;</strong> [slide 51]. When generating <code>'cat'</code>, attention puts high weight on the\nsource word <code>'chat'</code> and low weight on <code>'Le'</code>, <code>'sur'</code>; when generating <code>'sat'</code>, high weight goes\non <code>'assis'</code> and low weight on everything else [slide 51]. The decoder isn't limited to one\ncompressed summary anymore — it can look back and reweight <em>which parts of the input matter</em> at\nevery single output step.</p>\n</blockquote>\n<h3>6.2 The Computation — three steps [slide 55]</h3>\n<p><strong>Words first:</strong> to generate the current output token, first <em>score</em> how relevant each encoder\nposition is to what the decoder currently needs; turn those scores into a proper probability\ndistribution; then take a weighted average of the encoder states using that distribution as the\nweights.</p>\n<div class=\"mblk bound\"><math data-tex=\"e_{t,i} = \\text{score}(\\mathbf{s}_t, \\mathbf{h}_i) \\qquad \\alpha_{t,i} = \\text{softmax}(e_{t,i}) = \\frac{\\exp(e_{t,i})}{\\sum_j \\exp(e_{t,j})} \\qquad \\mathbf{c}_t = \\sum_{i=1}^n \\alpha_{t,i}\\,\\mathbf{h}_i\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>e</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub><mo>=</mo><mtext>score</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>𝐬</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>𝐡</mi><mi>i</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"2em\"></mspace><msub><mi>α</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub><mo>=</mo><mtext>softmax</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>e</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mfrac><mrow><mrow><mi>exp</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>e</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><msub><mo movablelimits=\"false\">∑</mo><mi>j</mi></msub><mrow><mi>exp</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>e</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>j</mi></mrow></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac><mspace width=\"2em\"></mspace><msub><mi>𝐜</mi><mi>t</mi></msub><mo>=</mo><mrow><munderover><mo movablelimits=\"false\">∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover></mrow><msub><mi>α</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub><mspace width=\"0.1667em\"></mspace><msub><mi>𝐡</mi><mi>i</mi></msub></mrow></math></div>\n<div class=\"table-wrap symtab bound\"><table>\n<thead>\n<tr>\n<th>Symbol</th>\n<th>Read it as</th>\n<th>What it means</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><math data-tex=\"\\mathbf{s}_t\"><msub><mi>𝐬</mi><mi>t</mi></msub></math></td>\n<td>&quot;decoder state&quot;</td>\n<td>Decoder hidden state at output step <math data-tex=\"t\"><mi>t</mi></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\mathbf{h}_i\"><msub><mi>𝐡</mi><mi>i</mi></msub></math></td>\n<td>&quot;encoder state&quot;</td>\n<td>Encoder hidden state at input position <math data-tex=\"i\"><mi>i</mi></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"e_{t,i}\"><msub><mi>e</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub></math></td>\n<td>&quot;raw score&quot;</td>\n<td>How relevant encoder position <math data-tex=\"i\"><mi>i</mi></math> is to decoder step <math data-tex=\"t\"><mi>t</mi></math>, before normalizing</td>\n</tr>\n<tr>\n<td><math data-tex=\"\\alpha_{t,i}\"><msub><mi>α</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>i</mi></mrow></msub></math></td>\n<td>&quot;attention weight&quot;</td>\n<td>The normalized (softmax) relevance — a proper probability, summing to 1 across <math data-tex=\"i\"><mi>i</mi></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\mathbf{c}_t\"><msub><mi>𝐜</mi><mi>t</mi></msub></math></td>\n<td>&quot;context vector <em>at this step</em>&quot;</td>\n<td>The weighted sum of all encoder states — note this is now recomputed at <strong>every</strong> decoder step, unlike <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§4\" role=\"link\" tabindex=\"0\">§4</a>'s single fixed context vector</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The three steps, named</strong> [slide 55]:</p>\n<ol>\n<li><strong>Score:</strong> how relevant is each encoder state to the current decoder state?</li>\n<li><strong>Normalize:</strong> softmax converts scores to probabilities</li>\n<li><strong>Aggregate:</strong> weighted sum of encoder states gives the (per-step) context</li>\n</ol>\n<p>Then combine <math data-tex=\"[\\mathbf{c}_t; \\mathbf{s}_t]\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><msub><mi>𝐜</mi><mi>t</mi></msub><mo separator=\"true\">;</mo><msub><mi>𝐬</mi><mi>t</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></math> (concatenated) to actually predict the next output token\n[slide 55].</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this is the direct fix for the bottleneck.</strong> <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§5\" role=\"link\" tabindex=\"0\">§5</a>'s fixed context vector is\nreplaced by <math data-tex=\"\\mathbf{c}_t\"><msub><mi>𝐜</mi><mi>t</mi></msub></math>, a <em>different</em> weighted combination of <em>all</em> encoder states at every\nsingle decoder step. The decoder is no longer limited to one compressed summary of the whole\ninput — it can re-examine the full input, differently, every time it generates a new word.</p>\n</aside>\n<h3>6.3 Scoring Functions — four options, each simpler than the last [slide 62]</h3>\n<div class=\"mblk\"><math data-tex=\"\\text{Additive (Bahdanau):}\\quad \\text{score}(\\mathbf{s},\\mathbf{h}) = \\mathbf{v}^\\top\\tanh(\\mathbf{W}_1\\mathbf{s} + \\mathbf{W}_2\\mathbf{h})\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Additive (Bahdanau):</mtext><mspace width=\"1em\"></mspace><mtext>score</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐬</mi><mo separator=\"true\">,</mo><mi>𝐡</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msup><mi>𝐯</mi><mi>⊤</mi></msup><mrow><mi>tanh</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>𝐖</mi><mn>1</mn></msub><mi>𝐬</mi><mo>+</mo><msub><mi>𝐖</mi><mn>2</mn></msub><mi>𝐡</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\text{Dot-Product (Luong):}\\quad \\text{score}(\\mathbf{s},\\mathbf{h}) = \\mathbf{s}^\\top\\mathbf{h}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Dot-Product (Luong):</mtext><mspace width=\"1em\"></mspace><mtext>score</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐬</mi><mo separator=\"true\">,</mo><mi>𝐡</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msup><mi>𝐬</mi><mi>⊤</mi></msup><mi>𝐡</mi></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\text{General (Luong):}\\quad \\text{score}(\\mathbf{s},\\mathbf{h}) = \\mathbf{s}^\\top\\mathbf{W}\\mathbf{h}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>General (Luong):</mtext><mspace width=\"1em\"></mspace><mtext>score</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐬</mi><mo separator=\"true\">,</mo><mi>𝐡</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msup><mi>𝐬</mi><mi>⊤</mi></msup><mi>𝐖</mi><mi>𝐡</mi></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\text{Scaled Dot-Product:}\\quad \\text{score}(\\mathbf{s},\\mathbf{h}) = \\frac{\\mathbf{s}^\\top\\mathbf{h}}{\\sqrt{d_k}}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Scaled Dot-Product:</mtext><mspace width=\"1em\"></mspace><mtext>score</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐬</mi><mo separator=\"true\">,</mo><mi>𝐡</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mfrac><mrow><msup><mi>𝐬</mi><mi>⊤</mi></msup><mi>𝐡</mi></mrow><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></mfrac></mrow></math></div>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>Where people get confused.</strong> These are ordered from <em>most</em> to <em>least</em> parameters, not from\n<em>worst</em> to <em>best</em>. Additive attention has its own learned weight matrices $\\mathbf{W}_1,\n\\mathbf{W}_2<math data-tex=\"and vector\"><mrow><mi>a</mi><mi>n</mi><mi>d</mi><mi>v</mi><mi>e</mi><mi>c</mi><mi>t</mi><mi>o</mi><mi>r</mi></mrow></math>\\mathbf{v}$ — expressive, but expensive (an extra small feedforward\nnetwork per scoring computation). Plain dot-product has <em>zero</em> extra parameters but forces <math data-tex=\"s\"><mi>s</mi></math> and\n<math data-tex=\"h\"><mi>h</mi></math> into the same dimensionality. &quot;General&quot; adds back one learned matrix <math data-tex=\"\\mathbf{W}\"><mi>𝐖</mi></math> to relax that\nconstraint. Scaled dot-product is dot-product plus one fix, derived properly in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§9\" role=\"link\" tabindex=\"0\">§9</a> below — it isn't\n&quot;simpler&quot; in a way that costs accuracy, it's simpler <em>and</em> it solves a numerical problem the plain\nversion has.</p>\n</aside>\n<h3>6.4 Summary So Far — the explicit pivot point [slide 68]</h3>\n<p><strong>What we have built:</strong> encoder-decoder (two separate sequences); attention (decoder looks at all\nencoder states, weighted sum); scoring (scaled dot-product is fast and effective).</p>\n<p><strong>What is still missing:</strong> <em>&quot;This only helps BETWEEN two sequences. What about understanding WITHIN\na single sentence? RNNs process sequentially, so distant words struggle to interact&quot;</em> [slide 68].</p>\n<p><strong>Next: Self-Attention.</strong> <em>&quot;Apply the same attention idea, but a sequence attends to itself. Every\ntoken can directly attend to every other token in one step&quot;</em> [slide 68].</p>\n<aside class=\"callout callout-warn\"><p class=\"callout-h\"><span class=\"callout-badge\">⚠️</span>Careful</p><p><strong>This is the hinge of the entire lecture — read it twice.</strong> Everything in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a> was attention\nconnecting <em>two different</em> sequences (source ↔ target). It does nothing to solve <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a>'s parallelism\nand long-range problems <em>within</em> one sequence, because the encoder itself is still a sequential\nRNN. Self-attention (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§7\" role=\"link\" tabindex=\"0\">§7</a> onward) is what actually fixes <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3\" role=\"link\" tabindex=\"0\">§3</a> — attention <em>between sequences</em> and\nself-attention <em>within one sequence</em> are the same mathematical mechanism applied to different\ninputs, but they solve two genuinely different problems.</p>\n</aside>\n<hr>\n</section><section id=\"sequential-learning-19-s9\" data-title=\"Self-Attention\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">7</span>\n      <span class=\"sec-t\">Self-Attention</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s9\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<h3>7.1 Why?</h3>\n<p>🧪 <strong>Motivating example</strong> [slide 72, 84]: <em>&quot;The animal didn't cross the street because it was too\ntired.&quot;</em> What does <code>'it'</code> refer to? <strong>An RNN needs 6 sequential steps to connect <code>'it'</code> to\n<code>'animal'</code></strong> (it has to pass through every intervening hidden state). <strong>Self-attention connects them\nin ONE step.</strong></p>\n<p><strong>The key shift:</strong></p>\n<ul>\n<li>Encoder-decoder attention (<a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6\" role=\"link\" tabindex=\"0\">§6</a>): one sequence attends to <strong>another</strong></li>\n<li>Self-attention: a sequence attends to <strong>itself</strong></li>\n<li>Every token computes a weighted sum over all other tokens (including itself)</li>\n</ul>\n<p><strong>Benefits:</strong> <math data-tex=\"O(1)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math> path length (any two tokens are one hop apart, regardless of sentence length),\nfully parallelizable (no <math data-tex=\"h_t\"><msub><mi>h</mi><mi>t</mi></msub></math>-depends-on-<math data-tex=\"h_{t-1}\"><msub><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub></math> chain), captures long-range dependencies directly\n[slide 72].</p>\n<p>The interactive attention heatmap for this exact sentence [slide 90] shows the mechanism working:\nthe cell at row <code>&quot;it&quot;</code>, column <code>&quot;animal&quot;</code> lights up with a real, non-trivial attention weight — the\nmodel has, without being told any grammar rule, learned to connect &quot;it&quot; back toward the noun phrase\nit refers to.</p>\n<h3>7.2 Query, Key, Value</h3>\n<blockquote class=\"aside-quote\">\n<p><strong>Query, Key, Value</strong> — self-attention gives every token <strong>three</strong> different learned projections\nof its embedding, each answering a different question [slide 74]:</p>\n<ul>\n<li><strong>Query (Q):</strong> &quot;What am I looking for?&quot;</li>\n<li><strong>Key (K):</strong> &quot;What do I contain?&quot;</li>\n<li><strong>Value (V):</strong> &quot;What do I give when matched?&quot;</li>\n</ul>\n<p><em>Analogy given directly on the slide:</em> <strong>database lookup</strong>. Q is your search. K is the index. V is\nthe result you retrieve [slide 74].</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\mathbf{Q} = \\mathbf{X}\\mathbf{W}^Q \\qquad \\mathbf{K} = \\mathbf{X}\\mathbf{W}^K \\qquad \\mathbf{V} = \\mathbf{X}\\mathbf{W}^V\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐐</mi><mo>=</mo><mi>𝐗</mi><msup><mi>𝐖</mi><mi>Q</mi></msup><mspace width=\"2em\"></mspace><mi>𝐊</mi><mo>=</mo><mi>𝐗</mi><msup><mi>𝐖</mi><mi>K</mi></msup><mspace width=\"2em\"></mspace><mi>𝐕</mi><mo>=</mo><mi>𝐗</mi><msup><mi>𝐖</mi><mi>V</mi></msup></mrow></math></div>\n<figure class=\"ascii\"><pre>   X          W^Q         Q               X          W^K         K              X          W^V         V\n [────]   ×  [────]  =  [────]          [────]   ×  [────]  =  [────]        [────]   ×  [────]  =  [────]\n (n×d)      (d×d_k)     (n×d_k)         (n×d)      (d×d_k)     (n×d_k)       (n×d)      (d×d_v)     (n×d_v)\n                                                                                                [slide 74]</pre></figure>\n<p><math data-tex=\"\\mathbf{X}\"><mi>𝐗</mi></math> is the matrix of raw token embeddings (one row per token); $\\mathbf{W}^Q, \\mathbf{W}^K,\n\\mathbf{W}^V$ are three <strong>separate, learned</strong> weight matrices; multiplying projects every token's\nembedding into its own query vector, key vector, and value vector.</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — why three separate matrices, not one.</strong> Using different learned matrices for Q,\nK, and V lets the model learn <em>different</em> things to look for, advertise, and hand over. If Q=K=V\nwere forced, a token's &quot;what I'm looking for&quot; and &quot;what I contain&quot; would be mathematically\nidentical — collapsing three distinct roles into one and removing the model's ability to separate\n&quot;how I match&quot; from &quot;what I return once matched.&quot;</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-19-3\" data-iv=\"{&quot;type&quot;:&quot;diagram&quot;,&quot;title&quot;:&quot;Self-Attention vs. Encoder-Decoder Attention&quot;,&quot;concept&quot;:&quot;The same weighted-lookup mechanism applied to one sequence vs. two&quot;,&quot;control&quot;:&quot;Toggle between \\&quot;Encoder-Decoder Attention\\&quot; and \\&quot;Self-Attention\\&quot; tabs on the same sentence&quot;,&quot;observe&quot;:&quot;In encoder-decoder mode, the attention matrix is rectangular (decoder positions × encoder positions); in self-attention mode, it's square (sequence × itself), and the diagonal is visibly present&quot;,&quot;insight&quot;:&quot;Self-attention isn't a new formula — it's the identical score→normalize→aggregate recipe from §6.2, just applied with Q, K, V all drawn from the SAME sequence instead of two different ones&quot;,&quot;fallback&quot;:&quot;The Q/K/V analogy and formulas above, plus the \\&quot;it → animal in one step\\&quot; example, describe the same shift in words.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · diagram</span>\n      <span class=\"iv-title\">Self-Attention vs. Encoder-Decoder Attention</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>The same weighted-lookup mechanism applied to one sequence vs. two</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle between \"Encoder-Decoder Attention\" and \"Self-Attention\" tabs on the same sentence</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>In encoder-decoder mode, the attention matrix is rectangular (decoder positions × encoder positions); in self-attention mode, it's square (sequence × itself), and the diagonal is visibly present</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>Self-attention isn't a new formula — it's the identical score→normalize→aggregate recipe from <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§6.2\" role=\"link\" tabindex=\"0\">§6.2</a>, just applied with Q, K, V all drawn from the SAME sequence instead of two different ones</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The Q/K/V analogy and formulas above, plus the \"it → animal in one step\" example, describe the same shift in words.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-19-s10\" data-title=\"Attention Computation, Worked in Full\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">8</span>\n      <span class=\"sec-t\">Attention Computation, Worked in Full</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">4 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s10\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>The lecture's interactive demo walks scaled dot-product self-attention through all 7 steps on a\ntoy 3-token sentence: <strong>&quot;I&quot;, &quot;am&quot;, &quot;happy&quot;</strong>, with <math data-tex=\"d_{\\text{model}}=4\"><mrow><msub><mi>d</mi><mtext>model</mtext></msub><mo>=</mo><mn>4</mn></mrow></math> for simplicity [slide 91].</p>\n<h3>Step 1 — Input Embeddings [slide 91]</h3>\n<div class=\"mblk\"><math data-tex=\"\\mathbf{x}_{\\text{I}} = [1,0,1,0] \\qquad \\mathbf{x}_{\\text{am}} = [0,1,1,1] \\qquad \\mathbf{x}_{\\text{happy}} = [1,1,0,0]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝐱</mi><mtext>I</mtext></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,0,1,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mspace width=\"2em\"></mspace><msub><mi>𝐱</mi><mtext>am</mtext></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1,1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mspace width=\"2em\"></mspace><msub><mi>𝐱</mi><mtext>happy</mtext></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1,0,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<h3>Step 2 — Project to Q, K, V [slide 95]</h3>\n<p>Using <math data-tex=\"4\\times2\"><mrow><mn>4</mn><mo>×</mo><mn>2</mn></mrow></math> weight matrices (projecting <math data-tex=\"d_{\\text{model}}=4\"><mrow><msub><mi>d</mi><mtext>model</mtext></msub><mo>=</mo><mn>4</mn></mrow></math> down to <math data-tex=\"d_k=2\"><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><mn>2</mn></mrow></math>):</p>\n<div class=\"mblk\"><math data-tex=\"\\mathbf{Q} = \\begin{bmatrix}2&amp;0\\\\0&amp;2\\\\1&amp;1\\end{bmatrix} \\qquad \\mathbf{K} = \\begin{bmatrix}0&amp;2\\\\2&amp;0\\\\1&amp;1\\end{bmatrix} \\qquad \\mathbf{V} = \\begin{bmatrix}2&amp;1\\\\0&amp;1\\\\1&amp;1\\end{bmatrix}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐐</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>0</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow><mspace width=\"2em\"></mspace><mi>𝐊</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>0</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow><mspace width=\"2em\"></mspace><mi>𝐕</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p>(rows are <math data-tex=\"q_1,q_2,q_3\"><mrow><msub><mi>q</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>q</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>q</mi><mn>3</mn></msub></mrow></math> / <math data-tex=\"k_1,k_2,k_3\"><mrow><msub><mi>k</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>k</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>k</mi><mn>3</mn></msub></mrow></math> / <math data-tex=\"v_1,v_2,v_3\"><mrow><msub><mi>v</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>v</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>v</mi><mn>3</mn></msub></mrow></math>, in order &quot;I&quot;, &quot;am&quot;, &quot;happy&quot;)</p>\n<h3>Step 3 — Compute Attention Scores <math data-tex=\"\\mathbf{Q}\\cdot\\mathbf{K}^\\top\"><mrow><mi>𝐐</mi><mo>⋅</mo><msup><mi>𝐊</mi><mi>⊤</mi></msup></mrow></math> [slide 99]</h3>\n<div class=\"mblk\"><math data-tex=\"q_1\\cdot k_1 = [2,0]\\cdot[0,2] = 0 \\qquad q_1\\cdot k_2 = [2,0]\\cdot[2,0] = 4 \\qquad q_1\\cdot k_3 = [2,0]\\cdot[1,1] = 2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>q</mi><mn>1</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>0</mn><mspace width=\"2em\"></mspace><msub><mi>q</mi><mn>1</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>4</mn><mspace width=\"2em\"></mspace><msub><mi>q</mi><mn>1</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>3</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>2</mn></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"q_2\\cdot k_1 = [0,2]\\cdot[0,2] = 4 \\qquad q_2\\cdot k_2 = [0,2]\\cdot[2,0] = 0 \\qquad q_2\\cdot k_3 = [0,2]\\cdot[1,1] = 2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>q</mi><mn>2</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>4</mn><mspace width=\"2em\"></mspace><msub><mi>q</mi><mn>2</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>0</mn><mspace width=\"2em\"></mspace><msub><mi>q</mi><mn>2</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>3</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>2</mn></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"q_3\\cdot k_1 = [1,1]\\cdot[0,2] = 2 \\qquad q_3\\cdot k_2 = [1,1]\\cdot[2,0] = 2 \\qquad q_3\\cdot k_3 = [1,1]\\cdot[1,1] = 2\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>q</mi><mn>3</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,2</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>2</mn><mspace width=\"2em\"></mspace><msub><mi>q</mi><mn>3</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>2</mn><mspace width=\"2em\"></mspace><msub><mi>q</mi><mn>3</mn></msub><mo>⋅</mo><msub><mi>k</mi><mn>3</mn></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>2</mn></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\text{Score matrix} = \\begin{bmatrix}0&amp;4&amp;2\\\\4&amp;0&amp;2\\\\2&amp;2&amp;2\\end{bmatrix}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Score matrix</mtext><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>0</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>2</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><em>&quot;Each query asks: 'how relevant is each key to me?' The score is the dot product of the query with\neach key. Higher score = more relevant match.&quot;</em> [slide 99]</p>\n<h3>Step 4 — Scale by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> [slide 102]</h3>\n<p>With <math data-tex=\"d_k=2\"><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><mn>2</mn></mrow></math>: <math data-tex=\"\\sqrt{d_k} = \\sqrt{2}\\approx1.414\"><mrow><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>≈</mo><mn>1.414</mn></mrow></math>.</p>\n<div class=\"mblk\"><math data-tex=\"\\text{Scaled scores} = \\begin{bmatrix}0.00&amp;2.83&amp;1.41\\\\2.83&amp;0.00&amp;1.41\\\\1.41&amp;1.41&amp;1.41\\end{bmatrix}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Scaled scores</mtext><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0.00</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>2.83</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1.41</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>2.83</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>0.00</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1.41</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1.41</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>1.41</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1.41</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p><em>&quot;Divide by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> to prevent large values from saturating softmax. Without this, gradients\nwould vanish for large <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> because softmax would produce near-one-hot distributions&quot;</em> [slide 102]\n— the exact softmax-saturation failure mode from Prerequisite 3, now shown concretely.</p>\n<h3>Step 5 — Softmax (row-wise) [slide 103]</h3>\n<div class=\"mblk\"><math data-tex=\"\\text{Attention weights } \\boldsymbol{\\alpha} = \\begin{bmatrix}0.045&amp;0.769&amp;0.186\\\\0.769&amp;0.045&amp;0.186\\\\0.333&amp;0.333&amp;0.333\\end{bmatrix}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Attention weights </mtext><mi>𝜶</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0.045</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>0.769</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>0.186</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0.769</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>0.045</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>0.186</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>0.333</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:5.9776pt;\"><mn>0.333</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>0.333</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mo></mrow></mrow></math></div>\n<p>Each row sums to exactly 1.0 (verified on the slide: <math data-tex=\"0.045+0.769+0.186=1.0\"><mrow><mn>0.045</mn><mo>+</mo><mn>0.769</mn><mo>+</mo><mn>0.186</mn><mo>=</mo><mn>1.0</mn></mrow></math>, etc.). <em>&quot;Darker amber =\nhigher attention weight. 'I' attends mostly to 'am'; 'am' attends mostly to 'I'; 'happy' attends\nequally&quot;</em> [slide 103] — note &quot;happy&quot; produces a <strong>uniform</strong> distribution here, a direct consequence\nof its scaled scores against all three keys being tied at 1.41 in this toy example.</p>\n<h3>Step 6 — Weighted Sum of Values [slide 106]</h3>\n<div class=\"mblk\"><math data-tex=\"\\mathbf{o}_1 = 0.045\\cdot[2,1] + 0.769\\cdot[0,1] + 0.186\\cdot[1,1] = [0.28,\\ 1.00]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝐨</mi><mn>1</mn></msub><mo>=</mo><mn>0.045</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mn>0.769</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mn>0.186</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0.28</mn><mo separator=\"true\">,</mo><mtext> </mtext><mn>1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\mathbf{o}_2 = 0.769\\cdot[2,1] + 0.045\\cdot[0,1] + 0.186\\cdot[1,1] = [1.72,\\ 1.00]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝐨</mi><mn>2</mn></msub><mo>=</mo><mn>0.769</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mn>0.045</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mn>0.186</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1.72</mn><mo separator=\"true\">,</mo><mtext> </mtext><mn>1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\mathbf{o}_3 = 0.333\\cdot[2,1] + 0.333\\cdot[0,1] + 0.333\\cdot[1,1] = [1.00,\\ 1.00]\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝐨</mi><mn>3</mn></msub><mo>=</mo><mn>0.333</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>2,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mn>0.333</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>+</mo><mn>0.333</mn><mo>⋅</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1.00</mn><mo separator=\"true\">,</mo><mtext> </mtext><mn>1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></mrow></math></div>\n<p><em>&quot;The final output for each token is a weighted sum of all Value vectors, using the attention\nweights. Tokens with higher attention weight contribute more to the output. Each output now contains\ncontextual information from the entire sequence&quot;</em> [slide 106].</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — trace what actually happened.</strong> Token &quot;I&quot; (output <math data-tex=\"\\mathbf{o}_1\"><msub><mi>𝐨</mi><mn>1</mn></msub></math>) started as\n<math data-tex=\"[1,0,1,0]\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1,0,1,0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></math> and ends as <math data-tex=\"[0.28, 1.00]\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>0.28</mn><mo separator=\"true\">,</mo><mn>1.00</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow></math> — a genuinely new vector, built mostly from <strong>&quot;am&quot;'s</strong> value\nvector (weight 0.769), because &quot;I&quot; and &quot;am&quot; scored highly relevant to each other in Step 3. This is\nthe entire point of self-attention made concrete: each output vector is <em>context-aware</em>, blending\ninformation from every other token, weighted by learned relevance — not a fixed lookup, and not\nsomething a static embedding (Part 1) or even ELMo's fixed-direction LSTM state could produce in a\nsingle step.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-19-4\" data-iv=\"{&quot;type&quot;:&quot;simulator&quot;,&quot;title&quot;:&quot;Full Attention Computation, Step by Step&quot;,&quot;concept&quot;:&quot;The complete Q/K/V → score → scale → softmax → weighted-sum pipeline&quot;,&quot;control&quot;:&quot;Step through all 7 stages (embeddings → project → score → scale → softmax → weighted sum → encoder-decoder vs. self-attention comparison) on the \\&quot;I am happy\\&quot; toy example&quot;,&quot;observe&quot;:&quot;Each stage's output matrix updates and highlights which numbers from the previous stage fed into it&quot;,&quot;insight&quot;:&quot;There is no hidden step — the entire mechanism is five matrix operations applied in sequence, and every number in the final output is traceable back to the original embeddings&quot;,&quot;fallback&quot;:&quot;The full worked derivation above reproduces all six numbered steps by hand, ending in the same three output vectors.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · simulator</span>\n      <span class=\"iv-title\">Full Attention Computation, Step by Step</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>The complete Q/K/V → score → scale → softmax → weighted-sum pipeline</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Step through all 7 stages (embeddings → project → score → scale → softmax → weighted sum → encoder-decoder vs. self-attention comparison) on the \"I am happy\" toy example</dd></div>\n        <div class=\"iv-row\"><dt>Watch</dt><dd>Each stage's output matrix updates and highlights which numbers from the previous stage fed into it</dd></div>\n        <div class=\"iv-row\"><dt>Insight</dt><dd>There is no hidden step — the entire mechanism is five matrix operations applied in sequence, and every number in the final output is traceable back to the original embeddings</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The full worked derivation above reproduces all six numbered steps by hand, ending in the same three output vectors.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-19-s11\" data-title=\"Scaled Dot-Product Attention — deriving the dk\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">9</span>\n      <span class=\"sec-t\">Scaled Dot-Product Attention — deriving the <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math></span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s11\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<div class=\"mblk\"><math data-tex=\"\\text{Attention}(\\mathbf{Q},\\mathbf{K},\\mathbf{V}) = \\text{softmax}\\!\\left(\\frac{\\mathbf{Q}\\mathbf{K}^\\top}{\\sqrt{d_k}}\\right)\\mathbf{V} \\qquad \\text{where } \\mathbf{Q}=\\mathbf{X}\\mathbf{W}^Q,\\ \\mathbf{K}=\\mathbf{X}\\mathbf{W}^K,\\ \\mathbf{V}=\\mathbf{X}\\mathbf{W}^V\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>Attention</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐐</mi><mo separator=\"true\">,</mo><mi>𝐊</mi><mo separator=\"true\">,</mo><mi>𝐕</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>softmax</mtext><mrow style=\"margin-left:-0.1667em;\"></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mrow><mi>𝐐</mi><msup><mi>𝐊</mi><mi>⊤</mi></msup></mrow><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>𝐕</mi><mspace width=\"2em\"></mspace><mtext>where </mtext><mi>𝐐</mi><mo>=</mo><mi>𝐗</mi><msup><mi>𝐖</mi><mi>Q</mi></msup><mo separator=\"true\">,</mo><mtext> </mtext><mi>𝐊</mi><mo>=</mo><mi>𝐗</mi><msup><mi>𝐖</mi><mi>K</mi></msup><mo separator=\"true\">,</mo><mtext> </mtext><mi>𝐕</mi><mo>=</mo><mi>𝐗</mi><msup><mi>𝐖</mi><mi>V</mi></msup></mrow></math></div>\n<p><strong>Step by step</strong> [slide 113]: (1) <math data-tex=\"\\mathbf{Q}\\mathbf{K}^\\top\"><mrow><mi>𝐐</mi><msup><mi>𝐊</mi><mi>⊤</mi></msup></mrow></math> gives an <math data-tex=\"n\\times n\"><mrow><mi>n</mi><mo>×</mo><mi>n</mi></mrow></math> score matrix; (2)\nscale by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> to prevent softmax saturation; (3) softmax per row gives attention weights; (4)\nmultiply by <math data-tex=\"\\mathbf{V}\"><mi>𝐕</mi></math> to aggregate.</p>\n<p><strong>Why <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math>?</strong> [slide 113] — words first: if the individual entries of <math data-tex=\"q\"><mi>q</mi></math> and <math data-tex=\"k\"><mi>k</mi></math> each have\nunit variance (variance 1) and are independent, then their dot product — a sum of <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> such\nindependent terms — has variance that grows to <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> itself. Large variance means large-magnitude\nscores, which saturate the softmax (Prerequisite 3). Dividing by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> exactly restores the\nvariance to 1, keeping the softmax's gradients healthy.</p>\n<div class=\"mblk\"><math data-tex=\"q,k \\text{ have unit variance} \\implies \\text{Var}(q\\cdot k) = d_k \\implies \\text{dividing by } \\sqrt{d_k} \\text{ restores variance to } 1\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>q</mi><mo separator=\"true\">,</mo><mi>k</mi><mtext> have unit variance</mtext><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"0.2778em\"></mspace><mtext>Var</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>q</mi><mo>⋅</mo><mi>k</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><msub><mi>d</mi><mi>k</mi></msub><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟹</mo><mspace width=\"0.2778em\"></mspace><mtext>dividing by </mtext><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt><mtext> restores variance to </mtext><mn>1</mn></mrow></math></div>\n<p>🧪 <strong>Worked example — the saturation demo made concrete</strong> [slide 125]. At dimensionality <math data-tex=\"d=32\"><mrow><mi>d</mi><mo>=</mo><mn>32</mn></mrow></math>:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Unscaled</strong></th>\n<th><strong>Scaled by <math data-tex=\"\\sqrt{d}\"><msqrt><mi>d</mi></msqrt></math></strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Raw dot products <math data-tex=\"(q\\cdot k)\"><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>q</mi><mo>⋅</mo><mi>k</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></math></td>\n<td>Range roughly <math data-tex=\"-15.5\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>15.5</mn></mrow></math> to <math data-tex=\"+9.9\"><mrow><mo form=\"prefix\" stretchy=\"false\">+</mo><mn>9.9</mn></mrow></math></td>\n<td>Range roughly <math data-tex=\"-2.7\"><mrow><mo form=\"prefix\" stretchy=\"false\">−</mo><mn>2.7</mn></mrow></math> to <math data-tex=\"+1.8\"><mrow><mo form=\"prefix\" stretchy=\"false\">+</mo><mn>1.8</mn></mrow></math></td>\n</tr>\n<tr>\n<td><math data-tex=\"\\text{softmax}(q\\cdot k)\"><mrow><mtext>softmax</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>q</mi><mo>⋅</mo><mi>k</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></td>\n<td>Max probability <strong>1.000</strong>, entropy <strong>0.00 / 2.08</strong> — &quot;nearly one-hot!&quot;</td>\n<td>Max probability <strong>0.653</strong>, entropy <strong>1.24 / 2.08</strong> — &quot;healthy&quot;</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>&quot;As <math data-tex=\"d\"><mi>d</mi></math> grows, dot products grow <math data-tex=\"\\sim O(\\sqrt d)\"><mrow><mo>∼</mo><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msqrt><mi>d</mi></msqrt><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>... softmax saturates → gradients vanish&quot;</em>, versus\n<em>&quot;Dividing by <math data-tex=\"\\sqrt d\"><msqrt><mi>d</mi></msqrt></math> keeps the variance ≈ 1, softmax stays smooth, gradients flow&quot;</em> [slide 125].</p>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — connect this back to <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§3.1\" role=\"link\" tabindex=\"0\">§3.1</a>.</strong> The unscaled column's softmax entropy of <strong>0.00</strong>\nmeans the distribution has collapsed to picking one key with 100% certainty — structurally the\n<em>same</em> failure as a saturated softmax anywhere else: once a distribution is this peaked, its\ngradient with respect to every non-winning entry is near zero, and the model stops learning from\nthat comparison. Scaled dot-product attention is a small, deliberate design choice that exists\nentirely to keep this gradient alive as <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> grows.</p>\n</aside>\n<aside class=\"callout callout-int\"><p class=\"callout-h\"><span class=\"callout-badge\">🎯</span>Interview</p><p><strong>Interview-ready one-liner:</strong> &quot;If <math data-tex=\"q\"><mi>q</mi></math> and <math data-tex=\"k\"><mi>k</mi></math>'s components are independent with unit variance,\ntheir dot product sums <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> independent unit-variance terms, so its variance is <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> — not 1.\nDividing the score by <math data-tex=\"\\sqrt{d_k}\"><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></math> before the softmax normalizes that variance back to 1, which is\nexactly what keeps softmax from saturating as the embedding dimension grows.&quot;</p>\n</aside>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Cross-module note.</strong> <code>GenAI &amp; LLM Part 1 §8</code> independently derives this identical result —\nsame variance argument, same conclusion — but uses plain <math data-tex=\"d\"><mi>d</mi></math> for the projection dimension where\nthis file uses <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math>. Both are internally consistent within their own file; if you've read both\nmodules, <math data-tex=\"d\"><mi>d</mi></math> there and <math data-tex=\"d_k\"><msub><mi>d</mi><mi>k</mi></msub></math> here name the same quantity.</p>\n</aside>\n<hr>\n</section><section id=\"sequential-learning-19-s12\" data-title=\"Multi-Head Attention\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">10</span>\n      <span class=\"sec-t\">Multi-Head Attention</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s12\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<blockquote class=\"aside-quote\">\n<p><strong>Multi-Head Attention</strong> — instead of computing attention once, compute it <strong><math data-tex=\"h\"><mi>h</mi></math> times in\nparallel</strong>, each with its own learned <math data-tex=\"\\mathbf{W}^Q_i, \\mathbf{W}^K_i, \\mathbf{W}^V_i\"><mrow><msubsup><mi>𝐖</mi><mi>i</mi><mi>Q</mi></msubsup><mo separator=\"true\">,</mo><msubsup><mi>𝐖</mi><mi>i</mi><mi>K</mi></msubsup><mo separator=\"true\">,</mo><msubsup><mi>𝐖</mi><mi>i</mi><mi>V</mi></msubsup></mrow></math>, then\nconcatenate the results and project back down [slide 127].</p>\n<p><em>Why it exists:</em> <em>&quot;One head captures one type of relationship. We want multiple perspectives\nsimultaneously&quot;</em> [slide 127].</p>\n</blockquote>\n<div class=\"mblk\"><math data-tex=\"\\text{MultiHead}(\\mathbf{Q},\\mathbf{K},\\mathbf{V}) = \\text{Concat}(\\text{head}_1,\\ldots,\\text{head}_h)\\,\\mathbf{W}^O\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>MultiHead</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐐</mi><mo separator=\"true\">,</mo><mi>𝐊</mi><mo separator=\"true\">,</mo><mi>𝐕</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mtext>Concat</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mtext>head</mtext><mn>1</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mtext>head</mtext><mi>h</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><msup><mi>𝐖</mi><mi>O</mi></msup></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"\\text{where head}_i = \\text{Attention}(\\mathbf{Q}\\mathbf{W}^Q_i,\\ \\mathbf{K}\\mathbf{W}^K_i,\\ \\mathbf{V}\\mathbf{W}^V_i)\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mtext>where head</mtext><mi>i</mi></msub><mo>=</mo><mtext>Attention</mtext><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐐</mi><msubsup><mi>𝐖</mi><mi>i</mi><mi>Q</mi></msubsup><mo separator=\"true\">,</mo><mtext> </mtext><mi>𝐊</mi><msubsup><mi>𝐖</mi><mi>i</mi><mi>K</mi></msubsup><mo separator=\"true\">,</mo><mtext> </mtext><mi>𝐕</mi><msubsup><mi>𝐖</mi><mi>i</mi><mi>V</mi></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math></div>\n<div class=\"mblk\"><math data-tex=\"d_k = d_v = d_{\\text{model}}/h \\quad\\text{(e.g., } 512/8 = 64 \\text{ per head)}\" display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><msub><mi>d</mi><mi>v</mi></msub><mo>=</mo><msub><mi>d</mi><mtext>model</mtext></msub><mi>/</mi><mi>h</mi><mspace width=\"1em\"></mspace><mtext>(e.g., </mtext><mn>512</mn><mi>/</mi><mn>8</mn><mo>=</mo><mn>64</mn><mtext> per head)</mtext></mrow></math></div>\n<p>🧪 <strong>Worked example, from the standard Transformer sizing</strong> [slide 127]: <math data-tex=\"d_{\\text{model}}=512\"><mrow><msub><mi>d</mi><mtext>model</mtext></msub><mo>=</mo><mn>512</mn></mrow></math>,\n<math data-tex=\"h=8\"><mrow><mi>h</mi><mo>=</mo><mn>8</mn></mrow></math> heads. So <math data-tex=\"d_k = d_v = 64\"><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><msub><mi>d</mi><mi>v</mi></msub><mo>=</mo><mn>64</mn></mrow></math> per head. <strong>Same total compute as one big head</strong> — this is a\nstructural point, not an approximation: splitting into 8 heads of dimension 64 costs the same total\nFLOPs as one head of dimension 512, because the per-head matrices are correspondingly smaller.</p>\n<figure class=\"ascii\"><pre>1) Input          2) Embed         3) Split into 8 heads       4) Attention        5) Concat + W^O\nsentence*          each word        via W_i^Q, W_i^K, W_i^V     per head            → layer output\n\n&quot;Thinking            X          ┌─ W0^Q,W0^K,W0^V → Q0,K0,V0 → Attention → Z0 ─┐\n Machines&quot;        [embeddings]  ├─ W1^Q,W1^K,W1^V → Q1,K1,V1 → Attention → Z1 ─┤\n                                 │              ...                            ├─▶ Concat → ×W^O → Z\n                                 └─ W7^Q,W7^K,W7^V → Q7,K7,V7 → Attention → Z7 ─┘\n                                                                              [slide 129]</pre></figure>\n<p><em>(Footnote on the original slide: &quot;In all encoders other than #0, we don't need embedding. We start\ndirectly with the output of the encoder right below this one&quot; — i.e. this diagram is showing the\n<em>first</em> Transformer layer specifically; later layers take the previous layer's output as their\ninput <math data-tex=\"X\"><mi>X</mi></math> instead of a fresh embedding lookup.)</em></p>\n<h3>10.1 What Different Heads Learn [slide 131]</h3>\n<p><em>&quot;Different heads specialize without being told to&quot;</em>:</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Head type</th>\n<th>Specializes in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Positional</strong></td>\n<td>Attends to nearby tokens (local context)</td>\n</tr>\n<tr>\n<td><strong>Syntactic</strong></td>\n<td>Links subjects to verbs, modifiers to nouns</td>\n</tr>\n<tr>\n<td><strong>Coreference</strong></td>\n<td>Resolves pronouns (<strong>&quot;it&quot; looks at &quot;animal&quot;</strong> — the exact <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a> example)</td>\n</tr>\n<tr>\n<td><strong>Semantic</strong></td>\n<td>Captures meaning similarity across distance</td>\n</tr>\n</tbody>\n</table></div>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight — this closes the loop back to <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§7.1\" role=\"link\" tabindex=\"0\">§7.1</a>.</strong> The &quot;it&quot; → &quot;animal&quot; coreference resolution\nthat motivated self-attention in the first place isn't hand-coded anywhere in the architecture —\nit <em>emerges</em> as one head's specialization, purely from training on data, alongside three other\ndistinct specializations no one explicitly programmed.</p>\n</aside>\n<figure class=\"iv\" id=\"iv-sequential-learning-19-5\" data-iv=\"{&quot;type&quot;:&quot;diagram&quot;,&quot;title&quot;:&quot;One Head vs. Eight Heads&quot;,&quot;concept&quot;:&quot;Why multi-head attention captures more than single-head attention&quot;,&quot;control&quot;:&quot;Toggle a sentence's self-attention heatmap between \\&quot;single head\\&quot; and \\&quot;8 heads, viewed one at a time\\&quot;; a dropdown selects which of the 8 heads to view&quot;,&quot;insight&quot;:&quot;Different heads' heatmaps light up along genuinely different patterns (one along the diagonal/local-context, one connecting pronouns to their referents, etc.) — multi-head attention isn't redundancy, it's several different learned relationships computed side by side&quot;,&quot;fallback&quot;:&quot;The \\&quot;what different heads learn\\&quot; table above lists the four named specialization types directly.&quot;}\">\n    <figcaption class=\"iv-cap\"><span class=\"iv-kind\">Interactive · diagram</span>\n      <span class=\"iv-title\">One Head vs. Eight Heads</span></figcaption>\n    <div class=\"iv-mount\" hidden></div>\n    <div class=\"iv-fallback\">\n      <dl class=\"iv-meta\">\n        <div class=\"iv-row\"><dt>Concept</dt><dd>Why multi-head attention captures more than single-head attention</dd></div>\n        <div class=\"iv-row\"><dt>Try</dt><dd>Toggle a sentence's self-attention heatmap between \"single head\" and \"8 heads, viewed one at a time\"; a dropdown selects which of the 8 heads to view</dd></div>\n        \n        <div class=\"iv-row\"><dt>Insight</dt><dd>Different heads' heatmaps light up along genuinely different patterns (one along the diagonal/local-context, one connecting pronouns to their referents, etc.) — multi-head attention isn't redundancy, it's several different learned relationships computed side by side</dd></div>\n      </dl>\n      <p class=\"iv-fb-prose\">The \"what different heads learn\" table above lists the four named specialization types directly.</p>\n    </div>\n  </figure>\n<hr>\n</section><section id=\"sequential-learning-19-s13\" data-title=\"Attention Is Still Evolving\" data-kind=\"content\"><h2>\n      <span class=\"sec-n\" aria-hidden=\"true\">11</span>\n      <span class=\"sec-t\">Attention Is Still Evolving</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">2 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s13\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<p>The lecture closes Part 2 by explicitly flagging that everything just derived is a foundation, not\nthe final word [slide 133]:</p>\n<p><strong>Making it faster:</strong></p>\n<ul>\n<li><strong>Flash Attention</strong> — IO-aware, 2–4× speedup (same math, faster memory access pattern)</li>\n<li><strong>Sliding Window</strong> (Mistral) — local context only, trading global reach for speed</li>\n</ul>\n<p><strong>Shrinking memory at inference:</strong></p>\n<ul>\n<li><strong>GQA</strong> (Llama 3) — groups share Key/Value projections</li>\n<li><strong>MLA</strong> (DeepSeek) — compresses Key/Value to low-rank</li>\n</ul>\n<p><strong>Beyond attention entirely:</strong></p>\n<ul>\n<li><strong>Mamba/SSMs</strong> — <math data-tex=\"O(n)\"><mrow><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>, no attention at all</li>\n<li><strong>Hybrids</strong> (Jamba) — mix attention + Mamba</li>\n</ul>\n<aside class=\"callout callout-key\"><p class=\"callout-h\"><span class=\"callout-badge\">💡</span>Key insight</p><p><strong>Key insight, stated directly, and worth taking at face value:</strong> <em>&quot;The core idea you learned\ntoday is in every model you use. These are optimizations&quot;</em> [slide 133]. Flash Attention, GQA, and\nMLA all compute the <em>same</em> mathematical object (softmax-weighted value aggregation) faster or with\nless memory — they are not alternative theories of attention, they're engineering refinements of\nexactly the mechanism derived in <a class=\"xref\" data-xref-lec=\"sequential-learning-19\" data-xref=\"§9–10\" role=\"link\" tabindex=\"0\">§9–10</a>. Mamba/SSMs are the one genuine exception on this list (a\ndifferent mechanism entirely, not an optimization of attention) — flagged here as the frontier,\nnot covered further in this lecture.</p>\n</aside>\n<p>The timeline's specific years — <strong>Bahdanau Attention (2014)</strong>, <strong>Luong Attention (2015)</strong>,\nTransformer (2017), Flash Attention (2022), GQA/MQA (2023), MLA/Differential Attention (2024), Hybrid\nMamba+Attention (2025) — are each shown as individually-dated points directly on the lecture's own\ntimeline graphic [slide 133] and confirmed accurate as read; no hedge needed.</p>\n<hr>\n</section><section id=\"sequential-learning-19-s14\" data-title=\"Putting it together\" data-kind=\"back\"><h2>\n      \n      <span class=\"sec-t\">Putting it together</span>\n      <span class=\"sec-meta\"><span class=\"sec-time\">3 min</span>\n      <button class=\"sec-check\" type=\"button\" data-sec=\"sequential-learning-19-s14\" aria-label=\"Mark this section understood\" title=\"I understand this\"></button></span>\n    </h2>\n<figure class=\"ascii\"><pre>                    ┌───────────────────────────────┐\n                    │ The RNN's two structural flaws  │\n                    │  (§3): sequential-only →         │\n                    │  1. vanishing gradients over time│\n                    │  2. no parallelism across tokens │\n                    └────────────┬────────────────────┘\n                                 │  attention (§6) fixes the\n                                 │  BOTTLENECK between two sequences,\n                                 │  but the encoder is still an RNN\n
