name: Build & deploy site

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build deps
        working-directory: web
        run: npm ci --omit=dev          # skip playwright/mermaid/jsdom — diagrams are pre-rendered & committed

      - name: Build every module
        working-directory: web
        run: node build.mjs --all

      - name: Fail on un-rendered diagrams
        run: |
          if grep -lq 'class="diagram diagram-raw"' docs/*.html; then
            echo "::error::a ```mermaid block is not pre-rendered — run 'npm run diagrams' in web/ and commit web/.diagrams/"
            grep -l 'class="diagram diagram-raw"' docs/*.html
            exit 1
          fi

      - name: Warn if committed docs/ were stale
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::warning::docs/ in the repo is out of date with notes/. Run the web build and commit docs/ to keep the repo in sync (the deploy below uses the fresh build regardless)."
            git diff --stat -- docs/ || true
          fi

      - name: Keep Jekyll off
        run: touch docs/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
