name: Deploy site

# docs/ is committed as the build artifact (like a checked-in dist/): the author
# runs `npm run diagrams` + `node build.mjs --all` locally and commits the result.
# CI just packages docs/ and deploys it — no Node build, no version sensitivity.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the committed site
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html missing"; exit 1; }
          for m in supervised-learning deep-neural-networks dimensionality-reduction \
                   unsupervised-learning genai-llm sequential-learning \
                   causal-inference reinforcement-learning agentic-ai; do
            test -f "docs/$m.html" || { echo "::error::docs/$m.html missing"; exit 1; }
          done
          if grep -Fl 'class="diagram diagram-raw"' docs/*.html; then
            echo "::error::a mermaid diagram was committed un-rendered — run 'npm run diagrams' then 'node build.mjs --all' in web/ and re-commit docs/"
            exit 1
          fi
          touch docs/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
