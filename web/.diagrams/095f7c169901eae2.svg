th d="M158,125.5L158,140.5L158,151.5" id="d095f7c169901eae2-L_P1_P2_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_P1_P2_0" data-points="W3sieCI6MTU4LCJ5IjoxMjUuNX0seyJ4IjoxNTgsInkiOjE0MC41fSx7IngiOjE1OCwieSI6MTU1LjV9XQ==" data-look="classic" marker-end="url(#d095f7c169901eae2_flowchart-v2-pointEnd)"></path><path d="M158,292.5L158,307.5L158,318.5" id="d095f7c169901eae2-L_P2_P3_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_P2_P3_0" data-points="W3sieCI6MTU4LCJ5IjoyOTIuNX0seyJ4IjoxNTgsInkiOjMwNy41fSx7IngiOjE1OCwieSI6MzIyLjV9XQ==" data-look="classic" marker-end="url(#d095f7c169901eae2_flowchart-v2-pointEnd)"></path><path d="M158,440L158,455L158,466" id="d095f7c169901eae2-L_P3_BR_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_P3_BR_0" data-points="W3sieCI6MTU4LCJ5Ijo0NDB9LHsieCI6MTU4LCJ5Ijo0NTV9LHsieCI6MTU4LCJ5Ijo0NzB9XQ==" data-look="classic" marker-end="url(#d095f7c169901eae2_flowchart-v2-pointEnd)"></path></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_P1_P2_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_P2_P3_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_P3_BR_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="d095f7c169901eae2-flowchart-P1-0" data-look="classic" transform="translate(158, 66.75)"><rect class="basic label-container" style="" x="-150" y="-58.75" width="300" height="117.5"></rect><g class="label" style="" transform="translate(-130, -48.75)"><rect></rect><foreignObject width="260" height="97.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Part 1 · Treatment effects</b><br/><small>one dataset, two comparisons, opposite signs — what number are we even trying to compute? (estimand / estimator / estimate; ITE / ATE / ATT / ATC / CATE)</small></p></span></div></foreignObject></g></g><g class="node default  " id="d095f7c169901eae2-flowchart-P2-2" data-look="classic" transform="translate(158, 224)"><rect class="basic label-container" style="" x="-150" y="-68.5" width="300" height="137"></rect><g class="label" style="" transform="translate(-130, -58.5)"><rect></rect><foreignObject width="260" height="117"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Part 2 · Identification</b><br/><small>why do the two comparisons disagree? selection bias, decomposed algebraically · which covariates fix it (confounders) vs break it further (mediators, colliders) · the three assumptions: unconfoundedness, positivity, SUTVA</small></p></span></div></foreignObject></g></g><g class="node default  " id="d095f7c169901eae2-flowchart-P3-4" data-look="classic" transform="translate(158, 381.25)"><rect class="basic label-container" style="" x="-150" y="-58.75" width="300" height="117.5"></rect><g class="label" style="" transform="translate(-130, -48.75)"><rect></rect><foreignObject width="260" height="97.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Part 3 · Classical estimation</b><br/><small>six recipes — stratification, matching, propensity-score weighting, regression adjustment, doubly robust — each scored against the same known $1,794 truth</small></p></span></div></foreignObject></g></g><g class="node default k " id="d095f7c169901eae2-flowchart-BR-6" data-look="classic" transform="translate(158, 528.75)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-58.75" width="300" height="117.5"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -48.75)"><rect></rect><foreignObject width="260" height="97.5"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>Bridge to ML</b><br/><small>every classical method rests on estimating one or both nuisance functions — propensity e(x) and outcome μ(x) — exactly what flexible ML models can replace hand-built formulas with</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="d095f7c169901eae2-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d095f7c169901eae2-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="d095f7c169901eae2-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4C4739" stop-opacity="1"></stop><stop offset="100%" stop-color="#4C4739" stop-opacity="1"></stop></linearGradient></svg>