gn: center;"><span class="edgeLabel "></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="d2aedc73d2066506b-flowchart-V-0" data-look="classic" transform="translate(158, 37.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Part 3's VAE</b> — x → z in one step, learn encoder + decoder</p></span></div></foreignObject></g></g><g class="node default k " id="d2aedc73d2066506b-flowchart-A13-2" data-look="classic" transform="translate(158, 165.5)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>§A1–3</b> Diffusion = a hierarchical VAE with a FIXED forward process (add noise T times)</p></span></div></foreignObject></g></g><g class="node default  " id="d2aedc73d2066506b-flowchart-A48-4" data-look="classic" transform="translate(158, 254.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§A4–8</b> learn the reverse: denoise T times, via ELBO → denoising matching → score</p></span></div></foreignObject></g></g><g class="node default k " id="d2aedc73d2066506b-flowchart-B-6" data-look="classic" transform="translate(158, 382.5)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>§B10–12</b> Flow Matching = choose ANY smooth path from noise to data</p></span></div></foreignObject></g></g><g class="node default  " id="d2aedc73d2066506b-flowchart-B13-8" data-look="classic" transform="translate(158, 471.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§B13–14</b> solve the ODE along that path → deterministic generation in fewer steps</p></span></div></foreignObject></g></g><g class="node default  " id="d2aedc73d2066506b-flowchart-B15-10" data-look="classic" transform="translate(158, 560.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§B15</b> diffusion is a special case of flow matching</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="d2aedc73d2066506b-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d2aedc73d2066506b-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="d2aedc73d2066506b-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4C4739" stop-opacity="1"></stop><stop offset="100%" stop-color="#4C4739" stop-opacity="1"></stop></linearGradient></svg>