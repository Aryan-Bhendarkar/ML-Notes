 marker-end="url(#dd5d079fef3df7456_flowchart-v2-pointEnd)"></path></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_G_Q_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_Q_ML_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_ML_DEC_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_DEC_EM_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_EM_CF_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="dd5d079fef3df7456-flowchart-G-0" data-look="classic" transform="translate(158, 37.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§3 GMM</b> · p(x) = Σₖ πₖ N(x; μₖ, Σₖ) — a universal density estimator</p></span></div></foreignObject></g></g><g class="node default  " id="dd5d079fef3df7456-flowchart-Q-2" data-look="classic" transform="translate(158, 126.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§4 Given data, how do we find θ = {πₖ, μₖ, Σₖ}?</b></p></span></div></foreignObject></g></g><g class="node default  " id="dd5d079fef3df7456-flowchart-ML-4" data-look="classic" transform="translate(158, 235)"><rect class="basic label-container" style="" x="-150" y="-49" width="300" height="98"></rect><g class="label" style="" transform="translate(-130, -39)"><rect></rect><foreignObject width="260" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Maximum likelihood</b> · maximise log p(X;θ) = Σᵢ log p(xᵢ;θ)<br/><small>the sum is inside a log of a sum over the latent z — intractable</small></p></span></div></foreignObject></g></g><g class="node default k " id="dd5d079fef3df7456-flowchart-DEC-6" data-look="classic" transform="translate(158, 363)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-49" width="300" height="98"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -39)"><rect></rect><foreignObject width="260" height="78"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>§5–6 introduce a stand-in q(z)</b> · log p(X;θ) = ELBO(q,θ) + KL(q(z) ‖ p(z|x))<br/><small>KL ≥ 0, so ELBO is always a lower bound on the true log-likelihood</small></p></span></div></foreignObject></g></g><g class="node default k " id="dd5d079fef3df7456-flowchart-EM-8" data-look="classic" transform="translate(158, 500.75)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-58.75" width="300" height="117.5"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -48.75)"><rect></rect><foreignObject width="260" height="97.5"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>§7 EM alternates two steps that each only ever help</b><br/><small>E-step: q(z) = p(z|x;θ) → KL = 0 → ELBO = true likelihood · M-step: maximise ELBO over θ, q fixed → likelihood can't decrease</small></p></span></div></foreignObject></g></g><g class="node default  " id="dd5d079fef3df7456-flowchart-CF-10" data-look="classic" transform="translate(158, 638.5)"><rect class="basic label-container" style="" x="-150" y="-49" width="300" height="98"></rect><g class="label" style="" transform="translate(-130, -39)"><rect></rect><foreignObject width="260" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§8 for GMMs: two closed-form updates</b><br/><small>E-step → γ(z_nk), the responsibilities (soft assignments) · M-step → μₖ, Σₖ, πₖ as responsibility-weighted averages</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="dd5d079fef3df7456-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="dd5d079fef3df7456-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="dd5d079fef3df7456-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4C4739" stop-opacity="1"></stop><stop offset="100%" stop-color="#4C4739" stop-opacity="1"></stop></linearGradient></svg>