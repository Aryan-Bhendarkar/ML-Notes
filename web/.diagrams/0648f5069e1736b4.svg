" data-points="W3sieCI6NDg4LCJ5Ijo0MjAuNX0seyJ4Ijo0ODgsInkiOjQzNS41fSx7IngiOjQ0Mi4zNzc4ODAxODQzMzE4LCJ5Ijo0NTAuNX1d" data-look="classic" marker-end="url(#d0648f5069e1736b4_flowchart-v2-pointEnd)"></path></g><g class="edgeLabels"><g class="edgeLabel" transform="translate(323, 150.25)"><g class="label" data-id="L_FLAW_SA_0" transform="translate(-100, -29.25)"><foreignObject width="200" height="58.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>attention (§6) fixes the bottleneck between two sequences, but the encoder is still an RNN</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_SA_SDP_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_SA_MH_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_SDP_T_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_MH_T_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="d0648f5069e1736b4-flowchart-FLAW-0" data-look="classic" transform="translate(323, 57)"><rect class="basic label-container" style="" x="-150" y="-49" width="300" height="98"></rect><g class="label" style="" transform="translate(-130, -39)"><rect></rect><foreignObject width="260" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>The RNN's two structural flaws (§3)</b> — sequential-only<br/><small>1. vanishing gradients over time · 2. no parallelism across tokens</small></p></span></div></foreignObject></g></g><g class="node default k " id="d0648f5069e1736b4-flowchart-SA-2" data-look="classic" transform="translate(323, 243.5)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-49" width="300" height="98"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -39)"><rect></rect><foreignObject width="260" height="78"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>Self-attention (§7)</b> — the same mechanism <i>within</i> one sequence<br/><small>fixes both flaws: O(1) path length (no chain) · fully parallel (no hₜ → hₜ₊₁)</small></p></span></div></foreignObject></g></g><g class="node default  " id="d0648f5069e1736b4-flowchart-SDP-4" data-look="classic" transform="translate(158, 371.5)"><rect class="basic label-container" style="" x="-150" y="-39.25" width="300" height="78.5"></rect><g class="label" style="" transform="translate(-130, -29.25)"><rect></rect><foreignObject width="260" height="58.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Scaled dot-product (§9)</b><br/><small>makes one attention computation numerically stable as d_k grows (÷√d_k keeps softmax's gradient alive)</small></p></span></div></foreignObject></g></g><g class="node default  " id="d0648f5069e1736b4-flowchart-MH-6" data-look="classic" transform="translate(488, 371.5)"><rect class="basic label-container" style="" x="-150" y="-49" width="300" height="98"></rect><g class="label" style="" transform="translate(-130, -39)"><rect></rect><foreignObject width="260" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Multi-head (§10)</b><br/><small>runs several attention computations in parallel, each free to specialise (positional / syntactic / coreference / semantic)</small></p></span></div></foreignObject></g></g><g class="node default  " id="d0648f5069e1736b4-flowchart-T-9" data-look="classic" transform="translate(323, 489.75)"><rect class="basic label-container" style="" x="-150" y="-39.25" width="300" height="78.5"></rect><g class="label" style="" transform="translate(-130, -29.25)"><rect></rect><foreignObject width="260" height="58.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>Part 3</b> — + positional encoding, layer norm, residual connections, feed-forward layers, masked attention → the full Transformer</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="d0648f5069e1736b4-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d0648f5069e1736b4-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="d0648f5069e1736b4-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4C4739" stop-opacity="1"></stop><stop offset="100%" stop-color="#4C4739" stop-opacity="1"></stop></linearGradient></svg>