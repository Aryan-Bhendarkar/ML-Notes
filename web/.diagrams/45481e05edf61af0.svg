 center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(158, 386.75)"><g class="label" data-id="L_VAE_GAN_0" transform="translate(-68.8984375, -9.75)"><foreignObject width="137.796875" height="19.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "><p>give up on p(x) entirely?</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="d45481e05edf61af0-flowchart-EM-0" data-look="classic" transform="translate(158, 37.5)"><rect class="basic label-container" style="" x="-150" y="-29.5" width="300" height="59"></rect><g class="label" style="" transform="translate(-130, -19.5)"><rect></rect><foreignObject width="260" height="39"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>GMM / EM (Part 2)</b> — discrete latent z · exact E-step via Bayes, exact M-step</p></span></div></foreignObject></g></g><g class="node default  " id="d45481e05edf61af0-flowchart-SA-2" data-look="classic" transform="translate(158, 155.75)"><rect class="basic label-container" style="" x="-150" y="-39.25" width="300" height="78.5"></rect><g class="label" style="" transform="translate(-130, -29.25)"><rect></rect><foreignObject width="260" height="58.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel "><p><b>§A same data, increasingly expressive p(x)</b> · K-Means → GMM → neural generative model</p></span></div></foreignObject></g></g><g class="node default k " id="d45481e05edf61af0-flowchart-VAE-4" data-look="classic" transform="translate(158, 293.5)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-68.5" width="300" height="137"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -58.5)"><rect></rect><foreignObject width="260" height="117"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>§B VAE — the honest route</b><br/><small>approximate the intractable posterior with a network q(z|x;φ) · maximise the same ELBO via reparameterisation + gradient descent<br/>explicit density: you get a lower bound on log p(x) you can score</small></p></span></div></foreignObject></g></g><g class="node default k " id="d45481e05edf61af0-flowchart-GAN-6" data-look="classic" transform="translate(158, 480)"><rect class="basic label-container" style="fill:#1E3025 !important;stroke:#4FA073 !important" x="-150" y="-68.5" width="300" height="137"></rect><g class="label" style="color:#EDE6D7 !important" transform="translate(-130, -58.5)"><rect></rect><foreignObject width="260" height="117"><div style="color: rgb(237, 230, 215) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#EDE6D7 !important" class="nodeLabel "><p><b>§C GAN — the implicit route</b><br/><small>sample from p(x) without ever writing it down · a discriminator estimates a divergence, the generator minimises it<br/>no explicit density: you cannot score a sample, only generate one</small></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="d45481e05edf61af0-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d45481e05edf61af0-drop-shadow-small" height=